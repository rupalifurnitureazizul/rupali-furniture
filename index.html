        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <BarChart data={stats.monthlyOrders.map(m=>({label:m.label,value:m.count,color:RED}))} formatY={v=>v}/>
        </div>
      </div>

      {/* Revenue vs Expense */}
      <div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>💰 আয় বনাম খরচ (৬ মাস)</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <DualBarChart data={stats.monthlyOrders.map((m,i)=>({label:m.label,a:stats.monthlyExpense[i]?.value||0,b:m.revenue}))}/>
          <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:2,fontSize:9,color:"#888"}}>
            <span>ধূসর = খরচ</span><span>লাল = আয়</span>
          </div>
        </div>
      </div>

      {/* Year over Year */}
      <div style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📈 বছর অনুযায়ী তুলনা (একই মাস)</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <DualBarChart data={stats.yoy}/>
        </div>
      </div>

      {/* Yearly totals */}
      {stats.yearly&&stats.yearly.length>1&&<>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📅 বাৎসরিক মোট অর্ডার সংখ্যা</div>
          <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
            <BarChart data={stats.yearly.map(y=>({label:y.label,value:y.count,color:"#1d4ed8"}))} formatY={v=>v}/>
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📅 বাৎসরিক মোট মূল্য</div>
          <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
            <BarChart data={stats.yearly.map(y=>({label:y.label,value:y.revenue,color:"#166534"}))} formatY={v=>money(v)}/>
          </div>
        </div>
      </>}

      {/* Best month comparison */}
      {stats.bestMonthCompare&&stats.bestMonthCompare.bestCount>0&&<div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>🏅 সর্বোচ্চ অর্ডারের মাস — বনাম এই বছর</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"14px"}}>
          <div style={{fontSize:12,color:"#666",marginBottom:10,textAlign:"center"}}>
            <strong>{stats.bestMonthCompare.monthLabel}</strong> মাসে সর্বোচ্চ অর্ডার হয়েছিল <strong>{stats.bestMonthCompare.bestYear}</strong> সালে
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div style={{background:"#f8fafc",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>{stats.bestMonthCompare.bestYear} ({stats.bestMonthCompare.monthLabel})</div>
              <div style={{fontSize:20,fontWeight:800,color:"#94a3b8"}}>{stats.bestMonthCompare.bestCount} অর্ডার</div>
              <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{money(stats.bestMonthCompare.bestRevenue)}</div>
            </div>
            <div style={{background:"#fff0f0",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>{stats.bestMonthCompare.thisYear} ({stats.bestMonthCompare.monthLabel})</div>
              <div style={{fontSize:20,fontWeight:800,color:RED}}>{stats.bestMonthCompare.thisCount} অর্ডার</div>
              <div style={{fontSize:11,color:RED,marginTop:2}}>{money(stats.bestMonthCompare.thisRevenue)}</div>
            </div>
          </div>
          <DualBarChart data={[{label:stats.bestMonthCompare.monthLabel,a:stats.bestMonthCompare.bestCount,b:stats.bestMonthCompare.thisCount}]} labelA={`${stats.bestMonthCompare.bestYear} (সর্বোচ্চ)`} labelB={`${stats.bestMonthCompare.thisYear}`}/>
          <div style={{fontSize:11,fontWeight:700,color:"#444",marginTop:14,marginBottom:6,textAlign:"center"}}>মোট মূল্যের তুলনা</div>
          <DualBarChart data={[{label:stats.bestMonthCompare.monthLabel,a:stats.bestMonthCompare.bestRevenue,b:stats.bestMonthCompare.thisRevenue}]} labelA={`${stats.bestMonthCompare.bestYear} (সর্বোচ্চ)`} labelB={`${stats.bestMonthCompare.thisYear}`}/>
        </div>
      </div>}

      {/* Full-resolution image folder (desktop only) */}
      {folderStatus.supported&&<div style={{marginTop:16,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:6}}>🖥️ ফুল রেজোলিউশন ছবি ফোল্ডার (এই কম্পিউটার)</div>
        {folderStatus.connected?<div style={{fontSize:11,color:"#166534",fontWeight:600,marginBottom:6}}>✅ সংযুক্ত: {folderStatus.name}</div>:<div style={{fontSize:11,color:"#991b1b",marginBottom:6}}>⚠️ ফোল্ডার সংযুক্ত নয় — ছবি শুধু কম্প্রেসড ভার্সনে সেভ হবে</div>}
        <div style={{fontSize:10,color:"#78350f",marginBottom:8,lineHeight:1.5}}>এখানে একটা ফোল্ডার সেট করুন — অর্ডারে যেকোনো ছবি যুক্ত করলে তার আসল (ফুল রেজোলিউশন) কপি এই ফোল্ডারে সেভ হবে, যা পরে প্রিন্ট করে মিস্ত্রিকে দিতে পারবেন। এই ফোল্ডার নিয়মিত অন্য জায়গায় ব্যাকআপ রাখুন।</div>
        <button onClick={connectFolder} style={{width:"100%",background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"9px",fontSize:12,fontWeight:700}}>{folderStatus.connected?"ভিন্ন ফোল্ডার বেছে নিন":"ফোল্ডার নির্বাচন করুন"}</button>
      </div>}

      {/* Automatic sync status */}
      <div style={{marginTop:10,paddingTop:16,borderTop:"1px solid #eee",textAlign:"center"}}>
        {connError?<div style={{background:"#fef2f2",color:"#991b1b",borderRadius:9,padding:"9px 12px",fontSize:11,marginBottom:8}}>⚠️ সিঙ্ক সমস্যা: {connError}</div>:
        <div style={{display:"inline-flex",alignItems:"center",gap:6,background:online?"#f0fdf4":"#fffbeb",color:online?"#166534":"#92400e",borderRadius:20,padding:"6px 14px",fontSize:11,fontWeight:700,marginBottom:8}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:online?"#16a34a":"#f59e0b",display:"inline-block"}}></span>
          {online?"স্বয়ংক্রিয় সিঙ্ক সক্রিয় — সব ডিভাইসে আপডেট হচ্ছে":"অফলাইন — ইন্টারনেট এলে সিঙ্ক হবে"}
        </div>}
        <div><button onClick={onResetConfig} style={{background:"none",border:"none",color:"#aaa",fontSize:10,textDecoration:"underline",cursor:"pointer"}}>Firebase সংযোগ পরিবর্তন করুন</button></div>
      </div>
    </div>
  </div>
}

/* ── EXPENSE PAGE ── */
function ExpensePage({expenses,onSave,onBack}){
  const today=todayStr();
  const[form,setForm]=useState({date:today,category:"hardware",itemName:"",qty:"",unit:"cft",rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"11px 12px",fontSize:14,outline:"none"};
  const lbl=(t)=><div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:5}}>{t}</div>;

  const lastRate=useMemo(()=>{
    const matches=expenses.filter(e=>e.category===form.category&&e.itemName.trim().toLowerCase()===form.itemName.trim().toLowerCase());
    if(matches.length===0)return null;
    return matches.sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  },[expenses,form.category,form.itemName]);

  // Supplier ranking by total spend in last 1 year
  const supplierList=useMemo(()=>{
    const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const map={};
    expenses.forEach(e=>{
      if(!e.supplier)return;
      const key=e.supplier.trim();
      if(!map[key])map[key]={name:key,phone:e.supplierPhone||"",total:0,recentDate:e.date};
      if(new Date(e.date)>=oneYearAgo)map[key].total+=(parseFloat(e.total)||0);
      if(new Date(e.date)>new Date(map[key].recentDate)){map[key].recentDate=e.date;if(e.supplierPhone)map[key].phone=e.supplierPhone;}
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[expenses]);

  const onSupplierNameChange=(val)=>{
    const match=supplierList.find(s=>s.name.toLowerCase()===val.trim().toLowerCase());
    setForm({...form,supplier:val,supplierPhone:match?match.phone:form.supplierPhone});
  };

  const total=(parseFloat(form.qty)||0)*(parseFloat(form.rate)||0);

  const submit=()=>{
    if(!form.itemName||!form.qty||!form.rate)return;
    onSave({...form,total,at:new Date().toISOString()});
    setForm({date:today,category:form.category,itemName:"",qty:"",unit:form.unit,rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  };

  const recentExpenses=[...expenses].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#0f766e",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>খরচ এন্ট্রি</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:560,margin:"0 auto"}}>
      <div style={{background:"white",borderRadius:14,padding:"18px",boxShadow:"0 2px 10px rgba(0,0,0,.07)",marginBottom:18}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("তারিখ")}<DateInput value={form.date} onChange={v=>setForm({...form,date:v})} accent="#0f766e"/></div>
          <div>{lbl("ক্যাটাগরি")}
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={inp}>
              {EXP_CATS.map(c=><option key={c.id} value={c.id}>{c.bn}</option>)}
            </select>
          </div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পণ্য/আইটেমের নাম *")}<input value={form.itemName} onChange={e=>setForm({...form,itemName:e.target.value})} placeholder="যেমন: কাঠের স্ক্রু, লেকার স্প্রে" style={inp}/></div>
        {lastRate&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"9px 12px",marginBottom:14,fontSize:12,color:"#92400e"}}>
          📌 গত রেট: <strong>{money(lastRate.rate)}</strong>/{lastRate.unit} ({fmtDate(lastRate.date)} তারিখে, {lastRate.supplier||"সাপ্লায়ার উল্লেখ নেই"})
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
          <div>{lbl("পরিমাণ *")}<input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="0" style={inp}/></div>
          <div>{lbl("একক")}<select value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} style={inp}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
          <div>{lbl("রেট (৳) *")}<input type="number" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} placeholder="0" style={inp}/></div>
        </div>
        <div style={{background:"#f0fdf4",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#555"}}>মোট মূল্য:</span>
          <span style={{fontSize:20,fontWeight:800,color:"#166534"}}>{money(total)}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("সাপ্লায়ার/বিক্রেতা")}
            <input list="supplier-list" value={form.supplier} onChange={e=>onSupplierNameChange(e.target.value)} placeholder="নাম লিখুন বা তালিকা থেকে বেছে নিন" style={inp}/>
            <datalist id="supplier-list">{supplierList.map(s=><option key={s.name} value={s.name}/>)}</datalist>
          </div>
          <div>{lbl("বিক্রেতার ফোন")}<input value={form.supplierPhone} onChange={e=>setForm({...form,supplierPhone:e.target.value})} placeholder="01XXXXXXXXX" style={inp}/></div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পেমেন্ট মাধ্যম")}<select value={form.payMethod} onChange={e=>setForm({...form,payMethod:e.target.value})} style={inp}><option>নগদ</option><option>বাকি</option><option>ব্যাংক</option></select></div>
        <div style={{marginBottom:16}}>{lbl("নোট")}<textarea rows={2} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={submit} style={{width:"100%",background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"15px",fontSize:15,fontWeight:700}}>খরচ সংরক্ষণ করুন</button>
      </div>

      <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>সাম্প্রতিক খরচ</div>
      {recentExpenses.length===0?<div style={{textAlign:"center",color:"#aaa",padding:20,fontSize:13}}>কোনো খরচ এন্ট্রি নেই</div>:
      recentExpenses.map((e,i)=>{
        const cat=EXP_CATS.find(c=>c.id===e.category);
        return<div key={i} style={{background:"white",borderRadius:10,padding:"11px 13px",marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between"}}>
          <div><div style={{fontWeight:700,fontSize:13}}>{e.itemName}</div><div style={{fontSize:11,color:"#888",marginTop:1}}>{cat?.bn} | {e.qty} {e.unit} × {money(e.rate)} | {e.supplier||"—"}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:"#0f766e"}}>{money(e.total)}</div><div style={{fontSize:10,color:"#aaa"}}>{fmtDate(e.date)}</div></div>
        </div>
      })}
    </div>
  </div>
}

/* ── WOOD STOCK PAGE ── */
function WoodStockPage({woodLots,saveWoodLots,woodSettings,saveWoodSettings,laborSettings,saveLaborSettings,payrollWeeks,workers,orders,onBack,view,lotId,onOpenList,onOpenDetail,onOpenNew,onOpenRates,highlightNo}){
  const today=todayStr();
  const setView=(v)=>{if(v==="list")onOpenList();else if(v==="new")onOpenNew();else if(v==="rates")onOpenRates()}; // পুরনো কল-সাইটের সাথে সামঞ্জস্যের জন্য
  const setSelLotId=(id)=>onOpenDetail(id);
  const selLotId=lotId;
  const[newLot,setNewLot]=useState({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  const[newLog,setNewLog]=useState({lengthFt:"",diameterIn:""});
  const[newPay,setNewPay]=useState({date:today,amount:""});
  const[sellingLogId,setSellingLogId]=useState(null);
  const[sellPrice,setSellPrice]=useState("");
  const[newMilling,setNewMilling]=useState({date:today,cft:"",billAmount:"",note:""});
  const[rateDraft,setRateDraft]=useState({});
  const[laborRateDraft,setLaborRateDraft]=useState({from:"",rate:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const selLot=woodLots.find(l=>l.id===selLotId);
  const wSettings=(woodType)=>(woodSettings&&woodSettings[woodType])||{wastagePercent:0,finalAvgRate:0};


  const createLot=()=>{
    if(!newLot.supplier)return;
    const lot={id:"lot_"+Date.now(),...newLot,logs:[],payments:[],millingEntries:[],transportCost:0,otherCost:0};
    saveWoodLots([lot,...woodLots]);
    onOpenDetail(lot.id);
    setNewLot({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  };

  const updateLot=(updated)=>{
    saveWoodLots(woodLots.map(l=>l.id===updated.id?updated:l));
  };

  const addLog=()=>{
    const lengthFt=parseFloat(newLog.lengthFt),diameterIn=parseFloat(newLog.diameterIn);
    if(!lengthFt||!diameterIn)return;
    const cftVal=cftLog(lengthFt,diameterIn);
    const log={id:"log_"+Date.now(),lengthFt,diameterIn,cft:cftVal,cut:false,cutDate:"",sold:false,soldDate:"",soldPrice:0};
    updateLot({...selLot,logs:[...selLot.logs,log]});
    setNewLog({lengthFt:"",diameterIn:""});
  };
  const removeLog=(logId,logLabel)=>{
    if(!window.confirm(`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি একেবারে মুছে ফেলতে চান? এটি ফিরিয়ে আনা যাবে না।`))return;
    updateLot({...selLot,logs:selLot.logs.filter(l=>l.id!==logId)});
  };
  const toggleCut=(logId,logLabel,currentlyCut)=>{
    const msg=currentlyCut?`"${logLabel}" এই গুড়ির কাটা চিহ্ন বাতিল করতে চান?`:`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি কাটা হয়েছে বলে চিহ্নিত করতে চান?`;
    if(!window.confirm(msg))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,cut:!l.cut,cutDate:!l.cut?today:""}:l);
    updateLot({...selLot,logs});
  };
  const startSell=(logId)=>{setSellingLogId(logId);setSellPrice("")};
  const confirmSell=(logId)=>{
    const price=parseFloat(sellPrice);
    if(!price||price<=0)return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:true,soldDate:today,soldPrice:price}:l);
    updateLot({...selLot,logs});
    setSellingLogId(null);setSellPrice("");
  };
  const unsellLog=(logId,logLabel)=>{
    if(!window.confirm(`"${logLabel}" এই গুড়ির বিক্রি বাতিল করতে চান?`))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:false,soldDate:"",soldPrice:0}:l);
    updateLot({...selLot,logs});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    updateLot({...selLot,payments:[...(selLot.payments||[]),newPay]});
    setNewPay({date:today,amount:""});
  };
  const deleteLot=(lotId)=>{
    if(window.confirm("এই লটটি মুছে ফেলতে চান?")){
      saveWoodLots(woodLots.filter(l=>l.id!==lotId));
      onOpenList();
    }
  };

  const lotTotalCft=(lot)=>lot.logs.reduce((s,l)=>s+l.cft,0);
  const lotTotalCost=(lot)=>lotTotalCft(lot)*(parseFloat(lot.ratePerCft)||0);
  const lotTotalPaid=(lot)=>(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const lotRemaining=(lot)=>lotTotalCost(lot)-lotTotalPaid(lot);
  const lotSoldCft=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+l.cft,0);
  const lotSoldAmount=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+(parseFloat(l.soldPrice)||0),0);
  const lotCutCft=(lot)=>lot.logs.filter(l=>l.cut&&!l.sold).reduce((s,l)=>s+l.cft,0);
  const lotAvailableCft=(lot)=>lot.logs.filter(l=>!l.sold&&!l.cut).reduce((s,l)=>s+l.cft,0);
  const lotCurrentStockPricePerCft=(lot)=>{
    const availCft=lotAvailableCft(lot);
    if(availCft<=0)return 0;
    const cutCost=lotCutCft(lot)*(parseFloat(lot.ratePerCft)||0);
    const adjustedCost=lotTotalCost(lot)-lotSoldAmount(lot)-cutCost;
    return adjustedCost/availCft;
  };

  // ── কাটাই/মিলিং সংক্রান্ত হিসাব ──
  const lotMillingTotal=(lot)=>(lot.millingEntries||[]).reduce((s,m)=>s+(parseFloat(m.billAmount)||0),0);
  const lotUsableCft=(lot)=>{
    const raw=lotCutCft(lot);
    const wastage=wSettings(lot.woodType).wastagePercent||0;
    return raw*(1-wastage/100);
  };
  const lotRealCostPerCft=(lot)=>{
    const raw=lotCutCft(lot);
    const usable=lotUsableCft(lot);
    if(raw<=0||usable<=0)return 0;
    const totalLotCft=lotTotalCft(lot);
    const proportionalPurchase=totalLotCft>0?(raw/totalLotCft)*lotTotalCost(lot):0;
    const extra=lotMillingTotal(lot)+(parseFloat(lot.transportCost)||0)+(parseFloat(lot.otherCost)||0);
    return(proportionalPurchase+extra)/usable;
  };
  const cftCutOnDate=(lot,date)=>lot.logs.filter(l=>l.cut&&!l.sold&&l.cutDate===date).reduce((s,l)=>s+l.cft,0);
  const addMillingEntry=()=>{
    const bill=parseFloat(newMilling.billAmount);
    if(!bill||bill<=0)return;
    const entry={id:"mill_"+Date.now(),date:newMilling.date,cft:parseFloat(newMilling.cft)||0,billAmount:bill,note:newMilling.note};
    updateLot({...selLot,millingEntries:[...(selLot.millingEntries||[]),entry]});
    setNewMilling({date:today,cft:"",billAmount:"",note:""});
  };
  const removeMillingEntry=(entryId)=>{
    updateLot({...selLot,millingEntries:(selLot.millingEntries||[]).filter(m=>m.id!==entryId)});
  };

  // ── কাঠের ধরন অনুযায়ী প্রস্তাবিত গড় দাম (সব লট মিলিয়ে ওয়েটেড এভারেজ) ──
  const suggestedRate=(woodType)=>{
    const relevant=woodLots.filter(l=>l.woodType===woodType&&lotUsableCft(l)>0);
    const totalUsable=relevant.reduce((s,l)=>s+lotUsableCft(l),0);
    if(totalUsable<=0)return 0;
    const weightedSum=relevant.reduce((s,l)=>s+lotRealCostPerCft(l)*lotUsableCft(l),0);
    return weightedSum/totalUsable;
  };

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#065f46",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>{view==="list"?"কাঠের স্টক":view==="new"?"নতুন লট":view==="rates"?"গড় দাম নির্ধারণ":selLot?.supplier}</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:600,margin:"0 auto"}}>

      {view==="list"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
          <button onClick={()=>setView("new")} style={{background:"#065f46",color:"white",border:"none",borderRadius:12,padding:"15px 8px",fontSize:13,fontWeight:700}}>+ নতুন লট কিনুন</button>
          <button onClick={()=>setView("rates")} style={{background:"white",color:"#065f46",border:"2px solid #065f46",borderRadius:12,padding:"13px 8px",fontSize:12,fontWeight:700}}>🧮 কাঠের গড় দাম নির্ধারণ</button>
        </div>
        {woodLots.length===0?<div style={{textAlign:"center",color:"#aaa",padding:30,fontSize:13}}>এখনো কোনো লট যোগ করা হয়নি</div>:
        woodLots.map(lot=>{
          const tCft=lotTotalCft(lot),tCost=lotTotalCost(lot),paid=lotTotalPaid(lot),rem=lotRemaining(lot);
          const uncut=lot.logs.filter(l=>!l.cut).length;
          const isHighlighted=highlightNo==="lot:"+lot.id;
          return<div key={lot.id} onClick={()=>onOpenDetail(lot.id)} style={{background:isHighlighted?"#e0f2fe":"white",borderRadius:11,padding:"13px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.08)",borderLeft:`4px solid ${isHighlighted?"#0ea5e9":"#065f46"}`,cursor:"pointer",transition:"background .4s"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{WOOD[lot.woodType].bn} — {lot.supplier}</div>
                <div style={{fontSize:11,color:"#888",marginTop:2}}>{fmtDate(lot.date)} | {lot.logs.length} গুড়ি ({uncut} বাকি) | {tCft.toFixed(2)} CFT</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:700,color:"#065f46"}}>{money(tCost)}</div>
                <div style={{fontSize:10,color:rem>0?RED:"#16a34a",fontWeight:600}}>{rem>0?`বাকি ${money(rem)}`:"✅ পরিশোধিত"}</div>
              </div>
            </div>
          </div>
        })}
      </>}

      {view==="rates"&&<div>
        {(()=>{
          // ── প্রস্তাবিত শ্রম হার: সর্বমোট পে-রোল ব্যয় ÷ সর্বমোট ডেলিভারিকৃত CFT ──
          let totalPayrollAllTime=0;
          Object.values(payrollWeeks||{}).forEach(wd=>{
            Object.entries(wd.attendance||{}).forEach(([wid,d])=>{
              const w=(workers||[]).find(w=>w.id===wid);
              if(w)totalPayrollAllTime+=(parseFloat(d)||0)*(parseFloat(w.dailyRate)||0);
            });
          });
          const deliveredCftAllTime=(orders||[]).filter(o=>!o.cancelled&&o.delivered).reduce((s,o)=>s+orderTotalCft(o),0);
          const suggestedLabour=deliveredCftAllTime>0?totalPayrollAllTime/deliveredCftAllTime:0;
          const ls=laborSettings||{};
          return<div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)",border:"1.5px solid #ddd6fe"}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:6,color:"#6d28d9"}}>👷 শ্রম খরচ/CFT</div>
            <div style={{fontSize:11,color:"#888",lineHeight:1.6,marginBottom:10}}>কাঠের মতোই — প্রতিটা ফার্নিচারের CFT অনুযায়ী শ্রম খরচ হিসাব হবে। কর্মী কোন অর্ডারে কতদিন দিলো আলাদা করে লিখতে হবে না; আপনার মোট পে-রোল ও মোট ডেলিভারিকৃত কাজ থেকে সিস্টেম একটা হার প্রস্তাব করবে।</div>
            <div style={{marginBottom:10}}>{lbl("চূড়ান্ত শ্রম হার (৳/CFT)")}<input type="number" value={ls.ratePerCft||""} onChange={e=>saveLaborSettings({...ls,ratePerCft:parseFloat(e.target.value)||0})} placeholder="0" style={{...inp,fontWeight:700,color:"#6d28d9"}}/></div>
            <div style={{background:suggestedLabour>0?"#faf5ff":"#f8fafc",borderRadius:8,padding:"8px 11px",fontSize:11,color:suggestedLabour>0?"#6d28d9":"#999",marginBottom:10}}>
              {suggestedLabour>0?<>📊 প্রস্তাবিত হার (সর্বমোট পে-রোল ÷ সর্বমোট ডেলিভারিকৃত CFT): <strong>{money(suggestedLabour.toFixed(2))}/CFT</strong></>:"এখনো কোনো অর্ডার ডেলিভারি হয়নি — প্রস্তাব দেখানো যাচ্ছে না"}
            </div>
            <div style={{background:"#fffbeb",borderRadius:8,padding:"9px 11px",border:"1px solid #fde68a"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:3}}>📅 তারিখভিত্তিক হারের ইতিহাস</div>
              <div style={{fontSize:9,color:"#a16207",marginBottom:8,lineHeight:1.5}}>মজুরি সময়ের সাথে বাড়ে — তাই পুরনো অর্ডারে সেই সময়ের হার ব্যবহার হবে, আজকের হার নয়।</div>
              {(ls.rateHistory||[]).sort((a,b)=>(a.from||"").localeCompare(b.from||"")).map((h,hi)=><div key={hi} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:10}}>
                <span style={{flex:1,color:"#555"}}>{h.from?fmtDate(h.from):"—"} থেকে</span>
                <strong style={{color:"#92400e"}}>{money(h.rate)}/CFT</strong>
                <button onClick={()=>{const nh=(ls.rateHistory||[]).filter((_,j)=>j!==hi);saveLaborSettings({...ls,rateHistory:nh})}} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",color:RED,fontSize:9}}>✕</button>
              </div>)}
              <div style={{display:"flex",gap:5,marginTop:7,alignItems:"flex-end"}}>
                <div style={{flex:1.3}}><div style={{fontSize:8,color:"#a16207",marginBottom:2}}>কোন তারিখ থেকে</div><DateInput value={laborRateDraft.from||""} onChange={v=>setLaborRateDraft({...laborRateDraft,from:v})} accent="#92400e"/></div>
                <div style={{flex:1}}><div style={{fontSize:8,color:"#a16207",marginBottom:2}}>হার/CFT</div><input type="number" value={laborRateDraft.rate||""} onChange={e=>setLaborRateDraft({...laborRateDraft,rate:e.target.value})} placeholder="0" style={{width:"100%",border:"1.5px solid #fde68a",borderRadius:8,padding:"9px 8px",fontSize:12,fontWeight:700,color:"#92400e",boxSizing:"border-box"}}/></div>
                <button onClick={()=>{
                  if(!laborRateDraft.from||!parseFloat(laborRateDraft.rate))return;
                  const nh=[...(ls.rateHistory||[]),{from:laborRateDraft.from,rate:parseFloat(laborRateDraft.rate)}];
                  saveLaborSettings({...ls,rateHistory:nh});
                  setLaborRateDraft({from:"",rate:""});
                }} style={{background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"10px 12px",fontSize:11,fontWeight:700,flexShrink:0}}>+ যোগ</button>
              </div>
            </div>
          </div>
        })()}
        <div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:6,color:"#065f46"}}>কাঠভেদে অপচয় হার ও চূড়ান্ত গড় দাম</div>
          <div style={{fontSize:11,color:"#888",lineHeight:1.6}}>গুড়ি কেনার পর স'মিলে কেটে ব্যবহারযোগ্য কাঠ কতটা কমে যায় (%) বসান। সিস্টেম আপনার লটগুলোর প্রকৃত খরচ থেকে একটা প্রস্তাবিত গড় দাম দেখাবে — সেটা দেখে চূড়ান্ত দামটা বসিয়ে দিন। এই চূড়ান্ত দামই সব অর্ডারের কাঠের খরচ হিসাবে ব্যবহার হবে।</div>
        </div>
        {Object.entries(WOOD).map(([wKey,wInfo])=>{
          const s=wSettings(wKey);
          const suggested=suggestedRate(wKey);
          return<div key={wKey} style={{background:"white",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:"#111"}}>{wInfo.bn} <span style={{fontSize:11,color:"#999",fontWeight:400}}>({wInfo.en})</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>{lbl("অপচয় হার (%)")}<input type="number" min="0" max="90" value={s.wastagePercent||""} onChange={e=>saveWoodSettings({...woodSettings,[wKey]:{...s,wastagePercent:parseFloat(e.target.value)||0}})} placeholder="0" style={inp}/></div>
              <div>{lbl("চূড়ান্ত গড় দাম (৳/CFT)")}<input type="number" value={s.finalAvgRate||""} onChange={e=>saveWoodSettings({...woodSettings,[wKey]:{...s,finalAvgRate:parseFloat(e.target.value)||0}})} placeholder="0" style={{...inp,fontWeight:700,color:"#065f46"}}/></div>
            </div>
            <div style={{background:suggested>0?"#f0fdf4":"#f8fafc",borderRadius:8,padding:"8px 11px",fontSize:11,color:suggested>0?"#166534":"#999",marginBottom:10}}>
              {suggested>0?<>📊 প্রস্তাবিত গড় দাম (আপনার কাটা লটগুলো থেকে): <strong>{money(suggested.toFixed(2))}/CFT</strong></>:"এখনো কোনো লটে যথেষ্ট কাটা কাঠ নেই — প্রস্তাব দেখানো যাচ্ছে না"}
            </div>
            <div style={{background:"#fffbeb",borderRadius:8,padding:"9px 11px",border:"1px solid #fde68a"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:3}}>📅 তারিখভিত্তিক দামের ইতিহাস</div>
              <div style={{fontSize:9,color:"#a16207",marginBottom:8,lineHeight:1.5}}>পুরনো অর্ডারে সেই সময়ের দাম ব্যবহার হবে, আজকের দাম নয় — তাই পুরনো অর্ডারে ভুয়া ক্ষতি দেখাবে না।</div>

                <button onClick={()=>{const nh=(s.rateHistory||[]).filter((_,j)=>j!==hi);saveWoodSettings({...woodSettings,[wKey]:{...s,rateHistory:nh}})}} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",color:RED,fontSize:9}}>✕</button>

                <div style={{flex:1}}><div style={{fontSize:8,color:"#a16207",marginBottom:2}}>দাম/CFT</div><input type="number" value={(rateDraft[wKey]||{}).rate||""} onChange={e=>setRateDraft({...rateDraft,[wKey]:{...(rateDraft[wKey]||{}),rate:e.target.value}})} placeholder="0" style={{width:"100%",border:"1.5px solid #fde68a",borderRadius:8,padding:"9px 8px",fontSize:12,fontWeight:700,color:"#92400e",boxSizing:"border-box"}}/></div>

                  const nh=[...(s.rateHistory||[]),{from:d.from,rate:parseFloat(d.rate)}];
                  saveWoodSettings({...woodSettings,[wKey]:{...s,rateHistory:nh}});
                  setRateDraft({...rateDraft,[wKey]:{from:"",rate:""}});
                }} style={{background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"10px 12px",fontSize:11,fontWeight:700,flexShrink:0}}>+ যোগ</button>
              </div>
            </div>
          </div>

        <button onClick={()=>setView("list")} style={{width:"100%",background:"#f3f4f6",border:"none",borderRadius:10,padding:"12px",fontSize:13,fontWeight:600,marginTop:4}}>← তালিকায় ফিরে যান</button>

      {view==="new"&&<div style={{background:"white",borderRadius:13,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>নতুন কাঠের লট</div>

        </select>
        {lbl("ক্রয়ের তারিখ")}<div style={{marginBottom:10}}><DateInput value={newLot.date} onChange={v=>setNewLot({...newLot,date:v})} accent="#065f46"/></div>
        {lbl("বিক্রেতার নাম *")}<input value={newLot.supplier} onChange={e=>setNewLot({...newLot,supplier:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ফোন")}<input value={newLot.supplierPhone} onChange={e=>setNewLot({...newLot,supplierPhone:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ঠিকানা")}<input value={newLot.supplierAddress} onChange={e=>setNewLot({...newLot,supplierAddress:e.target.value})} style={{...inp,marginBottom:14}}/>

          <button onClick={()=>setView("list")} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"12px",fontSize:13}}>বাতিল</button>

        </div>
      </div>}

      {view==="detail"&&selLot&&<>
        <div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 14px",marginBottom:8}}>
            <IR l="কাঠের ধরন" v={WOOD[selLot.woodType].bn}/><IR l="তারিখ" v={fmtDate(selLot.date)}/>
            <IR l="বিক্রেতা" v={selLot.supplier}/><IR l="ফোন" v={selLot.supplierPhone}/>
          </div>
          <IR l="ঠিকানা" v={selLot.supplierAddress}/>
          <button onClick={()=>deleteLot(selLot.id)} style={{background:"#fee2e2",border:"none",borderRadius:7,padding:"6px 12px",color:RED,fontSize:11,fontWeight:600,marginTop:8}}>🗑 লট মুছে ফেলুন</button>

        {/* Logs list */}
        <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>গুড়ির তালিকা ({selLot.logs.length})</div>

            const label=`#${i+1} — ${log.lengthFt}ft × ${log.diameterIn}″`;
            const stateColor=log.sold?"#7c3aed":log.cut?"#94a3b8":"#065f46";
            return<div key={log.id} style={{padding:"10px 12px",borderBottom:i<selLot.logs.length-1?"1px solid #f2f2f2":"none",background:log.sold?"#f5f3ff":log.cut?"#fafafa":"white"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:"1 1 auto",minWidth:140,color:(log.cut||log.sold)?"#999":"#222",textDecoration:(log.cut||log.sold)?"line-through":"none"}}>

                <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>

          {(selLot.millingEntries||[]).length>0&&<div style={{marginBottom:10}}>
            {(selLot.millingEntries||[]).map(m=><div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:11,padding:"7px 0",borderBottom:"1px dashed #eee"}}>
              <span>{fmtDate(m.date)} — {m.cft?`${m.cft} CFT`:""}{m.note?` (${m.note})`:""}</span>
              <span style={{display:"flex",alignItems:"center",gap:6}}><strong>{money(m.billAmount)}</strong><button onClick={()=>removeMillingEntry(m.id)} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",color:RED,fontSize:10}}>✕</button></span>

            <div>{lbl("CFT")}<input type="number" step="0.1" value={newMilling.cft} onChange={e=>setNewMilling({...newMilling,cft:e.target.value})} placeholder="0" style={inp}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div>{lbl("মোট বিল (৳)")}<input type="number" value={newMilling.billAmount} onChange={e=>setNewMilling({...newMilling,billAmount:e.target.value})} placeholder="0" style={inp}/></div>
            <div>{lbl("নোট (ঐচ্ছিক)")}<input value={newMilling.note} onChange={e=>setNewMilling({...newMilling,note:e.target.value})} placeholder="ট্রলি/চা-পানি ইত্যাদি" style={inp}/></div>
          </div>
          <button onClick={addMillingEntry} style={{width:"100%",background:"#065f46",color:"white",border:"none",borderRadius:9,padding:"11px",fontSize:13,fontWeight:700}}>+ কাটাই বিল যোগ করুন</button>

            <div>{lbl("পরিবহন খরচ (৳)")}<input type="number" value={selLot.transportCost||""} onChange={e=>updateLot({...selLot,transportCost:e.target.value})} placeholder="0" style={inp}/></div>
            <div>{lbl("অন্যান্য খরচ (৳)")}<input type="number" value={selLot.otherCost||""} onChange={e=>updateLot({...selLot,otherCost:e.target.value})} placeholder="0" style={inp}/></div>

        </div>

          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>প্রকৃত খরচ/CFT (অপচয় ও যাবতীয় খরচ ধরে)</div>
          {(()=>{
            const wt=selLot.woodType;
            const s=wSettings(wt);
            const raw=lotCutCft(selLot);
            const usable=lotUsableCft(selLot);
            const real=lotRealCostPerCft(selLot);
            if(raw<=0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:10}}>এখনো কোনো গুড়ি কাটা হয়নি — কাটা শুরু হলে এখানে প্রকৃত খরচ দেখাবে</div>;
            return<div style={{background:"#f0fdf4",borderRadius:9,padding:"11px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span>কাটা হয়েছে (কাঁচা):</span><span style={{fontWeight:700}}>{raw.toFixed(2)} CFT</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span>অপচয় হার ({wt&&WOOD[wt].bn}):</span><span style={{fontWeight:700}}>{s.wastagePercent||0}%</span></div>

              <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:800,color:"#166534",borderTop:"1.5px solid #bbf7d0",paddingTop:8}}><span>প্রকৃত খরচ/CFT:</span><span>{money(real.toFixed(2))}</span></div>
            </div>
          })()}
        </div>

        {/* Buy / Sell / Current stock value summary */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div style={{background:"#f8fafc",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>ক্রয় মূল্য (মোট)</div>
              <div style={{fontSize:15,fontWeight:800,color:"#334155"}}>{money(lotTotalCost(selLot))}</div>

            <div style={{background:"#f5f3ff",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>বিক্রিত পরিমাণ</div>
              <div style={{fontSize:15,fontWeight:800,color:"#7c3aed"}}>{money(lotSoldAmount(selLot))}</div>
              <div style={{fontSize:9,color:"#888",marginTop:1}}>{lotSoldCft(selLot).toFixed(2)} CFT বিক্রি হয়েছে</div>
            </div>
          </div>
          <div style={{background:"#f0fdf4",borderRadius:9,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:10,color:"#888"}}>বর্তমান মজুদের মূল্য/CFT (বিক্রয়ের টাকা বাদ দিয়ে)</div>
            <div style={{fontSize:16,fontWeight:800,color:"#166534"}}>{lotAvailableCft(selLot)>0?`${money(lotCurrentStockPricePerCft(selLot).toFixed(2))}/CFT`:"—"}</div>

const DAY_OPTIONS=Array.from({length:22},(_,i)=>i*0.5); // 0, 0.5, ... 10.5
function WorkerAvatar({worker,size=36}){
  const c=deptColor(worker.department);
  const initial=(worker.name||"?").trim().charAt(0);
  if(worker.photoImg)return<img src={worker.photoImg} alt="" style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c}`,flexShrink:0}}/>;
  return<div style={{width:size,height:size,borderRadius:"50%",background:c+"22",border:`2px solid ${c}`,color:c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.42,fontWeight:800,flexShrink:0}}>{initial}</div>
}
function DayWheel({value,onChange,color}){
  const ref=useRef(null);
  const ITEM=34;
  const settleRef=useRef(null);
  const selfScrollRef=useRef(false);

  useEffect(()=>{
    const el=ref.current;
    if(!el)return;
    const idx=Math.max(0,DAY_OPTIONS.indexOf(parseFloat(value)||0));
    const target=idx*ITEM;
    if(Math.abs(el.scrollTop-target)>1){
      selfScrollRef.current=true;
      el.scrollTop=target;
      setTimeout(()=>{selfScrollRef.current=false},60);
    }
  },[value]);

  const onScroll=()=>{
    if(selfScrollRef.current)return;
    const el=ref.current;
    if(!el)return;
    clearTimeout(settleRef.current);
    settleRef.current=setTimeout(()=>{
      const idx=Math.round(el.scrollTop/ITEM);
      const clamped=Math.min(Math.max(idx,0),DAY_OPTIONS.length-1);
      const v=DAY_OPTIONS[clamped];
      if(v!==(parseFloat(value)||0))onChange(v);
      const target=clamped*ITEM;
      if(Math.abs(el.scrollTop-target)>1){
        selfScrollRef.current=true;
        el.scrollTo({top:target,behavior:"smooth"});
        setTimeout(()=>{selfScrollRef.current=false},320);
      }
    },110);
  };

  const cur=parseFloat(value)||0;
  return<div style={{position:"relative",width:66,height:ITEM*3,flexShrink:0}}>
    <div style={{position:"absolute",left:0,right:0,top:ITEM,height:ITEM,background:color+"18",borderTop:`1.5px solid ${color}`,borderBottom:`1.5px solid ${color}`,borderRadius:6,pointerEvents:"none",zIndex:2}}></div>
    <div ref={ref} onScroll={onScroll} style={{height:"100%",overflowY:"scroll",scrollSnapType:"y mandatory",WebkitOverflowScrolling:"touch",scrollbarWidth:"none",msOverflowStyle:"none",position:"relative",zIndex:1}} className="daywheel">
      <div style={{height:ITEM}}></div>
      {DAY_OPTIONS.map(v=><div key={v} style={{height:ITEM,scrollSnapAlign:"start",display:"flex",alignItems:"center",justifyContent:"center",fontSize:v===cur?18:15,fontWeight:v===cur?800:500,color:v===cur?color:"#c9c9c9",transition:"font-size .12s,color .12s"}}>{v}</div>)}
      <div style={{height:ITEM}}></div>
    </div>
  </div>
}
/* ── PROFIT & LOSS REPORT (flexible period: month / quarter / half / year / 2y / 3y / 5y) ── */
const PL_PERIODS=[
  {key:"month",label:"মাস",months:1},
  {key:"quarter",label:"৩ মাস",months:3},
  {key:"half",label:"৬ মাস",months:6},
  {key:"year",label:"বছর",months:12},
  {key:"year2",label:"২ বছর",months:24},
  {key:"year3",label:"৩ বছর",months:36},
  {key:"year5",label:"৫ বছর",months:60},
];
const PL_EPOCH=2020*12; // জানুয়ারি ২০২০ থেকে পিরিয়ড ব্লক গণনা শুরু, যাতে সব পিরিয়ড ক্যালেন্ডার-সংগত থাকে
function monthIndexOf(dateStr){const d=new Date(dateStr);return d.getFullYear()*12+d.getMonth()};
function plPeriodLabel(startIdx,months){
  const startY=Math.floor(startIdx/12),startM=startIdx%12;
  const endIdx=startIdx+months-1;
  const endY=Math.floor(endIdx/12),endM=endIdx%12;
  if(months===1)return`${monthName(startM)} ${startY}`;
  if(months>=12&&startM===0&&endM===11)return startY===endY?`${startY}`:`${startY} – ${endY}`;
  return`${monthName(startM)} ${startY} – ${monthName(endM)} ${endY}`;
}

  const inRange=(dateStr)=>{if(!dateStr)return false;const idx=monthIndexOf(dateStr);return idx>=startIdx&&idx<=endIdx};

  const stats=useMemo(()=>{
    const allActive=orders.filter(o=>!o.cancelled);

    // ── প্রতিটা অর্ডারের "বালতি" খরচ (job cost) — কাঠ ও শ্রম দুটোই CFT-ভিত্তিক ──
    const jobCost=(o)=>{
      const cftTotal=orderTotalCft(o);
      const wood=(o.items||[]).reduce((s,it)=>{
        const rate=itemWoodRate(it,o,woodSettings);
        return s+totalCft(it.sections)*it.qty*rate;
      },0);
      const lRate=orderLabourRate(o,laborSettings);
      const labour=cftTotal*lRate;
      return{wood,labour,cft:cftTotal,total:wood+labour};
    };

    // ── ডেলিভারি হওয়া অর্ডার = এই সময়ের আয় ও তার খরচ ──

    delivered.forEach(o=>{const j=jobCost(o);woodCost+=j.wood;labourCost+=j.labour;deliveredCft+=j.cft});

    // ── অসম্পূর্ণ কাজ (WIP) — সম্পদ, খরচ নয় ──
    const wipOrders=allActive.filter(o=>!o.delivered);
    const wipValue=wipOrders.reduce((s,o)=>s+jobCost(o).total,0);

    let actualPayroll=0;
    Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{

    const generalExpenses=expenses.filter(e=>inRange(e.date)).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
    const expenseByCat={};
    expenses.filter(e=>inRange(e.date)).forEach(e=>{

    });

    const woodPurchaseCash=(woodLots||[]).filter(l=>inRange(l.date)).reduce((s,l)=>{
      const tCft=(l.logs||[]).reduce((ss,lg)=>ss+lg.cft,0);
      return s+tCft*(parseFloat(l.ratePerCft)||0);
    },0);

    const totalCosts=woodCost+labourCost+generalExpenses;
    const netProfit=revenue-totalCosts;
    return{revenue,woodCost,labourCost,deliveredCft,generalExpenses,totalCosts,netProfit,expenseByCat,woodPurchaseCash,
      deliveredCount:delivered.length,wipCount:wipOrders.length,wipValue,actualPayroll,
      labourGap:actualPayroll-labourCost};
  },[orders,expenses,workers,payrollWeeks,woodLots,woodSettings,laborSettings,startIdx,endIdx]);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>

      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:11,padding:"10px 14px",marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>

        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:10,paddingBottom:10,borderBottom:"1px solid #f0f0f0"}}>
          <span style={{color:"#555"}}>ডেলিভারিকৃত বিক্রয় ({stats.deliveredCount} অর্ডার)</span>

    savePayrollWeek(weekEnd,{...weekData,attendance:att});
  };
  const addAdvance=()=>{
    if(!newAdv.workerId||!newAdv.amount)return;
    const adv={id:"adv_"+Date.now(),workerId:newAdv.workerId,date:newAdv.date,amount:parseFloat(newAdv.amount)||0,note:newAdv.note};
    savePayrollWeek(weekEnd,{...weekData,advances:[...(weekData.advances||[]),adv]});
    setNewAdv({date:today,workerId:"",amount:"",note:""});
  };
  const removeAdvance=(advId)=>{
    savePayrollWeek(weekEnd,{...weekData,advances:(weekData.advances||[]).filter(a=>a.id!==advId)});
  };

  const daysPresent=(workerId)=>{
    const v=(weekData.attendance||{})[workerId];
    if(Array.isArray(v))return v.reduce((s,x)=>s+attVal(x),0); // পুরনো দিন-ভিত্তিক তথ্য থাকলে যোগফল
    return parseFloat(v)||0;
  };
  const advanceTotal=(workerId)=>(weekData.advances||[]).filter(a=>a.workerId===workerId).reduce((s,a)=>s+(parseFloat(a.amount)||0),0);
  const grossPay=(w)=>daysPresent(w.id)*(parseFloat(w.dailyRate)||0);
  const netPay=(w)=>grossPay(w)-advanceTotal(w.id);
  const grandTotalNet=activeWorkers.reduce((s,w)=>s+netPay(w),0);
  const grandTotalGross=activeWorkers.reduce((s,w)=>s+grossPay(w),0);
  const grandTotalAdvance=activeWorkers.reduce((s,w)=>s+advanceTotal(w.id),0);

  const weekRangeLabel=`${fmtDate(days[0])} — ${fmtDate(days[6])}`;

  return<div className="print-bg" style={{minHeight:"100vh",background:"#f8f8f8"}}>

          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,background:PAY_LIGHT,borderRadius:9,padding:10,border:`1px solid ${PAY_BORDER}`}}>
            {newWorker.photoImg?<img src={newWorker.photoImg} style={{width:60,height:60,borderRadius:"50%",objectFit:"cover",border:`2px solid ${PAY}`,flexShrink:0}} alt=""/>
            :<div style={{width:60,height:60,borderRadius:"50%",background:"white",border:`2px dashed ${PAY_BORDER}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:PAY_BORDER,flexShrink:0}}>👤</div>}
            <div style={{flex:1}}>
              <div style={{fontSize:11,fontWeight:600,color:PAY_DARK,marginBottom:5}}>প্রোফাইল ছবি</div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>photoInput.current.click()} style={{background:"white",border:`1px solid ${PAY_BORDER}`,color:PAY_DARK,borderRadius:7,padding:"7px 11px",fontSize:11,fontWeight:600}}>{newWorker.photoImg?"বদলান":"📷 ছবি যোগ করুন"}</button>
                {newWorker.photoImg&&<button onClick={()=>setNewWorker({...newWorker,photoImg:null})} style={{background:"#fee2e2",border:"none",color:RED,borderRadius:7,padding:"7px 11px",fontSize:11,fontWeight:600}}>✕ সরান</button>}
              </div>
            </div>
            <input ref={photoInput} type="file" accept="image/*" onChange={handlePhotoImg} style={{display:"none"}}/>

          <div style={{marginBottom:10}}>{lbl("ভোটার আইডি নম্বর")}<input value={newWorker.voterId} onChange={e=>setNewWorker({...newWorker,voterId:e.target.value})} placeholder="ভোটার আইডি" style={inp}/></div>

            <div>{lbl("দৈনিক বেতন (৳) *")}<input type="number" value={newWorker.dailyRate} onChange={e=>setNewWorker({...newWorker,dailyRate:e.target.value})} placeholder="0" style={inp}/></div>

            </div>
          </div>
        </div>)}
        {viewingIdCard&&<div onClick={()=>setViewingIdCard(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{color:"white",fontSize:15,fontWeight:700,marginBottom:10}}>{viewingIdCard.name} — আইডি কার্ড</div>

          <div style={{display:"flex",gap:8,marginTop:14}} onClick={e=>e.stopPropagation()}>
            {viewingIdCard.idCardFileName&&FS_SUPPORTED&&<button onClick={()=>openFullResImageForPrint(viewingIdCard.idCardFileName)} style={{background:"white",color:"#111",border:"none",borderRadius:8,padding:"10px 16px",fontSize:12,fontWeight:700}}>🖨️ ফুল ছবি প্রিন্ট</button>}
            <button onClick={()=>setViewingIdCard(null)} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"1px solid rgba(255,255,255,0.4)",borderRadius:8,padding:"10px 16px",fontSize:12,fontWeight:700}}>বন্ধ করুন</button>
          </div>
        </div>}
      </div>}

      {view==="week"&&<>
        <div className="no-print" style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:11,padding:"10px 14px",marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>

          <div style={{textAlign:"center"}}>
            <div style={{fontSize:13,fontWeight:700,color:"#222"}}>{weekRangeLabel}</div>
            <div style={{fontSize:10,color:"#888"}}>শুক্র – বৃহস্পতি</div>
          </div>
          <button onClick={()=>setWeekEnd(addDays(weekEnd,7))} style={{background:PAY_LIGHT,border:"none",borderRadius:8,padding:"8px 12px",color:PAY_DARK,fontWeight:700,fontSize:13}}>▶</button>
        </div>

        <div className="no-print" style={{background:"white",borderRadius:13,padding:16,marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,.09)",border:`1.5px solid ${PAY_BORDER}`}}>
          <div style={{fontWeight:800,fontSize:15,marginBottom:12,color:PAY_DARK}}>💰 অগ্রিম (এডভান্স) যোগ করুন</div>
          <div style={{marginBottom:10}}>
            {lbl("কর্মী")}
            {(()=>{

              return<div style={{position:"relative"}}>
                <button type="button" onClick={()=>setAdvPickerOpen(!advPickerOpen)} style={{...inp,padding:"10px 11px",fontSize:14,fontWeight:600,textAlign:"left",display:"flex",alignItems:"center",gap:9,cursor:"pointer",background:"white"}}>
                  {sel?<WorkerAvatar worker={sel} size={32}/>:<div style={{width:32,height:32,borderRadius:"50%",background:"#f3f4f6",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,color:"#bbb",flexShrink:0}}>👤</div>}
                  <span style={{flex:1,minWidth:0,color:sel?"#111":"#999",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {sel?sel.name:"-- নির্বাচন করুন --"}

                </button>
                {advPickerOpen&&<div style={{position:"absolute",top:"105%",left:0,right:0,background:"white",border:`1.5px solid ${PAY_BORDER}`,borderRadius:10,boxShadow:"0 6px 20px rgba(0,0,0,.14)",zIndex:30,maxHeight:260,overflowY:"auto"}}>
                  {activeWorkers.length===0?<div style={{padding:12,fontSize:12,color:"#aaa",textAlign:"center"}}>কোনো সক্রিয় কর্মী নেই</div>:

                      <WorkerAvatar worker={w} size={32}/>
                      <div style={{flex:1,minWidth:0}}>

          <div style={{marginBottom:10}}>
