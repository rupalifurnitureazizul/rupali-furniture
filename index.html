// Compress an image file to a small JPEG base64 string before storing, to avoid hitting localStorage quota
function compressImage(file,maxDim=1200,quality=0.82,maxBytes=110000){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
        else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        // ── ছবি যত জটিল/ভারীই হোক, ফলাফল সবসময় একটা নির্দিষ্ট সর্বোচ্চ সাইজের মধ্যে রাখা হয় —
        // একটা অর্ডারে একাধিক ছবি (রেফারেন্স + ডেলিভারি) জমলেও Firestore-এর প্রতি-ডকুমেন্ট
        // সাইজ সীমা (~1MB) পার হয়ে যাওয়ার ঝুঁকি অনেক কমে যায়। প্রথমে স্বাভাবিক কোয়ালিটিতে
        // চেষ্টা, তারপর দরকার হলে ধাপে ধাপে কোয়ালিটি কমিয়ে, তাতেও না হলে মাপ ছোট করে পুনরায়
        // এনকোড — সীমার মধ্যে না আসা পর্যন্ত (বা যুক্তিসঙ্গত কয়েকবার চেষ্টার পর যা পাওয়া যায় তাই) ──
        let q=quality;
        let result=canvas.toDataURL("image/jpeg",q);
        let attempts=0;
        while(result.length>maxBytes&&attempts<8){
          attempts++;
          if(q>0.35){
            q=Math.max(0.35,q-0.12);
          }else{
            w=Math.round(w*0.85);h=Math.round(h*0.85);
            canvas.width=w;canvas.height=h;
            ctx.drawImage(img,0,0,w,h);
          }
          result=canvas.toDataURL("image/jpeg",q);
        }
        resolve(result);
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

/* ── FULL-RESOLUTION LOCAL FOLDER STORAGE (desktop Chrome/Edge/Brave only) ──

const BUILD_TAG="4.99";
const FS_SUPPORTED=typeof window!=="undefined"&&"showDirectoryPicker" in window;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("rf_fs_store",1);
    req.onupgradeneeded=()=>{req.result.createObjectStore("handles")};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readwrite");
    tx.objectStore("handles").put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readonly");
    const req=tx.objectStore("handles").get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function pickImageFolder(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await window.showDirectoryPicker();
    await idbSet("imageFolder",handle);
    return handle;
  }catch(e){return null}
}
async function getImageFolderHandle(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await idbGet("imageFolder");
    if(!handle)return null;
    const perm=await handle.queryPermission({mode:"readwrite"});
    if(perm==="granted")return handle;
    const req=await handle.requestPermission({mode:"readwrite"});
    if(req==="granted")return handle;
    return null;
  }catch(e){return null}
}
function genImgFileName(prefix,index,file){
  const ext=(file.name.match(/\.[0-9a-z]+$/i)||[".jpg"])[0];
  return`${prefix}_${index}${ext}`.replace(/[^a-zA-Z0-9_.\-]/g,"_");
}
function sanitizeFolderName(name){

function orderImageFolder(kind,order){
  const topFolder=kind==="finished"?"Finished order":"Order reference";
  const d=(order&&order.cust&&order.cust.date)?new Date(order.cust.date):new Date();
  const year=isNaN(d.getTime())?new Date().getFullYear():d.getFullYear();
  const monthIdx=isNaN(d.getTime())?new Date().getMonth():d.getMonth();
  const monthFolder=`${String(monthIdx+1).padStart(2,"0")}-${monthName(monthIdx)}`;
  return`${topFolder}/${year}/${monthFolder}`;
}
// relPath এ "/" থাকলে সেটাকে সাবফোল্ডার ধরে সেই অনুযায়ী ফোল্ডার তৈরি/খোঁজা হয় — না থাকলে আগের মতোই রুট ফোল্ডারে সরাসরি
async function resolveFolderForPath(rootFolder,relPath){
  const parts=relPath.split("/");
  const baseName=parts.pop();
  let dir=rootFolder;
  for(const part of parts){
    if(!part)continue;
    dir=await dir.getDirectoryHandle(part,{create:true});
  }
  return{dir,baseName};
}
async function saveFullResImage(file,relPath){
  const folder=await getImageFolderHandle();
  if(!folder)return false;
  try{
    const{dir,baseName}=await resolveFolderForPath(folder,relPath);
    const fileHandle=await dir.getFileHandle(baseName,{create:true});
    const writable=await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  }catch(e){return false}
}
async function openFullResImageForPrint(relPath){
  const folder=await getImageFolderHandle();

  try{
    const{dir,baseName}=await resolveFolderForPath(folder,relPath);
    const fileHandle=await dir.getFileHandle(baseName);
    const file=await fileHandle.getFile();

    w.document.write(`<html><head><title>Print</title><style>body{margin:0;display:flex;justify-content:center}img{max-width:100%}</style></head><body><img src="${url}" onload="window.print()"/></body></html>`);
  }catch(e){alert("❌ ছবিটি ফোল্ডারে খুঁজে পাওয়া যায়নি। সম্ভবত ফোল্ডারটি স্থানান্তরিত বা মুছে ফেলা হয়েছে।")}

function topLevelPatch(oldObj,newObj,skip){
  const patch={};
  const keys=new Set([...Object.keys(oldObj||{}),...Object.keys(newObj||{})]);
  keys.forEach(k=>{
    if(skip&&skip.includes(k))return;
    const a=newObj?newObj[k]:undefined,b=oldObj?oldObj[k]:undefined;
    if(JSON.stringify(a)===JSON.stringify(b))return;
    patch[k]=a===undefined?firebase.firestore.FieldValue.delete():JSON.parse(JSON.stringify(a));
  });
  return patch;
}
const listKey=(p)=>(p&&p.id)?("id:"+p.id):("j:"+JSON.stringify(p));
// ── টাকার তালিকা (পেমেন্ট, স'মিল বিল): পুরো তালিকা কখনো লেখা হয় না — শুধু যে এন্ট্রি যোগ/বাদ/বদল হয়েছে
// সেটুকু (arrayUnion/arrayRemove)। অফলাইনেও কাজ করে, আর অন্য ডিভাইসে যোগ হওয়া এন্ট্রি কখনো মোছে না ──
async function applyListDiff(ref,field,oldList,newList){
  const FV=firebase.firestore.FieldValue;
  const oldBy={},newBy={};
  (oldList||[]).forEach(p=>{oldBy[listKey(p)]=p});
  (newList||[]).forEach(p=>{newBy[listKey(p)]=p});
  const removed=[],added=[];
  Object.keys(oldBy).forEach(k=>{if(!newBy[k])removed.push(oldBy[k]);else if(JSON.stringify(oldBy[k])!==JSON.stringify(newBy[k])){removed.push(oldBy[k]);added.push(newBy[k])}});
  Object.keys(newBy).forEach(k=>{if(!oldBy[k])added.push(newBy[k])});
  const clean=(x)=>JSON.parse(JSON.stringify(x));
  if(removed.length)await ref.set({[field]:FV.arrayRemove(...removed.map(clean))},{merge:true});
  if(added.length)await ref.set({[field]:FV.arrayUnion(...added.map(clean))},{merge:true});
}
// ── ক্রম গুরুত্বপূর্ণ এমন তালিকা (কাঠের গুড়ি — ক্রমিক নম্বর তালিকার অবস্থান থেকেই আসে): সার্ভারের
// সর্বশেষ তালিকা পড়ে id ধরে যোগ/বাদ/জায়গামতো বদল (transaction)। নেট না থাকলে আগের মতো পুরো তালিকা ──
async function applyOrderedListDiff(fs,ref,field,oldList,newList){
  const oldBy={},newBy={};
  (oldList||[]).forEach(p=>{oldBy[listKey(p)]=p});
  (newList||[]).forEach(p=>{newBy[listKey(p)]=p});
  const removedK=Object.keys(oldBy).filter(k=>!newBy[k]);
  const changed=Object.keys(newBy).filter(k=>oldBy[k]&&JSON.stringify(oldBy[k])!==JSON.stringify(newBy[k]));
  const addedK=Object.keys(newBy).filter(k=>!oldBy[k]);
  if(!removedK.length&&!changed.length&&!addedK.length)return;
  const clean=(x)=>JSON.parse(JSON.stringify(x));
  try{
    await fs.runTransaction(async tx=>{
      const d=await tx.get(ref);
      let cur=((d.exists&&d.data()[field])||[]).filter(p=>!removedK.includes(listKey(p)));
      cur=cur.map(p=>changed.includes(listKey(p))?clean(newBy[listKey(p)]):p);
      addedK.forEach(k=>{if(!cur.some(p=>listKey(p)===k))cur.push(clean(newBy[k]))});
      tx.set(ref,{[field]:cur},{merge:true});
    });
  }catch(e){
    await ref.set({[field]:clean(newList||[])},{merge:true});
  }
}

let SUGGESTED_WOOD_RATES={};
function computeSuggestedWoodRates(woodLots,woodSettings){
  const out={};
  const byType={};
  (woodLots||[]).forEach(l=>{if(l&&l.woodType)(byType[l.woodType]=byType[l.woodType]||[]).push(l)});
  Object.entries(byType).forEach(([wt,lots])=>{
    const wast=parseFloat(((woodSettings||{})[wt]||{}).wastagePercent)||0;
    let usableSum=0,costSum=0;
    lots.forEach(l=>{
      const logs=l.logs||[];
      const raw=logs.filter(g=>g.cut&&!g.sold).reduce((a,g)=>a+(parseFloat(g.cft)||0),0);
      const usable=raw*(1-wast/100);
      if(raw<=0||usable<=0)return;
      const totalCftL=logs.reduce((a,g)=>a+(parseFloat(g.cft)||0),0);
      const purchase=totalCftL>0?(raw/totalCftL)*totalCftL*(parseFloat(l.ratePerCft)||0):0;
      const extra=(l.millingEntries||[]).reduce((a,m)=>a+(parseFloat(m.billAmount)||0),0)+(parseFloat(l.transportCost)||0)+(parseFloat(l.otherCost)||0);
      usableSum+=usable;costSum+=purchase+extra;
    });
    if(usableSum>0)out[wt]=costSum/usableSum;
  });
  return out;
}
function woodRateOn(woodSettings,species,dateStr){
  const s=(woodSettings&&woodSettings[species])||{};
  const hist=(s.rateHistory||[]).filter(h=>h.from&&parseFloat(h.rate)>0).sort((a,b)=>a.from.localeCompare(b.from));
  if(hist.length&&dateStr){
    let picked=null;
    hist.forEach(h=>{if(h.from<=dateStr)picked=h});
    if(picked)return parseFloat(picked.rate)||0;
    return parseFloat(hist[0].rate)||0; // অর্ডার সবচেয়ে পুরনো এন্ট্রির আগের হলে প্রথমটাই ধরা হবে
  }
  return parseFloat(s.finalAvgRate)||(SUGGESTED_WOOD_RATES[species]||0);
}

}

// এখনকার প্রকৃত সংখ্যা তুলনা করে ──
function computeRealisticDeliveryDays(orders){
  const activeOrders=(orders||[]).filter(o=>!o.cancelled);
  const prodTimes=[];
  activeOrders.forEach(o=>{
    const ip=effectiveItemProgress(o);
    const pcts=[];let lastEnd="";
    (o.items||[]).forEach((it,idx)=>{
      const ikey=it.itemId||`idx_${idx}`;
      DEPTS.forEach(d=>{const cur=(ip[ikey]||{})[d.id];pcts.push((cur&&cur.pct)||0);if(cur&&cur.end&&cur.end>lastEnd)lastEnd=cur.end});
    });
    if(pcts.length&&pcts.every(p=>p>=100)&&lastEnd&&o.cust.date){
      const days=daysBetween(o.cust.date,lastEnd);
      if(days>=0)prodTimes.push(days);
    }
  });
  if(prodTimes.length<3)return null; // পর্যাপ্ত ইতিহাস না থাকলে অনুমান না করাই ভালো
  const avgProdDays=prodTimes.reduce((s,d)=>s+d,0)/prodTimes.length;
  const currentRunningCount=activeOrders.filter(o=>!o.delivered&&!isOrderFullyProgressed(o)).length;
  const sixMoAgo=monthsAgo(todayStr(),6);
  const deliveredLast6mo=activeOrders.filter(o=>o.delivered&&o.deliveredAt&&o.deliveredAt>=sixMoAgo).length;
  const throughputPerDay=deliveredLast6mo/180;
  const normalWIP=throughputPerDay*avgProdDays;
  const congestion=normalWIP>0?currentRunningCount/normalWIP:1;
  const realisticDays=Math.round(avgProdDays*Math.max(0.5,Math.min(3,congestion)));
  return{avgProdDays:Math.round(avgProdDays),realisticDays,currentRunningCount};
}

function DateInput({value,onChange,disabled,accent}){
  const boxStyle={width:"100%",border:`1.5px solid ${disabled?"#eee":"#e0e0e0"}`,borderRadius:9,padding:"10px 11px",fontSize:13,background:disabled?"#f5f5f5":"white",color:disabled?"#999":(value?"#111":"#999"),boxSizing:"border-box",fontWeight:value?700:400,display:"flex",alignItems:"center",justifyContent:"space-between"};
  return<div style={{position:"relative"}}>
    <div style={boxStyle}><span>{value?fmtDate(value):"dd/mm/yyyy"}</span><span style={{color:accent||"#999",fontSize:14}}>📅</span></div>
    <input type="date" value={value||""} disabled={disabled} onChange={e=>onChange(e.target.value)} style={{position:"absolute",inset:0,opacity:0,width:"100%",height:"100%",border:"none",cursor:disabled?"default":"pointer"}}/>
  </div>
}

        saveDb(nd);

    const newVarKey="var_"+Date.now();

    nd[newCatKey]={bn:catName,en:catName,variants:{[newVarKey]:{bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]}}};

    </div>}

      <div style={{display:"flex",gap:5,marginTop:6}}>

      </div>

    {fCat&&!newCatMode&&(newModelMode?<div style={{background:"#f5f3ff",borderRadius:7,padding:8,marginBottom:6,border:"1px solid #ddd6fe"}}>

        <div style={{display:"flex",gap:5,marginTop:6}}>
          <button type="button" onClick={()=>{setNewModelMode(false);setNewModelName("")}} style={{flex:1,background:"white",border:"1px solid #ddd",borderRadius:5,padding:"6px",fontSize:9}}>বাতিল</button>

        </div>
      </div>
    :<div style={{position:"relative",marginBottom:6}}>
        <button type="button" onClick={()=>setDropdownOpen(!dropdownOpen)} style={{...inp,marginBottom:0,textAlign:"left",display:"flex",alignItems:"center",gap:6,cursor:"pointer",background:"white"}}>
          {coverFor(varKey)&&<img src={coverFor(varKey)} style={{width:18,height:18,objectFit:"cover",borderRadius:4,flexShrink:0}} alt=""/>}
          <span style={{flex:1,color:fVar?"#000":"#999",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fVar?`${isEmptyWood(fVar)?"⚠️ ":""}[${fVar.code}] ${fVar.bn}`:"-- মডেল নির্বাচন করুন --"}</span>

          {Object.entries(fCat.variants||{}).sort((a,b)=>(a[1].bn||"").localeCompare(b[1].bn||"","bn")).map(([k,v])=><div key={k} onClick={()=>{onSelect(catKey,k);setDropdownOpen(false)}} style={{display:"flex",alignItems:"center",gap:6,padding:"7px 9px",cursor:"pointer",borderBottom:"1px solid #f5f5f5"}}>

function WhatsAppSendBtn({targetRef,phone,label}){
  const[state,setState]=useState("idle"); // idle | preparing | ready
  const[pendingFile,setPendingFile]=useState(null);
  const[pendingBlob,setPendingBlob]=useState(null);

  const prepare=async()=>{
    if(!targetRef.current||typeof html2canvas==="undefined")return;
    setState("preparing");
    try{
      const canvas=await html2canvas(targetRef.current,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      canvas.toBlob((blob)=>{
        if(!blob){setState("idle");return}
        setPendingFile(new File([blob],"receipt.png",{type:"image/png"}));
        setPendingBlob(blob);
        setState("ready");
      },"image/png");
    }catch(e){alert("ছবি তৈরি করতে সমস্যা হয়েছে: "+e.message);setState("idle")}
  };
  // WhatsApp-এর নিজস্ব নিয়মে কোনো ওয়েবসাইট থেকে ছবিসহ কোনো নির্দিষ্ট নম্বরে সরাসরি পাঠানো
  // (কন্টাক্ট বেছে নেওয়া ছাড়া) সম্ভব না — এটা WhatsApp নিজেই নিয়ন্ত্রণ করে। তবে এই পদ্ধতিতে
  // অন্তত "কন্টাক্ট খোঁজা"র ধাপটা এড়ানো যায় — সরাসরি সঠিক চ্যাটে চলে যাবে।
  const sendNow=()=>{
    if(pendingBlob){
      const url=URL.createObjectURL(pendingBlob);
      const a=document.createElement("a");a.href=url;a.download="receipt.png";document.body.appendChild(a);a.click();document.body.removeChild(a);
      window.open(`https://wa.me/${toIntlPhone(phone)}`,"_blank");
    }
    setState("idle");setPendingFile(null);setPendingBlob(null);
  };

  if(state==="ready")return<div className="no-print" style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2}}>
    <button onClick={sendNow} style={{background:"#0d9488",color:"white",border:"none",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5,boxShadow:"0 0 0 3px rgba(13,148,136,0.25)"}}>✅ প্রস্তুত — এখন ট্যাপ করুন</button>
    <span style={{fontSize:8,color:"#0d9488",maxWidth:150,lineHeight:1.3}}>ছবি ডাউনলোড হবে ও সঠিক চ্যাট খুলবে — গ্যালারি থেকে অ্যাটাচ করে পাঠান</span>
  </div>;
  return<button className="no-print" onClick={prepare} disabled={state==="preparing"} style={{background:"#16a34a",color:"white",border:"none",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5}}>{state==="preparing"?"⏳ তৈরি হচ্ছে...":`📤 ${label||"WhatsApp-এ পাঠান"}`}</button>;
}

  return<button className="no-print" onClick={()=>openFullResImageForPrint(fileName)} style={{background:"#1e293b",color:"white",border:"none",borderRadius:5,padding:"2px 7px",fontSize:8,fontWeight:700,marginTop:2}}>🖨️ ফুল ছবি প্রিন্ট</button>

  const imgInputRef=useRef();
  const[addingNew,setAddingNew]=useState(false);
  const[newItem,setNewItem]=useState({catKey:"",varKey:"",wood:"S",qty:"",price:"",notes:""});
  const[newCatMode,setNewCatMode]=useState(false);
  const[newCatName,setNewCatName]=useState("");
  const[newCatVarName,setNewCatVarName]=useState("");
  // ── অর্ডারের মূল তথ্য (নাম/ফোন/ঠিকানা/তারিখ/ডেলিভারি/মন্তব্য) এখন এখানেই, একটা একটা করে
  // এডিট করা যায় — অন্য কোনো ট্যাবে এই তথ্য এডিটের উপায় নেই, সব এখানেই কেন্দ্রীভূত ──
  const[editingField,setEditingField]=useState(null);
  const[fieldDraft,setFieldDraft]=useState("");
  const startEditField=(field,rawVal)=>{setEditingField(field);setFieldDraft(rawVal||"")};
  const saveField=()=>{
    if((editingField==="name"||editingField==="phone")&&!fieldDraft.trim()){setEditingField(null);return}
    onUpdateOrder({...order,cust:{...cust,[editingField]:fieldDraft}});
    setEditingField(null);
  };
  const editableRow=(field,label,displayVal,rawVal,type)=>{
    if(editingField===field)return<div className="no-print" style={{gridColumn:"1 / -1",marginBottom:4}}>
      <div style={{fontSize:9,color:"#888",marginBottom:2}}>{label}</div>
      <div style={{display:"flex",gap:4}}>
        {type==="date"?<div style={{flex:1}}><DateInput value={fieldDraft} onChange={setFieldDraft} accent="#1d4ed8"/></div>
          :type==="textarea"?<textarea value={fieldDraft} onChange={e=>setFieldDraft(e.target.value)} rows={2} style={{flex:1,border:"1.5px solid #1d4ed8",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
          :<input value={fieldDraft} onChange={e=>setFieldDraft(e.target.value)} style={{flex:1,border:"1.5px solid #1d4ed8",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none",minWidth:0}}/>}
        <button onClick={saveField} style={{background:"#1d4ed8",color:"white",border:"none",borderRadius:6,padding:"0 10px",fontSize:13,flexShrink:0}}>✓</button>
        <button onClick={()=>setEditingField(null)} style={{background:"white",border:"1px solid #ddd",borderRadius:6,padding:"0 10px",fontSize:11,flexShrink:0}}>✕</button>
      </div>
    </div>;
    return<div style={{display:"flex",gap:4,marginBottom:4,fontSize:11,alignItems:"center"}}>
      <span style={{color:"#888",flexShrink:0,minWidth:78}}>{label}:</span>
      <span style={{fontWeight:600,color:"#222",flex:1,minWidth:0,wordBreak:"break-word"}}>{displayVal||"—"}</span>
      <button onClick={()=>startEditField(field,rawVal)} className="no-print" style={{background:"none",border:"none",color:"#1d4ed8",fontSize:11,padding:"0 2px",flexShrink:0}}>✏️</button>
    </div>;
  };
  // ── পেমেন্ট এন্ট্রিও এখানেই একটা একটা করে এডিট/মোছা যায়, একই নিয়মে (বাকির চেয়ে বেশি
  // বসানো যাবে না, নতুন পেমেন্ট যোগ করার সময় যেমন হয়) ──
  const[editingPayIdx,setEditingPayIdx]=useState(null);
  const[payDraft,setPayDraft]=useState({date:"",amount:"",note:""});

  const recalcTotal=(newItems)=>newItems.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseFloat(it.qty)||1),0);
  const startEditItem=(i)=>{
    const it=items[i];
    setEditIdx(i);
    setEditForm({catKey:it.catKey,varKey:it.varKey,wood:it.wood,qty:it.qty,price:it.price||"",notes:it.notes||""});
  };
  const saveEditItem=()=>{
    const cat=db[editForm.catKey];
    const variant=cat.variants[editForm.varKey];
    const newItems=[...items];
    const keepSections=newItems[editIdx].varKey===editForm.varKey?newItems[editIdx].sections:JSON.parse(JSON.stringify(variant.sections));
    newItems[editIdx]={...newItems[editIdx],catKey:editForm.catKey,varKey:editForm.varKey,variantBn:variant.bn,code:variant.code,tier:variant.tier||"M",wood:editForm.wood,woodBn:WOOD[editForm.wood].bn,qty:parseInt(editForm.qty)||1,price:editForm.price,notes:editForm.notes,sections:keepSections,itemId:newItems[editIdx].itemId||("item_"+Date.now()+"_"+Math.random().toString(36).slice(2,7))};
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
    setEditIdx(null);setEditForm(null);
  };
  const removeItem=(i)=>{
    if(!window.confirm("এই ফার্নিচারটি অর্ডার থেকে বাদ দিতে চান?"))return;
    const newItems=items.filter((_,j)=>j!==i);
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
  };
  const createNewCategoryInline=()=>{
    const catName=newCatName.trim()||`নতুন ফার্নিচার ${dbCats(db).length+1}`;
    const varName=newCatVarName.trim()||"স্ট্যান্ডার্ড মডেল";
    const catKey="cat_"+Date.now();
    const varKey="var_"+Date.now();
    const code=uniqueAutoCode(db,catName+" "+varName,String(Math.floor(Math.random()*900+100)));
    const nd=JSON.parse(JSON.stringify(db));
    nd[catKey]={bn:catName,en:catName,variants:{[varKey]:{bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]}}};
    saveDb(nd);
    setNewItem({...newItem,catKey,varKey});
    setNewCatMode(false);setNewCatName("");setNewCatVarName("");
  };
  const addNewItem=()=>{
    const cat=db[newItem.catKey];
    const variant=cat?.variants[newItem.varKey];
    if(!variant)return;
    const item={catKey:newItem.catKey,varKey:newItem.varKey,variantBn:variant.bn,code:variant.code,tier:variant.tier||"M",wood:newItem.wood,woodBn:WOOD[newItem.wood].bn,qty:parseInt(newItem.qty)||1,price:newItem.price,notes:newItem.notes,sections:JSON.parse(JSON.stringify(variant.sections)),itemId:"item_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)};
    const newItems=[...items,item];
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
    setNewItem({catKey:"",varKey:"",wood:"S",qty:1,price:"",notes:""});setAddingNew(false);
  };
  const addNewImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const newOnes=[];
    const categoryFolder=orderImageFolder("ref",order);
    for(let idx=0;idx<files.length;idx++){
      const compressed=await compressImage(files[idx]);
      if(!compressed)continue;
      const fileIdx=images.length+newOnes.length+1;
      const baseFileName=genImgFileName(`${order.no}_ref`,fileIdx,files[idx]);
      const relPath=`${categoryFolder}/${baseFileName}`;
      const savedFull=await saveFullResImage(files[idx],relPath);
      newOnes.push({src:compressed,caption:`ছবি ${fileIdx}`,fileName:savedFull?relPath:null});
    }
    if(newOnes.length>0)onUpdateOrder({...order,refImgs:[...images,...newOnes],refImg:undefined});
  };
  const removeImage=(idx)=>{
    const updated=images.filter((_,i)=>i!==idx);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };
  const updateImgCaption=(idx,val)=>{
    const updated=images.map((img,i)=>i===idx?{...img,caption:val}:img);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#1d4ed8"}}><PrintBtn onPrint={()=>onPrint("s2")}/></div>
    <Hdr title="অর্ডার বুক কপি" sub="Order Book Copy" no={no} bg="#1d4ed8"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 12px",background:"#eff6ff",borderRadius:7,padding:"8px",marginBottom:8}}>
        {editableRow("date","তারিখ",fmtDate(cust.date),cust.date,"date")}
        {editableRow("delivery","ডেলিভারি",cust.delivery?`${fmtDate(cust.delivery)} (${days} দিনে)`:"",cust.delivery,"date")}
        {editableRow("name","গ্রাহকের নাম",cust.name,cust.name)}
        {editableRow("phone","মোবাইল",cust.phone,cust.phone)}
        {editableRow("address","ঠিকানা",cust.address,cust.address)}
        {editableRow("notes","মন্তব্য",cust.notes,cust.notes,"textarea")}
      </div>
      {images.length>0&&<div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:10,color:"#888"}}>রেফারেন্স ছবি:</span>
          <button className="no-print" onClick={()=>setEditingImages(!editingImages)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"3px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>{editingImages?"✓ শেষ":"✏️ পরিবর্তন"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center",position:"relative"}}>
            <img src={img.src} className="ref-img" alt="ref" onClick={()=>openLightbox(img.src)} style={{maxHeight:100,cursor:"pointer"}}/>
            {editingImages?<input className="no-print" value={img.caption} onChange={e=>updateImgCaption(i,e.target.value)} style={{fontSize:8,marginTop:2,border:"1px solid #ddd",borderRadius:4,padding:"2px 4px",width:"90%",outline:"none"}}/>:<div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div>}
            <FullImgBtn fileName={img.fileName}/>
            {editingImages&&<button className="no-print" onClick={()=>removeImage(i)} style={{position:"absolute",top:-6,right:-6,background:RED,color:"white",border:"none",borderRadius:"50%",width:18,height:18,fontSize:10,lineHeight:1}}>✕</button>}
          </div>)}
        </div>
        {editingImages&&<div className="no-print" style={{textAlign:"center",marginTop:8}}>
          <input ref={imgInputRef} type="file" accept="image/*" multiple onChange={addNewImages} style={{display:"none"}}/>
          <button onClick={()=>imgInputRef.current.click()} style={{background:"#f0f0f0",border:"1.5px dashed #aaa",borderRadius:8,padding:"7px 14px",fontSize:11,color:"#555"}}>📂 আরো ছবি যোগ করুন</button>
        </div>}
      </div>}
      {images.length===0&&<div className="no-print" style={{textAlign:"center",marginBottom:8}}>
        <input ref={imgInputRef} type="file" accept="image/*" multiple onChange={addNewImages} style={{display:"none"}}/>
        <button onClick={()=>imgInputRef.current.click()} style={{background:"#f0f0f0",border:"1.5px dashed #aaa",borderRadius:8,padding:"7px 14px",fontSize:11,color:"#555"}}>📂 রেফারেন্স ছবি যোগ করুন</button>
      </div>}
      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #bfdbfe",borderRadius:6,padding:"6px 9px",marginBottom:5,fontSize:10}}>
        {editIdx===i?<div className="no-print" style={{background:"#eff6ff",borderRadius:7,padding:8}}>
          <div style={{fontSize:9,fontWeight:700,color:"#1d4ed8",marginBottom:6}}>ফার্নিচার পরিবর্তন করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={editForm.catKey} varKey={editForm.varKey} onSelect={(ck,vk)=>setEditForm({...editForm,catKey:ck,varKey:vk})}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={editForm.wood} onChange={e=>setEditForm({...editForm,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>
              {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn}</option>)}
            </select>
            <input type="number" min={1} value={editForm.qty} placeholder="1" onChange={e=>setEditForm({...editForm,qty:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>
          </div>
          <div style={{marginBottom:6}}><input type="number" value={editForm.price} onChange={e=>setEditForm({...editForm,price:e.target.value})} placeholder="মূল্য (৳)" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:11,fontWeight:700,color:"#166534",boxSizing:"border-box"}}/></div>
          <textarea rows={2} value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:6,resize:"vertical"}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setEditIdx(null);setEditForm(null)}} style={{flex:1,background:"white",border:"1px solid #ddd",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
            <button onClick={saveEditItem} disabled={!editForm.varKey} style={{flex:2,background:editForm.varKey?"#1d4ed8":"#ccc",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>সংরক্ষণ করুন</button>
          </div>
        </div>:<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700}}>[{it.code}] {it.variantBn}</div>
              <div style={{color:"#555",marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty} | CFT: {(totalCft(it.sections)*it.qty).toFixed(3)}</div>
              {it.price&&<div style={{color:"#166534",fontWeight:700,marginTop:1}}>মূল্য: {money((parseFloat(it.price)||0)*(parseFloat(it.qty)||1))}</div>}
              {(()=>{
                const woodCost=itemWoodCost(it,order,woodSettings);
                const lRate=orderLabourRate(order,laborSettings);
                if(!woodCost&&!lRate)return null;
                const cftVal=totalCft(it.sections)*it.qty;
                const labourCost=cftVal*lRate;
                const totalCost=woodCost+labourCost;
                const profit=it.price?((parseFloat(it.price)||0)*(parseFloat(it.qty)||1))-totalCost:null;
                return<div className="no-print" style={{fontSize:9,color:"#777",marginTop:2,background:"#f9fafb",borderRadius:5,padding:"3px 6px",display:"inline-block"}}>
                  কাঠ {money(woodCost.toFixed(0))} + শ্রম {money(labourCost.toFixed(0))} = খরচ {money(totalCost.toFixed(0))}{profit!==null&&<span style={{marginLeft:6,color:profit>=0?"#166534":RED,fontWeight:700}}>| লাভ: {money(profit.toFixed(0))}</span>}
                </div>
              })()}
              {it.notes&&<div style={{color:"#888",marginTop:1}}>⚙ {it.notes}</div>}
            </div>
            <div className="no-print" style={{display:"flex",gap:4,flexShrink:0}}>
              <button onClick={()=>startEditItem(i)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>✏️ পরিবর্তন</button>
              {items.length>1&&<button onClick={()=>removeItem(i)} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,color:RED,fontWeight:700}}>✕ বাদ</button>}
            </div>
          </div>
        </>}
      </div>)}
      <div className="no-print">
        {addingNew?<div style={{background:"#eff6ff",borderRadius:9,padding:10,marginBottom:8}}>
          <div style={{fontSize:10,fontWeight:700,color:"#1d4ed8",marginBottom:7}}>নতুন ফার্নিচার যোগ করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={newItem.catKey} varKey={newItem.varKey} onSelect={(ck,vk)=>setNewItem({...newItem,catKey:ck,varKey:vk})}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={newItem.wood} onChange={e=>setNewItem({...newItem,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>
              {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn}</option>)}
            </select>
            <input type="number" min={1} value={newItem.qty} placeholder="1" onChange={e=>setNewItem({...newItem,qty:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>
          </div>
          <div style={{marginBottom:6}}><input type="number" value={newItem.price} onChange={e=>setNewItem({...newItem,price:e.target.value})} placeholder="মূল্য (৳)" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:11,fontWeight:700,color:"#166534",boxSizing:"border-box"}}/></div>
          <textarea rows={2} value={newItem.notes} onChange={e=>setNewItem({...newItem,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:7,resize:"vertical"}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setAddingNew(false)}} style={{flex:1,background:"white",border:"1px solid #ddd",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
            <button onClick={addNewItem} disabled={!newItem.varKey} style={{flex:2,background:newItem.varKey?"#1d4ed8":"#ccc",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>যোগ করুন</button>
          </div>
        </div>:<button onClick={()=>setAddingNew(true)} style={{width:"100%",background:"white",border:"2px dashed #1d4ed8",color:"#1d4ed8",borderRadius:8,padding:"9px",fontSize:11,fontWeight:600,marginBottom:8}}>+ আরেকটি ফার্নিচার যোগ করুন</button>}
      </div>
      <div style={{background:"#eff6ff",borderRadius:7,padding:"8px",marginTop:4}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:5}}><span style={{color:"#555"}}>মোট মূল্য:</span><span style={{fontWeight:700}}>{money(cust.total)}</span></div>
        <div style={{fontWeight:700,fontSize:10,color:"#1d4ed8",marginBottom:4}}>পেমেন্ট ট্র্যাকিং</div>
        {(payments||[]).map((p,i)=>editingPayIdx===i?
          <div key={i} className="no-print" style={{background:"white",borderRadius:6,padding:8,border:"1px solid #93c5fd",marginBottom:6}}>
            <div style={{display:"flex",gap:4,marginBottom:6}}>
              <div style={{flex:1}}><DateInput value={payDraft.date} onChange={v=>setPayDraft({...payDraft,date:v})} accent="#1d4ed8"/></div>
              <input type="number" value={payDraft.amount} onChange={e=>setPayDraft({...payDraft,amount:e.target.value})} style={{width:82,border:"1.5px solid #1d4ed8",borderRadius:6,padding:"6px",fontSize:11,outline:"none"}}/>
            </div>
            <input value={payDraft.note} onChange={e=>setPayDraft({...payDraft,note:e.target.value})} placeholder="নোট" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px",fontSize:10,marginBottom:6,outline:"none",boxSizing:"border-box"}}/>
            <div style={{display:"flex",gap:5}}>
              <button onClick={()=>{
                if(!payDraft.amount)return;
                const amt=parseFloat(payDraft.amount)||0;
                const otherPaid=totalPaid-(parseFloat(p.amount)||0);
                const remaining=Math.max(0,(parseFloat(cust.total)||0)-otherPaid);
                if(amt>remaining){alert(`⚠️ বাকি আছে মাত্র ${money(remaining)}, এর বেশি পেমেন্ট বসানো যাবে না — মোট মূল্যের চেয়ে বেশি পরিশোধ দেখানো যাবে না।`);return}
                const newPayments=payments.map((pp,ii)=>ii===i?{...pp,date:payDraft.date,amount:payDraft.amount,note:payDraft.note}:pp);
                onUpdateOrder({...order,payments:newPayments});
                setEditingPayIdx(null);
              }} style={{flex:1,background:"#1d4ed8",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>সংরক্ষণ</button>
              <button onClick={()=>setEditingPayIdx(null)} style={{flex:1,background:"white",color:"#666",border:"1px solid #ddd",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>বাতিল</button>
              <button onClick={()=>{
                if(!window.confirm("এই পেমেন্ট এন্ট্রিটা মুছে ফেলতে চান?"))return;
                onUpdateOrder({...order,payments:payments.filter((_,ii)=>ii!==i)});
                setEditingPayIdx(null);
              }} style={{background:"#fee2e2",color:RED,border:"none",borderRadius:6,padding:"7px 10px",fontSize:10,fontWeight:700}}>🗑</button>
            </div>
          </div>
          :<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:10,marginBottom:2,borderBottom:"1px dashed #bfdbfe",paddingBottom:2}}>
            <span>{fmtDate(p.date)} — {p.note||"পেমেন্ট"}</span>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <strong>{money(p.amount)}</strong>
              <button onClick={()=>{setEditingPayIdx(i);setPayDraft({date:p.date,amount:p.amount,note:p.note||""})}} className="no-print" style={{background:"none",border:"none",color:"#1d4ed8",fontSize:12,padding:2,cursor:"pointer"}}>✏️</button>
            </span>
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:4,marginTop:2}}><span style={{fontSize:10}}>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10,fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:RED}}>{money(rem)}</span></div>
      </div>
      <div className="no-print"><PrintLog log={printLogs?.s2}/></div>
    </div>
  </div>
}

/* ── SLIP 3: DEPT TRACKING ── */
function S3({order,onPrint,onUpdateOrder,workers}){
  const{cust,items,no,printLogs}=order;
  // বাড়ানোর সময় কোনো বাধা নেই, কিন্তু কমানোর সময় নিশ্চিত করে নেওয়া হয় — ভুলবশত টেনে
  // কমে গেলে যাতে অজান্তেই সংরক্ষিত অগ্রগতি হারিয়ে না যায়
  const dragStartRef=useRef({});
  const ip=effectiveItemProgress(order);
  const itemKey=(it,idx)=>it.itemId||`idx_${idx}`;

  const getDept=(ikey,deptId)=>((ip[ikey]||{})[deptId])||{start:"",end:"",pct:0,workers:[]};
  const patchDept=(ikey,deptId,patch)=>{
    const curItem=ip[ikey]||{};
    const cur=curItem[deptId]||{start:"",end:"",pct:0,workers:[]};
    onUpdateOrder({...order,itemProgress:{...ip,[ikey]:{...curItem,[deptId]:{...cur,...patch}}}});
  };
  const setStart=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    const newPct=val&&!cur.end?Math.max(cur.pct,20):cur.pct;
    patchDept(ikey,deptId,{start:val,pct:newPct});
  };
  const setEnd=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    patchDept(ikey,deptId,{end:val,pct:val?100:cur.pct});
  };
  const setPct=(ikey,deptId,val)=>patchDept(ikey,deptId,{pct:parseInt(val)});
  const toggleWorker=(ikey,deptId,name)=>{
    const cur=getDept(ikey,deptId);
    const list=cur.workers||[];
    const next=list.includes(name)?list.filter(w=>w!==name):[...list,name];
    patchDept(ikey,deptId,{workers:next});
  };
  const deptWorkers=(payDept)=>{
    const active=(workers||[]).filter(w=>w.active!==false);
    const matched=active.filter(w=>w.department===payDept);
    return matched.length?matched:active;
  };
  // সামগ্রিক অগ্রগতি: সব ফার্নিচারের সব বিভাগের গড়
  // প্রতিটা আইটেমের ওজনযুক্ত % বের করে, তারপর সব আইটেম মিলিয়ে সাধারণ গড় — যাতে একটা
  // আইটেমের বিভাগীয় ওজন অন্য আইটেমের সংখ্যায় প্রভাব না ফেলে
  const itemWeightedPcts=items.map((it,idx)=>{
    const ikey=itemKey(it,idx);
    return DEPTS.reduce((s,d)=>s+(getDept(ikey,d.id).pct||0)*(DEPT_WEIGHTS[d.id]||0),0);
  });
  const overallPct=itemWeightedPcts.length?Math.round(itemWeightedPcts.reduce((s,v)=>s+v,0)/itemWeightedPcts.length):0;

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#6d28d9"}}>
      <span style={{fontWeight:800,fontSize:13}}>সামগ্রিক অগ্রগতি: {overallPct}%</span>
      <PrintBtn onPrint={()=>onPrint("s3")}/>
    </div>
    <Hdr title="বিভাগ ট্র্যাকিং কপি" sub="Department Tracking" no={no} bg="#6d28d9"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f5f3ff",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/>
      </div>
      {items.length>1&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#1d4ed8"}}>ℹ️ এই অর্ডারে {items.length}টা আলাদা ফার্নিচার আছে — প্রতিটার অগ্রগতি ও কর্মী আলাদাভাবে ট্র্যাক করুন, কারণ ভিন্ন কর্মীর হাতে যেতে পারে।</div>}

      {/* Interactive (screen only) — প্রতিটা ফার্নিচার আলাদা */}
      <div className="no-print">
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          const itemAllPcts=DEPTS.map(d=>getDept(ikey,d.id).pct||0);
          const itemPct=Math.round(DEPTS.reduce((s,d,i)=>s+itemAllPcts[i]*(DEPT_WEIGHTS[d.id]||0),0));
          return<div key={ikey} style={{marginBottom:18}}>
            <div style={{background:"#6d28d9",color:"white",borderRadius:"9px 9px 0 0",padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,fontSize:12}}>[{it.code}] {it.variantBn}<span style={{fontWeight:400,opacity:0.85}}> · {it.woodBn} × {it.qty}</span></div>
              <div style={{fontWeight:800,fontSize:12}}>{itemPct}%</div>
            </div>
            <div style={{border:"1px solid #ede9fe",borderTop:"none",borderRadius:"0 0 9px 9px",padding:"10px 12px",background:"#faf9ff"}}>
              {DEPTS.map(d=>{
                const cur=getDept(ikey,d.id);
                const assigned=cur.workers||[];
                const barColor=cur.pct>=100?"#16a34a":cur.pct>=50?"#f59e0b":"#dc2626";
                const pool=deptWorkers(d.payDept);
                return<div key={d.id} style={{background:"white",border:"1px solid #ede9fe",borderRadius:9,padding:"9px 11px",marginBottom:7}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontWeight:700,fontSize:11,color:"#6d28d9"}}>{d.bn}</div>
                    <div style={{display:"flex",gap:4}}>
                      {!cur.start&&<button onClick={()=>setStart(ikey,d.id,todayStr())} style={{background:"#f0fdf4",border:"1px solid #86efac",color:"#166534",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>▶ আজ শুরু</button>}
                      {cur.start&&!cur.end&&<button onClick={()=>setEnd(ikey,d.id,todayStr())} style={{background:"#eff6ff",border:"1px solid #93c5fd",color:"#1d4ed8",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>■ আজ শেষ</button>}
                      {cur.end&&<span style={{fontSize:9,color:"#16a34a",fontWeight:700}}>✓ সম্পন্ন</span>}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শুরুর তারিখ</div><DateInput value={cur.start} onChange={v=>setStart(ikey,d.id,v)} accent="#6d28d9"/></div>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শেষের তারিখ</div><DateInput value={cur.end} onChange={v=>setEnd(ikey,d.id,v)} accent="#6d28d9"/></div>
                  </div>
                  <input type="range" min="0" max="100" value={cur.pct}
                    onMouseDown={()=>{dragStartRef.current[`${ikey}_${d.id}`]=cur.pct}}
                    onTouchStart={()=>{dragStartRef.current[`${ikey}_${d.id}`]=cur.pct}}
                    onChange={e=>setPct(ikey,d.id,e.target.value)}
                    onMouseUp={e=>{
                      const key=`${ikey}_${d.id}`;const startVal=dragStartRef.current[key];const endVal=parseInt(e.target.value);
                      if(startVal!==undefined&&endVal<startVal){
                        if(!window.confirm(`অগ্রগতি ${startVal}% থেকে কমিয়ে ${endVal}% করতে চান?`))setPct(ikey,d.id,startVal);
                      }
                      delete dragStartRef.current[key];
                    }}
                    onTouchEnd={e=>{
                      const key=`${ikey}_${d.id}`;const startVal=dragStartRef.current[key];const endVal=cur.pct;
                      if(startVal!==undefined&&endVal<startVal){
                        if(!window.confirm(`অগ্রগতি ${startVal}% থেকে কমিয়ে ${endVal}% করতে চান?`))setPct(ikey,d.id,startVal);
                      }
                      delete dragStartRef.current[key];
                    }}
                    style={{width:"100%",accentColor:barColor}}/>
                  <div style={{textAlign:"right",fontSize:10,fontWeight:800,color:barColor,marginBottom:6}}>{cur.pct}%{cur.pct>=100?" ✅":""}</div>
                  <div style={{fontSize:8,color:"#888",marginBottom:4}}>{d.payDept} বিভাগের কর্মী</div>
                  {pool.length===0?<div style={{fontSize:9,color:"#aaa"}}>পে-রোলে এই বিভাগের কোনো কর্মী নেই</div>:
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {pool.map(w=><button key={w.id} onClick={()=>toggleWorker(ikey,d.id,w.name)} style={{background:assigned.includes(w.name)?deptColor(w.department):"#f3f4f6",color:assigned.includes(w.name)?"white":"#555",border:"none",borderRadius:20,padding:"4px 10px",fontSize:9,fontWeight:600}}>{assigned.includes(w.name)?"✓ ":""}{w.name}</button>)}
                  </div>}
                </div>
              })}
            </div>
          </div>
        })}
      </div>

      {/* Print-only static table — প্রতিটা ফার্নিচার আলাদা টেবিলে */}
      <div className="print-only-table" style={{display:"none"}}>
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          return<div key={ikey} style={{marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:11,marginBottom:4}}>[{it.code}] {it.variantBn} — {it.woodBn} × {it.qty}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:"#6d28d9",color:"white"}}>{["বিভাগ","দায়িত্বে","শুরু","শেষ","স্বাক্ষর"].map(h=><th key={h} style={{padding:"6px 5px",textAlign:"left",fontWeight:700}}>{h}</th>)}</tr></thead>
              <tbody>{DEPTS.map((d,i)=>{const cur=getDept(ikey,d.id);return<tr key={d.id} style={{background:i%2===0?"#f5f3ff":"white",borderBottom:"1px solid #ede9fe"}}><td style={{padding:"8px 5px",fontWeight:600}}>{d.bn} ({cur.pct}%)</td><td style={{padding:"8px 5px",fontSize:9}}>{(cur.workers||[]).join(", ")||"—"}</td><td style={{padding:"8px 5px",color:cur.start?"#333":"#bbb"}}>{cur.start?fmtDate(cur.start):"___/___"}</td><td style={{padding:"8px 5px",color:cur.end?"#333":"#bbb"}}>{cur.end?fmtDate(cur.end):"___/___"}</td><td style={{padding:"8px 5px",color:"#bbb"}}>________</td></tr>})}</tbody>
            </table>
          </div>
        })}
      </div>

      <div className="no-print"><PrintLog log={printLogs?.s3}/></div>
    </div>
  </div>
}

/* ── SLIP 4+5: CARPENTER + TRANSPORT, এক পাতায় (v4.72) ──
   আগে এই দুটো আলাদা ট্যাব ছিল, আর একসাথে ছাপতে একটা বাড়তি বাটন লাগত। এখন দুটো মিলে
   একটাই পাতা — বাম অর্ধে কার্পেন্টার কপি, ডান অর্ধে ট্রান্সপোর্ট কপি, মাঝে ডটেড কাটার
   দাগ ও কেচি। বাকি সব স্লিপের মতোই সাধারণ "এই স্লিপ প্রিন্ট করুন" বাটনেই ছাপা হয়।
   কার্পেন্টার অংশের কাঠের মাপ এডিট করার সুবিধাটা আগের মতোই আছে (শুধু স্ক্রিনে) ── */
function S4T5({order,onPrint,db,saveDb,onUpdateOrder,woodSettings,rackSplits}){
  const{cust,items,no,printLogs,refImg,refImgs}=order;
  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const[editIdx,setEditIdx]=useState(null);
  const[editSections,setEditSections]=useState(null);

  const startEdit=(idx)=>{setEditIdx(idx);setEditSections(JSON.parse(JSON.stringify(items[idx].sections)))};
  const updatePiece=(si,pi,field,val)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces[pi][field]=field==="bn"?val:(parseFloat(val)||0);setEditSections(ns)};
  const removePiece=(si,pi)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.splice(pi,1);setEditSections(ns)};
  const addPieceToSection=(si)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.push({bn:"নতুন কাঠ",pc:1,h:24,l:12,w:1});setEditSections(ns)};
  const saveEditedItem=()=>{
    const item=items[editIdx];
    const suffix=String(Math.floor(Math.random()*900+100));
    const newCode=`${item.code}-M${suffix}`;
    const newName=`${item.variantBn.replace(/ \(কাস্টম.*\)/,"")} (কাস্টম-${suffix})`;
    if(item.catKey&&db[item.catKey]){
      const vKey=`${item.varKey||item.catKey}_mod_${suffix}`;
      const nd=JSON.parse(JSON.stringify(db));
      nd[item.catKey].variants[vKey]={bn:newName,code:newCode,sections:editSections};
      saveDb(nd);
    }
    const newItems=[...items];
    newItems[editIdx]={...item,sections:editSections,code:newCode,variantBn:newName};
    onUpdateOrder({...order,items:newItems});
    setEditIdx(null);setEditSections(null);
  };

  // ── ট্রান্সপোর্ট অংশ: র‍্যাক কোড অনুযায়ী একই মাপের কাঠ একসাথে যোগ করা ──
  const map={};
  items.forEach(it=>{(it.sections||[]).forEach(sec=>{(sec.pieces||[]).forEach(p=>{const pw=pieceWoodType(p,sec,it.wood);const info=pieceRackInfo(pw,p.w,p.h,p.l,woodSettings,rackSplits);const code=info.code;const key=`${code}__${p.h}__${p.l}__${p.w}`;const pc=p.pc*it.qty;const cv=cft(pc,p.h,p.l,p.w);const jointCount=parseInt((p.jointRules||{})[pw])||1;if(map[key]){map[key].pc+=pc;map[key].cv+=cv}else map[key]={code,name:p.bn,pc,h:p.h,l:p.l,w:p.w,cv,isSplit:info.isSplit,wood:pw,jointCount}})})});
  const list=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));
  const tot=list.reduce((s,w)=>s+w.cv,0);
  // আগের আলাদা কার্পেন্টার/ট্রান্সপোর্ট প্রিন্টের ইতিহাসও এখানেই দেখানো হয়, যাতে পুরনো রেকর্ড হারিয়ে না যায়
  const mergedLog=[...((printLogs||{}).s4||[]),...((printLogs||{}).s5||[]),...((printLogs||{}).s4t5||[])].sort();
  const sign=(a,b)=><div style={{marginTop:11,display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{[a,b].map(t=><div key={t} style={{borderTop:"1px solid #ddd",paddingTop:4,textAlign:"center",fontSize:8,color:"#888"}}>{t}</div>)}</div>;

  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#334155"}}><PrintBtn onPrint={()=>onPrint("s4t5")}/></div>
    <Hdr title="কার্পেন্টার + ট্রান্সপোর্ট কপি" sub="Carpenter + Transport — one page" no={no} bg="#334155"/>
    {(order.items||[]).some(it=>it.woodFilledAt)&&<div style={{margin:"6px 14px 0",background:"#f1f5f9",color:"#475569",borderRadius:6,padding:"5px 8px",fontSize:8.5,lineHeight:1.5}}>ℹ️ কিছু ফার্নিচারের কাঠের মাপ ডেলিভারির পরে ডেটাবেস থেকে বসানো ({fmtDate((order.items.find(it=>it.woodFilledAt)||{}).woodFilledAt)}) — তৈরির সময়ের মাপ থেকে সামান্য আলাদা হতে পারে</div>}
    <div className="no-print" style={{margin:"6px 14px 0",background:"#f8fafc",color:"#64748b",borderRadius:6,padding:"5px 8px",fontSize:8.5,lineHeight:1.5}}>✂️ প্রিন্টে বাম পাশে কার্পেন্টার কপি, ডান পাশে ট্রান্সপোর্ট কপি — মাঝের ডটেড দাগ বরাবর কেটে দুই ভাগ করে দিন। (ছোট স্ক্রিনে পড়ার সুবিধায় উপরে-নিচে দেখানো হচ্ছে, প্রিন্টে পাশাপাশিই আসবে।)</div>

    <div className="combo-wrap" style={{padding:"10px 14px"}}>
      {/* ── বাম অর্ধ: কার্পেন্টার ── */}
      <div className="combo-half">
        <div style={{textAlign:"center",fontWeight:800,fontSize:11,color:"#92400e",borderBottom:"2px solid #92400e",paddingBottom:4,marginBottom:7}}>কার্পেন্টারের কপি<div style={{fontSize:7.5,fontWeight:400,color:"#888"}}>Carpenter Copy — #{no}</div></div>
        <div style={{background:"#fef3c7",borderRadius:6,padding:"6px 8px",marginBottom:8,fontSize:9}}><IR l="গ্রাহক" v={cust.name}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/></div>
        {images.length>0&&<div style={{marginBottom:9}}>
          <div style={{fontSize:8.5,color:"#92400e",fontWeight:700,marginBottom:4,textAlign:"center"}}>গ্রাহকের রেফারেন্স ছবি — এই অনুযায়ী তৈরি করুন</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,justifyContent:"center"}}>
            {images.map((img,i)=><div key={i} style={{textAlign:"center"}}><img src={img.src} className="ref-img" alt="ref" onClick={()=>(img.fileName&&FS_SUPPORTED)?openFullResImageForPrint(img.fileName):openLightbox(img.src)} style={{maxHeight:95,cursor:"pointer"}}/><div style={{fontSize:7.5,color:"#888",marginTop:2}}>{img.caption}</div></div>)}
          </div>
        </div>}
        {items.map((it,i)=><div key={i} style={{border:"1.5px solid #92400e",borderRadius:7,overflow:"hidden",marginBottom:7,breakInside:"avoid"}}>
          <div style={{background:"#92400e",color:"white",padding:"5px 8px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
            <div style={{minWidth:0}}><div style={{fontWeight:700,fontSize:9.5}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:8,opacity:.9,marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty}</div></div>
            {editIdx!==i&&<button className="no-print" onClick={()=>startEdit(i)} style={{background:"white",color:"#92400e",border:"none",borderRadius:5,padding:"3px 7px",fontSize:8.5,fontWeight:700,flexShrink:0}}>✏️ এডিট</button>}
          </div>
          <div style={{padding:"6px 8px"}}>

/* ── v4.52: খরচের একক খতিয়ান ──
   "মোট ব্যয়", "সংগ্রহ বনাম ব্যয়", "মাসিক তারল্য", ৩০ দিনের পূর্বাভাস, কর্মীদের বেতনের চার্ট আর
   "কোন ফার্নিচারে খরচ ও লাভ কত" — সব এই একটা খতিয়ান থেকে হিসাব হয়, তাই কোথাও সংখ্যা আলাদা দেখাবে না।
   • খরচ: খরচের খাতার প্রতিটা এন্ট্রি তার নিজের তারিখে ("শ্রমিক বেতন" ক্যাটাগরি বাদে — ওটা বেতনের ভাগে)
   • বেতন: প্রতি সপ্তাহে প্রতিটা কর্মীর মোট আয় (হাজিরা × দৈনিক হার), সপ্তাহ শেষের বৃহস্পতিবারের তারিখে।
     অগ্রিম এই আয়েরই আগাম অংশ — সপ্তাহ শেষে মোট আয় থেকেই কাটা হয় — তাই আলাদা খরচ হিসেবে গোনা হয় না
   • কাঠ: সাপ্লায়ারকে যেদিন যত টাকা দেওয়া হয়েছে সেই তারিখে (লটের মোট দাম বা কেনার তারিখ নয়),
     স'মিল কাটাই বিল তার তারিখে, আর লটের পরিবহন/অন্যান্য খরচ লটের তারিখে ── */
const PAY_DEPT_SHORT={"ছুতার":"ছুতার","কারিগর":"নকশা","বার্নিশ":"বার্নিশ","পরিবহন":"পরিবহন","অন্যান্য":"অন্যান্য"};
const SALARY_SEGS=[
  {id:"ছুতার",bn:"ছুতার",color:CHART_SOFT_BLUE},
  {id:"কারিগর",bn:"নকশা",color:CHART_SOFT_ORANGE},
  {id:"বার্নিশ",bn:"বার্নিশ",color:CHART_SOFT_GREEN},
  {id:"পরিবহন",bn:"পরিবহন",color:"#e4dcf5"},
  {id:"অন্যান্য",bn:"অন্যান্য",color:CHART_SOFT_GREY},
  {id:"__exp",bn:"খরচের খাতায় লেখা বেতন",color:CHART_SOFT_PINK}
];
// কলামে নিচ থেকে উপরে: বেতন → কাঠ → খরচ
const SPEND_SEGS=[
  {id:"salary",bn:"বেতন",color:CHART_SOFT_BLUE},
  {id:"wood",bn:"কাঠ",color:CHART_SOFT_ORANGE},
  {id:"expense",bn:"খরচ",color:CHART_SOFT_TEAL}
];
function buildSpendLedger(expenses,payrollWeeks,workers,woodLots){
  const out=[];
  const wById={};(workers||[]).forEach(w=>{if(w&&w.id)wById[w.id]=w});
  (expenses||[]).forEach(e=>{
    const amt=parseFloat(e&&e.total)||0;
    if(!amt||!e.date)return;
    const date=String(e.date).slice(0,10);
    if(e.category==="salary"){out.push({date,amount:amt,kind:"salary",seg:"__exp",label:"খরচের খাতায় লেখা বেতন"});return}
    const c=EXP_CATS.find(x=>x.id===e.category);
    out.push({date,amount:amt,kind:"expense",seg:"expense",label:c?c.bn:(e.category||"অন্যান্য"),supplier:(e.supplier||"").trim()});
  });
  Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{
    const snaps=(wd&&wd.wstat)||{};

      const rate=w?(parseFloat(w.dailyRate)||0):(sn?(parseFloat(sn.rate)||0):0);
      const d=parseFloat(days)||0;
      const amt=d*rate;
      if(!amt)return;
      const deptRaw=w?w.department:(sn&&sn.dept);
      const dept=PAYROLL_DEPTS.includes(deptRaw)?deptRaw:"অন্যান্য";
      out.push({date:weekEnd,amount:amt,kind:"salary",seg:dept,label:PAY_DEPT_SHORT[dept]||dept,workerId:wid,workerName:(w&&w.name)||(sn&&sn.name)||"(মুছে ফেলা কর্মী)",days:d});
    });
  });
  (woodLots||[]).forEach(l=>{
    if(!l)return;
    const sup=(l.supplier||"").trim()||"অজানা সাপ্লায়ার";
    (l.payments||[]).forEach(p=>{const amt=parseFloat(p&&p.amount)||0;if(amt&&p.date)out.push({date:String(p.date).slice(0,10),amount:amt,kind:"wood",seg:"wood",label:"সাপ্লায়ারকে পেমেন্ট",supplier:sup})});
    (l.millingEntries||[]).forEach(m=>{const amt=parseFloat(m&&m.billAmount)||0;if(amt&&m.date)out.push({date:String(m.date).slice(0,10),amount:amt,kind:"wood",seg:"wood",label:"স'মিল কাটাই"})});
    const extra=(parseFloat(l.transportCost)||0)+(parseFloat(l.otherCost)||0);
    if(extra&&l.date)out.push({date:String(l.date).slice(0,10),amount:extra,kind:"wood",seg:"wood",label:"কাঠের পরিবহন ও অন্যান্য"});
  });
  return out;
}
// ── সময়ের ভাগ: সপ্তাহ = শুক্র থেকে বৃহস্পতি (পে-রোলের মতোই), চেনা হয় তার বৃহস্পতিবার দিয়ে ──
const thursdayOf=(ds)=>{const d=parseISO(ds);d.setUTCDate(d.getUTCDate()+((4-d.getUTCDay()+7)%7));return toISO(d)};
const periodKeyOf=(ds,mode)=>mode==="week"?thursdayOf(ds):mode==="year"?String(ds).slice(0,4):String(ds).slice(0,7);
function lastPeriodKeys(mode,today,entries){
  const keys=[];
  if(mode==="week"){const t=thursdayOf(today);for(let i=11;i>=0;i--)keys.push(addDays(t,-7*i))}
  else if(mode==="month"){const d=parseISO(today);for(let i=11;i>=0;i--)keys.push(toISO(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-i,1))).slice(0,7))}
  else{
    const cy=+String(today).slice(0,4);
    let minY=cy;(entries||[]).forEach(e=>{const y=+String(e.date||"").slice(0,4);if(y&&y<minY)minY=y});
    const from=Math.min(Math.max(minY,cy-5),cy-2);
    for(let y=from;y<=cy;y++)keys.push(String(y));
  }
  return keys;
}
const periodShortLabel=(mode,key)=>{
  if(mode==="week"){const d=parseISO(key);return`${toBnDigits(d.getUTCDate())}/${toBnDigits(d.getUTCMonth()+1)}`}
  if(mode==="month")return monthName(+key.slice(5,7)-1);
  return toBnDigits(key);
};
const periodLongLabel=(mode,key)=>{
  if(mode==="week"){const e=parseISO(key),st=parseISO(addDays(key,-6));return`${toBnDigits(st.getUTCDate())} ${monthName(st.getUTCMonth())} – ${toBnDigits(e.getUTCDate())} ${monthName(e.getUTCMonth())} ${toBnDigits(e.getUTCFullYear())}`}
  if(mode==="month")return`${monthName(+key.slice(5,7)-1)} ${toBnDigits(key.slice(0,4))}`;
  return`${toBnDigits(key)} সাল`;
};
// ── একটা ফার্নিচার কবে "তৈরি শেষ": চার বিভাগই ১০০% হলে শেষ বিভাগের শেষ তারিখ (পে-রোল বনাম
// উৎপাদনের মতোই); ট্র্যাকিং না থাকলে ডেলিভারির তারিখ ──
function itemDoneDate(o,it,idx,ip){
  const prog=((ip||effectiveItemProgress(o))[it.itemId||`idx_${idx}`])||{};
  const ends=DEPTS.map(d=>prog[d.id]&&prog[d.id].end).filter(Boolean);
  const pcts=DEPTS.map(d=>(prog[d.id]&&prog[d.id].pct)||0);
  if(ends.length===DEPTS.length&&pcts.every(p=>p>=100))return String(ends.slice().sort().pop()).slice(0,10);
  if(o.delivered)return String(o.deliveredAt||(o.cust&&(o.cust.delivery||o.cust.date))||"").slice(0,10)||null;
  return null;
}
// ── অর্ডারের কাঠ কবে গেল: পরিবহন বিভাগের তারিখ (শেষ, না থাকলে শুরু); না থাকলে অর্ডারের তারিখ ──
function itemWoodDate(o,it,idx,ip){
  const t=(((ip||effectiveItemProgress(o))[it.itemId||`idx_${idx}`])||{}).transport;
  return String((t&&(t.end||t.start))||(o.cust&&o.cust.date)||"").slice(0,10)||null;
}
/* ── v4.61: কোন ফার্নিচারে খরচ ও লাভ কত — প্রতিটা ফার্নিচারের আসল তৈরির সময় ধরে ──
   বিক্রি: ডেলিভারি হওয়া অর্ডারের দাম × পরিমাণ
   কাঠ: অর্ডারে যত CFT কাঠ গেছে × অর্ডারের সময়ের কাঠের দাম (অপচয় ধরা চূড়ান্ত দাম)
   বেতন ও অন্যান্য খরচ: ফার্নিচারের তৈরির সময়কাল = প্রথম বিভাগে কাজ শুরুর দিন থেকে শেষ বিভাগের শেষ দিন।
   শেষের তারিখ না থাকলে ডেলিভারির তারিখ; শুরুর তারিখ না থাকলে ট্র্যাক করা ফার্নিচারের গড় তৈরির সময়।
   প্রতিটা সপ্তাহের (শুক্র–বৃহস্পতি) বেতন আর খরচ সেই সপ্তাহে যেসব ফার্নিচারে কাজ চলছিল তাদের মধ্যে
   CFT অনুযায়ী ভাগ হয় (একটা ফার্নিচারের CFT তার পুরো সময়কাল জুড়ে সমানভাবে ছড়ানো)। যে সপ্তাহে কোনো
   ফার্নিচারে কাজ চলেনি, সেই বেতন/খরচ "কোনো ফার্নিচারে না বসা" হিসেবে আলাদা থাকে। পে-রোল শুরুর আগের
   অংশে সেটিংসের শ্রম-হার, খরচের খাতা শুরুর আগের অংশে গড় খরচ/CFT ধরা হয় ── */
function furnitureCosting(orders,ledger,woodSettings,laborSettings,db,bottleneckDeptId){
  const today=todayStr();
  const active=(orders||[]).filter(o=>o&&!o.cancelled);
  const ipCache=new Map();const ipOf=(o)=>{if(!ipCache.has(o))ipCache.set(o,effectiveItemProgress(o));return ipCache.get(o)};
  // ১) প্রতিটা ফার্নিচারের তৈরির সময়কাল
  const all=[];
  active.forEach(o=>{const ip=ipOf(o);(o.items||[]).forEach((it,idx)=>{
    const qty=parseFloat(it.qty)||1;
    const cft=totalCft(it.sections||[])*qty;
    const prog=ip[it.itemId||`idx_${idx}`]||{};
    const starts=DEPTS.map(d=>prog[d.id]&&prog[d.id].start).filter(Boolean).map(x=>String(x).slice(0,10)).sort();
    const ends=DEPTS.map(d=>prog[d.id]&&prog[d.id].end).filter(Boolean);
    const tracked=ends.length===DEPTS.length&&DEPTS.every(d=>((prog[d.id]&&prog[d.id].pct)||0)>=100);
    const done=itemDoneDate(o,it,idx,ip);
    let start=starts[0]||null,end=done||null,inProgress=false,startAssumed=false;
    const endIsDelivery=!!(done&&!tracked);
    if(!end&&start){end=today;inProgress=true}
    if(start&&end&&start>end)start=end;
    all.push({o,it,idx,ip,qty,cft,start,end,inProgress,startAssumed,endIsDelivery,tracked});
  })});
  const durs=all.filter(x=>x.start&&x.end&&x.tracked).map(x=>daysBetween(x.start,x.end)).filter(d=>d>=0&&d<=365);
  const avgDur=durs.length?Math.max(1,Math.round(durs.reduce((a,b)=>a+b,0)/durs.length)):21;
  all.forEach(x=>{if(x.end&&!x.start){x.start=addDays(x.end,-avgDur);x.startAssumed=true}});
  // ২) প্রতি সপ্তাহে কোন ফার্নিচারে কতটা কাজ
  const weekW={};
  all.forEach(x=>{
    x.weeks={};
    if(!(x.cft>0)||!x.start||!x.end)return;
    const total=daysBetween(x.start,x.end)+1;
    let d=x.start,guard=0;
    while(d<=x.end&&guard++<400){
      const w=thursdayOf(d);
      const segEnd=w<x.end?w:x.end;
      const days=daysBetween(d,segEnd)+1;
      const wt=x.cft*days/total;
      x.weeks[w]=(x.weeks[w]||0)+wt;
      weekW[w]=(weekW[w]||0)+wt;
      d=addDays(segEnd,1);
    }
  });
  // ৩) প্রতি সপ্তাহের বেতন ও অন্যান্য খরচ
  const salW={},expW={};
  (ledger||[]).forEach(e=>{if(!e.date)return;const w=thursdayOf(e.date);if(e.kind==="salary")salW[w]=(salW[w]||0)+e.amount;else if(e.kind==="expense")expW[w]=(expW[w]||0)+e.amount});
  const firstKey=(m)=>{const k=Object.keys(m).sort();return k.length?k[0]:null};
  const salStart=firstKey(salW),expStart=firstKey(expW);
  let expSum=0,wSum=0;Object.keys(weekW).forEach(w=>{if(expStart&&w>=expStart&&w<=thursdayOf(today)){wSum+=weekW[w];expSum+=(expW[w]||0)}});
  const expAvg=wSum>0?expSum/wSum:0;
  // ৪) ভাগ বসানো
  all.forEach(x=>{
    x.woodCost=itemWoodCost(x.it,x.o,woodSettings);
    x.revenue=(parseFloat(x.it.price)||0)*x.qty;
    // কাজই শুরু হয়নি (শুরু বা শেষ কোনো তারিখ নেই, ডেলিভারিও হয়নি) — এখনো কোনো বেতন/খরচ বসে না
    if(!x.start||!x.end){x.salary=0;x.expense=0;x.salBasis="none";return}
    let sal=0,exp=0,covS=0,covE=0;
    Object.entries(x.weeks).forEach(([w,wt])=>{
      const W=weekW[w]||0;if(W<=0)return;
      if(salStart&&w>=salStart){sal+=(salW[w]||0)*wt/W;covS+=wt}
      if(expStart&&w>=expStart){exp+=(expW[w]||0)*wt/W;covE+=wt}
    });
    const lRate=orderLabourRate(x.o,laborSettings);
    const unS=Math.max(0,x.cft-covS),unE=Math.max(0,x.cft-covE);
    x.salary=sal+unS*lRate;
    x.expense=exp+unE*expAvg;
    x.salBasis=covS<=0.0001?"setting":(unS>0.001?"mixed":"weeks");
  });
  // ৫) কোনো ফার্নিচারে না বসা সপ্তাহ
  const idle={};
  new Set([...Object.keys(salW),...Object.keys(expW)]).forEach(w=>{if(!(weekW[w]>0))idle[w]={salary:salW[w]||0,expense:expW[w]||0}});
  // ৬) ডেলিভারি হওয়া ফার্নিচার — ক্যাটাগরি অনুযায়ী
  const cats={};
  all.filter(x=>x.o.delivered&&x.revenue>0).forEach(x=>{
    const o=x.o,it=x.it;
    const catLabel=(db&&it.catKey&&db[it.catKey]&&db[it.catKey].bn)?db[it.catKey].bn:(((it.variantBn||"").split(" ")[0])||it.code||"অন্যান্য");
    const cost=x.woodCost+x.salary+x.expense;
    const c=cats[catLabel]||(cats[catLabel]={label:catLabel,revenue:0,cft:0,woodCost:0,salaryCost:0,expenseCost:0,cost:0,count:0,rows:[],bottleneckDays:0,bnSamples:0});
    c.revenue+=x.revenue;c.cft+=x.cft;c.woodCost+=x.woodCost;c.salaryCost+=x.salary;c.expenseCost+=x.expense;c.cost+=cost;c.count+=1;
    c.rows.push({no:o.no,cust:(o.cust&&o.cust.name)||"",model:it.variantBn||"",wood:it.woodBn||"",woodDate:itemWoodDate(o,it,x.idx,x.ip),start:x.start,end:x.end,startAssumed:x.startAssumed,endIsDelivery:x.endIsDelivery,cft:x.cft,woodRate:x.cft>0?x.woodCost/x.cft:0,woodCost:x.woodCost,salaryCost:x.salary,expenseCost:x.expense,revenue:x.revenue,profit:x.revenue-cost,salBasis:x.salBasis,woodFilledAt:it.woodFilledAt||null});
    if(bottleneckDeptId){
      const bn=(x.ip[it.itemId||`idx_${x.idx}`]||{})[bottleneckDeptId];
      if(bn&&bn.start&&bn.end){const dd=daysBetween(bn.start,bn.end);if(dd>=0){c.bottleneckDays+=Math.max(dd,0.5);c.bnSamples+=1}}
    }
  });
  const ranked=Object.values(cats).map(c=>({...c,labourCost:c.salaryCost,profit:c.revenue-c.cost,margin:c.revenue>0?((c.revenue-c.cost)/c.revenue)*100:0,profitPerBnDay:c.bottleneckDays>0?(c.revenue-c.cost)/c.bottleneckDays:null})).sort((a,b)=>b.margin-a.margin);
  ranked.forEach(c=>c.rows.sort((a,b)=>String(b.end||"").localeCompare(String(a.end||""))));
  // ৭) মাস অনুযায়ী সারাংশ (শেষ ১২ মাস)
  const mAgg={};
  const addM=(w,key,val)=>{const m=w.slice(0,7);const r=(mAgg[m]=mAgg[m]||{cft:0,salary:0,expense:0,idleSalary:0,idleExpense:0});r[key]+=val};
  Object.entries(weekW).forEach(([w,v])=>addM(w,"cft",v));
  Object.entries(salW).forEach(([w,v])=>addM(w,"salary",v));
  Object.entries(expW).forEach(([w,v])=>addM(w,"expense",v));
  Object.entries(idle).forEach(([w,v])=>{addM(w,"idleSalary",v.salary);addM(w,"idleExpense",v.expense)});
  const nowD=parseISO(today);
  const months=[];
  for(let i=11;i>=0;i--){
    const key=toISO(new Date(Date.UTC(nowD.getUTCFullYear(),nowD.getUTCMonth()-i,1))).slice(0,7);
    const r=mAgg[key]||{cft:0,salary:0,expense:0,idleSalary:0,idleExpense:0};
    months.push({key,label:`${monthName(+key.slice(5,7)-1)} ${toBnDigits(key.slice(2,4))}`,...r,
      salPerCft:r.cft>0?(r.salary-r.idleSalary)/r.cft:null,expPerCft:r.cft>0?(r.expense-r.idleExpense)/r.cft:null});
  }
  // ৮) সাম্প্রতিক হার (নতুন অর্ডারের দামের পরামর্শে): শেষ ১২টা পূর্ণ সপ্তাহ
  const curW=thursdayOf(today);let rs=0,re=0,rw=0;
  for(let i=1;i<=12;i++){const w=addDays(curW,-7*i);if(weekW[w]>0){rw+=weekW[w];rs+=salW[w]||0;re+=expW[w]||0}}
  const recent={salPerCft:rw>0?rs/rw:null,expPerCft:rw>0?re/rw:null};
  // ৯) লাভ-ক্ষতি রিপোর্টের জন্য প্রতিটা ফার্নিচারের সারাংশ
  const items=all.map(x=>({no:x.o.no,cust:(x.o.cust&&x.o.cust.name)||"",model:x.it.variantBn||"",delivered:!!x.o.delivered,deliveredAt:String(x.o.deliveredAt||"").slice(0,10),revenue:x.revenue,cft:x.cft,woodCost:x.woodCost,salary:x.salary,expense:x.expense,start:x.start,end:x.end,inProgress:x.inProgress,startAssumed:x.startAssumed,endIsDelivery:x.endIsDelivery,woodFilledAt:x.it.woodFilledAt||null}));
  return{ranked,months,hasPayroll:salStart!==null,idle,recent,avgDur,items};
}
// ── স্তূপ-কলাম চার্ট: প্রতিটা কলাম একটা সময় (সপ্তাহ/মাস/বছর), ভেতরে ভাগগুলো রঙে রঙে ──

  return<div style={{display:"flex",alignItems:"stretch",gap:3,height}}>
    {bars.map(b=>{const on=b.key===selectedKey;return<div key={b.key} onClick={()=>onSelect&&onSelect(b.key)} style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",alignItems:"center",height:"100%",cursor:"pointer"}}>
      <div style={{flex:1,width:"100%",display:"flex",flexDirection:"column",justifyContent:"flex-end",alignItems:"center"}}>
        <div style={{fontSize:6.5,color:on?"#222":"#888",fontWeight:on?800:500,marginBottom:1,whiteSpace:"nowrap"}}>{b.total>0?shortK(b.total):""}</div>
        <div style={{width:"80%",height:`${(b.total/maxV)*100}%`,minHeight:b.total>0?2:0,display:"flex",flexDirection:"column-reverse",borderRadius:"3px 3px 0 0",overflow:"hidden",boxShadow:on?"0 0 0 2px #334155":"none",opacity:b.partial&&!on?0.72:1}}>
          {segs.map(sg=>{const v=b.values[sg.id]||0;return v>0?<div key={sg.id} style={{height:`${(v/b.total)*100}%`,background:sg.color,flexShrink:0}}></div>:null})}
        </div>
      </div>
      <div style={{fontSize:6.5,color:on?"#222":"#999",fontWeight:on?800:400,marginTop:3,whiteSpace:"nowrap"}}>{b.label}</div>
    </div>})}
  </div>;
}

const PERIOD_MODES=[{id:"week",bn:"সাপ্তাহিক",unit:"সপ্তাহ",gen:"সপ্তাহের"},{id:"month",bn:"মাসিক",unit:"মাস",gen:"মাসের"},{id:"year",bn:"বাৎসরিক",unit:"বছর",gen:"বছরের"}];

function SpendPeriodChart({icon,title,note,entries,segs,segOf,renderDetail,accent="#166534",avgWindow=null}){
  const[mode,setMode]=useState("month");
  const[sel,setSel]=useState(null);
  const bars=useMemo(()=>{
    const keys=lastPeriodKeys(mode,todayStr(),entries);
    const at={};keys.forEach((k,i)=>at[k]=i);

    (entries||[]).forEach(e=>{if(!e.date)return;const i=at[periodKeyOf(e.date,mode)];if(i===undefined)return;const b=out[i];const sg=segOf(e);b.values[sg]=(b.values[sg]||0)+e.amount;b.total+=e.amount;b.entries.push(e)});
    if(out.length)out[out.length-1].partial=true;
    return out;
  },[entries,mode]);
  const pm=PERIOD_MODES.find(p=>p.id===mode)||PERIOD_MODES[1];const unit=pm.unit;
  const cur=bars[bars.length-1],last=bars[bars.length-2],before=bars[bars.length-3];
  const firstNZ=bars.findIndex(b=>b.total>0);
  const completeAll=firstNZ>=0?bars.slice(firstNZ,bars.length-1):[];
  // ── v4.69: avgWindow দেওয়া থাকলে শুধু শেষ ওই কয়টা পূর্ণ সময়কাল দিয়ে গড় — নাহলে আগের
  // মতোই যত পূর্ণ সময়কাল পাওয়া যায় সব কটা দিয়ে ──
  const complete=avgWindow?completeAll.slice(-avgWindow):completeAll;
  const avg=complete.length?complete.reduce((t,b)=>t+b.total,0)/complete.length:0;
  const chg=last&&before&&before.total>0?((last.total-before.total)/before.total)*100:null;
  const selKey=sel&&bars.some(b=>b.key===sel)?sel:(cur?cur.key:null);
  const selBar=bars.find(b=>b.key===selKey);
  const usedSegs=segs.filter(sg=>bars.some(b=>(b.values[sg.id]||0)>0));
  return<div style={{marginBottom:18}}>

    </div>
    <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"10px 8px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:10}}>
        <MiniStat label={`চলতি ${unit}`} value={money(Math.round(cur?cur.total:0))} sub="এখনো চলছে"/>
        <MiniStat label={`গত ${unit}`} value={money(Math.round(last?last.total:0))} sub={chg===null?"":`${chg>=0?"↑":"↓"} ${toBnDigits(Math.abs(chg).toFixed(0))}% (আগের ${pm.gen} তুলনায়)`} subColor={chg===null?"#aaa":chg>0?CHART_SOFT_RED:CHART_SOFT_GREEN}/>
        <MiniStat label={`গড় প্রতি ${unit}`} value={money(Math.round(avg))} sub={complete.length?`শেষ ${toBnDigits(complete.length)}টা পূর্ণ ${unit}`:""}/>
      </div>
      <StackedBars bars={bars} segs={segs} selectedKey={selKey} onSelect={setSel}/>
      <div style={{display:"flex",flexWrap:"wrap",gap:"4px 12px",justifyContent:"center",marginTop:8}}>
        {usedSegs.map(sg=><div key={sg.id} style={{display:"flex",alignItems:"center",gap:4,fontSize:9.5,color:"#666"}}><div style={{width:9,height:9,background:sg.color,borderRadius:2}}></div>{sg.bn}</div>)}
      </div>
      <div style={{fontSize:8.5,color:"#aaa",textAlign:"center",marginTop:5}}>কলামের উপরের সংখ্যা হাজার টাকায় · যেকোনো কলামে চাপলে সেই সময়ের বিস্তারিত নিচে দেখাবে</div>
    </div>
    {selBar&&renderDetail&&<div style={{background:"#fafafa",border:"1px solid #eee",borderRadius:10,padding:"11px 12px",marginTop:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,marginBottom:7}}>
        <span style={{fontSize:11.5,fontWeight:700,color:"#333"}}>📅 {periodLongLabel(mode,selBar.key)}{selBar.partial?" (চলতি)":""}</span>
        <span style={{fontSize:13,fontWeight:800,color:accent,flexShrink:0}}>{money(Math.round(selBar.total))}</span>

function BarChart({data,height=140,color=CHART_SOFT_RED,formatY}){
  const max=Math.max(...data.map(d=>d.value),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const barH=(d.value/max)*(height-24);
        return<g key={i}>
          <rect x={i*w+w*0.15} y={height-24-barH} width={w*0.7} height={barH} fill={d.color||color} rx="1"/>
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:2}}>
      {data.map((d,i)=><div key={i} style={{fontSize:10,fontWeight:700,color:d.color||color,textAlign:"center",flex:1}}>{formatY?formatY(d.value):d.value}</div>)}
    </div>
  </div>
}
function DualBarChart({data,height=150,labelA="গত বছর",labelB="এই বছর",showValues=false}){

  if(pct===null||pct===undefined)return<span style={{fontSize:9,color:"#cbd5e1",fontWeight:700,flexShrink:0}}>{hasNow?"নতুন":"—"}</span>;

  </span>;

function WoodUsageChart({orders}){
  const st=useMemo(()=>{
    const today=todayStr();
    const curY=+String(today).slice(0,4);
    const years=[curY-2,curY-1,curY];          // পুরনো → নতুন
    const md=String(today).slice(5);            // "MM-DD" — বছরের একই সময় পর্যন্ত তুলনার জন্য
    const byWood={};
    const ensure=(w)=>byWood[w]||(byWood[w]={y:{},ytdNow:0,ytdPrev:0,running:0});
    (orders||[]).forEach(o=>{
      if(!o||o.cancelled)return;
      const ip=effectiveItemProgress(o);
      const isRunning=!o.delivered&&!isOrderFullyProgressed(o);
      (o.items||[]).forEach((it,idx)=>{
        // কাঠ কবে গেল — পরিবহন বিভাগের তারিখ, না থাকলে অর্ডারের তারিখ (খরচের হিসাবেও এই নিয়ম)
        const wd=itemWoodDate(o,it,idx,ip);
        const yr=wd?+String(wd).slice(0,4):null;
        const dayPart=wd?String(wd).slice(5):null;
        (it.sections||[]).forEach(sec=>{
          (sec.pieces||[]).forEach(p=>{
            const pw=pieceWoodType(p,sec,it.wood);
            const cv=cft((p.pc||0)*(it.qty||1),p.h,p.l,p.w);
            if(!pw||!(cv>0))return;
            const rec=ensure(pw);
            if(yr&&years.indexOf(yr)>=0)rec.y[yr]=(rec.y[yr]||0)+cv;
            // প্রবৃদ্ধি সৎভাবে মাপতে: চলতি বছরের আজ পর্যন্ত বনাম গত বছরের ঠিক এই দিন পর্যন্ত
            if(yr===curY&&dayPart&&dayPart<=md)rec.ytdNow+=cv;
            if(yr===curY-1&&dayPart&&dayPart<=md)rec.ytdPrev+=cv;
            if(isRunning)rec.running+=cv;
          });
        });
      });
    });
    const rows=Object.keys(WOOD).map(wt=>{
      const rec=byWood[wt]||{y:{},ytdNow:0,ytdPrev:0,running:0};
      const vals=years.map(yy=>rec.y[yy]||0);
      const total=vals.reduce((a,b)=>a+b,0);
      const growth=rec.ytdPrev>0?((rec.ytdNow-rec.ytdPrev)/rec.ytdPrev)*100:null;
      return{key:wt,bn:WOOD[wt].bn,color:WOOD_CHART_COLORS[wt]||"#888",vals,total,growth,
        ytdNow:rec.ytdNow,ytdPrev:rec.ytdPrev,running:rec.running};
    }).filter(r=>r.total>0||r.running>0).sort((a,b)=>b.total-a.total);
    const max=Math.max(1,...rows.map(r=>Math.max(...r.vals)));
    const yearTotals=years.map((_,i)=>rows.reduce((t,r)=>t+r.vals[i],0));
    const ytdNow=rows.reduce((t,r)=>t+r.ytdNow,0),ytdPrev=rows.reduce((t,r)=>t+r.ytdPrev,0);
    const grandGrowth=ytdPrev>0?((ytdNow-ytdPrev)/ytdPrev)*100:null;
    const runRows=rows.filter(r=>r.running>0).sort((a,b)=>b.running-a.running);
    const runTotal=rows.reduce((t,r)=>t+r.running,0);
    return{years,rows,max,yearTotals,grandGrowth,ytdNowAll:ytdNow,runRows,runTotal,curY};
  },[orders]);

  return<div style={{marginBottom:18}}>
    <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:3}}>🪚 কাঠের ব্যবহার — শেষ ৩ বছর (CFT)</div>
    <div style={{fontSize:9,color:"#999",marginBottom:8,lineHeight:1.6}}>কোন কাঠ কত CFT লেগেছে, বছরভেদে। কাঠ যেদিন পরিবহন বিভাগ থেকে বেরিয়েছে সেই তারিখ ধরা হয়। শতকরা = চলতি বছরের আজ পর্যন্ত বনাম গত বছরের একই সময় পর্যন্ত।</div>
    <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 13px"}}>
      {st.rows.length===0?<div style={{fontSize:11,color:"#999",textAlign:"center",padding:"18px 0"}}>এখনো কাঠ ব্যবহারের কোনো হিসাব নেই</div>:<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:11}}>
          {st.years.map((yy,i)=><div key={yy} style={{background:yy===st.curY?"#f0fdf4":"#f8fafc",border:`1px solid ${yy===st.curY?"#bbf7d0":"#eef2f7"}`,borderRadius:8,padding:"7px 6px",textAlign:"center"}}>
            <div style={{fontSize:9,color:"#94a3b8",fontWeight:700}}>{toBnDigits(yy)}{yy===st.curY?" • চলতি":""}</div>
            <div style={{fontSize:14,fontWeight:800,color:"#334155",lineHeight:1.35}}>{st.yearTotals[i].toFixed(1)}</div>
            <div style={{fontSize:8,color:"#b6c2cf",fontWeight:600}}>CFT</div>
          </div>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7,fontSize:10,color:"#64748b",background:"#f8fafc",borderRadius:7,padding:"6px 9px",marginBottom:11}}>
          <span style={{flex:1}}>সব কাঠ মিলিয়ে — গত বছরের একই সময়ের তুলনায়</span>
          <WoodGrowthBadge pct={st.grandGrowth} hasNow={st.ytdNowAll>0}/>
        </div>
        {st.rows.map((r,ri)=><div key={r.key} style={{paddingTop:ri===0?0:9,marginTop:ri===0?0:9,borderTop:ri===0?"none":"1px solid #f1f5f9"}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6}}>
            <span style={{width:11,height:11,borderRadius:3,background:r.color,flexShrink:0}}></span>

            <span style={{fontSize:12,fontWeight:800,color:"#334155",flexShrink:0}}>{r.total.toFixed(1)}<span style={{fontSize:8.5,fontWeight:600,color:"#b6c2cf"}}> CFT</span></span>

          {st.years.map((yy,i)=>{
