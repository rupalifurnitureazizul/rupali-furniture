          <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:6}}>👤 আগে অর্ডার করেছেন এমন গ্রাহক পাওয়া গেছে</div>
          {customerSuggestions.map(cust=><div key={cust.phone} onClick={()=>pickCustomer(cust)} style={{background:"white",borderRadius:8,padding:"9px 10px",marginBottom:6,cursor:"pointer",border:"1px solid #fef3c7"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,fontSize:13}}>{cust.name} <span style={{fontSize:11,color:"#888",fontWeight:400}}>· {cust.phone}</span></div>
              <span style={{background:"#92400e",color:"white",fontSize:9,fontWeight:700,borderRadius:12,padding:"2px 8px",flexShrink:0}}>র‍্যাংক #{cust.rank}</span>
            </div>
            {cust.address&&<div style={{fontSize:10,color:"#999",marginTop:2}}>📍 {cust.address}</div>}
            <div style={{marginTop:5,paddingTop:5,borderTop:"1px dashed #f0e0c0"}}>
              {cust.pastOrders.slice(0,3).map((po,pi)=><div key={pi} style={{fontSize:10,color:"#666",display:"flex",justifyContent:"space-between",marginBottom:1}}>
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{fmtDate(po.date)} — {po.items}</span>
                <strong style={{color:"#166534"}}>{money(po.total)}</strong>
              </div>)}
              {cust.pastOrders.length>3&&<div style={{fontSize:9,color:"#aaa"}}>...ও আরও {cust.pastOrders.length-3}টি অর্ডার</div>}
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginTop:3}}>সর্বমোট ক্রয়: {money(cust.totalSpent)}</div>
            </div>
          </div>)}
        </div>}
        <div style={{marginBottom:11}}>
          {lbl("২য় মোবাইল (ঐচ্ছিক)")}
          <input type="tel" value={c.phone2} onChange={e=>setC({...c,phone2:e.target.value})} placeholder="বিকল্প নম্বর, না থাকলে খালি রাখুন" style={inp}/>
        </div>
        <div style={{marginBottom:11}}>
          {lbl("ঠিকানা")}
          <input type="text" value={c.address} onChange={e=>setC({...c,address:e.target.value})} placeholder="বিস্তারিত ঠিকানা" style={inp}/>
        </div>
        <div style={{marginBottom:14}}>{lbl("বিশেষ মন্তব্য")}<textarea rows={2} value={c.notes} onChange={e=>setC({...c,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={()=>setStep(2)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"14px",fontSize:14,fontWeight:700}}>পরবর্তী →</button>
      </>}
      {step===2&&<>
        <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📷 রেফারেন্স ছবি (ঐচ্ছিক, একাধিক যোগ করা যাবে)</div>
          {refImgs.map((img,idx)=><div key={idx} style={{marginBottom:10,background:"#fafafa",borderRadius:8,padding:8}}>
            <img src={img.src} onClick={()=>openLightbox(img.src)} style={{maxWidth:"100%",maxHeight:140,objectFit:"contain",borderRadius:7,border:"1px solid #eee",display:"block",margin:"0 auto 6px",cursor:"pointer"}} alt="ref"/>
            <div style={{display:"flex",gap:6}}>
              <input value={img.caption} onChange={e=>updateCaption(idx,e.target.value)} placeholder="ক্যাপশন" style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none"}}/>
              <button onClick={()=>removeRefImg(idx)} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"6px 10px",color:RED,fontSize:11}}>✕</button>
            </div>
          </div>)}
          <input ref={refInput} type="file" accept="image/*" multiple onChange={handleRefImg} style={{display:"none"}}/>
          <button onClick={()=>refInput.current.click()} style={{width:"100%",background:"#f0f0f0",border:"2px dashed #aaa",borderRadius:9,padding:"10px",fontSize:12,color:"#555"}}>📂 ছবি বেছে নিন বা স্ক্যান করুন (একাধিক)</button>
        </div>
        {items.map((it,i)=><div key={i} style={{background:"white",borderRadius:10,padding:"10px 12px",marginBottom:8,borderLeft:`4px solid ${RED}`,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div><div style={{fontWeight:700,fontSize:13}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:11,color:"#666",marginTop:2}}>কাঠ: {it.woodBn} | পরিমাণ: {it.qty} | CFT: {(totalCft(it.sections)*it.qty).toFixed(2)}</div>{it.price&&<div style={{fontSize:12,color:"#166534",fontWeight:700,marginTop:2}}>মূল্য: {money((parseFloat(it.price)||0)*(parseFloat(it.qty)||1))} <span style={{fontSize:10,color:"#999",fontWeight:400}}>({money(it.price)}/একক × {it.qty})</span></div>}{it.notes&&<div style={{fontSize:10,color:"#888",marginTop:1}}>⚙ {it.notes}</div>}</div>
            <button onClick={()=>setItems(items.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"4px 8px",color:RED,fontSize:11}}>বাদ</button>
          </div>
        </div>)}
        {adding?<div style={{background:"white",borderRadius:12,padding:"14px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:11}}>ফার্নিচার যোগ করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={ni.catKey} varKey={ni.varKey} onSelect={(ck,vk)=>setNi({...ni,catKey:ck,varKey:vk})}/>
          {fVar&&isEmptyWood(fVar)&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#991b1b"}}>⚠️ এই মডেলের কাঠের মাপ এখনো যোগ করা হয়নি। অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে যোগ করুন।</div>}
          {lbl("কাঠের ধরন")}
          <select value={ni.wood} onChange={e=>setNi({...ni,wood:e.target.value})} style={{...inp,marginBottom:10}}>
            {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn} ({v.en})</option>)}
          </select>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div>{lbl("পরিমাণ")}<input type="number" min={1} value={ni.qty} placeholder="1" onChange={e=>setNi({...ni,qty:e.target.value})} style={inp}/></div>
            <div style={{display:"flex",alignItems:"flex-end"}}>{fVar&&<div style={{background:"#f0fdf4",borderRadius:9,padding:"10px 11px",fontSize:12,fontWeight:700,color:"#166534",width:"100%"}}>CFT: {(totalCft(fVar.sections)*(parseFloat(ni.qty)||1)).toFixed(2)}</div>}</div>
          </div>
          {pricingHint&&<div style={{background:"#faf5ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"9px 11px",marginBottom:11,fontSize:11,color:"#4c1d95",lineHeight:1.6}}>
            <div>💡 আনুমানিক খরচ (কাঠ+শ্রম): <strong>~{money(Math.round(pricingHint.estCost))}</strong></div>
            {pricingHint.past.length>0?<>
              <div>আগের {pricingHint.past.length}টা একই মডেল+কাঠের অর্ডারে দাম নিয়েছেন: <strong>{money(Math.round(pricingHint.minP))}–{money(Math.round(pricingHint.maxP))}</strong></div>
              {pricingHint.avgMargin!==null&&<div>গড় লাভ ছিল: <strong style={{color:pricingHint.avgMargin>=0?"#166534":RED}}>{pricingHint.avgMargin.toFixed(0)}%</strong></div>}
            </>:<div style={{color:"#7c6f9a"}}>এই মডেল+কাঠে আগে কোনো অর্ডার নেই — নতুন হিসেবে দাম ঠিক করুন</div>}
          </div>}
          <div style={{marginBottom:12}}>{lbl("এই ফার্নিচারের মূল্য (৳)")}<input type="number" value={ni.price} onChange={e=>setNi({...ni,price:e.target.value})} placeholder="0" style={{...inp,fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          <div style={{background:"#eff6ff",borderRadius:8,padding:"8px 10px",marginBottom:11,fontSize:11,color:"#1d4ed8"}}>ℹ️ কাঠের বিস্তারিত মাপ পরিবর্তন করতে হলে অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে এডিট করুন</div>
          {lbl("বিশেষ নির্দেশনা")}
          <textarea rows={2} value={ni.notes} onChange={e=>setNi({...ni,notes:e.target.value})} style={{...inp,resize:"vertical",marginBottom:11}}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setAdding(false)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"11px",fontSize:13}}>বাতিল</button>
            <button onClick={addItem} disabled={!fVar} style={{flex:2,background:fVar?RED:"#ccc",color:"white",border:"none",borderRadius:9,padding:"11px",fontSize:13,fontWeight:700}}>যোগ করুন</button>
          </div>
        </div>:<button onClick={()=>setAdding(true)} style={{width:"100%",background:"white",border:`2px dashed ${RED}`,color:RED,borderRadius:10,padding:"13px",fontSize:13,fontWeight:600,marginBottom:12}}>+ ফার্নিচার যোগ করুন</button>}
        {items.length>0&&!adding&&<div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:14,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>মোট মূল্য (সব ফার্নিচার মিলিয়ে):</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>}
        {items.length>0&&!adding&&<button onClick={()=>setStep(3)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>পরবর্তী → পেমেন্ট</button>}
      </>}
      {step===3&&<>
        <div style={{background:"white",borderRadius:11,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>🧾 কোন ফার্নিচারের দাম কত</div>
          {items.map((it,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderTop:i>0?"1px dashed #eee":"none"}}>
            <span style={{color:"#333"}}>[{it.code}] {it.variantBn} <span style={{color:"#999",fontSize:10}}>({it.woodBn} × {it.qty})</span></span>
            <span style={{fontWeight:700,color:"#166534",flexShrink:0,marginLeft:8}}>{money((parseFloat(it.price)||0)*(parseFloat(it.qty)||1))}</span>
          </div>)}
        </div>
        <div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:16,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>ফার্নিচারের মোট মূল্য (যোগফল):</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>
        <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>💵 পেমেন্টের তালিকা</div>
        {payments.map((p,i)=><div key={i} style={{background:"white",borderRadius:12,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.08)",border:"1.5px solid #f0f0f0"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>{lbl("তারিখ")}<DateInput value={p.date} onChange={v=>{const ps=[...payments];ps[i]={...ps[i],date:v};setPayments(ps)}} accent="#16a34a"/></div>
            <div>{lbl("পরিমাণ (৳)")}<input type="number" value={p.amount} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],amount:e.target.value};setPayments(ps)}} placeholder="0" style={{...inp,padding:"12px",fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"end"}}>
            <div style={{flex:1}}>{lbl("নোট")}<input value={p.note} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],note:e.target.value};setPayments(ps)}} placeholder="যেমন: অগ্রিম, ২য় কিস্তি" style={{...inp,padding:"12px",fontSize:13}}/></div>
            <button onClick={()=>setPayments(payments.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:9,padding:"12px 14px",color:RED,fontSize:14,fontWeight:700}}>✕</button>
          </div>
        </div>)}
        <button onClick={()=>setPayments([...payments,{date:today,amount:"",note:"পেমেন্ট"}])} style={{width:"100%",background:"white",border:"2px dashed #16a34a",color:"#16a34a",borderRadius:12,padding:"14px",fontSize:14,fontWeight:700,marginBottom:16}}>+ আরো পেমেন্ট যোগ করুন</button>
        {itemsTotal>0&&<div style={{background:"#f0fdf4",borderRadius:12,padding:"16px",marginBottom:16,border:"1.5px solid #bbf7d0"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট মূল্য:</span><span style={{fontWeight:700}}>{money(itemsTotal)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:16,borderTop:"1.5px solid #bbf7d0",paddingTop:10}}><span style={{fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:rem>0?RED:"#166534",fontSize:18}}>{money(rem)}</span></div>
        </div>}
        <button onClick={submit} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>অর্ডার নিশ্চিত করুন → স্লিপ দেখুন</button>
      </>}
    </div>
  </div>
}

/* ── PREVIEW (each slip prints independently now) ── */
function Preview({order,onBack,slip,setSlip,onUpdate,onAddPayment,onSetDelivered,onDelete,db,saveDb,carpenters,saveCarpenters,galleries,saveGalleryEntry,woodSettings,laborSettings,workers,allOrders,rackSplits}){
  const totalPaid=(order.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const isFullyPaid=parseFloat(order.cust.total)>0&&totalPaid>=(parseFloat(order.cust.total)||0);
  const[addingPay,setAddingPay]=useState(false);
  // ── আগে এখানে পেমেন্ট-এডিট আর তথ্য-সম্পাদনা ফর্ম ছিল, যা সব ট্যাবেই (গ্রাহক/অর্ডার
  // বুক/ট্র্যাকিং/...) দেখা যেত। এখন সব এডিট শুধু "অর্ডার বুক কপি" ট্যাবে (S2), সংশ্লিষ্ট
  // জায়গাতেই, প্রতিটা তথ্য আলাদাভাবে এডিট করা যায় ──
  // ── আগে এখানে রেফারেন্স ছবি+কার্পেন্টার+পরিবহন একসাথে প্রিন্ট করার বাটন ছিল। এখন এর বদলে
  // কার্পেন্টার কপিতে রেফারেন্স ছবিতে ক্লিক করলেই সরাসরি ফুল-রেজোলিউশন ছবি নতুন ট্যাবে খুলে
  // যায় (প্রিন্ট/সেভ দুটোই করা যায়), তাই এই আলাদা বাটনের দরকার নেই ──
  const[newPay,setNewPay]=useState({date:todayStr(),amount:"",note:"পেমেন্ট"});
  // ── সরাসরি লাইভ order prop থেকে — কোনো স্থানীয় (স্টেল হতে পারে এমন) কপি রাখা হচ্ছে না,
  // যাতে অন্য ডিভাইস (যেমন ফোন) থেকে ছবি যুক্ত করলে এই স্ক্রিনও সাথে সাথে দেখতে পায় ──
  const deliveryImgs=order.deliveryImgs||(order.deliveryImg?[{src:order.deliveryImg,fileName:order.deliveryImgFileName||null}]:[]);
  const delInput=useRef();

  const handleDeliveryImg=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const categoryFolder=orderImageFolder("finished",order);
    let next=[...deliveryImgs];
    let firstCompressed=null;
    for(const file of files){
      const compressed=await compressImage(file);
      if(!compressed)continue;
      if(!firstCompressed)firstCompressed=compressed;
      const baseFileName=genImgFileName(`${order.no}_delivery`,next.length+1,file);
      const relPath=`${categoryFolder}/${baseFileName}`;
      const savedFull=await saveFullResImage(file,relPath);
      next.push({src:compressed,fileName:savedFull?relPath:null});
    }
    onUpdate({...order,deliveryImgs:next,deliveryImg:next[0]?.src||null,deliveryImgFileName:next[0]?.fileName||null});
    // এই ছবিগুলো অর্ডারে থাকা প্রতিটা ফার্নিচার মডেলের গ্যালারিতেও যুক্ত করুন,
    // যাতে পরবর্তীতে সেই মডেল সিলেক্ট করলে ডেলিভারি দেওয়া আসল পণ্যের ছবি দেখা যায়
    if(saveGalleryEntry&&order.items&&firstCompressed){
      const seen=new Set();
      order.items.forEach(it=>{
        if(!it.catKey||!it.varKey)return;
        const key=`${it.catKey}__${it.varKey}`;
        if(seen.has(key))return;
        seen.add(key);
        const existing=(galleries&&galleries[key])||{gallery:[],coverImage:null};
        if((existing.gallery||[]).includes(firstCompressed))return;
        const updatedGallery=[...(existing.gallery||[]),firstCompressed];
        saveGalleryEntry(it.catKey,it.varKey,{gallery:updatedGallery,coverImage:existing.coverImage||firstCompressed});
      });
    }
  };
  const removeDeliveryImg=(idx)=>{
    if(!window.confirm("এই ছবিটি মুছে ফেলতে চান?"))return;
    const next=deliveryImgs.filter((_,i)=>i!==idx);
    onUpdate({...order,deliveryImgs:next,deliveryImg:next[0]?.src||null,deliveryImgFileName:next[0]?.fileName||null});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    const amt=parseFloat(newPay.amount)||0;
    const remaining=Math.max(0,(parseFloat(order.cust.total)||0)-totalPaid);
    if(amt>remaining){
      alert(`⚠️ বাকি আছে মাত্র ${money(remaining)}, এর বেশি পেমেন্ট নেওয়া যাবে না — মোট মূল্যের চেয়ে বেশি পরিশোধ দেখানো যাবে না। টাকার অঙ্কটা ঠিক করে আবার চেষ্টা করুন।`);
      return;
    }
    onAddPayment(order.no,newPay);
    setAddingPay(false);setNewPay({date:todayStr(),amount:"",note:"পেমেন্ট"});
  };
  const logPrint=(slipKey)=>{
    const logs={...(order.printLogs||{})};
    logs[slipKey]=[...(logs[slipKey]||[]),todayStr()];
    onUpdate({...order,printLogs:logs});
    setTimeout(()=>window.print(),50);
  };
  const cancelOrder=()=>{
    if(window.confirm("আপনি কি নিশ্চিত এই অর্ডারটি বাতিল করতে চান? এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।")){
      onUpdate({...order,cancelled:true,cancelledAt:new Date().toISOString()});
    }
  };
  const restoreOrder=()=>{
    if(window.confirm("এই অর্ডারটি আবার সক্রিয় করতে চান?")){
      onUpdate({...order,cancelled:false});
    }
  };
  const permanentDelete=()=>{
    if(window.confirm("⚠️ এই অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান? এই কাজটি কখনো ফিরিয়ে আনা যাবে না, সব তথ্য হারিয়ে যাবে।")){
      if(window.confirm("সত্যিই নিশ্চিত? আরেকবার নিশ্চিত করুন।")){
        onDelete(order.no);
      }
    }
  };

  const tabs=[{id:0,l:"গ্রাহক",c:RED},{id:1,l:"অর্ডার বুক",c:"#1d4ed8"},{id:2,l:"ট্র্যাকিং",c:"#6d28d9"},{id:3,l:"কার্পেন্টার",c:"#92400e"},{id:4,l:"ট্রান্সপোর্ট",c:"#065f46"},{id:5,l:"ডেলিভারি",c:"#0f766e",locked:false}];

  return<div className="print-bg" style={{minHeight:"100vh",background:"#eee"}}>
    <div className="no-print" style={{background:RED,color:"white",padding:"11px 14px",display:"flex",alignItems:"center",gap:9}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{flex:1,fontWeight:700,fontSize:13}}>#{order.no}{order.cancelled?" — ❌ বাতিল":""}</span>
      {order.cancelled?<><button onClick={restoreOrder} style={{background:"white",color:"#166534",border:"none",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700,marginRight:6}}>পুনরুদ্ধার</button>
      <button onClick={permanentDelete} style={{background:"#7f1d1d",color:"white",border:"1px solid white",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700}}>🗑 স্থায়ী ডিলিট</button></>
      :<button onClick={cancelOrder} style={{background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>❌ ক্যান্সেল</button>}
    </div>
    {order.cancelled&&<div className="no-print" style={{background:"#fee2e2",color:"#991b1b",padding:"8px 14px",textAlign:"center",fontSize:12,fontWeight:700}}>এই অর্ডারটি বাতিল করা হয়েছে ({order.cancelledAt?fmtDate(order.cancelledAt):""})</div>}
    <div className="no-print" style={{background:"white",padding:"12px 14px",borderBottom:"1px solid #eee"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:700}}>পেমেন্ট: {money(totalPaid)} / {money(order.cust.total)}</span>
        {isFullyPaid?<span style={{fontSize:11,background:"#dcfce7",color:"#166534",borderRadius:20,padding:"4px 12px",fontWeight:700}}>✅ সম্পূর্ণ পরিশোধ</span>:<button onClick={()=>setAddingPay(true)} style={{background:"#f0fdf4",border:"1.5px solid #86efac",color:"#166534",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700}}>+ পেমেন্ট যোগ করুন</button>}
      </div>
      {addingPay&&<div style={{background:"#fafafa",borderRadius:10,padding:12,border:"1px solid #eee"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>তারিখ</div><DateInput value={newPay.date} onChange={v=>setNewPay({...newPay,date:v})} accent="#16a34a"/></div>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>পরিমাণ (৳)</div><input type="number" value={newPay.amount} onChange={e=>setNewPay({...newPay,amount:e.target.value})} placeholder="0" style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:16,fontWeight:700,color:"#166534",outline:"none"}}/></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"end"}}>
          <div style={{flex:1}}><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>নোট</div><input value={newPay.note} onChange={e=>setNewPay({...newPay,note:e.target.value})} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:13,outline:"none"}}/></div>
          <button onClick={addPayment} style={{background:"#16a34a",color:"white",border:"none",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:700}}>সংরক্ষণ</button>
        </div>
      </div>}
    </div>
    <div className="no-print" style={{background:"white",display:"flex",overflowX:"auto",borderBottom:"1px solid #eee"}}>
      {tabs.map(t=><button key={t.id} onClick={()=>!t.locked&&setSlip(t.id)} style={{flexShrink:0,padding:"10px 11px",border:"none",background:"none",fontSize:11,fontWeight:slip===t.id?700:400,color:t.locked?"#ccc":slip===t.id?t.c:"#888",borderBottom:slip===t.id?`3px solid ${t.c}`:"3px solid transparent",cursor:t.locked?"not-allowed":"pointer"}}>{t.l}</button>)}
    </div>
    <div className="print-wrap" style={{padding:"12px",maxWidth:640,margin:"0 auto"}}>
      <div className="slip-card" style={{background:"white",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.1)"}}>
        {slip===0&&<S1 order={order} onPrint={logPrint}/>}
        {slip===1&&<S2 order={order} onPrint={logPrint} db={db} saveDb={saveDb} galleries={galleries} onUpdateOrder={onUpdate} woodSettings={woodSettings} laborSettings={laborSettings}/>}
        {slip===2&&<S3 order={order} onPrint={logPrint} onUpdateOrder={onUpdate} workers={workers}/>}
        {slip===3&&<S4 order={order} onPrint={logPrint} db={db} saveDb={saveDb} onUpdateOrder={onUpdate}/>}
        {slip===4&&<S5 order={order} onPrint={logPrint} woodSettings={woodSettings} rackSplits={rackSplits}/>}
        {slip===5&&<S6 order={{...order,deliveryImgs}} onPrint={logPrint} onUpdateOrder={onUpdate} onSetDelivered={onSetDelivered} onPhotoChange={handleDeliveryImg} onRemovePhoto={removeDeliveryImg} allOrders={allOrders} printLocked={!isFullyPaid}/>}
      </div>
    </div>
  </div>
}

/* ── HISTORY (with search) ── */
function Hist({orders,db,onBack,onView,highlightNo,q,setQ,statusFilter,setStatusFilter,catFilter,setCatFilter,sortMode,setSortMode}){
  // ── সার্চ/ফিল্টার/সর্ট এখন এই পেজের নিজের সাময়িক মেমোরিতে না — parent থেকে prop হিসেবে আসে
  // (নেভিগেশন স্ট্যাকে সংরক্ষিত), যাতে কোনো অর্ডারে ঢুকে ব্যাক করে ফিরলে যা বেছে নিয়েছিলেন
  // (সার্চ লেখা, স্ট্যাটাস ট্যাব, ক্যাটাগরি, সর্ট) তাই থেকে যায় ──
  // recent | rank
  // ── কাস্টমার র‍্যাংকিং — নতুন অর্ডার ফর্মে যেভাবে হিসাব হয়, এখানেও একই পদ্ধতি ──
  const customerRank=useMemo(()=>{
    const map={};
    (orders||[]).filter(o=>!o.cancelled).forEach(o=>{
      const phone=(o.cust.phone||"").trim();
      if(!phone)return;
      if(!map[phone])map[phone]={phone,totalSpent:0};
      map[phone].totalSpent+=parseFloat(o.cust.total)||0;
    });
    const list=Object.values(map).sort((a,b)=>b.totalSpent-a.totalSpent);
    const rankByPhone={};
    list.forEach((c,i)=>{rankByPhone[c.phone]=i+1});
    return rankByPhone;
  },[orders]);
  const categoryOf=(o)=>(o.items||[]).map(it=>(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn||"").split(" ")[0]).filter(Boolean);
  const allCategories=useMemo(()=>{
    const set=new Set();
    (orders||[]).forEach(o=>categoryOf(o).forEach(c=>set.add(c)));
    return[...set].sort();
  },[orders,db]);
  // ── ড্যাশবোর্ডের "জনপ্রিয় ফার্নিচার" তালিকার সাথে মিলিয়ে — কোন ক্যাটাগরি কত নম্বর জনপ্রিয়
  // (অর্ডার সংখ্যা অনুযায়ী, বাতিল বাদে) তা ফিল্টার-তথ্য বক্সে দেখানোর জন্য ──
  const categoryPopularityRank=useMemo(()=>{
    const counts={};
    (orders||[]).filter(o=>!o.cancelled).forEach(o=>categoryOf(o).forEach(c=>{counts[c]=(counts[c]||0)+1}));
    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([label])=>label);
    const rankMap={};
    ranked.forEach((label,i)=>{rankMap[label]=i+1});
    return rankMap;
  },[orders]);
  const filtered=useMemo(()=>{
    let list=orders;
    if(q.trim()){
      const s=q.trim().toLowerCase();
      list=list.filter(o=>o.cust.name.toLowerCase().includes(s)||o.cust.phone.includes(s)||o.no.toLowerCase().includes(s));
    }
    if(statusFilter==="running")list=list.filter(o=>!o.cancelled&&!o.delivered&&!isOrderFullyProgressed(o));
    else if(statusFilter==="delivered")list=list.filter(o=>o.delivered);
    else if(statusFilter==="cancelled")list=list.filter(o=>o.cancelled);
    if(catFilter!=="all")list=list.filter(o=>categoryOf(o).includes(catFilter));
    if(sortMode==="rank"){
      return[...list].sort((a,b)=>{
        const ra=customerRank[(a.cust.phone||"").trim()]||9999,rb=customerRank[(b.cust.phone||"").trim()]||9999;
        return ra-rb;
      });
    }
    const runningList=list.filter(o=>!o.delivered).sort((a,b)=>new Date(b.at||b.cust.date)-new Date(a.at||a.cust.date));
    const deliveredList=list.filter(o=>o.delivered).sort((a,b)=>new Date(b.deliveredAt||b.cust.delivery||0)-new Date(a.deliveredAt||a.cust.delivery||0));
    return[...runningList,...deliveredList];
  },[orders,q,statusFilter,catFilter,sortMode,customerRank]);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:RED,color:"white",padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{fontWeight:700,fontSize:15}}>অর্ডার ইতিহাস ({orders.length})</span>
    </div>
    <div style={{padding:"14px",maxWidth:560,margin:"0 auto"}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন..." style={{width:"100%",border:"1.5px solid #ddd",borderRadius:11,padding:"13px 15px",fontSize:14,outline:"none",marginBottom:10,background:"white"}}/>
      <div style={{display:"flex",gap:6,marginBottom:8,overflowX:"auto"}}>
        {[{v:"all",l:"সব"},{v:"running",l:"চলমান"},{v:"delivered",l:"ডেলিভারড"},{v:"cancelled",l:"বাতিল"}].map(f=>
          <button key={f.v} onClick={()=>setStatusFilter(f.v)} style={{flexShrink:0,minHeight:36,padding:"7px 13px",borderRadius:20,border:statusFilter===f.v?"none":"1px solid #ddd",background:statusFilter===f.v?RED:"white",color:statusFilter===f.v?"white":"#666",fontSize:11,fontWeight:600}}>{f.l}</button>
        )}
        <button onClick={()=>setSortMode(sortMode==="rank"?"recent":"rank")} style={{flexShrink:0,minHeight:36,padding:"7px 13px",borderRadius:20,border:sortMode==="rank"?"none":"1.5px solid #fbbf24",background:sortMode==="rank"?"#92400e":"#fffbeb",color:sortMode==="rank"?"white":"#92400e",fontSize:11,fontWeight:700}}>👑 কাস্টমার র‍্যাংক</button>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} style={{flex:1,border:"1.5px solid #ddd",borderRadius:9,padding:"9px 8px",fontSize:11,background:"white"}}>
          <option value="all">সব ক্যাটাগরি</option>
          {allCategories.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      {(()=>{
        const fCount=filtered.length;
        // ── ক্যাটাগরি বাছা থাকলে শুধু সেই ক্যাটাগরির আইটেমগুলোর দাম যোগ হবে, পুরো অর্ডারের
        // মূল্য না (একটা অর্ডারে আলমারী + খাট দুটোই থাকলে আগে পুরো অর্ডারের টাকাটাই "আলমারী"তে
        // যোগ হয়ে যেত, যা ভুল ছিল) ──
        const itemCategoryOf=(it)=>(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn||"").split(" ")[0];
        const fTotal=catFilter==="all"
          ?filtered.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0)
          :filtered.reduce((s,o)=>s+(o.items||[]).filter(it=>itemCategoryOf(it)===catFilter).reduce((ss,it)=>ss+(parseFloat(it.price)||0)*(parseFloat(it.qty)||1),0),0);
        const fAvg=fCount?fTotal/fCount:0;
        const popRank=catFilter!=="all"?categoryPopularityRank[catFilter]:null;
        return<div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto"}}>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:14,fontWeight:800,color:"#222"}}>{fCount}</div><div style={{fontSize:8,color:"#999"}}>অর্ডার</div></div>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:12,fontWeight:800,color:"#166534"}}>{money(fTotal)}</div><div style={{fontSize:8,color:"#999"}}>মোট মূল্য</div></div>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:12,fontWeight:800,color:"#1d4ed8"}}>{money(fAvg)}</div><div style={{fontSize:8,color:"#999"}}>গড় মূল্য</div></div>
          {popRank&&<div style={{flexShrink:0,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:14,fontWeight:800,color:"#92400e"}}>#{popRank}</div><div style={{fontSize:8,color:"#92400e"}}>জনপ্রিয়তায়</div></div>}
        </div>
      })()}
      {filtered.length===0?<div style={{textAlign:"center",color:"#aaa",padding:"50px 20px",fontSize:13}}>কোনো অর্ডার পাওয়া যায়নি</div>
      :filtered.map((o,i)=>{
        const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        const full=parseFloat(o.cust.total)>0&&paid>=(parseFloat(o.cust.total)||0);
        const bg=highlightNo===o.no?"#e0f2fe":o.cancelled?"#fafafa":o.delivered?"#f0fdf4":"white";
        const borderColor=highlightNo===o.no?"#0ea5e9":o.cancelled?"#999":o.delivered?"#0f766e":full?"#16a34a":RED;
        const rank=customerRank[(o.cust.phone||"").trim()];
        return<div key={i} onClick={()=>onView(o)} style={{background:bg,borderRadius:11,marginBottom:9,boxShadow:"0 1px 4px rgba(0,0,0,.08)",border:o.delivered?"1px solid #99f6e4":"none",borderLeft:`4px solid ${borderColor}`,cursor:"pointer",opacity:o.cancelled?0.65:1,transition:"background .4s",display:"flex",overflow:"hidden"}}>
          {(o.deliveryImgs&&o.deliveryImgs[0])?
            <img src={o.deliveryImgs[0].src} onClick={e=>{e.stopPropagation();openLightbox(o.deliveryImgs[0].src)}} style={{width:64,alignSelf:"stretch",objectFit:"cover",flexShrink:0,cursor:"pointer"}}/>
            :<div style={{width:64,alignSelf:"stretch",background:"#f1f5f9",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#cbd5e1"}}>📦</div>}
          <div style={{flex:1,minWidth:0,padding:"12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",minWidth:0,flex:1,gap:9}}>
                <div style={{minWidth:0,flexShrink:0,maxWidth:118}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,fontSize:13,textDecoration:o.cancelled?"line-through":"none",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",lineHeight:1.25}}>{o.cust.name}</span>
                    {sortMode==="rank"&&rank&&<span style={{fontSize:9,background:"#fef3c7",color:"#92400e",borderRadius:8,padding:"1px 7px",fontWeight:700,flexShrink:0}}>#{rank}</span>}
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:1}}>{o.cust.phone}</div>
                  {o.cust.address&&<div style={{fontSize:9,color:"#888",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍 {o.cust.address}</div>}
                  <div style={{fontSize:9,color:"#bbb",marginTop:1}}>{o.no}</div>
                </div>
                <div style={{width:1,background:"#e5e5e5",flexShrink:0,alignSelf:"stretch"}}></div>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:11,color:"#333",fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{categoryOf(o).join(", ")}</div>
                  <div style={{fontSize:9,color:"#999",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.items.map(it=>it.variantBn).join(", ")}</div>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                <div style={{fontWeight:700,fontSize:13,color:RED}}>{money(o.cust.total)}</div>
                <div style={{fontSize:10,color:o.cancelled?"#991b1b":o.delivered?"#0f766e":full?"#16a34a":"#f97316",marginTop:2,fontWeight:600}}>{o.cancelled?"❌ বাতিল":o.delivered?"📦 ডেলিভারড":full?"✅ পরিশোধ":`⏳ বাকি ${money((parseFloat(o.cust.total)||0)-paid)}`}</div>
                <div style={{fontSize:10,color:"#aaa",marginTop:1}}>{o.delivered?fmtDate(o.deliveredAt):fmtDate(o.cust.date)}</div>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",gap:6,marginTop:8}} onClick={e=>e.stopPropagation()}>
              <a href={`tel:${o.cust.phone}`} style={{width:112,textAlign:"center",background:"#eff6ff",color:"#1d4ed8",border:"none",borderRadius:6,padding:"8px 9px",minHeight:36,fontSize:10,fontWeight:700,textDecoration:"none"}}>📱 কল</a>
              <a href={`https://wa.me/${toIntlPhone(o.cust.phone)}`} target="_blank" rel="noopener noreferrer" style={{width:112,textAlign:"center",background:"#f0fdf4",color:"#166534",border:"none",borderRadius:6,padding:"8px 9px",minHeight:36,fontSize:10,fontWeight:700,textDecoration:"none"}}>💬 WhatsApp</a>
            </div>
          </div>
        </div>
      })}
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
