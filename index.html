    // woodSettings ডকুমেন্টে সেভ হয়ে না যায়, তাই এখানে বাদ দেওয়া হচ্ছে
    const{__rackBands,...clean}=newSettings||{};
    setWoodSettings(clean);
    if(fsRef.current)fsRef.current.doc("meta/woodSettings").set(clean).catch(err=>alert("⚠️ কাঠের সেটিংস সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveAlertSettings=(s)=>{
    setAlertSettings(s);
    if(fsRef.current)fsRef.current.doc("meta/alertSettings").set(s).catch(err=>alert("⚠️ সতর্কতার সীমা সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveLaborSettings=(newSettings)=>{
    setLaborSettings(newSettings);
    if(fsRef.current)fsRef.current.doc("meta/laborSettings").set(newSettings).catch(err=>alert("⚠️ শ্রম হার সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const addRackSplit=(split)=>{
    setRackSplits(prev=>[...prev,split]);
    if(fsRef.current)fsRef.current.doc("meta/rackSplits").set({list:firebase.firestore.FieldValue.arrayUnion(split)},{merge:true}).catch(err=>alert("⚠️ নতুন র‍্যাক সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const addRackBand=(band)=>{
    setRackBands(prev=>[...prev,band]);
    if(fsRef.current)fsRef.current.doc("meta/rackBands").set({list:firebase.firestore.FieldValue.arrayUnion(band)},{merge:true}).catch(err=>alert("⚠️ হাইট ব্যান্ড সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const removeRackBand=(band)=>{
    setRackBands(prev=>prev.filter(b=>!(b.wood===band.wood&&b.w===band.w&&b.from===band.from&&b.to===band.to&&b.rep===band.rep)));
    if(fsRef.current)fsRef.current.doc("meta/rackBands").set({list:firebase.firestore.FieldValue.arrayRemove(band)},{merge:true}).catch(err=>alert("⚠️ ব্যান্ড মুছতে সমস্যা হয়েছে: "+err.message));
  };
  const latestDataRef=useRef({});
  latestDataRef.current={orders,expenses,woodLots,workers,payrollWeeks,db,carpenters,woodSettings,laborSettings};

  const buildBackupSnapshot=(auto)=>{
    const d=latestDataRef.current;
    return{
      backupDate:new Date().toISOString(),
      appVersion:BUILD_TAG,
      auto:!!auto,
      orders:d.orders,expenses:d.expenses,woodLots:d.woodLots,workers:d.workers,payrollWeeks:d.payrollWeeks,db:d.db,carpenters:d.carpenters,
      woodSettings:d.woodSettings,laborSettings:d.laborSettings,
      note:"এটি রূপালী ফার্নিচার অ্যাপের একটি ডেটা ব্যাকআপ। এই ফাইলটি নিরাপদ কোথাও (Google Drive, ইমেইল ইত্যাদি) সংরক্ষণ করে রাখুন। সমস্যা হলে Claude-কে এই ফাইলটি দেখিয়ে সাহায্য চাইতে পারবেন।"
    };
  };
  // ── উদ্ধার শুরুর আগে একবার নিরাপত্তা-ব্যাকআপ: আটকে থাকা অর্ডারগুলোর হুবহু কপি আলাদা করে
  // রেখে দেওয়া হয়, যাতে উদ্ধারের সময় যা-ই ঘটুক, একটা স্বাধীন কপি হাতে থাকে ──
  const safetyBackupStuck=(stuckNos)=>{
    try{
      if(localStorage.getItem("rf_stuck_safety_backup"))return; // একবারই, পরে আর ওভাররাইট নয়
      const stuck=(ordersRef.current||[]).filter(o=>stuckNos.includes(o.no));
      if(!stuck.length)return;
      localStorage.setItem("rf_stuck_safety_backup",JSON.stringify({at:new Date().toISOString(),count:stuck.length,orders:stuck}));
    }catch(e){/* জায়গা না থাকলেও উদ্ধার থেমে থাকবে না */}
  };
  const backupData=()=>{
    const json=JSON.stringify(buildBackupSnapshot(false),null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const dateStr=todayStr();
    const a=document.createElement("a");
    a.href=url;
    a.download=`RupaliFurniture_Backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  };

  // ── স্বয়ংক্রিয় দৈনিক ব্যাকআপ — কিছু মনে রাখা বা ক্লিক করার দরকার নেই ──
  // ১) ক্লাউডে (Firestore) প্রতিদিন একবার একটা স্ন্যাপশট জমা হয় (সব ডিভাইসে কাজ করে)
  // ২) ডেস্কটপে ছবির ফোল্ডার সংযুক্ত থাকলে সেই একই ফোল্ডারে আসল JSON ফাইলও সেভ হয়ে যায়
  useEffect(()=>{
    if(!db)return;
    const todayD=todayStr();
    if(localStorage.getItem("rf_last_auto_backup")===todayD)return;
    const timer=setTimeout(async()=>{
      const snapshot=buildBackupSnapshot(true);
      const json=JSON.stringify(snapshot,null,2);
      let cloudOk=false;
      if(fsRef.current){
        // ── ক্লাউড ব্যাকআপ টুকরো টুকরো করে জমা হয় ──
        // Firestore-এ একটা ডকুমেন্ট সর্বোচ্চ ১ MB পর্যন্ত হতে পারে। আগে সব অর্ডার (ছবিসহ)
        // একটাই ডকুমেন্টে জমা হতো, তাই অর্ডার বাড়লে একদিন এই সীমা ছাড়িয়ে ব্যাকআপ ব্যর্থ হতো।
        // এখন অর্ডারগুলো ~৬০০KB করে টুকরোয় ভাগ হয়ে আলাদা ডকুমেন্টে যায় — যত অর্ডারই হোক,
        // এই সীমা আর কখনো বাধা হবে না।
        try{
          const CHUNK_BYTES=600*1024;
          const allOrders=snapshot.orders||[];
          const chunks=[];let cur=[],curSize=0;
          allOrders.forEach(o=>{
            const size=JSON.stringify(o).length;
            if(cur.length>0&&curSize+size>CHUNK_BYTES){chunks.push(cur);cur=[];curSize=0}
            cur.push(o);curSize+=size;
          });
          if(cur.length>0)chunks.push(cur);
          const{orders,...withoutOrders}=snapshot;
          const col=fsRef.current.collection("backups");
          await col.doc(todayD).set({...withoutOrders,orderChunks:chunks.length,orderCount:allOrders.length});
          for(let i=0;i<chunks.length;i++)await col.doc(`${todayD}__orders_${i}`).set({orders:chunks[i],part:i,of:chunks.length});
          cloudOk=true;
        }catch(e){cloudOk=false}
      }
      // ব্যতিক্রম দিয়ে ব্যবস্থাপনা: সফল হলে চুপচাপ, ব্যর্থ হলেই কেবল উপরে সতর্কতা দেখাবে
      setBackupFailed(!cloudOk);
      if(!cloudOk)return; // আজকের চিহ্ন বসানো হবে না, যাতে পরে আবার চেষ্টা হয়
      try{
        const folder=await getImageFolderHandle();
        if(folder){
          const fileHandle=await folder.getFileHandle(`RupaliFurniture_Backup_${todayD}.json`,{create:true});
          const writable=await fileHandle.createWritable();
          await writable.write(json);
          await writable.close();
        }
      }catch(e){}
      localStorage.setItem("rf_last_auto_backup",todayD);
    },6000); // অন্য সব ডেটা ঠিকভাবে লোড হওয়ার সময় দেওয়া হচ্ছে
    return()=>clearTimeout(timer);
  },[db]);

  useEffect(()=>{
    setTimedOut(false);
    const timer=setTimeout(()=>setTimedOut(true),8000);
    try{
      if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
      // উদ্ধার-সংযোগ তৈরি (আলাদা নামে, অফলাইন-ক্যাশ ছাড়া) — আটকে থাকা লেখা ঠিক করার জন্য
      try{
        const recApp=firebase.apps.find(a=>a.name==="recovery")||firebase.initializeApp(firebaseConfig,"recovery");
        recoveryFsRef.current=recApp.firestore();
      }catch(e){recoveryFsRef.current=null}
      const firestore=firebase.firestore();
      try{firestore.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
      fsRef.current=firestore;
      migrateLegacyPermanentFailures();

      const unsubOrders=firestore.collection("orders").onSnapshot(snap=>{
        clearTimeout(timer);setTimedOut(false);
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.cust?.date||0)-new Date(a.at||a.cust?.date||0));
        setOrders(list);
        setLastSyncAt(new Date());
        syncFailCountRef.current=0; // লাইভ সংযোগ থেকে ডেটা আসছে মানে সিঙ্ক ঠিক আছে — পুরনো ব্যর্থতার গণনা মুছে দিন
      },err=>{clearTimeout(timer);setConnError(err.message)});

      const unsubExpenses=firestore.collection("expenses").onSnapshot(snap=>{
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.date||0)-new Date(a.at||a.date||0));
        setExpenses(list);
      },err=>setConnError(err.message));

      const unsubLots=firestore.collection("woodlots").onSnapshot(snap=>{
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
        setWoodLots(list);
      },err=>setConnError(err.message));

      const unsubWorkers=firestore.collection("workers").onSnapshot(snap=>{
        const list=snap.docs.map(d=>d.data());
        setWorkers(list);
      },err=>{});

      const unsubPayroll=firestore.collection("payrollWeeks").onSnapshot(snap=>{
        const map={};
        snap.docs.forEach(d=>{map[d.id]=d.data()});
        setPayrollWeeks(map);
      },err=>{});

      const unsubDb=firestore.doc("meta/db").onSnapshot(snap=>{
        clearTimeout(timer);setTimedOut(false);
        if(snap.exists){
          const data=snap.data();
          // Migration: strip any legacy gallery/coverImage fields out of the main db doc
          // (these can bloat the single document past Firestore's 1MB limit, silently
          // blocking future writes like new categories/models). Move them to their own
          // "galleries" collection instead.
          let hadLegacyImages=false;
          const slim=JSON.parse(JSON.stringify(data));
          Object.entries(slim).forEach(([catKey,cat])=>{
            if(!cat.variants)return;
            Object.entries(cat.variants).forEach(([varKey,v])=>{
              if(v.gallery||v.coverImage){
                hadLegacyImages=true;
                firestore.collection("galleries").doc(`${catKey}__${varKey}`).set({gallery:v.gallery||[],coverImage:v.coverImage||null},{merge:true}).catch(()=>{});
                delete v.gallery;delete v.coverImage;
              }
            });
          });
          setDb(slim);
          if(hadLegacyImages){
            firestore.doc("meta/db").set(slim).catch(()=>{});
          }
        }
        else{const seed=JSON.parse(JSON.stringify(DEFAULT_DB));firestore.doc("meta/db").set(seed).catch(()=>{});setDb(seed)}
      },err=>{clearTimeout(timer);setConnError(err.message)});

      const unsubGalleries=firestore.collection("galleries").onSnapshot(snap=>{
        const map={};
        snap.docs.forEach(d=>{map[d.id]=d.data()});
        setGalleries(map);
      },err=>{});

      const unsubWoodSettings=firestore.doc("meta/woodSettings").onSnapshot(snap=>{
        setWoodSettings(snap.exists?snap.data():{});
      },err=>{});

      const unsubAlertSettings=firestore.doc("meta/alertSettings").onSnapshot(snap=>{
        setAlertSettings(snap.exists?snap.data():{});
      },err=>{});

      const unsubLaborSettings=firestore.doc("meta/laborSettings").onSnapshot(snap=>{
        setLaborSettings(snap.exists?snap.data():{});
      },err=>{});

      const unsubRackBands=firestore.doc("meta/rackBands").onSnapshot(snap=>{
        setRackBands(snap.exists?(snap.data().list||[]):[]);
      },err=>{});

      const unsubRackSplits=firestore.doc("meta/rackSplits").onSnapshot(snap=>{
        setRackSplits(snap.exists?(snap.data().list||[]):[]);
      },err=>{});

      const unsubCarp=firestore.doc("meta/carpenters").onSnapshot(snap=>{
        setCarpenters(snap.exists?(snap.data().list||[]):[]);
      },err=>setConnError(err.message));

      // One-time silent migration of any pre-existing local data into the cloud
      (async()=>{
        if(localStorage.getItem("rf_migrated_to_cloud"))return;
        try{
          const existing=await firestore.collection("orders").limit(1).get();
          if(existing.empty){
            const localOrders=S.get("rf_orders_v5")||[];
            const localDb=S.get("rf_db_v5");
            const localExpenses=S.get("rf_expenses_v1")||[];
            const localWoodLots=S.get("rf_woodlots_v1")||[];
            const localCarpenters=S.get("rf_carpenters_v1")||[];
            const jobs=[];
            localOrders.forEach(o=>jobs.push(firestore.collection("orders").doc(o.no).set(o)));
            localWoodLots.forEach(l=>jobs.push(firestore.collection("woodlots").doc(l.id).set(l)));
            localExpenses.forEach((e,i)=>{const id=e.id||("exp_migrated_"+i);jobs.push(firestore.collection("expenses").doc(id).set({...e,id}))});
            if(localDb)jobs.push(firestore.doc("meta/db").set(localDb));
            if(localCarpenters.length)jobs.push(firestore.doc("meta/carpenters").set({list:localCarpenters}));
            if(jobs.length)await Promise.all(jobs);
          }
        }catch(e){/* ignore migration errors silently */}
        localStorage.setItem("rf_migrated_to_cloud","true");
      })();

      // ── প্রতি ২ মিনিটে সরাসরি সার্ভার থেকে (ঠিক "সার্ভার-সিঙ্ক পরীক্ষা" বাটনের মতোই)
      // যাচাই করা হয় কোনো অর্ডার এখনো সার্ভার-নিশ্চিত হয়নি কিনা — বাটনে চাপার অপেক্ষা না
      // করেই। পাওয়া গেলে সেই অর্ডারের জন্য স্বয়ংক্রিয়ভাবে ছবি ছোট করে আবার পাঠানোর চেষ্টা
      // শুরু হয়ে যায় ──
      const autoStuckCheck=async()=>{
        // ── সার্ভারের আসল অবস্থা জানতে উদ্ধার-সংযোগ (লোকাল সারি ছাড়া) ব্যবহার করা হয়।
        // মূল সংযোগ দিয়ে পড়লে এই ডিভাইসের আটকে থাকা লেখাও ফলাফলে মিশে যায়, ফলে সফলভাবে
        // পাঠানোর পরেও সংখ্যা কমত না ──
        const fs2=recoveryFsRef.current||fsRef.current;
        setAutoStuckStatus(prev=>({...(prev||{}),running:true,lastRunAt:new Date().toISOString(),lastError:!fs2?"সংযোগ তৈরিই হয়নি":null}));
        if(!fs2)return;
        try{
          const snap2=await fs2.collection("orders").get();
          const serverIds=new Set(snap2.docs.map(d=>d.id));
          // সত্যিকারের আটকে থাকা = এই ডিভাইসে আছে কিন্তু সার্ভারে নেই
          const missingOnServer=(ordersRef.current||[]).filter(o=>o&&o.no&&!serverIds.has(o.no)).map(o=>o.no);
          const toResolve=[];
          missingOnServer.forEach(no=>{
            // ── আগে একবার চেষ্টা হলেই স্থায়ীভাবে "চেষ্টা হয়ে গেছে" চিহ্ন বসে যেত, তাই আর
            // কখনো দ্বিতীয়বার চেষ্টা হতো না। এখন ১ মিনিট পরই আবার চেষ্টা করা যাবে ──
            const lastTry=autoResolveAttemptedRef.current[no]||0;
            if(Date.now()-lastTry>60000){
              autoResolveAttemptedRef.current[no]=Date.now();
              toResolve.push(no);
            }
          });
          // সার্ভারে পৌঁছে গেছে এমন অর্ডারের চিহ্ন সাফ করা
          Object.keys(autoResolveAttemptedRef.current).forEach(no=>{
            if(serverIds.has(no))delete autoResolveAttemptedRef.current[no];
          });
          setAutoStuckStatus(prev=>({...(prev||{}),totalDocs:serverIds.size,foundPendingCount:missingOnServer.length,queuedThisRun:toResolve.length,resolvedThisRun:0,failedThisRun:0,lastAttemptDetail:[]}));
          if(missingOnServer.length)safetyBackupStuck(missingOnServer);
          // ── একসাথে অনেকগুলো চালালে ফোন ধীর হয়ে যেতে পারে (ছবি ছোট করা + নেটওয়ার্ক, দুটোই
          // ভারী কাজ) — তাই একটার পর একটা, ধারাবাহিকভাবে সমাধানের চেষ্টা হয় ──
          for(const no of toResolve){
            const order=ordersRef.current.find(o=>o.no===no);
            if(!order){
              setAutoStuckStatus(prev=>({...prev,lastAttemptDetail:[...(prev.lastAttemptDetail||[]),{no,ok:false,reason:"এই ডিভাইসের তালিকায় এই নম্বরটাই নেই"}]}));
              continue;
            }
            try{
              const ok=await autoResolveTooLarge(no,false,order);
              setAutoStuckStatus(prev=>({...prev,resolvedThisRun:(prev.resolvedThisRun||0)+(ok?1:0),failedThisRun:(prev.failedThisRun||0)+(ok?0:1),lastAttemptDetail:[...(prev.lastAttemptDetail||[]),{no,ok}]}));
            }catch(e2){
              setAutoStuckStatus(prev=>({...prev,failedThisRun:(prev.failedThisRun||0)+1,lastAttemptDetail:[...(prev.lastAttemptDetail||[]),{no,ok:false,reason:e2.message}]}));
            }
          }
          setAutoStuckStatus(prev=>({...prev,running:false}));
        }catch(e){
          setAutoStuckStatus(prev=>({...(prev||{}),running:false,lastError:e.message}));
        }
      };
      const firstStuckCheck=setTimeout(autoStuckCheck,5000);
      const stuckCheckInterval=setInterval(autoStuckCheck,30000);

      return()=>{clearTimeout(timer);clearTimeout(firstStuckCheck);clearInterval(stuckCheckInterval);unsubOrders();unsubExpenses();unsubLots();unsubDb();unsubGalleries();unsubWoodSettings();unsubLaborSettings();unsubAlertSettings();unsubRackSplits();unsubRackBands();unsubCarp();unsubWorkers();unsubPayroll()};
    }catch(e){
      clearTimeout(timer);
      setConnError(e.message);
    }
  },[firebaseConfig,retryKey]);

  // ── ফোন ব্যাকগ্রাউন্ডে থাকার পর ফিরে আসলে (স্ক্রিন অন হলে/ট্যাব আবার সক্রিয় হলে) সরাসরি
  // সার্ভার থেকে নতুন করে যাচাই — মোবাইল ব্রাউজার দীর্ঘক্ষণ ব্যাকগ্রাউন্ডে থাকলে লাইভ সংযোগ
  // নিজে থেকে দেরিতে সচল হতে পারে, তাই ফিরে আসার সাথে সাথেই জোর করে তাজা তথ্য আনা হয় ──
  useEffect(()=>{
    // ── সার্ভার থেকে জোর করে তাজা তথ্য আনা ──
    // আগে এটা শুধু ট্যাব বদলালে (visibilitychange/focus) চলত। কিন্তু কম্পিউটারে ট্যাবটা
    // যদি সারাক্ষণ খোলা ও সামনেই থাকে, তাহলে এই ইভেন্ট কখনো ঘটেই না — আর ভেতরের
    // রিয়েল-টাইম সংযোগ চুপচাপ বিচ্ছিন্ন হয়ে গেলে পুরনো তথ্য ঘণ্টার পর ঘণ্টা দেখাতে থাকে।
    // এই কারণেই মোবাইল ও পিসিতে আলাদা সংখ্যা দেখা যেত। এখন প্রতি ৪৫ সেকেন্ডে নিজে থেকেই
    // তাজা তথ্য টেনে আনে, আর সব কালেকশনই আনে (আগে কয়েকটা বাদ পড়ত)।
    const quotaBackoffUntilRef={current:0};
    const refreshFromServer=(force,ordersOnly)=>{
      if(!force&&document.visibilityState&&document.visibilityState!=="visible")return Promise.resolve();
      // কোটা শেষ হয়ে গেলে আরও পড়ার চেষ্টা করলে অবস্থা আরও খারাপ হয় — কিছুক্ষণ থেমে থাকা হয়
      if(Date.now()<quotaBackoffUntilRef.current)return Promise.resolve();
      const fs=fsRef.current;
      if(!fs)return Promise.resolve();
      const jobs=[
        fs.collection("orders").get({source:"server"}).then(snap=>{
          const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.cust?.date||0)-new Date(a.at||a.cust?.date||0));
          // ── "যেই ডিভাইসে শেষ যা ইনপুট হবে তাই সব ডিভাইসে দেখা যাবে" — এই নিয়ম নিজে থেকে
          // বলবৎ করার জন্য। এই ডিভাইসে আছে কিন্তু সার্ভারে নেই এমন অর্ডার পেলে চুপচাপ সার্ভারে
          // পাঠিয়ে দেয় (আগে এটা ⚙️ সেকশনে হাতে করতে হতো), আর সেগুলো তালিকা থেকেও হারিয়ে যায় না।
          // এই একই স্ন্যাপশটই ব্যবহার হয়, তাই বাড়তি কোনো পড়ার খরচ নেই ──
          const serverNos=new Set(snap.docs.map(d=>d.id));
          const localOnly=(ordersRef.current||[]).filter(o=>o&&o.no&&!serverNos.has(o.no));
          setOrders(localOnly.length?[...localOnly,...list]:list);
          localOnly.forEach(o=>{
            fs.collection("orders").doc(o.no).set(o).catch(e=>{
              if(isLikelyTooLargeError(e))autoResolveTooLarge(o.no,false,o);
            });
          });
        }),
      ];
      // ধীরে বদলায় এমন কালেকশনগুলো প্রতিবার নতুন করে পড়ার দরকার নেই — রিয়েল-টাইম লিসেনার
      // এগুলোর পরিবর্তনও সাথে সাথেই এনে দেয়; এটা শুধু নিরাপত্তা-জাল, তাই আধ ঘণ্টায় একবার
      if(!ordersOnly)jobs.push(
        fs.collection("expenses").get({source:"server"}).then(snap=>{
          const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.date||0)-new Date(a.at||a.date||0));
          setExpenses(list);
        }),
        fs.collection("woodlots").get({source:"server"}).then(snap=>{
          const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
          setWoodLots(list);
        }),
        fs.collection("payrollWeeks").get({source:"server"}).then(snap=>{
          const map={};snap.docs.forEach(d=>{map[d.id]=d.data()});setPayrollWeeks(map);
        }),
        fs.collection("workers").get({source:"server"}).then(snap=>{setWorkers(snap.docs.map(d=>d.data()))}),
        fs.doc("meta/db").get({source:"server"}).then(s=>{if(s.exists)setDb(s.data())}),
        fs.doc("meta/woodSettings").get({source:"server"}).then(s=>{setWoodSettings(s.exists?s.data():{})}),
        fs.doc("meta/laborSettings").get({source:"server"}).then(s=>{setLaborSettings(s.exists?s.data():{})}),
        fs.doc("meta/carpenters").get({source:"server"}).then(s=>{setCarpenters(s.exists?(s.data().list||[]):[])}),
        fs.doc("meta/rackBands").get({source:"server"}).then(s=>{setRackBands(s.exists?(s.data().list||[]):[])}),
        fs.doc("meta/rackSplits").get({source:"server"}).then(s=>{setRackSplits(s.exists?(s.data().list||[]):[])})
      );
      return Promise.allSettled(jobs).then((results)=>{
        const ordersRes=results[0];
        const ordersOk=ordersRes&&ordersRes.status==="fulfilled";
        // ── কোটা শেষ (resource-exhausted): এটাই একমাত্র অবস্থা যেটা সফটওয়্যার নিজে সারাতে পারে না
        // — Firebase-এর দিনের সীমা শেষ, তাই পড়াই সম্ভব না, প্রতিটা ডিভাইস তখন নিজের পুরনো ক্যাশ
        // দেখাতে থাকে (এভাবেই ডিভাইসে ডিভাইসে সংখ্যা আলাদা হয়ে যায়)। ধরা পড়লে ১০ মিনিট থেমে
        // থাকা হয়, যাতে অবস্থা আরও খারাপ না হয় ──
        const quotaHit=results.some(r=>r.status==="rejected"&&r.reason&&(r.reason.code==="resource-exhausted"||/quota|resource-exhausted/i.test(r.reason.message||"")));
        if(quotaHit){
          quotaBackoffUntilRef.current=Date.now()+600000;
          setConnError("Firebase-এর দিনের পড়ার সীমা শেষ হয়ে গেছে — এই অবস্থায় ডিভাইসগুলো নিজের পুরনো তথ্য দেখাতে থাকে। সীমা রিসেট হলে (পরদিন) নিজে থেকেই ঠিক হয়ে যাবে।");
          return;
        }
        if(ordersOk){
          syncFailCountRef.current=0;
          setLastSyncAt(new Date());
          setConnError(null);
        }else{
          syncFailCountRef.current+=1;
          if(syncFailCountRef.current>=3)setConnError("বারবার সার্ভারের সাথে সিঙ্ক করা যাচ্ছে না — ইন্টারনেট সংযোগ পরীক্ষা করুন বা পেজ রিলোড করুন");
        }
      });
    };
    refreshFromServerRef.current=refreshFromServer;
    // ── কোনো টাইমার নেই। প্রতিটা কালেকশনেই রিয়েল-টাইম লিসেনার (onSnapshot) বসানো আছে — Firebase
    // সেখানে শুধু যেই ডকুমেন্ট আসলে বদলেছে সেটুকুরই হিসাব নেয়, বাকি সময় বসে থাকলে কোনো খরচ নেই।
    // অর্থাৎ "শুধু নতুন পরিবর্তনটুকু সব ডিভাইসে পাঠানো" — এটা আগে থেকেই চালু ছিল, আর প্রতি ২০
    // সেকেন্ডের ওই পুরো-ডেটা পড়াটা তার উপরে সম্পূর্ণ বাড়তি অপচয় ছিল, যা দিনের কোটা শেষ করে
    // দিচ্ছিল। এখন সার্ভারের সাথে পুরো মিলিয়ে দেখা হয় শুধু তখনই যখন অ্যাপটা খোলা/সামনে আনা হয়
    // (লিংকে ক্লিক করা, ট্যাবে ফেরা, নেট ফিরে আসা) — তখন একবার, তাতেই সব ডিভাইসে এক তথ্য নিশ্চিত ──
    const onWake=()=>{refreshFromServer();retryPendingWrites()};
    document.addEventListener("visibilitychange",onWake);
    window.addEventListener("focus",onWake);
    window.addEventListener("online",onWake);
    // চালু হওয়ার পরপরই একবার — এতে এই ডিভাইসে আটকে থাকা কোনো অর্ডার সাথে সাথেই সার্ভারে চলে যায়
    const firstReconcile=setTimeout(()=>{refreshFromServer(true,false)},10000);
    return()=>{clearTimeout(firstReconcile);document.removeEventListener("visibilitychange",onWake);window.removeEventListener("focus",onWake);window.removeEventListener("online",onWake)};
  },[]);

  const saveDb=(newDb)=>{
    setDb(newDb);
    if(fsRef.current)fsRef.current.doc("meta/db").set(newDb).catch(err=>alert("⚠️ ক্লাউডে সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  // ── ক্রমিক অর্ডার নম্বর — Firestore transaction দিয়ে, যাতে দুইটা ডিভাইস একই সময়ে
  // নতুন অর্ডার শুরু করলেও কখনো একই নম্বর না পায়। ফরম্যাট আগের মতোই RF-YYYYMMDD-ক্রমিক,
  // শুধু শেষের অংশটা এখন এলোমেলো না হয়ে সত্যিকারের ক্রমিক সংখ্যা। শুধু সংযোগ না থাকলে
  // পুরনো (তারিখ+এলোমেলো) পদ্ধতি ফলব্যাক হিসেবে ব্যবহার হয়, যাতে অফলাইনেও অর্ডার নেওয়া আটকে না যায়। ──
  const getNextOrderNumber=async()=>{
    if(!fsRef.current)return genNo();
    // ── একবার ব্যর্থ হলেই সাথে সাথে র‍্যান্ডম ফলব্যাকে না গিয়ে দুইবার আবার চেষ্টা করা হয় —
    // বেশিরভাগ নেটওয়ার্ক সমস্যা কয়েক মুহূর্তের হয়, সাথে সাথেই হাল ছেড়ে দেওয়ার দরকার নেই ──
    for(let attempt=0;attempt<3;attempt++){
      try{
        const counterRef=fsRef.current.doc("meta/orderCounter");
        const next=await fsRef.current.runTransaction(async(tx)=>{
          const doc=await tx.get(counterRef);
          const current=(doc.exists&&doc.data().lastNumber)||0;
          const n=current+1;
          tx.set(counterRef,{lastNumber:n});
          return n;
        });
        const d=new Date().toISOString().slice(0,10).replace(/-/g,"");
        return`RF-${d}-${String(next).padStart(6,"0")}`;
      }catch(e){
        if(attempt<2)await new Promise(r=>setTimeout(r,800));
      }
    }
    return genNo();
  };
  const estimateOrderBytes=(o)=>{try{return JSON.stringify(o).length}catch(e){return 0}};
  const saveOrder=(o)=>{
    setDraft(o);
    navigate({page:"preview",orderNo:o.no,slip:0,from:"home"});
    const save=async()=>{
      if(estimateOrderBytes(o)>950000){
        await autoResolveTooLarge(o.no,false,o);
        return;
      }
      if(!fsRef.current)return;
      try{
        await fsRef.current.collection("orders").doc(o.no).set(o);
      }catch(err){
        if(isLikelyTooLargeError(err))await autoResolveTooLarge(o.no,false,o);
        else queuePendingWrite({kind:"order",orderNo:o.no,data:o,merge:false});
      }
    };
    save();
  };
  // ── অর্ডার আপডেট — সুরক্ষিত পদ্ধতি ──
  // আগে পুরো ডকুমেন্ট মুছে নতুন করে লেখা হতো। ফলে কোনো স্ক্রিন যদি অর্ডারের একটু পুরনো কপি
  // ধরে রাখত, সেই কপি দিয়ে লিখলে পরে যোগ হওয়া পেমেন্ট বা ডেলিভারি স্ট্যাটাস মুছে যেতে পারত।
  // এখন: (১) সর্বশেষ পরিচিত কপির উপরে পরিবর্তন বসানো হয়, (২) টাকার হিসাব ও স্ট্যাটাসের মতো
  // জরুরি ক্ষেত্র কখনোই ঢাকা পড়ে না, (৩) merge:true — অনুপস্থিত ক্ষেত্র সার্ভারে মুছে যায় না।
  const PROTECTED_ORDER_FIELDS=["payments","delivered","deliveredAt","cancelled","cancelledAt"];
  const updateOrder=(updated)=>{
    const live=orders.find(o=>o.no===updated.no)||null;
    let safe={...(live||{}),...updated};
    if(live){
      PROTECTED_ORDER_FIELDS.forEach(f=>{
        const incomingHasIt=Object.prototype.hasOwnProperty.call(updated,f)&&updated[f]!==undefined;
        // ইচ্ছাকৃতভাবে এই ক্ষেত্র বদলানো হলে (যেমন বাতিল করা) সেটাই মানা হবে,
        // নাহলে সার্ভারের সর্বশেষ মানটাই অক্ষত থাকবে
        if(!incomingHasIt&&live[f]!==undefined)safe[f]=live[f];
      });
    }
    Object.keys(safe).forEach(k=>{if(safe[k]===undefined)delete safe[k]}); // Firestore undefined নেয় না
    setOrders(prev=>prev.map(o=>o.no===safe.no?safe:o));
    if(draft&&draft.no===safe.no)setDraft(safe);
    const push=async()=>{
      if(estimateOrderBytes(safe)>950000){
        await autoResolveTooLarge(safe.no,true,safe);
        return;
      }
      if(!fsRef.current)return;
      try{
        await fsRef.current.collection("orders").doc(safe.no).set(safe,{merge:true});
      }catch(err){
        if(isLikelyTooLargeError(err))await autoResolveTooLarge(safe.no,true,safe);
        else queuePendingWrite({kind:"order",orderNo:safe.no,data:safe,merge:true});
      }
    };
    push();
  };
  // ── এই দুটো atomic — টাকার হিসাব ও ডেলিভারি স্ট্যাটাসের মতো জরুরি তথ্যের জন্য।
  // পুরো অর্ডার নতুন করে না লিখে শুধু নির্দিষ্ট অংশটাই সার্ভারে পাঠানো হয়, তাই অন্য কোনো
  // ডিভাইস/সেশনের কাছে থাকা কপি একটু পুরনো হলেও সেটা এই লেখাকে হারিয়ে ফেলতে পারবে না। ──
  const addOrderPayment=(orderNo,payment)=>{
    const withId={...payment,id:payment.id||("pay_"+Date.now())};
    setOrders(prev=>prev.map(o=>o.no===orderNo?{...o,payments:[...(o.payments||[]),withId]}:o));
    if(draft&&draft.no===orderNo)setDraft(prev=>({...prev,payments:[...(prev.payments||[]),withId]}));
    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).set({payments:firebase.firestore.FieldValue.arrayUnion(withId)},{merge:true}).catch(err=>alert("⚠️ পেমেন্ট সিঙ্ক করতে সমস্যা হয়েছে — ইন্টারনেট সংযোগ যাচাই করুন: "+err.message));
  };
  const setOrderDelivered=(orderNo,delivered,deliveredAt)=>{
    setOrders(prev=>prev.map(o=>o.no===orderNo?{...o,delivered,deliveredAt}:o));
    if(draft&&draft.no===orderNo)setDraft(prev=>({...prev,delivered,deliveredAt}));
    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).set({delivered,deliveredAt},{merge:true}).catch(err=>alert("⚠️ ডেলিভারি স্ট্যাটাস সিঙ্ক করতে সমস্যা হয়েছে — ইন্টারনেট সংযোগ যাচাই করুন: "+err.message));
  };
  const deleteOrderPermanently=(orderNo)=>{
    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).delete().catch(err=>alert("⚠️ ডিলিট করতে সমস্যা হয়েছে: "+err.message));
    setDraft(null);
    goBack();
  };
  const saveExpense=(exp)=>{
    const id=exp.id||("exp_"+Date.now());
    const withId={...exp,id};
    if(fsRef.current)fsRef.current.collection("expenses").doc(id).set(withId).catch(err=>alert("⚠️ খরচ সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveCarpenters=(list)=>{
    setCarpenters(list);
    if(fsRef.current)fsRef.current.doc("meta/carpenters").set({list}).catch(()=>{});
  };
  const saveWoodLots=(newList)=>{
    setWoodLots(newList);
    if(!fsRef.current)return;
    const newIds=new Set(newList.map(l=>l.id));
    newList.forEach(lot=>fsRef.current.collection("woodlots").doc(lot.id).set(lot).catch(err=>alert("⚠️ কাঠের স্টক সিঙ্ক করতে সমস্যা হয়েছে: "+err.message)));
    woodLots.forEach(lot=>{if(!newIds.has(lot.id))fsRef.current.collection("woodlots").doc(lot.id).delete().catch(()=>{})});
  };
  // সাপ্লায়ারকে দেওয়া পেমেন্টও টাকার হিসাব — একই কারণে atomic (arrayUnion) লেখা হয়
  const addLotPayment=(lotId,payment)=>{
    const withId={...payment,id:payment.id||("lotpay_"+Date.now())};
    setWoodLots(prev=>prev.map(l=>l.id===lotId?{...l,payments:[...(l.payments||[]),withId]}:l));
    if(fsRef.current)fsRef.current.collection("woodlots").doc(lotId).set({payments:firebase.firestore.FieldValue.arrayUnion(withId)},{merge:true}).catch(err=>alert("⚠️ পেমেন্ট সিঙ্ক করতে সমস্যা হয়েছে — ইন্টারনেট সংযোগ যাচাই করুন: "+err.message));
  };
  const saveWorker=(worker)=>{
    const id=worker.id||("worker_"+Date.now());
    const withId={...worker,id};
    setWorkers(prev=>{const exists=prev.some(w=>w.id===id);return exists?prev.map(w=>w.id===id?withId:w):[...prev,withId]});
    if(fsRef.current)fsRef.current.collection("workers").doc(id).set(withId).catch(err=>alert("⚠️ কর্মীর তথ্য সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const deleteWorker=(id)=>{
    setWorkers(prev=>prev.filter(w=>w.id!==id));
    if(fsRef.current)fsRef.current.collection("workers").doc(id).delete().catch(()=>{});
  };
  const savePayrollWeek=(weekEnd,data)=>{
    setPayrollWeeks(prev=>({...prev,[weekEnd]:data}));
    if(fsRef.current)fsRef.current.collection("payrollWeeks").doc(weekEnd).set(data).catch(err=>alert("⚠️ পে-রোল সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  // ── নিচের তিনটা atomic (পরমাণু-সদৃশ) — একাধিক ডিভাইস থেকে একই সপ্তাহে একসাথে এন্ট্রি দিলেও
  // একজনের লেখা আরেকজনের লেখা মুছে ফেলবে না। উপরের savePayrollWeek পুরো ডকুমেন্ট বদলে দেয় বলে
  // একটা ডিভাইসের পুরনো/স্টেল কপি দিয়ে সেভ করলে অন্য ডিভাইসের এন্ট্রি হারিয়ে যেতে পারত — এখন আর পারবে না।
  const updateAttendance=(weekEnd,workerId,days)=>{
    setPayrollWeeks(prev=>{
      const wd=prev[weekEnd]||{attendance:{},advances:[]};
      return{...prev,[weekEnd]:{...wd,attendance:{...(wd.attendance||{}),[workerId]:days}}};
    });
    if(fsRef.current)fsRef.current.collection("payrollWeeks").doc(weekEnd).set({[`attendance.${workerId}`]:days},{merge:true}).catch(err=>alert("⚠️ হাজিরা সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const addAdvanceEntry=(weekEnd,adv)=>{
    setPayrollWeeks(prev=>{
      const wd=prev[weekEnd]||{attendance:{},advances:[]};
      return{...prev,[weekEnd]:{...wd,advances:[...(wd.advances||[]),adv]}};
    });
    if(fsRef.current)fsRef.current.collection("payrollWeeks").doc(weekEnd).set({advances:firebase.firestore.FieldValue.arrayUnion(adv)},{merge:true}).catch(err=>alert("⚠️ অগ্রিম সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const removeAdvanceEntry=(weekEnd,adv)=>{
    setPayrollWeeks(prev=>{
      const wd=prev[weekEnd]||{attendance:{},advances:[]};
      return{...prev,[weekEnd]:{...wd,advances:(wd.advances||[]).filter(a=>a.id!==adv.id)}};
    });
    if(fsRef.current)fsRef.current.collection("payrollWeeks").doc(weekEnd).set({advances:firebase.firestore.FieldValue.arrayRemove(adv)},{merge:true}).catch(err=>alert("⚠️ মুছতে সমস্যা হয়েছে: "+err.message));
  };

  // পিস-লেভেল কোড হিসাবের জন্য woodSettings-এর সাথে র‍্যাক ব্যান্ডগুলো একসাথে পাঠানো হয়,
  // যাতে সব জায়গায় (Transport Slip, Usage Analysis) একই কোড তৈরি হয়
  const woodSettingsWithBands=useMemo(()=>({...woodSettings,__rackBands:rackBands}),[woodSettings,rackBands]);

  if(!tabActive)return<div style={{padding:"40px 24px",textAlign:"center",maxWidth:420,margin:"60px auto"}}>
    <div style={{fontSize:9,color:"#ccc",marginBottom:12}}>v{BUILD_TAG}</div>
    <div style={{fontSize:34,marginBottom:12}}>🔁</div>
    <div style={{fontSize:16,fontWeight:800,color:"#334155",marginBottom:10}}>এই ট্যাবটি নিষ্ক্রিয়</div>
    <div style={{fontSize:12.5,color:"#64748b",lineHeight:1.7,marginBottom:20}}>
      এই ডিভাইসে নতুন একটা ট্যাবে অ্যাপটি খোলা হয়েছে, তাই সেটিই এখন চালু আছে। প্রতি ডিভাইসে একটাই ট্যাব চালু রাখা হয় — এতে সব জায়গায় একই তথ্য থাকে।
    </div>
    <button onClick={()=>{try{localStorage.setItem("rf_active_tab",JSON.stringify({id:tabIdRef.current,ts:Date.now()}))}catch(e){}window.location.reload()}} style={{background:RED,color:"white",border:"none",borderRadius:9,padding:"12px 22px",fontSize:13,fontWeight:700}}>এই ট্যাবেই চালু করুন</button>
  </div>;
  if(!db){
    if(connError)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:RED,marginBottom:10}}>⚠️ সংযোগ সমস্যা</div>
      <div style={{background:"#fef2f2",borderRadius:9,padding:"12px 14px",fontSize:13,color:"#991b1b",marginBottom:16,fontFamily:"monospace",wordBreak:"break-word"}}>{connError}</div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:RED,color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:RED,border:`1.5px solid ${RED}`,borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    if(timedOut)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:"#92400e",marginBottom:10}}>⏳ অনেকক্ষণ ধরে সিঙ্ক হচ্ছে...</div>
      <div style={{fontSize:13,color:"#555",marginBottom:14,textAlign:"left",lineHeight:1.7}}>
        সম্ভাব্য কারণ:<br/>
        ১. ইন্টারনেট সংযোগ দুর্বল বা বন্ধ<br/>
        ২. ব্রাউজারের কোনো "Shield"/"Ad-block" এক্সটেনশন (Brave Shields, uBlock ইত্যাদি) গুগলের সার্ভারে সংযোগ ব্লক করছে — এটা বন্ধ করে আবার চেষ্টা করুন<br/>
        ৩. Firebase কনফিগ কোডে ভুল আছে (ভুল প্রজেক্টের কোড পেস্ট হয়েছে)<br/>
        ৪. ফোনের ডেটা/ওয়াইফাই গুগল সার্ভিস ব্লক করছে এমন নেটওয়ার্ক (কিছু অফিস/স্কুল ওয়াইফাই এমন হয়)
      </div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:"#92400e",color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:"#92400e",border:"1.5px solid #92400e",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    return<div style={{padding:40,textAlign:"center"}}><div style={{fontSize:9,color:"#ccc",marginBottom:10}}>{BUILD_TAG}</div>সিঙ্ক হচ্ছে...</div>;
  }
  if(page==="preview")return<Preview order={viewed||draft} onBack={goBack} slip={slip} setSlip={setSlip} onUpdate={updateOrder} onAddPayment={addOrderPayment} onSetDelivered={setOrderDelivered} onDelete={deleteOrderPermanently} db={db} saveDb={saveDb} carpenters={carpenters} saveCarpenters={saveCarpenters} galleries={galleries} saveGalleryEntry={saveGalleryEntry} woodSettings={woodSettingsWithBands} laborSettings={laborSettings} workers={workers} allOrders={orders} rackSplits={rackSplits}/>;
  if(page==="form")return<Form onSave={saveOrder} onBack={goBack} db={db} saveDb={saveDb} galleries={galleries} woodSettings={woodSettings} laborSettings={laborSettings} orders={orders} getNextOrderNumber={getNextOrderNumber}/>;
  if(page==="history")return<Hist orders={orders} db={db} onBack={goBack} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} highlightNo={highlightNo} q={curScreen.q||""} setQ={q=>replaceTop({...curScreen,q})} statusFilter={curScreen.statusFilter||"all"} setStatusFilter={statusFilter=>replaceTop({...curScreen,statusFilter})} catFilter={curScreen.catFilter||"all"} setCatFilter={catFilter=>replaceTop({...curScreen,catFilter})} sortMode={curScreen.sortMode||"recent"} setSortMode={sortMode=>replaceTop({...curScreen,sortMode})}/>;
  if(page==="manage")return<ManageDB db={db} saveDb={saveDb} galleries={galleries} saveGalleryEntry={saveGalleryEntry} onBack={goBack} navigate={navigate} goBack={goBack} replaceTop={replaceTop} curScreen={curScreen} highlightNo={highlightNo}/>;
  if(page==="woodstock")return<WoodStockPage woodLots={woodLots} saveWoodLots={saveWoodLots} addLotPayment={addLotPayment} woodSettings={woodSettingsWithBands} saveWoodSettings={saveWoodSettings} laborSettings={laborSettings} saveLaborSettings={saveLaborSettings} rackSplits={rackSplits} addRackSplit={addRackSplit} rackBands={rackBands} addRackBand={addRackBand} removeRackBand={removeRackBand} payrollWeeks={payrollWeeks} workers={workers} orders={orders} expenses={expenses} onBack={goBack} view={curScreen.view||"list"} lotId={curScreen.lotId||null} onOpenList={()=>navigate({page:"woodstock",view:"list"})} onOpenDetail={lotId=>navigate({page:"woodstock",view:"detail",lotId})} onOpenNew={()=>navigate({page:"woodstock",view:"new"})} onOpenRates={()=>navigate({page:"woodstock",view:"rates"})} onOpenUsage={()=>navigate({page:"woodstock",view:"usage"})} highlightNo={highlightNo}/>;
  if(page==="expense")return<ExpensePage expenses={expenses} onSave={saveExpense} onBack={goBack}/>;
  if(page==="payroll")return<PayrollPage workers={workers} saveWorker={saveWorker} deleteWorker={deleteWorker} payrollWeeks={payrollWeeks} savePayrollWeek={savePayrollWeek} updateAttendance={updateAttendance} addAdvanceEntry={addAdvanceEntry} removeAdvanceEntry={removeAdvanceEntry} onBack={goBack}/>;
  if(page==="plreport")return<PLReportPage orders={orders} expenses={expenses} workers={workers} payrollWeeks={payrollWeeks} woodLots={woodLots} woodSettings={woodSettings} laborSettings={laborSettings} onBack={goBack}/>;
  return<Home orders={orders} expenses={expenses} woodLots={woodLots} db={db} woodSettings={woodSettings} laborSettings={laborSettings} workers={workers} payrollWeeks={payrollWeeks} alertSettings={alertSettings} saveAlertSettings={saveAlertSettings} backupFailed={backupFailed} lastSyncAt={lastSyncAt} onManualRefresh={manualRefresh} pendingWrites={pendingWrites} onCheckServerSync={checkServerSync} onAcceptServerVersion={acceptServerVersion} onUpdateOrder={updateOrder} onNew={()=>navigate({page:"form"})} onHist={()=>navigate({page:"history"})} onManage={()=>navigate({page:"manage"})} onExpense={()=>navigate({page:"expense"})} onWoodStock={()=>navigate({page:"woodstock",view:"list"})} onPayroll={()=>navigate({page:"payroll"})} onPLReport={()=>navigate({page:"plreport"})} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} onViewDelivery={o=>navigate({page:"preview",orderNo:o.no,slip:5})} online={online} connError={connError} onResetConfig={onResetConfig} folderStatus={folderStatus} connectFolder={connectFolder} highlightNo={highlightNo} onBackupData={backupData} projectId={firebaseConfig?.projectId||""} appId={firebaseConfig?.appId||""} permanentSyncFailures={permanentSyncFailures} autoStuckStatus={autoStuckStatus}/>;
}

/* ── HOME / DASHBOARD ── */
function Home({orders,expenses,woodLots,db,woodSettings,laborSettings,workers,payrollWeeks,alertSettings,saveAlertSettings,backupFailed,lastSyncAt,onManualRefresh,pendingWrites,onCheckServerSync,onAcceptServerVersion,onUpdateOrder,onNew,onHist,onManage,onExpense,onWoodStock,onPayroll,onPLReport,onView,onViewDelivery,online,connError,onResetConfig,folderStatus,connectFolder,highlightNo,onBackupData,projectId,appId,permanentSyncFailures,autoStuckStatus}){
  const now=new Date();
  const[showAllRunning,setShowAllRunning]=useState(false);
  const[showSystemZone,setShowSystemZone]=useState(false);
  // ── উপরের নেভিগেশন বারে ঠিক এই মুহূর্তে কোন বিভাগে আছেন তা ট্র্যাক করার জন্য — স্ক্রল করলে
  // যে বিভাগের হেডার স্টিকি বারের রেখা পার হয়ে গেছে তার মধ্যে সবচেয়ে নিচেরটাই "বর্তমান" ধরা হয়,
  // সেই আইকনটাই বড়+প্রেসড দেখানো হবে (নিচে zoneNavBar-এ) — স্ক্রল বন্ধ হলেও এই অবস্থাতেই থাকবে,
  // পরের বার অন্য বিভাগে স্ক্রল হলে তবেই বদলাবে ──
  const zoneIds=["z-urgent","z-today","z-trend","z-health","z-wood","z-perf","z-sys"];
  const[activeZone,setActiveZone]=useState(zoneIds[0]);
  useEffect(()=>{
    const onScroll=()=>{
      const threshold=64; // স্টিকি বারের উচ্চতার কাছাকাছি
      let current=zoneIds[0];
      for(const id of zoneIds){
        const el=document.getElementById(id);
        if(el&&el.getBoundingClientRect().top<=threshold)current=id;
      }
      setActiveZone(current);
    };
    onScroll();
    window.addEventListener("scroll",onScroll,{passive:true});
    return()=>window.removeEventListener("scroll",onScroll);
  },[]);
  const[syncCheck,setSyncCheck]=useState(null); // null=না চালানো, "loading", অথবা ফলাফল
  const[resending,setResending]=useState({});
  const stats=useMemo(()=>{
    // Running orders (not fully paid = not delivered typically, but we track by payment completion as proxy + delivery date)
    // ── একটা অর্ডারের সব পিসের সব বিভাগ ১০০% শেষ কিনা — এটা "চলমান" থেকে বাদ দিতে
    // এবং "তৈরি শেষ, গ্রাহক নেননি"-তে ধরতে দুই জায়গাতেই ব্যবহার হয়, যাতে একই অর্ডার
    // দুই তালিকাতেই একসাথে না দেখায় ──
    const running=orders.filter(o=>{
      if(o.cancelled)return false;
      if(!o.delivered&&isOrderFullyProgressed(o))return false; // ১০০% শেষ হলে এখন থেকে "তৈরি শেষ" তালিকায় যাবে, এখানে না
      return!o.delivered; // ডেলিভারড হয়ে গেলেই বাদ — বাকি টাকা থাকুক বা না থাকুক; বাকি টাকা আলাদাভাবে "পাওনা"-তে ঠিকই ট্র্যাক হয়
    });
    const withDays=running.map(o=>{
      const daysLeft=o.cust.delivery?daysBetween(todayStr(),o.cust.delivery):999;
      const ip=effectiveItemProgress(o);
      const allPcts=[];
      const allWorkersSet=new Set();
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          allPcts.push((cur&&cur.pct)||0);
          (cur&&cur.workers||[]).forEach(w=>allWorkersSet.add(w));
        });
      });
      const pct=allPcts.length?Math.round(allPcts.reduce((s,v)=>s+v,0)/allPcts.length):0;
      const allWorkers=[...allWorkersSet];
      return{...o,daysLeft,pct,allWorkers};
    }).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Exclude cancelled orders from all financial/analytical stats
    const activeOrders=orders.filter(o=>!o.cancelled);

    // ── এই ৬ মাসের তালিকাটা "বছর অনুযায়ী তুলনা" (yoy) এখনও ব্যবহার করে — বিক্রয়-বনাম-খরচ
    // চার্টের নিজস্ব হিসাব সরিয়ে নেওয়া হয়েছে (নিচে আলাদা useMemo-তে), কিন্তু এই তালিকাটা
    // yoy-এর জন্য এখনও দরকার ──
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    // Year over year - same months across 3 years
    const yoy=months.map(({y,m})=>{
      const thisY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const lastY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-1&&od.getMonth()===m}).length;
      const twoAgoY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-2&&od.getMonth()===m}).length;
      return{label:monthName(m),a:twoAgoY,b:lastY,c:thisY,y};
    });
    const totalRevenue=activeOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const totalExpense=expenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);

    // Category breakdown of running orders (pie chart) - use actual DB category names
    const PIE_COLORS=[CHART_SOFT_RED,CHART_SOFT_BLUE,CHART_SOFT_PURPLE,CHART_SOFT_TEAL,CHART_SOFT_ORANGE,"#d4b26a",CHART_SOFT_GREY,CHART_SOFT_PINK];
    const catCount={};
    running.forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      const key=it.catKey||catLabel;
      catCount[key]=catCount[key]||{label:catLabel,value:0};
      catCount[key].value+=1;
    }));
    const catPie=Object.values(catCount).sort((a,b)=>b.value-a.value).slice(0,8).map((c,i)=>({...c,color:PIE_COLORS[i%PIE_COLORS.length]}));

    // This month stats
    const thisMonthOrders=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===now.getFullYear()&&od.getMonth()===now.getMonth()});
    const avgOrderValue=activeOrders.length?Math.round(totalRevenue/activeOrders.length):0;
    const totalOutstanding=activeOrders.reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      const rem=(parseFloat(o.cust.total)||0)-paid;
      return s+(rem>0?rem:0);
    },0);
    const oneYearAgo=new Date(now);oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);

    // ── ৩০ দিনের নগদ প্রবাহ পূর্বাভাস — "13-week cash flow forecast" পদ্ধতির সরলীকৃত রূপ ──
    // ভেতরে: আগামী ৩০ দিনে ডেলিভারির কথা এমন অর্ডারের বাকি টাকা
    // বাইরে: গত ৩ মাসের গড় মাসিক খরচ (বেতন + কাঠ ক্রয় + অন্যান্য খরচ)
    const next30=addDays(todayStr(),30);
    const cfInflow=activeOrders.filter(o=>!o.delivered&&o.cust.delivery&&o.cust.delivery>=todayStr()&&o.cust.delivery<=next30)
      .reduce((s,o)=>{
        const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
        return s+Math.max(0,(parseFloat(o.cust.total)||0)-paid);
      },0);
    const threeMoAgoStr=monthsAgo(todayStr(),3);
    const recentExpenseTotal=(expenses||[]).filter(e=>e.date>=threeMoAgoStr).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
    const recentWoodTotal=(woodLots||[]).filter(l=>l.date>=threeMoAgoStr).reduce((s,l)=>s+(l.logs||[]).reduce((ls,lg)=>ls+lg.cft,0)*(parseFloat(l.ratePerCft)||0),0);
    let recentPayrollTotal=0;
    Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{
      if(weekEnd<threeMoAgoStr)return;
      Object.entries(wd.attendance||{}).forEach(([wid,days])=>{
        const w=(workers||[]).find(x=>x.id===wid);
        if(w)recentPayrollTotal+=(parseFloat(days)||0)*(parseFloat(w.dailyRate)||0);
      });
    });
    const cfOutflow=(recentExpenseTotal+recentWoodTotal+recentPayrollTotal)/3; // মাসিক গড়
    const cfNet=cfInflow-cfOutflow;


    // ── ১. তৈরি শেষ কিন্তু গ্রাহক নেননি — দোকানে পড়ে থাকা পণ্য ও আটকে থাকা টাকা ──
    const readyNotCollected=activeOrders.filter(o=>{
      if(o.delivered)return false;
      return isOrderFullyProgressed(o);
    }).map(o=>{
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const due=Math.max(0,(parseFloat(o.cust.total)||0)-paid);
      // কাজ শেষ হওয়ার তারিখ = সব বিভাগের শেষ তারিখগুলোর মধ্যে সর্বশেষটি
      const ip=effectiveItemProgress(o);
      let lastEnd="";
      Object.values(ip).forEach(item=>Object.values(item||{}).forEach(d=>{if(d&&d.end&&d.end>lastEnd)lastEnd=d.end}));
      const waitingDays=lastEnd?daysBetween(lastEnd,todayStr()):null;
      return{...o,due,lastEnd,waitingDays};
    }).sort((a,b)=>(b.waitingDays||0)-(a.waitingDays||0));
    const readyValueStuck=readyNotCollected.reduce((s,o)=>s+o.due,0);

    // ── ২. উৎপাদনের গতি: অর্ডার নেওয়া থেকে কাজ ১০০% শেষ হতে গড়ে কত দিন (গ্রাহকের দেরি এতে ধরা হয় না) ──
    const prodTimes=[];
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      const pcts=[];let lastEnd="";
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{const cur=(ip[ikey]||{})[d.id];pcts.push((cur&&cur.pct)||0);if(cur&&cur.end&&cur.end>lastEnd)lastEnd=cur.end});
      });
      if(pcts.length&&pcts.every(p=>p>=100)&&lastEnd&&o.cust.date){
        const days=daysBetween(o.cust.date,lastEnd);
        if(days>=0)prodTimes.push({days,finishedAt:lastEnd});
      }
    });
    const avgProdDays=prodTimes.length?Math.round(prodTimes.reduce((s,p)=>s+p.days,0)/prodTimes.length):null;
    const threeMonthsAgo=monthsAgo(todayStr(),3);
    const recentProd=prodTimes.filter(p=>p.finishedAt>=threeMonthsAgo);
    const olderProd=prodTimes.filter(p=>p.finishedAt<threeMonthsAgo);
    const recentAvgProd=recentProd.length?Math.round(recentProd.reduce((s,p)=>s+p.days,0)/recentProd.length):null;
    const olderAvgProd=olderProd.length?Math.round(olderProd.reduce((s,p)=>s+p.days,0)/olderProd.length):null;

    // ── ৪. মৌসুমি প্রবণতা এখন আলাদা useMemo-তে সরানো হয়েছে (নিচে), যাতে সময়সীমা বাছাই করার
    // সময় পুরো ড্যাশবোর্ড আবার হিসাব না হয় ──

    // ── ৫. কাঠের দাম বৃদ্ধির সতর্কতা: গত ৬ মাসে কোন কাঠের দাম কত % বেড়েছে ──
    const sixMonthsAgo=monthsAgo(todayStr(),6);
    const woodPriceAlerts=[];
    Object.entries(WOOD).forEach(([wk,wv])=>{
      const hist=((woodSettings&&woodSettings[wk]&&woodSettings[wk].rateHistory)||[]).slice().sort((a,b)=>(a.from||"").localeCompare(b.from||""));
      if(hist.length<2)return;
      const latest=hist[hist.length-1];
      const baseline=hist.filter(h=>h.from<=sixMonthsAgo).pop()||hist[0];
      if(!baseline||!latest||baseline===latest)return;
      const oldR=parseFloat(baseline.rate)||0,newR=parseFloat(latest.rate)||0;
      if(oldR<=0||newR<=0)return;
      const pct=((newR-oldR)/oldR)*100;
      if(Math.abs(pct)>=AL(alertSettings,"woodPricePct"))woodPriceAlerts.push({wood:wv.bn,oldRate:oldR,newRate:newR,pct,since:baseline.from});
    });
    woodPriceAlerts.sort((a,b)=>b.pct-a.pct);

    // ── ৬. কোন ফার্নিচারে লাভের হার বেশি (ডেলিভারি হওয়া অর্ডার থেকে) ──
    // বাধা বিভাগ চিহ্নিতকরণ (Goldratt-এর ৫ ধাপের ১ম ধাপ) — যেটাতে গড়ে সবচেয়ে বেশি সময় লাগে
    const bnDur={};
    DEPTS.forEach(d=>bnDur[d.id]=[]);
    activeOrders.forEach(o=>{
      const ipx=effectiveItemProgress(o);
      Object.values(ipx).forEach(itp=>DEPTS.forEach(d=>{
        const cur=itp&&itp[d.id];
        if(cur&&cur.start&&cur.end){const dd=daysBetween(cur.start,cur.end);if(dd>=0)bnDur[d.id].push(dd)}
      }));
    });
    let bottleneckDeptId=null,bottleneckDeptBn=null,bnBest=0;
    DEPTS.forEach(d=>{
      const l=bnDur[d.id];
      if(l.length>=2){const av=l.reduce((s,v)=>s+v,0)/l.length;if(av>bnBest){bnBest=av;bottleneckDeptId=d.id;bottleneckDeptBn=d.bn}}
    });
    const catProfit={};
    activeOrders.filter(o=>o.delivered).forEach(o=>{
      const lRate=orderLabourRate(o,laborSettings);
      (o.items||[]).forEach(it=>{
        const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
        const woodCost=itemWoodCost(it,o,woodSettings);
        const labourCost=totalCft(it.sections||[])*(it.qty||1)*lRate;
        const revenue=(parseFloat(it.price)||0)*(parseFloat(it.qty)||1);
        if(revenue<=0)return;
        if(!catProfit[catLabel])catProfit[catLabel]={label:catLabel,revenue:0,cost:0,count:0,bottleneckDays:0,bnSamples:0};
        catProfit[catLabel].revenue+=revenue;
        catProfit[catLabel].cost+=woodCost+labourCost;
        catProfit[catLabel].count+=1;
        // থ্রুপুট অ্যাকাউন্টিং (Goldratt): এই আইটেম বাধা-বিভাগে কত দিন দখল করেছিল
        if(bottleneckDeptId){
          const ipx=effectiveItemProgress(o);
          const ikey=it.itemId||"idx_0";
          const bn=(ipx[ikey]||{})[bottleneckDeptId];
          if(bn&&bn.start&&bn.end){
            const dd=daysBetween(bn.start,bn.end);
            if(dd>=0){catProfit[catLabel].bottleneckDays+=Math.max(dd,0.5);catProfit[catLabel].bnSamples+=1}
          }
        }
      });
    });
    const catProfitRanked=Object.values(catProfit).map(c=>({...c,
      profit:c.revenue-c.cost,
      margin:c.revenue>0?((c.revenue-c.cost)/c.revenue)*100:0,
      // বাধার প্রতিদিনে কত টাকা লাভ — Goldratt-এর মতে এটাই আসল অগ্রাধিকারের মাপ
      profitPerBnDay:c.bottleneckDays>0?(c.revenue-c.cost)/c.bottleneckDays:null
    })).sort((a,b)=>b.margin-a.margin);
    const throughputRanked=catProfitRanked.filter(c=>c.profitPerBnDay!==null).sort((a,b)=>b.profitPerBnDay-a.profitPerBnDay);

    // ── ৭. কর্মী-ভিত্তিক উৎপাদনশীলতা: কে কত CFT কাজে যুক্ত ছিলেন (গত ৬ মাস) ──
    const workerCft={};
    activeOrders.filter(o=>o.cust.date>=sixMonthsAgo).forEach(o=>{
      const ip=effectiveItemProgress(o);
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        const itemCft=totalCft(it.sections||[])*(it.qty||1);
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          if(!cur||!(cur.pct>=100)||!(cur.workers||[]).length)return;
          const share=itemCft/DEPTS.length/cur.workers.length;
          cur.workers.forEach(w=>{workerCft[w]=(workerCft[w]||0)+share});
        });
      });
    });
    const workerRanked=Object.entries(workerCft).map(([name,c])=>({name,cft:c})).sort((a,b)=>b.cft-a.cft);

    const catAllCount={};
    activeOrders.filter(o=>new Date(o.cust.date)>=oneYearAgo).forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      catAllCount[catLabel]=(catAllCount[catLabel]||0)+1;
    }));
    const topCategoryRanked=Object.entries(catAllCount).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));

    // ── বাৎসরিক অর্ডার ও মূল্য: ডেটা যে বছরগুলোতে আছে তার বদলে সবসময় শেষ ৬ বছর (তথ্য না থাকা
    // বছরও ০ দেখাবে), আর প্রতিটার সাথে আগের বছরের তুলনায় প্রবৃদ্ধি % ──
    const revenueInYear=(y)=>activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y).reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const curYearForYearly=now.getFullYear();
    const years=[];
    for(let y=curYearForYearly-5;y<=curYearForYearly;y++)years.push(y);
    const yearly=years.map(y=>{
      const yOrders=activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y);
      const revenue=yOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
      const prevRevenue=revenueInYear(y-1);
      const growthPct=prevRevenue>0?((revenue-prevRevenue)/prevRevenue)*100:null;
      return{label:String(y),count:yOrders.length,revenue,growthPct};
    });

    // ── বর্তমান মাসটা গত ৬ বছরে (এই বছরসহ) কেমন গেছে — টাকার ভিত্তিতে, প্রতি বছরের প্রবৃদ্ধি%সহ ──
    const monthlyAgg={}; // key "y-m" -> {count, revenue}
    activeOrders.forEach(o=>{
      const od=new Date(o.cust.date);
      const key=`${od.getFullYear()}-${od.getMonth()}`;
      monthlyAgg[key]=monthlyAgg[key]||{count:0,revenue:0,y:od.getFullYear(),m:od.getMonth()};
      monthlyAgg[key].count+=1;
      monthlyAgg[key].revenue+=(parseFloat(o.cust.total)||0);
    });
    const curMonthIdx=now.getMonth();
    const revenueInMonthYear=(y)=>(monthlyAgg[`${y}-${curMonthIdx}`]||{revenue:0}).revenue;
    const sameMonthTrend=[];
    for(let y=curYearForYearly-5;y<=curYearForYearly;y++){
      const agg=monthlyAgg[`${y}-${curMonthIdx}`]||{count:0,revenue:0};
      const prevRevenue=revenueInMonthYear(y-1);
      const growthPct=prevRevenue>0?((agg.revenue-prevRevenue)/prevRevenue)*100:null;
      sameMonthTrend.push({label:String(y),count:agg.count,revenue:agg.revenue,growthPct});
    }
    const sameMonthLabel=monthName(curMonthIdx);

    // Wood stock pie (uncut/available logs by wood type)
    const WOOD_COLORS={S:CHART_SOFT_ORANGE,M:CHART_SOFT_RED,A:CHART_SOFT_GREEN,K:CHART_SOFT_TEAL,E:CHART_SOFT_PURPLE};
    const stockByType={};
    (woodLots||[]).forEach(lot=>{
      const availCft=(lot.logs||[]).filter(l=>!l.cut).reduce((s,l)=>s+l.cft,0);
      if(availCft<=0)return;
      stockByType[lot.woodType]=(stockByType[lot.woodType]||0)+availCft;
    });
    // ── আমার নিজের দেনা: বাকিতে কেনা খরচ + কাঠের লটে সাপ্লায়ারকে বাকি — সাপ্লায়ার অনুযায়ী ──
    const payableBySupplier={};
    (expenses||[]).filter(e=>e.payMethod==="বাকি").forEach(e=>{
      const sup=(e.supplier||"").trim()||"অজানা বিক্রেতা";
      if(!payableBySupplier[sup])payableBySupplier[sup]={name:sup,phone:e.supplierPhone||"",amount:0,items:0,kind:"খরচ"};
      payableBySupplier[sup].amount+=parseFloat(e.total)||0;
      payableBySupplier[sup].items+=1;
      if(e.supplierPhone&&!payableBySupplier[sup].phone)payableBySupplier[sup].phone=e.supplierPhone;
    });
    (woodLots||[]).forEach(lot=>{
      const cost=(lot.logs||[]).reduce((s,l)=>s+l.cft,0)*(parseFloat(lot.ratePerCft)||0);
      const paid=(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const rem=cost-paid;
      if(rem<=0)return;
      const sup=(lot.supplier||"").trim()||"অজানা কাঠ সাপ্লায়ার";
      if(!payableBySupplier[sup])payableBySupplier[sup]={name:sup,phone:lot.supplierPhone||"",amount:0,items:0,kind:"কাঠ"};
      else if(payableBySupplier[sup].kind==="খরচ")payableBySupplier[sup].kind="খরচ + কাঠ";
      payableBySupplier[sup].amount+=rem;
      payableBySupplier[sup].items+=1;
      if(lot.supplierPhone&&!payableBySupplier[sup].phone)payableBySupplier[sup].phone=lot.supplierPhone;
    });
    const payables=Object.values(payableBySupplier).sort((a,b)=>b.amount-a.amount);
    const totalPayable=payables.reduce((s,p)=>s+p.amount,0);

    // ── ৪. বিভাগভিত্তিক গড় সময় — সম্পন্ন হওয়া সব বিভাগীয় কাজ থেকে (কোথায় বাধা আছে বোঝার জন্য) ──
    const deptDurations={};
    DEPTS.forEach(d=>deptDurations[d.id]=[]);
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      Object.values(ip).forEach(itemProg=>{
        DEPTS.forEach(d=>{
          const cur=itemProg&&itemProg[d.id];
          if(cur&&cur.start&&cur.end){
            const days=daysBetween(cur.start,cur.end);
            if(days>=0)deptDurations[d.id].push(days);
          }
        });
      });
    });
    const deptAvg=DEPTS.map(d=>{
      const list=deptDurations[d.id];
      return{id:d.id,bn:d.bn,avg:list.length?list.reduce((s,v)=>s+v,0)/list.length:null,count:list.length};
    });
    const deptAvgMax=Math.max(...deptAvg.map(d=>d.avg||0),0.0001);

    // ── ৩. আটকে থাকা অর্ডার — শুরু হয়েছে কিন্তু শেষ হয়নি, নিজের বিভাগের স্বাভাবিক সময়ের চেয়ে অনেক বেশি সময় ধরে ──
    const stuckThreshold=(deptId)=>{
      const d=deptAvg.find(x=>x.id===deptId);
      if(d&&d.avg&&d.count>=3)return Math.max(14,d.avg*AL(alertSettings,"stuckMultiplier"));
      return AL(alertSettings,"stuckFallbackDays"); // যথেষ্ট ইতিহাস না থাকলে এই সীমা
    };
    const stuckItems=[];
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          if(cur&&cur.start&&!cur.end&&(cur.pct||0)<100){
            const daysSince=daysBetween(cur.start,todayStr());
            if(daysSince>=stuckThreshold(d.id))stuckItems.push({order:o,itemName:it.variantBn,deptBn:d.bn,daysSince,pct:cur.pct||0});
          }
        });
      });
    });
    stuckItems.sort((a,b)=>b.daysSince-a.daysSince);

    // ── ৫. পে-রোল বনাম উৎপাদন: মাসিক মজুরি ÷ সেই মাসে সম্পন্ন CFT ──
    const last6Months=[];
    for(let i=5;i>=0;i--){const d=new Date(now);d.setMonth(d.getMonth()-i);last6Months.push({y:d.getFullYear(),m:d.getMonth()})}
    const payrollProdByMonth=last6Months.map(({y,m})=>{
      let payroll=0;
      Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{
        const d=parseISO(weekEnd);
        if(d.getUTCFullYear()===y&&d.getUTCMonth()===m){
          Object.entries(wd.attendance||{}).forEach(([wid,days])=>{
            const w=(workers||[]).find(x=>x.id===wid);
            if(w)payroll+=(parseFloat(days)||0)*(parseFloat(w.dailyRate)||0);
          });
        }
      });
      let cftDone=0;
      activeOrders.forEach(o=>{
        const ip=effectiveItemProgress(o);
        (o.items||[]).forEach((it,idx)=>{
          const ikey=it.itemId||`idx_${idx}`;
          const itemProg=ip[ikey]||{};
          const ends=DEPTS.map(d=>itemProg[d.id]&&itemProg[d.id].end).filter(Boolean);
          const pcts=DEPTS.map(d=>(itemProg[d.id]&&itemProg[d.id].pct)||0);
          if(ends.length===DEPTS.length&&pcts.every(p=>p>=100)){
            const lastEnd=ends.slice().sort().pop();
            const ed=parseISO(lastEnd);
            if(ed.getUTCFullYear()===y&&ed.getUTCMonth()===m)cftDone+=totalCft(it.sections||[])*(it.qty||1);
          }
        });
      });
      return{y,m,payroll,cft:cftDone,perCft:cftDone>0?payroll/cftDone:null};
    });
    const validPerCft=payrollProdByMonth.filter(p=>p.perCft!==null);
    const setLabourRate=parseFloat((laborSettings&&laborSettings.ratePerCft)||0);

    // ── ৬. যেসব মডেলে কাঠের মাপ বসানো নেই — অর্ডার এলে খরচ ও র‍্যাক হিসাব ভুল হবে ──
    const emptyWoodModels=[];
    if(db){
      Object.entries(db).forEach(([catK,cat])=>{
        Object.entries(cat.variants||{}).forEach(([vK,v])=>{
          if(isEmptyWood(v))emptyWoodModels.push({catBn:cat.bn,varBn:v.bn});
        });
      });
    }

    const stockPie=Object.entries(stockByType).map(([wt,val])=>({label:WOOD[wt].bn,value:val,color:WOOD_COLORS[wt]||"#888"}));

    // ── পুনরাবৃত্ত গ্রাহক: ফোন নম্বর ধরে কতজন একবারের বেশি অর্ডার করেছেন ──
    const byPhone={};
    activeOrders.forEach(o=>{
      const ph=(o.cust.phone||"").trim();
      if(!ph)return;
      if(!byPhone[ph])byPhone[ph]={count:0,total:0,name:o.cust.name};
      byPhone[ph].count+=1;
      byPhone[ph].total+=parseFloat(o.cust.total)||0;
    });
    const custList=Object.values(byPhone);
    const repeatCusts=custList.filter(c=>c.count>1);
    const repeatRate=custList.length?(repeatCusts.length/custList.length)*100:0;
    const repeatRevenue=repeatCusts.reduce((s,c)=>s+c.total,0);
    const repeatRevenueShare=totalRevenue>0?(repeatRevenue/totalRevenue)*100:0;

    // ── কাঠের মজুদ সতর্কতা: বর্তমান মজুদ ÷ মাসিক গড় ব্যবহার = আর কত মাস চলবে ──
    const sixMoAgo=monthsAgo(todayStr(),6);
    const consumedByType={};
    activeOrders.filter(o=>o.cust.date>=sixMoAgo).forEach(o=>{
      (o.items||[]).forEach(it=>{
        (it.sections||[]).forEach(sec=>{
          (sec.pieces||[]).forEach(p=>{
            const pw=pieceWoodType(p,sec,it.wood);
            consumedByType[pw]=(consumedByType[pw]||0)+cft((p.pc||0)*(it.qty||1),p.h,p.l,p.w);
          });
        });
      });
    });
    // ── পুনঃক্রয় বিন্দু: গড় ব্যবহার × সরবরাহে লাগা সময় + নিরাপত্তা মজুদ ──
    // কাঠ কিনে স'মিলে কাটিয়ে ব্যবহারের উপযোগী হতে যে সময় লাগে, সেটাও হিসাবে ধরা হয়
    const leadDays=AL(alertSettings,"supplyLeadDays");
    const safetyPct=AL(alertSettings,"safetyPct");
    const stockAlerts=Object.keys(WOOD).map(wt=>{
      const stock=stockByType[wt]||0;
      const monthlyUse=(consumedByType[wt]||0)/6;
      if(monthlyUse<=0)return null; // ব্যবহার না থাকলে সতর্কতার দরকার নেই
      const dailyUse=monthlyUse/30;
      const leadNeed=dailyUse*leadDays;                 // কাঠ আসতে আসতে যতটা লাগবে
      const safety=leadNeed*(safetyPct/100);            // দেরি/হঠাৎ চাহিদার জন্য বাফার
      const reorderPoint=leadNeed+safety;               // এই মজুদে নামলেই কেনার সময়
      const daysLeft=dailyUse>0?stock/dailyUse:null;
      return{wood:WOOD[wt].bn,key:wt,stock,monthlyUse,monthsLeft:stock/monthlyUse,
        reorderPoint,daysLeft,shouldOrderNow:stock<=reorderPoint,
        daysUntilOrder:dailyUse>0?Math.round((stock-reorderPoint)/dailyUse):null};
    }).filter(Boolean).sort((a,b)=>a.monthsLeft-b.monthsLeft);

    return{running:withDays,yoy,totalRevenue,totalExpense,catPie,thisMonthCount:thisMonthOrders.length,avgOrderValue,totalOutstanding,topCategoryRanked,yearly,sameMonthTrend,sameMonthLabel,stockPie,payables,totalPayable,cfInflow,cfOutflow,cfNet,deptAvg,deptAvgMax,stuckItems,payrollProdByMonth,validPerCft,setLabourRate,emptyWoodModels,repeatRate,repeatCount:repeatCusts.length,totalCustCount:custList.length,repeatRevenueShare,stockAlerts,readyNotCollected,readyValueStuck,avgProdDays,recentAvgProd,olderAvgProd,prodCount:prodTimes.length,woodPriceAlerts,catProfitRanked,throughputRanked,bottleneckDeptBn,workerRanked};
  },[orders,expenses,db,woodLots,woodSettings,laborSettings,workers,payrollWeeks,alertSettings]);

  // ── "খরচ — ক্যাটাগরি অনুযায়ী" এখন সময়সীমা বাছাই করা যায় — এটা আলাদা, ছোট useMemo-তে রাখা
  // হয়েছে (উপরের বিশাল হিসাবের অংশ না) যাতে শুধু সময়সীমা বদলালে পুরো ড্যাশবোর্ড নতুন করে
  // হিসাব না করে, শুধু এই অংশটুকুই করে ──
  const[expRangeSelect,setExpRangeSelect]=useState("1y"); // 1m|3m|6m|1y|2y
  const expRangeData=useMemo(()=>{
    const now=new Date();
    const rangeStart=new Date(now);
    if(expRangeSelect==="1m")rangeStart.setMonth(rangeStart.getMonth()-1);
    else if(expRangeSelect==="3m")rangeStart.setMonth(rangeStart.getMonth()-3);
    else if(expRangeSelect==="6m")rangeStart.setMonth(rangeStart.getMonth()-6);
    else if(expRangeSelect==="1y")rangeStart.setFullYear(rangeStart.getFullYear()-1);
    else if(expRangeSelect==="2y")rangeStart.setFullYear(rangeStart.getFullYear()-2);

    const expByCat={};
    (expenses||[]).filter(e=>new Date(e.date)>=rangeStart).forEach(e=>{
      const cat=EXP_CATS.find(c=>c.id===e.category);
      const label=cat?cat.bn:e.category;
      expByCat[label]=(expByCat[label]||0)+(parseFloat(e.total)||0);
    });
    const EXP_PIE_COLORS=[CHART_SOFT_TEAL,CHART_SOFT_BLUE,CHART_SOFT_ORANGE,CHART_SOFT_PURPLE,CHART_SOFT_PINK,CHART_SOFT_GREY,"#d4b26a",CHART_SOFT_GREEN];
    const expensePie=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([label,value],i)=>({label,value,color:EXP_PIE_COLORS[i%EXP_PIE_COLORS.length]}));

    // ── প্রতিটা ক্যাটাগরির জন্য: সর্বোচ্চ খরচের মাস ও শীর্ষ সাপ্লায়ার — বাছাই করা সময়সীমার
    // মধ্যে। গড় মাসিক খরচ ও প্রবণতা ইচ্ছাকৃতভাবে সবসময়-ই ক্যাটাগরির পুরো ইতিহাস/স্থির ৩+৩ মাসের
    // উপর ভিত্তি করে হিসাব হয় (এগুলো "দীর্ঘমেয়াদী প্যাটার্ন" প্রশ্নের উত্তর দেয়, উপরের সময়সীমা
    // পাল্টালে এই দুটোর মানে বদলে যাওয়ার কথা না) ──
    const expCatDetail=Object.keys(expByCat).map(label=>{
      const catAll=(expenses||[]).filter(e=>{
        const cat=EXP_CATS.find(c=>c.id===e.category);
        return(cat?cat.bn:e.category)===label;
      });
      const catRange=catAll.filter(e=>new Date(e.date)>=rangeStart);
      const byMonth={};
      catRange.forEach(e=>{
        const d=new Date(e.date);
        const key=`${d.getFullYear()}-${d.getMonth()}`;
        byMonth[key]=(byMonth[key]||0)+(parseFloat(e.total)||0);
      });
      let peakMonthLabel=null,peakVal=0;
      Object.entries(byMonth).forEach(([key,val])=>{
        if(val>peakVal){peakVal=val;const[y,m]=key.split("-");peakMonthLabel=monthName(parseInt(m))+" "+y}
      });
      const bySupplier={};
      catRange.forEach(e=>{
        const s=(e.supplier||"").trim();
        if(!s)return;
        bySupplier[s]=(bySupplier[s]||0)+(parseFloat(e.total)||0);
      });
      const topSupplierEntry=Object.entries(bySupplier).sort((a,b)=>b[1]-a[1])[0];
      let avgMonthly=0;
      if(catAll.length>0){
        const earliest=new Date(Math.min(...catAll.map(e=>new Date(e.date).getTime())));
        const monthsSpan=Math.max(1,(now.getFullYear()-earliest.getFullYear())*12+(now.getMonth()-earliest.getMonth())+1);
        avgMonthly=catAll.reduce((s,e)=>s+(parseFloat(e.total)||0),0)/monthsSpan;
      }
      const monthsAgo=(n)=>{const d=new Date(now);d.setMonth(d.getMonth()-n);return d};
      const last3=catAll.filter(e=>{const d=new Date(e.date);return d>=monthsAgo(3)&&d<new Date(now.getTime()+86400000)}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      const prev3=catAll.filter(e=>{const d=new Date(e.date);return d>=monthsAgo(6)&&d<monthsAgo(3)}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      const trendPct=prev3>0?((last3-prev3)/prev3)*100:null;
      return{label,total:expByCat[label],peakMonthLabel,peakVal,topSupplier:topSupplierEntry?topSupplierEntry[0]:null,topSupplierVal:topSupplierEntry?topSupplierEntry[1]:0,avgMonthly,trendPct};
    }).sort((a,b)=>b.total-a.total);

    return{expensePie,expCatDetail};
  },[expenses,expRangeSelect]);

  // ── মৌসুমি প্রবণতা — এখন কত বছরের গড় নেওয়া হবে তা বাছাই করা যায় ──
  const[seasonRangeSelect,setSeasonRangeSelect]=useState(3); // 1|2|3|6 বছর
  const seasonData=useMemo(()=>{
    const now=new Date();
    const cutoffYear=now.getFullYear()-seasonRangeSelect+1; // এই বছরসহ পিছনের N বছর
    const activeOrders=(orders||[]).filter(o=>!o.cancelled);
    const monthTotals=Array(12).fill(0),monthYears=Array(12).fill(null).map(()=>new Set());
    activeOrders.forEach(o=>{
      if(!o.cust.date)return;
      const d=parseISO(o.cust.date);
      const y=d.getUTCFullYear();
      if(y<cutoffYear)return;
      monthTotals[d.getUTCMonth()]+=1;
      monthYears[d.getUTCMonth()].add(y);
    });
    const seasonal=monthTotals.map((total,i)=>({month:i,avg:monthYears[i].size?total/monthYears[i].size:0,total}));
    const seasonalMax=Math.max(...seasonal.map(s=>s.avg),0);
    const seasonalYearSpan=new Set(activeOrders.filter(o=>o.cust.date&&parseISO(o.cust.date).getUTCFullYear()>=cutoffYear).map(o=>parseISO(o.cust.date).getUTCFullYear())).size;
    return{seasonal,seasonalMax,seasonalYearSpan};
  },[orders,seasonRangeSelect]);

  // ── বিক্রয় বনাম খরচ — এখন বছর বাছাই করা যায় (এই বছর/গত বছর/তার আগের বছর), সবসময় ১২ মাস
  // (জানুয়ারি-ডিসেম্বর) দেখায় ──
  const[svExpYearSelect,setSvExpYearSelect]=useState("this"); // this|last|last2
  const svExpData=useMemo(()=>{
    const now=new Date();
    const year=svExpYearSelect==="this"?now.getFullYear():svExpYearSelect==="last"?now.getFullYear()-1:now.getFullYear()-2;
    const activeOrders=(orders||[]).filter(o=>!o.cancelled);
    const monthly=Array.from({length:12},(_,m)=>{
      const revenue=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===year&&od.getMonth()===m}).reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
      const total=(expenses||[]).filter(e=>{const ed=new Date(e.date);return ed.getFullYear()===year&&ed.getMonth()===m}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      // ── "খরচ" শুধু ট্র্যাক-করা খরচ না — কাঠ ক্রয় ও বেতনও যোগ হয় (আগের মতোই) ──
      const woodCost=(woodLots||[]).filter(l=>{const ld=new Date(l.date);return ld.getFullYear()===year&&ld.getMonth()===m}).reduce((s,l)=>s+(l.logs||[]).reduce((ls,lg)=>ls+lg.cft,0)*(parseFloat(l.ratePerCft)||0),0);
      let payrollCost=0;
      Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{
        const wed=new Date(weekEnd);
        if(wed.getFullYear()!==year||wed.getMonth()!==m)return;
        Object.entries(wd.attendance||{}).forEach(([wid,days])=>{
          const w=(workers||[]).find(x=>x.id===wid);
          if(w)payrollCost+=(parseFloat(days)||0)*(parseFloat(w.dailyRate)||0);
        });
      });
      return{label:monthName(m),revenue,expense:total+woodCost+payrollCost};
    });
    return{year,monthly};
  },[orders,expenses,woodLots,payrollWeeks,workers,svExpYearSelect]);


  return<div style={{minHeight:"100vh",background:`linear-gradient(150deg,${RED} 0%,#8B0020 100%)`,position:"relative"}}>
    <div style={{position:"absolute",top:8,right:10,fontSize:9,color:"rgba(255,255,255,0.55)",fontWeight:600,letterSpacing:0.3,zIndex:5,textAlign:"right"}}>v{BUILD_TAG}<br/>{projectId}</div>
    <div style={{padding:"24px 18px 18px",textAlign:"center",color:"white"}}>
      <div style={{width:52,height:52,background:"white",borderRadius:13,display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:8,boxShadow:"0 4px 18px rgba(0,0,0,.3)"}}><span style={{color:RED,fontSize:26,fontWeight:800,fontFamily:"Georgia,serif"}}>R</span></div>
      <div style={{fontSize:20,fontWeight:800}}>রূপালী ফার্নিচার</div>
      <div style={{fontSize:10,opacity:.8,marginTop:2}}>Rupali Furniture · Sirajganj | সাদমান সাকিব</div>
    </div>
    <div style={{background:"white",borderRadius:"20px 20px 0 0",minHeight:"calc(100vh - 160px)",padding:"18px 14px",maxWidth:720,margin:"0 auto"}}>
      {(()=>{
        // ── ৫-সেকেন্ডের নিয়ম: এক নজরে "সব ঠিক আছে কি না" — ট্যাপ করলে সংশ্লিষ্ট অংশে চলে যাবে ──
        const issues=[];
        if(backupFailed)issues.push({t:"ব্যাকআপ ব্যর্থ হয়েছে",z:"z-sys"});
        if(stats.stuckItems&&stats.stuckItems.length)issues.push({t:`${stats.stuckItems.length}টা কাজ আটকে আছে`,z:"z-today"});
        const lowStock=(stats.stockAlerts||[]).filter(a=>a.monthsLeft<AL(alertSettings,"stockMonths"));
        if(lowStock.length)issues.push({t:`${lowStock.map(a=>a.wood).join(", ")} কাঠ কম`,z:"z-wood"});
        if(stats.readyNotCollected&&stats.readyNotCollected.length)issues.push({t:`${stats.readyNotCollected.length}টা পণ্য পড়ে আছে`,z:"z-urgent"});
        if(stats.emptyWoodModels&&stats.emptyWoodModels.length)issues.push({t:`${stats.emptyWoodModels.length}টা মডেলে কাঠের মাপ নেই`,z:"z-wood"});
        if(permanentSyncFailures&&permanentSyncFailures.length)issues.push({t:`${permanentSyncFailures.length}টা অর্ডার সার্ভারে পাঠাতে সমস্যা হচ্ছে`,z:"z-sys"});
        const ok=issues.length===0;
        return<div style={{background:ok?"#f0fdf4":"#fef2f2",border:`1.5px solid ${ok?"#86efac":"#fca5a5"}`,borderRadius:11,padding:"11px 13px",marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:800,color:ok?"#166534":"#991b1b",marginBottom:ok?0:6}}>{ok?"✅ সব ঠিক আছে":`⚠️ ${issues.length}টা বিষয়ে নজর দরকার`}</div>
          {!ok&&<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {issues.map((it,i)=><button key={i} onClick={()=>document.getElementById(it.z)?.scrollIntoView({behavior:"smooth",block:"start"})} style={{background:"white",border:"1px solid #fecaca",borderRadius:20,padding:"8px 13px",fontSize:11,fontWeight:600,color:"#991b1b",minHeight:36}}>{it.t} →</button>)}
          </div>}
        </div>
      })()}

      {pendingWrites&&pendingWrites.some(w=>Date.now()-new Date(w.addedAt).getTime()>120000)&&<div className="no-print" style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:9,padding:"8px 11px",marginBottom:10,fontSize:10,color:"#991b1b",fontWeight:600}}>
        🔴 কিছু পরিবর্তন এখনো সার্ভারে পাঠানো যায়নি — ইন্টারনেট সংযোগ থাকলে এমনিতেই কিছুক্ষণের মধ্যে নিজে থেকে পাঠিয়ে দেবে।
      </div>}

      {/* স্তরে লাফ দেওয়ার বার — লম্বা স্ক্রলে নিচের অংশ যাতে হারিয়ে না যায় */}
      <div style={{position:"sticky",top:0,zIndex:20,background:"rgba(255,255,255,0.97)",backdropFilter:"blur(4px)",margin:"0 -16px 12px",padding:"7px 10px",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",gap:4,overflowX:"auto"}}>
        {[{e:"⚡",z:"z-urgent",c:"#b91c1c"},{e:"🔥",z:"z-today",c:"#0f766e"},{e:"📅",z:"z-trend",c:"#b45309"},{e:"📊",z:"z-health",c:"#1d4ed8"},{e:"🪵",z:"z-wood",c:"#065f46"},{e:"🚧",z:"z-perf",c:"#7c2d12"},{e:"⚙️",z:"z-sys",c:"#78716c"}].map(b=>{
          const isActive=activeZone===b.z;
          return<button key={b.z} onClick={()=>document.getElementById(b.z)?.scrollIntoView({behavior:"smooth",block:"start"})} style={{background:isActive?b.c+"30":b.c+"14",border:`1.5px solid ${isActive?b.c:b.c+"55"}`,borderRadius:9,minWidth:isActive?54:44,minHeight:isActive?44:38,fontSize:isActive?21:17,flexShrink:1,flexGrow:1,cursor:"pointer",outline:"none",WebkitTapHighlightColor:"transparent",transform:isActive?"scale(1.08)":"scale(1)",boxShadow:isActive?`inset 0 2px 5px ${b.c}66`:"none",transition:"all .15s"}}>{b.e}</button>
        })}
      </div>


      {/* Action buttons */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        <button onClick={onNew} style={{background:RED,color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ নতুন অর্ডার</button>
        <button onClick={onExpense} style={{background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ খরচ যোগ করুন</button>
        <button onClick={onHist} style={{background:"white",color:RED,border:`2px solid ${RED}`,borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>অর্ডার ইতিহাস</button>
        <button onClick={onManage} style={{background:"white",color:"#6d28d9",border:"2px solid #6d28d9",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>⚙ ডেটাবেস</button>
        <button onClick={onWoodStock} style={{background:"white",color:"#065f46",border:"2px solid #065f46",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700,gridColumn:"span 2"}}>🪵 কাঠের স্টক ব্যবস্থাপনা</button>
        <button onClick={onPayroll} style={{background:PAY,color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700,gridColumn:"span 2"}}>👷 পে-রোল ব্যবস্থাপনা</button>
        <button onClick={onPLReport} style={{background:"#B45309",color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700,gridColumn:"span 2"}}>📊 লাভ-ক্ষতি রিপোর্ট</button>
      </div>

      <div id="z-urgent" style={{scrollMarginTop:56,fontSize:11,fontWeight:800,color:"#b91c1c",letterSpacing:"0.3px",margin:"18px 0 8px",paddingBottom:4,borderBottom:"2px solid #b91c1c22"}}>⚡ এখনই নজর দিন</div>
      {/* Pie chart - running orders by category */}
      {stats.catPie.length>0&&<div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>🥧 চলমান অর্ডার — ক্যাটাগরি অনুযায়ী</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"14px"}}>
          <PieChart3D data={stats.catPie} showCount={true} countSuffix="টি"/>
        </div>
      </div>}
