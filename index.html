// Compress an image file to a small JPEG base64 string before storing, to avoid hitting localStorage quota
function compressImage(file,maxDim=1200,quality=0.82){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
        else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

/* ── FULL-RESOLUTION LOCAL FOLDER STORAGE (desktop Chrome/Edge/Brave only) ──

const BUILD_TAG="2.13";
const FS_SUPPORTED=typeof window!=="undefined"&&"showDirectoryPicker" in window;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("rf_fs_store",1);
    req.onupgradeneeded=()=>{req.result.createObjectStore("handles")};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readwrite");
    tx.objectStore("handles").put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readonly");
    const req=tx.objectStore("handles").get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function pickImageFolder(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await window.showDirectoryPicker();
    await idbSet("imageFolder",handle);
    return handle;
  }catch(e){return null}
}
async function getImageFolderHandle(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await idbGet("imageFolder");
    if(!handle)return null;
    const perm=await handle.queryPermission({mode:"readwrite"});
    if(perm==="granted")return handle;
    const req=await handle.requestPermission({mode:"readwrite"});
    if(req==="granted")return handle;
    return null;
  }catch(e){return null}
}
function genImgFileName(prefix,index,file){
  const ext=(file.name.match(/\.[0-9a-z]+$/i)||[".jpg"])[0];
  return`${prefix}_${index}${ext}`.replace(/[^a-zA-Z0-9_.\-]/g,"_");
}
async function saveFullResImage(file,fileName){
  const folder=await getImageFolderHandle();
  if(!folder)return false;
  try{
    const fileHandle=await folder.getFileHandle(fileName,{create:true});
    const writable=await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  }catch(e){return false}
}

// অগ্রাধিকার: (১) অর্ডারে সংরক্ষিত স্ন্যাপশট → (২) তারিখভিত্তিক দামের ইতিহাস → (৩) বর্তমান চূড়ান্ত দাম
function woodRateOn(woodSettings,species,dateStr){
  const s=(woodSettings&&woodSettings[species])||{};
  const hist=(s.rateHistory||[]).filter(h=>h.from&&parseFloat(h.rate)>0).sort((a,b)=>a.from.localeCompare(b.from));
  if(hist.length&&dateStr){
    let picked=null;
    hist.forEach(h=>{if(h.from<=dateStr)picked=h});
    if(picked)return parseFloat(picked.rate)||0;
    return parseFloat(hist[0].rate)||0; // অর্ডার সবচেয়ে পুরনো এন্ট্রির আগের হলে প্রথমটাই ধরা হবে
  }
  return parseFloat(s.finalAvgRate)||0;
}
function itemWoodRate(item,order,woodSettings){
  if(item.woodRateSnapshot&&parseFloat(item.woodRateSnapshot)>0)return parseFloat(item.woodRateSnapshot);
  return woodRateOn(woodSettings,item.wood,order&&order.cust?order.cust.date:null);
}
// ── শ্রম খরচ: কাঠের মতোই — প্রতি CFT-তে একটা মাত্র হার, তারিখভিত্তিক ইতিহাস সহ ──
function laborRateOn(laborSettings,dateStr){
  const s=laborSettings||{};
  const hist=(s.rateHistory||[]).filter(h=>h.from&&parseFloat(h.rate)>0).sort((a,b)=>a.from.localeCompare(b.from));
  if(hist.length&&dateStr){
    let picked=null;
    hist.forEach(h=>{if(h.from<=dateStr)picked=h});
    if(picked)return parseFloat(picked.rate)||0;
    return parseFloat(hist[0].rate)||0;
  }
  return parseFloat(s.ratePerCft)||0;
}
function orderTotalCft(order){
  return(order.items||[]).reduce((s,it)=>s+totalCft(it.sections)*(it.qty||1),0);

function orderLabourRate(order,laborSettings){
  if(order.labourRateSnapshot&&parseFloat(order.labourRateSnapshot)>0)return parseFloat(order.labourRateSnapshot);

}

function WhatsAppSendBtn({targetRef,phone,label}){
  const[busy,setBusy]=useState(false);
  const send=async()=>{
    if(!targetRef.current||typeof html2canvas==="undefined")return;
    setBusy(true);
    try{
      const canvas=await html2canvas(targetRef.current,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      canvas.toBlob(async(blob)=>{
        if(!blob){setBusy(false);return}
        const file=new File([blob],"receipt.png",{type:"image/png"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          try{await navigator.share({files:[file],title:"রূপালী ফার্নিচার",text:"আপনার অর্ডারের রশিদ"})}catch(e){}
        }else{
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");a.href=url;a.download="receipt.png";document.body.appendChild(a);a.click();document.body.removeChild(a);
          setTimeout(()=>{window.open(`https://wa.me/${toIntlPhone(phone)}`,"_blank");alert("ছবিটি ডাউনলোড হয়েছে। WhatsApp চ্যাটে গিয়ে ম্যানুয়ালি ছবিটি অ্যাটাচ করে পাঠান।")},300);
        }
        setBusy(false);
      },"image/png");
    }catch(e){alert("ছবি তৈরি করতে সমস্যা হয়েছে: "+e.message);setBusy(false)}
  };
  return<button className="no-print" onClick={send} disabled={busy} style={{background:"#16a34a",color:"white",border:"none",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5}}>{busy?"⏳ তৈরি হচ্ছে...":`📤 ${label||"WhatsApp-এ পাঠান"}`}</button>
}

  };
  const removeItem=(i)=>{
    if(!window.confirm("এই ফার্নিচারটি অর্ডার থেকে বাদ দিতে চান?"))return;
    const newItems=items.filter((_,j)=>j!==i);
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
  };
  const createNewCategoryInline=()=>{
    const catName=newCatName.trim()||`নতুন ফার্নিচার ${Object.keys(db).length+1}`;
    const varName=newCatVarName.trim()||"স্ট্যান্ডার্ড মডেল";

    const varKey="var_"+Date.now();

    nd[catKey]={bn:catName,en:catName,variants:{[varKey]:{bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]}}};

    const item={catKey:newItem.catKey,varKey:newItem.varKey,variantBn:variant.bn,code:variant.code,tier:variant.tier||"M",wood:newItem.wood,woodBn:WOOD[newItem.wood].bn,qty:newItem.qty,price:newItem.price,notes:newItem.notes,sections:JSON.parse(JSON.stringify(variant.sections)),itemId:"item_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)};
    const newItems=[...items,item];
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
    setNewItem({catKey:"",varKey:"",wood:"S",qty:1,price:"",notes:""});setAddingNew(false);

  const addNewImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const newOnes=[];
    for(let idx=0;idx<files.length;idx++){
      const compressed=await compressImage(files[idx]);
      if(!compressed)continue;
      const fileIdx=images.length+newOnes.length+1;
      const fileName=genImgFileName(`${order.no}_ref`,fileIdx,files[idx]);
      const savedFull=await saveFullResImage(files[idx],fileName);
      newOnes.push({src:compressed,caption:`ছবি ${fileIdx}`,fileName:savedFull?fileName:null});
    }
    if(newOnes.length>0)onUpdateOrder({...order,refImgs:[...images,...newOnes],refImg:undefined});
  };
  const removeImage=(idx)=>{
    const updated=images.filter((_,i)=>i!==idx);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };
  const updateImgCaption=(idx,val)=>{
    const updated=images.map((img,i)=>i===idx?{...img,caption:val}:img);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#1d4ed8"}}><PrintBtn onPrint={()=>onPrint("s2")}/></div>
    <Hdr title="অর্ডার বুক কপি" sub="Order Book Copy" no={no} bg="#1d4ed8"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 12px",background:"#eff6ff",borderRadius:7,padding:"8px",marginBottom:8}}>

        <IR l="গ্রাহকের নাম" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/>

      </div>
      {images.length>0&&<div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:10,color:"#888"}}>রেফারেন্স ছবি:</span>
          <button className="no-print" onClick={()=>setEditingImages(!editingImages)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"3px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>{editingImages?"✓ শেষ":"✏️ পরিবর্তন"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center",position:"relative"}}>
            <img src={img.src} className="ref-img" alt="ref" style={{maxHeight:100}}/>
            {editingImages?<input className="no-print" value={img.caption} onChange={e=>updateImgCaption(i,e.target.value)} style={{fontSize:8,marginTop:2,border:"1px solid #ddd",borderRadius:4,padding:"2px 4px",width:"90%",outline:"none"}}/>:<div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div>}
            <FullImgBtn fileName={img.fileName}/>
            {editingImages&&<button className="no-print" onClick={()=>removeImage(i)} style={{position:"absolute",top:-6,right:-6,background:RED,color:"white",border:"none",borderRadius:"50%",width:18,height:18,fontSize:10,lineHeight:1}}>✕</button>}
          </div>)}
        </div>
        {editingImages&&<div className="no-print" style={{textAlign:"center",marginTop:8}}>

      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #bfdbfe",borderRadius:6,padding:"6px 9px",marginBottom:5,fontSize:10}}>
        {editIdx===i?<div className="no-print" style={{background:"#eff6ff",borderRadius:7,padding:8}}>
          <div style={{fontSize:9,fontWeight:700,color:"#1d4ed8",marginBottom:6}}>ফার্নিচার পরিবর্তন করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={editForm.catKey} varKey={editForm.varKey} onSelect={(ck,vk)=>setEditForm({...editForm,catKey:ck,varKey:vk})}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={editForm.wood} onChange={e=>setEditForm({...editForm,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>
              {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn}</option>)}

            <input type="number" min={1} value={editForm.qty} onChange={e=>setEditForm({...editForm,qty:parseInt(e.target.value)||1})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>

          <div style={{marginBottom:6}}><input type="number" value={editForm.price} onChange={e=>setEditForm({...editForm,price:e.target.value})} placeholder="মূল্য (৳)" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:11,fontWeight:700,color:"#166534",boxSizing:"border-box"}}/></div>
          <textarea rows={2} value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:6,resize:"vertical"}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setEditIdx(null);setEditForm(null)}} style={{flex:1,background:"white",border:"1px solid #ddd",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
            <button onClick={saveEditItem} disabled={!editForm.varKey} style={{flex:2,background:editForm.varKey?"#1d4ed8":"#ccc",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>সংরক্ষণ করুন</button>
          </div>
        </div>:<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div style={{flex:1}}>

              {it.price&&<div style={{color:"#166534",fontWeight:700,marginTop:1}}>মূল্য: {money(it.price)}</div>}
              {(()=>{
                const wRate=itemWoodRate(it,order,woodSettings);
                const lRate=orderLabourRate(order,laborSettings);
                if(!wRate&&!lRate)return null;
                const cft=totalCft(it.sections)*it.qty;
                const woodCost=cft*wRate;
                const labourCost=cft*lRate;
                const totalCost=woodCost+labourCost;
                const profit=it.price?(parseFloat(it.price)||0)-totalCost:null;
                return<div className="no-print" style={{fontSize:9,color:"#777",marginTop:2,background:"#f9fafb",borderRadius:5,padding:"3px 6px",display:"inline-block"}}>
                  কাঠ {money(woodCost.toFixed(0))} + শ্রম {money(labourCost.toFixed(0))} = খরচ {money(totalCost.toFixed(0))}{profit!==null&&<span style={{marginLeft:6,color:profit>=0?"#166534":RED,fontWeight:700}}>| লাভ: {money(profit.toFixed(0))}</span>}
                </div>
              })()}
              {it.notes&&<div style={{color:"#888",marginTop:1}}>⚙ {it.notes}</div>}
            </div>
            <div className="no-print" style={{display:"flex",gap:4,flexShrink:0}}>
              <button onClick={()=>startEditItem(i)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>✏️ পরিবর্তন</button>
              {items.length>1&&<button onClick={()=>removeItem(i)} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,color:RED,fontWeight:700}}>✕ বাদ</button>}
            </div>
          </div>
        </>}
      </div>)}
      <div className="no-print">
        {addingNew?<div style={{background:"#eff6ff",borderRadius:9,padding:10,marginBottom:8}}>
          <div style={{fontSize:10,fontWeight:700,color:"#1d4ed8",marginBottom:7}}>নতুন ফার্নিচার যোগ করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={newItem.catKey} varKey={newItem.varKey} onSelect={(ck,vk)=>setNewItem({...newItem,catKey:ck,varKey:vk})}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={newItem.wood} onChange={e=>setNewItem({...newItem,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>
              {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn}</option>)}
            </select>
            <input type="number" min={1} value={newItem.qty} onChange={e=>setNewItem({...newItem,qty:parseInt(e.target.value)||1})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>
          </div>
          <div style={{marginBottom:6}}><input type="number" value={newItem.price} onChange={e=>setNewItem({...newItem,price:e.target.value})} placeholder="মূল্য (৳)" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:11,fontWeight:700,color:"#166534",boxSizing:"border-box"}}/></div>
          <textarea rows={2} value={newItem.notes} onChange={e=>setNewItem({...newItem,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:7,resize:"vertical"}}/>

            <button onClick={addNewItem} disabled={!newItem.varKey} style={{flex:2,background:newItem.varKey?"#1d4ed8":"#ccc",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>যোগ করুন</button>

        </div>:<button onClick={()=>setAddingNew(true)} style={{width:"100%",background:"white",border:"2px dashed #1d4ed8",color:"#1d4ed8",borderRadius:8,padding:"9px",fontSize:11,fontWeight:600,marginBottom:8}}>+ আরেকটি ফার্নিচার যোগ করুন</button>}
      </div>
      <div style={{background:"#eff6ff",borderRadius:7,padding:"8px",marginTop:4}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:5}}><span style={{color:"#555"}}>মোট মূল্য:</span><span style={{fontWeight:700}}>{money(cust.total)}</span></div>
        <div style={{fontWeight:700,fontSize:10,color:"#1d4ed8",marginBottom:4}}>পেমেন্ট ট্র্যাকিং</div>

        <div style={{display:"flex",justifyContent:"space-between",paddingTop:4,marginTop:2}}><span style={{fontSize:10}}>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10,fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:RED}}>{money(rem)}</span></div>
      </div>
      <div className="no-print"><PrintLog log={printLogs?.s2}/></div>

}

/* ── SLIP 3: DEPT TRACKING ── */
function S3({order,onPrint,onUpdateOrder,workers}){
  const{cust,items,no,printLogs}=order;
  const ip=order.itemProgress||{};
  const itemKey=(it,idx)=>it.itemId||`idx_${idx}`;

  const getDept=(ikey,deptId)=>((ip[ikey]||{})[deptId])||{start:"",end:"",pct:0,workers:[]};
  const patchDept=(ikey,deptId,patch)=>{
    const curItem=ip[ikey]||{};
    const cur=curItem[deptId]||{start:"",end:"",pct:0,workers:[]};
    onUpdateOrder({...order,itemProgress:{...ip,[ikey]:{...curItem,[deptId]:{...cur,...patch}}}});
  };
  const setStart=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    const newPct=val&&!cur.end?Math.max(cur.pct,20):cur.pct;
    patchDept(ikey,deptId,{start:val,pct:newPct});
  };
  const setEnd=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    patchDept(ikey,deptId,{end:val,pct:val?100:cur.pct});
  };
  const setPct=(ikey,deptId,val)=>patchDept(ikey,deptId,{pct:parseInt(val)});
  const toggleWorker=(ikey,deptId,name)=>{
    const cur=getDept(ikey,deptId);
    const list=cur.workers||[];
    const next=list.includes(name)?list.filter(w=>w!==name):[...list,name];
    patchDept(ikey,deptId,{workers:next});
  };
  const deptWorkers=(payDept)=>{
    const active=(workers||[]).filter(w=>w.active!==false);
    const matched=active.filter(w=>w.department===payDept);
    return matched.length?matched:active;
  };
  // সামগ্রিক অগ্রগতি: সব ফার্নিচারের সব বিভাগের গড়
  const allPcts=[];
  items.forEach((it,idx)=>DEPTS.forEach(d=>allPcts.push(getDept(itemKey(it,idx),d.id).pct||0)));
  const overallPct=allPcts.length?Math.round(allPcts.reduce((s,v)=>s+v,0)/allPcts.length):0;

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#6d28d9"}}>
      <span style={{fontWeight:800,fontSize:13}}>সামগ্রিক অগ্রগতি: {overallPct}%</span>
      <PrintBtn onPrint={()=>onPrint("s3")}/>
    </div>
    <Hdr title="বিভাগ ট্র্যাকিং কপি" sub="Department Tracking" no={no} bg="#6d28d9"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f5f3ff",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/>
      </div>
      {items.length>1&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#1d4ed8"}}>ℹ️ এই অর্ডারে {items.length}টা আলাদা ফার্নিচার আছে — প্রতিটার অগ্রগতি ও কর্মী আলাদাভাবে ট্র্যাক করুন, কারণ ভিন্ন কর্মীর হাতে যেতে পারে।</div>}

      {/* Interactive (screen only) — প্রতিটা ফার্নিচার আলাদা */}
      <div className="no-print">
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          const itemAllPcts=DEPTS.map(d=>getDept(ikey,d.id).pct||0);
          const itemPct=Math.round(itemAllPcts.reduce((s,v)=>s+v,0)/DEPTS.length);
          return<div key={ikey} style={{marginBottom:18}}>
            <div style={{background:"#6d28d9",color:"white",borderRadius:"9px 9px 0 0",padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,fontSize:12}}>[{it.code}] {it.variantBn}<span style={{fontWeight:400,opacity:0.85}}> · {it.woodBn} × {it.qty}</span></div>
              <div style={{fontWeight:800,fontSize:12}}>{itemPct}%</div>
            </div>
            <div style={{border:"1px solid #ede9fe",borderTop:"none",borderRadius:"0 0 9px 9px",padding:"10px 12px",background:"#faf9ff"}}>
              {DEPTS.map(d=>{
                const cur=getDept(ikey,d.id);
                const assigned=cur.workers||[];
                const barColor=cur.pct>=100?"#16a34a":cur.pct>=50?"#f59e0b":"#dc2626";
                const pool=deptWorkers(d.payDept);
                return<div key={d.id} style={{background:"white",border:"1px solid #ede9fe",borderRadius:9,padding:"9px 11px",marginBottom:7}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontWeight:700,fontSize:11,color:"#6d28d9"}}>{d.bn}</div>
                    <div style={{display:"flex",gap:4}}>
                      {!cur.start&&<button onClick={()=>setStart(ikey,d.id,todayStr())} style={{background:"#f0fdf4",border:"1px solid #86efac",color:"#166534",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>▶ আজ শুরু</button>}
                      {cur.start&&!cur.end&&<button onClick={()=>setEnd(ikey,d.id,todayStr())} style={{background:"#eff6ff",border:"1px solid #93c5fd",color:"#1d4ed8",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>■ আজ শেষ</button>}
                      {cur.end&&<span style={{fontSize:9,color:"#16a34a",fontWeight:700}}>✓ সম্পন্ন</span>}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শুরুর তারিখ</div><DateInput value={cur.start} onChange={v=>setStart(ikey,d.id,v)} accent="#6d28d9"/></div>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শেষের তারিখ</div><DateInput value={cur.end} onChange={v=>setEnd(ikey,d.id,v)} accent="#6d28d9"/></div>
                  </div>
                  <input type="range" min="0" max="100" value={cur.pct} onChange={e=>setPct(ikey,d.id,e.target.value)} style={{width:"100%",accentColor:barColor}}/>
                  <div style={{textAlign:"right",fontSize:10,fontWeight:800,color:barColor,marginBottom:6}}>{cur.pct}%{cur.pct>=100?" ✅":""}</div>
                  <div style={{fontSize:8,color:"#888",marginBottom:4}}>{d.payDept} বিভাগের কর্মী</div>
                  {pool.length===0?<div style={{fontSize:9,color:"#aaa"}}>পে-রোলে এই বিভাগের কোনো কর্মী নেই</div>:
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {pool.map(w=><button key={w.id} onClick={()=>toggleWorker(ikey,d.id,w.name)} style={{background:assigned.includes(w.name)?deptColor(w.department):"#f3f4f6",color:assigned.includes(w.name)?"white":"#555",border:"none",borderRadius:20,padding:"4px 10px",fontSize:9,fontWeight:600}}>{assigned.includes(w.name)?"✓ ":""}{w.name}</button>)}
                  </div>}
                </div>
              })}

          </div>
        })}
      </div>

      {/* Print-only static table — প্রতিটা ফার্নিচার আলাদা টেবিলে */}
      <div className="print-only-table" style={{display:"none"}}>
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          return<div key={ikey} style={{marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:11,marginBottom:4}}>[{it.code}] {it.variantBn} — {it.woodBn} × {it.qty}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:"#6d28d9",color:"white"}}>{["বিভাগ","দায়িত্বে","শুরু","শেষ","স্বাক্ষর"].map(h=><th key={h} style={{padding:"6px 5px",textAlign:"left",fontWeight:700}}>{h}</th>)}</tr></thead>
              <tbody>{DEPTS.map((d,i)=>{const cur=getDept(ikey,d.id);return<tr key={d.id} style={{background:i%2===0?"#f5f3ff":"white",borderBottom:"1px solid #ede9fe"}}><td style={{padding:"8px 5px",fontWeight:600}}>{d.bn} ({cur.pct}%)</td><td style={{padding:"8px 5px",fontSize:9}}>{(cur.workers||[]).join(", ")||"—"}</td><td style={{padding:"8px 5px",color:cur.start?"#333":"#bbb"}}>{cur.start?fmtDate(cur.start):"___/___"}</td><td style={{padding:"8px 5px",color:cur.end?"#333":"#bbb"}}>{cur.end?fmtDate(cur.end):"___/___"}</td><td style={{padding:"8px 5px",color:"#bbb"}}>________</td></tr>})}</tbody>
            </table>
          </div>
        })}
      </div>

      <div className="no-print"><PrintLog log={printLogs?.s3}/></div>
    </div>
  </div>
}

/* ── SLIP 4: CARPENTER (editable wood, saves as new variant) ── */
function S4({order,onPrint,db,saveDb,onUpdateOrder}){
  const{cust,items,no,printLogs,refImg,refImgs}=order;
  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const[editIdx,setEditIdx]=useState(null);
  const[editSections,setEditSections]=useState(null);

  const startEdit=(idx)=>{setEditIdx(idx);setEditSections(JSON.parse(JSON.stringify(items[idx].sections)))};
  const updatePiece=(si,pi,field,val)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces[pi][field]=field==="bn"?val:(parseFloat(val)||0);setEditSections(ns)};
  const removePiece=(si,pi)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.splice(pi,1);setEditSections(ns)};
  const addPieceToSection=(si)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.push({bn:"নতুন কাঠ",pc:1,h:24,l:12,w:1});setEditSections(ns)};

  const saveEditedItem=()=>{
    const item=items[editIdx];
    const suffix=String(Math.floor(Math.random()*900+100));
    const newCode=`${item.code}-M${suffix}`;
    const newName=`${item.variantBn.replace(/ \(কাস্টম.*\)/,"")} (কাস্টম-${suffix})`;
    // Save new variant to DB
    if(item.catKey&&db[item.catKey]){
      const vKey=`${item.varKey||item.catKey}_mod_${suffix}`;
      const nd=JSON.parse(JSON.stringify(db));
      nd[item.catKey].variants[vKey]={bn:newName,code:newCode,sections:editSections};
      saveDb(nd);
    }
    const newItems=[...items];
    newItems[editIdx]={...item,sections:editSections,code:newCode,variantBn:newName};
    onUpdateOrder({...order,items:newItems});
    setEditIdx(null);setEditSections(null);
  };

  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#92400e"}}><PrintBtn onPrint={()=>onPrint("s4")}/></div>
    <Hdr title="কার্পেন্টারের কপি" sub="Carpenter Copy" no={no} bg="#92400e"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#fef3c7",borderRadius:7,padding:"8px",marginBottom:10}}><IR l="গ্রাহক" v={cust.name}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/></div>
      {images.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:9,color:"#92400e",fontWeight:700,marginBottom:5,textAlign:"center"}}>গ্রাহকের রেফারেন্স ছবি — এই অনুযায়ী তৈরি করুন</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center"}}><img src={img.src} className="ref-img" alt="ref" style={{maxHeight:120}}/><div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div><FullImgBtn fileName={img.fileName}/></div>)}
        </div>
      </div>}
      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #92400e",borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{background:"#92400e",color:"white",padding:"7px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:11}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:9,opacity:.9,marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty}</div></div>
          {editIdx!==i&&<button className="no-print" onClick={()=>startEdit(i)} style={{background:"white",color:"#92400e",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,fontWeight:700}}>✏️ এডিট</button>}
        </div>
        <div style={{padding:"8px 11px"}}>
          {it.notes&&<div style={{background:"#fef9c3",borderRadius:5,padding:"5px 8px",marginBottom:6,fontSize:9,fontWeight:600}}>⚠ {it.notes}</div>}
          {editIdx===i?<>
            {editSections.map((sec,si)=><div key={si} style={{marginBottom:7,background:"#fffbeb",borderRadius:6,padding:6}} className="no-print">
              <div style={{fontWeight:700,fontSize:9,color:"#92400e",marginBottom:4}}>{sec.name}</div>
              {sec.pieces.map((p,pi)=><div key={pi} style={{background:"white",border:"1px solid #f0e0c0",borderRadius:6,padding:6,marginBottom:5}}>
                <input value={p.bn} onChange={e=>updatePiece(si,pi,"bn",e.target.value)} placeholder="কাঠের নাম" style={{width:"100%",fontSize:11,border:"1px solid #e5e5e5",borderRadius:4,padding:"5px 7px",marginBottom:4,boxSizing:"border-box"}}/>
                <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
                  {["h","l","w","pc"].map((f,fi)=><div key={f} style={{display:"flex",alignItems:"center",gap:2,flex:"1 1 21%",minWidth:44}}>
                    <span style={{fontSize:8,color:"#92400e",flexShrink:0}}>{["H","L","W","পিস"][fi]}</span>
                    <input type="number" step="0.25" value={p[f]} onChange={e=>updatePiece(si,pi,f,e.target.value)} style={{width:"100%",fontSize:11,border:"1px solid #e5e5e5",borderRadius:4,padding:"5px 3px",minWidth:0,boxSizing:"border-box"}}/>
                  </div>)}
                  <button onClick={()=>removePiece(si,pi)} style={{background:"#fee2e2",border:"none",borderRadius:5,color:RED,fontSize:12,padding:"6px 9px",flexShrink:0}}>✕</button>
                </div>
              </div>)}
              <button onClick={()=>addPieceToSection(si)} style={{fontSize:9,background:"#fef3c7",border:"1px dashed #92400e",borderRadius:4,padding:"3px 8px",marginTop:3,color:"#92400e"}}>+ পিস যোগ</button>
            </div>)}
            <div className="no-print" style={{display:"flex",gap:6,marginTop:6}}>
              <button onClick={()=>{setEditIdx(null);setEditSections(null)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
              <button onClick={saveEditedItem} style={{flex:2,background:"#92400e",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>নতুন কোডে সংরক্ষণ করুন</button>
            </div>
          </>:it.sections.map((sec,j)=><div key={j} style={{marginBottom:7}}>
            <div style={{fontWeight:700,fontSize:9,color:"#92400e",borderBottom:"1px solid #fde68a",paddingBottom:2,marginBottom:3}}>{sec.name}</div>
            {sec.pieces.map((p,k)=><div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:9,padding:"2px 0",borderBottom:"1px dotted #f0f0f0"}}><span>{p.bn}</span><span style={{color:"#555",fontFamily:"monospace"}}>{p.h}″×{p.l}″×{p.w}″ × {p.pc}</span></div>)}
          </div>)}
          {editIdx!==i&&<div style={{background:"#fef3c7",borderRadius:5,padding:"5px 8px",fontSize:9,marginTop:4}}>মোট CFT: <strong>{(totalCft(it.sections)*it.qty).toFixed(3)}</strong></div>}
        </div>
      </div>)}
      <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{["প্রধান কার্পেন্টারের স্বাক্ষর","পরিচালকের স্বাক্ষর"].map(t=><div key={t} style={{borderTop:"1px solid #ddd",paddingTop:5,textAlign:"center",fontSize:9,color:"#888"}}>{t}</div>)}</div>
      <div className="no-print"><PrintLog log={printLogs?.s4}/></div>
    </div>
  </div>
}

/* ── SLIP 5: TRANSPORT ── */
function S5({order,onPrint}){
  const{cust,items,no,printLogs}=order;
  const map={};
  items.forEach(it=>{it.sections.forEach(sec=>{const prefix=it.wood;sec.pieces.forEach(p=>{const code=rackCode(prefix,p.w,p.h);const key=`${code}__${p.h}__${p.l}__${p.w}`;const pc=p.pc*it.qty;const cv=cft(pc,p.h,p.l,p.w);if(map[key]){map[key].pc+=pc;map[key].cv+=cv}else map[key]={code,name:p.bn,pc,h:p.h,l:p.l,w:p.w,cv}})})});
  const list=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));
  const tot=list.reduce((s,w)=>s+w.cv,0);
  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#065f46"}}><PrintBtn onPrint={()=>onPrint("s5")}/></div>
    <Hdr title="ট্রান্সপোর্ট কপি — কাঠের তালিকা" sub="Transport Wood List" no={no} bg="#065f46"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f0fdf4",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="তারিখ" v={fmtDate(cust.date)}/>
        {items.map((it,i)=><IR key={i} l={`ফার্নিচার ${i+1}`} v={`[${it.code}] ${it.variantBn} (${it.woodBn}) × ${it.qty}`}/>)}
      </div>
      <div style={{fontWeight:700,fontSize:10,color:"#065f46",marginBottom:6}}>গোডাউনের র‍্যাক থেকে নিন:</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:9}}>
        <thead><tr style={{background:"#065f46",color:"white"}}>{["র‍্যাক কোড","কাঠের নাম","পিস","H×L×W","CFT"].map((h,i)=><th key={h} style={{padding:"5px 4px",textAlign:i<2?"left":"center",fontWeight:700}}>{h}</th>)}</tr></thead>
        <tbody>{list.map((w,i)=><tr key={i} style={{background:i%2===0?"#f0fdf4":"white",borderBottom:"1px solid #d1fae5"}}>
          <td style={{padding:"5px 4px",fontWeight:800,color:"#065f46",fontFamily:"monospace",fontSize:10}}>{w.code}</td>
          <td style={{padding:"5px 4px"}}>{w.name}</td>
          <td style={{padding:"5px 4px",textAlign:"center",fontWeight:700}}>{w.pc}</td>
          <td style={{padding:"5px 4px",textAlign:"center",fontFamily:"monospace",color:"#555"}}>{w.h}×{w.l}×{w.w}</td>
          <td style={{padding:"5px 4px",textAlign:"center"}}>{w.cv.toFixed(3)}</td>
        </tr>)}</tbody>
        <tfoot><tr style={{background:"#065f46",color:"white"}}><td colSpan={4} style={{padding:"7px 4px",fontWeight:700}}>মোট CFT</td><td style={{padding:"7px 4px",textAlign:"center",fontWeight:800,fontSize:11}}>{tot.toFixed(3)}</td></tr></tfoot>
      </table>
      <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{["ট্রান্সপোর্ট কর্মীর স্বাক্ষর","পরিচালকের স্বাক্ষর"].map(t=><div key={t} style={{borderTop:"1px solid #ddd",paddingTop:5,textAlign:"center",fontSize:9,color:"#888"}}>{t}</div>)}</div>
      <div className="no-print"><PrintLog log={printLogs?.s5}/></div>
    </div>
  </div>
}

        <div style={{fontWeight:700}}>[{it.code}] {it.variantBn}</div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>

/* ── SIMPLE BAR CHART (SVG) ── */
function BarChart({data,height=140,color=RED,formatY}){
  const max=Math.max(...data.map(d=>d.value),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const barH=(d.value/max)*(height-24);
        return<g key={i}>
          <rect x={i*w+w*0.15} y={height-24-barH} width={w*0.7} height={barH} fill={d.color||color} rx="1"/>
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:2}}>
      {data.map((d,i)=><div key={i} style={{fontSize:10,fontWeight:700,color:d.color||color,textAlign:"center",flex:1}}>{formatY?formatY(d.value):d.value}</div>)}
    </div>
  </div>
}
function DualBarChart({data,height=150,labelA="গত বছর",labelB="এই বছর"}){
  const max=Math.max(...data.map(d=>Math.max(d.a,d.b)),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const hA=(d.a/max)*(height-24),hB=(d.b/max)*(height-24);
        const bw=w*0.32;
        return<g key={i}>
          <rect x={i*w+w*0.14} y={height-24-hA} width={bw} height={hA} fill="#94a3b8" rx="1"/>
          <rect x={i*w+w*0.14+bw+2} y={height-24-hB} width={bw} height={hB} fill={RED} rx="1"/>
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:4}}>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:"#94a3b8",borderRadius:2}}></div>{labelA}</div>

function ProgressBar({pct}){
  // 0-50 red, 50-99 yellow (gradient), 100 green
  let color;
  if(pct>=100)color="#16a34a";
  else if(pct>=50){
    // interpolate yellow(#f59e0b) -> green(#16a34a) as pct goes 50->99
    const t=(pct-50)/50;
    const r1=245,g1=158,b1=11, r2=22,g2=163,b2=74;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }else{
    // interpolate red(#dc2626) -> yellow(#f59e0b) as pct goes 0->50
    const t=pct/50;
    const r1=220,g1=38,b1=38, r2=245,g2=158,b2=11;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }
  return<div style={{width:"100%"}}>
    <div style={{width:"100%",height:14,background:"#f0f0f0",borderRadius:7,overflow:"hidden",position:"relative"}}>
      <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:color,borderRadius:7,transition:"width .3s"}}></div>

    <div style={{fontSize:10,fontWeight:700,color,marginTop:2,textAlign:"right"}}>{pct>=100?"✅ রেডি টু ডেলিভার":`${pct}% সম্পন্ন`}</div>
  </div>
}
function PieChart3D({data,size=180,showCount=false,countSuffix=""}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>কোনো ডেটা নেই</div>;
  const radius=size/2-8;
  const cx=size/2,cy=size/2-6;
  const depth=12; // 3D thickness
  let cumAngle=0;
  const toXY=(ang,r,yOff=0)=>{const rad=(ang-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+yOff+r*Math.sin(rad)*0.55]}; // squash Y for ellipse/3D look
  const slices=data.map((d,idx)=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const[x1,y1]=toXY(startAngle,radius);
    const[x2,y2]=toXY(endAngle,radius);
    const largeArc=angle>180?1:0;
    const topPath=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    // side "wall" path for depth (only meaningful for bottom-facing slices, approximate for all for visual consistency)
    const[x1b,y1b]=toXY(startAngle,radius,depth);
    const[x2b,y2b]=toXY(endAngle,radius,depth);
    const sidePath=`M ${x1} ${y1} L ${x1b} ${y1b} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2b} ${y2b} L ${x2} ${y2} A ${radius} ${radius*0.55} 0 ${largeArc} 0 ${x1} ${y1} Z`;
    const midAngle=(startAngle+endAngle)/2;
    return{...d,topPath,sidePath,midAngle,pct:Math.round((d.value/total)*100),idx};
  });
  const shadeColor=(hex,amt)=>{
    // darken a hex color by amt (0-1)
    const c=hex.replace("#","");
    const num=parseInt(c,16);
    let r=(num>>16)-Math.round(255*amt), g=((num>>8)&0xff)-Math.round(255*amt), b=(num&0xff)-Math.round(255*amt);
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return`rgb(${r},${g},${b})`;
  };
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size+depth+10} viewBox={`0 0 ${size} ${size+depth+10}`}>
      <ellipse cx={cx} cy={cy+radius*0.55+depth+2} rx={radius+2} ry={(radius*0.55)+2} fill="rgba(0,0,0,0.12)"/>
      {slices.map((s,i)=><path key={"side"+i} d={s.sidePath} fill={shadeColor(s.color,0.35)}/>)}
      {slices.map((s,i)=><path key={"top"+i} d={s.topPath} fill={s.color} stroke="white" strokeWidth="1.5" style={{filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.15))"}}/>)}
    </svg>
    <div style={{flex:1,minWidth:130}}>
      {slices.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:11}}>
        <div style={{width:11,height:11,background:`linear-gradient(135deg, ${s.color}, ${shadeColor(s.color,0.3)})`,borderRadius:3,flexShrink:0,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}></div>
        <span style={{color:"#444",flex:1}}>{s.label}</span>
        <span style={{fontWeight:700,color:"#222"}}>{s.pct}%{showCount?` (${s.value}${countSuffix})`:""}</span>
      </div>)}
    </div>
  </div>
}

/* ── ROOT (decides setup vs app) ── */
function Root(){
  const[config,setConfig]=useState(undefined); // undefined = checking, null = not set, object = ready
  useEffect(()=>{
    const saved=S.get("rf_firebase_config");
    setConfig(saved||null);
  },[]);
  if(config===undefined)return<div style={{padding:40,textAlign:"center"}}>লোড হচ্ছে...</div>;
  if(config===null)return<FirebaseSetup onSaved={(c)=>setConfig(c)}/>;
  return<App firebaseConfig={config} onResetConfig={()=>{localStorage.removeItem("rf_firebase_config");setConfig(null)}}/>;
}

            if(localDb)jobs.push(firestore.doc("meta/db").set(localDb));
            if(localCarpenters.length)jobs.push(firestore.doc("meta/carpenters").set({list:localCarpenters}));
            if(jobs.length)await Promise.all(jobs);
          }
        }catch(e){/* ignore migration errors silently */}
        localStorage.setItem("rf_migrated_to_cloud","true");
      })();

      return()=>{clearTimeout(timer);unsubOrders();unsubExpenses();unsubLots();unsubDb();unsubGalleries();unsubWoodSettings();unsubLaborSettings();unsubCarp();unsubWorkers();unsubPayroll()};
    }catch(e){
      clearTimeout(timer);
      setConnError(e.message);
    }
  },[firebaseConfig,retryKey]);

  const saveDb=(newDb)=>{
    setDb(newDb);
    if(fsRef.current)fsRef.current.doc("meta/db").set(newDb).catch(err=>alert("⚠️ ক্লাউডে সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveOrder=(o)=>{
    setDraft(o);
    navigate({page:"preview",orderNo:o.no,slip:0,from:"home"});
    if(fsRef.current)fsRef.current.collection("orders").doc(o.no).set(o).catch(err=>alert("⚠️ অর্ডার সিঙ্ক করতে সমস্যা হয়েছে: "+err.message+" — ইন্টারনেট সংযোগ ফিরে আসলে এটি নিজে থেকেই সিঙ্ক হবে।"));
  };
  const updateOrder=(updated)=>{
    if(draft&&draft.no===updated.no)setDraft(updated);
    if(fsRef.current)fsRef.current.collection("orders").doc(updated.no).set(updated).catch(err=>alert("⚠️ পরিবর্তন সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const deleteOrderPermanently=(orderNo)=>{
    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).delete().catch(err=>alert("⚠️ ডিলিট করতে সমস্যা হয়েছে: "+err.message));
    setDraft(null);
    goBack();
  };
  const saveExpense=(exp)=>{
    const id=exp.id||("exp_"+Date.now());
    const withId={...exp,id};
    if(fsRef.current)fsRef.current.collection("expenses").doc(id).set(withId).catch(err=>alert("⚠️ খরচ সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveCarpenters=(list)=>{
    setCarpenters(list);
    if(fsRef.current)fsRef.current.doc("meta/carpenters").set({list}).catch(()=>{});
  };
  const saveWoodLots=(newList)=>{
    setWoodLots(newList);
    if(!fsRef.current)return;
    const newIds=new Set(newList.map(l=>l.id));
    newList.forEach(lot=>fsRef.current.collection("woodlots").doc(lot.id).set(lot).catch(err=>alert("⚠️ কাঠের স্টক সিঙ্ক করতে সমস্যা হয়েছে: "+err.message)));
    woodLots.forEach(lot=>{if(!newIds.has(lot.id))fsRef.current.collection("woodlots").doc(lot.id).delete().catch(()=>{})});
  };
  const saveWorker=(worker)=>{
    const id=worker.id||("worker_"+Date.now());
    const withId={...worker,id};
    setWorkers(prev=>{const exists=prev.some(w=>w.id===id);return exists?prev.map(w=>w.id===id?withId:w):[...prev,withId]});
    if(fsRef.current)fsRef.current.collection("workers").doc(id).set(withId).catch(err=>alert("⚠️ কর্মীর তথ্য সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const deleteWorker=(id)=>{
    setWorkers(prev=>prev.filter(w=>w.id!==id));
    if(fsRef.current)fsRef.current.collection("workers").doc(id).delete().catch(()=>{});
  };
  const savePayrollWeek=(weekEnd,data)=>{
    setPayrollWeeks(prev=>({...prev,[weekEnd]:data}));
    if(fsRef.current)fsRef.current.collection("payrollWeeks").doc(weekEnd).set(data).catch(err=>alert("⚠️ পে-রোল সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };

  if(!db){
    if(connError)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:RED,marginBottom:10}}>⚠️ সংযোগ সমস্যা</div>
      <div style={{background:"#fef2f2",borderRadius:9,padding:"12px 14px",fontSize:13,color:"#991b1b",marginBottom:16,fontFamily:"monospace",wordBreak:"break-word"}}>{connError}</div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:RED,color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:RED,border:`1.5px solid ${RED}`,borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    if(timedOut)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:"#92400e",marginBottom:10}}>⏳ অনেকক্ষণ ধরে সিঙ্ক হচ্ছে...</div>
      <div style={{fontSize:13,color:"#555",marginBottom:14,textAlign:"left",lineHeight:1.7}}>
        সম্ভাব্য কারণ:<br/>
        ১. ইন্টারনেট সংযোগ দুর্বল বা বন্ধ<br/>
        ২. ব্রাউজারের কোনো "Shield"/"Ad-block" এক্সটেনশন (Brave Shields, uBlock ইত্যাদি) গুগলের সার্ভারে সংযোগ ব্লক করছে — এটা বন্ধ করে আবার চেষ্টা করুন<br/>
        ৩. Firebase কনফিগ কোডে ভুল আছে (ভুল প্রজেক্টের কোড পেস্ট হয়েছে)<br/>
        ৪. ফোনের ডেটা/ওয়াইফাই গুগল সার্ভিস ব্লক করছে এমন নেটওয়ার্ক (কিছু অফিস/স্কুল ওয়াইফাই এমন হয়)
      </div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:"#92400e",color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:"#92400e",border:"1.5px solid #92400e",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    return<div style={{padding:40,textAlign:"center"}}><div style={{fontSize:9,color:"#ccc",marginBottom:10}}>{BUILD_TAG}</div>সিঙ্ক হচ্ছে...</div>;
  }
  if(page==="preview")return<Preview order={viewed||draft} onBack={goBack} slip={slip} setSlip={setSlip} onUpdate={updateOrder} onDelete={deleteOrderPermanently} db={db} saveDb={saveDb} carpenters={carpenters} saveCarpenters={saveCarpenters} galleries={galleries} saveGalleryEntry={saveGalleryEntry} woodSettings={woodSettings} laborSettings={laborSettings} workers={workers}/>;
  if(page==="form")return<Form onSave={saveOrder} onBack={goBack} db={db} saveDb={saveDb} galleries={galleries} woodSettings={woodSettings} laborSettings={laborSettings}/>;
  if(page==="history")return<Hist orders={orders} onBack={goBack} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} highlightNo={highlightNo}/>;
  if(page==="manage")return<ManageDB db={db} saveDb={saveDb} galleries={galleries} saveGalleryEntry={saveGalleryEntry} onBack={goBack}/>;
  if(page==="woodstock")return<WoodStockPage woodLots={woodLots} saveWoodLots={saveWoodLots} woodSettings={woodSettings} saveWoodSettings={saveWoodSettings} laborSettings={laborSettings} saveLaborSettings={saveLaborSettings} payrollWeeks={payrollWeeks} workers={workers} orders={orders} onBack={goBack} view={curScreen.view||"list"} lotId={curScreen.lotId||null} onOpenList={()=>navigate({page:"woodstock",view:"list"})} onOpenDetail={lotId=>navigate({page:"woodstock",view:"detail",lotId})} onOpenNew={()=>navigate({page:"woodstock",view:"new"})} onOpenRates={()=>navigate({page:"woodstock",view:"rates"})} highlightNo={highlightNo}/>;
  if(page==="expense")return<ExpensePage expenses={expenses} onSave={saveExpense} onBack={goBack}/>;
  if(page==="payroll")return<PayrollPage workers={workers} saveWorker={saveWorker} deleteWorker={deleteWorker} payrollWeeks={payrollWeeks} savePayrollWeek={savePayrollWeek} onBack={goBack}/>;
  if(page==="plreport")return<PLReportPage orders={orders} expenses={expenses} workers={workers} payrollWeeks={payrollWeeks} woodLots={woodLots} woodSettings={woodSettings} laborSettings={laborSettings} onBack={goBack}/>;
  return<Home orders={orders} expenses={expenses} woodLots={woodLots} db={db} onNew={()=>navigate({page:"form"})} onHist={()=>navigate({page:"history"})} onManage={()=>navigate({page:"manage"})} onExpense={()=>navigate({page:"expense"})} onWoodStock={()=>navigate({page:"woodstock",view:"list"})} onPayroll={()=>navigate({page:"payroll"})} onPLReport={()=>navigate({page:"plreport"})} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} online={online} connError={connError} onResetConfig={onResetConfig} folderStatus={folderStatus} connectFolder={connectFolder} highlightNo={highlightNo}/>;
}

/* ── HOME / DASHBOARD ── */
function Home({orders,expenses,woodLots,db,onNew,onHist,onManage,onExpense,onWoodStock,onPayroll,onPLReport,onView,online,connError,onResetConfig,folderStatus,connectFolder,highlightNo}){
  const now=new Date();
  const stats=useMemo(()=>{
    // Running orders (not fully paid = not delivered typically, but we track by payment completion as proxy + delivery date)
    const running=orders.filter(o=>{
      if(o.cancelled)return false;
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const full=parseFloat(o.cust.total)>0&&paid>=parseFloat(o.cust.total);
      return !full || !o.delivered;
    });
    const withDays=running.map(o=>{
      const daysLeft=o.cust.delivery?daysBetween(todayStr(),o.cust.delivery):999;
      const ip=o.itemProgress||{};
      const allPcts=[];
      const allWorkersSet=new Set();
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          allPcts.push((cur&&cur.pct)||0);
          (cur&&cur.workers||[]).forEach(w=>allWorkersSet.add(w));
        });
      });
      const pct=allPcts.length?Math.round(allPcts.reduce((s,v)=>s+v,0)/allPcts.length):0;
      const allWorkers=[...allWorkersSet];
      return{...o,daysLeft,pct,allWorkers};
    }).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Exclude cancelled orders from all financial/analytical stats
    const activeOrders=orders.filter(o=>!o.cancelled);

    // Last 6 months order count & revenue
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    const monthlyOrders=months.map(({y,m})=>{
      const count=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const revenue=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
      return{label:monthName(m),count,revenue,y,m};
    });
    const monthlyExpense=months.map(({y,m})=>{
      const total=expenses.filter(e=>{const ed=new Date(e.date);return ed.getFullYear()===y&&ed.getMonth()===m}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      return{label:monthName(m),value:total};
    });
    // Year over year - same months last year vs this year
    const yoy=months.map(({y,m})=>{
      const thisY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const lastY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-1&&od.getMonth()===m}).length;
      return{label:monthName(m),a:lastY,b:thisY};
    });
    const totalRevenue=activeOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const totalExpense=expenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);

    // Category breakdown of running orders (pie chart) - use actual DB category names
    const PIE_COLORS=[RED,"#1d4ed8","#6d28d9","#0f766e","#f97316","#eab308","#64748b","#db2777"];
    const catCount={};
    running.forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      const key=it.catKey||catLabel;
      catCount[key]=catCount[key]||{label:catLabel,value:0};
      catCount[key].value+=1;
    }));
    const catPie=Object.values(catCount).sort((a,b)=>b.value-a.value).slice(0,8).map((c,i)=>({...c,color:PIE_COLORS[i%PIE_COLORS.length]}));

    // This month stats
    const thisMonthOrders=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===now.getFullYear()&&od.getMonth()===now.getMonth()});
    const avgOrderValue=activeOrders.length?Math.round(totalRevenue/activeOrders.length):0;
    const totalOutstanding=activeOrders.reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      const rem=(parseFloat(o.cust.total)||0)-paid;
      return s+(rem>0?rem:0);
    },0);
    const oneYearAgo=new Date(now);oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const catAllCount={};
    activeOrders.filter(o=>new Date(o.cust.date)>=oneYearAgo).forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      catAllCount[catLabel]=(catAllCount[catLabel]||0)+1;
    }));
    const topCategoryRanked=Object.entries(catAllCount).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));

    // Yearly order count & revenue (all years present in data)
    const yearsSet=new Set(activeOrders.map(o=>new Date(o.cust.date).getFullYear()));
    yearsSet.add(now.getFullYear());
    const years=[...yearsSet].sort();
    const yearly=years.map(y=>{
      const yOrders=activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y);
      return{label:String(y),count:yOrders.length,revenue:yOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0)};
    });

    // Best month ever (by order count) vs same month this year
    const monthlyAgg={}; // key "y-m" -> {count, revenue}
    activeOrders.forEach(o=>{
      const od=new Date(o.cust.date);
      const key=`${od.getFullYear()}-${od.getMonth()}`;
      monthlyAgg[key]=monthlyAgg[key]||{count:0,revenue:0,y:od.getFullYear(),m:od.getMonth()};
      monthlyAgg[key].count+=1;
      monthlyAgg[key].revenue+=(parseFloat(o.cust.total)||0);
    });
    const monthlyList=Object.values(monthlyAgg);
    let bestMonth=null;
    if(monthlyList.length>0)bestMonth=monthlyList.reduce((a,b)=>b.count>a.count?b:a);
    let bestMonthCompare=null;
    if(bestMonth){
      const thisYearSameMonth=monthlyAgg[`${now.getFullYear()}-${bestMonth.m}`]||{count:0,revenue:0};
      bestMonthCompare={
        monthLabel:monthName(bestMonth.m),
        bestYear:bestMonth.y,
        bestCount:bestMonth.count,
        bestRevenue:bestMonth.revenue,
        thisYear:now.getFullYear(),
        thisCount:thisYearSameMonth.count,
        thisRevenue:thisYearSameMonth.revenue
      };
    }

    // Wood stock pie (uncut/available logs by wood type)
    const WOOD_COLORS={S:"#92400e",M:"#b45309",A:"#65a30d",K:"#0891b2",E:"#7c3aed"};
    const stockByType={};
    (woodLots||[]).forEach(lot=>{
      const availCft=(lot.logs||[]).filter(l=>!l.cut).reduce((s,l)=>s+l.cft,0);
      if(availCft<=0)return;
      stockByType[lot.woodType]=(stockByType[lot.woodType]||0)+availCft;
    });
    const stockPie=Object.entries(stockByType).map(([wt,val])=>({label:WOOD[wt].bn,value:val,color:WOOD_COLORS[wt]||"#888"}));

    // Expense category pie (last 1 year)
    const expByCat={};
    expenses.filter(e=>new Date(e.date)>=oneYearAgo).forEach(e=>{
      const cat=EXP_CATS.find(c=>c.id===e.category);
      const label=cat?cat.bn:e.category;
      expByCat[label]=(expByCat[label]||0)+(parseFloat(e.total)||0);
    });
    const EXP_PIE_COLORS=["#0f766e","#1d4ed8","#f97316","#6d28d9","#db2777","#64748b","#eab308","#16a34a"];
    const expensePie=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([label,value],i)=>({label,value,color:EXP_PIE_COLORS[i%EXP_PIE_COLORS.length]}));

    return{running:withDays,monthlyOrders,monthlyExpense,yoy,totalRevenue,totalExpense,catPie,thisMonthCount:thisMonthOrders.length,avgOrderValue,totalOutstanding,topCategoryRanked,yearly,bestMonthCompare,stockPie,expensePie};
  },[orders,expenses,db,woodLots]);

  return<div style={{minHeight:"100vh",background:`linear-gradient(150deg,${RED} 0%,#8B0020 100%)`,position:"relative"}}>
    <div style={{position:"absolute",top:8,right:10,fontSize:9,color:"rgba(255,255,255,0.55)",fontWeight:600,letterSpacing:0.3,zIndex:5}}>v{BUILD_TAG}</div>
    <div style={{padding:"24px 18px 18px",textAlign:"center",color:"white"}}>
      <div style={{width:52,height:52,background:"white",borderRadius:13,display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:8,boxShadow:"0 4px 18px rgba(0,0,0,.3)"}}><span style={{color:RED,fontSize:26,fontWeight:800,fontFamily:"Georgia,serif"}}>R</span></div>
      <div style={{fontSize:20,fontWeight:800}}>রূপালী ফার্নিচার</div>
      <div style={{fontSize:10,opacity:.8,marginTop:2}}>Rupali Furniture · Sirajganj | সাদমান সাকিব</div>
    </div>
    <div style={{background:"white",borderRadius:"20px 20px 0 0",minHeight:"calc(100vh - 160px)",padding:"18px 14px",maxWidth:720,margin:"0 auto"}}>
      {/* Action buttons */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        <button onClick={onNew} style={{background:RED,color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ নতুন অর্ডার</button>
        <button onClick={onExpense} style={{background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ খরচ যোগ করুন</button>
        <button onClick={onHist} style={{background:"white",color:RED,border:`2px solid ${RED}`,borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>অর্ডার ইতিহাস</button>
        <button onClick={onManage} style={{background:"white",color:"#6d28d9",border:"2px solid #6d28d9",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>⚙ ডেটাবেস</button>
        <button onClick={onWoodStock} style={{background:"white",color:"#065f46",border:"2px solid #065f46",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700,gridColumn:"span 2"}}>🪵 কাঠের স্টক ব্যবস্থাপনা</button>
        <button onClick={onPayroll} style={{background:PAY,color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700,gridColumn:"span 2"}}>👷 পে-রোল ব্যবস্থাপনা</button>
        <button onClick={onPLReport} style={{background:"#B45309",color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700,gridColumn:"span 2"}}>📊 লাভ-ক্ষতি রিপোর্ট</button>
      </div>

      {/* Quick Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        {[{l:"মোট অর্ডার",v:orders.length,c:RED},{l:"চলমান অর্ডার",v:stats.running.length,c:"#f97316"},{l:"মোট মূল্য",v:money(stats.totalRevenue),c:"#166534",small:true}].map(s=><div key={s.l} style={{background:s.c+"12",borderRadius:10,padding:"10px 6px",borderLeft:`3px solid ${s.c}`,textAlign:"center"}}><div style={{fontSize:s.small?14:22,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#666",marginTop:1}}>{s.l}</div></div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[{l:"এই মাসে অর্ডার",v:stats.thisMonthCount,c:"#1d4ed8"},{l:"গড় অর্ডার মূল্য",v:money(stats.avgOrderValue),c:"#6d28d9",small:true},{l:"মোট বকেয়া",v:money(stats.totalOutstanding),c:RED,small:true}].map(s=><div key={s.l} style={{background:s.c+"12",borderRadius:10,padding:"10px 6px",borderLeft:`3px solid ${s.c}`,textAlign:"center"}}><div style={{fontSize:s.small?14:22,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#666",marginTop:1}}>{s.l}</div></div>)}

        {stats.topCategoryRanked.slice(0,6).map((c,i)=><div key={c.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:i<stats.topCategoryRanked.length-1?6:0}}>

      {/* Running Orders Ranked Table */}

        {stats.running.length===0?<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:16,background:"#fafafa",borderRadius:9}}>কোনো চলমান অর্ডার নেই</div>:

                </div>

            </div>
          })}
        </div>}
      </div>

      {/* Monthly Orders Chart */}
      <div style={{marginBottom:18}}>
