// Compress an image file to a small JPEG base64 string before storing, to avoid hitting localStorage quota
function compressImage(file,maxDim=900,quality=0.72){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
        else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

/* ── FULL-RESOLUTION LOCAL FOLDER STORAGE (desktop Chrome/Edge/Brave only) ──
   Original, uncompressed images are saved as real files in a folder you choose
   on your computer. Only a small compressed thumbnail syncs to the cloud/mobile. */
const BUILD_TAG="BUILD-2026-07-19-A";
const FS_SUPPORTED=typeof window!=="undefined"&&"showDirectoryPicker" in window;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("rf_fs_store",1);
    req.onupgradeneeded=()=>{req.result.createObjectStore("handles")};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readwrite");
    tx.objectStore("handles").put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readonly");
    const req=tx.objectStore("handles").get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function pickImageFolder(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await window.showDirectoryPicker();
    await idbSet("imageFolder",handle);
    return handle;
  }catch(e){return null}
}
async function getImageFolderHandle(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await idbGet("imageFolder");
    if(!handle)return null;
    const perm=await handle.queryPermission({mode:"readwrite"});
    if(perm==="granted")return handle;
    const req=await handle.requestPermission({mode:"readwrite"});
    if(req==="granted")return handle;
    return null;
  }catch(e){return null}
}
function genImgFileName(prefix,index,file){
  const ext=(file.name.match(/\.[0-9a-z]+$/i)||[".jpg"])[0];
  return`${prefix}_${index}${ext}`.replace(/[^a-zA-Z0-9_.\-]/g,"_");
}
async function saveFullResImage(file,fileName){
  const folder=await getImageFolderHandle();
  if(!folder)return false;
  try{
    const fileHandle=await folder.getFileHandle(fileName,{create:true});
    const writable=await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  }catch(e){return false}
}
async function openFullResImageForPrint(fileName){

/* ── SHARED UI ── */
function IR({l,v}){if(!v)return null;return<div style={{display:"flex",gap:6,marginBottom:4,fontSize:11}}><span style={{color:"#888",flexShrink:0,minWidth:90}}>{l}:</span><span style={{fontWeight:600,color:"#222"}}>{v}</span></div>}
function Hdr({title,sub,no,bg}){return<><div style={{background:bg,color:"white",padding:"10px 14px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:16,fontWeight:800}}>রূপালী ফার্নিচার</div><div style={{fontSize:9,opacity:.88}}>শেরে বাংলা ফজলুল হক রোড, ডুকু ব্রিজ ১ সংলগ্ন, সিরাজগঞ্জ | ☎ 01711-318070 | পরিচালক: সাদমান সাকিব</div></div><div style={{textAlign:"right"}}><div style={{fontSize:9,opacity:.7}}>অর্ডার নং</div><div style={{fontSize:11,fontWeight:800}}>{no}</div></div></div></div><div style={{background:"#111",color:"white",padding:"4px 14px",display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,fontWeight:700}}>{title}</span><span style={{fontSize:9,opacity:.6}}>{sub}</span></div></>}
function PrintLog({log}){
  if(!log||log.length===0)return<div style={{fontSize:8,color:"#bbb",marginTop:6,fontStyle:"italic"}}>এখনো প্রিন্ট করা হয়নি</div>;
  return<div style={{fontSize:8,color:"#999",marginTop:6,fontStyle:"italic"}}>প্রিন্ট: {log.length} বার | সর্বশেষ: {fmtDate(log[log.length-1])}{log.length>1?` (মোট: ${log.map(fmtDate).join(", ")})`:""}</div>
}
function PrintBtn({onPrint}){return<button className="no-print" onClick={onPrint} style={{background:"white",color:"inherit",border:"1.5px solid currentColor",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5}}>🖨️ এই স্লিপ প্রিন্ট করুন</button>}
function FullImgBtn({fileName}){
  if(!fileName||!FS_SUPPORTED)return null;
  return<button className="no-print" onClick={()=>openFullResImageForPrint(fileName)} style={{background:"#1e293b",color:"white",border:"none",borderRadius:5,padding:"2px 7px",fontSize:8,fontWeight:700,marginTop:2}}>🖨️ ফুল ছবি প্রিন্ট</button>
}

/* ── SLIP 1: CUSTOMER (no CFT, delivery countdown, print log) ── */
function S1({order,onPrint}){
  const{cust,items,payments,refImg,refImgs,no,printLogs}=order;
  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const totalPaid=(payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const rem=(parseFloat(cust.total)||0)-totalPaid;
  const days=cust.delivery?daysBetween(cust.date,cust.delivery):null;
  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end"}}><PrintBtn onPrint={()=>onPrint("s1")}/></div>
    <Hdr title="গ্রাহকের কপি" sub="Customer Copy" no={no} bg={RED}/>
    <div style={{padding:"10px 14px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 12px",background:"#fff8f8",borderRadius:7,padding:"8px",marginBottom:8}}>
        <IR l="তারিখ" v={cust.date}/><IR l="ডেলিভারি" v={cust.delivery?`${cust.delivery} (${days} দিনে)`:""}/>
        <IR l="গ্রাহকের নাম" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/>
        <IR l="ঠিকানা" v={cust.address}/>{cust.notes&&<IR l="মন্তব্য" v={cust.notes}/>}
      </div>
      {images.length>0&&<div style={{marginBottom:8}}>
        <div style={{fontSize:10,color:"#888",marginBottom:4,textAlign:"center"}}>গ্রাহকের রেফারেন্স ছবি:</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center"}}><img src={img.src} className="ref-img" alt="ref" style={{maxHeight:100}}/><div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div><FullImgBtn fileName={img.fileName}/></div>)}
        </div>
      </div>}
      <div style={{fontWeight:700,fontSize:10,color:RED,marginBottom:5}}>অর্ডারের বিবরণ</div>
      {items.map((it,i)=><div key={i} style={{border:"1px solid #fcc",borderRadius:6,padding:"6px 9px",marginBottom:5,fontSize:10}}>
        <div style={{fontWeight:700}}>[{it.code}] {it.variantBn}</div>
        <div style={{color:"#555",marginTop:1}}>কাঠ: {it.woodBn} | পরিমাণ: {it.qty} পিস</div>
        {it.notes&&<div style={{color:"#888",marginTop:1}}>⚙ {it.notes}</div>}
      </div>)}
      <div style={{background:"#fff0f0",borderRadius:7,padding:"8px",marginTop:4}}>
        <div style={{fontWeight:700,fontSize:10,color:RED,marginBottom:4}}>পেমেন্টের বিবরণ</div>
        {(payments||[]).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:2}}><span>{p.date} — {p.note||"পেমেন্ট"}</span><span style={{fontWeight:700}}>{money(p.amount)}</span></div>)}
        <div style={{display:"flex",justifyContent:"space-between",borderTop:"1px solid #fcc",paddingTop:5,marginTop:4}}><span style={{fontWeight:700,fontSize:11,color:RED}}>বাকি:</span><span style={{fontWeight:800,fontSize:12,color:RED}}>{money(rem)}</span></div>
      </div>
      <div style={{marginTop:8,background:"#f0fdf4",borderRadius:6,padding:"6px 10px",fontSize:9,color:"#166534",textAlign:"center"}}>আজীবন ওয়ারেন্টি · লেকার স্প্রে ফিনিশ · প্রাকৃতিকভাবে সিজনড কাঠ</div>
      <div style={{marginTop:16,display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>{["গ্রাহকের স্বাক্ষর","রূপালী ফার্নিচার"].map(t=><div key={t} style={{minHeight:52,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}><div style={{borderTop:"1.5px solid #999",paddingTop:6,textAlign:"center",fontSize:10,color:"#666"}}>{t}</div></div>)}</div>
      <div className="no-print"><PrintLog log={printLogs?.s1}/></div>
    </div>
  </div>
}

  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const totalPaid=(payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const rem=(parseFloat(cust.total)||0)-totalPaid;
  const days=cust.delivery?daysBetween(cust.date,cust.delivery):null;
  const[editIdx,setEditIdx]=useState(null);
  const[editForm,setEditForm]=useState(null);
  const[editingImages,setEditingImages]=useState(false);
  const imgInputRef=useRef();

  const startEditItem=(i)=>{
    const it=items[i];
    setEditIdx(i);
    setEditForm({catKey:it.catKey,varKey:it.varKey,wood:it.wood,qty:it.qty,notes:it.notes||""});
  };
  const saveEditItem=()=>{
    const cat=db[editForm.catKey];
    const variant=cat.variants[editForm.varKey];
    const newItems=[...items];
    const keepSections=newItems[editIdx].varKey===editForm.varKey?newItems[editIdx].sections:JSON.parse(JSON.stringify(variant.sections));
    newItems[editIdx]={...newItems[editIdx],catKey:editForm.catKey,varKey:editForm.varKey,variantBn:variant.bn,code:variant.code,wood:editForm.wood,woodBn:WOOD[editForm.wood].bn,qty:editForm.qty,notes:editForm.notes,sections:keepSections};
    onUpdateOrder({...order,items:newItems});
    setEditIdx(null);setEditForm(null);
  };
  const addNewImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const newOnes=[];
    for(let idx=0;idx<files.length;idx++){
      const compressed=await compressImage(files[idx]);
      if(!compressed)continue;
      const fileIdx=images.length+newOnes.length+1;
      const fileName=genImgFileName(`${order.no}_ref`,fileIdx,files[idx]);
      const savedFull=await saveFullResImage(files[idx],fileName);
      newOnes.push({src:compressed,caption:`ছবি ${fileIdx}`,fileName:savedFull?fileName:null});
    }
    if(newOnes.length>0)onUpdateOrder({...order,refImgs:[...images,...newOnes],refImg:undefined});
  };
  const removeImage=(idx)=>{
    const updated=images.filter((_,i)=>i!==idx);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };
  const updateImgCaption=(idx,val)=>{
    const updated=images.map((img,i)=>i===idx?{...img,caption:val}:img);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#1d4ed8"}}><PrintBtn onPrint={()=>onPrint("s2")}/></div>
    <Hdr title="অর্ডার বুক কপি" sub="Order Book Copy" no={no} bg="#1d4ed8"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 12px",background:"#eff6ff",borderRadius:7,padding:"8px",marginBottom:8}}>
        <IR l="তারিখ" v={cust.date}/><IR l="ডেলিভারি" v={cust.delivery?`${cust.delivery} (${days} দিনে)`:""}/>
        <IR l="গ্রাহকের নাম" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/>
        <IR l="ঠিকানা" v={cust.address}/><IR l="মন্তব্য" v={cust.notes}/>
      </div>
      {images.length>0&&<div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:10,color:"#888"}}>রেফারেন্স ছবি:</span>
          <button className="no-print" onClick={()=>setEditingImages(!editingImages)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"3px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>{editingImages?"✓ শেষ":"✏️ পরিবর্তন"}</button>
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center",position:"relative"}}>
            <img src={img.src} className="ref-img" alt="ref" style={{maxHeight:100}}/>
            {editingImages?<input className="no-print" value={img.caption} onChange={e=>updateImgCaption(i,e.target.value)} style={{fontSize:8,marginTop:2,border:"1px solid #ddd",borderRadius:4,padding:"2px 4px",width:"90%",outline:"none"}}/>:<div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div>}
            <FullImgBtn fileName={img.fileName}/>
            {editingImages&&<button className="no-print" onClick={()=>removeImage(i)} style={{position:"absolute",top:-6,right:-6,background:RED,color:"white",border:"none",borderRadius:"50%",width:18,height:18,fontSize:10,lineHeight:1}}>✕</button>}
          </div>)}
        </div>
        {editingImages&&<div className="no-print" style={{textAlign:"center",marginTop:8}}>
          <input ref={imgInputRef} type="file" accept="image/*" multiple onChange={addNewImages} style={{display:"none"}}/>
          <button onClick={()=>imgInputRef.current.click()} style={{background:"#f0f0f0",border:"1.5px dashed #aaa",borderRadius:8,padding:"7px 14px",fontSize:11,color:"#555"}}>📂 আরো ছবি যোগ করুন</button>
        </div>}
      </div>}
      {images.length===0&&<div className="no-print" style={{textAlign:"center",marginBottom:8}}>
        <input ref={imgInputRef} type="file" accept="image/*" multiple onChange={addNewImages} style={{display:"none"}}/>
        <button onClick={()=>imgInputRef.current.click()} style={{background:"#f0f0f0",border:"1.5px dashed #aaa",borderRadius:8,padding:"7px 14px",fontSize:11,color:"#555"}}>📂 রেফারেন্স ছবি যোগ করুন</button>
      </div>}
      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #bfdbfe",borderRadius:6,padding:"6px 9px",marginBottom:5,fontSize:10}}>
        {editIdx===i?<div className="no-print" style={{background:"#eff6ff",borderRadius:7,padding:8}}>
          <div style={{fontSize:9,fontWeight:700,color:"#1d4ed8",marginBottom:6}}>ফার্নিচার পরিবর্তন করুন</div>
          <select value={editForm.catKey} onChange={e=>setEditForm({...editForm,catKey:e.target.value,varKey:""})} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:6}}>
            {Object.entries(db).map(([k,c])=><option key={k} value={k}>{c.bn}</option>)}
          </select>
          <select value={editForm.varKey} onChange={e=>setEditForm({...editForm,varKey:e.target.value})} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:6}}>
            <option value="">-- মডেল নির্বাচন করুন --</option>
            {db[editForm.catKey]&&Object.entries(db[editForm.catKey].variants).map(([k,v])=><option key={k} value={k}>[{v.code}] {v.bn}</option>)}
          </select>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={editForm.wood} onChange={e=>setEditForm({...editForm,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>
              {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn}</option>)}
            </select>
            <input type="number" min={1} value={editForm.qty} onChange={e=>setEditForm({...editForm,qty:parseInt(e.target.value)||1})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>
          </div>
          <textarea rows={2} value={editForm.notes} onChange={e=>setEditForm({...editForm,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:6,resize:"vertical"}}/>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setEditIdx(null);setEditForm(null)}} style={{flex:1,background:"white",border:"1px solid #ddd",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
            <button onClick={saveEditItem} disabled={!editForm.varKey} style={{flex:2,background:editForm.varKey?"#1d4ed8":"#ccc",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>সংরক্ষণ করুন</button>
          </div>
        </div>:<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700}}>[{it.code}] {it.variantBn}</div>
              <div style={{color:"#555",marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty} | CFT: {(totalCft(it.sections)*it.qty).toFixed(3)}</div>
              {it.notes&&<div style={{color:"#888",marginTop:1}}>⚙ {it.notes}</div>}
            </div>
            <button className="no-print" onClick={()=>startEditItem(i)} style={{background:"#eff6ff",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,color:"#1d4ed8",fontWeight:700}}>✏️ পরিবর্তন</button>
          </div>
        </>}
      </div>)}
      <div style={{background:"#eff6ff",borderRadius:7,padding:"8px",marginTop:4}}>
        <div style={{fontWeight:700,fontSize:10,color:"#1d4ed8",marginBottom:4}}>পেমেন্ট ট্র্যাকিং</div>
        {(payments||[]).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:2,borderBottom:"1px dashed #bfdbfe",paddingBottom:2}}><span>{p.date} — {p.note||"পেমেন্ট"}</span><span style={{fontWeight:700}}>{money(p.amount)}</span></div>)}
        <div style={{display:"flex",justifyContent:"space-between",paddingTop:4,marginTop:2}}><span style={{fontSize:10}}>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:10,fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:RED}}>{money(rem)}</span></div>
      </div>
      <div className="no-print"><PrintLog log={printLogs?.s2}/></div>
    </div>
  </div>
}

/* ── SLIP 3: DEPT TRACKING ── */
function S3({order,onPrint,onUpdateOrder,carpenters,saveCarpenters}){
  const{cust,items,no,printLogs}=order;
  const dp=order.deptProgress||{};
  const[addingNameFor,setAddingNameFor]=useState(null);
  const[newName,setNewName]=useState("");

  const getDept=(id)=>dp[id]||{start:"",end:"",pct:0,workers:[]};
  const setStart=(id,val)=>{
    const cur=getDept(id);
    const newPct=val&&!cur.end?Math.max(cur.pct,20):cur.pct;
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,start:val,pct:newPct}}});
  };
  const setEnd=(id,val)=>{
    const cur=getDept(id);
    const newPct=val?100:cur.pct;
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,end:val,pct:newPct}}});
  };
  const setPct=(id,val)=>{
    const cur=getDept(id);
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,pct:parseInt(val)}}});
  };
  const toggleWorker=(id,name)=>{
    const cur=getDept(id);
    const workers=cur.workers||[];
    const newWorkers=workers.includes(name)?workers.filter(w=>w!==name):[...workers,name];
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,workers:newWorkers}}});
  };
  const addNewCarpenter=(deptId)=>{
    const name=newName.trim();
    if(!name)return;
    if(!carpenters.includes(name))saveCarpenters([...carpenters,name]);
    toggleWorker(deptId,name);
    setNewName("");setAddingNameFor(null);
  };
  const overallPct=Math.round(DEPTS.reduce((s,d)=>s+getDept(d.id).pct,0)/DEPTS.length);

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#6d28d9"}}>
      <span style={{fontWeight:800,fontSize:13}}>সামগ্রিক অগ্রগতি: {overallPct}%</span>
      <PrintBtn onPrint={()=>onPrint("s3")}/>
    </div>
    <Hdr title="বিভাগ ট্র্যাকিং কপি" sub="Department Tracking" no={no} bg="#6d28d9"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f5f3ff",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/><IR l="ডেলিভারি" v={cust.delivery}/>
        {items.map((it,i)=><IR key={i} l={`ফার্নিচার ${i+1}`} v={`[${it.code}] ${it.variantBn} (${it.woodBn}) × ${it.qty}`}/>)}
      </div>

      {/* Interactive (screen only) */}
      <div className="no-print">
        {DEPTS.map(d=>{
          const cur=getDept(d.id);
          const workers=cur.workers||[];
          const barColor=cur.pct>=100?"#16a34a":cur.pct>=50?"#f59e0b":"#dc2626";
          return<div key={d.id} style={{background:"white",border:"1px solid #ede9fe",borderRadius:9,padding:"10px 12px",marginBottom:8}}>
            <div style={{fontWeight:700,fontSize:12,color:"#6d28d9",marginBottom:6}}>{d.bn}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div><div style={{fontSize:9,color:"#888",marginBottom:2}}>শুরুর তারিখ</div><input type="date" value={cur.start} onChange={e=>setStart(d.id,e.target.value)} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 7px",fontSize:11,outline:"none"}}/></div>
              <div><div style={{fontSize:9,color:"#888",marginBottom:2}}>শেষের তারিখ</div><input type="date" value={cur.end} onChange={e=>setEnd(d.id,e.target.value)} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 7px",fontSize:11,outline:"none"}}/></div>
            </div>
            <input type="range" min="0" max="100" value={cur.pct} onChange={e=>setPct(d.id,e.target.value)} style={{width:"100%",accentColor:barColor}}/>
            <div style={{textAlign:"right",fontSize:11,fontWeight:800,color:barColor,marginBottom:8}}>{cur.pct}%{cur.pct>=100?" ✅":""}</div>

            <div style={{fontSize:9,color:"#888",marginBottom:4}}>দায়িত্বে নিয়োজিত কর্মী (একাধিক নির্বাচন করা যায়)</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
              {carpenters.map(name=><button key={name} onClick={()=>toggleWorker(d.id,name)} style={{background:workers.includes(name)?"#6d28d9":"#f3f4f6",color:workers.includes(name)?"white":"#555",border:"none",borderRadius:20,padding:"5px 11px",fontSize:10,fontWeight:600}}>{workers.includes(name)?"✓ ":""}{name}</button>)}
            </div>
            {addingNameFor===d.id?<div style={{display:"flex",gap:6}}>
              <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="নতুন নাম লিখুন" style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none"}} autoFocus/>
              <button onClick={()=>addNewCarpenter(d.id)} style={{background:"#6d28d9",color:"white",border:"none",borderRadius:6,padding:"6px 10px",fontSize:11,fontWeight:700}}>যোগ</button>
              <button onClick={()=>{setAddingNameFor(null);setNewName("")}} style={{background:"#f3f4f6",border:"none",borderRadius:6,padding:"6px 10px",fontSize:11}}>✕</button>
            </div>:<button onClick={()=>setAddingNameFor(d.id)} style={{background:"white",border:"1px dashed #6d28d9",color:"#6d28d9",borderRadius:20,padding:"5px 11px",fontSize:10,fontWeight:600}}>+ নতুন কর্মীর নাম</button>}
          </div>
        })}
      </div>

      {/* Print-only static table */}
      <table className="print-only-table" style={{width:"100%",borderCollapse:"collapse",fontSize:10,display:"none"}}>
        <thead><tr style={{background:"#6d28d9",color:"white"}}>{["বিভাগ","দায়িত্বে","শুরুর তারিখ","শেষের তারিখ","স্বাক্ষর"].map(h=><th key={h} style={{padding:"6px 5px",textAlign:"left",fontWeight:700}}>{h}</th>)}</tr></thead>
        <tbody>{DEPTS.map((d,i)=>{const cur=getDept(d.id);return<tr key={d.id} style={{background:i%2===0?"#f5f3ff":"white",borderBottom:"1px solid #ede9fe"}}><td style={{padding:"10px 5px",fontWeight:600}}>{d.bn} ({cur.pct}%)</td><td style={{padding:"10px 5px",fontSize:9}}>{(cur.workers||[]).join(", ")||"—"}</td><td style={{padding:"10px 5px",color:cur.start?"#333":"#bbb"}}>{cur.start||"___/___/______"}</td><td style={{padding:"10px 5px",color:cur.end?"#333":"#bbb"}}>{cur.end||"___/___/______"}</td><td style={{padding:"10px 5px",color:"#bbb"}}>____________</td></tr>})}</tbody>
      </table>

      <div className="no-print"><PrintLog log={printLogs?.s3}/></div>
    </div>
  </div>
}

/* ── SLIP 4: CARPENTER (editable wood, saves as new variant) ── */
function S4({order,onPrint,db,saveDb,onUpdateOrder}){
  const{cust,items,no,printLogs,refImg,refImgs}=order;
  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const[editIdx,setEditIdx]=useState(null);
  const[editSections,setEditSections]=useState(null);

  const startEdit=(idx)=>{setEditIdx(idx);setEditSections(JSON.parse(JSON.stringify(items[idx].sections)))};
  const updatePiece=(si,pi,field,val)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces[pi][field]=field==="bn"?val:(parseFloat(val)||0);setEditSections(ns)};
  const removePiece=(si,pi)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.splice(pi,1);setEditSections(ns)};
  const addPieceToSection=(si)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.push({bn:"নতুন কাঠ",pc:1,h:24,l:12,w:1});setEditSections(ns)};

  const saveEditedItem=()=>{
    const item=items[editIdx];
    const suffix=String(Math.floor(Math.random()*900+100));
    const newCode=`${item.code}-M${suffix}`;
    const newName=`${item.variantBn.replace(/ \(কাস্টম.*\)/,"")} (কাস্টম-${suffix})`;
    // Save new variant to DB
    if(item.catKey&&db[item.catKey]){
      const vKey=`${item.varKey||item.catKey}_mod_${suffix}`;
      const nd=JSON.parse(JSON.stringify(db));
      nd[item.catKey].variants[vKey]={bn:newName,code:newCode,sections:editSections};
      saveDb(nd);
    }
    const newItems=[...items];
    newItems[editIdx]={...item,sections:editSections,code:newCode,variantBn:newName};
    onUpdateOrder({...order,items:newItems});
    setEditIdx(null);setEditSections(null);
  };

  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#92400e"}}><PrintBtn onPrint={()=>onPrint("s4")}/></div>
    <Hdr title="কার্পেন্টারের কপি" sub="Carpenter Copy" no={no} bg="#92400e"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#fef3c7",borderRadius:7,padding:"8px",marginBottom:10}}><IR l="গ্রাহক" v={cust.name}/><IR l="ডেলিভারি" v={cust.delivery}/></div>
      {images.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:9,color:"#92400e",fontWeight:700,marginBottom:5,textAlign:"center"}}>গ্রাহকের রেফারেন্স ছবি — এই অনুযায়ী তৈরি করুন</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center"}}><img src={img.src} className="ref-img" alt="ref" style={{maxHeight:120}}/><div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div><FullImgBtn fileName={img.fileName}/></div>)}
        </div>
      </div>}
      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #92400e",borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{background:"#92400e",color:"white",padding:"7px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:11}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:9,opacity:.9,marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty}</div></div>
          {editIdx!==i&&<button className="no-print" onClick={()=>startEdit(i)} style={{background:"white",color:"#92400e",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,fontWeight:700}}>✏️ এডিট</button>}
        </div>
        <div style={{padding:"8px 11px"}}>
          {it.notes&&<div style={{background:"#fef9c3",borderRadius:5,padding:"5px 8px",marginBottom:6,fontSize:9,fontWeight:600}}>⚠ {it.notes}</div>}
          {editIdx===i?<>

/* ── SIMPLE BAR CHART (SVG) ── */
function BarChart({data,height=140,color=RED,formatY}){
  const max=Math.max(...data.map(d=>d.value),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const barH=(d.value/max)*(height-24);
        return<g key={i}>
          <rect x={i*w+w*0.15} y={height-24-barH} width={w*0.7} height={barH} fill={d.color||color} rx="1"/>
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:2}}>
      {data.map((d,i)=><div key={i} style={{fontSize:10,fontWeight:700,color:d.color||color,textAlign:"center",flex:1}}>{formatY?formatY(d.value):d.value}</div>)}
    </div>
  </div>
}

}

function ProgressBar({pct}){
  // 0-50 red, 50-99 yellow (gradient), 100 green
  let color;
  if(pct>=100)color="#16a34a";
  else if(pct>=50){
    // interpolate yellow(#f59e0b) -> green(#16a34a) as pct goes 50->99
    const t=(pct-50)/50;
    const r1=245,g1=158,b1=11, r2=22,g2=163,b2=74;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }else{
    // interpolate red(#dc2626) -> yellow(#f59e0b) as pct goes 0->50
    const t=pct/50;
    const r1=220,g1=38,b1=38, r2=245,g2=158,b2=11;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }
  return<div style={{width:"100%"}}>
    <div style={{width:"100%",height:14,background:"#f0f0f0",borderRadius:7,overflow:"hidden",position:"relative"}}>
      <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:color,borderRadius:7,transition:"width .3s"}}></div>
    </div>
    <div style={{fontSize:10,fontWeight:700,color,marginTop:2,textAlign:"right"}}>{pct>=100?"✅ রেডি টু ডেলিভার":`${pct}% সম্পন্ন`}</div>
  </div>
}
function PieChart3D({data,size=180,showCount=false,countSuffix=""}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>কোনো ডেটা নেই</div>;
  const radius=size/2-8;
  const cx=size/2,cy=size/2-6;
  const depth=12; // 3D thickness
  let cumAngle=0;
  const toXY=(ang,r,yOff=0)=>{const rad=(ang-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+yOff+r*Math.sin(rad)*0.55]}; // squash Y for ellipse/3D look
  const slices=data.map((d,idx)=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const[x1,y1]=toXY(startAngle,radius);
    const[x2,y2]=toXY(endAngle,radius);
    const largeArc=angle>180?1:0;
    const topPath=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    // side "wall" path for depth (only meaningful for bottom-facing slices, approximate for all for visual consistency)
    const[x1b,y1b]=toXY(startAngle,radius,depth);
    const[x2b,y2b]=toXY(endAngle,radius,depth);
    const sidePath=`M ${x1} ${y1} L ${x1b} ${y1b} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2b} ${y2b} L ${x2} ${y2} A ${radius} ${radius*0.55} 0 ${largeArc} 0 ${x1} ${y1} Z`;
    const midAngle=(startAngle+endAngle)/2;
    return{...d,topPath,sidePath,midAngle,pct:Math.round((d.value/total)*100),idx};
  });
  const shadeColor=(hex,amt)=>{
    // darken a hex color by amt (0-1)
    const c=hex.replace("#","");
    const num=parseInt(c,16);
    let r=(num>>16)-Math.round(255*amt), g=((num>>8)&0xff)-Math.round(255*amt), b=(num&0xff)-Math.round(255*amt);
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return`rgb(${r},${g},${b})`;
  };
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size+depth+10} viewBox={`0 0 ${size} ${size+depth+10}`}>
      <ellipse cx={cx} cy={cy+radius*0.55+depth+2} rx={radius+2} ry={(radius*0.55)+2} fill="rgba(0,0,0,0.12)"/>
      {slices.map((s,i)=><path key={"side"+i} d={s.sidePath} fill={shadeColor(s.color,0.35)}/>)}
      {slices.map((s,i)=><path key={"top"+i} d={s.topPath} fill={s.color} stroke="white" strokeWidth="1.5" style={{filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.15))"}}/>)}
    </svg>
    <div style={{flex:1,minWidth:130}}>
      {slices.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:11}}>
        <div style={{width:11,height:11,background:`linear-gradient(135deg, ${s.color}, ${shadeColor(s.color,0.3)})`,borderRadius:3,flexShrink:0,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}></div>
        <span style={{color:"#444",flex:1}}>{s.label}</span>
        <span style={{fontWeight:700,color:"#222"}}>{s.pct}%{showCount?` (${s.value}${countSuffix})`:""}</span>
      </div>)}
    </div>
  </div>
}

function FirebaseSetup({onSaved}){
  const[text,setText]=useState("");
  const[error,setError]=useState("");
  const save=()=>{
    try{
      let cleaned=text.trim();
      // Extract just the object literal if user pasted the full "const firebaseConfig = {...};" line
      const match=cleaned.match(/\{[\s\S]*\}/);
      if(match)cleaned=match[0];
      const config=new Function("return "+cleaned)();
      if(!config.apiKey||!config.projectId){setError("এই কনফিগে apiKey বা projectId পাওয়া যায়নি। সঠিক কোড পেস্ট করেছেন কিনা দেখুন।");return}
      localStorage.setItem("rf_firebase_config",JSON.stringify(config));
      onSaved(config);

      setError("কোডটি পড়া যায়নি। Firebase কনসোল থেকে সরাসরি কপি করা কনফিগ অবজেক্টটি পেস্ট করুন।");

      </div>
      <div style={{background:"#f5f3ff",borderRadius:10,padding:"12px 14px",marginBottom:14,fontSize:11.5,color:"#4c1d95",lineHeight:1.7}}>
        <strong>ধাপগুলো:</strong><br/>
        ১. <a href="https://console.firebase.google.com" target="_blank" style={{color:"#6d28d9",fontWeight:700}}>console.firebase.google.com</a> এ যান, নতুন প্রজেক্ট তৈরি করুন (ফ্রি)<br/>
        ২. বাম মেনু থেকে Build → Firestore Database → Create Database → Start in <strong>test mode</strong><br/>
        ৩. ⚙ Project settings → General → "Your apps" এ Web (&lt;/&gt;) আইকনে ক্লিক করে একটা app যোগ করুন<br/>
        ৪. যেই <code>firebaseConfig = {"{"}...{"}"}</code> কোড দেখাবে, পুরোটা কপি করে নিচে পেস্ট করুন
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} rows={6} placeholder={`const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};`} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:9,padding:10,fontSize:12,fontFamily:"monospace",outline:"none",marginBottom:10,resize:"vertical"}}/>
      {error&&<div style={{background:"#fef2f2",color:"#991b1b",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:10}}>⚠️ {error}</div>}
      <button onClick={save} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:14,fontSize:14,fontWeight:700}}>সংযোগ করুন ও শুরু করুন</button>
      <div style={{fontSize:10,color:"#999",marginTop:10,textAlign:"center"}}>এই একই কোড ফোনে এই ফাইল খোলার সময়ও একবার পেস্ট করতে হবে — তারপর থেকে দুই ডিভাইসেই ডেটা নিজে থেকে সিঙ্ক হবে।</div>
    </div>
  </div>
}

/* ── ROOT (decides setup vs app) ── */
function Root(){
  const[config,setConfig]=useState(undefined); // undefined = checking, null = not set, object = ready
  useEffect(()=>{
    const saved=S.get("rf_firebase_config");
    setConfig(saved||null);
  },[]);
  if(config===undefined)return<div style={{padding:40,textAlign:"center"}}>লোড হচ্ছে...</div>;
  if(config===null)return<FirebaseSetup onSaved={(c)=>setConfig(c)}/>;
  return<App firebaseConfig={config} onResetConfig={()=>{localStorage.removeItem("rf_firebase_config");setConfig(null)}}/>;
}

/* ── APP (Firestore-backed, syncs automatically across devices) ── */
function App({firebaseConfig,onResetConfig}){
  const[page,setPage]=useState("home");
  const[orders,setOrders]=useState([]);
  const[expenses,setExpenses]=useState([]);
  const[woodLots,setWoodLots]=useState([]);
  const[db,setDb]=useState(null);
  const[carpenters,setCarpenters]=useState([]);
  const[draft,setDraft]=useState(null);
  const[viewed,setViewed]=useState(null);
  const[slip,setSlip]=useState(0);
  const[online,setOnline]=useState(navigator.onLine);
  const[connError,setConnError]=useState(null);
  const[timedOut,setTimedOut]=useState(false);
  const[retryKey,setRetryKey]=useState(0);
  const[folderStatus,setFolderStatus]=useState({supported:FS_SUPPORTED,connected:false,name:""});
  const fsRef=useRef(null);

  useEffect(()=>{
    const goOnline=()=>setOnline(true),goOffline=()=>setOnline(false);
    window.addEventListener("online",goOnline);window.addEventListener("offline",goOffline);
    return()=>{window.removeEventListener("online",goOnline);window.removeEventListener("offline",goOffline)};
  },[]);

  useEffect(()=>{
    if(!FS_SUPPORTED)return;
    (async()=>{
      try{
        const handle=await idbGet("imageFolder");
        if(handle){
          const perm=await handle.queryPermission({mode:"readwrite"});
          setFolderStatus({supported:true,connected:perm==="granted",name:handle.name});
        }
      }catch(e){}
    })();
  },[]);
  const connectFolder=async()=>{
    const handle=await pickImageFolder();
    if(handle)setFolderStatus({supported:true,connected:true,name:handle.name});
    else alert("ফোল্ডার নির্বাচন করা যায়নি বা বাতিল করা হয়েছে।");
  };

  useEffect(()=>{
    setTimedOut(false);
    const timer=setTimeout(()=>setTimedOut(true),8000);
    try{
      if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
      const firestore=firebase.firestore();
      try{firestore.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
      fsRef.current=firestore;

      const unsubOrders=firestore.collection("orders").onSnapshot(snap=>{
        clearTimeout(timer);setTimedOut(false);
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.cust?.date||0)-new Date(a.at||a.cust?.date||0));
        setOrders(list);
      },err=>{clearTimeout(timer);setConnError(err.message)});

      const unsubExpenses=firestore.collection("expenses").onSnapshot(snap=>{
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.date||0)-new Date(a.at||a.date||0));
        setExpenses(list);
      },err=>setConnError(err.message));

      const unsubLots=firestore.collection("woodlots").onSnapshot(snap=>{
        const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
        setWoodLots(list);
      },err=>setConnError(err.message));

      const unsubDb=firestore.doc("meta/db").onSnapshot(snap=>{
        clearTimeout(timer);setTimedOut(false);
        if(snap.exists()){setDb(snap.data())}
        else{const seed=JSON.parse(JSON.stringify(DEFAULT_DB));firestore.doc("meta/db").set(seed).catch(()=>{});setDb(seed)}
      },err=>{clearTimeout(timer);setConnError(err.message)});

      const unsubCarp=firestore.doc("meta/carpenters").onSnapshot(snap=>{
        setCarpenters(snap.exists()?(snap.data().list||[]):[]);
      },err=>setConnError(err.message));

      // One-time silent migration of any pre-existing local data into the cloud
      (async()=>{
        if(localStorage.getItem("rf_migrated_to_cloud"))return;
        try{
          const existing=await firestore.collection("orders").limit(1).get();
          if(existing.empty){
            const localOrders=S.get("rf_orders_v5")||[];
            const localDb=S.get("rf_db_v5");
            const localExpenses=S.get("rf_expenses_v1")||[];
            const localWoodLots=S.get("rf_woodlots_v1")||[];
            const localCarpenters=S.get("rf_carpenters_v1")||[];
            const jobs=[];
            localOrders.forEach(o=>jobs.push(firestore.collection("orders").doc(o.no).set(o)));
            localWoodLots.forEach(l=>jobs.push(firestore.collection("woodlots").doc(l.id).set(l)));
            localExpenses.forEach((e,i)=>{const id=e.id||("exp_migrated_"+i);jobs.push(firestore.collection("expenses").doc(id).set({...e,id}))});
            if(localDb)jobs.push(firestore.doc("meta/db").set(localDb));
            if(localCarpenters.length)jobs.push(firestore.doc("meta/carpenters").set({list:localCarpenters}));
            if(jobs.length)await Promise.all(jobs);
          }
        }catch(e){/* ignore migration errors silently */}
        localStorage.setItem("rf_migrated_to_cloud","true");
      })();

      return()=>{clearTimeout(timer);unsubOrders();unsubExpenses();unsubLots();unsubDb();unsubCarp()};
    }catch(e){
      clearTimeout(timer);
      setConnError(e.message);
    }
  },[firebaseConfig,retryKey]);

  const saveDb=(newDb)=>{
    setDb(newDb);
    if(fsRef.current)fsRef.current.doc("meta/db").set(newDb).catch(err=>alert("⚠️ ক্লাউডে সেভ করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveOrder=(o)=>{
    setDraft(o);setSlip(0);setPage("preview");
    if(fsRef.current)fsRef.current.collection("orders").doc(o.no).set(o).catch(err=>alert("⚠️ অর্ডার সিঙ্ক করতে সমস্যা হয়েছে: "+err.message+" — ইন্টারনেট সংযোগ ফিরে আসলে এটি নিজে থেকেই সিঙ্ক হবে।"));
  };
  const updateOrder=(updated)=>{
    setViewed(updated);if(draft&&draft.no===updated.no)setDraft(updated);
    if(fsRef.current)fsRef.current.collection("orders").doc(updated.no).set(updated).catch(err=>alert("⚠️ পরিবর্তন সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveExpense=(exp)=>{
    const id=exp.id||("exp_"+Date.now());
    const withId={...exp,id};
    if(fsRef.current)fsRef.current.collection("expenses").doc(id).set(withId).catch(err=>alert("⚠️ খরচ সিঙ্ক করতে সমস্যা হয়েছে: "+err.message));
  };
  const saveCarpenters=(list)=>{
    setCarpenters(list);
    if(fsRef.current)fsRef.current.doc("meta/carpenters").set({list}).catch(()=>{});
  };
  const saveWoodLots=(newList)=>{
    setWoodLots(newList);
    if(!fsRef.current)return;
    const newIds=new Set(newList.map(l=>l.id));
    newList.forEach(lot=>fsRef.current.collection("woodlots").doc(lot.id).set(lot).catch(err=>alert("⚠️ কাঠের স্টক সিঙ্ক করতে সমস্যা হয়েছে: "+err.message)));
    woodLots.forEach(lot=>{if(!newIds.has(lot.id))fsRef.current.collection("woodlots").doc(lot.id).delete().catch(()=>{})});
  };

  if(!db){
    if(connError)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:RED,marginBottom:10}}>⚠️ সংযোগ সমস্যা</div>
      <div style={{background:"#fef2f2",borderRadius:9,padding:"12px 14px",fontSize:13,color:"#991b1b",marginBottom:16,fontFamily:"monospace",wordBreak:"break-word"}}>{connError}</div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:RED,color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:RED,border:`1.5px solid ${RED}`,borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    if(timedOut)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:"#92400e",marginBottom:10}}>⏳ অনেকক্ষণ ধরে সিঙ্ক হচ্ছে...</div>
      <div style={{fontSize:13,color:"#555",marginBottom:14,textAlign:"left",lineHeight:1.7}}>
        সম্ভাব্য কারণ:<br/>
        ১. ইন্টারনেট সংযোগ দুর্বল বা বন্ধ<br/>
        ২. ব্রাউজারের কোনো "Shield"/"Ad-block" এক্সটেনশন (Brave Shields, uBlock ইত্যাদি) গুগলের সার্ভারে সংযোগ ব্লক করছে — এটা বন্ধ করে আবার চেষ্টা করুন<br/>
        ৩. Firebase কনফিগ কোডে ভুল আছে (ভুল প্রজেক্টের কোড পেস্ট হয়েছে)<br/>
        ৪. ফোনের ডেটা/ওয়াইফাই গুগল সার্ভিস ব্লক করছে এমন নেটওয়ার্ক (কিছু অফিস/স্কুল ওয়াইফাই এমন হয়)
      </div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:"#92400e",color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:"#92400e",border:"1.5px solid #92400e",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    return<div style={{padding:40,textAlign:"center"}}><div style={{fontSize:9,color:"#ccc",marginBottom:10}}>{BUILD_TAG}</div>সিঙ্ক হচ্ছে...</div>;
  }
  if(page==="preview")return<Preview order={viewed||draft} onBack={()=>{setViewed(null);setPage(viewed?"history":"home")}} slip={slip} setSlip={setSlip} onUpdate={updateOrder} db={db} saveDb={saveDb} carpenters={carpenters} saveCarpenters={saveCarpenters}/>;
  if(page==="form")return<Form onSave={saveOrder} onBack={()=>setPage("home")} db={db} saveDb={saveDb}/>;
  if(page==="history")return<Hist orders={orders} onBack={()=>setPage("home")} onView={o=>{setViewed(o);setSlip(0);setPage("preview")}}/>;
  if(page==="manage")return<ManageDB db={db} saveDb={saveDb} onBack={()=>setPage("home")}/>;
  if(page==="woodstock")return<WoodStockPage woodLots={woodLots} saveWoodLots={saveWoodLots} onBack={()=>setPage("home")}/>;
  if(page==="expense")return<ExpensePage expenses={expenses} onSave={saveExpense} onBack={()=>setPage("home")}/>;
  return<Home orders={orders} expenses={expenses} woodLots={woodLots} db={db} onNew={()=>setPage("form")} onHist={()=>setPage("history")} onManage={()=>setPage("manage")} onExpense={()=>setPage("expense")} onWoodStock={()=>setPage("woodstock")} onView={o=>{setViewed(o);setSlip(0);setPage("preview")}} online={online} connError={connError} onResetConfig={onResetConfig} folderStatus={folderStatus} connectFolder={connectFolder}/>;
}

/* ── HOME / DASHBOARD ── */
function Home({orders,expenses,woodLots,db,onNew,onHist,onManage,onExpense,onWoodStock,onView,online,connError,onResetConfig,folderStatus,connectFolder}){
  const now=new Date();
  const stats=useMemo(()=>{
    // Running orders (not fully paid = not delivered typically, but we track by payment completion as proxy + delivery date)
    const running=orders.filter(o=>{
      if(o.cancelled)return false;
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const full=parseFloat(o.cust.total)>0&&paid>=parseFloat(o.cust.total);
      return !full || !o.delivered;
    });
    const withDays=running.map(o=>{
      const daysLeft=o.cust.delivery?daysBetween(todayStr(),o.cust.delivery):999;
      const doneDepts=DEPTS.reduce((s,d)=>s+((o.deptProgress&&o.deptProgress[d.id]&&o.deptProgress[d.id].pct)||0),0);
      const pct=Math.round(doneDepts/DEPTS.length);
      const allWorkers=[...new Set(DEPTS.flatMap(d=>(o.deptProgress&&o.deptProgress[d.id]&&o.deptProgress[d.id].workers)||[]))];
      return{...o,daysLeft,pct,allWorkers};
    }).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Exclude cancelled orders from all financial/analytical stats
    const activeOrders=orders.filter(o=>!o.cancelled);

    // Last 6 months order count & revenue
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    const monthlyOrders=months.map(({y,m})=>{
      const count=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const revenue=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
      return{label:monthName(m),count,revenue,y,m};
    });
    const monthlyExpense=months.map(({y,m})=>{
      const total=expenses.filter(e=>{const ed=new Date(e.date);return ed.getFullYear()===y&&ed.getMonth()===m}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      return{label:monthName(m),value:total};
    });
    // Year over year - same months last year vs this year
    const yoy=months.map(({y,m})=>{
      const thisY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const lastY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-1&&od.getMonth()===m}).length;
      return{label:monthName(m),a:lastY,b:thisY};
    });
    const totalRevenue=activeOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const totalExpense=expenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);

    // Category breakdown of running orders (pie chart) - use actual DB category names
    const PIE_COLORS=[RED,"#1d4ed8","#6d28d9","#0f766e","#f97316","#eab308","#64748b","#db2777"];
    const catCount={};
    running.forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      const key=it.catKey||catLabel;
      catCount[key]=catCount[key]||{label:catLabel,value:0};
      catCount[key].value+=1;
    }));
    const catPie=Object.values(catCount).sort((a,b)=>b.value-a.value).slice(0,8).map((c,i)=>({...c,color:PIE_COLORS[i%PIE_COLORS.length]}));

    // This month stats
    const thisMonthOrders=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===now.getFullYear()&&od.getMonth()===now.getMonth()});
    const avgOrderValue=activeOrders.length?Math.round(totalRevenue/activeOrders.length):0;
    const totalOutstanding=activeOrders.reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      const rem=(parseFloat(o.cust.total)||0)-paid;
      return s+(rem>0?rem:0);
    },0);
    const oneYearAgo=new Date(now);oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const catAllCount={};
    activeOrders.filter(o=>new Date(o.cust.date)>=oneYearAgo).forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      catAllCount[catLabel]=(catAllCount[catLabel]||0)+1;
    }));
    const topCategoryRanked=Object.entries(catAllCount).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count}));

    // Yearly order count & revenue (all years present in data)
    const yearsSet=new Set(activeOrders.map(o=>new Date(o.cust.date).getFullYear()));
    yearsSet.add(now.getFullYear());
    const years=[...yearsSet].sort();
    const yearly=years.map(y=>{
      const yOrders=activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y);
      return{label:String(y),count:yOrders.length,revenue:yOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0)};
    });

    // Best month ever (by order count) vs same month this year
    const monthlyAgg={}; // key "y-m" -> {count, revenue}
    activeOrders.forEach(o=>{
      const od=new Date(o.cust.date);
      const key=`${od.getFullYear()}-${od.getMonth()}`;
      monthlyAgg[key]=monthlyAgg[key]||{count:0,revenue:0,y:od.getFullYear(),m:od.getMonth()};
      monthlyAgg[key].count+=1;
      monthlyAgg[key].revenue+=(parseFloat(o.cust.total)||0);
    });
    const monthlyList=Object.values(monthlyAgg);
    let bestMonth=null;
    if(monthlyList.length>0)bestMonth=monthlyList.reduce((a,b)=>b.count>a.count?b:a);
    let bestMonthCompare=null;
    if(bestMonth){
      const thisYearSameMonth=monthlyAgg[`${now.getFullYear()}-${bestMonth.m}`]||{count:0,revenue:0};
      bestMonthCompare={
        monthLabel:monthName(bestMonth.m),
        bestYear:bestMonth.y,
        bestCount:bestMonth.count,
        bestRevenue:bestMonth.revenue,
        thisYear:now.getFullYear(),
        thisCount:thisYearSameMonth.count,
        thisRevenue:thisYearSameMonth.revenue
      };
    }

    // Wood stock pie (uncut/available logs by wood type)
    const WOOD_COLORS={S:"#92400e",M:"#b45309",A:"#65a30d",K:"#0891b2",E:"#7c3aed"};
    const stockByType={};
    (woodLots||[]).forEach(lot=>{
      const availCft=(lot.logs||[]).filter(l=>!l.cut).reduce((s,l)=>s+l.cft,0);
      if(availCft<=0)return;
      stockByType[lot.woodType]=(stockByType[lot.woodType]||0)+availCft;
    });
    const stockPie=Object.entries(stockByType).map(([wt,val])=>({label:WOOD[wt].bn,value:val,color:WOOD_COLORS[wt]||"#888"}));

    // Expense category pie (last 1 year)
    const expByCat={};
    expenses.filter(e=>new Date(e.date)>=oneYearAgo).forEach(e=>{
      const cat=EXP_CATS.find(c=>c.id===e.category);
      const label=cat?cat.bn:e.category;
      expByCat[label]=(expByCat[label]||0)+(parseFloat(e.total)||0);
    });
    const EXP_PIE_COLORS=["#0f766e","#1d4ed8","#f97316","#6d28d9","#db2777","#64748b","#eab308","#16a34a"];
    const expensePie=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([label,value],i)=>({label,value,color:EXP_PIE_COLORS[i%EXP_PIE_COLORS.length]}));

    return{running:withDays,monthlyOrders,monthlyExpense,yoy,totalRevenue,totalExpense,catPie,thisMonthCount:thisMonthOrders.length,avgOrderValue,totalOutstanding,topCategoryRanked,yearly,bestMonthCompare,stockPie,expensePie};
  },[orders,expenses,db,woodLots]);

  return<div style={{minHeight:"100vh",background:`linear-gradient(150deg,${RED} 0%,#8B0020 100%)`}}>
    <div style={{padding:"24px 18px 18px",textAlign:"center",color:"white"}}>
      <div style={{width:52,height:52,background:"white",borderRadius:13,display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:8,boxShadow:"0 4px 18px rgba(0,0,0,.3)"}}><span style={{color:RED,fontSize:26,fontWeight:800,fontFamily:"Georgia,serif"}}>R</span></div>
      <div style={{fontSize:20,fontWeight:800}}>রূপালী ফার্নিচার</div>
      <div style={{fontSize:10,opacity:.8,marginTop:2}}>Rupali Furniture · Sirajganj | সাদমান সাকিব</div>
    </div>
    <div style={{background:"white",borderRadius:"20px 20px 0 0",minHeight:"calc(100vh - 160px)",padding:"18px 14px",maxWidth:720,margin:"0 auto"}}>
      {/* Action buttons */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
        <button onClick={onNew} style={{background:RED,color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ নতুন অর্ডার</button>
        <button onClick={onExpense} style={{background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"13px 8px",fontSize:13,fontWeight:700}}>+ খরচ যোগ করুন</button>
        <button onClick={onHist} style={{background:"white",color:RED,border:`2px solid ${RED}`,borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>অর্ডার ইতিহাস</button>
        <button onClick={onManage} style={{background:"white",color:"#6d28d9",border:"2px solid #6d28d9",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700}}>⚙ ডেটাবেস</button>
        <button onClick={onWoodStock} style={{background:"white",color:"#065f46",border:"2px solid #065f46",borderRadius:11,padding:"11px 8px",fontSize:12,fontWeight:700,gridColumn:"span 2"}}>🪵 কাঠের স্টক ব্যবস্থাপনা</button>
      </div>

      {/* Quick Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        {[{l:"মোট অর্ডার",v:orders.length,c:RED},{l:"চলমান অর্ডার",v:stats.running.length,c:"#f97316"},{l:"মোট মূল্য",v:money(stats.totalRevenue),c:"#166534",small:true}].map(s=><div key={s.l} style={{background:s.c+"12",borderRadius:10,padding:"10px 6px",borderLeft:`3px solid ${s.c}`,textAlign:"center"}}><div style={{fontSize:s.small?14:22,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#666",marginTop:1}}>{s.l}</div></div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[{l:"এই মাসে অর্ডার",v:stats.thisMonthCount,c:"#1d4ed8"},{l:"গড় অর্ডার মূল্য",v:money(stats.avgOrderValue),c:"#6d28d9",small:true},{l:"মোট বকেয়া",v:money(stats.totalOutstanding),c:RED,small:true}].map(s=><div key={s.l} style={{background:s.c+"12",borderRadius:10,padding:"10px 6px",borderLeft:`3px solid ${s.c}`,textAlign:"center"}}><div style={{fontSize:s.small?14:22,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#666",marginTop:1}}>{s.l}</div></div>)}
      </div>
      {stats.topCategoryRanked&&stats.topCategoryRanked.length>0&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px",marginBottom:18}}>
        <div style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:8}}>🏆 জনপ্রিয় ফার্নিচার (গত ১ বছর)</div>
        {stats.topCategoryRanked.slice(0,6).map((c,i)=><div key={c.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:i<stats.topCategoryRanked.length-1?6:0}}>
          <div style={{width:20,height:20,borderRadius:"50%",background:i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#b45309":"#e5e7eb",color:i<3?"white":"#666",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0}}>{i+1}</div>
          <span style={{flex:1,fontSize:12,color:"#333",fontWeight:600}}>{c.label}</span>
          <span style={{fontSize:11,color:"#92400e",fontWeight:700}}>{c.count} অর্ডার</span>
        </div>)}
      </div>}

      {/* Pie chart - running orders by category */}
      {stats.catPie.length>0&&<div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>🥧 চলমান অর্ডার — ক্যাটাগরি অনুযায়ী</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"14px"}}>
          <PieChart3D data={stats.catPie} showCount={true} countSuffix="টি"/>

      </div>}

      {/* Pie chart - wood stock by type */}
      {stats.stockPie&&stats.stockPie.length>0&&<div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>🪵 কাঠের মজুদ — ধরন অনুযায়ী</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"14px"}}>
          <PieChart3D data={stats.stockPie} showCount={true} countSuffix=" CFT"/>

      {/* Pie chart - expense by category */}
      {stats.expensePie&&stats.expensePie.length>0&&<div style={{marginBottom:18}}>

      {/* Running Orders Ranked Table */}
      <div style={{marginBottom:18}}>

        {stats.running.length===0?<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:16,background:"#fafafa",borderRadius:9}}>কোনো চলমান অর্ডার নেই</div>:

          {stats.running.slice(0,8).map((o,i)=>{

              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:urgent?RED:warn?"#f97316":"#94a3b8",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#222",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.cust.name} — {o.no}</div>
                  <div style={{fontSize:10,color:"#888"}}>{o.items.map(it=>it.variantBn).join(", ").slice(0,40)}</div>
                  {o.allWorkers&&o.allWorkers.length>0&&<div style={{fontSize:10,color:"#6d28d9",fontWeight:600,marginTop:2}}>👷 {o.allWorkers.join(", ")}</div>}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:11,fontWeight:800,color:urgent?RED:warn?"#f97316":"#555"}}>{o.daysLeft<0?`${-o.daysLeft} দিন লেট`:o.daysLeft===999?"তারিখ নেই":`${o.daysLeft} দিন বাকি`}</div>
                </div>
              </div>
              <ProgressBar pct={o.pct}/>
            </div>
          })}
        </div>}
      </div>

      {/* Monthly Orders Chart */}
      <div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📊 গত ৬ মাসের অর্ডার সংখ্যা</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <BarChart data={stats.monthlyOrders.map(m=>({label:m.label,value:m.count,color:RED}))} formatY={v=>v}/>
        </div>
      </div>

      {/* Revenue vs Expense */}
      <div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>💰 আয় বনাম খরচ (৬ মাস)</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <DualBarChart data={stats.monthlyOrders.map((m,i)=>({label:m.label,a:stats.monthlyExpense[i]?.value||0,b:m.revenue}))}/>
          <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:2,fontSize:9,color:"#888"}}>
            <span>ধূসর = খরচ</span><span>লাল = আয়</span>
          </div>
        </div>
      </div>

      {/* Year over Year */}
      <div style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📈 বছর অনুযায়ী তুলনা (একই মাস)</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
          <DualBarChart data={stats.yoy}/>
        </div>
      </div>

      {/* Yearly totals */}
      {stats.yearly&&stats.yearly.length>1&&<>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📅 বাৎসরিক মোট অর্ডার সংখ্যা</div>
          <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
            <BarChart data={stats.yearly.map(y=>({label:y.label,value:y.count,color:"#1d4ed8"}))} formatY={v=>v}/>
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>📅 বাৎসরিক মোট মূল্য</div>
          <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 8px"}}>
            <BarChart data={stats.yearly.map(y=>({label:y.label,value:y.revenue,color:"#166534"}))} formatY={v=>money(v)}/>
          </div>
        </div>
      </>}

      {/* Best month comparison */}
      {stats.bestMonthCompare&&stats.bestMonthCompare.bestCount>0&&<div style={{marginBottom:18}}>
        <div style={{fontWeight:700,fontSize:13,color:"#222",marginBottom:8}}>🏅 সর্বোচ্চ অর্ডারের মাস — বনাম এই বছর</div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"14px"}}>
          <div style={{fontSize:12,color:"#666",marginBottom:10,textAlign:"center"}}>
            <strong>{stats.bestMonthCompare.monthLabel}</strong> মাসে সর্বোচ্চ অর্ডার হয়েছিল <strong>{stats.bestMonthCompare.bestYear}</strong> সালে
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div style={{background:"#f8fafc",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>{stats.bestMonthCompare.bestYear} ({stats.bestMonthCompare.monthLabel})</div>
              <div style={{fontSize:20,fontWeight:800,color:"#94a3b8"}}>{stats.bestMonthCompare.bestCount} অর্ডার</div>
              <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{money(stats.bestMonthCompare.bestRevenue)}</div>
            </div>
            <div style={{background:"#fff0f0",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>{stats.bestMonthCompare.thisYear} ({stats.bestMonthCompare.monthLabel})</div>
              <div style={{fontSize:20,fontWeight:800,color:RED}}>{stats.bestMonthCompare.thisCount} অর্ডার</div>
              <div style={{fontSize:11,color:RED,marginTop:2}}>{money(stats.bestMonthCompare.thisRevenue)}</div>
            </div>
          </div>
          <DualBarChart data={[{label:stats.bestMonthCompare.monthLabel,a:stats.bestMonthCompare.bestCount,b:stats.bestMonthCompare.thisCount}]} labelA={`${stats.bestMonthCompare.bestYear} (সর্বোচ্চ)`} labelB={`${stats.bestMonthCompare.thisYear}`}/>
          <div style={{fontSize:11,fontWeight:700,color:"#444",marginTop:14,marginBottom:6,textAlign:"center"}}>মোট মূল্যের তুলনা</div>
          <DualBarChart data={[{label:stats.bestMonthCompare.monthLabel,a:stats.bestMonthCompare.bestRevenue,b:stats.bestMonthCompare.thisRevenue}]} labelA={`${stats.bestMonthCompare.bestYear} (সর্বোচ্চ)`} labelB={`${stats.bestMonthCompare.thisYear}`}/>
        </div>
      </div>}

      {/* Full-resolution image folder (desktop only) */}
      {folderStatus.supported&&<div style={{marginTop:16,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:6}}>🖥️ ফুল রেজোলিউশন ছবি ফোল্ডার (এই কম্পিউটার)</div>
        {folderStatus.connected?<div style={{fontSize:11,color:"#166534",fontWeight:600,marginBottom:6}}>✅ সংযুক্ত: {folderStatus.name}</div>:<div style={{fontSize:11,color:"#991b1b",marginBottom:6}}>⚠️ ফোল্ডার সংযুক্ত নয় — ছবি শুধু কম্প্রেসড ভার্সনে সেভ হবে</div>}
        <div style={{fontSize:10,color:"#78350f",marginBottom:8,lineHeight:1.5}}>এখানে একটা ফোল্ডার সেট করুন — অর্ডারে যেকোনো ছবি যুক্ত করলে তার আসল (ফুল রেজোলিউশন) কপি এই ফোল্ডারে সেভ হবে, যা পরে প্রিন্ট করে মিস্ত্রিকে দিতে পারবেন। এই ফোল্ডার নিয়মিত অন্য জায়গায় ব্যাকআপ রাখুন।</div>
        <button onClick={connectFolder} style={{width:"100%",background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"9px",fontSize:12,fontWeight:700}}>{folderStatus.connected?"ভিন্ন ফোল্ডার বেছে নিন":"ফোল্ডার নির্বাচন করুন"}</button>
      </div>}

      {/* Automatic sync status */}
      <div style={{marginTop:10,paddingTop:16,borderTop:"1px solid #eee",textAlign:"center"}}>
        {connError?<div style={{background:"#fef2f2",color:"#991b1b",borderRadius:9,padding:"9px 12px",fontSize:11,marginBottom:8}}>⚠️ সিঙ্ক সমস্যা: {connError}</div>:
        <div style={{display:"inline-flex",alignItems:"center",gap:6,background:online?"#f0fdf4":"#fffbeb",color:online?"#166534":"#92400e",borderRadius:20,padding:"6px 14px",fontSize:11,fontWeight:700,marginBottom:8}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:online?"#16a34a":"#f59e0b",display:"inline-block"}}></span>
          {online?"স্বয়ংক্রিয় সিঙ্ক সক্রিয় — সব ডিভাইসে আপডেট হচ্ছে":"অফলাইন — ইন্টারনেট এলে সিঙ্ক হবে"}
        </div>}
        <div><button onClick={onResetConfig} style={{background:"none",border:"none",color:"#aaa",fontSize:10,textDecoration:"underline",cursor:"pointer"}}>Firebase সংযোগ পরিবর্তন করুন</button></div>
      </div>
    </div>
  </div>
}

/* ── EXPENSE PAGE ── */
function ExpensePage({expenses,onSave,onBack}){
  const today=todayStr();
  const[form,setForm]=useState({date:today,category:"hardware",itemName:"",qty:"",unit:"cft",rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"11px 12px",fontSize:14,outline:"none"};
  const lbl=(t)=><div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:5}}>{t}</div>;

  const lastRate=useMemo(()=>{
    const matches=expenses.filter(e=>e.category===form.category&&e.itemName.trim().toLowerCase()===form.itemName.trim().toLowerCase());
    if(matches.length===0)return null;
    return matches.sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  },[expenses,form.category,form.itemName]);

  // Supplier ranking by total spend in last 1 year
  const supplierList=useMemo(()=>{
    const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const map={};
    expenses.forEach(e=>{
      if(!e.supplier)return;
      const key=e.supplier.trim();
      if(!map[key])map[key]={name:key,phone:e.supplierPhone||"",total:0,recentDate:e.date};
      if(new Date(e.date)>=oneYearAgo)map[key].total+=(parseFloat(e.total)||0);
      if(new Date(e.date)>new Date(map[key].recentDate)){map[key].recentDate=e.date;if(e.supplierPhone)map[key].phone=e.supplierPhone;}
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[expenses]);

  const onSupplierNameChange=(val)=>{
    const match=supplierList.find(s=>s.name.toLowerCase()===val.trim().toLowerCase());
    setForm({...form,supplier:val,supplierPhone:match?match.phone:form.supplierPhone});
  };

  const total=(parseFloat(form.qty)||0)*(parseFloat(form.rate)||0);

  const submit=()=>{
    if(!form.itemName||!form.qty||!form.rate)return;
    onSave({...form,total,at:new Date().toISOString()});
    setForm({date:today,category:form.category,itemName:"",qty:"",unit:form.unit,rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  };

  const recentExpenses=[...expenses].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#0f766e",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>খরচ এন্ট্রি</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:560,margin:"0 auto"}}>
      <div style={{background:"white",borderRadius:14,padding:"18px",boxShadow:"0 2px 10px rgba(0,0,0,.07)",marginBottom:18}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("তারিখ")}<input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} style={inp}/></div>
          <div>{lbl("ক্যাটাগরি")}
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={inp}>
              {EXP_CATS.map(c=><option key={c.id} value={c.id}>{c.bn}</option>)}
            </select>
          </div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পণ্য/আইটেমের নাম *")}<input value={form.itemName} onChange={e=>setForm({...form,itemName:e.target.value})} placeholder="যেমন: কাঠের স্ক্রু, লেকার স্প্রে" style={inp}/></div>
        {lastRate&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"9px 12px",marginBottom:14,fontSize:12,color:"#92400e"}}>
          📌 গত রেট: <strong>{money(lastRate.rate)}</strong>/{lastRate.unit} ({fmtDate(lastRate.date)} তারিখে, {lastRate.supplier||"সাপ্লায়ার উল্লেখ নেই"})
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>

/* ── WOOD STOCK PAGE ── */
function WoodStockPage({woodLots,saveWoodLots,onBack}){
  const today=todayStr();
  const[view,setView]=useState("list"); // list | new | detail
  const[selLotId,setSelLotId]=useState(null);
  const[newLot,setNewLot]=useState({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  const[newLog,setNewLog]=useState({lengthFt:"",diameterIn:""});
  const[newPay,setNewPay]=useState({date:today,amount:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const selLot=woodLots.find(l=>l.id===selLotId);

  const createLot=()=>{
    if(!newLot.supplier)return;
    const lot={id:"lot_"+Date.now(),...newLot,logs:[],payments:[]};
    saveWoodLots([lot,...woodLots]);
    setSelLotId(lot.id);setView("detail");
    setNewLot({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  };

  const updateLot=(updated)=>{
    saveWoodLots(woodLots.map(l=>l.id===updated.id?updated:l));
  };

  const addLog=()=>{
    const lengthFt=parseFloat(newLog.lengthFt),diameterIn=parseFloat(newLog.diameterIn);
    if(!lengthFt||!diameterIn)return;
    const cftVal=cftLog(lengthFt,diameterIn);
    const log={id:"log_"+Date.now(),lengthFt,diameterIn,cft:cftVal,cut:false,cutDate:""};
    updateLot({...selLot,logs:[...selLot.logs,log]});
    setNewLog({lengthFt:"",diameterIn:""});
  };
  const removeLog=(logId)=>{
    updateLot({...selLot,logs:selLot.logs.filter(l=>l.id!==logId)});
  };
  const toggleCut=(logId)=>{
    const logs=selLot.logs.map(l=>l.id===logId?{...l,cut:!l.cut,cutDate:!l.cut?today:""}:l);
    updateLot({...selLot,logs});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    updateLot({...selLot,payments:[...(selLot.payments||[]),newPay]});
    setNewPay({date:today,amount:""});
  };
  const deleteLot=(lotId)=>{
    if(window.confirm("এই লটটি মুছে ফেলতে চান?")){
      saveWoodLots(woodLots.filter(l=>l.id!==lotId));
      setView("list");setSelLotId(null);
    }
  };

  const lotTotalCft=(lot)=>lot.logs.reduce((s,l)=>s+l.cft,0);
  const lotTotalCost=(lot)=>lotTotalCft(lot)*(parseFloat(lot.ratePerCft)||0);
  const lotTotalPaid=(lot)=>(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const lotRemaining=(lot)=>lotTotalCost(lot)-lotTotalPaid(lot);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#065f46",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={()=>view==="list"?onBack():setView("list")} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>{view==="list"?"কাঠের স্টক":view==="new"?"নতুন লট":selLot?.supplier}</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:600,margin:"0 auto"}}>

      {view==="list"&&<>
        <button onClick={()=>setView("new")} style={{width:"100%",background:"#065f46",color:"white",border:"none",borderRadius:12,padding:"15px",fontSize:14,fontWeight:700,marginBottom:16}}>+ নতুন লট কিনুন</button>
        {woodLots.length===0?<div style={{textAlign:"center",color:"#aaa",padding:30,fontSize:13}}>এখনো কোনো লট যোগ করা হয়নি</div>:
        woodLots.map(lot=>{
          const tCft=lotTotalCft(lot),tCost=lotTotalCost(lot),paid=lotTotalPaid(lot),rem=lotRemaining(lot);
          const uncut=lot.logs.filter(l=>!l.cut).length;
          return<div key={lot.id} onClick={()=>{setSelLotId(lot.id);setView("detail")}} style={{background:"white",borderRadius:11,padding:"13px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.08)",borderLeft:`4px solid #065f46`,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{WOOD[lot.woodType].bn} — {lot.supplier}</div>
                <div style={{fontSize:11,color:"#888",marginTop:2}}>{lot.date} | {lot.logs.length} গুড়ি ({uncut} বাকি) | {tCft.toFixed(2)} CFT</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:700,color:"#065f46"}}>{money(tCost)}</div>
                <div style={{fontSize:10,color:rem>0?RED:"#16a34a",fontWeight:600}}>{rem>0?`বাকি ${money(rem)}`:"✅ পরিশোধিত"}</div>
              </div>
            </div>
          </div>
        })}
      </>}

      {view==="new"&&<div style={{background:"white",borderRadius:13,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>নতুন কাঠের লট</div>
        {lbl("কাঠের ধরন")}
        <select value={newLot.woodType} onChange={e=>setNewLot({...newLot,woodType:e.target.value})} style={{...inp,marginBottom:10}}>
          {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn} ({v.en})</option>)}
        </select>
        {lbl("ক্রয়ের তারিখ")}<input type="date" value={newLot.date} onChange={e=>setNewLot({...newLot,date:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার নাম *")}<input value={newLot.supplier} onChange={e=>setNewLot({...newLot,supplier:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ফোন")}<input value={newLot.supplierPhone} onChange={e=>setNewLot({...newLot,supplierPhone:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ঠিকানা")}<input value={newLot.supplierAddress} onChange={e=>setNewLot({...newLot,supplierAddress:e.target.value})} style={{...inp,marginBottom:14}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setView("list")} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"12px",fontSize:13}}>বাতিল</button>
          <button onClick={createLot} disabled={!newLot.supplier} style={{flex:2,background:newLot.supplier?"#065f46":"#ccc",color:"white",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:700}}>লট তৈরি করুন → গুড়ি যোগ করুন</button>
        </div>
      </div>}

      {view==="detail"&&selLot&&<>
        <div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 14px",marginBottom:8}}>
            <IR l="কাঠের ধরন" v={WOOD[selLot.woodType].bn}/><IR l="তারিখ" v={selLot.date}/>
            <IR l="বিক্রেতা" v={selLot.supplier}/><IR l="ফোন" v={selLot.supplierPhone}/>

          <button onClick={()=>deleteLot(selLot.id)} style={{background:"#fee2e2",border:"none",borderRadius:7,padding:"6px 12px",color:RED,fontSize:11,fontWeight:600,marginTop:8}}>🗑 লট মুছে ফেলুন</button>
        </div>

        {/* Logs list */}
        <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>গুড়ির তালিকা ({selLot.logs.length})</div>
        <div style={{background:"white",borderRadius:11,overflow:"hidden",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          {selLot.logs.length===0?<div style={{textAlign:"center",color:"#aaa",padding:16,fontSize:12}}>এখনো কোনো গুড়ি যোগ করা হয়নি</div>:
          selLot.logs.map((log,i)=><div key={log.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderBottom:i<selLot.logs.length-1?"1px solid #f2f2f2":"none",background:log.cut?"#fafafa":"white"}}>
            <button onClick={()=>toggleCut(log.id)} style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${log.cut?"#16a34a":"#ccc"}`,background:log.cut?"#16a34a":"white",color:"white",fontSize:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{log.cut?"✓":""}</button>
            <div style={{flex:1,color:log.cut?"#aaa":"#222",textDecoration:log.cut?"line-through":"none"}}>
              <span style={{fontWeight:700,fontSize:13}}>#{i+1}</span> — লম্বা {log.lengthFt}ft × ব্যাস {log.diameterIn}″ = <strong>{log.cft.toFixed(3)} CFT</strong>
              {log.cut&&log.cutDate&&<span style={{fontSize:10,marginLeft:6}}>(কাটা হয়েছে: {log.cutDate})</span>}

            <button onClick={()=>removeLog(log.id)} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"4px 8px",color:RED,fontSize:11}}>✕</button>

        <div style={{background:"white",borderRadius:11,padding:12,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>নতুন গুড়ি যোগ করুন</div>
