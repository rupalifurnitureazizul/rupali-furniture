// Compress an image file to a small JPEG base64 string before storing, to avoid hitting localStorage quota
function compressImage(file,maxDim=900,quality=0.72){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
        else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

function idbOpen(){
  return new Promise((resolve,reject)=>{

}
async function idbSet(key,val){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readwrite");
    tx.objectStore("handles").put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const dbi=await idbOpen();

/* â”€â”€ SLIP 3: DEPT TRACKING â”€â”€ */
function S3({order,onPrint,onUpdateOrder,carpenters,saveCarpenters}){
  const{cust,items,no,printLogs}=order;
  const dp=order.deptProgress||{};
  const[addingNameFor,setAddingNameFor]=useState(null);
  const[newName,setNewName]=useState("");

  const getDept=(id)=>dp[id]||{start:"",end:"",pct:0,workers:[]};
  const setStart=(id,val)=>{
    const cur=getDept(id);
    const newPct=val&&!cur.end?Math.max(cur.pct,20):cur.pct;
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,start:val,pct:newPct}}});
  };
  const setEnd=(id,val)=>{
    const cur=getDept(id);
    const newPct=val?100:cur.pct;
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,end:val,pct:newPct}}});
  };
  const setPct=(id,val)=>{
    const cur=getDept(id);
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,pct:parseInt(val)}}});
  };
  const toggleWorker=(id,name)=>{
    const cur=getDept(id);
    const workers=cur.workers||[];
    const newWorkers=workers.includes(name)?workers.filter(w=>w!==name):[...workers,name];
    onUpdateOrder({...order,deptProgress:{...dp,[id]:{...cur,workers:newWorkers}}});
  };
  const addNewCarpenter=(deptId)=>{
    const name=newName.trim();
    if(!name)return;
    if(!carpenters.includes(name))saveCarpenters([...carpenters,name]);
    toggleWorker(deptId,name);
    setNewName("");setAddingNameFor(null);
  };
  const overallPct=Math.round(DEPTS.reduce((s,d)=>s+getDept(d.id).pct,0)/DEPTS.length);

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#6d28d9"}}>

      <PrintBtn onPrint={()=>onPrint("s3")}/>
    </div>
    <Hdr title="à¦¬à¦¿à¦­à¦¾à¦— à¦Ÿà§à¦°à§à¦¯à¦¾à¦•à¦¿à¦‚ à¦•à¦ªà¦¿" sub="Department Tracking" no={no} bg="#6d28d9"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f5f3ff",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="à¦—à§à¦°à¦¾à¦¹à¦•" v={cust.name}/><IR l="à¦®à§‹à¦¬à¦¾à¦‡à¦²" v={cust.phone}/><IR l="à¦¡à§‡à¦²à¦¿à¦­à¦¾à¦°à¦¿" v={cust.delivery}/>
        {items.map((it,i)=><IR key={i} l={`à¦«à¦¾à¦°à§à¦¨à¦¿à¦šà¦¾à¦° ${i+1}`} v={`[${it.code}] ${it.variantBn} (${it.woodBn}) Ã— ${it.qty}`}/>)}
      </div>

      {/* Interactive (screen only) */}
      <div className="no-print">
        {DEPTS.map(d=>{
          const cur=getDept(d.id);
          const workers=cur.workers||[];
          const barColor=cur.pct>=100?"#16a34a":cur.pct>=50?"#f59e0b":"#dc2626";
          return<div key={d.id} style={{background:"white",border:"1px solid #ede9fe",borderRadius:9,padding:"10px 12px",marginBottom:8}}>
            <div style={{fontWeight:700,fontSize:12,color:"#6d28d9",marginBottom:6}}>{d.bn}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div><div style={{fontSize:9,color:"#888",marginBottom:2}}>à¦¶à§à¦°à§à¦° à¦¤à¦¾à¦°à¦¿à¦–</div><input type="date" value={cur.start} onChange={e=>setStart(d.id,e.target.value)} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 7px",fontSize:11,outline:"none"}}/></div>
              <div><div style={{fontSize:9,color:"#888",marginBottom:2}}>à¦¶à§‡à¦·à§‡à¦° à¦¤à¦¾à¦°à¦¿à¦–</div><input type="date" value={cur.end} onChange={e=>setEnd(d.id,e.target.value)} style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 7px",fontSize:11,outline:"none"}}/></div>
            </div>
            <input type="range" min="0" max="100" value={cur.pct} onChange={e=>setPct(d.id,e.target.value)} style={{width:"100%",accentColor:barColor}}/>
            <div style={{textAlign:"right",fontSize:11,fontWeight:800,color:barColor,marginBottom:8}}>{cur.pct}%{cur.pct>=100?" âœ…":""}</div>

            <div style={{fontSize:9,color:"#888",marginBottom:4}}>à¦¦à¦¾à¦¯à¦¼à¦¿à¦¤à§à¦¬à§‡ à¦¨à¦¿à¦¯à¦¼à§‹à¦œà¦¿à¦¤ à¦•à¦°à§à¦®à§€ (à¦à¦•à¦¾à¦§à¦¿à¦• à¦¨à¦¿à¦°à§à¦¬à¦¾à¦šà¦¨ à¦•à¦°à¦¾ à¦¯à¦¾à¦¯à¦¼)</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
              {carpenters.map(name=><button key={name} onClick={()=>toggleWorker(d.id,name)} style={{background:workers.includes(name)?"#6d28d9":"#f3f4f6",color:workers.includes(name)?"white":"#555",border:"none",borderRadius:20,padding:"5px 11px",fontSize:10,fontWeight:600}}>{workers.includes(name)?"âœ“ ":""}{name}</button>)}

            </div>:<button onClick={()=>setAddingNameFor(d.id)} style={{background:"white",border:"1px dashed #6d28d9",color:"#6d28d9",borderRadius:20,padding:"5px 11px",fontSize:10,fontWeight:600}}>+ à¦¨à¦¤à§à¦¨ à¦•à¦°à§à¦®à§€à¦° à¦¨à¦¾à¦®</button>}
          </div>
        })}
      </div>

      {/* Print-only static table */}
      <table className="print-only-table" style={{width:"100%",borderCollapse:"collapse",fontSize:10,display:"none"}}>
        <thead><tr style={{background:"#6d28d9",color:"white"}}>{["à¦¬à¦¿à¦­à¦¾à¦—","à¦¦à¦¾à¦¯à¦¼à¦¿à¦¤à§à¦¬à§‡","à¦¶à§à¦°à§à¦° à¦¤à¦¾à¦°à¦¿à¦–","à¦¶à§‡à¦·à§‡à¦° à¦¤à¦¾à¦°à¦¿à¦–","à¦¸à§à¦¬à¦¾à¦•à§à¦·à¦°"].map(h=><th key={h} style={{padding:"6px 5px",textAlign:"left",fontWeight:700}}>{h}</th>)}</tr></thead>

  const updatePiece=(si,pi,field,val)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces[pi][field]=field==="bn"?val:(parseFloat(val)||0);setEditSections(ns)};

}

function ProgressBar({pct}){
  // 0-50 red, 50-99 yellow (gradient), 100 green
  let color;
  if(pct>=100)color="#16a34a";
  else if(pct>=50){
    // interpolate yellow(#f59e0b) -> green(#16a34a) as pct goes 50->99
    const t=(pct-50)/50;
    const r1=245,g1=158,b1=11, r2=22,g2=163,b2=74;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }else{
    // interpolate red(#dc2626) -> yellow(#f59e0b) as pct goes 0->50
    const t=pct/50;
    const r1=220,g1=38,b1=38, r2=245,g2=158,b2=11;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }
  return<div style={{width:"100%"}}>
    <div style={{width:"100%",height:14,background:"#f0f0f0",borderRadius:7,overflow:"hidden",position:"relative"}}>
      <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:color,borderRadius:7,transition:"width .3s"}}></div>
    </div>
    <div style={{fontSize:10,fontWeight:700,color,marginTop:2,textAlign:"right"}}>{pct>=100?"âœ… à¦°à§‡à¦¡à¦¿ à¦Ÿà§ à¦¡à§‡à¦²à¦¿à¦­à¦¾à¦°":`${pct}% à¦¸à¦®à§à¦ªà¦¨à§à¦¨`}</div>
  </div>
}
function PieChart3D({data,size=180,showCount=false,countSuffix=""}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>à¦•à§‹à¦¨à§‹ à¦¡à§‡à¦Ÿà¦¾ à¦¨à§‡à¦‡</div>;
  const radius=size/2-8;
  const cx=size/2,cy=size/2-6;
  const depth=12; // 3D thickness
  let cumAngle=0;
  const toXY=(ang,r,yOff=0)=>{const rad=(ang-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+yOff+r*Math.sin(rad)*0.55]}; // squash Y for ellipse/3D look
  const slices=data.map((d,idx)=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const[x1,y1]=toXY(startAngle,radius);
    const[x2,y2]=toXY(endAngle,radius);
    const largeArc=angle>180?1:0;
    const topPath=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    // side "wall" path for depth (only meaningful for bottom-facing slices, approximate for all for visual consistency)
    const[x1b,y1b]=toXY(startAngle,radius,depth);
    const[x2b,y2b]=toXY(endAngle,radius,depth);
    const sidePath=`M ${x1} ${y1} L ${x1b} ${y1b} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2b} ${y2b} L ${x2} ${y2} A ${radius} ${radius*0.55} 0 ${largeArc} 0 ${x1} ${y1} Z`;
    const midAngle=(startAngle+endAngle)/2;
    return{...d,topPath,sidePath,midAngle,pct:Math.round((d.value/total)*100),idx};
  });
  const shadeColor=(hex,amt)=>{
    // darken a hex color by amt (0-1)
    const c=hex.replace("#","");
    const num=parseInt(c,16);
    let r=(num>>16)-Math.round(255*amt), g=((num>>8)&0xff)-Math.round(255*amt), b=(num&0xff)-Math.round(255*amt);
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return`rgb(${r},${g},${b})`;
  };
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size+depth+10} viewBox={`0 0 ${size} ${size+depth+10}`}>
      <ellipse cx={cx} cy={cy+radius*0.55+depth+2} rx={radius+2} ry={(radius*0.55)+2} fill="rgba(0,0,0,0.12)"/>
      {slices.map((s,i)=><path key={"side"+i} d={s.sidePath} fill={shadeColor(s.color,0.35)}/>)}
      {slices.map((s,i)=><path key={"top"+i} d={s.topPath} fill={s.color} stroke="white" strokeWidth="1.5" style={{filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.15))"}}/>)}
    </svg>
    <div style={{flex:1,minWidth:130}}>
      {slices.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:11}}>
        <div style={{width:11,height:11,background:`linear-gradient(135deg, ${s.color}, ${shadeColor(s.color,0.3)})`,borderRadius:3,flexShrink:0,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}></div>
        <span style={{color:"#444",flex:1}}>{s.label}</span>
        <span style={{fontWeight:700,color:"#222"}}>{s.pct}%{showCount?` (${s.value}${countSuffix})`:""}</span>
      </div>)}
    </div>
  </div>
}

      const config=new Function("return "+cleaned)();
      if(!config.apiKey||!config.projectId){setError("à¦à¦‡ à¦•à¦¨à¦«à¦¿à¦—à§‡ apiKey à¦¬à¦¾ projectId à¦ªà¦¾à¦“à¦¯à¦¼à¦¾ à¦¯à¦¾à¦¯à¦¼à¦¨à¦¿à¥¤ à¦¸à¦ à¦¿à¦• à¦•à§‹à¦¡ à¦ªà§‡à¦¸à§à¦Ÿ à¦•à¦°à§‡à¦›à§‡à¦¨ à¦•à¦¿à¦¨à¦¾ à¦¦à§‡à¦–à§à¦¨à¥¤");return}
      localStorage.setItem("rf_firebase_config",JSON.stringify(config));
      onSaved(config);

/* â”€â”€ HOME / DASHBOARD â”€â”€ */
function Home({orders,expenses,woodLots,db,onNew,onHist,onManage,onExpense,onWoodStock,onView,online,connError,onResetConfig,folderStatus,connectFolder}){
  const now=new Date();
  const stats=useMemo(()=>{
    // Running orders (not fully paid = not delivered typically, but we track by payment completion as proxy + delivery date)
    const running=orders.filter(o=>{
      if(o.cancelled)return false;
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const full=parseFloat(o.cust.total)>0&&paid>=parseFloat(o.cust.total);
      return !full || !o.delivered;
    });
    const withDays=running.map(o=>{
      const daysLeft=o.cust.delivery?daysBetween(todayStr(),o.cust.delivery):999;
      const doneDepts=DEPTS.reduce((s,d)=>s+((o.deptProgress&&o.deptProgress[d.id]&&o.deptProgress[d.id].pct)||0),0);
      const pct=Math.round(doneDepts/DEPTS.length);
      const allWorkers=[...new Set(DEPTS.flatMap(d=>(o.deptProgress&&o.deptProgress[d.id]&&o.deptProgress[d.id].workers)||[]))];
      return{...o,daysLeft,pct,allWorkers};
    }).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Exclude cancelled orders from all financial/analytical stats
    const activeOrders=orders.filter(o=>!o.cancelled);

    // Last 6 months order count & revenue
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    const monthlyOrders=months.map(({y,m})=>{

function WoodStockPage({woodLots,saveWoodLots,onBack}){
  const today=todayStr();

  const[selLotId,setSelLotId]=useState(null);
  const[newLot,setNewLot]=useState({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  const[newLog,setNewLog]=useState({lengthFt:"",diameterIn:""});
  const[newPay,setNewPay]=useState({date:today,amount:""});
  const[sellingLogId,setSellingLogId]=useState(null);
  const[sellPrice,setSellPrice]=useState("");
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const selLot=woodLots.find(l=>l.id===selLotId);

  const createLot=()=>{
    if(!newLot.supplier)return;
    const lot={id:"lot_"+Date.now(),...newLot,logs:[],payments:[]};
    saveWoodLots([lot,...woodLots]);
    setSelLotId(lot.id);setView("detail");
    setNewLot({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  };

  const updateLot=(updated)=>{
    saveWoodLots(woodLots.map(l=>l.id===updated.id?updated:l));
  };

  const addLog=()=>{
    const lengthFt=parseFloat(newLog.lengthFt),diameterIn=parseFloat(newLog.diameterIn);
    if(!lengthFt||!diameterIn)return;
    const cftVal=cftLog(lengthFt,diameterIn);
    const log={id:"log_"+Date.now(),lengthFt,diameterIn,cft:cftVal,cut:false,cutDate:"",sold:false,soldDate:"",soldPrice:0};
    updateLot({...selLot,logs:[...selLot.logs,log]});

  const removeLog=(logId,logLabel)=>{
    if(!window.confirm(`à¦†à¦ªà¦¨à¦¿ à¦•à¦¿ à¦¨à¦¿à¦¶à§à¦šà¦¿à¦¤ "${logLabel}" à¦à¦‡ à¦—à§à¦¡à¦¼à¦¿à¦Ÿà¦¿ à¦à¦•à§‡à¦¬à¦¾à¦°à§‡ à¦®à§à¦›à§‡ à¦«à§‡à¦²à¦¤à§‡ à¦šà¦¾à¦¨? à¦à¦Ÿà¦¿ à¦«à¦¿à¦°à¦¿à¦¯à¦¼à§‡ à¦†à¦¨à¦¾ à¦¯à¦¾à¦¬à§‡ à¦¨à¦¾à¥¤`))return;
    updateLot({...selLot,logs:selLot.logs.filter(l=>l.id!==logId)});
  };
  const toggleCut=(logId,logLabel,currentlyCut)=>{
    if(!currentlyCut){
      if(!window.confirm(`à¦†à¦ªà¦¨à¦¿ à¦•à¦¿ à¦¨à¦¿à¦¶à§à¦šà¦¿à¦¤ "${logLabel}" à¦à¦‡ à¦—à§à¦¡à¦¼à¦¿à¦Ÿà¦¿ à¦•à¦¾à¦Ÿà¦¾ à¦¹à¦¯à¦¼à§‡à¦›à§‡ à¦¬à¦²à§‡ à¦šà¦¿à¦¹à§à¦¨à¦¿à¦¤ à¦•à¦°à¦¤à§‡ à¦šà¦¾à¦¨?`))return;
    }
    const logs=selLot.logs.map(l=>l.id===logId?{...l,cut:!l.cut,cutDate:!l.cut?today:""}:l);
    updateLot({...selLot,logs});
  };
  const startSell=(logId)=>{setSellingLogId(logId);setSellPrice("")};
  const confirmSell=(logId)=>{
    const price=parseFloat(sellPrice);
    if(!price||price<=0)return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:true,soldDate:today,soldPrice:price}:l);
    updateLot({...selLot,logs});
    setSellingLogId(null);setSellPrice("");
  };
  const unsellLog=(logId,logLabel)=>{
    if(!window.confirm(`"${logLabel}" à¦à¦‡ à¦—à§à¦¡à¦¼à¦¿à¦° à¦¬à¦¿à¦•à§à¦°à¦¿ à¦¬à¦¾à¦¤à¦¿à¦² à¦•à¦°à¦¤à§‡ à¦šà¦¾à¦¨?`))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:false,soldDate:"",soldPrice:0}:l);
    updateLot({...selLot,logs});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    updateLot({...selLot,payments:[...(selLot.payments||[]),newPay]});
    setNewPay({date:today,amount:""});

        woodLots.map(lot=>{
          const tCft=lotTotalCft(lot),tCost=lotTotalCost(lot),paid=lotTotalPaid(lot),rem=lotRemaining(lot);

function ManageDB({db,saveDb,onBack}){

  const[newVar,setNewVar]=useState({catKey:"",key:"",bn:"",code:""});

  const[editSections,setEditSections]=useState(null);
  const[newPiece,setNewPiece]=useState({sectionIdx:0,bn:"",pc:1,h:72,l:24,w:1});

  const addCategory=()=>{
    if(!newCat.key||!newCat.bn)return;
    const nd={...db,[newCat.key]:{bn:newCat.bn,en:newCat.en||newCat.bn,variants:{}}};
    saveDb(nd);setNewCat({key:"",bn:"",en:""});setTab("list");
  };
  const addVariant=()=>{
    if(!newVar.catKey||!newVar.bn)return;
    const vKey=newVar.key||newVar.bn.replace(/\s+/g,"_").toLowerCase().slice(0,12);
    const code=newVar.code||autoCode(newVar.bn,Object.keys(db[newVar.catKey].variants).length+1);
    const nd=JSON.parse(JSON.stringify(db));
    nd[newVar.catKey].variants[vKey]={bn:newVar.bn,code,sections:[{name:"à¦•à¦¾à¦ à§‡à¦° à¦¤à¦¾à¦²à¦¿à¦•à¦¾",pieces:[]}]};
    saveDb(nd);setNewVar({catKey:"",key:"",bn:"",code:""});setTab("list");
  };
  const openEdit=(catK,varK)=>{setSelCat(catK);setSelVar(varK);setEditSections(JSON.parse(JSON.stringify(db[catK].variants[varK].sections)));setTab("edit")};
  const saveEdit=()=>{const nd=JSON.parse(JSON.stringify(db));nd[selCat].variants[selVar].sections=editSections;saveDb(nd);setTab("list")};
  const addSection=()=>setEditSections(prev=>[...prev,{name:"à¦¨à¦¤à§à¦¨ à¦¸à§‡à¦•à¦¶à¦¨",pieces:[]}]);
  const addPiece=()=>{const ns=JSON.parse(JSON.stringify(editSections));ns[newPiece.sectionIdx].pieces.push({bn:newPiece.bn,pc:parseInt(newPiece.pc)||1,h:parseFloat(newPiece.h)||72,l:parseFloat(newPiece.l)||24,w:parseFloat(newPiece.w)||1});setEditSections(ns);setNewPiece({...newPiece,bn:""})};

  const[galleryVar,setGalleryVar]=useState("");
  const galleryInput=useRef();
  const openGallery=(catK,varK)=>{setGalleryCat(catK);setGalleryVar(varK);setTab("gallery")};
  const addGalleryImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    let working=JSON.parse(JSON.stringify(db));
    for(const file of files){
      const compressed=await compressImage(file);
      if(!compressed)continue;
      const v2=working[galleryCat].variants[galleryVar];
      if(!v2.gallery)v2.gallery=[];
      v2.gallery.push(compressed);
      if(!v2.coverImage)v2.coverImage=compressed;
    }
    saveDb(working);
  };
  const removeGalleryImage=(idx)=>{
    const nd=JSON.parse(JSON.stringify(db));
    const variant=nd[galleryCat].variants[galleryVar];
    const removed=variant.gallery[idx];
    variant.gallery.splice(idx,1);
    if(variant.coverImage===removed)variant.coverImage=variant.gallery[0]||null;
    saveDb(nd);
  };
  const setCoverImage=(img)=>{
    const nd=JSON.parse(JSON.stringify(db));
    nd[galleryCat].variants[galleryVar].coverImage=img;
    saveDb(nd);
  };
  const[renamingCat,setRenamingCat]=useState(null);
  const[renameVal,setRenameVal]=useState("");
