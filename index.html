<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Bengali',sans-serif;background:#f1f1f1;min-height:100vh}
input,select,textarea,button{font-family:'Noto Sans Bengali',sans-serif}
button{cursor:pointer}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#C41E3A55;border-radius:3px}
.daywheel::-webkit-scrollbar{width:0;height:0;display:none}
/* v5.55–5.57: ড্যাশবোর্ডের বোতাম ও আইকন বার */
.hb{-webkit-tap-highlight-color:transparent;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;cursor:pointer}
.hb:active{transform:scale(.95);filter:brightness(.96)}
.hb [data-sub]::after{content:attr(data-sub)}
.hb [data-icon]::before{content:attr(data-icon)}
.zbar::-webkit-scrollbar{display:none}
.zb{-webkit-tap-highlight-color:transparent;transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .32s ease,background .25s ease,border-color .25s ease,filter .25s ease}
@media print{
  @page{size:A4 portrait;margin:10mm}
  .no-print{display:none!important}
  html,body{background:white!important;height:auto!important;min-height:0!important}
  #root{height:auto!important}
  .print-bg{background:none!important;min-height:0!important;padding:0!important}
  .print-wrap{padding:0!important;max-width:none!important;margin:0!important}
  .slip-card{box-shadow:none!important;border-radius:0!important;width:100%!important}
  .print-only-table{display:table!important}
  .print-only-block{display:block!important}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
}
.ref-img{max-width:100%;max-height:120px;object-fit:contain;border-radius:6px;border:1px solid #eee}
/* কার্পেন্টার + ট্রান্সপোর্ট এক পাতায় — ছোট স্ক্রিনে উপরে-নিচে, বড় স্ক্রিনে ও প্রিন্টে পাশাপাশি */
/* v5.30: র‍্যাকের লেবেল — সারিতে ২টা (বড়) বা ৩টা (ছোট); কোনো লেবেল দুই পাতায় ভাগ হয় না */
.rack-labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rack-labels.small{grid-template-columns:repeat(3,minmax(0,1fr))}
.rack-label{break-inside:avoid;page-break-inside:avoid}
@media print{.rack-labels{gap:5mm}}
.combo-wrap{display:flex;flex-direction:column}
.combo-half{width:100%;min-width:0}
.combo-cut{height:0;border-top:1.5px dashed #94a3b8;margin:13px 0;position:relative;flex-shrink:0}
.combo-cut span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:white;padding:0 7px;font-size:13px;line-height:1}
@media print,(min-width:660px){
  .combo-wrap{flex-direction:row;align-items:stretch}
  .combo-half{flex:1 1 0;width:auto}
  .combo-cut{height:auto;width:0;border-top:none;border-left:1.5px dashed #94a3b8;margin:0 9px}
  .combo-cut span{left:0;top:10px;transform:translateX(-50%) rotate(90deg);padding:7px 0}
}
</style>
