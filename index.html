function ProgressBar({pct}){
  // 0-50 red, 50-99 yellow (gradient), 100 green
  let color;
  if(pct>=100)color="#16a34a";
  else if(pct>=50){
    // interpolate yellow(#f59e0b) -> green(#16a34a) as pct goes 50->99
    const t=(pct-50)/50;
    const r1=245,g1=158,b1=11, r2=22,g2=163,b2=74;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }else{
    // interpolate red(#dc2626) -> yellow(#f59e0b) as pct goes 0->50
    const t=pct/50;
    const r1=220,g1=38,b1=38, r2=245,g2=158,b2=11;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }
  return<div style={{width:"100%"}}>
    <div style={{width:"100%",height:14,background:"#f0f0f0",borderRadius:7,overflow:"hidden",position:"relative"}}>
      <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:color,borderRadius:7,transition:"width .3s"}}></div>
    </div>
    <div style={{fontSize:10,fontWeight:700,color,marginTop:2,textAlign:"right"}}>{pct>=100?"✅ রেডি টু ডেলিভার":`${pct}% সম্পন্ন`}</div>
  </div>
}
function PieChart3D({data,size=180,showCount=false,countSuffix="",showMoney=false}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>কোনো ডেটা নেই</div>;
  const radius=size/2-8;
  const cx=size/2,cy=size/2-6;
  const depth=12; // 3D thickness
  let cumAngle=0;
  const toXY=(ang,r,yOff=0)=>{const rad=(ang-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+yOff+r*Math.sin(rad)*0.55]}; // squash Y for ellipse/3D look
  const slices=data.map((d,idx)=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const[x1,y1]=toXY(startAngle,radius);
    const[x2,y2]=toXY(endAngle,radius);
    const largeArc=angle>180?1:0;
    const topPath=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    // side "wall" path for depth (only meaningful for bottom-facing slices, approximate for all for visual consistency)
    const[x1b,y1b]=toXY(startAngle,radius,depth);
    const[x2b,y2b]=toXY(endAngle,radius,depth);
    const sidePath=`M ${x1} ${y1} L ${x1b} ${y1b} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2b} ${y2b} L ${x2} ${y2} A ${radius} ${radius*0.55} 0 ${largeArc} 0 ${x1} ${y1} Z`;
    const midAngle=(startAngle+endAngle)/2;
    return{...d,topPath,sidePath,midAngle,pct:Math.round((d.value/total)*100),idx};
  });
  const shadeColor=(hex,amt)=>{
    // darken a hex color by amt (0-1)
    const c=hex.replace("#","");
    const num=parseInt(c,16);
    let r=(num>>16)-Math.round(255*amt), g=((num>>8)&0xff)-Math.round(255*amt), b=(num&0xff)-Math.round(255*amt);
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return`rgb(${r},${g},${b})`;
  };
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size+depth+10} viewBox={`0 0 ${size} ${size+depth+10}`}>
      <ellipse cx={cx} cy={cy+radius*0.55+depth+2} rx={radius+2} ry={(radius*0.55)+2} fill="rgba(0,0,0,0.12)"/>
      {slices.map((s,i)=><path key={"side"+i} d={s.sidePath} fill={shadeColor(s.color,0.35)}/>)}
      {slices.map((s,i)=><path key={"top"+i} d={s.topPath} fill={s.color} stroke="white" strokeWidth="1.5" style={{filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.15))"}}/>)}
    </svg>
    <div style={{flex:1,minWidth:130}}>
      {slices.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:11}}>
        <div style={{width:11,height:11,background:`linear-gradient(135deg, ${s.color}, ${shadeColor(s.color,0.3)})`,borderRadius:3,flexShrink:0,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}></div>
        <span style={{color:"#444",flex:1}}>{s.label}</span>
        <span style={{fontWeight:700,color:"#222"}}>{s.pct}%{showCount?` (${s.value}${countSuffix})`:""}{showMoney?` (${money(s.value)})`:""}</span>
      </div>)}
    </div>
  </div>
}

const lightboxState={pending:false,closeFn:null};
function ImageLightbox(){
  const[src,setSrc]=useState(null);
  const[zoomed,setZoomed]=useState(false);
  useEffect(()=>{lightboxState.closeFn=()=>setSrc(null)},[]);
  useEffect(()=>{
    const handler=(e)=>{
      setSrc(e.detail.src);setZoomed(false);
      window.history.pushState({lightbox:true},"");
      lightboxState.pending=true;
    };
    window.addEventListener("open-lightbox",handler);
    return()=>window.removeEventListener("open-lightbox",handler);
  },[]);
  // X বাটনে/বাইরে ট্যাপে বন্ধ করলে history.back() ডেকে সেই একই যোগ-করা ধাপটা "খরচ" করে দেওয়া

  return<div className="no-print" onClick={closeViaButton} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto",WebkitOverflowScrolling:"touch"}}>

/* ── v4.45 নিরাপত্তা-জাল: কোনো পাতা দেখাতে গিয়ে অপ্রত্যাশিত ত্রুটি হলে পুরো অ্যাপ আর সাদা হয়ে
   যায় না। ত্রুটিটা এখানে ধরা পড়ে, অ্যাপ নিজে থেকেই আগের পাতায় ফিরে যায় (হোম পাতা হলে একবার
   নিজে থেকেই আবার চেষ্টা করে)। কী হয়েছিল তা ⚙️ সিস্টেম অংশে লেখা থাকে ── */
class PageErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null}}
  static getDerivedStateFromError(err){return{err}}
  componentDidCatch(err,info){
    try{this.props.onError&&this.props.onError(err,info)}catch(e){}
    if(!this.props.canGoBack&&Date.now()-(this.lastRetryAt||0)>60000){
      this.lastRetryAt=Date.now();
      setTimeout(()=>{if(this.state.err)this.setState({err:null})},2500);
    }
  }
  componentDidUpdate(prev){if(this.state.err&&prev.resetKey!==this.props.resetKey)this.setState({err:null})}
  render(){
    if(!this.state.err)return this.props.children;
    if(this.props.canGoBack)return<div style={{padding:"60px 24px",textAlign:"center",color:"#64748b",fontSize:13}}>↩︎ আগের পাতায় ফেরা হচ্ছে…</div>;
    return<div style={{padding:"40px 24px",textAlign:"center",maxWidth:420,margin:"40px auto"}}>
      <div style={{fontSize:30,marginBottom:10}}>🛟</div>
      <div style={{fontSize:14,fontWeight:700,color:"#334155",marginBottom:8}}>পাতাটা দেখাতে সমস্যা হয়েছে — কয়েক সেকেন্ডে নিজে থেকেই আবার চেষ্টা হবে</div>
      <div style={{fontSize:10,color:"#94a3b8",marginBottom:16,wordBreak:"break-word",fontFamily:"monospace"}}>{String((this.state.err&&this.state.err.message)||this.state.err).slice(0,200)}</div>
      <button onClick={()=>this.setState({err:null})} style={{background:"#6d28d9",color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>আবার চেষ্টা করুন</button>
      <button onClick={()=>window.location.reload()} style={{background:"white",color:"#6d28d9",border:"1.5px solid #6d28d9",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>রিলোড</button>
    </div>;
  }
}

    </PageErrorBoundary>

  </>;
}

/* ── APP (Firestore-backed, syncs automatically across devices) ── */
function App({firebaseConfig,onResetConfig}){

  // অনেকগুলো ট্যাব খোলা থাকলে প্রতিটা আলাদাভাবে সার্ভারের সাথে সংযোগ রাখে ও আলাদা হিসাব খায়,

      const rec={id:deviceIdRef.current,label:deviceLabel(),version:BUILD_TAG,origin:location.protocol==="file:"?"ডাউনলোড করা ফাইল":location.host+location.pathname,lastSeen:new Date().toISOString(),lastServerAt:t.lastServerAt?new Date(t.lastServerAt).toISOString():null,fresh:!!t.fresh,

              // দেখাচ্ছিল। এখন ডেটাবেস শুধু আপনার নিজের কাজেই (ক্যাটাগরি/মডেল যোগ, কাঠের মাপ
              // সম্পাদনা) লেখা হয়, আর রিয়েল-টাইম লিসেনারই সব ডিভাইস এক রাখে — যেটা তার কাজ।
              // অনুপস্থিত কিছু থাকলে শুধু জানানো হয়, নিজে থেকে লেখা হয় না ──
              // ── এখন স্বয়ংক্রিয়ভাবেই পাঠানো হয় — কোনো বাটন চাপার দরকার নেই। এটা এখন
              // নিরাপদ, কারণ: (১) এই মিলকরণ শুধু যোগ করে, কখনো কিছু মোছে না; (২) আপনি
              // ইচ্ছাকৃতভাবে যা মুছেছেন তার রেকর্ড রাখা হয়, তাই অন্য ডিভাইস সেগুলো আবার
              // ফিরিয়ে আনে না। ফলে যে ডিভাইসেই কাজ করুন, সব ডিভাইসে একই তথ্য থাকবে ──
              // ── v4.52: আগে এখানে পুরো ডেটাবেস নতুন করে লেখা হতো (set) — এর মাঝে অন্য কোথাও করা
              // পরিবর্তন মুছে যেতে পারত। এখন শুধু যা সার্ভারে নেই সেই ঘরগুলোই যোগ হয় ──
              if(false&&needsPush&&!skipPush&&pushWrites.length){ // v4.53: বন্ধ — পুরনো কপি থেকে কিছু আর যোগ করা হয় না
                try{

              // ── সার্ভারে আসলে কতটা ক্যাটাগরি ও মডেল আছে তা সরাসরি গুনে দেখানো হয়। দুই

              // একই সার্ভার পড়ছে (সমস্যা স্থানীয়), আলাদা হলে তারা ভিন্ন জায়গায় কথা বলছে ──

              otherSyncStatus.dbCounts=`সার্ভারে: ${svCatCount}টা ক্যাটাগরি, ${svVarCount}টা মডেল (${svEmptyWood}টায় কাঠের মাপ নেই) · এই ডিভাইসে: ${localVarCount}টা মডেল`;
              otherSyncStatus.db=gapParts.length?gapParts.join(", "):"মিলে আছে";
            }
          }catch(e3){otherSyncStatus.db="ত্রুটি: "+e3.message}
          // সাপ্তাহিক বেতন (নথির আইডি = সপ্তাহের শেষ তারিখ)
          try{
            const pw=await withTimeout(fs2.collection("payrollWeeks").get({source:"server"}),20000,"সময়সীমা পার");
            if(!(pw.metadata&&pw.metadata.fromCache)){
              const map={};pw.docs.forEach(d=>{map[d.id]=d.data()});
              if(!(pw.docs.length===0&&Object.keys(od.payrollWeeks||{}).length>0)){
                // v4.53: অন্য ডিভাইসে মুছে ফেলা অগ্রিম/হাজিরা পুরনো কপি থেকে আর ফিরিয়ে আনা হয় না — শুধু গোনা
                const onlyHereWeeks=Object.keys(od.payrollWeeks||{}).filter(wk=>!map[wk]).length;
                otherSyncStatus.payrollWeeks=`সার্ভারে ${pw.docs.length}টি সপ্তাহ${onlyHereWeeks?` · শুধু এই ডিভাইসে ${onlyHereWeeks}টি`:""}`;
              }
            }

          setAutoStuckStatus(prev=>({...prev,running:false,otherSyncStatus}));
        }catch(e){
          setAutoStuckStatus(prev=>({...(prev||{}),running:false,lastError:e.message}));
          // ── "Failed to get documents from server" ধরনের ত্রুটি মানে এই ডিভাইস সার্ভারের সাথে
          // সংযোগ হারিয়েছে এবং পুরনো ক্যাশ দেখাচ্ছে (আইফোনে ঠিক এটাই হচ্ছিল)। এই অবস্থায়
          // নিজে থেকে কিছু না করলে ডিভাইসটা চিরকাল পুরনো তথ্যেই আটকে থাকত। তাই সংযোগটা
          // বন্ধ করে আবার চালু করা হয়, যাতে Firestore নতুন করে সার্ভারের সাথে যুক্ত হয় ──
          if(/failed to get|unavailable|deadline|network|offline/i.test(e.message||"")){
            try{
              const f=fsRef.current;
              if(f){
                await f.disableNetwork();
                await new Promise(r=>setTimeout(r,800));
                await f.enableNetwork();
                setAutoStuckStatus(prev=>({...(prev||{}),lastError:(e.message||"")+" — সংযোগ নতুন করে চালু করা হয়েছে, পরের দফায় আবার চেষ্টা হবে"}));
              }
            }catch(e5){}
          }
        }
      };
      autoStuckCheckRef.current=autoStuckCheck;
      // ── এই ব্যাকগ্রাউন্ড যাচাই আগে ১০ সেকেন্ড পরই শুরু হতো — কিন্তু এটা প্রতিটা কালেকশন
      // (অর্ডার+খরচ+কাঠ+কর্মী+ডেটাবেস+বেতন) আবার নতুন করে টেনে আনে, যা ঠিক লোডিং-এর সবচেয়ে
      // গুরুত্বপূর্ণ সময়েই মূল ডেটা-লোডের সাথে ব্যান্ডউইথের জন্য প্রতিযোগিতা করত, ফলে পুরো
      // অ্যাপ লোড হতে বেশি সময় লাগত। এখন ৪৫ সেকেন্ড পর শুরু হয়, ততক্ষণে মূল ডেটা ইতিমধ্যে
      // লোড হয়ে যাওয়ার কথা ──
      const firstStuckCheck=setTimeout(autoStuckCheck,15000);
      const stuckCheckInterval=setInterval(autoStuckCheck,60000);

      return()=>{clearTimeout(timer);clearTimeout(firstStuckCheck);clearInterval(stuckCheckInterval);try{unsubVer();unsubDevices();unsubAudit()}catch(e){}unsubOrders();unsubExpenses();unsubLots();unsubDb();unsubGalleries();unsubWoodSettings();unsubLaborSettings();unsubAlertSettings();unsubRackSplits();unsubRackBands();unsubCarp();unsubWorkers();unsubPayroll()};
    }catch(e){
      clearTimeout(timer);
      setConnError(e.message);
    }
  },[firebaseConfig,retryKey]);

  // ── ফোন ব্যাকগ্রাউন্ডে থাকার পর ফিরে আসলে (স্ক্রিন অন হলে/ট্যাব আবার সক্রিয় হলে) সরাসরি
  // সার্ভার থেকে নতুন করে যাচাই — মোবাইল ব্রাউজার দীর্ঘক্ষণ ব্যাকগ্রাউন্ডে থাকলে লাইভ সংযোগ
  // নিজে থেকে দেরিতে সচল হতে পারে, তাই ফিরে আসার সাথে সাথেই জোর করে তাজা তথ্য আনা হয় ──
  useEffect(()=>{
    // ── সার্ভার থেকে জোর করে তাজা তথ্য আনা ──
    // আগে এটা শুধু ট্যাব বদলালে (visibilitychange/focus) চলত। কিন্তু কম্পিউটারে ট্যাবটা
    // যদি সারাক্ষণ খোলা ও সামনেই থাকে, তাহলে এই ইভেন্ট কখনো ঘটেই না — আর ভেতরের
    // রিয়েল-টাইম সংযোগ চুপচাপ বিচ্ছিন্ন হয়ে গেলে পুরনো তথ্য ঘণ্টার পর ঘণ্টা দেখাতে থাকে।
    // এই কারণেই মোবাইল ও পিসিতে আলাদা সংখ্যা দেখা যেত। এখন প্রতি ৪৫ সেকেন্ডে নিজে থেকেই
    // তাজা তথ্য টেনে আনে, আর সব কালেকশনই আনে (আগে কয়েকটা বাদ পড়ত)।
    const quotaBackoffUntilRef={current:0};
    const refreshFromServer=(force,ordersOnly)=>{
      if(!force&&document.visibilityState&&document.visibilityState!=="visible")return Promise.resolve();
      // কোটা শেষ হয়ে গেলে আরও পড়ার চেষ্টা করলে অবস্থা আরও খারাপ হয় — কিছুক্ষণ থেমে থাকা হয়
      if(Date.now()<quotaBackoffUntilRef.current)return Promise.resolve();
      const fs=fsRef.current;
      if(!fs)return Promise.resolve();
      const jobs=[
        fs.collection("orders").get({source:"server"}).then(snap=>{
          const list=snap.docs.map(d=>d.data()).sort((a,b)=>new Date(b.at||b.cust?.date||0)-new Date(a.at||a.cust?.date||0));
          // ── "যেই ডিভাইসে শেষ যা ইনপুট হবে তাই সব ডিভাইসে দেখা যাবে" — এই নিয়ম নিজে থেকে
          // বলবৎ করার জন্য। এই ডিভাইসে আছে কিন্তু সার্ভারে নেই এমন অর্ডার পেলে চুপচাপ সার্ভারে
          // পাঠিয়ে দেয় (আগে এটা ⚙️ সেকশনে হাতে করতে হতো), আর সেগুলো তালিকা থেকেও হারিয়ে যায় না।
          // এই একই স্ন্যাপশটই ব্যবহার হয়, তাই বাড়তি কোনো পড়ার খরচ নেই ──
          // ── v4.53: সার্ভারে নেই এমন অর্ডার আর কখনো আবার পাঠানো হয় না (অন্য ডিভাইসে মুছে ফেলা অর্ডার
          // এভাবেই ফিরে আসত)। শুধু এই ডিভাইসের সদ্য-করা, এখনো পৌঁছানোর পথে থাকা পরিবর্তনগুলো রাখা হয় ──
          const serverNos=new Set(snap.docs.map(d=>d.id));
          const pend=pendingOrderNosRef.current;
          const localMap={};(ordersRef.current||[]).forEach(o=>{if(o&&o.no)localMap[o.no]=o});
          const localPending=Object.values(localMap).filter(o=>!serverNos.has(o.no)&&pend.has(o.no));
          const merged=list.map(o=>pend.has(o.no)&&localMap[o.no]?localMap[o.no]:o);
          setOrders(localPending.length?[...localPending,...merged]:merged);
        }),
      ];
      // ধীরে বদলায় এমন কালেকশনগুলো প্রতিবার নতুন করে পড়ার দরকার নেই — রিয়েল-টাইম লিসেনার
      // এগুলোর পরিবর্তনও সাথে সাথেই এনে দেয়; এটা শুধু নিরাপত্তা-জাল, তাই আধ ঘণ্টায় একবার
      if(!ordersOnly)jobs.push(

        fs.doc("meta/woodSettings").get({source:"server"}).then(s=>{setWoodSettings(s.exists?s.data():{})}),

        // — Firebase-এর দিনের সীমা শেষ, তাই পড়াই সম্ভব না, প্রতিটা ডিভাইস তখন নিজের পুরনো ক্যাশ
        // দেখাতে থাকে (এভাবেই ডিভাইসে ডিভাইসে সংখ্যা আলাদা হয়ে যায়)। ধরা পড়লে ১০ মিনিট থেমে

          return;

        }

    refreshFromServerRef.current=refreshFromServer;
    // ── কোনো টাইমার নেই। প্রতিটা কালেকশনেই রিয়েল-টাইম লিসেনার (onSnapshot) বসানো আছে — Firebase
    // সেখানে শুধু যেই ডকুমেন্ট আসলে বদলেছে সেটুকুরই হিসাব নেয়, বাকি সময় বসে থাকলে কোনো খরচ নেই।
    // অর্থাৎ "শুধু নতুন পরিবর্তনটুকু সব ডিভাইসে পাঠানো" — এটা আগে থেকেই চালু ছিল, আর প্রতি ২০
    // সেকেন্ডের ওই পুরো-ডেটা পড়াটা তার উপরে সম্পূর্ণ বাড়তি অপচয় ছিল, যা দিনের কোটা শেষ করে
    // দিচ্ছিল। এখন সার্ভারের সাথে পুরো মিলিয়ে দেখা হয় শুধু তখনই যখন অ্যাপটা খোলা/সামনে আনা হয়
    // (লিংকে ক্লিক করা, ট্যাবে ফেরা, নেট ফিরে আসা) — তখন একবার, তাতেই সব ডিভাইসে এক তথ্য নিশ্চিত ──
    const onWake=()=>{refreshFromServer()}; // v4.96: জেগে ওঠার সময় আর নিজে থেকে কিছু পাঠানো হয় না
    document.addEventListener("visibilitychange",onWake);
    window.addEventListener("focus",onWake);
    window.addEventListener("online",onWake);
    // চালু হওয়ার পরপরই একবার — এতে এই ডিভাইসে আটকে থাকা কোনো অর্ডার সাথে সাথেই সার্ভারে চলে যায়
    const firstReconcile=setTimeout(()=>{refreshFromServer(true,false)},10000);
    return()=>{clearTimeout(firstReconcile);document.removeEventListener("visibilitychange",onWake);window.removeEventListener("focus",onWake);window.removeEventListener("online",onWake)};
  },[]);

  // ── ডেটাবেস সেভ — এখন পুরো নথি চাপিয়ে না দিয়ে, শুধু আপনি যা বদলেছেন সেটুকুই সার্ভারের
  // কপির উপর বসানো হয়। আগে পুরো নথি লেখা হতো, ফলে যে ডিভাইসের কপি কোনো কারণে অসম্পূর্ণ
  // (যেমন কম্পিউটারে ১০-১২টা মডেল, অথচ মোবাইলে ১০০+) সেখান থেকে একটা ছোট সম্পাদনা করলেই
  // বাকি ডিভাইসের সব মডেল মুছে যেত। এখন সেটা অসম্ভব — শুধু আপনার করা পরিবর্তনটাই যায় ──
  const saveDb=(newDb,opts)=>{
    const oldDb=dbRef.current||{};
    // ── v4.96: হঠাৎ-ছোট-হয়ে-যাওয়ার বেড়া। তালিকা এক ধাক্কায় অনেকটা ছোট হয়ে গেলে সেটা
    // প্রায় সবসময়ই ভুল (পুরনো/অসম্পূর্ণ কপি থেকে লেখা) — আপনাকে না জানিয়ে সেটা আর
    // সার্ভারে যাবে না। ইচ্ছাকৃত মুছে ফেলা/মার্জে (intentional) এটা প্রযোজ্য নয় ──
    if(!(opts&&opts.intentional)){
      const before=catalogModelList(oldDb).length,after=catalogModelList(newDb).length;
      if(before>=10&&after<before*0.7){
        const ok=window.confirm(`🛡️ থামুন — এই সেভে তালিকা ${before}টা মডেল থেকে ${after}টায় নেমে যাবে (${before-after}টা কমে যাবে)।\n\nএটা সাধারণত ভুল করে হয়। সত্যিই চালিয়ে যেতে চান?\n\n"বাতিল" চাপলে কিছুই বদলাবে না, আর আপনার তালিকা যেমন আছে তেমনই থাকবে।`);
        if(!ok)return;
      }
    }
    setDb(newDb);
    const fs=fsRef.current;
    if(!fs)return;
    // ── v4.52: আগে একটা পরিবর্তন দুই ধাপে যেত (আগে যোগ, তারপর মোছা)। ধীর নেটে প্রথম ধাপ ৪৫
    // সেকেন্ডে শেষ না হলে দ্বিতীয় ধাপটা আর পাঠানোই হতো না — ফলে সরানো মডেল দুই ক্যাটাগরিতেই থেকে
    // যেত (নতুন ডুপ্লিকেট)। এখন যোগ, বদল, মোছা আর মুছে-ফেলার রেকর্ড — সব একটাই লেখায় (atomic):
    // হয় পুরোটা হবে, নয়তো কিছুই না। প্রতিটা ঘর আলাদা FieldPath দিয়ে, তাই নামে ডট বা বিশেষ চিহ্ন
    // থাকলেও ভুল জায়গায় লেখা হয় না। শুধু যা বদলেছে সেটুকুই যায় — অন্য ডিভাইসের কিছু স্পর্শ হয় না ──
    const DEL={__del:true};
    const writes=[]; // [[ঘরের পথ...], মান অথবা DEL]
    const prevTomb=deletedRecordRef.current||{};
    const tombstones={...prevTomb};
    Object.entries(newDb).forEach(([ck,cat])=>{
      if(!isCatEntry(ck,cat))return;
      const oldCat=oldDb[ck];
      if(!isCatEntry(ck,oldCat)){
        writes.push([[ck],JSON.parse(JSON.stringify(cat))]);
        // ক্যাটাগরিটা (আবার) যোগ হলো — এর আগের "মুছে ফেলা/সরিয়ে নেওয়া" চিহ্ন আর প্রযোজ্য নয়
        delete tombstones["cat:"+ck];
        Object.keys(cat.variants||{}).forEach(vk=>{delete tombstones["mv:"+ck+"|"+vk]});
        return;
      }
      if(oldCat.bn!==cat.bn)writes.push([[ck,"bn"],cat.bn===undefined?DEL:cat.bn]);
      if(oldCat.en!==cat.en)writes.push([[ck,"en"],cat.en===undefined?DEL:cat.en]);
      Object.entries(cat.variants||{}).forEach(([vk,v])=>{
        const oldV=(oldCat.variants||{})[vk];
        if(!oldV||JSON.stringify(oldV)!==JSON.stringify(v))writes.push([[ck,"variants",vk],JSON.parse(JSON.stringify(v))]);
        // মডেলটা এই ক্যাটাগরিতে (আবার) এসেছে — "এখান থেকে সরানো হয়েছিল" চিহ্ন তুলে দেওয়া হয়
        if(!oldV)delete tombstones["mv:"+ck+"|"+vk];
      });
    });
    // মুছে ফেলা শনাক্ত করা
    const pendingVarDeletes=[],pendingCatDeletes=[];
    Object.entries(oldDb).forEach(([ck,oldCat])=>{
      if(!isCatEntry(ck,oldCat))return;
      if(!isCatEntry(ck,newDb[ck])){pendingCatDeletes.push(ck);return}
      Object.keys(oldCat.variants||{}).forEach(vk=>{
        if(!((newDb[ck].variants)||{})[vk]){
          const movedElsewhere=Object.entries(newDb).some(([ck2,c2])=>ck2!==ck&&isCatEntry(ck2,c2)&&(c2.variants||{})[vk]);
          pendingVarDeletes.push({ck,vk,movedElsewhere});
        }
      });
    });
    // অন্য ক্যাটাগরিতে সরানো মডেলের পুরনো জায়গা সবসময় মোছা হয়, সাথে "এই ক্যাটাগরি থেকে সরানো
    // হয়েছে" চিহ্ন — যাতে অন্য ডিভাইসের পুরনো কপি মডেলটাকে আগের ক্যাটাগরিতে আর ফেরাতে না পারে
    pendingVarDeletes.filter(d=>d.movedElsewhere).forEach(({ck,vk})=>{
      writes.push([[ck,"variants",vk],DEL]);
      tombstones["mv:"+ck+"|"+vk]=Date.now();
    });
    // ── ভর-মুছে-ফেলার রক্ষাকবচ: একবারে ৩টার বেশি মুছে যাওয়ার কথা এলে মোছার অংশটা বাতিল হয়
    // (যোগ/সম্পাদনা ঠিকই সেভ হয়)। আপনি নিজে ইচ্ছা করে একসাথে কয়েকটা মেশালে এটা প্রযোজ্য নয় ──
    const realDeletes=pendingVarDeletes.filter(d=>!d.movedElsewhere).length+pendingCatDeletes.length;
    // ── v4.93: আগে নিয়ম ছিল "৩টার বেশি মুছে গেলে আটকাও"। অর্থাৎ প্রতিটা সেভে ৩টা পর্যন্ত
    // মডেল নিঃশব্দে মুছে যেতে পারত — বারবার সেভ হলে ধীরে ধীরে তালিকা ক্ষয়ে যাওয়ার পথ।
    // এখন মোছা মানেই আপনাকে জিজ্ঞেস করা হবে; "হ্যাঁ" না বললে শুধু যোগ/সম্পাদনা সেভ হবে ──
    let allowDeletes=realDeletes===0||(opts&&opts.intentional);
    if(realDeletes>0&&!allowDeletes){
      allowDeletes=window.confirm(`⚠️ এই সেভে ${realDeletes}টা মডেল/ক্যাটাগরি মুছে যাবে:\n\n${[...pendingVarDeletes.filter(d=>!d.movedElsewhere).map(d=>((oldDb[d.ck]||{}).variants||{})[d.vk]?.bn||d.vk),...pendingCatDeletes.map(ck=>(oldDb[ck]||{}).bn||ck)].slice(0,10).join("\n")}\n\nসত্যিই মুছতে চান?\n\n"বাতিল" চাপলে মোছার অংশটুকু বাদ যাবে, আপনার যোগ/নাম-বদল/কাঠের মাপ ঠিকই সেভ হবে।`);
    }
    // মোছা শুধু তখনই, যখন সত্যিই অনুমতি আছে (realDeletes===0, intentional, বা আপনি "হ্যাঁ" বলেছেন)
    if(allowDeletes){
      pendingVarDeletes.filter(d=>!d.movedElsewhere).forEach(({ck,vk})=>{
        writes.push([[ck,"variants",vk],DEL]);
        tombstones[vk]=Date.now();
      });
      pendingCatDeletes.forEach(ck=>{
        writes.push([[ck],DEL]);
        tombstones["cat:"+ck]=Date.now();
      });
    }
    deletedRecordRef.current=tombstones;
    // ── v4.93: কী যোগ হলো আর কী মুছল — একটা আলাদা খাতায় লিখে রাখা হয়, যাতে পরে
    // নিশ্চিতভাবে বলা যায় কোন ডিভাইস কখন কী সরিয়েছে। খাতাটা ক্যাশ-বিহীন সংযোগ দিয়ে
    // যায়, তাই মূল সারি জ্যাম থাকলেও রেকর্ডটা আটকে থাকে না ──
    try{
      const addedNames=[],removedNames=[];
      Object.entries(newDb).forEach(([ck,cat])=>{
        if(!isCatEntry(ck,cat))return;
        const oldCat=oldDb[ck];
        Object.entries(cat.variants||{}).forEach(([vk,v])=>{
          if(!oldCat||!((oldCat.variants)||{})[vk])addedNames.push(((v&&v.bn)||vk));
        });
      });
      pendingVarDeletes.filter(d=>!d.movedElsewhere).forEach(({ck,vk})=>{
        removedNames.push((((oldDb[ck]||{}).variants||{})[vk]||{}).bn||vk);
      });
      pendingCatDeletes.forEach(ck=>removedNames.push("[ক্যাটাগরি] "+((oldDb[ck]||{}).bn||ck)));
      if(addedNames.length||removedNames.length||writes.length){
        const entry={at:new Date().toISOString(),device:deviceLabel(),deviceId:deviceIdRef.current,version:BUILD_TAG,
          added:addedNames.length,removed:removedNames.length,allowedDeletes:!!allowDeletes,
          removedNames:removedNames.slice(0,25),addedNames:addedNames.slice(0,25),
          localModels:catalogModelList(newDb).length,localCats:dbCats(newDb).length};
        try{getRescueFs().collection("dbAudit").doc(String(Date.now())+"_"+deviceIdRef.current).set(entry).catch(()=>{})}
        catch(e){}
      }
    }catch(e){}
    Object.keys(tombstones).forEach(k=>{if(prevTomb[k]!==tombstones[k])writes.push([["zz_deletedRecord",k],tombstones[k]])});
    Object.keys(prevTomb).forEach(k=>{if(!(k in tombstones))writes.push([["zz_deletedRecord",k],DEL])});
    if(!writes.length)return;
    const FP=firebase.firestore.FieldPath,FV=firebase.firestore.FieldValue;
    const args=[];
    writes.forEach(([segs,val])=>{args.push(new FP(...segs),val===DEL?FV.delete():val)});
    let p;
    try{p=fs.doc("meta/db").update(...args)}catch(err){p=Promise.reject(err)}
    // ধীর নেটে এখানে আর কোনো সময়সীমা বা সতর্কবার্তা নেই — লেখাটা ফোনের সারিতে থাকে, নেট পেলেই পৌঁছায়
    dbPendingRef.current++;
    p.catch(err=>{
      if(err&&err.code==="not-found"){
        // নথিটা এখনো তৈরিই হয়নি (একদম নতুন প্রজেক্ট) — পুরো ডেটাবেস একবারে বসানো হয়
        return fs.doc("meta/db").set({...JSON.parse(JSON.stringify(Object.fromEntries(dbCats(newDb)))),zz_deletedRecord:tombstones},{merge:true});
      }
      if(!isTimeoutErr(err))alert("⚠️ ক্লাউডে সেভ করতে সমস্যা হয়েছে: "+err.message+"\n\nপরিবর্তনটা এই ডিভাইসে আছে।");
    }).catch(()=>{}).then(()=>{dbPendingRef.current=Math.max(0,dbPendingRef.current-1)});
  };
  // ── মডেলের নাম বদলালে, সেই মডেল ব্যবহার করা প্রতিটা অর্ডারেও নামটা সাথে সাথে বদলে দেওয়া হয়।
  // প্রতিটা অর্ডার আইটেমে মডেলের নামের একটা কপি (variantBn) সংরক্ষিত থাকে — প্রিন্ট শীট,
  // রিসিপ্ট, ইতিহাস সবখানে এই কপিটাই দেখানো হয়, ডেটাবেস থেকে সরাসরি না। তাই শুধু ডেটাবেসে
  // নাম বদলালে পুরনো অর্ডারে পুরনো নামই থেকে যেত — এখন প্রতিটা কপিও একসাথে আপডেট হয় ──
  // ── মডেল অন্য ক্যাটাগরিতে সরালে, সেই মডেল ব্যবহার করা প্রতিটা অর্ডারের ক্যাটাগরি-সংযোগও
  // (catKey) আপডেট করতে হয় — না হলে অর্ডার আর ডেটাবেসের সংযোগ ছিঁড়ে যাবে ──
  // ── ডেটাবেসে কাঠের মাপ বদলালে, সেই মডেলের এখনো-অসম্পূর্ণ অর্ডারগুলোতেও মাপ আপডেট হয়।
  // ডেলিভারি হয়ে যাওয়া অর্ডার ইচ্ছাকৃতভাবে বাদ — ওগুলো তখনকার মাপেই বানানো হয়েছে, বদলে
  // দিলে লাভ-ক্ষতির ইতিহাস মিথ্যা হয়ে যাবে ──
  const propagateWoodChange=async(catKey,varKey,newSections)=>{
    // v4.61: ডেলিভারড অর্ডারে এই মডেলের কাঠের তালিকা ফাঁকা থাকলে একবার বসে যায় (আগে বসানো থাকলে আর বদলায় না)
    setTimeout(()=>{backfillDeliveredWood({[catKey+"|"+varKey]:newSections})},1500);
    const fs=fsRef.current;
    const affected=(ordersRef.current||[]).filter(o=>!o.delivered&&!o.cancelled&&(o.items||[]).some(it=>it.catKey===catKey&&it.varKey===varKey));
    if(!affected.length)return;
    const applyTo=(items)=>(items||[]).map(it=>it.catKey===catKey&&it.varKey===varKey?{...it,sections:JSON.parse(JSON.stringify(newSections))}:it);
    setOrders(prev=>prev.map(o=>{
      if(o.delivered||o.cancelled)return o;
      if(!(o.items||[]).some(it=>it.catKey===catKey&&it.varKey===varKey))return o;
      return{...o,items:applyTo(o.items)};
    }));
    if(!fs)return;
    const chunks=[];
    for(let i=0;i<affected.length;i+=400)chunks.push(affected.slice(i,i+400));
    for(const chunk of chunks){

    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).set({delivered,deliveredAt},{merge:true}).catch(err=>alert("⚠️ ডেলিভারি স্ট্যাটাস সিঙ্ক করতে সমস্যা হয়েছে — ইন্টারনেট সংযোগ যাচাই করুন: "+err.message));
  };
  const deleteOrderPermanently=(orderNo)=>{
    if(fsRef.current)fsRef.current.collection("orders").doc(orderNo).delete().catch(err=>alert("⚠️ ডিলিট করতে সমস্যা হয়েছে: "+err.message));

    goBack();
  };
  // ── খরচ যোগ/সম্পাদনা — আগে এখানে স্থানীয় অবস্থা হালনাগাদই হতো না, তাই সার্ভার থেকে ফিরে
  // আসা পর্যন্ত নতুন খরচ স্ক্রিনে দেখাত না। দুর্বল সংযোগে মনে হতো "সেভ হয়নি", আবার যোগ করলে
  // একই খরচ দুইবার বসে যেত। এখন সাথে সাথে দেখায়, আর লেখাটা পাশাপাশি চলে যায় ──
  const saveExpense=(exp)=>{
    const id=exp.id||("exp_"+Date.now());
    const withId={...exp,id};
    setExpenses(prev=>{
      const exists=(prev||[]).some(e=>e.id===id);
      const next=exists?(prev||[]).map(e=>e.id===id?withId:e):[...(prev||[]),withId];
      return next.sort((a,b)=>new Date(b.at||b.date||0)-new Date(a.at||a.date||0));
    });
    // v4.53: আগে থাকা খরচ বদলালে শুধু বদলানো ঘরগুলোই যায়
    const oldExp=(latestDataRef.current.expenses||[]).find(e=>e.id===id);
    if(fsRef.current){
      const ref=fsRef.current.collection("expenses").doc(id);
      const p=oldExp?ref.set(topLevelPatch(oldExp,withId,["id"]),{merge:true}):ref.set(JSON.parse(JSON.stringify(withId)));
      p.catch(err=>{if(!isTimeoutErr(err))alert("⚠️ খরচ সার্ভারে পাঠাতে সমস্যা হয়েছে: "+err.message)});
    }
  };
  const saveCarpenters=(list)=>{
    setCarpenters(list);
    if(fsRef.current)fsRef.current.doc("meta/carpenters").set({list}).catch(()=>{});
  };
  const saveWoodLots=(newList)=>{
    setWoodLots(newList);
    if(!fsRef.current)return;
    const newIds=new Set(newList.map(l=>l.id));
    const oldList=woodLotsRef.current||woodLots||[];
    // পরিবর্তিত/নতুন লটগুলোই লেখা হয়
    // ── v4.53: আগে পুরো লট (সব গুড়ি, সাপ্লায়ারের সব পেমেন্টসহ) নতুন করে লেখা হতো — পুরনো কপির ডিভাইস
    // থেকে একটা গুড়ি কাটা চিহ্ন দিলেও অন্য ডিভাইসে দেওয়া পেমেন্ট মুছে যেত। এখন: সাধারণ ঘর শুধু বদলালে,
    // টাকার তালিকা এন্ট্রি ধরে, আর গুড়ির তালিকা id ধরে জায়গামতো ──
    const fsL=fsRef.current;
    newList.forEach(lot=>{
      const old=oldList.find(l=>l.id===lot.id);
      const ref=fsL.collection("woodlots").doc(lot.id);
      const fail=(err)=>{if(!isTimeoutErr(err))alert("⚠️ কাঠের স্টক সার্ভারে পাঠাতে সমস্যা হয়েছে: "+err.message)};
      if(!old){ref.set(JSON.parse(JSON.stringify(lot))).catch(fail);return}
      if(JSON.stringify(old)===JSON.stringify(lot))return;
      const patch=topLevelPatch(old,lot,["id","payments","millingEntries","logs"]);
      (async()=>{
        try{
          if(Object.keys(patch).length)await ref.set(patch,{merge:true});
          if(JSON.stringify(old.payments||[])!==JSON.stringify(lot.payments||[]))await applyListDiff(ref,"payments",old.payments,lot.payments);
          if(JSON.stringify(old.millingEntries||[])!==JSON.stringify(lot.millingEntries||[]))await applyListDiff(ref,"millingEntries",old.millingEntries,lot.millingEntries);
          if(JSON.stringify(old.logs||[])!==JSON.stringify(lot.logs||[]))await applyOrderedListDiff(fsL,ref,"logs",old.logs,lot.logs);
        }catch(err){fail(err)}
      })();
    });
    // ── মুছে ফেলার রক্ষাকবচ: একবারে ৩টার বেশি লট মুছে যাওয়ার কথা এলে বাতিল, কারণ এই
    // ডিভাইসের তালিকা পুরনো হলে অন্য ডিভাইসে যোগ করা লট মুছে যেত ──
    const toDelete=oldList.filter(l=>!newIds.has(l.id));
    if(toDelete.length>3){
      alert(`🛡️ নিরাপত্তা: এই সেভে ${toDelete.length}টা কাঠের লট মুছে যেত — একবারে এতগুলো মোছা স্বাভাবিক নয়, তাই বাতিল করা হলো। একটা একটা করে মুছুন।`);
      return;

    toDelete.forEach(lot=>fsRef.current.collection("woodlots").doc(lot.id).delete().catch(()=>{}));
  };
  // সাপ্লায়ারকে দেওয়া পেমেন্টও টাকার হিসাব — একই কারণে atomic (arrayUnion) লেখা হয়
  const addLotPayment=(lotId,payment)=>{

  const saveWorker=(worker)=>{

    const oldW=(latestDataRef.current.workers||[]).find(w=>w.id===id);

  // হলে অন্য ডিভাইসে বসানো অগ্রিম বা হাজিরা মুছে যেতে পারত (সরাসরি টাকার ভুল)। এখন আগের-পরের
  // তুলনা করে শুধু যা বদলেছে সেটুকুই merge করে সাথে সাথে পাঠানো হয় ──
  const savePayrollWeek=(weekEnd,data)=>{
    const oldWeek=(payrollWeeksRef.current||{})[weekEnd]||{};

    const attPatch={};

    if(Object.keys(attPatch).length)patch.attendance=attPatch;
    // অগ্রিম — নতুন যোগ হওয়া এন্ট্রিগুলো atomic ভাবে (arrayUnion), যাতে কারো এন্ট্রি না মোছে
    const oldAdvIds=new Set((oldWeek.advances||[]).map(a=>a.id));
    const newAdvs=(data.advances||[]).filter(a=>a.id&&!oldAdvIds.has(a.id));

    Object.entries(data).forEach(([k,v])=>{
      if(k==="attendance"||k==="advances")return;
      if(JSON.stringify(oldWeek[k])!==JSON.stringify(v))patch[k]=v;
    });

      try{

        }
        if(newAdvs.length){
          await fsRef.current.collection("payrollWeeks").doc(weekEnd)
            .set({advances:firebase.firestore.FieldValue.arrayUnion(...newAdvs)},{merge:true});
        }
      }catch(err){alert("⚠️ পে-রোল সিঙ্ক করতে সমস্যা হয়েছে: "+err.message)}
    };
    run();
  };
  // ── নিচের তিনটা atomic (পরমাণু-সদৃশ) — একাধিক ডিভাইস থেকে একই সপ্তাহে একসাথে এন্ট্রি দিলেও
  // একজনের লেখা আরেকজনের লেখা মুছে ফেলবে না। উপরের savePayrollWeek পুরো ডকুমেন্ট বদলে দেয় বলে
  // একটা ডিভাইসের পুরনো/স্টেল কপি দিয়ে সেভ করলে অন্য ডিভাইসের এন্ট্রি হারিয়ে যেতে পারত — এখন আর পারবে না।
  const updateAttendance=(weekEnd,workerId,days)=>{
    // v4.52: হাজিরার সাথে কর্মীর তখনকার দৈনিক হার, নাম ও বিভাগও সপ্তাহের নথিতে থাকে — পরে কর্মীর
    // প্রোফাইল মুছে ফেললেও সেই সপ্তাহের বেতন বেতনের চার্ট ও মোট ব্যয়ে ঠিকঠাক গোনা যায়
    const wk=((otherDataRef.current&&otherDataRef.current.workers)||[]).find(x=>x.id===workerId);
    const wsnap=wk?{rate:parseFloat(wk.dailyRate)||0,name:wk.name||"",dept:wk.department||""}:null;
    setPayrollWeeks(prev=>{
      const wd=prev[weekEnd]||{attendance:{},advances:[]};
      return{...prev,[weekEnd]:{...wd,attendance:{...(wd.attendance||{}),[workerId]:days},...(wsnap?{wstat:{...(wd.wstat||{}),[workerId]:wsnap}}:{})}};
    });
    // ── আগে এখানে {"attendance.<id>": days} এভাবে set() করা হতো — কিন্তু set()-এ সাধারণ
    // অবজেক্টের ভেতরে ডট-যুক্ত নাম দিলে Firestore সেটাকে নেস্টেড ম্যাপ হিসেবে না নিয়ে
    // আক্ষরিক "attendance.<id>" নামের একটা আলাদা ফিল্ড বানায়। ফলে আসল attendance ম্যাপ
    // ফাঁকাই থাকত, আর লিসেনার ফিরে এসে দিনসংখ্যা ০-তেই বসিয়ে দিত — এই কারণেই +/− চেপে
    // দিন বসানো যাচ্ছিল না। নেস্টেড ম্যাপে লিখতে হলে আলাদা করে ম্যাপ পাঠাতে হয় ──
    if(fsRef.current){
      fsRef.current.collection("payrollWeeks").doc(weekEnd)

    }
  };

  };

      <div style={{background:"#fef2f2",borderRadius:9,padding:"12px 14px",fontSize:13,color:"#991b1b",marginBottom:16,fontFamily:"monospace",wordBreak:"break-word"}}>{connError}</div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:RED,color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:RED,border:`1.5px solid ${RED}`,borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    if(timedOut)return<div style={{padding:30,textAlign:"center",maxWidth:480,margin:"40px auto"}}>
      <div style={{fontSize:9,color:"#ccc",marginBottom:8}}>{BUILD_TAG}</div>
      <div style={{fontSize:16,fontWeight:800,color:"#92400e",marginBottom:10}}>⏳ অনেকক্ষণ ধরে সিঙ্ক হচ্ছে...</div>
      <div style={{fontSize:13,color:"#555",marginBottom:14,textAlign:"left",lineHeight:1.7}}>
        সম্ভাব্য কারণ:<br/>
        ১. ইন্টারনেট সংযোগ দুর্বল বা বন্ধ<br/>
        ২. ব্রাউজারের কোনো "Shield"/"Ad-block" এক্সটেনশন (Brave Shields, uBlock ইত্যাদি) গুগলের সার্ভারে সংযোগ ব্লক করছে — এটা বন্ধ করে আবার চেষ্টা করুন<br/>
        ৩. Firebase কনফিগ কোডে ভুল আছে (ভুল প্রজেক্টের কোড পেস্ট হয়েছে)<br/>
        ৪. ফোনের ডেটা/ওয়াইফাই গুগল সার্ভিস ব্লক করছে এমন নেটওয়ার্ক (কিছু অফিস/স্কুল ওয়াইফাই এমন হয়)
      </div>
      <button onClick={()=>setRetryKey(k=>k+1)} style={{background:"#92400e",color:"white",border:"none",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700,marginRight:8}}>পুনরায় চেষ্টা করুন</button>
      <button onClick={onResetConfig} style={{background:"white",color:"#92400e",border:"1.5px solid #92400e",borderRadius:9,padding:"11px 20px",fontSize:13,fontWeight:700}}>Firebase পুনরায় সেটআপ</button>
    </div>;
    return<div style={{padding:40,textAlign:"center"}}><div style={{fontSize:9,color:"#ccc",marginBottom:10}}>{BUILD_TAG}</div>সিঙ্ক হচ্ছে...</div>;
  }
  // ── v4.45: কোনো পাতা ক্র্যাশ করলে — কী হয়েছিল তা জমা রাখা হয় (⚙️ সিস্টেম অংশে দেখা যায়),
  // আর সম্ভব হলে নিজে থেকেই এক ধাপ পেছানো হয়; অ্যাপ কখনো সাদা হয়ে থেমে থাকে না ──
  const onPageCrash=(err)=>{
    const rec={at:new Date().toISOString(),page:page+(curScreen.tab?"/"+curScreen.tab:""),msg:String((err&&err.message)||err).slice(0,240)};
    S.set("rf_last_page_crash",rec);
    setLastPageCrash(rec);
    if(navStack.length>1)setTimeout(()=>{try{window.history.back()}catch(e){}},0);
  };
  const renderPage=()=>{
  if(page==="preview")return<Preview syncInfo={syncInfo} online={online} order={viewed||draft} onBack={goBack} slip={slip} setSlip={setSlip} onUpdate={updateOrder} onAddPayment={addOrderPayment} onSetDelivered={setOrderDelivered} onDelete={deleteOrderPermanently} db={db} saveDb={saveDb} carpenters={carpenters} saveCarpenters={saveCarpenters} galleries={galleries} saveGalleryEntry={saveGalleryEntry} woodSettings={woodSettingsWithBands} laborSettings={laborSettings} workers={workers} allOrders={orders} rackSplits={rackSplits}/>;
  if(page==="form")return<Form recentRates={recentCostRates} onSave={saveOrder} onBack={goBack} db={db} saveDb={saveDb} galleries={galleries} woodSettings={woodSettings} laborSettings={laborSettings} orders={orders} getNextOrderNumber={getNextOrderNumber}/>;
  if(page==="history")return<Hist syncInfo={syncInfo} online={online} orders={orders} db={db} onBack={goBack} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} highlightNo={highlightNo} q={curScreen.q||""} setQ={q=>replaceTop({...curScreen,q})} statusFilter={curScreen.statusFilter||"all"} setStatusFilter={statusFilter=>replaceTop({...curScreen,statusFilter})} catFilter={curScreen.catFilter||"all"} setCatFilter={catFilter=>replaceTop({...curScreen,catFilter})} sortMode={curScreen.sortMode||"recent"} setSortMode={sortMode=>replaceTop({...curScreen,sortMode})}/>;
  if(page==="manage")return<ManageDB db={db} saveDb={saveDb} galleries={galleries} saveGalleryEntry={saveGalleryEntry} onBack={goBack} navigate={navigate} goBack={goBack} replaceTop={replaceTop} curScreen={curScreen} highlightNo={highlightNo} onRenameVariant={propagateVariantRename} orders={orders} onMergeMany={mergeManyAcrossOrders} onMoveVariant={propagateVariantMove} onRecodeVariant={propagateVariantCode} onWoodChange={propagateWoodChange} onMergeVariants={mergeVariantsAcrossOrders}/>;
  if(page==="woodstock")return<WoodStockPage woodLots={woodLots} saveWoodLots={saveWoodLots} addLotPayment={addLotPayment} woodSettings={woodSettingsWithBands} saveWoodSettings={saveWoodSettings} laborSettings={laborSettings} saveLaborSettings={saveLaborSettings} rackSplits={rackSplits} addRackSplit={addRackSplit} rackBands={rackBands} addRackBand={addRackBand} removeRackBand={removeRackBand} payrollWeeks={payrollWeeks} workers={workers} orders={orders} expenses={expenses} onBack={goBack} view={curScreen.view||"list"} lotId={curScreen.lotId||null} onOpenList={()=>navigate({page:"woodstock",view:"list"})} onOpenDetail={lotId=>navigate({page:"woodstock",view:"detail",lotId})} onOpenNew={()=>navigate({page:"woodstock",view:"new"})} onOpenRates={()=>navigate({page:"woodstock",view:"rates"})} onOpenUsage={()=>navigate({page:"woodstock",view:"usage"})} highlightNo={highlightNo}/>;
  if(page==="expense")return<ExpensePage expenses={expenses} onSave={saveExpense} onBack={goBack}/>;
  if(page==="payroll")return<PayrollPage workers={workers} saveWorker={saveWorker} deleteWorker={deleteWorker} payrollWeeks={payrollWeeks} savePayrollWeek={savePayrollWeek} updateAttendance={updateAttendance} addAdvanceEntry={addAdvanceEntry} removeAdvanceEntry={removeAdvanceEntry} onBack={goBack}/>;
  if(page==="plreport")return<PLReportPage orders={orders} expenses={expenses} workers={workers} payrollWeeks={payrollWeeks} woodLots={woodLots} woodSettings={woodSettings} laborSettings={laborSettings} onBack={goBack}/>;
  return<Home syncInfo={syncInfo} devices={devices} dbAudit={dbAudit} dbHistory={dbHistory} onRestoreDbVersion={restoreDbVersion} onDownloadDbVersion={downloadDbVersion} deviceId={deviceIdRef.current} lastPageCrash={lastPageCrash} orders={orders} expenses={expenses} woodLots={woodLots} db={db} woodSettings={woodSettings} laborSettings={laborSettings} workers={workers} payrollWeeks={payrollWeeks} alertSettings={alertSettings} saveAlertSettings={saveAlertSettings} backupFailed={backupFailed} lastSyncAt={lastSyncAt} onManualRefresh={manualRefresh} onWriteTest={writeTest} catalogCheck={catalogCheck} onCheckCatalog={checkCatalog} onPushLocalModels={pushLocalOnlyModels} onMakeAuthoritative={makeThisDeviceAuthoritative} pushStatus={pushStatus} writeFailover={writeFailover} onTakeServerCatalog={takeServerCatalog} pendingWrites={pendingWrites} onCheckServerSync={checkServerSync} onAcceptServerVersion={acceptServerVersion} onUpdateOrder={updateOrder} onNew={()=>navigate({page:"form"})} onHist={()=>navigate({page:"history"})} onManage={()=>navigate({page:"manage"})} onExpense={()=>navigate({page:"expense"})} onWoodStock={()=>navigate({page:"woodstock",view:"list"})} onPayroll={()=>navigate({page:"payroll"})} onPLReport={()=>navigate({page:"plreport"})} onView={o=>navigate({page:"preview",orderNo:o.no,slip:0})} onViewDelivery={o=>navigate({page:"preview",orderNo:o.no,slip:5})} online={online} connError={connError} onResetConfig={onResetConfig} folderStatus={folderStatus} connectFolder={connectFolder} highlightNo={highlightNo} onBackupData={backupData} projectId={firebaseConfig?.projectId||""} appId={firebaseConfig?.appId||""} permanentSyncFailures={permanentSyncFailures} autoStuckStatus={autoStuckStatus} dbGaps={dbGaps} setDbGaps={setDbGaps} fsRef={fsRef}/>;
  };
  return<PageErrorBoundary resetKey={navStack.length+"|"+page+"|"+(curScreen.tab||"")} canGoBack={navStack.length>1} onError={onPageCrash}>{renderPage()}</PageErrorBoundary>;
}

/* ── HOME / DASHBOARD ── */
function Home({syncInfo,devices,dbAudit,dbHistory,onRestoreDbVersion,onDownloadDbVersion,deviceId,lastPageCrash,orders,expenses,woodLots,db,woodSettings,laborSettings,workers,payrollWeeks,alertSettings,saveAlertSettings,backupFailed,lastSyncAt,onManualRefresh,onWriteTest,catalogCheck,onCheckCatalog,onPushLocalModels,onMakeAuthoritative,pushStatus,writeFailover,onTakeServerCatalog,pendingWrites,onCheckServerSync,onAcceptServerVersion,onUpdateOrder,onNew,onHist,onManage,onExpense,onWoodStock,onPayroll,onPLReport,onView,onViewDelivery,online,connError,onResetConfig,folderStatus,connectFolder,highlightNo,onBackupData,projectId,appId,permanentSyncFailures,autoStuckStatus,dbGaps,setDbGaps,fsRef}){
  const now=new Date();
  const[showAllRunning,setShowAllRunning]=useState(false);
  const[showSystemZone,setShowSystemZone]=useState(false);
  // ── উপরের নেভিগেশন বারে ঠিক এই মুহূর্তে কোন বিভাগে আছেন তা ট্র্যাক করার জন্য — স্ক্রল করলে
  // যে বিভাগের হেডার স্টিকি বারের রেখা পার হয়ে গেছে তার মধ্যে সবচেয়ে নিচেরটাই "বর্তমান" ধরা হয়,
  // সেই আইকনটাই বড়+প্রেসড দেখানো হবে (নিচে zoneNavBar-এ) — স্ক্রল বন্ধ হলেও এই অবস্থাতেই থাকবে,
  // পরের বার অন্য বিভাগে স্ক্রল হলে তবেই বদলাবে ──
  const zoneIds=["z-urgent","z-today","z-trend","z-health","z-wood","z-perf","z-sys"];
  const[activeZone,setActiveZone]=useState(zoneIds[0]);
  useEffect(()=>{
    const onScroll=()=>{
      const threshold=64; // স্টিকি বারের উচ্চতার কাছাকাছি
      let current=zoneIds[0];
      for(const id of zoneIds){
        const el=document.getElementById(id);
        if(el&&el.getBoundingClientRect().top<=threshold)current=id;
      }
      setActiveZone(current);
    };
    onScroll();
    window.addEventListener("scroll",onScroll,{passive:true});
    return()=>window.removeEventListener("scroll",onScroll);
  },[]);
  const[syncCheck,setSyncCheck]=useState(null); // null=না চালানো, "loading", অথবা ফলাফল
  const[resending,setResending]=useState({});
  // ── v4.52: খরচের একক খতিয়ান (বিস্তারিত উপরে buildSpendLedger-এ) ──
  const spendLedger=useMemo(()=>buildSpendLedger(expenses,payrollWeeks,workers,woodLots),[expenses,payrollWeeks,workers,woodLots]);
  // ── v4.75: ফার্নিচার ডেটাবেস Firestore-এ একটাই নথিতে থাকে, আর একটা নথি সর্বোচ্চ ১ MB
  // (১,০৪৮,৫৭৬ বাইট) হতে পারে। সীমা ছুঁয়ে গেলে ওই নথিতে আর কোনো লেখা ঢোকে না — নতুন মডেল,
  // নাম বদল, কাঠের মাপ কিছুই সেভ হয় না, অথচ পর্দায় ঠিকই দেখা যায়। তাই আকারটা এখন চোখের
  // সামনে রাখা হচ্ছে, যাতে সীমার কাছাকাছি গেলে আগেই ধরা পড়ে ──
  const dbSize=useMemo(()=>{
    let bytes=0;
    try{bytes=new Blob([JSON.stringify(db||{})]).size}catch(e){try{bytes=unescape(encodeURIComponent(JSON.stringify(db||{}))).length}catch(e2){bytes=0}}
    const cats=dbCats(db||{});
    const models=cats.reduce((n,[,c])=>n+Object.keys((c&&c.variants)||{}).length,0);
    return{bytes,cats:cats.length,models,pct:(bytes/1048576)*100};
  },[db]);
  const salaryLedger=useMemo(()=>spendLedger.filter(e=>e.kind==="salary"),[spendLedger]);
  const cftDoneList=useMemo(()=>{
    const out=[];
    (orders||[]).forEach(o=>{if(!o||o.cancelled)return;const ip=effectiveItemProgress(o);(o.items||[]).forEach((it,idx)=>{const d=itemDoneDate(o,it,idx,ip);if(!d)return;const c=totalCft(it.sections||[])*(parseFloat(it.qty)||1);if(c>0)out.push({date:d,cft:c})})});
    return out;
  },[orders]);
  const[profitOpenCat,setProfitOpenCat]=useState(null);
  const[reconnecting,setReconnecting]=useState(false);
  const[writeTestResult,setWriteTestResult]=useState(null);
  const[catalogBusy,setCatalogBusy]=useState(false);
  const[catalogMsg,setCatalogMsg]=useState(null);
  // কত মিনিট ধরে লেখা আটকে আছে — ১ মিনিটের কম হলে ০ (তখন এটা স্বাভাবিক, সতর্ক করার মতো কিছু না)
  const writeStuckMin=(syncInfo&&syncInfo.pending&&syncInfo.pendingSince&&Date.now()-syncInfo.pendingSince>60000)?Math.max(1,Math.floor((Date.now()-syncInfo.pendingSince)/60000)):0;
  const stats=useMemo(()=>{
    // Running orders (not fully paid = not delivered typically, but we track by payment completion as proxy + delivery date)
    // ── একটা অর্ডারের সব পিসের সব বিভাগ ১০০% শেষ কিনা — এটা "চলমান" থেকে বাদ দিতে
    // এবং "তৈরি শেষ, গ্রাহক নেননি"-তে ধরতে দুই জায়গাতেই ব্যবহার হয়, যাতে একই অর্ডার
    // দুই তালিকাতেই একসাথে না দেখায় ──
    const running=orders.filter(o=>{
      if(o.cancelled)return false;
      if(!o.delivered&&isOrderFullyProgressed(o))return false; // ১০০% শেষ হলে এখন থেকে "তৈরি শেষ" তালিকায় যাবে, এখানে না
      return!o.delivered; // ডেলিভারড হয়ে গেলেই বাদ — বাকি টাকা থাকুক বা না থাকুক; বাকি টাকা আলাদাভাবে "পাওনা"-তে ঠিকই ট্র্যাক হয়
    });
    // ── v4.69: এখানেও ট্র্যাকিং পেইজের (S3) মতোই DEPT_WEIGHTS দিয়ে ওজনযুক্ত হিসাব — আগে
    // এখানে প্রতিটা (আইটেম x বিভাগ)-কে সমান ধরে সরল গড় করা হতো, তাই একই অর্ডারে ট্র্যাকিং
    // পেইজে ৯৩% আর চলমান তালিকায় ৮৯% — দুই রকম দেখাত। এখন দুই জায়গায় একই সংখ্যা আসবে ──
    const withDays=running.map(o=>{
      const daysLeft=o.cust.delivery?daysBetween(todayStr(),o.cust.delivery):999;
      const ip=effectiveItemProgress(o);
      const itemWeightedPcts=[];
      const allWorkersSet=new Set();
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        let itemPct=0;
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          itemPct+=((cur&&cur.pct)||0)*(DEPT_WEIGHTS[d.id]||0);
          (cur&&cur.workers||[]).forEach(w=>allWorkersSet.add(w));
        });
        itemWeightedPcts.push(itemPct);
      });
      const pct=itemWeightedPcts.length?Math.round(itemWeightedPcts.reduce((s,v)=>s+v,0)/itemWeightedPcts.length):0;
      const allWorkers=[...allWorkersSet];
      return{...o,daysLeft,pct,allWorkers};
    }).sort((a,b)=>a.daysLeft-b.daysLeft);

    // Exclude cancelled orders from all financial/analytical stats
    const activeOrders=orders.filter(o=>!o.cancelled);

    // ── এই ৬ মাসের তালিকাটা "বছর অনুযায়ী তুলনা" (yoy) এখনও ব্যবহার করে — বিক্রয়-বনাম-খরচ
    // চার্টের নিজস্ব হিসাব সরিয়ে নেওয়া হয়েছে (নিচে আলাদা useMemo-তে), কিন্তু এই তালিকাটা
    // yoy-এর জন্য এখনও দরকার ──
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    // Year over year - same months across 3 years
    const yoy=months.map(({y,m})=>{
      const thisY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y&&od.getMonth()===m}).length;
      const lastY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-1&&od.getMonth()===m}).length;
      const twoAgoY=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===y-2&&od.getMonth()===m}).length;
      return{label:monthName(m),a:twoAgoY,b:lastY,c:thisY,y};
    });
    const totalRevenue=activeOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const totalExpense=expenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);

    // Category breakdown of running orders (pie chart) - use actual DB category names
    const PIE_COLORS=[CHART_SOFT_RED,CHART_SOFT_BLUE,CHART_SOFT_PURPLE,CHART_SOFT_TEAL,CHART_SOFT_ORANGE,"#d4b26a",CHART_SOFT_GREY,CHART_SOFT_PINK];
    const catCount={};
    running.forEach(o=>o.items.forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      const key=it.catKey||catLabel;
      catCount[key]=catCount[key]||{label:catLabel,value:0};
      catCount[key].value+=1;
    }));
    const catPie=Object.values(catCount).sort((a,b)=>b.value-a.value).slice(0,8).map((c,i)=>({...c,color:PIE_COLORS[i%PIE_COLORS.length]}));

    // This month stats
    const thisMonthOrders=activeOrders.filter(o=>{const od=new Date(o.cust.date);return od.getFullYear()===now.getFullYear()&&od.getMonth()===now.getMonth()});
    const avgOrderValue=activeOrders.length?Math.round(totalRevenue/activeOrders.length):0;
    const totalOutstanding=activeOrders.reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      const rem=(parseFloat(o.cust.total)||0)-paid;
      return s+(rem>0?rem:0);
    },0);
    const oneYearAgo=new Date(now);oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);

    // ── ৩০ দিনের নগদ প্রবাহ পূর্বাভাস — "13-week cash flow forecast" পদ্ধতির সরলীকৃত রূপ ──
    // ভেতরে: আগামী ৩০ দিনে ডেলিভারির কথা এমন অর্ডারের বাকি টাকা
    // বাইরে: গত ৩ মাসের গড় মাসিক খরচ (বেতন + কাঠ ক্রয় + অন্যান্য খরচ)
    const next30=addDays(todayStr(),30);
    const cfInflow=activeOrders.filter(o=>!o.delivered&&o.cust.delivery&&o.cust.delivery>=todayStr()&&o.cust.delivery<=next30)
      .reduce((s,o)=>{
        const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
        return s+Math.max(0,(parseFloat(o.cust.total)||0)-paid);
      },0);
    const threeMoAgoStr=monthsAgo(todayStr(),3);
    // ── v4.52: বাইরে যাওয়া টাকা "মোট ব্যয়"-এর একই খতিয়ান থেকে (কাঠ = সাপ্লায়ারকে আসল পেমেন্ট) ──
    const cfOutflow=(spendLedger||[]).reduce((t,e)=>e.date>=threeMoAgoStr?t+e.amount:t,0)/3; // মাসিক গড়
    const cfNet=cfInflow-cfOutflow;


    // ── ১. তৈরি শেষ কিন্তু গ্রাহক নেননি — দোকানে পড়ে থাকা পণ্য ও আটকে থাকা টাকা ──
    const readyNotCollected=activeOrders.filter(o=>{
      if(o.delivered)return false;
      return isOrderFullyProgressed(o);
    }).map(o=>{
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const due=Math.max(0,(parseFloat(o.cust.total)||0)-paid);
      // কাজ শেষ হওয়ার তারিখ = সব বিভাগের শেষ তারিখগুলোর মধ্যে সর্বশেষটি
      const ip=effectiveItemProgress(o);
      let lastEnd="";
      Object.values(ip).forEach(item=>Object.values(item||{}).forEach(d=>{if(d&&d.end&&d.end>lastEnd)lastEnd=d.end}));
      const waitingDays=lastEnd?daysBetween(lastEnd,todayStr()):null;
      return{...o,due,lastEnd,waitingDays};
    }).sort((a,b)=>(b.waitingDays||0)-(a.waitingDays||0));
    const readyValueStuck=readyNotCollected.reduce((s,o)=>s+o.due,0);

    // ── ২. উৎপাদনের গতি: অর্ডার নেওয়া থেকে কাজ ১০০% শেষ হতে গড়ে কত দিন (গ্রাহকের দেরি এতে ধরা হয় না) ──
    const prodTimes=[];
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      const pcts=[];let lastEnd="";
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{const cur=(ip[ikey]||{})[d.id];pcts.push((cur&&cur.pct)||0);if(cur&&cur.end&&cur.end>lastEnd)lastEnd=cur.end});
      });
      if(pcts.length&&pcts.every(p=>p>=100)&&lastEnd&&o.cust.date){
        const days=daysBetween(o.cust.date,lastEnd);
        if(days>=0)prodTimes.push({days,finishedAt:lastEnd});
      }
    });
    const avgProdDays=prodTimes.length?Math.round(prodTimes.reduce((s,p)=>s+p.days,0)/prodTimes.length):null;
    const threeMonthsAgo=monthsAgo(todayStr(),3);
    const recentProd=prodTimes.filter(p=>p.finishedAt>=threeMonthsAgo);
    const olderProd=prodTimes.filter(p=>p.finishedAt<threeMonthsAgo);
    const recentAvgProd=recentProd.length?Math.round(recentProd.reduce((s,p)=>s+p.days,0)/recentProd.length):null;
    const olderAvgProd=olderProd.length?Math.round(olderProd.reduce((s,p)=>s+p.days,0)/olderProd.length):null;

    // ── ৪. মৌসুমি প্রবণতা এখন আলাদা useMemo-তে সরানো হয়েছে (নিচে), যাতে সময়সীমা বাছাই করার
    // সময় পুরো ড্যাশবোর্ড আবার হিসাব না হয় ──

    // ── ৫. কাঠের দাম বৃদ্ধির সতর্কতা: গত ৬ মাসে কোন কাঠের দাম কত % বেড়েছে ──
    const sixMonthsAgo=monthsAgo(todayStr(),6);
    const woodPriceAlerts=[];
    Object.entries(WOOD).forEach(([wk,wv])=>{
      const hist=((woodSettings&&woodSettings[wk]&&woodSettings[wk].rateHistory)||[]).slice().sort((a,b)=>(a.from||"").localeCompare(b.from||""));
      if(hist.length<2)return;
      const latest=hist[hist.length-1];
      const baseline=hist.filter(h=>h.from<=sixMonthsAgo).pop()||hist[0];
      if(!baseline||!latest||baseline===latest)return;
      const oldR=parseFloat(baseline.rate)||0,newR=parseFloat(latest.rate)||0;
      if(oldR<=0||newR<=0)return;
      const pct=((newR-oldR)/oldR)*100;
      if(Math.abs(pct)>=AL(alertSettings,"woodPricePct"))woodPriceAlerts.push({wood:wv.bn,oldRate:oldR,newRate:newR,pct,since:baseline.from});
    });
    woodPriceAlerts.sort((a,b)=>b.pct-a.pct);

    // ── ৬. কোন ফার্নিচারে লাভের হার বেশি (ডেলিভারি হওয়া অর্ডার থেকে) ──
    // বাধা বিভাগ চিহ্নিতকরণ (Goldratt-এর ৫ ধাপের ১ম ধাপ) — যেটাতে গড়ে সবচেয়ে বেশি সময় লাগে
    const bnDur={};
    DEPTS.forEach(d=>bnDur[d.id]=[]);
    activeOrders.forEach(o=>{
      const ipx=effectiveItemProgress(o);
      Object.values(ipx).forEach(itp=>DEPTS.forEach(d=>{
        const cur=itp&&itp[d.id];
        if(cur&&cur.start&&cur.end){const dd=daysBetween(cur.start,cur.end);if(dd>=0)bnDur[d.id].push(dd)}
      }));
    });
    let bottleneckDeptId=null,bottleneckDeptBn=null,bnBest=0;
    DEPTS.forEach(d=>{
      const l=bnDur[d.id];
      if(l.length>=2){const av=l.reduce((s,v)=>s+v,0)/l.length;if(av>bnBest){bnBest=av;bottleneckDeptId=d.id;bottleneckDeptBn=d.bn}}
    });
    // ── যদি কোনো বিভাগেই যথেষ্ট সম্পন্ন কাজের নমুনা না থাকে (গড়-সময় হিসাব করা না যায়) —
    // এটা ঠিক তখনই ঘটে যখন ব্যাকলগ এত বেশি যে বেশিরভাগ কাজ কোনো বিভাগেই শেষই হচ্ছে না।
    // এই অবস্থায় "কোন বিভাগে এই মুহূর্তে সবচেয়ে বেশি কাজ আটকে আছে" দিয়ে বাধা-বিভাগ ধরা
    // হয় — এর জন্য কোনো "সম্পন্ন" কাজের দরকার নেই, তাই ব্যাকলগ যত বেশিই হোক, এই চার্ট
    // কখনো অদৃশ্য হবে না ──
    if(!bottleneckDeptId){
      const deptStuckCount={};
      DEPTS.forEach(d=>deptStuckCount[d.id]=0);
      activeOrders.forEach(o=>{
        const ipx=effectiveItemProgress(o);
        Object.values(ipx).forEach(itp=>DEPTS.forEach(d=>{
          const cur=itp&&itp[d.id];
          if(cur&&cur.start&&!cur.end)deptStuckCount[d.id]++;
        }));
      });
      let stuckBest=0;
      DEPTS.forEach(d=>{if(deptStuckCount[d.id]>stuckBest){stuckBest=deptStuckCount[d.id];bottleneckDeptId=d.id;bottleneckDeptBn=d.bn}});
    }
    // ── ব্যাকলগ প্রবণতা: বাধা-বিভাগে প্রতি মাসে কতটা কাজ ঢুকছে (শুরু হয়েছে) বনাম কতটা বের
    // হচ্ছে (শেষ হয়েছে), গত ৬ মাস। ঢোকা যদি বের হওয়ার চেয়ে বেশি হতে থাকে, ব্যাকলগ বাড়ছে —
    // শুধু কর্মী/সময় বাড়িয়ে সমাধান হবে না, অর্ডার নেওয়ার হারও পুনর্বিবেচনা করতে হবে ──
    const backlogTrend=(()=>{
      if(!bottleneckDeptId)return null;
      const nowB=new Date();
      const monthsB=[];
      for(let i=5;i>=0;i--){
        const d=new Date(nowB.getFullYear(),nowB.getMonth()-i,1);
        monthsB.push({y:d.getFullYear(),m:d.getMonth()});
      }
      const inCounts=Array(6).fill(0),outCounts=Array(6).fill(0);
      activeOrders.forEach(o=>{
        const ipx=effectiveItemProgress(o);
        Object.values(ipx).forEach(itp=>{
          const cur=itp&&itp[bottleneckDeptId];
          if(!cur)return;
          if(cur.start){
            const sd=parseISO(cur.start);
            monthsB.forEach((mo,idx)=>{if(sd.getUTCFullYear()===mo.y&&sd.getUTCMonth()===mo.m)inCounts[idx]++});
          }
          if(cur.end){
            const ed=parseISO(cur.end);
            monthsB.forEach((mo,idx)=>{if(ed.getUTCFullYear()===mo.y&&ed.getUTCMonth()===mo.m)outCounts[idx]++});
          }
        });
      });
      return{labels:monthsB.map(mo=>monthName(mo.m)),inCounts,outCounts};
    })();
    // ── v4.52: পূর্ণ খরচ ধরে হিসাব — কাঠ + কর্মীদের আসল বেতন + অন্যান্য খরচ (বিস্তারিত furnitureCosting-এ) ──
    const fcost=furnitureCosting(activeOrders,spendLedger,woodSettings,laborSettings,db,bottleneckDeptId);
    const catProfitRanked=fcost.ranked;
    const throughputRanked=catProfitRanked.filter(c=>c.profitPerBnDay!==null).sort((a,b)=>b.profitPerBnDay-a.profitPerBnDay);

    // ── ৭. কর্মী-ভিত্তিক উৎপাদনশীলতা: কে কত CFT কাজে যুক্ত ছিলেন (গত ৬ মাস) ──
    const workerCft={};
    activeOrders.filter(o=>o.cust.date>=sixMonthsAgo).forEach(o=>{
      const ip=effectiveItemProgress(o);
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        const itemCft=totalCft(it.sections||[])*(it.qty||1);
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          if(!cur||!(cur.pct>=100)||!(cur.workers||[]).length)return;
          const share=itemCft/DEPTS.length/cur.workers.length;
          cur.workers.forEach(w=>{workerCft[w]=(workerCft[w]||0)+share});
        });
      });
    });
    const workerRanked=Object.entries(workerCft).map(([name,c])=>({name,cft:c})).sort((a,b)=>b.cft-a.cft);

    // ── বাৎসরিক অর্ডার ও মূল্য: ডেটা যে বছরগুলোতে আছে তার বদলে সবসময় শেষ ৬ বছর (তথ্য না থাকা
    // বছরও ০ দেখাবে), আর প্রতিটার সাথে আগের বছরের তুলনায় প্রবৃদ্ধি % ──
    const revenueInYear=(y)=>activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y).reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
    const curYearForYearly=now.getFullYear();
    const years=[];
    for(let y=curYearForYearly-5;y<=curYearForYearly;y++)years.push(y);
    const yearly=years.map(y=>{
      const yOrders=activeOrders.filter(o=>new Date(o.cust.date).getFullYear()===y);
      const revenue=yOrders.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0);
      const prevRevenue=revenueInYear(y-1);
      const growthPct=prevRevenue>0?((revenue-prevRevenue)/prevRevenue)*100:null;
      return{label:String(y),count:yOrders.length,revenue,growthPct};
    });

    // ── ("[মাস]-এর প্রবণতা") এখন আলাদা, নেভিগেট-করা যায় এমন useMemo-তে (নিচে) সরানো হয়েছে ──

    // Wood stock pie (uncut/available logs by wood type) — রঙ উপরের WOOD_CHART_COLORS থেকে
    const stockByType={};
    (woodLots||[]).forEach(lot=>{
      const availCft=(lot.logs||[]).filter(l=>!l.cut).reduce((s,l)=>s+l.cft,0);
      if(availCft<=0)return;
      stockByType[lot.woodType]=(stockByType[lot.woodType]||0)+availCft;
    });
    // ── আমার নিজের দেনা: বাকিতে কেনা খরচ + কাঠের লটে সাপ্লায়ারকে বাকি — সাপ্লায়ার অনুযায়ী ──
    const payableBySupplier={};
    (expenses||[]).filter(e=>e.payMethod==="বাকি").forEach(e=>{
      const sup=(e.supplier||"").trim()||"অজানা বিক্রেতা";
      if(!payableBySupplier[sup])payableBySupplier[sup]={name:sup,phone:e.supplierPhone||"",amount:0,items:0,kind:"খরচ"};
      payableBySupplier[sup].amount+=parseFloat(e.total)||0;
      payableBySupplier[sup].items+=1;
      if(e.supplierPhone&&!payableBySupplier[sup].phone)payableBySupplier[sup].phone=e.supplierPhone;
    });
    (woodLots||[]).forEach(lot=>{
      const cost=(lot.logs||[]).reduce((s,l)=>s+l.cft,0)*(parseFloat(lot.ratePerCft)||0);
      const paid=(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const rem=cost-paid;
      if(rem<=0)return;
      const sup=(lot.supplier||"").trim()||"অজানা কাঠ সাপ্লায়ার";
      if(!payableBySupplier[sup])payableBySupplier[sup]={name:sup,phone:lot.supplierPhone||"",amount:0,items:0,kind:"কাঠ"};
      else if(payableBySupplier[sup].kind==="খরচ")payableBySupplier[sup].kind="খরচ + কাঠ";
      payableBySupplier[sup].amount+=rem;
      payableBySupplier[sup].items+=1;
      if(lot.supplierPhone&&!payableBySupplier[sup].phone)payableBySupplier[sup].phone=lot.supplierPhone;
    });
    const payables=Object.values(payableBySupplier).sort((a,b)=>b.amount-a.amount);
    const totalPayable=payables.reduce((s,p)=>s+p.amount,0);

    // ── ৪. বিভাগভিত্তিক গড় সময় — সম্পন্ন হওয়া সব বিভাগীয় কাজ থেকে (কোথায় বাধা আছে বোঝার জন্য) ──
    const deptDurations={};
    DEPTS.forEach(d=>deptDurations[d.id]=[]);
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      Object.values(ip).forEach(itemProg=>{
        DEPTS.forEach(d=>{
          const cur=itemProg&&itemProg[d.id];
          if(cur&&cur.start&&cur.end){
            const days=daysBetween(cur.start,cur.end);
            if(days>=0)deptDurations[d.id].push(days);
          }
        });
      });
    });
    const deptAvg=DEPTS.map(d=>{
      const list=deptDurations[d.id];
      return{id:d.id,bn:d.bn,avg:list.length?list.reduce((s,v)=>s+v,0)/list.length:null,count:list.length};
    });
    const deptAvgMax=Math.max(...deptAvg.map(d=>d.avg||0),0.0001);

    // ── ৩. আটকে থাকা অর্ডার — শুরু হয়েছে কিন্তু শেষ হয়নি, নিজের বিভাগের স্বাভাবিক সময়ের চেয়ে অনেক বেশি সময় ধরে ──
    const stuckThreshold=(deptId)=>{
      const d=deptAvg.find(x=>x.id===deptId);
      if(d&&d.avg&&d.count>=3)return Math.max(14,d.avg*AL(alertSettings,"stuckMultiplier"));
      return AL(alertSettings,"stuckFallbackDays"); // যথেষ্ট ইতিহাস না থাকলে এই সীমা
    };
    const stuckItems=[];
    activeOrders.forEach(o=>{
      const ip=effectiveItemProgress(o);
      (o.items||[]).forEach((it,idx)=>{
        const ikey=it.itemId||`idx_${idx}`;
        DEPTS.forEach(d=>{
          const cur=(ip[ikey]||{})[d.id];
          if(cur&&cur.start&&!cur.end&&(cur.pct||0)<100){
            const daysSince=daysBetween(cur.start,todayStr());
            if(daysSince>=stuckThreshold(d.id))stuckItems.push({order:o,itemName:it.variantBn,deptBn:d.bn,daysSince,pct:cur.pct||0});
          }
        });
      });
    });
    stuckItems.sort((a,b)=>b.daysSince-a.daysSince);

    // ── ৫. পে-রোল বনাম উৎপাদন: মাসিক মজুরি ÷ সেই মাসে সম্পন্ন CFT ──
    const last6Months=[];
    for(let i=5;i>=0;i--){const d=new Date(now);d.setMonth(d.getMonth()-i);last6Months.push({y:d.getFullYear(),m:d.getMonth()})}
    const payrollProdByMonth=last6Months.map(({y,m})=>{
      let payroll=0;
      Object.entries(payrollWeeks||{}).forEach(([weekEnd,wd])=>{
        const d=parseISO(weekEnd);
        if(d.getUTCFullYear()===y&&d.getUTCMonth()===m){
          Object.entries(wd.attendance||{}).forEach(([wid,days])=>{
            const w=(workers||[]).find(x=>x.id===wid);
            if(w)payroll+=(parseFloat(days)||0)*(parseFloat(w.dailyRate)||0);
          });
        }
      });
      let cftDone=0;
      activeOrders.forEach(o=>{
        const ip=effectiveItemProgress(o);
        (o.items||[]).forEach((it,idx)=>{
          const ikey=it.itemId||`idx_${idx}`;
          const itemProg=ip[ikey]||{};
          const ends=DEPTS.map(d=>itemProg[d.id]&&itemProg[d.id].end).filter(Boolean);
          const pcts=DEPTS.map(d=>(itemProg[d.id]&&itemProg[d.id].pct)||0);
          if(ends.length===DEPTS.length&&pcts.every(p=>p>=100)){
            const lastEnd=ends.slice().sort().pop();
            const ed=parseISO(lastEnd);
            if(ed.getUTCFullYear()===y&&ed.getUTCMonth()===m)cftDone+=totalCft(it.sections||[])*(it.qty||1);
          }
        });
      });
      return{y,m,payroll,cft:cftDone,perCft:cftDone>0?payroll/cftDone:null};
    });
    const validPerCft=payrollProdByMonth.filter(p=>p.perCft!==null);
    const setLabourRate=parseFloat((laborSettings&&laborSettings.ratePerCft)||0);

    // ── ৬. যেসব মডেলে কাঠের মাপ বসানো নেই — অর্ডার এলে খরচ ও র‍্যাক হিসাব ভুল হবে ──
    const emptyWoodModels=[];
    if(db){
      Object.entries(db).forEach(([catK,cat])=>{
        Object.entries(cat.variants||{}).forEach(([vK,v])=>{
          if(isEmptyWood(v))emptyWoodModels.push({catBn:cat.bn,varBn:v.bn});
        });
      });
    }

    const stockPie=Object.entries(stockByType).map(([wt,val])=>({label:WOOD[wt].bn,value:val,color:WOOD_CHART_COLORS[wt]||"#888"}));

    // ── পুনরাবৃত্ত গ্রাহক: ফোন নম্বর ধরে কতজন একবারের বেশি অর্ডার করেছেন ──
    const byPhone={};
    activeOrders.forEach(o=>{
      const ph=(o.cust.phone||"").trim();
      if(!ph)return;
      if(!byPhone[ph])byPhone[ph]={count:0,total:0,name:o.cust.name};
      byPhone[ph].count+=1;
      byPhone[ph].total+=parseFloat(o.cust.total)||0;
    });
    const custList=Object.values(byPhone);
    const repeatCusts=custList.filter(c=>c.count>1);
    const repeatRate=custList.length?(repeatCusts.length/custList.length)*100:0;
    const repeatRevenue=repeatCusts.reduce((s,c)=>s+c.total,0);
    const repeatRevenueShare=totalRevenue>0?(repeatRevenue/totalRevenue)*100:0;

    // ── কাঠের মজুদ সতর্কতা: বর্তমান মজুদ ÷ মাসিক গড় ব্যবহার = আর কত মাস চলবে ──
    const sixMoAgo=monthsAgo(todayStr(),6);
    const consumedByType={};
    activeOrders.filter(o=>o.cust.date>=sixMoAgo).forEach(o=>{
      (o.items||[]).forEach(it=>{
        (it.sections||[]).forEach(sec=>{
          (sec.pieces||[]).forEach(p=>{
            const pw=pieceWoodType(p,sec,it.wood);
            consumedByType[pw]=(consumedByType[pw]||0)+cft((p.pc||0)*(it.qty||1),p.h,p.l,p.w);
          });
        });
      });
    });
    // ── পুনঃক্রয় বিন্দু: গড় ব্যবহার × সরবরাহে লাগা সময় + নিরাপত্তা মজুদ ──
    // কাঠ কিনে স'মিলে কাটিয়ে ব্যবহারের উপযোগী হতে যে সময় লাগে, সেটাও হিসাবে ধরা হয়
    const leadDays=AL(alertSettings,"supplyLeadDays");
    const safetyPct=AL(alertSettings,"safetyPct");
    const stockAlerts=Object.keys(WOOD).map(wt=>{
      const stock=stockByType[wt]||0;
      const monthlyUse=(consumedByType[wt]||0)/6;
      if(monthlyUse<=0)return null; // ব্যবহার না থাকলে সতর্কতার দরকার নেই
      const dailyUse=monthlyUse/30;
      const leadNeed=dailyUse*leadDays;                 // কাঠ আসতে আসতে যতটা লাগবে
      const safety=leadNeed*(safetyPct/100);            // দেরি/হঠাৎ চাহিদার জন্য বাফার
      const reorderPoint=leadNeed+safety;               // এই মজুদে নামলেই কেনার সময়
      const daysLeft=dailyUse>0?stock/dailyUse:null;
      return{wood:WOOD[wt].bn,key:wt,stock,monthlyUse,monthsLeft:stock/monthlyUse,
        reorderPoint,daysLeft,shouldOrderNow:stock<=reorderPoint,
        daysUntilOrder:dailyUse>0?Math.round((stock-reorderPoint)/dailyUse):null};
    }).filter(Boolean).sort((a,b)=>a.monthsLeft-b.monthsLeft);

    return{furnitureMonths:fcost.months,furnitureHasPayroll:fcost.hasPayroll,furnitureAvgDur:fcost.avgDur,running:withDays,yoy,totalRevenue,totalExpense,catPie,thisMonthCount:thisMonthOrders.length,avgOrderValue,totalOutstanding,yearly,stockPie,payables,totalPayable,cfInflow,cfOutflow,cfNet,deptAvg,deptAvgMax,stuckItems,payrollProdByMonth,validPerCft,setLabourRate,emptyWoodModels,repeatRate,repeatCount:repeatCusts.length,totalCustCount:custList.length,repeatRevenueShare,stockAlerts,readyNotCollected,readyValueStuck,avgProdDays,recentAvgProd,olderAvgProd,prodCount:prodTimes.length,woodPriceAlerts,catProfitRanked,throughputRanked,bottleneckDeptBn,workerRanked,backlogTrend};
  },[orders,expenses,db,woodLots,woodSettings,laborSettings,workers,payrollWeeks,alertSettings,spendLedger]);

  // ── "খরচ — ক্যাটাগরি অনুযায়ী" এখন সময়সীমা বাছাই করা যায় — এটা আলাদা, ছোট useMemo-তে রাখা
  // হয়েছে (উপরের বিশাল হিসাবের অংশ না) যাতে শুধু সময়সীমা বদলালে পুরো ড্যাশবোর্ড নতুন করে
  // হিসাব না করে, শুধু এই অংশটুকুই করে ──
  const[expRangeSelect,setExpRangeSelect]=useState("1y"); // 1m|3m|6m|1y|2y
  const expRangeData=useMemo(()=>{

    const rangeStart=new Date(now);

    else if(expRangeSelect==="1y")rangeStart.setFullYear(rangeStart.getFullYear()-1);
    else if(expRangeSelect==="2y")rangeStart.setFullYear(rangeStart.getFullYear()-2);

    const expByCat={};
    (expenses||[]).filter(e=>new Date(e.date)>=rangeStart&&e.category!=="salary").forEach(e=>{
      const cat=EXP_CATS.find(c=>c.id===e.category);
      const label=cat?cat.bn:e.category;
      expByCat[label]=(expByCat[label]||0)+(parseFloat(e.total)||0);
    });
    // ── v4.52: কর্মীদের বেতন আর এই পাইয়ে নেই — "কর্মীদের বেতন" নামে আলাদা চার্টে পুরো হিসাব দেখায়।
    // (আগে এখানে "কর্মীর অগ্রিম" আর "সাপ্তাহিক বেতন (অগ্রিম বাদে)" আলাদা দুটো ভাগ ছিল — অথচ অগ্রিম
    // বেতনেরই অংশ, তাই সেটা বিভ্রান্তিকর ছিল) ──
    const EXP_PIE_COLORS=[CHART_SOFT_TEAL,CHART_SOFT_BLUE,CHART_SOFT_ORANGE,CHART_SOFT_PURPLE,CHART_SOFT_PINK,CHART_SOFT_GREY,"#d4b26a",CHART_SOFT_GREEN];
    const expensePie=Object.entries(expByCat).sort((a,b)=>b[1]-a[1]).map(([label,value],i)=>({label,value,color:EXP_PIE_COLORS[i%EXP_PIE_COLORS.length]}));

    // ── প্রতিটা ক্যাটাগরির জন্য: সর্বোচ্চ খরচের মাস ও শীর্ষ সাপ্লায়ার — বাছাই করা সময়সীমার
    // মধ্যে। গড় মাসিক খরচ ও প্রবণতা ইচ্ছাকৃতভাবে সবসময়-ই ক্যাটাগরির পুরো ইতিহাস/স্থির ৩+৩ মাসের
    // উপর ভিত্তি করে হিসাব হয় (এগুলো "দীর্ঘমেয়াদী প্যাটার্ন" প্রশ্নের উত্তর দেয়, উপরের সময়সীমা
    // পাল্টালে এই দুটোর মানে বদলে যাওয়ার কথা না) ──
    const expCatDetail=Object.keys(expByCat).map(label=>{
      const catAll=(expenses||[]).filter(e=>{
        const cat=EXP_CATS.find(c=>c.id===e.category);
        return(cat?cat.bn:e.category)===label;
      });
      const catRange=catAll.filter(e=>new Date(e.date)>=rangeStart);
      const byMonth={};
      catRange.forEach(e=>{
        const d=new Date(e.date);
        const key=`${d.getFullYear()}-${d.getMonth()}`;
        byMonth[key]=(byMonth[key]||0)+(parseFloat(e.total)||0);
      });
      let peakMonthLabel=null,peakVal=0;
      Object.entries(byMonth).forEach(([key,val])=>{
        if(val>peakVal){peakVal=val;const[y,m]=key.split("-");peakMonthLabel=monthName(parseInt(m))+" "+y}
      });
      const bySupplier={};
      catRange.forEach(e=>{
        const s=(e.supplier||"").trim();
        if(!s)return;
        bySupplier[s]=(bySupplier[s]||0)+(parseFloat(e.total)||0);
      });
      const topSupplierEntry=Object.entries(bySupplier).sort((a,b)=>b[1]-a[1])[0];
      let avgMonthly=0;
      if(catAll.length>0){
        const earliest=new Date(Math.min(...catAll.map(e=>new Date(e.date).getTime())));
        const monthsSpan=Math.max(1,(now.getFullYear()-earliest.getFullYear())*12+(now.getMonth()-earliest.getMonth())+1);
        avgMonthly=catAll.reduce((s,e)=>s+(parseFloat(e.total)||0),0)/monthsSpan;
      }
      const monthsAgo=(n)=>{const d=new Date(now);d.setMonth(d.getMonth()-n);return d};
      const last3=catAll.filter(e=>{const d=new Date(e.date);return d>=monthsAgo(3)&&d<new Date(now.getTime()+86400000)}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      const prev3=catAll.filter(e=>{const d=new Date(e.date);return d>=monthsAgo(6)&&d<monthsAgo(3)}).reduce((s,e)=>s+(parseFloat(e.total)||0),0);
      const trendPct=prev3>0?((last3-prev3)/prev3)*100:null;
      return{label,total:expByCat[label],peakMonthLabel,peakVal,topSupplier:topSupplierEntry?topSupplierEntry[0]:null,topSupplierVal:topSupplierEntry?topSupplierEntry[1]:0,avgMonthly,trendPct};
    }).sort((a,b)=>b.total-a.total);

    return{expensePie,expCatDetail};
  },[expenses,expRangeSelect,payrollWeeks,workers]);

  // ── পেমেন্ট সংগ্রহের গতি — অর্ডার করার পর গড়ে কত দিনে পুরো টাকা পাওয়া যাচ্ছে, মাস অনুযায়ী।
  // "বছর অনুযায়ী তুলনা"-র বদলে এটা রাখা হলো, কারণ ব্যবসার নগদ প্রবাহের জন্য এটা সরাসরি
  // কাজে লাগে — কোন মাসের অর্ডারগুলো টাকা তুলতে বেশি সময় নিচ্ছে তা আগে থেকে বোঝা যায় ──
  const paymentSpeedData=useMemo(()=>{
    const now=new Date();
    const activeOrders=(orders||[]).filter(o=>!o.cancelled&&o.cust.date);
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      months.push({y:d.getFullYear(),m:d.getMonth()});
    }
    const data=months.map(({y,m})=>{
      const monthOrders=activeOrders.filter(o=>{
        const od=parseISO(o.cust.date);
        return od.getUTCFullYear()===y&&od.getUTCMonth()===m;
      });
      const daysList=[];
      monthOrders.forEach(o=>{
        const total=parseFloat(o.cust.total)||0;
        if(total<=0)return;
        const pays=[...(o.payments||[])].sort((a,b)=>new Date(a.date)-new Date(b.date));
        let running=0,paidDate=null;
        for(const p of pays){
          running+=parseFloat(p.amount)||0;
          if(running>=total){paidDate=p.date;break}
        }
        if(paidDate){
          const days=Math.round((new Date(paidDate)-parseISO(o.cust.date))/86400000);
          if(days>=0)daysList.push(days);
        }
      });
      const avgDays=daysList.length?daysList.reduce((s,d)=>s+d,0)/daysList.length:null;
      return{label:monthName(m),avgDays,paidCount:daysList.length,totalCount:monthOrders.length};
    });
    return{data};
  },[orders]);
  // ── বাকি টাকার বয়স-ভিত্তিক বিশ্লেষণ (Receivables Aging) — ব্যবসার হিসাবে এটা একটা
  // প্রতিষ্ঠিত পদ্ধতি: মোট বাকির মধ্যে কতটা সাম্প্রতিক (স্বাস্থ্যকর) আর কতটা অনেক পুরনো
  // (আদায় না হওয়ার ঝুঁকিতে) তা আলাদা করে দেখায়। আপনার ১২ লাখ+ পাওনার একটা বড় অংশ কতটা
  // ঝুঁকিপূর্ণ তা এখান থেকেই বোঝা যাবে — শুধু মোট সংখ্যা দেখে বোঝা যায় না ──
  const receivablesAgingData=useMemo(()=>{
    const now=new Date();
    const activeOrders=(orders||[]).filter(o=>!o.cancelled&&o.cust.date);
    const buckets=[
      {label:"০-৩০ দিন",min:0,max:30,total:0,count:0,color:"#16a34a"},
      {label:"৩১-৬০ দিন",min:31,max:60,total:0,count:0,color:"#84cc16"},
      {label:"৬১-৯০ দিন",min:61,max:90,total:0,count:0,color:"#f59e0b"},
      {label:"৯০-১৮০ দিন",min:91,max:180,total:0,count:0,color:"#f97316"},
      {label:"১৮০+ দিন",min:181,max:Infinity,total:0,count:0,color:RED},
    ];
    activeOrders.forEach(o=>{
      const total=parseFloat(o.cust.total)||0;
      const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
      const due=total-paid;
      if(due<=0)return;
      const ageDays=Math.round((now-parseISO(o.cust.date))/86400000);
      const bucket=buckets.find(b=>ageDays>=b.min&&ageDays<=b.max)||buckets[buckets.length-1];
      bucket.total+=due;
      bucket.count+=1;
    });
    const totalDue=buckets.reduce((s,b)=>s+b.total,0);
    return{buckets,totalDue};
  },[orders]);
  // ── মৌসুমি প্রবণতা — এখন নির্দিষ্ট সাল একাধিক বেছে নেওয়া যায় (গত ৬ বছর, চলতি বছরসহ),
  // আর মাসভিত্তিক মোট মূল্যের উপর ভিত্তি করে (আগে অর্ডার সংখ্যার গড় ছিল) ──
  const seasonYearOptions=useMemo(()=>{
    const cy=new Date().getFullYear();
    const arr=[];
    for(let y=cy;y>=cy-5;y--)arr.push(y);
    return arr;
  },[]);
  const[seasonYearsSelect,setSeasonYearsSelect]=useState(()=>new Set([new Date().getFullYear()]));
  const[profitDetailOpen,setProfitDetailOpen]=useState(false);
  const[popularYearsSelect,setPopularYearsSelect]=useState(()=>new Set([new Date().getFullYear()]));
  const popularFurnitureData=useMemo(()=>{
    const activeOrders2=(orders||[]).filter(o=>!o.cancelled);
    const selected=popularYearsSelect.size?popularYearsSelect:new Set([new Date().getFullYear()]);
    const catAgg={};
    activeOrders2.filter(o=>o.cust.date&&selected.has(parseISO(o.cust.date).getUTCFullYear())).forEach(o=>(o.items||[]).forEach(it=>{
      const catLabel=(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn.split(" ")[0]||it.code);
      // ── আগে এখানে সরাসরি নামের ভিত্তিতে গোনা হতো — কোনো পুরনো অর্ডারে catKey ডেটাবেসে না
      // পেলে সেই একই ক্যাটাগরি ভিন্ন নামে (ফলব্যাক থেকে) আলাদা এন্ট্রি হয়ে যেত, ফলে একই
      // ক্যাটাগরি দুইভাবে ভাগ হয়ে ভুল র‍্যাংকিং দেখাত। এখন পাই চার্টের মতোই স্থিতিশীল catKey
      // দিয়ে গোনা হয়, নাম শুধু দেখানোর জন্য ──
      const key=it.catKey||catLabel;

  },[orders,db,popularYearsSelect]);
  const[monthNavOffset,setMonthNavOffset]=useState(0); // 0=বর্তমান মাস, + মানে পরের মাস, - মানে আগের মাস
  const monthTrendData=useMemo(()=>{
    const now2=new Date();
    const viewedMonthIdx=((now2.getMonth()+monthNavOffset)%12+12)%12;
    const curYear2=now2.getFullYear();
    const activeOrders2=(orders||[]).filter(o=>!o.cancelled);
    const monthlyAgg={}; // key "y-m" -> {count, revenue}
    activeOrders2.forEach(o=>{
      if(!o.cust.date)return;
      const od=new Date(o.cust.date);
      const key=`${od.getFullYear()}-${od.getMonth()}`;
      monthlyAgg[key]=monthlyAgg[key]||{count:0,revenue:0};
      monthlyAgg[key].count+=1;
      monthlyAgg[key].revenue+=(parseFloat(o.cust.total)||0);
    });
    const revenueInMonthYear=(y)=>(monthlyAgg[`${y}-${viewedMonthIdx}`]||{revenue:0}).revenue;
    const trend=[];
    for(let y=curYear2-5;y<=curYear2;y++){
      const agg=monthlyAgg[`${y}-${viewedMonthIdx}`]||{count:0,revenue:0};
      const prevRevenue=revenueInMonthYear(y-1);
      const growthPct=prevRevenue>0?((agg.revenue-prevRevenue)/prevRevenue)*100:null;
      trend.push({label:String(y),count:agg.count,revenue:agg.revenue,growthPct});
    }
    return{trend,monthLabel:monthName(viewedMonthIdx)};
  },[orders,monthNavOffset]);
  const seasonData=useMemo(()=>{
    const activeOrders=(orders||[]).filter(o=>!o.cancelled);
    const selected=seasonYearsSelect.size?seasonYearsSelect:new Set([new Date().getFullYear()]);
    const monthValue=Array(12).fill(0),monthCount=Array(12).fill(0);
    activeOrders.forEach(o=>{
      if(!o.cust.date)return;
      const d=parseISO(o.cust.date);
      if(!selected.has(d.getUTCFullYear()))return;
      const m=d.getUTCMonth();
      monthValue[m]+=parseFloat(o.cust.total)||0;
      monthCount[m]+=1;
    });
    const seasonal=monthValue.map((v,i)=>{
      const prev=i>0?monthValue[i-1]:null;
      const growthPct=(prev!==null&&prev>0)?((v-prev)/prev)*100:null;
      return{month:i,value:v,count:monthCount[i],growthPct};
    });
    const seasonalMax=Math.max(...monthValue,0);
    return{seasonal,seasonalMax,selectedCount:selected.size};
  },[orders,seasonYearsSelect]);

  // ── কালেকশন বনাম খরচ (এখন "সংগ্রহ বনাম ব্যয়") আর "মাসিক আয়" — দুটোই একই মাসিক
  // সংগ্রহ/ব্যয় হিসাব ব্যবহার করে, শুধু নিজস্ব আলাদা সাল-নির্বাচন সহ। "কালেকশন" মানে সেই
  // মাসে আসলে কত টাকা হাতে এসেছে — অর্ডারের সময় নেওয়া অগ্রিম, বা আগের যেকোনো অর্ডারের বাকি
  // টাকা সেই মাসে পরিশোধ হলে সেটাও ধরা হয় (অর্ডারটা কবে করা হয়েছিল তা দিয়ে না, পেমেন্টের
  // তারিখ দিয়ে) ──
  const computeMonthlyFinance=(year)=>{
    const activeOrders=(orders||[]).filter(o=>!o.cancelled);
    return Array.from({length:12},(_,m)=>{
      const collection=activeOrders.reduce((sum,o)=>sum+(o.payments||[]).filter(p=>{
        const pd=new Date(p.date);
        return pd.getFullYear()===year&&pd.getMonth()===m;

        <div style={{fontSize:9,color:"#999",marginBottom:8}}>সেই মাসের সংগ্রহ থেকে ব্যয় (কাঠ+বেতন+খরচ) বাদ দিলে যা হাতে থাকার কথা (সংখ্যা হাজার টাকায়)।</div>
