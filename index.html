// Compress an image file to a small JPEG base64 string before storing, to avoid hitting localStorage quota
function compressImage(file,maxDim=1200,quality=0.82,maxBytes=110000){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim}
        else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        // ── ছবি যত জটিল/ভারীই হোক, ফলাফল সবসময় একটা নির্দিষ্ট সর্বোচ্চ সাইজের মধ্যে রাখা হয় —
        // একটা অর্ডারে একাধিক ছবি (রেফারেন্স + ডেলিভারি) জমলেও Firestore-এর প্রতি-ডকুমেন্ট
        // সাইজ সীমা (~1MB) পার হয়ে যাওয়ার ঝুঁকি অনেক কমে যায়। প্রথমে স্বাভাবিক কোয়ালিটিতে
        // চেষ্টা, তারপর দরকার হলে ধাপে ধাপে কোয়ালিটি কমিয়ে, তাতেও না হলে মাপ ছোট করে পুনরায়
        // এনকোড — সীমার মধ্যে না আসা পর্যন্ত (বা যুক্তিসঙ্গত কয়েকবার চেষ্টার পর যা পাওয়া যায় তাই) ──
        let q=quality;
        let result=canvas.toDataURL("image/jpeg",q);
        let attempts=0;
        while(result.length>maxBytes&&attempts<8){
          attempts++;
          if(q>0.35){
            q=Math.max(0.35,q-0.12);
          }else{
            w=Math.round(w*0.85);h=Math.round(h*0.85);
            canvas.width=w;canvas.height=h;
            ctx.drawImage(img,0,0,w,h);
          }
          result=canvas.toDataURL("image/jpeg",q);
        }
        resolve(result);
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    reader.onerror=()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

const FS_SUPPORTED=typeof window!=="undefined"&&"showDirectoryPicker" in window;
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("rf_fs_store",1);
    req.onupgradeneeded=()=>{req.result.createObjectStore("handles")};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbSet(key,val){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readwrite");
    tx.objectStore("handles").put(val,key);
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbGet(key){
  const dbi=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=dbi.transaction("handles","readonly");
    const req=tx.objectStore("handles").get(key);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}
async function pickImageFolder(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await window.showDirectoryPicker();
    await idbSet("imageFolder",handle);
    return handle;
  }catch(e){return null}
}
async function getImageFolderHandle(){
  if(!FS_SUPPORTED)return null;
  try{
    const handle=await idbGet("imageFolder");
    if(!handle)return null;
    const perm=await handle.queryPermission({mode:"readwrite"});
    if(perm==="granted")return handle;
    const req=await handle.requestPermission({mode:"readwrite"});
    if(req==="granted")return handle;
    return null;
  }catch(e){return null}
}
function genImgFileName(prefix,index,file){
  const ext=(file.name.match(/\.[0-9a-z]+$/i)||[".jpg"])[0];
  return`${prefix}_${index}${ext}`.replace(/[^a-zA-Z0-9_.\-]/g,"_");
}
function sanitizeFolderName(name){

function orderImageFolder(kind,order){
  const topFolder=kind==="finished"?"Finished order":"Order reference";
  const d=(order&&order.cust&&order.cust.date)?new Date(order.cust.date):new Date();
  const year=isNaN(d.getTime())?new Date().getFullYear():d.getFullYear();
  const monthIdx=isNaN(d.getTime())?new Date().getMonth():d.getMonth();
  const monthFolder=`${String(monthIdx+1).padStart(2,"0")}-${monthName(monthIdx)}`;
  return`${topFolder}/${year}/${monthFolder}`;
}
// relPath এ "/" থাকলে সেটাকে সাবফোল্ডার ধরে সেই অনুযায়ী ফোল্ডার তৈরি/খোঁজা হয় — না থাকলে আগের মতোই রুট ফোল্ডারে সরাসরি
async function resolveFolderForPath(rootFolder,relPath){
  const parts=relPath.split("/");
  const baseName=parts.pop();
  let dir=rootFolder;
  for(const part of parts){
    if(!part)continue;
    dir=await dir.getDirectoryHandle(part,{create:true});
  }
  return{dir,baseName};
}
async function saveFullResImage(file,relPath){
  const folder=await getImageFolderHandle();
  if(!folder)return false;
  try{
    const{dir,baseName}=await resolveFolderForPath(folder,relPath);
    const fileHandle=await dir.getFileHandle(baseName,{create:true});
    const writable=await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    return true;
  }catch(e){return false}
}

const rackCode=(prefix,w,h)=>{const tm={0.5:"5",1:"1",1.25:"125",1.5:"15",2:"2",2.5:"25",3:"3"};const t=tm[w]||String(Math.round(w*100));return`${prefix}${t}${String(Math.round(h)).padStart(2,"0")}`};

// আপনি যে রেঞ্জ ঠিক করে দেবেন, সেই রেঞ্জের সব H একটা কোডেই মিশে যাবে। রেঞ্জটা যে কার্ড থেকে
// দেওয়া হয়, সেই কার্ডের নিজের H-ই কোডে থাকে। Transport Slip ও Usage Analysis দুই জায়গাতেই
// এই একই ফাংশন ব্যবহার হয়, যাতে কোড সবসময় মিলে যায় ──
function effectiveHeight(h,woodKey,w,woodSettings){
  const bands=(woodSettings&&woodSettings.__rackBands)||[];
  const match=bands.find(b=>b.wood===woodKey&&parseFloat(b.w)===parseFloat(w)&&h>=parseFloat(b.from)&&h<=parseFloat(b.to));
  if(match)return parseFloat(match.rep);
  return h;
}
// একটা নির্দিষ্ট W×H×L এর জন্য আলাদা (বিভক্ত) র‍্যাক অনুমোদিত থাকলে তার নিজস্ব ৩-মাত্রিক কোড, নাহলে স্বাভাবিক ২-মাত্রিক কোড
function pieceRackInfo(wood,w,h,l,woodSettings,rackSplits){
  const effH=effectiveHeight(h,wood,w,woodSettings);
  const splitMatch=(rackSplits||[]).find(s=>s.wood===wood&&s.w===w&&s.h===effH&&s.l===l);
  if(splitMatch)return{code:splitMatch.code,isSplit:true,w,h:effH,l};
  return{code:rackCode(wood,w,effH),isSplit:false,w,h:effH,l:null};
}

    if(picked)return parseFloat(picked.rate)||0;
    return parseFloat(hist[0].rate)||0; // অর্ডার সবচেয়ে পুরনো এন্ট্রির আগের হলে প্রথমটাই ধরা হবে

function pieceWoodRate(p,sec,item,order,woodSettings){

  if(item.woodRateSnapshots&&parseFloat(item.woodRateSnapshots[pw])>0)return parseFloat(item.woodRateSnapshots[pw]);

}

// ── বাস্তবসম্মত ডেলিভারি সময়: গড় উৎপাদন সময়কে এখনকার কাজের চাপ দিয়ে সমন্বয় করা হয় —

function computeRealisticDeliveryDays(orders){

      DEPTS.forEach(d=>{const cur=(ip[ikey]||{})[d.id];pcts.push((cur&&cur.pct)||0);if(cur&&cur.end&&cur.end>lastEnd)lastEnd=cur.end});
    });

      const days=daysBetween(o.cust.date,lastEnd);
      if(days>=0)prodTimes.push(days);
    }

  const currentRunningCount=activeOrders.filter(o=>!o.delivered&&!isOrderFullyProgressed(o)).length;

}

function DateInput({value,onChange,disabled,accent}){
  const boxStyle={width:"100%",border:`1.5px solid ${disabled?"#eee":"#e0e0e0"}`,borderRadius:9,padding:"10px 11px",fontSize:13,background:disabled?"#f5f5f5":"white",color:disabled?"#999":(value?"#111":"#999"),boxSizing:"border-box",fontWeight:value?700:400,display:"flex",alignItems:"center",justifyContent:"space-between"};
  return<div style={{position:"relative"}}>
    <div style={boxStyle}><span>{value?fmtDate(value):"dd/mm/yyyy"}</span><span style={{color:accent||"#999",fontSize:14}}>📅</span></div>
    <input type="date" value={value||""} disabled={disabled} onChange={e=>onChange(e.target.value)} style={{position:"absolute",inset:0,opacity:0,width:"100%",height:"100%",border:"none",cursor:disabled?"default":"pointer"}}/>
  </div>
}

function WhatsAppSendBtn({targetRef,phone,label}){
  const[state,setState]=useState("idle"); // idle | preparing | ready
  const[pendingFile,setPendingFile]=useState(null);
  const[pendingBlob,setPendingBlob]=useState(null);

  const prepare=async()=>{
    if(!targetRef.current||typeof html2canvas==="undefined")return;
    setState("preparing");
    try{
      const canvas=await html2canvas(targetRef.current,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
      canvas.toBlob((blob)=>{
        if(!blob){setState("idle");return}
        setPendingFile(new File([blob],"receipt.png",{type:"image/png"}));
        setPendingBlob(blob);
        setState("ready");
      },"image/png");
    }catch(e){alert("ছবি তৈরি করতে সমস্যা হয়েছে: "+e.message);setState("idle")}
  };
  // WhatsApp-এর নিজস্ব নিয়মে কোনো ওয়েবসাইট থেকে ছবিসহ কোনো নির্দিষ্ট নম্বরে সরাসরি পাঠানো
  // (কন্টাক্ট বেছে নেওয়া ছাড়া) সম্ভব না — এটা WhatsApp নিজেই নিয়ন্ত্রণ করে। তবে এই পদ্ধতিতে
  // অন্তত "কন্টাক্ট খোঁজা"র ধাপটা এড়ানো যায় — সরাসরি সঠিক চ্যাটে চলে যাবে।
  const sendNow=()=>{
    if(pendingBlob){
      const url=URL.createObjectURL(pendingBlob);
      const a=document.createElement("a");a.href=url;a.download="receipt.png";document.body.appendChild(a);a.click();document.body.removeChild(a);
      window.open(`https://wa.me/${toIntlPhone(phone)}`,"_blank");
    }
    setState("idle");setPendingFile(null);setPendingBlob(null);
  };

  if(state==="ready")return<div className="no-print" style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:2}}>
    <button onClick={sendNow} style={{background:"#0d9488",color:"white",border:"none",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5,boxShadow:"0 0 0 3px rgba(13,148,136,0.25)"}}>✅ প্রস্তুত — এখন ট্যাপ করুন</button>
    <span style={{fontSize:8,color:"#0d9488",maxWidth:150,lineHeight:1.3}}>ছবি ডাউনলোড হবে ও সঠিক চ্যাট খুলবে — গ্যালারি থেকে অ্যাটাচ করে পাঠান</span>
  </div>;
  return<button className="no-print" onClick={prepare} disabled={state==="preparing"} style={{background:"#16a34a",color:"white",border:"none",borderRadius:7,padding:"6px 13px",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:5}}>{state==="preparing"?"⏳ তৈরি হচ্ছে...":`📤 ${label||"WhatsApp-এ পাঠান"}`}</button>;
}

  const[fieldDraft,setFieldDraft]=useState("");

    </div>;
  };
  // ── পেমেন্ট এন্ট্রিও এখানেই একটা একটা করে এডিট/মোছা যায়, একই নিয়মে (বাকির চেয়ে বেশি
  // বসানো যাবে না, নতুন পেমেন্ট যোগ করার সময় যেমন হয়) ──
  const[editingPayIdx,setEditingPayIdx]=useState(null);
  const[payDraft,setPayDraft]=useState({date:"",amount:"",note:""});

  const recalcTotal=(newItems)=>newItems.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseFloat(it.qty)||1),0);
  const startEditItem=(i)=>{
    const it=items[i];
    setEditIdx(i);
    setEditForm({catKey:it.catKey,varKey:it.varKey,wood:it.wood,qty:it.qty,price:it.price||"",notes:it.notes||""});
  };
  const saveEditItem=()=>{
    const cat=db[editForm.catKey];
    const variant=cat.variants[editForm.varKey];
    const newItems=[...items];
    const keepSections=newItems[editIdx].varKey===editForm.varKey?newItems[editIdx].sections:JSON.parse(JSON.stringify(variant.sections));
    newItems[editIdx]={...newItems[editIdx],catKey:editForm.catKey,varKey:editForm.varKey,variantBn:variant.bn,code:variant.code,tier:variant.tier||"M",wood:editForm.wood,woodBn:WOOD[editForm.wood].bn,qty:parseInt(editForm.qty)||1,price:editForm.price,notes:editForm.notes,sections:keepSections,itemId:newItems[editIdx].itemId||("item_"+Date.now()+"_"+Math.random().toString(36).slice(2,7))};
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
    setEditIdx(null);setEditForm(null);

  const removeItem=(i)=>{
    if(!window.confirm("এই ফার্নিচারটি অর্ডার থেকে বাদ দিতে চান?"))return;

    const newItems=[...items,item];
    onUpdateOrder({...order,items:newItems,cust:{...cust,total:recalcTotal(newItems)}});
    setNewItem({catKey:"",varKey:"",wood:"S",qty:1,price:"",notes:""});setAddingNew(false);
  };
  const addNewImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const newOnes=[];
    const categoryFolder=orderImageFolder("ref",order);
    for(let idx=0;idx<files.length;idx++){
      const compressed=await compressImage(files[idx]);
      if(!compressed)continue;
      const fileIdx=images.length+newOnes.length+1;
      const baseFileName=genImgFileName(`${order.no}_ref`,fileIdx,files[idx]);
      const relPath=`${categoryFolder}/${baseFileName}`;
      const savedFull=await saveFullResImage(files[idx],relPath);
      newOnes.push({src:compressed,caption:`ছবি ${fileIdx}`,fileName:savedFull?relPath:null});
    }
    if(newOnes.length>0)onUpdateOrder({...order,refImgs:[...images,...newOnes],refImg:undefined});
  };
  const removeImage=(idx)=>{
    const updated=images.filter((_,i)=>i!==idx);
    onUpdateOrder({...order,refImgs:updated,refImg:undefined});
  };
  const updateImgCaption=(idx,val)=>{

  return<div style={{fontSize:11}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:6}}>
            <select value={newItem.wood} onChange={e=>setNewItem({...newItem,wood:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}>

            <input type="number" min={1} value={newItem.qty} placeholder="1" onChange={e=>setNewItem({...newItem,qty:e.target.value})} style={{border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10}}/>

          <div style={{marginBottom:6}}><input type="number" value={newItem.price} onChange={e=>setNewItem({...newItem,price:e.target.value})} placeholder="মূল্য (৳)" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"7px 8px",fontSize:11,fontWeight:700,color:"#166534",boxSizing:"border-box"}}/></div>
          <textarea rows={2} value={newItem.notes} onChange={e=>setNewItem({...newItem,notes:e.target.value})} placeholder="বিশেষ নির্দেশনা" style={{width:"100%",border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:10,marginBottom:7,resize:"vertical"}}/>

/* ── SLIP 3: DEPT TRACKING ── */
function S3({order,onPrint,onUpdateOrder,workers}){
  const{cust,items,no,printLogs}=order;
  // বাড়ানোর সময় কোনো বাধা নেই, কিন্তু কমানোর সময় নিশ্চিত করে নেওয়া হয় — ভুলবশত টেনে
  // কমে গেলে যাতে অজান্তেই সংরক্ষিত অগ্রগতি হারিয়ে না যায়
  const dragStartRef=useRef({});
  const ip=effectiveItemProgress(order);
  const itemKey=(it,idx)=>it.itemId||`idx_${idx}`;

  const getDept=(ikey,deptId)=>((ip[ikey]||{})[deptId])||{start:"",end:"",pct:0,workers:[]};
  const patchDept=(ikey,deptId,patch)=>{
    const curItem=ip[ikey]||{};
    const cur=curItem[deptId]||{start:"",end:"",pct:0,workers:[]};
    onUpdateOrder({...order,itemProgress:{...ip,[ikey]:{...curItem,[deptId]:{...cur,...patch}}}});
  };
  const setStart=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    const newPct=val&&!cur.end?Math.max(cur.pct,20):cur.pct;
    patchDept(ikey,deptId,{start:val,pct:newPct});
  };
  const setEnd=(ikey,deptId,val)=>{
    const cur=getDept(ikey,deptId);
    patchDept(ikey,deptId,{end:val,pct:val?100:cur.pct});
  };
  const setPct=(ikey,deptId,val)=>patchDept(ikey,deptId,{pct:parseInt(val)});
  const toggleWorker=(ikey,deptId,name)=>{
    const cur=getDept(ikey,deptId);
    const list=cur.workers||[];
    const next=list.includes(name)?list.filter(w=>w!==name):[...list,name];
    patchDept(ikey,deptId,{workers:next});
  };
  const deptWorkers=(payDept)=>{
    const active=(workers||[]).filter(w=>w.active!==false);
    const matched=active.filter(w=>w.department===payDept);
    return matched.length?matched:active;
  };
  // সামগ্রিক অগ্রগতি: সব ফার্নিচারের সব বিভাগের গড়
  // প্রতিটা আইটেমের ওজনযুক্ত % বের করে, তারপর সব আইটেম মিলিয়ে সাধারণ গড় — যাতে একটা
  // আইটেমের বিভাগীয় ওজন অন্য আইটেমের সংখ্যায় প্রভাব না ফেলে
  const itemWeightedPcts=items.map((it,idx)=>{
    const ikey=itemKey(it,idx);
    return DEPTS.reduce((s,d)=>s+(getDept(ikey,d.id).pct||0)*(DEPT_WEIGHTS[d.id]||0),0);
  });
  const overallPct=itemWeightedPcts.length?Math.round(itemWeightedPcts.reduce((s,v)=>s+v,0)/itemWeightedPcts.length):0;

  return<div style={{fontSize:11}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",color:"#6d28d9"}}>
      <span style={{fontWeight:800,fontSize:13}}>সামগ্রিক অগ্রগতি: {overallPct}%</span>
      <PrintBtn onPrint={()=>onPrint("s3")}/>
    </div>
    <Hdr title="বিভাগ ট্র্যাকিং কপি" sub="Department Tracking" no={no} bg="#6d28d9"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f5f3ff",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="মোবাইল" v={cust.phone}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/>
      </div>
      {items.length>1&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#1d4ed8"}}>ℹ️ এই অর্ডারে {items.length}টা আলাদা ফার্নিচার আছে — প্রতিটার অগ্রগতি ও কর্মী আলাদাভাবে ট্র্যাক করুন, কারণ ভিন্ন কর্মীর হাতে যেতে পারে।</div>}

      {/* Interactive (screen only) — প্রতিটা ফার্নিচার আলাদা */}
      <div className="no-print">
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          const itemAllPcts=DEPTS.map(d=>getDept(ikey,d.id).pct||0);
          const itemPct=Math.round(DEPTS.reduce((s,d,i)=>s+itemAllPcts[i]*(DEPT_WEIGHTS[d.id]||0),0));
          return<div key={ikey} style={{marginBottom:18}}>
            <div style={{background:"#6d28d9",color:"white",borderRadius:"9px 9px 0 0",padding:"9px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{fontWeight:700,fontSize:12}}>[{it.code}] {it.variantBn}<span style={{fontWeight:400,opacity:0.85}}> · {it.woodBn} × {it.qty}</span></div>
              <div style={{fontWeight:800,fontSize:12}}>{itemPct}%</div>
            </div>
            <div style={{border:"1px solid #ede9fe",borderTop:"none",borderRadius:"0 0 9px 9px",padding:"10px 12px",background:"#faf9ff"}}>
              {DEPTS.map(d=>{
                const cur=getDept(ikey,d.id);
                const assigned=cur.workers||[];
                const barColor=cur.pct>=100?"#16a34a":cur.pct>=50?"#f59e0b":"#dc2626";
                const pool=deptWorkers(d.payDept);
                return<div key={d.id} style={{background:"white",border:"1px solid #ede9fe",borderRadius:9,padding:"9px 11px",marginBottom:7}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                    <div style={{fontWeight:700,fontSize:11,color:"#6d28d9"}}>{d.bn}</div>
                    <div style={{display:"flex",gap:4}}>
                      {!cur.start&&<button onClick={()=>setStart(ikey,d.id,todayStr())} style={{background:"#f0fdf4",border:"1px solid #86efac",color:"#166534",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>▶ আজ শুরু</button>}
                      {cur.start&&!cur.end&&<button onClick={()=>setEnd(ikey,d.id,todayStr())} style={{background:"#eff6ff",border:"1px solid #93c5fd",color:"#1d4ed8",borderRadius:6,padding:"3px 8px",fontSize:9,fontWeight:700}}>■ আজ শেষ</button>}
                      {cur.end&&<span style={{fontSize:9,color:"#16a34a",fontWeight:700}}>✓ সম্পন্ন</span>}
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শুরুর তারিখ</div><DateInput value={cur.start} onChange={v=>setStart(ikey,d.id,v)} accent="#6d28d9"/></div>
                    <div><div style={{fontSize:8,color:"#888",marginBottom:2}}>শেষের তারিখ</div><DateInput value={cur.end} onChange={v=>setEnd(ikey,d.id,v)} accent="#6d28d9"/></div>
                  </div>
                  <input type="range" min="0" max="100" value={cur.pct}
                    onMouseDown={()=>{dragStartRef.current[`${ikey}_${d.id}`]=cur.pct}}
                    onTouchStart={()=>{dragStartRef.current[`${ikey}_${d.id}`]=cur.pct}}
                    onChange={e=>setPct(ikey,d.id,e.target.value)}
                    onMouseUp={e=>{
                      const key=`${ikey}_${d.id}`;const startVal=dragStartRef.current[key];const endVal=parseInt(e.target.value);
                      if(startVal!==undefined&&endVal<startVal){
                        if(!window.confirm(`অগ্রগতি ${startVal}% থেকে কমিয়ে ${endVal}% করতে চান?`))setPct(ikey,d.id,startVal);
                      }
                      delete dragStartRef.current[key];
                    }}
                    onTouchEnd={e=>{
                      const key=`${ikey}_${d.id}`;const startVal=dragStartRef.current[key];const endVal=cur.pct;
                      if(startVal!==undefined&&endVal<startVal){
                        if(!window.confirm(`অগ্রগতি ${startVal}% থেকে কমিয়ে ${endVal}% করতে চান?`))setPct(ikey,d.id,startVal);
                      }
                      delete dragStartRef.current[key];
                    }}
                    style={{width:"100%",accentColor:barColor}}/>
                  <div style={{textAlign:"right",fontSize:10,fontWeight:800,color:barColor,marginBottom:6}}>{cur.pct}%{cur.pct>=100?" ✅":""}</div>
                  <div style={{fontSize:8,color:"#888",marginBottom:4}}>{d.payDept} বিভাগের কর্মী</div>
                  {pool.length===0?<div style={{fontSize:9,color:"#aaa"}}>পে-রোলে এই বিভাগের কোনো কর্মী নেই</div>:
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {pool.map(w=><button key={w.id} onClick={()=>toggleWorker(ikey,d.id,w.name)} style={{background:assigned.includes(w.name)?deptColor(w.department):"#f3f4f6",color:assigned.includes(w.name)?"white":"#555",border:"none",borderRadius:20,padding:"4px 10px",fontSize:9,fontWeight:600}}>{assigned.includes(w.name)?"✓ ":""}{w.name}</button>)}
                  </div>}
                </div>
              })}
            </div>
          </div>
        })}
      </div>

      {/* Print-only static table — প্রতিটা ফার্নিচার আলাদা টেবিলে */}
      <div className="print-only-table" style={{display:"none"}}>
        {items.map((it,idx)=>{
          const ikey=itemKey(it,idx);
          return<div key={ikey} style={{marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:11,marginBottom:4}}>[{it.code}] {it.variantBn} — {it.woodBn} × {it.qty}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
              <thead><tr style={{background:"#6d28d9",color:"white"}}>{["বিভাগ","দায়িত্বে","শুরু","শেষ","স্বাক্ষর"].map(h=><th key={h} style={{padding:"6px 5px",textAlign:"left",fontWeight:700}}>{h}</th>)}</tr></thead>
              <tbody>{DEPTS.map((d,i)=>{const cur=getDept(ikey,d.id);return<tr key={d.id} style={{background:i%2===0?"#f5f3ff":"white",borderBottom:"1px solid #ede9fe"}}><td style={{padding:"8px 5px",fontWeight:600}}>{d.bn} ({cur.pct}%)</td><td style={{padding:"8px 5px",fontSize:9}}>{(cur.workers||[]).join(", ")||"—"}</td><td style={{padding:"8px 5px",color:cur.start?"#333":"#bbb"}}>{cur.start?fmtDate(cur.start):"___/___"}</td><td style={{padding:"8px 5px",color:cur.end?"#333":"#bbb"}}>{cur.end?fmtDate(cur.end):"___/___"}</td><td style={{padding:"8px 5px",color:"#bbb"}}>________</td></tr>})}</tbody>
            </table>
          </div>
        })}
      </div>

      <div className="no-print"><PrintLog log={printLogs?.s3}/></div>
    </div>
  </div>
}

/* ── SLIP 4: CARPENTER (editable wood, saves as new variant) ── */
function S4({order,onPrint,db,saveDb,onUpdateOrder}){
  const{cust,items,no,printLogs,refImg,refImgs}=order;
  const images=refImgs&&refImgs.length?refImgs:(refImg?[{src:refImg,caption:"রেফারেন্স ছবি"}]:[]);
  const[editIdx,setEditIdx]=useState(null);
  const[editSections,setEditSections]=useState(null);

  const startEdit=(idx)=>{setEditIdx(idx);setEditSections(JSON.parse(JSON.stringify(items[idx].sections)))};
  const updatePiece=(si,pi,field,val)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces[pi][field]=field==="bn"?val:(parseFloat(val)||0);setEditSections(ns)};
  const removePiece=(si,pi)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.splice(pi,1);setEditSections(ns)};
  const addPieceToSection=(si)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.push({bn:"নতুন কাঠ",pc:1,h:24,l:12,w:1});setEditSections(ns)};

  const saveEditedItem=()=>{
    const item=items[editIdx];
    const suffix=String(Math.floor(Math.random()*900+100));
    const newCode=`${item.code}-M${suffix}`;
    const newName=`${item.variantBn.replace(/ \(কাস্টম.*\)/,"")} (কাস্টম-${suffix})`;
    // Save new variant to DB
    if(item.catKey&&db[item.catKey]){
      const vKey=`${item.varKey||item.catKey}_mod_${suffix}`;
      const nd=JSON.parse(JSON.stringify(db));
      nd[item.catKey].variants[vKey]={bn:newName,code:newCode,sections:editSections};
      saveDb(nd);
    }
    const newItems=[...items];
    newItems[editIdx]={...item,sections:editSections,code:newCode,variantBn:newName};
    onUpdateOrder({...order,items:newItems});
    setEditIdx(null);setEditSections(null);
  };

  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#92400e"}}><PrintBtn onPrint={()=>onPrint("s4")}/></div>
    <Hdr title="কার্পেন্টারের কপি" sub="Carpenter Copy" no={no} bg="#92400e"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#fef3c7",borderRadius:7,padding:"8px",marginBottom:10}}><IR l="গ্রাহক" v={cust.name}/><IR l="ডেলিভারি" v={fmtDate(cust.delivery)}/></div>
      {images.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:9,color:"#92400e",fontWeight:700,marginBottom:5,textAlign:"center"}}>গ্রাহকের রেফারেন্স ছবি — এই অনুযায়ী তৈরি করুন</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {images.map((img,i)=><div key={i} style={{textAlign:"center"}}><img src={img.src} className="ref-img" alt="ref" onClick={()=>(img.fileName&&FS_SUPPORTED)?openFullResImageForPrint(img.fileName):openLightbox(img.src)} style={{maxHeight:120,cursor:"pointer"}}/><div style={{fontSize:8,color:"#888",marginTop:2}}>{img.caption}</div></div>)}
        </div>
      </div>}
      {items.map((it,i)=><div key={i} style={{border:"1.5px solid #92400e",borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{background:"#92400e",color:"white",padding:"7px 11px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:11}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:9,opacity:.9,marginTop:1}}>কাঠ: {it.woodBn} ({it.wood}) | পরিমাণ: {it.qty}</div></div>
          {editIdx!==i&&<button className="no-print" onClick={()=>startEdit(i)} style={{background:"white",color:"#92400e",border:"none",borderRadius:5,padding:"4px 8px",fontSize:9,fontWeight:700}}>✏️ এডিট</button>}
        </div>
        <div style={{padding:"8px 11px"}}>
          {it.notes&&<div style={{background:"#fef9c3",borderRadius:5,padding:"5px 8px",marginBottom:6,fontSize:9,fontWeight:600}}>⚠ {it.notes}</div>}
          {editIdx===i?<>
            {editSections.map((sec,si)=><div key={si} style={{marginBottom:7,background:"#fffbeb",borderRadius:6,padding:6}} className="no-print">
              <div style={{fontWeight:700,fontSize:9,color:"#92400e",marginBottom:4}}>{sec.name}</div>
              {sec.pieces.map((p,pi)=><div key={pi} style={{background:"white",border:"1px solid #f0e0c0",borderRadius:6,padding:6,marginBottom:5}}>
                <input value={p.bn} onChange={e=>updatePiece(si,pi,"bn",e.target.value)} placeholder="কাঠের নাম" style={{width:"100%",fontSize:11,border:"1px solid #e5e5e5",borderRadius:4,padding:"5px 7px",marginBottom:4,boxSizing:"border-box"}}/>
                <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap"}}>
                  {["w","h","l","pc"].map((f,fi)=><div key={f} style={{display:"flex",alignItems:"center",gap:2,flex:"1 1 21%",minWidth:44}}>
                    <span style={{fontSize:8,color:"#92400e",flexShrink:0}}>{["W","H","L","পিস"][fi]}</span>
                    <input type="number" step="0.25" value={p[f]} onChange={e=>updatePiece(si,pi,f,e.target.value)} style={{width:"100%",fontSize:11,border:"1px solid #e5e5e5",borderRadius:4,padding:"5px 3px",minWidth:0,boxSizing:"border-box"}}/>
                  </div>)}
                  <button onClick={()=>removePiece(si,pi)} style={{background:"#fee2e2",border:"none",borderRadius:5,color:RED,fontSize:12,padding:"6px 9px",flexShrink:0}}>✕</button>
                </div>
              </div>)}
              <button onClick={()=>addPieceToSection(si)} style={{fontSize:9,background:"#fef3c7",border:"1px dashed #92400e",borderRadius:4,padding:"3px 8px",marginTop:3,color:"#92400e"}}>+ পিস যোগ</button>
            </div>)}
            <div className="no-print" style={{display:"flex",gap:6,marginTop:6}}>
              <button onClick={()=>{setEditIdx(null);setEditSections(null)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:6,padding:"7px",fontSize:10}}>বাতিল</button>
              <button onClick={saveEditedItem} style={{flex:2,background:"#92400e",color:"white",border:"none",borderRadius:6,padding:"7px",fontSize:10,fontWeight:700}}>নতুন কোডে সংরক্ষণ করুন</button>
            </div>
          </>:it.sections.map((sec,j)=><div key={j} style={{marginBottom:7}}>
            <div style={{fontWeight:700,fontSize:9,color:"#92400e",borderBottom:"1px solid #fde68a",paddingBottom:2,marginBottom:3}}>{sec.name}{sec.woodOverride&&<span style={{marginLeft:6,background:"#ede9fe",color:"#6d28d9",borderRadius:4,padding:"1px 6px",fontSize:8,fontWeight:700}}>সবসময় {WOOD[sec.woodOverride]?.bn}</span>}</div>
            {sec.pieces.map((p,k)=>{
              const effWood=pieceWoodType(p,sec,it.wood);
              const jointCount=parseInt((p.jointRules||{})[effWood])||1;
              return<div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:9,padding:"2px 0",borderBottom:"1px dotted #f0f0f0"}}>
                <span>{p.bn}{jointCount>1&&<strong style={{marginLeft:4,color:"#b45309"}}>🔗 সর্বোচ্চ জোড়া: {jointCount}টি</strong>}</span>
                <span style={{color:"#555",fontFamily:"monospace"}}>{p.w}″×{p.h}″×{p.l}″ × {p.pc}</span>
              </div>
            })}
          </div>)}
          {editIdx!==i&&<div style={{background:"#fef3c7",borderRadius:5,padding:"5px 8px",fontSize:9,marginTop:4}}>মোট CFT: <strong>{(totalCft(it.sections)*it.qty).toFixed(3)}</strong></div>}
        </div>
      </div>)}
      <div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{["প্রধান কার্পেন্টারের স্বাক্ষর","পরিচালকের স্বাক্ষর"].map(t=><div key={t} style={{borderTop:"1px solid #ddd",paddingTop:5,textAlign:"center",fontSize:9,color:"#888"}}>{t}</div>)}</div>
      <div className="no-print"><PrintLog log={printLogs?.s4}/></div>
    </div>
  </div>
}

/* ── SLIP 5: TRANSPORT ── */
function S5({order,onPrint,woodSettings,rackSplits}){
  const{cust,items,no,printLogs}=order;
  const map={};
  items.forEach(it=>{it.sections.forEach(sec=>{sec.pieces.forEach(p=>{const pw=pieceWoodType(p,sec,it.wood);const info=pieceRackInfo(pw,p.w,p.h,p.l,woodSettings,rackSplits);const code=info.code;const key=`${code}__${p.h}__${p.l}__${p.w}`;const pc=p.pc*it.qty;const cv=cft(pc,p.h,p.l,p.w);if(map[key]){map[key].pc+=pc;map[key].cv+=cv}else map[key]={code,name:p.bn,pc,h:p.h,l:p.l,w:p.w,cv,isSplit:info.isSplit,wood:pw}})})});
  const list=Object.values(map).sort((a,b)=>a.code.localeCompare(b.code));
  const tot=list.reduce((s,w)=>s+w.cv,0);
  return<div style={{fontSize:10}}>
    <div className="no-print" style={{padding:"8px 14px",background:"#fff",borderBottom:"1px solid #eee",display:"flex",justifyContent:"flex-end",color:"#065f46"}}><PrintBtn onPrint={()=>onPrint("s5")}/></div>
    <Hdr title="ট্রান্সপোর্ট কপি — কাঠের তালিকা" sub="Transport Wood List" no={no} bg="#065f46"/>
    <div style={{padding:"10px 14px"}}>
      <div style={{background:"#f0fdf4",borderRadius:7,padding:"8px",marginBottom:10}}>
        <IR l="গ্রাহক" v={cust.name}/><IR l="তারিখ" v={fmtDate(cust.date)}/>
        {items.map((it,i)=><IR key={i} l={`ফার্নিচার ${i+1}`} v={`[${it.code}] ${it.variantBn} (${it.woodBn}) × ${it.qty}`}/>)}
      </div>
      <div style={{fontWeight:700,fontSize:10,color:"#065f46",marginBottom:6}}>গোডাউনের র‍্যাক থেকে নিন:</div>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:9}}>
        <thead><tr style={{background:"#065f46",color:"white"}}>{["র‍্যাক কোড","কাঠের নাম","W×H×L","পিস","CFT"].map((h,i)=><th key={h} style={{padding:"5px 4px",textAlign:i<2?"left":"center",fontWeight:700}}>{h}</th>)}</tr></thead>
        <tbody>{list.map((w,i)=><tr key={i} style={{background:i%2===0?"#f0fdf4":"white",borderBottom:"1px solid #d1fae5"}}>
          <td style={{padding:"5px 4px",fontWeight:800,color:"#065f46",fontFamily:"monospace",fontSize:10}}>{w.code}{w.isSplit&&<span style={{marginLeft:4,fontSize:7,background:"#1d4ed8",color:"white",borderRadius:6,padding:"1px 4px",fontWeight:700,fontFamily:"sans-serif"}}>বিভক্ত</span>}</td>
          <td style={{padding:"5px 4px"}}>{w.name}</td>
          <td style={{padding:"5px 4px",textAlign:"center",fontFamily:"monospace",color:"#555"}}>{w.w}×{w.h}×{w.l}</td>
          <td style={{padding:"5px 4px",textAlign:"center",fontWeight:700}}>{w.pc}</td>
          <td style={{padding:"5px 4px",textAlign:"center"}}>{w.cv.toFixed(3)}</td>
        </tr>)}</tbody>
        <tfoot><tr style={{background:"#065f46",color:"white"}}><td colSpan={4} style={{padding:"7px 4px",fontWeight:700}}>মোট CFT</td><td style={{padding:"7px 4px",textAlign:"center",fontWeight:800,fontSize:11}}>{tot.toFixed(3)}</td></tr></tfoot>
      </table>
      <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{["ট্রান্সপোর্ট কর্মীর স্বাক্ষর","পরিচালকের স্বাক্ষর"].map(t=><div key={t} style={{borderTop:"1px solid #ddd",paddingTop:5,textAlign:"center",fontSize:9,color:"#888"}}>{t}</div>)}</div>
      <div className="no-print"><PrintLog log={printLogs?.s5}/></div>
    </div>
  </div>
}

/* ── SLIP 6: DELIVERY RECEIPT ── */
function S6({order,onPrint,onUpdateOrder,onSetDelivered,onPhotoChange,onRemovePhoto,allOrders,printLocked}){

/* ── SIMPLE BAR CHART (SVG) ── */
function BarChart({data,height=140,color=CHART_SOFT_RED,formatY}){
  const max=Math.max(...data.map(d=>d.value),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const barH=(d.value/max)*(height-24);
        return<g key={i}>
          <rect x={i*w+w*0.15} y={height-24-barH} width={w*0.7} height={barH} fill={d.color||color} rx="1"/>
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",justifyContent:"space-around",marginTop:2}}>
      {data.map((d,i)=><div key={i} style={{fontSize:10,fontWeight:700,color:d.color||color,textAlign:"center",flex:1}}>{formatY?formatY(d.value):d.value}</div>)}
    </div>
  </div>
}
function DualBarChart({data,height=150,labelA="গত বছর",labelB="এই বছর",showValues=false}){
  const max=Math.max(...data.map(d=>Math.max(d.a,d.b)),1);
  const w=100/data.length;
  // ── সংক্ষিপ্ত আকারে টাকার অঙ্ক — বার সরু হওয়ায় পুরো money() ফরম্যাট (৳১২৩,৪৫৬) জায়গায় কুলাবে
  // না, তাই হাজারের উপরে "হা." যোগ করে ছোট করা হয় ──
  const shortMoney=(v)=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+"হা":Math.round(v).toString();
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const hA=(d.a/max)*(height-24),hB=(d.b/max)*(height-24);
        const bw=w*0.32;
        return<g key={i}>
          <rect x={i*w+w*0.14} y={height-24-hA} width={bw} height={hA} fill={CHART_SOFT_GREY} rx="1"/>
          <rect x={i*w+w*0.14+bw+2} y={height-24-hB} width={bw} height={hB} fill={CHART_SOFT_RED} rx="1"/>
          {showValues&&<text x={i*w+w*0.14+bw/2} y={height-24-hA-2.5} fontSize="3.4" textAnchor="middle" fill="#777">{shortMoney(d.a)}</text>}
          {showValues&&<text x={i*w+w*0.14+bw+2+bw/2} y={height-24-hB-2.5} fontSize="3.4" textAnchor="middle" fill="#b45858">{shortMoney(d.b)}</text>}
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:4}}>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:CHART_SOFT_GREY,borderRadius:2}}></div>{labelA}</div>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:CHART_SOFT_RED,borderRadius:2}}></div>{labelB}</div>
    </div>
  </div>
}
// ৩ বছরের তুলনার জন্য — DualBarChart-এর মতোই, একটা বাড়তি সিরিজ (c) সহ
function TripleBarChart({data,height=150,labelA,labelB,labelC}){
  const max=Math.max(...data.map(d=>Math.max(d.a,d.b,d.c)),1);
  const w=100/data.length;
  return<div style={{width:"100%"}}>
    <svg viewBox={`0 0 100 ${height}`} style={{width:"100%",height,display:"block"}} preserveAspectRatio="none">
      {data.map((d,i)=>{
        const hA=(d.a/max)*(height-24),hB=(d.b/max)*(height-24),hC=(d.c/max)*(height-24);
        const bw=w*0.24;
        return<g key={i}>
          <rect x={i*w+w*0.08} y={height-24-hA} width={bw} height={hA} fill={CHART_SOFT_GREY} rx="1"/>
          <rect x={i*w+w*0.08+bw+2} y={height-24-hB} width={bw} height={hB} fill={CHART_SOFT_ORANGE} rx="1"/>
          <rect x={i*w+w*0.08+2*(bw+2)} y={height-24-hC} width={bw} height={hC} fill={CHART_SOFT_RED} rx="1"/>
          {d.a>0&&<text x={i*w+w*0.08+bw/2} y={height-24-hA-2} fontSize="3.4" textAnchor="middle" fill="#777">{d.a}</text>}
          {d.b>0&&<text x={i*w+w*0.08+bw+2+bw/2} y={height-24-hB-2} fontSize="3.4" textAnchor="middle" fill="#a06a2e">{d.b}</text>}
          {d.c>0&&<text x={i*w+w*0.08+2*(bw+2)+bw/2} y={height-24-hC-2} fontSize="3.4" textAnchor="middle" fill="#b45858">{d.c}</text>}
          <text x={i*w+w*0.5} y={height-10} fontSize="4.2" textAnchor="middle" fill="#666">{d.label}</text>
        </g>
      })}
    </svg>
    <div style={{display:"flex",gap:12,justifyContent:"center",marginTop:4,flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:CHART_SOFT_GREY,borderRadius:2}}></div>{labelA} (অর্ডার সংখ্যা)</div>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:CHART_SOFT_ORANGE,borderRadius:2}}></div>{labelB}</div>
      <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:"#666"}}><div style={{width:9,height:9,background:CHART_SOFT_RED,borderRadius:2}}></div>{labelC}</div>
    </div>
  </div>
}

function ProgressBar({pct}){
  // 0-50 red, 50-99 yellow (gradient), 100 green
  let color;
  if(pct>=100)color="#16a34a";
  else if(pct>=50){
    // interpolate yellow(#f59e0b) -> green(#16a34a) as pct goes 50->99
    const t=(pct-50)/50;
    const r1=245,g1=158,b1=11, r2=22,g2=163,b2=74;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }else{
    // interpolate red(#dc2626) -> yellow(#f59e0b) as pct goes 0->50
    const t=pct/50;
    const r1=220,g1=38,b1=38, r2=245,g2=158,b2=11;
    const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
    color=`rgb(${r},${g},${b})`;
  }
  return<div style={{width:"100%"}}>
    <div style={{width:"100%",height:14,background:"#f0f0f0",borderRadius:7,overflow:"hidden",position:"relative"}}>
      <div style={{width:`${Math.min(pct,100)}%`,height:"100%",background:color,borderRadius:7,transition:"width .3s"}}></div>
    </div>
    <div style={{fontSize:10,fontWeight:700,color,marginTop:2,textAlign:"right"}}>{pct>=100?"✅ রেডি টু ডেলিভার":`${pct}% সম্পন্ন`}</div>
  </div>
}
function PieChart3D({data,size=180,showCount=false,countSuffix="",showMoney=false}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>কোনো ডেটা নেই</div>;
  const radius=size/2-8;
  const cx=size/2,cy=size/2-6;
  const depth=12; // 3D thickness
  let cumAngle=0;
  const toXY=(ang,r,yOff=0)=>{const rad=(ang-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+yOff+r*Math.sin(rad)*0.55]}; // squash Y for ellipse/3D look
  const slices=data.map((d,idx)=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const[x1,y1]=toXY(startAngle,radius);
    const[x2,y2]=toXY(endAngle,radius);
    const largeArc=angle>180?1:0;
    const topPath=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    // side "wall" path for depth (only meaningful for bottom-facing slices, approximate for all for visual consistency)
    const[x1b,y1b]=toXY(startAngle,radius,depth);
    const[x2b,y2b]=toXY(endAngle,radius,depth);
    const sidePath=`M ${x1} ${y1} L ${x1b} ${y1b} A ${radius} ${radius*0.55} 0 ${largeArc} 1 ${x2b} ${y2b} L ${x2} ${y2} A ${radius} ${radius*0.55} 0 ${largeArc} 0 ${x1} ${y1} Z`;
    const midAngle=(startAngle+endAngle)/2;
    return{...d,topPath,sidePath,midAngle,pct:Math.round((d.value/total)*100),idx};
  });
  const shadeColor=(hex,amt)=>{
    // darken a hex color by amt (0-1)
    const c=hex.replace("#","");
    const num=parseInt(c,16);
    let r=(num>>16)-Math.round(255*amt), g=((num>>8)&0xff)-Math.round(255*amt), b=(num&0xff)-Math.round(255*amt);
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return`rgb(${r},${g},${b})`;
  };
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size+depth+10} viewBox={`0 0 ${size} ${size+depth+10}`}>
      <ellipse cx={cx} cy={cy+radius*0.55+depth+2} rx={radius+2} ry={(radius*0.55)+2} fill="rgba(0,0,0,0.12)"/>
      {slices.map((s,i)=><path key={"side"+i} d={s.sidePath} fill={shadeColor(s.color,0.35)}/>)}
      {slices.map((s,i)=><path key={"top"+i} d={s.topPath} fill={s.color} stroke="white" strokeWidth="1.5" style={{filter:"drop-shadow(0 1px 1px rgba(0,0,0,0.15))"}}/>)}
    </svg>
    <div style={{flex:1,minWidth:130}}>
      {slices.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:11}}>
        <div style={{width:11,height:11,background:`linear-gradient(135deg, ${s.color}, ${shadeColor(s.color,0.3)})`,borderRadius:3,flexShrink:0,boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}></div>
        <span style={{color:"#444",flex:1}}>{s.label}</span>
        <span style={{fontWeight:700,color:"#222"}}>{s.pct}%{showCount?` (${s.value}${countSuffix})`:""}{showMoney?` (${money(s.value)})`:""}</span>
      </div>)}
    </div>
  </div>
}
function PieChart({data,size=140}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total===0)return<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>কোনো ডেটা নেই</div>;
  let cumAngle=0;
  const radius=size/2;
  const cx=radius,cy=radius;
  const slices=data.map(d=>{
    const angle=(d.value/total)*360;
    const startAngle=cumAngle;
    const endAngle=cumAngle+angle;
    cumAngle=endAngle;
    const toXY=(ang)=>{const rad=(ang-90)*Math.PI/180;return[cx+radius*Math.cos(rad),cy+radius*Math.sin(rad)]};
    const[x1,y1]=toXY(startAngle);
    const[x2,y2]=toXY(endAngle);
    const largeArc=angle>180?1:0;
    const path=`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    return{...d,path,pct:Math.round((d.value/total)*100)};
  });
  return<div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {slices.map((s,i)=><path key={i} d={s.path} fill={s.color} stroke="white" strokeWidth="1.5"/>)}
    </svg>

function FirebaseSetup({onSaved}){
  const[text,setText]=useState("");
  const[error,setError]=useState("");
  const save=()=>{
    try{
      let cleaned=text.trim();
      // Extract just the object literal if user pasted the full "const firebaseConfig = {...};" line
      const match=cleaned.match(/\{[\s\S]*\}/);
      if(match)cleaned=match[0];
      const config=new Function("return "+cleaned)();
      if(!config.apiKey||!config.projectId){setError("এই কনফিগে apiKey বা projectId পাওয়া যায়নি। সঠিক কোড পেস্ট করেছেন কিনা দেখুন।");return}
      localStorage.setItem("rf_firebase_config",JSON.stringify(config));
      onSaved(config);
    }catch(e){
      setError("কোডটি পড়া যায়নি। Firebase কনসোল থেকে সরাসরি কপি করা কনফিগ অবজেক্টটি পেস্ট করুন।");
    }
  };
  return<div style={{minHeight:"100vh",background:`linear-gradient(150deg,${RED} 0%,#8B0020 100%)`,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"white",borderRadius:16,padding:22,maxWidth:520,width:"100%",boxShadow:"0 8px 30px rgba(0,0,0,.25)"}}>
      <div style={{fontSize:9,color:"#ccc",textAlign:"right",marginBottom:4}}>{BUILD_TAG}</div>
      <div style={{fontSize:18,fontWeight:800,color:RED,marginBottom:6}}>🔄 স্বয়ংক্রিয় সিঙ্ক সেটআপ (একবারের জন্য)</div>
      <div style={{fontSize:12,color:"#555",marginBottom:14,lineHeight:1.6}}>
        ফোন ও কম্পিউটারে অটোমেটিক ডেটা সিঙ্ক করতে একটি ফ্রি Firebase প্রজেক্ট লাগবে। এটা একবার সেটআপ করলে ভবিষ্যতে সব ডিভাইসে নিজে থেকেই সিঙ্ক হয়ে যাবে — কোনো এক্সপোর্ট/ইমপোর্ট লাগবে না।
      </div>
      <div style={{background:"#f5f3ff",borderRadius:10,padding:"12px 14px",marginBottom:14,fontSize:11.5,color:"#4c1d95",lineHeight:1.7}}>
        <strong>ধাপগুলো:</strong><br/>
        ১. <a href="https://console.firebase.google.com" target="_blank" style={{color:"#6d28d9",fontWeight:700}}>console.firebase.google.com</a> এ যান, নতুন প্রজেক্ট তৈরি করুন (ফ্রি)<br/>
        ২. বাম মেনু থেকে Build → Firestore Database → Create Database → Start in <strong>test mode</strong><br/>
        ৩. ⚙ Project settings → General → "Your apps" এ Web (&lt;/&gt;) আইকনে ক্লিক করে একটা app যোগ করুন<br/>
        ৪. যেই <code>firebaseConfig = {"{"}...{"}"}</code> কোড দেখাবে, পুরোটা কপি করে নিচে পেস্ট করুন
      </div>
      <textarea value={text} onChange={e=>setText(e.target.value)} rows={6} placeholder={`const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  ...\n};`} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:9,padding:10,fontSize:12,fontFamily:"monospace",outline:"none",marginBottom:10,resize:"vertical"}}/>

// ── ছবির লাইটবক্স আর App-এর ব্যাক-বাটন হ্যান্ডলার — দুটো জায়গাতেই লাগে, তাই মডিউল-লেভেলে।
// pending সত্যি থাকা মানে: একটা হিস্ট্রি-ধাপ যোগ করা আছে যেটা এখনো "খরচ" হয়নি — App-এর

// রেস করে একই ব্যাক-প্রেসে দুটো ভিন্ন কাজ (ছবি বন্ধ + পেজও পাল্টে যাওয়া) না করে ফেলে ──
const lightboxState={pending:false,closeFn:null};
function ImageLightbox(){
  const[src,setSrc]=useState(null);
  const[zoomed,setZoomed]=useState(false);
  useEffect(()=>{lightboxState.closeFn=()=>setSrc(null)},[]);
  useEffect(()=>{
    const handler=(e)=>{
      setSrc(e.detail.src);setZoomed(false);
      window.history.pushState({lightbox:true},"");
      lightboxState.pending=true;
    };
    window.addEventListener("open-lightbox",handler);
    return()=>window.removeEventListener("open-lightbox",handler);
  },[]);
  // X বাটনে/বাইরে ট্যাপে বন্ধ করলে history.back() ডেকে সেই একই যোগ-করা ধাপটা "খরচ" করে দেওয়া
  // হয় — ফলে তৈরি হওয়া popstate-টা App-এর onPop-ই ধরবে (এই কম্পোনেন্ট আলাদাভাবে না), তাই কোনো
  // রেস কন্ডিশন নেই। পরের বার সত্যিকারের ব্যাক চাপলে তখন যেন বাড়তি একটা ধাপ খরচ না হয়ে যায়।
  const closeViaButton=()=>{
    if(lightboxState.pending)window.history.back();
    else setSrc(null);
  };
  if(!src)return null;
  return<div className="no-print" onClick={closeViaButton} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto",WebkitOverflowScrolling:"touch"}}>
    <img src={src} onClick={e=>{e.stopPropagation();setZoomed(z=>!z)}} style={zoomed?{maxWidth:"none",width:"auto",margin:"auto",cursor:"zoom-out"}:{maxWidth:"96%",maxHeight:"92%",objectFit:"contain",cursor:"zoom-in"}}/>
    <button onClick={e=>{e.stopPropagation();closeViaButton()}} style={{position:"fixed",top:14,right:14,background:"rgba(255,255,255,.18)",color:"white",border:"none",borderRadius:"50%",width:42,height:42,fontSize:19}}>✕</button>
    <div style={{position:"fixed",bottom:16,left:0,right:0,textAlign:"center",color:"rgba(255,255,255,.6)",fontSize:11}} className="no-print">{zoomed?"আবার ট্যাপ করুন — ছোট করতে":"ট্যাপ করুন — বড় করতে"}</div>
  </div>
}
function Root(){
  const[config,setConfig]=useState(undefined); // undefined = checking, null = not set, object = ready
  useEffect(()=>{
    const saved=S.get("rf_firebase_config");
    setConfig(saved||null);
  },[]);
  if(config===undefined)return<div style={{padding:40,textAlign:"center"}}>লোড হচ্ছে...</div>;
  if(config===null)return<FirebaseSetup onSaved={(c)=>setConfig(c)}/>;
  return<>
    <App firebaseConfig={config} onResetConfig={()=>{localStorage.removeItem("rf_firebase_config");setConfig(null)}}/>
    <ImageLightbox/>
  </>;
}

  // হোম পেজে থাকা অবস্থায় (যাতে কোনো ফর্ম/এডিট স্ক্রিনে থাকা অবস্থায় কিছু হারিয়ে না যায়) — নাহলে
  // পরের চেক পর্যন্ত অপেক্ষা করে, ফর্মে কিছু লিখতে থাকা অবস্থায় হঠাৎ পাতা পাল্টে যাবে না ──

  // অনেকগুলো ট্যাব খোলা থাকলে প্রতিটা আলাদাভাবে সার্ভারের সাথে সংযোগ রাখে ও আলাদা হিসাব খায়,
  // ফলে Firebase-এর দিনের সীমা দ্রুত শেষ হয় এবং ট্যাবে ট্যাবে আলাদা তথ্য দেখা দিতে পারে। নতুন
  // ট্যাব খুললে পুরনোগুলো নিজে থেকেই সংযোগ ছেড়ে দেয় (তখন তারা আর কোনো হিসাব খায় না), আর সেখানে
  // একটা পর্দা দেখায় — চাইলে ওই ট্যাবেই আবার চালু করে নেওয়া যায় ──
  const[tabActive,setTabActive]=useState(true);

  useEffect(()=>{

      }catch(e){/* নেটওয়ার্ক হেঁচকি — পরের চেষ্টায় দেখা যাবে, নীরবে এড়িয়ে যান */}
