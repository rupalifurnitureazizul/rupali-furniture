function DayWheel({value,onChange,color}){
  const cur=parseFloat(value)||0;
  const clamp=(v)=>Math.min(10.5,Math.max(0,Math.round(v*2)/2));
  return<div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
    <button onClick={()=>onChange(clamp(cur-0.5))} style={{width:30,height:30,borderRadius:7,border:`1.5px solid ${color}`,background:"white",color,fontSize:17,fontWeight:800,lineHeight:1,flexShrink:0}}>−</button>
    <input type="number" step="0.5" min="0" max="10.5" value={cur} onChange={e=>{
      const raw=e.target.value;
      if(raw==="")return onChange(0);
      const v=clamp(parseFloat(raw));
      if(!isNaN(v))onChange(v);
    }} style={{width:46,textAlign:"center",fontSize:15,fontWeight:800,color,border:`1.5px solid ${color}`,borderRadius:7,padding:"5px 2px",boxSizing:"border-box"}}/>
    <button onClick={()=>onChange(clamp(cur+0.5))} style={{width:30,height:30,borderRadius:7,border:`1.5px solid ${color}`,background:"white",color,fontSize:17,fontWeight:800,lineHeight:1,flexShrink:0}}>+</button>
  </div>
}
/* ── PROFIT & LOSS REPORT (flexible period: month / quarter / half / year / 2y / 3y / 5y) ── */
const PL_PERIODS=[
  {key:"month",label:"মাস",months:1},
  {key:"quarter",label:"৩ মাস",months:3},
  {key:"half",label:"৬ মাস",months:6},
  {key:"year",label:"বছর",months:12},
  {key:"year2",label:"২ বছর",months:24},
  {key:"year3",label:"৩ বছর",months:36},
  {key:"year5",label:"৫ বছর",months:60},
];
const PL_EPOCH=2020*12; // জানুয়ারি ২০২০ থেকে পিরিয়ড ব্লক গণনা শুরু, যাতে সব পিরিয়ড ক্যালেন্ডার-সংগত থাকে
function monthIndexOf(dateStr){const d=new Date(dateStr);return d.getFullYear()*12+d.getMonth()};
function plPeriodLabel(startIdx,months){
  const startY=Math.floor(startIdx/12),startM=startIdx%12;
  const endIdx=startIdx+months-1;
  const endY=Math.floor(endIdx/12),endM=endIdx%12;
  if(months===1)return`${monthName(startM)} ${startY}`;
  if(months>=12&&startM===0&&endM===11)return startY===endY?`${startY}`:`${startY} – ${endY}`;
  return`${monthName(startM)} ${startY} – ${monthName(endM)} ${endY}`;
}
function PLReportPage({orders,expenses,workers,payrollWeeks,woodLots,woodSettings,laborSettings,onBack}){
  const[periodKey,setPeriodKey]=useState("month");
  const period=PL_PERIODS.find(p=>p.key===periodKey);
  const nowIdx=monthIndexOf(todayStr());
  const currentBlockIdx=PL_EPOCH+Math.floor((nowIdx-PL_EPOCH)/period.months)*period.months;
  const[blockOffset,setBlockOffset]=useState(0);
  useEffect(()=>{setBlockOffset(0)},[periodKey]);
  const startIdx=currentBlockIdx+blockOffset*period.months;
  const endIdx=startIdx+period.months-1;
  const inRange=(dateStr)=>{if(!dateStr)return false;const idx=monthIndexOf(dateStr);return idx>=startIdx&&idx<=endIdx};

  // ── v4.61: "কোন ফার্নিচারে খরচ ও লাভ কত"-এর একই হিসাব — প্রতিটা ফার্নিচারের খরচ তার তৈরির সপ্তাহগুলোর
  // আসল বেতন ও খরচ থেকে; যে সপ্তাহে কোনো ফার্নিচারে কাজ চলেনি সেই খরচ আলাদা লাইনে ──
  const ledger=useMemo(()=>buildSpendLedger(expenses,payrollWeeks,workers,woodLots),[expenses,payrollWeeks,workers,woodLots]);
  const costing=useMemo(()=>furnitureCosting(orders,ledger,woodSettings,laborSettings,null,null),[orders,ledger,woodSettings,laborSettings]);
  const[showOrders,setShowOrders]=useState(false);
  const stats=useMemo(()=>{
    const dItems=costing.items.filter(x=>x.delivered&&inRange(x.deliveredAt));
    const byOrder={};
    dItems.forEach(x=>{
      const r=byOrder[x.no]||(byOrder[x.no]={no:x.no,cust:x.cust,date:x.deliveredAt,revenue:0,wood:0,salary:0,expense:0,cft:0,filled:false,estimated:false});
      r.revenue+=x.revenue;r.wood+=x.woodCost;r.salary+=x.salary;r.expense+=x.expense;r.cft+=x.cft;
      if(x.woodFilledAt)r.filled=true;if(x.startAssumed||x.endIsDelivery)r.estimated=true;
    });
    const orderRows=Object.values(byOrder).map(r=>({...r,profit:r.revenue-r.wood-r.salary-r.expense})).sort((p,q)=>String(q.date).localeCompare(String(p.date)));
    const sum=(f)=>orderRows.reduce((t,r)=>t+r[f],0);
    const revenue=sum("revenue"),woodCost=sum("wood"),salaryCost=sum("salary"),expenseCost=sum("expense"),deliveredCft=sum("cft");
    let idleSalary=0,idleExpense=0;
    Object.entries(costing.idle||{}).forEach(([w,v])=>{if(inRange(w)){idleSalary+=v.salary;idleExpense+=v.expense}});
    const totalCosts=woodCost+salaryCost+expenseCost+idleSalary+idleExpense;
    const netProfit=revenue-totalCosts;
    const wipItems=costing.items.filter(x=>!x.delivered);
    const wipValue=wipItems.reduce((t,x)=>t+x.woodCost+x.salary+x.expense,0);
    const wipCount=new Set(wipItems.map(x=>x.no)).size;
    let actualPayroll=0,periodExpenses=0,woodPaid=0;const expenseByCat={};
    ledger.forEach(e=>{if(!inRange(e.date))return;
      if(e.kind==="salary")actualPayroll+=e.amount;
      else if(e.kind==="wood")woodPaid+=e.amount;
      else{periodExpenses+=e.amount;expenseByCat[e.label]=(expenseByCat[e.label]||0)+e.amount}});
    return{revenue,woodCost,salaryCost,expenseCost,idleSalary,idleExpense,deliveredCft,totalCosts,netProfit,orderRows,
      deliveredCount:orderRows.length,wipCount,wipValue,actualPayroll,periodExpenses,woodPaid,expenseByCat,
      filledCount:orderRows.filter(r=>r.filled).length,estimatedCount:orderRows.filter(r=>r.estimated).length};
  },[costing,ledger,startIdx,endIdx]);
  const line=(label,val,opts)=><div style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:(opts&&opts.fs)||12,marginBottom:6,paddingLeft:(opts&&opts.indent)?8:0,color:(opts&&opts.color)||"#333",fontWeight:(opts&&opts.bold)?800:400}}><span>{label}</span><span style={{flexShrink:0}}>{val}</span></div>;

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#B45309",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>লাভ-ক্ষতি রিপোর্ট</span>
    </div>
    <div style={{padding:"16px",maxWidth:600,margin:"0 auto"}}>
      <div style={{display:"flex",gap:6,overflowX:"auto",marginBottom:14,paddingBottom:2}}>
        {PL_PERIODS.map(p=><button key={p.key} onClick={()=>setPeriodKey(p.key)} style={{flexShrink:0,background:periodKey===p.key?"#B45309":"white",color:periodKey===p.key?"white":"#B45309",border:"1.5px solid #B45309",borderRadius:20,padding:"7px 14px",fontSize:12,fontWeight:700}}>{p.label}</button>)}
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:11,padding:"10px 14px",marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        <button onClick={()=>setBlockOffset(b=>b-1)} style={{background:"#fef3e2",border:"none",borderRadius:8,padding:"8px 12px",color:"#B45309",fontWeight:700,fontSize:13}}>◀</button>
        <div style={{fontSize:14,fontWeight:700,color:"#222"}}>{plPeriodLabel(startIdx,period.months)}</div>
        <button onClick={()=>setBlockOffset(b=>b+1)} disabled={blockOffset>=0} style={{background:blockOffset>=0?"#f3f4f6":"#fef3e2",border:"none",borderRadius:8,padding:"8px 12px",color:blockOffset>=0?"#ccc":"#B45309",fontWeight:700,fontSize:13}}>▶</button>
      </div>

      <div style={{background:"white",borderRadius:13,padding:16,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        <div style={{fontSize:10,color:"#777",marginBottom:10,background:"#f8fafc",borderRadius:6,padding:"7px 9px",lineHeight:1.6}}>বিক্রি ধরা হয় <strong>ডেলিভারির তারিখে</strong>। প্রতিটা ফার্নিচারের খরচ = কাঠ (অর্ডারের সময়ের দামে) + যে সপ্তাহগুলোতে সেটা তৈরি হয়েছে সেই সপ্তাহগুলোর আসল বেতন আর অন্যান্য খরচের ভাগ (CFT অনুযায়ী)। শেষের তারিখ না থাকলে ডেলিভারির তারিখ ধরা হয়।</div>
        {line(`ডেলিভারিকৃত বিক্রয় (${toBnDigits(stats.deliveredCount)}টি অর্ডার)`,<span style={{fontWeight:800,color:"#166534"}}>{money(Math.round(stats.revenue))}</span>,{fs:13})}
        <div style={{fontSize:12,fontWeight:700,color:"#888",margin:"10px 0 8px"}}>বাদ যাবে — এই অর্ডারগুলো তৈরির খরচ:</div>
        {line(`🪵 কাঠ (${toBnDigits(stats.deliveredCft.toFixed(1))} CFT)`,<span style={{color:RED}}>− {money(Math.round(stats.woodCost))}</span>,{indent:true})}
        {line("👷 কর্মীদের বেতন (তৈরির সপ্তাহগুলোর)",<span style={{color:RED}}>− {money(Math.round(stats.salaryCost))}</span>,{indent:true})}
        {line("🧾 অন্যান্য খরচ (তৈরির সপ্তাহগুলোর)",<span style={{color:RED}}>− {money(Math.round(stats.expenseCost))}</span>,{indent:true})}
        {(stats.idleSalary+stats.idleExpense)>0&&<>
          <div style={{fontSize:12,fontWeight:700,color:"#888",margin:"10px 0 8px"}}>এই সময়ের যে সপ্তাহে কোনো ফার্নিচারে কাজ চলেনি:</div>
          {stats.idleSalary>0&&line("👷 বেতন",<span style={{color:RED}}>− {money(Math.round(stats.idleSalary))}</span>,{indent:true})}
          {stats.idleExpense>0&&line("🧾 অন্যান্য খরচ",<span style={{color:RED}}>− {money(Math.round(stats.idleExpense))}</span>,{indent:true})}
        </>}
        <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:900,paddingTop:12,marginTop:6,borderTop:"2px solid #eee",color:stats.netProfit>=0?"#166534":RED}}>
          <span>{stats.netProfit>=0?"✅ নিট লাভ":"⚠️ নিট ক্ষতি"}</span>
          <span>{money(Math.round(Math.abs(stats.netProfit)))}</span>
        </div>
        {stats.revenue>0&&<div style={{fontSize:10,color:"#888",textAlign:"right",marginTop:3}}>লাভের হার {toBnDigits((stats.netProfit/stats.revenue*100).toFixed(0))}%</div>}
        {(stats.filledCount>0||stats.estimatedCount>0)&&<div style={{fontSize:9.5,color:"#a16207",marginTop:8,lineHeight:1.5}}>{stats.filledCount>0?`${toBnDigits(stats.filledCount)}টা অর্ডারে কাঠের মাপ ডেলিভারির পরে বসানো। `:""}{stats.estimatedCount>0?`${toBnDigits(stats.estimatedCount)}টা অর্ডারের তৈরির সময় পুরো ট্র্যাক করা ছিল না — আনুমানিক।`:""}</div>}
      </div>

      {stats.orderRows.length>0&&<div style={{background:"white",borderRadius:13,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        <button onClick={()=>setShowOrders(!showOrders)} style={{width:"100%",background:"none",border:"none",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13,fontWeight:700,color:"#B45309",padding:0}}><span>📋 অর্ডার অনুযায়ী হিসাব ({toBnDigits(stats.orderRows.length)})</span><span>{showOrders?"▲":"▼"}</span></button>
        {showOrders&&<div style={{marginTop:10}}>
          {stats.orderRows.map(r=><div key={r.no} style={{border:"1px solid #f1f1f1",borderRadius:8,padding:"7px 9px",marginBottom:6}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:6,fontSize:10.5,fontWeight:700,color:"#333"}}><span style={{minWidth:0}}>{fmtDate(r.date)} · {r.cust||"—"}</span><span style={{color:r.profit>=0?"#166534":RED,flexShrink:0}}>লাভ {money(Math.round(r.profit))}</span></div>
            <div style={{fontSize:9,color:"#999",margin:"2px 0 4px"}}>অর্ডার {r.no} · {toBnDigits(r.cft.toFixed(2))} CFT{r.filled?" · কাঠের মাপ পরে বসানো":""}{r.estimated?" · আনুমানিক সময়":""}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,fontSize:9.5,textAlign:"center"}}>
              {[["বিক্রি",r.revenue],["কাঠ",r.wood],["বেতন",r.salary],["খরচ",r.expense]].map(([l,v])=><div key={l}><div style={{color:"#999"}}>{l}</div><div style={{fontWeight:600}}>{money(Math.round(v))}</div></div>)}
            </div>
          </div>)}
        </div>}
      </div>}

      <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:11,padding:14,marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:12,color:"#1d4ed8",marginBottom:8}}>🔨 অসম্পূর্ণ কাজ (আপনার সম্পদ — খরচ নয়)</div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>ডেলিভারি না হওয়া অর্ডার</span><span style={{fontWeight:700}}>{toBnDigits(stats.wipCount)} টি</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:800,color:"#1d4ed8"}}><span>এতে এখন পর্যন্ত জমা খরচ</span><span>{money(Math.round(stats.wipValue))}</span></div>
        <div style={{fontSize:10,color:"#555",marginTop:7,lineHeight:1.6}}>কাঠ আর এ পর্যন্ত কাজের সপ্তাহগুলোর বেতন/খরচের ভাগ। এগুলো ডেলিভারি হলে তখন লাভ-ক্ষতিতে আসবে — তাই কম ডেলিভারির মাসে ভুয়া ক্ষতি দেখায় না।</div>
      </div>

      <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        <div style={{fontWeight:700,fontSize:12,color:"#B45309",marginBottom:8}}>💵 এই সময়ে হাত থেকে যাওয়া টাকা (নগদের হিসাব)</div>
        {line("কর্মীদের বেতন",money(Math.round(stats.actualPayroll)))}
        {line("খরচের খাতার খরচ",money(Math.round(stats.periodExpenses)))}
        {line("কাঠ — সাপ্লায়ার পেমেন্ট, কাটাই ও পরিবহন",money(Math.round(stats.woodPaid)))}
        <div style={{fontSize:10,color:"#777",marginTop:4,lineHeight:1.6}}>এটা টাকা দেওয়ার তারিখের হিসাব। উপরের লাভ-ক্ষতিতে একই খরচ ধরা হয় ফার্নিচার তৈরির সময় অনুযায়ী — তাই দুটো সংখ্যা মাসে মাসে আলাদা হতে পারে।</div>
      </div>

      {Object.keys(stats.expenseByCat).length>0&&<div style={{background:"white",borderRadius:13,padding:16,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
        <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"#B45309"}}>খরচের খাতার ভাঙন (এই সময়ে)</div>
        {Object.entries(stats.expenseByCat).sort((p,q)=>q[1]-p[1]).map(([label,val])=><div key={label} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderBottom:"1px solid #f5f5f5"}}><span>{label}</span><span style={{fontWeight:600}}>{money(Math.round(val))}</span></div>)}
      </div>}
    </div>
  </div>
}

function PayrollPage({workers,saveWorker,deleteWorker,payrollWeeks,savePayrollWeek,updateAttendance,addAdvanceEntry,removeAdvanceEntry,onBack}){
  const today=todayStr();
  const[view,setView]=useState("week"); // week | workers
  const[weekEnd,setWeekEnd]=useState(()=>weekEndThursday(today));
  const[newWorker,setNewWorker]=useState({name:"",voterId:"",phone1:"",phone2:"",department:PAYROLL_DEPTS[0],dailyRate:"",idCardImg:null,idCardFileName:null,photoImg:null});
  const[editingWorkerId,setEditingWorkerId]=useState(null);
  const[newAdv,setNewAdv]=useState({date:today,workerId:"",amount:"",note:""});
  const idCardInput=useRef();
  const photoInput=useRef();
  const[advPickerOpen,setAdvPickerOpen]=useState(false);
  const[viewingIdCard,setViewingIdCard]=useState(null);
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const activeWorkers=sortByDept(workers.filter(w=>w.active!==false));
  const days=weekWorkDays(weekEnd);
  const weekData=payrollWeeks[weekEnd]||{attendance:{},advances:[]};

  const blankWorker={name:"",voterId:"",phone1:"",phone2:"",department:PAYROLL_DEPTS[0],dailyRate:"",idCardImg:null,idCardFileName:null,photoImg:null};
  const saveNewWorker=()=>{
    if(!newWorker.name.trim()||!newWorker.dailyRate)return;
    saveWorker({...newWorker,dailyRate:parseFloat(newWorker.dailyRate)||0,active:true});
    setNewWorker(blankWorker);
  };
  const startEditWorker=(w)=>{setEditingWorkerId(w.id);setNewWorker({name:w.name,voterId:w.voterId||"",phone1:w.phone1||"",phone2:w.phone2||"",department:w.department||PAYROLL_DEPTS[0],dailyRate:String(w.dailyRate),idCardImg:w.idCardImg||null,idCardFileName:w.idCardFileName||null,photoImg:w.photoImg||null})};
  const handlePhotoImg=async(e)=>{
    const file=e.target.files[0];
    e.target.value="";
    if(!file)return;
    const compressed=await compressImage(file,400,0.78);
    if(!compressed){alert("ছবিটি পড়া যায়নি।");return}
    setNewWorker(prev=>({...prev,photoImg:compressed}));
  };
  const saveEditWorker=()=>{
    saveWorker({id:editingWorkerId,...newWorker,dailyRate:parseFloat(newWorker.dailyRate)||0,active:true});
    setEditingWorkerId(null);setNewWorker(blankWorker);
  };
  const handleIdCardImg=async(e)=>{
    const file=e.target.files[0];
    e.target.value="";
    if(!file)return;
    const compressed=await compressImage(file,1400,0.8);
    if(!compressed){alert("ছবিটি পড়া যায়নি।");return}
    const safeName=(newWorker.name||"worker").replace(/[^a-zA-Z0-9\u0980-\u09FF]/g,"_");
    const fileName=genImgFileName(`idcard_${safeName}`,1,file);
    const savedFull=await saveFullResImage(file,fileName);
    setNewWorker(prev=>({...prev,idCardImg:compressed,idCardFileName:savedFull?fileName:null}));
  };
  const toggleActive=(w)=>saveWorker({...w,active:w.active===false?true:false});
  const confirmDeleteWorker=(w)=>{if(window.confirm(`"${w.name}" কে স্থায়ীভাবে মুছে ফেলতে চান? এর সাথে যুক্ত পুরনো হাজিরার তথ্য অক্ষত থাকবে, শুধু কর্মীর প্রোফাইল মুছে যাবে।`))deleteWorker(w.id)};

  // Attendance: single "total days this week" number per worker (read from external attendance device)
  const setWorkerDays=(workerId,val)=>{
    let n=parseFloat(val);
    if(isNaN(n))n=0;
    if(n<0)n=0;
    if(n>10.5)n=10.5;
    updateAttendance(weekEnd,workerId,n);
  };
  const addAdvance=()=>{
    if(!newAdv.workerId||!newAdv.amount)return;
    const adv={id:"adv_"+Date.now(),workerId:newAdv.workerId,date:newAdv.date,amount:parseFloat(newAdv.amount)||0,note:newAdv.note};
    addAdvanceEntry(weekEnd,adv);
    setNewAdv({date:today,workerId:"",amount:"",note:""});
  };
  const removeAdvance=(advId)=>{
    const adv=(weekData.advances||[]).find(a=>a.id===advId);
    if(adv)removeAdvanceEntry(weekEnd,adv);
  };

  const daysPresent=(workerId)=>{
    const v=(weekData.attendance||{})[workerId];
    if(Array.isArray(v))return v.reduce((s,x)=>s+attVal(x),0); // পুরনো দিন-ভিত্তিক তথ্য থাকলে যোগফল
    return parseFloat(v)||0;
  };
  const advanceTotal=(workerId)=>(weekData.advances||[]).filter(a=>a.workerId===workerId).reduce((s,a)=>s+(parseFloat(a.amount)||0),0);
  const grossPay=(w)=>daysPresent(w.id)*(parseFloat(w.dailyRate)||0);
  const netPay=(w)=>grossPay(w)-advanceTotal(w.id);
  const grandTotalNet=activeWorkers.reduce((s,w)=>s+netPay(w),0);
  const grandTotalGross=activeWorkers.reduce((s,w)=>s+grossPay(w),0);
  const grandTotalAdvance=activeWorkers.reduce((s,w)=>s+advanceTotal(w.id),0);

  const weekRangeLabel=`${fmtDate(days[0])} — ${fmtDate(days[6])}`;

  return<div className="print-bg" style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div className="no-print" style={{background:PAY,color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>পে-রোল ব্যবস্থাপনা</span>
    </div>
    <div className="no-print" style={{background:"white",display:"flex",borderBottom:"1px solid #eee"}}>
      {[{id:"week",l:"সাপ্তাহিক হাজিরা ও রিপোর্ট"},{id:"workers",l:"কর্মী তালিকা"}].map(t=><button key={t.id} onClick={()=>setView(t.id)} style={{flex:1,padding:"11px 6px",border:"none",background:"none",fontSize:12,fontWeight:view===t.id?700:400,color:view===t.id?PAY:"#888",borderBottom:view===t.id?`3px solid ${PAY}`:"3px solid transparent"}}>{t.l}</button>)}
    </div>

    <div className="print-wrap" style={{padding:"16px",maxWidth:640,margin:"0 auto"}}>

      {view==="workers"&&<div className="no-print">
        <div style={{background:"white",borderRadius:12,padding:16,marginBottom:16,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>{editingWorkerId?"কর্মীর তথ্য পরিবর্তন করুন":"নতুন কর্মী যোগ করুন"}</div>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,background:PAY_LIGHT,borderRadius:9,padding:10,border:`1px solid ${PAY_BORDER}`}}>
            {newWorker.photoImg?<img src={newWorker.photoImg} onClick={()=>openLightbox(newWorker.photoImg)} style={{width:60,height:60,borderRadius:"50%",objectFit:"cover",border:`2px solid ${PAY}`,flexShrink:0,cursor:"pointer"}} alt=""/>
            :<div style={{width:60,height:60,borderRadius:"50%",background:"white",border:`2px dashed ${PAY_BORDER}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,color:PAY_BORDER,flexShrink:0}}>👤</div>}
            <div style={{flex:1}}>
              <div style={{fontSize:11,fontWeight:600,color:PAY_DARK,marginBottom:5}}>প্রোফাইল ছবি</div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>photoInput.current.click()} style={{background:"white",border:`1px solid ${PAY_BORDER}`,color:PAY_DARK,borderRadius:7,padding:"7px 11px",fontSize:11,fontWeight:600}}>{newWorker.photoImg?"বদলান":"📷 ছবি যোগ করুন"}</button>
                {newWorker.photoImg&&<button onClick={()=>setNewWorker({...newWorker,photoImg:null})} style={{background:"#fee2e2",border:"none",color:RED,borderRadius:7,padding:"7px 11px",fontSize:11,fontWeight:600}}>✕ সরান</button>}
              </div>
            </div>
            <input ref={photoInput} type="file" accept="image/*" onChange={handlePhotoImg} style={{display:"none"}}/>
          </div>
          <div style={{marginBottom:10}}>{lbl("নাম *")}<input value={newWorker.name} onChange={e=>setNewWorker({...newWorker,name:e.target.value})} placeholder="পূর্ণ নাম" style={inp}/></div>
          <div style={{marginBottom:10}}>{lbl("ভোটার আইডি নম্বর")}<input value={newWorker.voterId} onChange={e=>setNewWorker({...newWorker,voterId:e.target.value})} placeholder="ভোটার আইডি" style={inp}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>{lbl("ফোন নম্বর ১")}<input type="tel" value={newWorker.phone1} onChange={e=>setNewWorker({...newWorker,phone1:e.target.value})} placeholder="01XXXXXXXXX" style={inp}/></div>
            <div>{lbl("ফোন নম্বর ২ (ঐচ্ছিক)")}<input type="tel" value={newWorker.phone2} onChange={e=>setNewWorker({...newWorker,phone2:e.target.value})} placeholder="01XXXXXXXXX" style={inp}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
            <div>{lbl("বিভাগ")}<select value={newWorker.department} onChange={e=>setNewWorker({...newWorker,department:e.target.value})} style={inp}>{PAYROLL_DEPTS.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
            <div>{lbl("দৈনিক বেতন (৳) *")}<input type="number" value={newWorker.dailyRate} onChange={e=>setNewWorker({...newWorker,dailyRate:e.target.value})} placeholder="0" style={inp}/></div>
          </div>
          <div style={{marginBottom:14,background:PAY_LIGHT,borderRadius:9,padding:10,border:`1px solid ${PAY_BORDER}`}}>
            {lbl("🪪 আইডি কার্ডের ছবি (ভোটার আইডি / এনআইডি)")}
            {newWorker.idCardImg?<div style={{textAlign:"center"}}>
              <img src={newWorker.idCardImg} onClick={()=>openLightbox(newWorker.idCardImg)} style={{maxWidth:"100%",maxHeight:150,objectFit:"contain",borderRadius:8,border:"1px solid #ddd",display:"block",margin:"0 auto 7px",cursor:"pointer"}} alt="ID card"/>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>idCardInput.current.click()} style={{flex:1,background:"white",border:`1px solid ${PAY_BORDER}`,color:PAY_DARK,borderRadius:7,padding:"7px",fontSize:11,fontWeight:600}}>ছবি বদলান</button>
                <button onClick={()=>setNewWorker({...newWorker,idCardImg:null,idCardFileName:null})} style={{background:"#fee2e2",border:"none",color:RED,borderRadius:7,padding:"7px 11px",fontSize:11,fontWeight:600}}>✕ সরান</button>
              </div>
            </div>:<button onClick={()=>idCardInput.current.click()} style={{width:"100%",background:"white",border:`2px dashed ${PAY_BORDER}`,color:PAY_DARK,borderRadius:8,padding:"11px",fontSize:12,fontWeight:600}}>📷 আইডি কার্ডের ছবি তুলুন বা বেছে নিন</button>}
            <input ref={idCardInput} type="file" accept="image/*" onChange={handleIdCardImg} style={{display:"none"}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            {editingWorkerId&&<button onClick={()=>{setEditingWorkerId(null);setNewWorker(blankWorker)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"12px",fontSize:13}}>বাতিল</button>}
            <button onClick={editingWorkerId?saveEditWorker:saveNewWorker} style={{flex:2,background:PAY,color:"white",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:700}}>{editingWorkerId?"সংরক্ষণ করুন":"যোগ করুন"}</button>
          </div>
        </div>
        <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>কর্মী তালিকা ({workers.length})</div>
        {workers.length===0?<div style={{textAlign:"center",color:"#aaa",padding:30,fontSize:13}}>এখনো কোনো কর্মী যোগ করা হয়নি</div>:
        sortByDept(workers).map(w=><div key={w.id} style={{background:"white",borderRadius:11,padding:"12px 14px",marginBottom:9,boxShadow:"0 1px 4px rgba(0,0,0,.07)",opacity:w.active===false?0.6:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",gap:10}}>
            <WorkerAvatar worker={w} size={40}/>
            {w.idCardImg&&<img src={w.idCardImg} onClick={()=>setViewingIdCard(w)} style={{width:44,height:34,objectFit:"cover",borderRadius:6,border:"1px solid #ddd",flexShrink:0,cursor:"pointer"}} alt="ID"/>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:14}}>{w.name}{w.active===false&&<span style={{fontSize:10,color:"#999",fontWeight:400}}> (নিষ্ক্রিয়)</span>}</div>
              <div style={{fontSize:11,color:"#888",marginTop:2,display:"flex",alignItems:"center",gap:5}}><span style={{width:8,height:8,borderRadius:"50%",background:deptColor(w.department),display:"inline-block",flexShrink:0}}></span>{w.department} · দৈনিক {money(w.dailyRate)}</div>
              {w.voterId&&<div style={{fontSize:11,color:"#888",marginTop:1}}>ভোটার আইডি: {w.voterId}</div>}
              <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>

/* ── MANAGE DB ── */
function ManageDB({db,saveDb,galleries,saveGalleryEntry,onBack,navigate,goBack,replaceTop,curScreen,highlightNo,orders,onMergeMany,onRenameVariant,onMoveVariant,onRecodeVariant,onWoodChange,onMergeVariants}){
  // ── এই পেজের ভেতরের নেভিগেশন (তালিকা ↔ + ক্যাটাগরি ↔ + ভেরিয়েন্ট ↔ কাঠ সম্পাদনা ↔ ছবি) এখন
  // নিজের সাময়িক মেমোরিতে না — অ্যাপের মূল নেভিগেশন-স্ট্যাকে থাকে (Hist-এর ফিল্টারের মতোই),
  // যাতে ফোনের ব্যাক বাটন এক ধাপ করেই পেছাতে পারে, সরাসরি ড্যাশবোর্ডে চলে না যায় ──
  const tab=curScreen.tab||"list";
  const selCat=curScreen.selCat||"";
  const selVar=curScreen.selVar||"";
  const galleryCat=curScreen.selCat||"";
  const galleryVar=curScreen.selVar||"";
  const setTab=(t)=>navigate({page:"manage",tab:t});
  const[newCat,setNewCat]=useState({key:"",bn:"",en:""});
  const[newVar,setNewVar]=useState({catKey:"",key:"",bn:"",code:""});
  const[editSections,setEditSections]=useState(null);
  const[newPiece,setNewPiece]=useState({sectionIdx:0,bn:"",pc:"",h:"",l:"",w:""});
  const[expandedJointFor,setExpandedJointFor]=useState(null);
  // v4.45: কাঠের তালিকায় কোন পিসটা এখন সম্পাদনায় আছে — {si,pi,bn,w,h,l,pc}
  const[editingPiece,setEditingPiece]=useState(null);
  // ── এক মডেলের কাঠের তালিকা (সব সেকশনসহ) কপি করে আরেক মডেলে বসানোর জন্য — কাছাকাছি মডেলের
  // পুরো তালিকা কপি করে নতুন মডেলে পেস্ট করে শুধু যেখানে দরকার এডিট করা যায় ──
  const[copiedSections,setCopiedSections]=useState(null);
  const[copiedFromName,setCopiedFromName]=useState("");
  // ── "কাঠ" ট্যাবে ঢোকার সময় (বা ভিন্ন মডেলে গেলে) সম্পাদনার কপিটা তাজা করে নেওয়া — useLayoutEffect
  // যাতে পুরনো মডেলের ডেটা এক ফ্রেমের জন্যও দেখা না যায় ──
  useLayoutEffect(()=>{
    setEditingPiece(null);
    if(tab==="edit"&&selCat&&selVar&&db[selCat]&&db[selCat].variants&&db[selCat].variants[selVar]){
      setEditSections(JSON.parse(JSON.stringify(db[selCat].variants[selVar].sections||[])));
    }
  },[tab,selCat,selVar]);

  const addCategory=()=>{
    if(!newCat.key||!newCat.bn)return;
    // ── v4.52: একই চাবির ক্যাটাগরি থাকলে আগে পুরনোটা তার সব মডেলসহ নিঃশব্দে মুছে যেত; আর একই
    // নামে দুটো ক্যাটাগরি থেকেই "অন্য ক্যাটাগরিতে একই মডেল" সমস্যার শুরু — দুটোই এখন আটকানো হয় ──
    const nk=newCat.key.trim();
    if(!nk||nk==="zz_deletedRecord"||/^__.*__$/.test(nk)){alert("⚠️ এই চাবিটা ব্যবহার করা যাবে না — অন্য চাবি দিন।");return}
    if(db[nk]){alert(`⚠️ "${nk}" চাবির ক্যাটাগরি ("${(db[nk]&&db[nk].bn)||nk}") আগেই আছে — অন্য চাবি দিন।`);return}
    const sameCat=dbCats(db).find(([,c])=>normModelName(c.bn)===normModelName(newCat.bn));
    if(sameCat){alert(`⚠️ "${sameCat[1].bn}" নামে ক্যাটাগরি আগেই আছে — একই নামে দুটো ক্যাটাগরি রাখা হয় না।`);return}
    const nd={...db,[nk]:{bn:newCat.bn,en:newCat.en||newCat.bn,variants:{}}};
    saveDb(nd);setNewCat({key:"",bn:"",en:""});goBack();
  };
  const addVariant=()=>{
    if(!newVar.catKey||!newVar.bn||!newVar.bn.trim()||!db[newVar.catKey])return;
    // ── v4.45: চাবি আর নাম থেকে বানানো হয় না। আগে নামের প্রথম কয়েক অক্ষর থেকে চাবি হতো, ফলে
    // "স্ট্যান্ডার্ড খাট" আর "স্ট্যান্ডার্ড বক্স খাট" একই চাবি পেত — একই ক্যাটাগরিতে যোগ করলে
    // পুরনো মডেলটা (কাঠের মাপসহ) নিঃশব্দে মুছে যেত ──
    const vKey=newVar.key&&!(db[newVar.catKey].variants||{})[newVar.key]?newVar.key:newUniqueVarKey(db);
    const typed=(newVar.code||"").trim();
    if(typed){
      const clash=findCodeOwner(db,typed,null);
      if(clash){alert(`⚠️ "${typed}" কোডটা আগে থেকেই "${clash.varBn}" (${clash.catBn}) মডেলে আছে — অন্য কোড দিন, অথবা খালি রাখুন (তাহলে অটো তৈরি হবে)।`);return}
    }
    // ── v4.52: এই ক্যাটাগরিতে একই নামের মডেল থাকলে জিজ্ঞেস করা হয় ──

    // পুরো ডেটাবেসের সব ক্যাটাগরির সব মডেলের সাথে মেলানো (ছোট/বড় হাতের অক্ষর আলাদা ধরা হয় না)
    const clash=findCodeOwner(db,newCode,catK+"|"+varK);
    if(clash){alert(`⚠️ "${newCode}" কোডটা আগে থেকেই "${clash.varBn}" (${clash.catBn}) মডেলে আছে — অন্য কোড দিন।`);return}
    const nd=JSON.parse(JSON.stringify(db));
    nd[catK].variants[varK].code=newCode;

    if(onRecodeVariant)onRecodeVariant(catK,varK,newCode);
    setEditingCode(null);
  };
  const moveVariant=async(fromCat,varK,toCat)=>{

          keptSections=keepMoved?(mv.sections||[]):(other.sections||[]);

        return;
      }
    }
    const nd=JSON.parse(JSON.stringify(db));
    const theVar=(nd[fromCat].variants||{})[varK];
    if(!theVar){setMovingVar(null);return}
    if(!nd[toCat].variants)nd[toCat].variants={};
    // ── v4.45: গন্তব্যে একই অভ্যন্তরীণ চাবির মডেল থাকলে আর আটকানো হয় না — সরানো মডেলটা নতুন একটা
    // চাবি পায়। আর একই নামের মডেল থাকলে নাম হয় "নাম (১)", সেটাও থাকলে "(২)" … — পরে দুটো মিলিয়ে
    // দেখে একই হলে 🔗 মেশান দিয়ে একত্র করা যায় ──
    const newKey=nd[toCat].variants[varK]?newUniqueVarKey(nd):varK;
    const oldName=theVar.bn||"";

    nd[toCat].variants[newKey]={...theVar,bn:newName};

    if(fromCat==="zz_recovered"&&Object.keys(nd[fromCat].variants).length===0)delete nd[fromCat];

    const g=galleries&&galleries[`${fromCat}__${varK}`];
    if(g&&saveGalleryEntry)saveGalleryEntry(toCat,newKey,{gallery:g.gallery||[],coverImage:g.coverImage||null});
    if(onMoveVariant)onMoveVariant(fromCat,toCat,varK,newKey,newName!==oldName?newName:null);
    setMovingVar(null);
  };

/* ── FORM (no wood editing here anymore, smart delivery date, inline new-category) ── */
function Form({recentRates,onSave,onBack,db,saveDb,galleries,woodSettings,laborSettings,orders,getNextOrderNumber}){
  const today=todayStr();
  const[orderNo,setOrderNo]=useState(null);
  useEffect(()=>{
    let cancelled=false;
    getNextOrderNumber().then(no=>{if(!cancelled)setOrderNo(no)});
    return()=>{cancelled=true};
  },[]);
  const[step,setStep]=useState(1);
  const[c,setC]=useState({name:"",phone:"",phone2:"",address:"",date:today,delivery:addDays(today,60),notes:""});
  const[emergency,setEmergency]=useState(false);
  const[useRealistic,setUseRealistic]=useState(false);
  const[customDelivery,setCustomDelivery]=useState(false);
  const realisticEst=useMemo(()=>computeRealisticDeliveryDays(orders),[orders]);
  const[payments,setPayments]=useState([{date:today,amount:"",note:"অগ্রিম"}]);
  const[items,setItems]=useState([]);
  const[adding,setAdding]=useState(false);
  const[ni,setNi]=useState({catKey:"",varKey:"",wood:"S",qty:"",price:"",notes:""});
  const[refImgs,setRefImgs]=useState([]);
  const refInput=useRef();
  const[newCatMode,setNewCatMode]=useState(false);
  const[newCatName,setNewCatName]=useState("");
  const[newCatVarName,setNewCatVarName]=useState("");
  const[newModelName,setNewModelName]=useState("");
  const[varDropdownOpen,setVarDropdownOpen]=useState(false);
  const[custPickJustDone,setCustPickJustDone]=useState(false);
  const[activeField,setActiveField]=useState("phone");

  // ── ফোন নম্বর ধরে পুরনো গ্রাহকের ইনডেক্স — মোট ক্রয়মূল্য অনুযায়ী র‍্যাংক সহ ──
  // এটা সংরক্ষিত হয় না, প্রতিবার orders থেকে সরাসরি হিসাব হয় — তাই নতুন অর্ডারের পরেই র‍্যাংক স্বয়ংক্রিয়ভাবে বদলে যায়
  const customerIndex=useMemo(()=>{
    const map={};
    (orders||[]).filter(o=>!o.cancelled).forEach(o=>{
      const phone=(o.cust.phone||"").trim();
      if(!phone)return;
      if(!map[phone])map[phone]={phone,phone2:"",name:o.cust.name,address:o.cust.address,totalSpent:0,pastOrders:[],_latestAt:""};
      const cust=map[phone];
      cust.totalSpent+=parseFloat(o.cust.total)||0;
      cust.pastOrders.push({date:o.cust.date,items:(o.items||[]).map(it=>it.variantBn).join(", "),total:o.cust.total});
      const stamp=o.at||o.cust.date||"";
      if(!cust._latestAt||stamp>=cust._latestAt){cust.name=o.cust.name;cust.address=o.cust.address;cust.phone2=o.cust.phone2||cust.phone2;cust._latestAt=stamp}
      else if(o.cust.phone2&&!cust.phone2)cust.phone2=o.cust.phone2; // পুরনো এন্ট্রিতে ২য় নম্বর থাকলেও যাতে হারিয়ে না যায়
    });
    const list=Object.values(map).sort((a,b)=>b.totalSpent-a.totalSpent);
    list.forEach((cust,i)=>{cust.rank=i+1;cust.pastOrders.sort((a,b)=>(b.date||"").localeCompare(a.date||""))});
    return list;
  },[orders]);

  const customerSuggestions=useMemo(()=>{
    if(custPickJustDone)return[];
    const nameQ=c.name.trim().toLowerCase();
    const phoneQ=c.phone.trim();
    if(nameQ.length<2&&phoneQ.length<3)return[];
    return customerIndex.filter(cust=>
      (nameQ.length>=2&&cust.name.toLowerCase().includes(nameQ))||
      (phoneQ.length>=3&&(cust.phone.includes(phoneQ)||(cust.phone2&&cust.phone2.includes(phoneQ))))
    ).slice(0,5);
  },[customerIndex,c.name,c.phone,custPickJustDone]);

  const pickCustomer=(cust)=>{
    setC({...c,name:cust.name,phone:cust.phone,phone2:cust.phone2||"",address:cust.address});
    setCustPickJustDone(true);
  };

  const fCat=ni.catKey?db[ni.catKey]:null;
  const fVar=fCat&&ni.varKey&&ni.varKey!=="__NEW__"?fCat.variants[ni.varKey]:null;
  // ── ১. দাম নির্ধারণের সহায়ক: এই মডেল+কাঠে আনুমানিক খরচ, ও আগের একই রকম অর্ডারে কত দাম নেওয়া হয়েছিল ──
  const pricingHint=useMemo(()=>{
    if(!fVar||isEmptyWood(fVar))return null;
    const cftVal=totalCft(fVar.sections)*(ni.qty||1);
    const draftItem={wood:ni.wood,qty:parseFloat(ni.qty)||1,sections:fVar.sections};
    const woodCost=itemWoodCost(draftItem,{cust:{date:todayStr()}},woodSettings);
    // v4.61: কাঠ (অপচয় ধরা চূড়ান্ত দাম) + সাম্প্রতিক ১২ সপ্তাহের আসল বেতন/CFT + অন্যান্য খরচ/CFT
    const lRate=parseFloat((laborSettings&&laborSettings.ratePerCft)||0);
    const salR=(recentRates&&recentRates.salPerCft!=null)?recentRates.salPerCft:lRate;
    const expR=(recentRates&&recentRates.expPerCft!=null)?recentRates.expPerCft:0;
    const salaryEst=cftVal*salR,expenseEst=cftVal*expR;
    const estCost=woodCost+salaryEst+expenseEst;
    const past=(orders||[]).filter(o=>!o.cancelled).flatMap(o=>(o.items||[]).filter(it=>it.catKey===ni.catKey&&it.varKey===ni.varKey&&it.wood===ni.wood&&parseFloat(it.price)>0).map(it=>({price:parseFloat(it.price),qty:it.qty||1,date:o.cust.date||"",order:o,item:it})))
      .sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,5);
    if(past.length===0)return{estCost,cftVal,woodCost,salaryEst,expenseEst,past:[]};
    const perUnitPrices=past.map(p=>p.price); // মূল্য ইতিমধ্যেই প্রতি-ইউনিট, আর ভাগ করার দরকার নেই
    const minP=Math.min(...perUnitPrices),maxP=Math.max(...perUnitPrices);
    const margins=past.map(p=>{
      const pWoodCost=itemWoodCost(p.item,p.order,woodSettings);
      const pLRate=orderLabourRate(p.order,laborSettings);
      const pCft=totalCft(p.item.sections||[])*(p.item.qty||1);
      const pCost=pWoodCost+pCft*((recentRates&&recentRates.salPerCft!=null)?recentRates.salPerCft:pLRate)+pCft*((recentRates&&recentRates.expPerCft)||0);
      return pCost>0?((p.price-pCost)/p.price)*100:null;
    }).filter(m=>m!==null);
    const avgMargin=margins.length?margins.reduce((s,m)=>s+m,0)/margins.length:null;
    return{estCost,cftVal,woodCost,salaryEst,expenseEst,past,minP,maxP,avgMargin};
  },[fVar,ni.catKey,ni.varKey,ni.wood,ni.qty,orders,woodSettings,laborSettings,recentRates]);
  const itemsTotal=items.reduce((s,it)=>s+(parseFloat(it.price)||0)*(parseFloat(it.qty)||1),0);

    nd[ni.catKey].variants[varKey]={bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]};

  const handleRefImg=async(e)=>{

    if(!orderNo){alert("একটু অপেক্ষা করুন, অর্ডার নম্বর তৈরি হচ্ছে — কয়েক সেকেন্ড পর আবার চেষ্টা করুন।");return}
    let baseIdx=refImgs.length;

    for(const file of files){

      baseIdx++;

      const relPath=`${categoryFolder}/${baseFileName}`;

    }

  };
  const updateCaption=(idx,val)=>{

  const submit=()=>{

    if(!orderNo){alert("একটু অপেক্ষা করুন, অর্ডার নম্বর তৈরি হচ্ছে — কয়েক সেকেন্ড পর আবার চেষ্টা করুন।");return}
    // ঐতিহাসিক ব্যয় নীতি: অর্ডার তৈরির সময়ের কাঠ ও শ্রমের দাম স্থায়ীভাবে সংরক্ষণ করা হয়,

    const itemsWithRate=items.map(it=>{

      });
      const snapshots={};
      usedWoods.forEach(w=>{snapshots[w]=woodRateOn(woodSettings,w,c.date)||0});
      return{...it,woodRateSnapshot:snapshots[it.wood]||null,woodRateSnapshots:snapshots};
    });
    onSave({no:orderNo,cust:{...c,total:itemsTotal},items:itemsWithRate,payments,refImgs,printLogs:{},itemProgress:{},labourRateSnapshot:laborRateOn(laborSettings,c.date)||null,at:new Date().toISOString()});
  };

      <span style={{fontWeight:700,fontSize:15}}>নতুন অর্ডার</span>
    </div>
    <div style={{background:"white",display:"flex",borderBottom:"1px solid #eee"}}>
      {[{id:1,l:"গ্রাহকের তথ্য"},{id:2,l:"ফার্নিচার ও ছবি"},{id:3,l:"পেমেন্ট"}].map(s=><button key={s.id} onClick={()=>setStep(s.id)} style={{flex:1,padding:"11px 4px",border:"none",background:"none",fontSize:12,fontWeight:step===s.id?700:400,color:step===s.id?RED:"#888",borderBottom:step===s.id?`3px solid ${RED}`:"3px solid transparent"}}>{s.l}</button>)}
    </div>
    <div style={{padding:"16px",maxWidth:560,margin:"0 auto"}}>

          </label>
        </div>
        {!emergency&&<div style={{background:"#f0f9ff",borderRadius:10,padding:"10px 12px",marginBottom:14}}>

        </div>}

            <div style={{marginTop:5,paddingTop:5,borderTop:"1px dashed #f0e0c0"}}>

                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"70%"}}>{fmtDate(po.date)} — {po.items}</span>
                <strong style={{color:"#166534"}}>{money(po.total)}</strong>
              </div>)}
              {cust.pastOrders.length>3&&<div style={{fontSize:9,color:"#aaa"}}>...ও আরও {cust.pastOrders.length-3}টি অর্ডার</div>}
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginTop:3}}>সর্বমোট ক্রয়: {money(cust.totalSpent)}</div>

        <div style={{marginBottom:11}}>
          {lbl("২য় মোবাইল (ঐচ্ছিক)")}
          <input type="tel" value={c.phone2} onChange={e=>setC({...c,phone2:e.target.value})} placeholder="বিকল্প নম্বর, না থাকলে খালি রাখুন" style={inp}/>
        </div>
        <div style={{marginBottom:11}}>
          {lbl("ঠিকানা")}
          <input type="text" value={c.address} onChange={e=>setC({...c,address:e.target.value})} placeholder="বিস্তারিত ঠিকানা" style={inp}/>
        </div>
        <div style={{marginBottom:14}}>{lbl("বিশেষ মন্তব্য")}<textarea rows={2} value={c.notes} onChange={e=>setC({...c,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={()=>setStep(2)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"14px",fontSize:14,fontWeight:700}}>পরবর্তী →</button>
      </>}
      {step===2&&<>
        <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📷 রেফারেন্স ছবি (ঐচ্ছিক, একাধিক যোগ করা যাবে)</div>
          {refImgs.map((img,idx)=><div key={idx} style={{marginBottom:10,background:"#fafafa",borderRadius:8,padding:8}}>
            <img src={img.src} onClick={()=>openLightbox(img.src)} style={{maxWidth:"100%",maxHeight:140,objectFit:"contain",borderRadius:7,border:"1px solid #eee",display:"block",margin:"0 auto 6px",cursor:"pointer"}} alt="ref"/>
            <div style={{display:"flex",gap:6}}>
              <input value={img.caption} onChange={e=>updateCaption(idx,e.target.value)} placeholder="ক্যাপশন" style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none"}}/>
              <button onClick={()=>removeRefImg(idx)} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"6px 10px",color:RED,fontSize:11}}>✕</button>
            </div>
          </div>)}
          <input ref={refInput} type="file" accept="image/*" multiple onChange={handleRefImg} style={{display:"none"}}/>
          <button onClick={()=>refInput.current.click()} style={{width:"100%",background:"#f0f0f0",border:"2px dashed #aaa",borderRadius:9,padding:"10px",fontSize:12,color:"#555"}}>📂 ছবি বেছে নিন বা স্ক্যান করুন (একাধিক)</button>
        </div>
        {items.map((it,i)=><div key={i} style={{background:"white",borderRadius:10,padding:"10px 12px",marginBottom:8,borderLeft:`4px solid ${RED}`,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>

            <button onClick={()=>setItems(items.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"4px 8px",color:RED,fontSize:11}}>বাদ</button>
          </div>
        </div>)}
        {adding?<div style={{background:"white",borderRadius:12,padding:"14px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>

          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={ni.catKey} varKey={ni.varKey} onSelect={(ck,vk)=>setNi({...ni,catKey:ck,varKey:vk})}/>
          {fVar&&isEmptyWood(fVar)&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#991b1b"}}>⚠️ এই মডেলের কাঠের মাপ এখনো যোগ করা হয়নি। অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে যোগ করুন।</div>}
          {lbl("কাঠের ধরন")}
          <select value={ni.wood} onChange={e=>setNi({...ni,wood:e.target.value})} style={{...inp,marginBottom:10}}>
            {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn} ({v.en})</option>)}
          </select>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div>{lbl("পরিমাণ")}<input type="number" min={1} value={ni.qty} placeholder="1" onChange={e=>setNi({...ni,qty:e.target.value})} style={inp}/></div>
            <div style={{display:"flex",alignItems:"flex-end"}}>{fVar&&<div style={{background:"#f0fdf4",borderRadius:9,padding:"10px 11px",fontSize:12,fontWeight:700,color:"#166534",width:"100%"}}>CFT: {(totalCft(fVar.sections)*(parseFloat(ni.qty)||1)).toFixed(2)}</div>}</div>
          </div>
          {pricingHint&&<div style={{background:"#faf5ff",border:"1px solid #ddd6fe",borderRadius:8,padding:"9px 11px",marginBottom:11,fontSize:11,color:"#4c1d95",lineHeight:1.6}}>
            <div>💡 আনুমানিক পুরো খরচ: <strong>~{money(Math.round(pricingHint.estCost))}</strong></div>
            <div style={{fontSize:10,color:"#6b5b95"}}>কাঠ ~{money(Math.round(pricingHint.woodCost||0))} · বেতন ~{money(Math.round(pricingHint.salaryEst||0))} · অন্যান্য খরচ ~{money(Math.round(pricingHint.expenseEst||0))}</div>
            {pricingHint.past.length>0?<>
              <div>আগের {pricingHint.past.length}টা একই মডেল+কাঠের অর্ডারে দাম নিয়েছেন: <strong>{money(Math.round(pricingHint.minP))}–{money(Math.round(pricingHint.maxP))}</strong></div>
              {pricingHint.avgMargin!==null&&<div>গড় লাভ ছিল: <strong style={{color:pricingHint.avgMargin>=0?"#166534":RED}}>{pricingHint.avgMargin.toFixed(0)}%</strong></div>}
            </>:<div style={{color:"#7c6f9a"}}>এই মডেল+কাঠে আগে কোনো অর্ডার নেই — নতুন হিসেবে দাম ঠিক করুন</div>}
          </div>}
          <div style={{marginBottom:12}}>{lbl("এই ফার্নিচারের মূল্য (৳)")}<input type="number" value={ni.price} onChange={e=>setNi({...ni,price:e.target.value})} placeholder="0" style={{...inp,fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          <div style={{background:"#eff6ff",borderRadius:8,padding:"8px 10px",marginBottom:11,fontSize:11,color:"#1d4ed8"}}>ℹ️ কাঠের বিস্তারিত মাপ পরিবর্তন করতে হলে অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে এডিট করুন</div>
          {lbl("বিশেষ নির্দেশনা")}
          <textarea rows={2} value={ni.notes} onChange={e=>setNi({...ni,notes:e.target.value})} style={{...inp,resize:"vertical",marginBottom:11}}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setAdding(false)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"11px",fontSize:13}}>বাতিল</button>
            <button onClick={addItem} disabled={!fVar} style={{flex:2,background:fVar?RED:"#ccc",color:"white",border:"none",borderRadius:9,padding:"11px",fontSize:13,fontWeight:700}}>যোগ করুন</button>
          </div>
        </div>:<button onClick={()=>setAdding(true)} style={{width:"100%",background:"white",border:`2px dashed ${RED}`,color:RED,borderRadius:10,padding:"13px",fontSize:13,fontWeight:600,marginBottom:12}}>+ ফার্নিচার যোগ করুন</button>}
        {items.length>0&&!adding&&<div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:14,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>মোট মূল্য (সব ফার্নিচার মিলিয়ে):</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>}
        {items.length>0&&!adding&&<button onClick={()=>setStep(3)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>পরবর্তী → পেমেন্ট</button>}
      </>}
      {step===3&&<>
        <div style={{background:"white",borderRadius:11,padding:"12px 14px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>🧾 কোন ফার্নিচারের দাম কত</div>
          {items.map((it,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"5px 0",borderTop:i>0?"1px dashed #eee":"none"}}>
            <span style={{color:"#333"}}>[{it.code}] {it.variantBn} <span style={{color:"#999",fontSize:10}}>({it.woodBn} × {it.qty})</span></span>
            <span style={{fontWeight:700,color:"#166534",flexShrink:0,marginLeft:8}}>{money((parseFloat(it.price)||0)*(parseFloat(it.qty)||1))}</span>
          </div>)}
        </div>
        <div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:16,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>ফার্নিচারের মোট মূল্য (যোগফল):</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>
        <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>💵 পেমেন্টের তালিকা</div>
        {payments.map((p,i)=><div key={i} style={{background:"white",borderRadius:12,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.08)",border:"1.5px solid #f0f0f0"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>{lbl("তারিখ")}<DateInput value={p.date} onChange={v=>{const ps=[...payments];ps[i]={...ps[i],date:v};setPayments(ps)}} accent="#16a34a"/></div>
            <div>{lbl("পরিমাণ (৳)")}<input type="number" value={p.amount} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],amount:e.target.value};setPayments(ps)}} placeholder="0" style={{...inp,padding:"12px",fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"end"}}>
            <div style={{flex:1}}>{lbl("নোট")}<input value={p.note} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],note:e.target.value};setPayments(ps)}} placeholder="যেমন: অগ্রিম, ২য় কিস্তি" style={{...inp,padding:"12px",fontSize:13}}/></div>
            <button onClick={()=>setPayments(payments.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:9,padding:"12px 14px",color:RED,fontSize:14,fontWeight:700}}>✕</button>
          </div>
        </div>)}
        <button onClick={()=>setPayments([...payments,{date:today,amount:"",note:"পেমেন্ট"}])} style={{width:"100%",background:"white",border:"2px dashed #16a34a",color:"#16a34a",borderRadius:12,padding:"14px",fontSize:14,fontWeight:700,marginBottom:16}}>+ আরো পেমেন্ট যোগ করুন</button>
        {itemsTotal>0&&<div style={{background:"#f0fdf4",borderRadius:12,padding:"16px",marginBottom:16,border:"1.5px solid #bbf7d0"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট মূল্য:</span><span style={{fontWeight:700}}>{money(itemsTotal)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:16,borderTop:"1.5px solid #bbf7d0",paddingTop:10}}><span style={{fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:rem>0?RED:"#166534",fontSize:18}}>{money(rem)}</span></div>
        </div>}
        <button onClick={submit} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>অর্ডার নিশ্চিত করুন → স্লিপ দেখুন</button>
      </>}
    </div>
  </div>
}

/* ── PREVIEW (each slip prints independently now) ── */
function Preview({syncInfo,online,order,onBack,slip,setSlip,onUpdate,onAddPayment,onSetDelivered,onDelete,db,saveDb,carpenters,saveCarpenters,galleries,saveGalleryEntry,woodSettings,laborSettings,workers,allOrders,rackSplits}){
  const totalPaid=(order.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const isFullyPaid=parseFloat(order.cust.total)>0&&totalPaid>=(parseFloat(order.cust.total)||0);
  const[addingPay,setAddingPay]=useState(false);
  // ── আগে এখানে পেমেন্ট-এডিট আর তথ্য-সম্পাদনা ফর্ম ছিল, যা সব ট্যাবেই (গ্রাহক/অর্ডার
  // বুক/ট্র্যাকিং/...) দেখা যেত। এখন সব এডিট শুধু "অর্ডার বুক কপি" ট্যাবে (S2), সংশ্লিষ্ট
  // জায়গাতেই, প্রতিটা তথ্য আলাদাভাবে এডিট করা যায় ──
  // ── আগে এখানে রেফারেন্স ছবি+কার্পেন্টার+পরিবহন একসাথে প্রিন্ট করার বাটন ছিল। এখন এর বদলে
  // কার্পেন্টার কপিতে রেফারেন্স ছবিতে ক্লিক করলেই সরাসরি ফুল-রেজোলিউশন ছবি নতুন ট্যাবে খুলে
  // যায় (প্রিন্ট/সেভ দুটোই করা যায়), তাই এই আলাদা বাটনের দরকার নেই ──
  const[newPay,setNewPay]=useState({date:todayStr(),amount:"",note:"পেমেন্ট"});
  // ── সরাসরি লাইভ order prop থেকে — কোনো স্থানীয় (স্টেল হতে পারে এমন) কপি রাখা হচ্ছে না,
  // যাতে অন্য ডিভাইস (যেমন ফোন) থেকে ছবি যুক্ত করলে এই স্ক্রিনও সাথে সাথে দেখতে পায় ──
  const deliveryImgs=order.deliveryImgs||(order.deliveryImg?[{src:order.deliveryImg,fileName:order.deliveryImgFileName||null}]:[]);
  const delInput=useRef();

  const handleDeliveryImg=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    const categoryFolder=orderImageFolder("finished",order);
    let next=[...deliveryImgs];
    let firstCompressed=null;
    for(const file of files){
      const compressed=await compressImage(file);
      if(!compressed)continue;
      if(!firstCompressed)firstCompressed=compressed;
      const baseFileName=genImgFileName(`${order.no}_delivery`,next.length+1,file);
      const relPath=`${categoryFolder}/${baseFileName}`;
      const savedFull=await saveFullResImage(file,relPath);
      next.push({src:compressed,fileName:savedFull?relPath:null});
    }
    onUpdate({...order,deliveryImgs:next,deliveryImg:next[0]?.src||null,deliveryImgFileName:next[0]?.fileName||null});
    // ── প্রথমবার যে ছবি একটা মডেলের জন্য পাওয়া যায়, সেটাই স্থায়ীভাবে কভার ছবি হয়ে থাকে —
    // পরের অর্ডারের ডেলিভারি ছবি দিয়ে আর বদলানো/যোগ করা হয় না, তাই ডেটাবেস প্রতি অর্ডারে
    // ভারী হতে থাকে না ──
    if(saveGalleryEntry&&order.items&&firstCompressed){
      const seen=new Set();
      order.items.forEach(it=>{
        if(!it.catKey||!it.varKey)return;
        const key=`${it.catKey}__${it.varKey}`;
        if(seen.has(key))return;
        seen.add(key);
        const existing=(galleries&&galleries[key])||{gallery:[],coverImage:null};
        if(existing.coverImage)return; // ইতিমধ্যে একটা কভার ছবি আছে — বদলানো হবে না
        saveGalleryEntry(it.catKey,it.varKey,{gallery:existing.gallery||[],coverImage:firstCompressed});
      });
    }
  };
  const removeDeliveryImg=(idx)=>{
    if(!window.confirm("এই ছবিটি মুছে ফেলতে চান?"))return;
    const next=deliveryImgs.filter((_,i)=>i!==idx);
    onUpdate({...order,deliveryImgs:next,deliveryImg:next[0]?.src||null,deliveryImgFileName:next[0]?.fileName||null});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    const amt=parseFloat(newPay.amount)||0;
    const remaining=Math.max(0,(parseFloat(order.cust.total)||0)-totalPaid);
    if(amt>remaining){
      alert(`⚠️ বাকি আছে মাত্র ${money(remaining)}, এর বেশি পেমেন্ট নেওয়া যাবে না — মোট মূল্যের চেয়ে বেশি পরিশোধ দেখানো যাবে না। টাকার অঙ্কটা ঠিক করে আবার চেষ্টা করুন।`);
      return;
    }
    onAddPayment(order.no,newPay);
    setAddingPay(false);setNewPay({date:todayStr(),amount:"",note:"পেমেন্ট"});
  };
  const logPrint=(slipKey)=>{
    const logs={...(order.printLogs||{})};
    logs[slipKey]=[...(logs[slipKey]||[]),todayStr()];
    onUpdate({...order,printLogs:logs});
    setTimeout(()=>window.print(),50);
  };
  const cancelOrder=()=>{
    if(window.confirm("আপনি কি নিশ্চিত এই অর্ডারটি বাতিল করতে চান? এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।")){
      onUpdate({...order,cancelled:true,cancelledAt:new Date().toISOString()});
    }
  };
  const restoreOrder=()=>{
    if(window.confirm("এই অর্ডারটি আবার সক্রিয় করতে চান?")){
      onUpdate({...order,cancelled:false});
    }
  };
  const permanentDelete=()=>{
    if(window.confirm("⚠️ এই অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান? এই কাজটি কখনো ফিরিয়ে আনা যাবে না, সব তথ্য হারিয়ে যাবে।")){
      if(window.confirm("সত্যিই নিশ্চিত? আরেকবার নিশ্চিত করুন।")){
        onDelete(order.no);
      }
    }
  };

  // ── v4.72: কার্পেন্টার আর ট্রান্সপোর্ট এখন একটাই ট্যাব (এক পাতায় দুই কপি) ──
  const tabs=[{id:0,l:"গ্রাহক",c:RED},{id:1,l:"অর্ডার বুক",c:"#1d4ed8"},{id:2,l:"ট্র্যাকিং",c:"#6d28d9"},{id:3,l:"কার্পেন্টার + ট্রান্সপোর্ট",c:"#334155"},{id:5,l:"ডেলিভারি",c:"#0f766e",locked:false}];

  return<div className="print-bg" style={{minHeight:"100vh",background:"#eee"}}>
    {!(online!==false&&syncInfo&&syncInfo.fresh)&&<div className="no-print" style={{background:"#fef2f2",color:"#991b1b",fontSize:11.5,fontWeight:700,padding:"8px 14px",lineHeight:1.5,borderBottom:"1px solid #fecaca"}}>⚠️ এই ডিভাইস এখনো সার্ভারের সাথে মেলানো হয়নি — এই অর্ডারের পেমেন্ট, বাকি বা ডেলিভারি চূড়ান্ত ধরে নেবেন না।</div>}
    <div className="no-print" style={{background:RED,color:"white",padding:"11px 14px",display:"flex",alignItems:"center",gap:9}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{flex:1,fontWeight:700,fontSize:13}}>#{order.no}{order.cancelled?" — ❌ বাতিল":""}</span>
      {order.cancelled?<><button onClick={restoreOrder} style={{background:"white",color:"#166534",border:"none",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700,marginRight:6}}>পুনরুদ্ধার</button>
      <button onClick={permanentDelete} style={{background:"#7f1d1d",color:"white",border:"1px solid white",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700}}>🗑 স্থায়ী ডিলিট</button></>
      :<button onClick={cancelOrder} style={{background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>❌ ক্যান্সেল</button>}
    </div>
    {order.cancelled&&<div className="no-print" style={{background:"#fee2e2",color:"#991b1b",padding:"8px 14px",textAlign:"center",fontSize:12,fontWeight:700}}>এই অর্ডারটি বাতিল করা হয়েছে ({order.cancelledAt?fmtDate(order.cancelledAt):""})</div>}
    <div className="no-print" style={{background:"white",padding:"12px 14px",borderBottom:"1px solid #eee"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:700}}>পেমেন্ট: {money(totalPaid)} / {money(order.cust.total)}</span>
        {isFullyPaid?<span style={{fontSize:11,background:"#dcfce7",color:"#166534",borderRadius:20,padding:"4px 12px",fontWeight:700}}>✅ সম্পূর্ণ পরিশোধ</span>:<button onClick={()=>setAddingPay(true)} style={{background:"#f0fdf4",border:"1.5px solid #86efac",color:"#166534",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700}}>+ পেমেন্ট যোগ করুন</button>}
      </div>
      {addingPay&&<div style={{background:"#fafafa",borderRadius:10,padding:12,border:"1px solid #eee"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>তারিখ</div><DateInput value={newPay.date} onChange={v=>setNewPay({...newPay,date:v})} accent="#16a34a"/></div>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>পরিমাণ (৳)</div><input type="number" value={newPay.amount} onChange={e=>setNewPay({...newPay,amount:e.target.value})} placeholder="0" style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:16,fontWeight:700,color:"#166534",outline:"none"}}/></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"end"}}>
          <div style={{flex:1}}><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>নোট</div><input value={newPay.note} onChange={e=>setNewPay({...newPay,note:e.target.value})} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:13,outline:"none"}}/></div>
          <button onClick={addPayment} style={{background:"#16a34a",color:"white",border:"none",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:700}}>সংরক্ষণ</button>
        </div>
      </div>}
    </div>
    <div className="no-print" style={{background:"white",display:"flex",overflowX:"auto",borderBottom:"1px solid #eee"}}>
      {tabs.map(t=><button key={t.id} onClick={()=>!t.locked&&setSlip(t.id)} style={{flexShrink:0,padding:"10px 11px",border:"none",background:"none",fontSize:11,fontWeight:slip===t.id?700:400,color:t.locked?"#ccc":slip===t.id?t.c:"#888",borderBottom:slip===t.id?`3px solid ${t.c}`:"3px solid transparent",cursor:t.locked?"not-allowed":"pointer"}}>{t.l}</button>)}
    </div>
    <div className="print-wrap" style={{padding:"12px",maxWidth:640,margin:"0 auto"}}>
      <div className="slip-card" style={{background:"white",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.1)"}}>
        {slip===0&&<S1 order={order} onPrint={logPrint}/>}
        {slip===1&&<S2 order={order} onPrint={logPrint} db={db} saveDb={saveDb} galleries={galleries} onUpdateOrder={onUpdate} woodSettings={woodSettings} laborSettings={laborSettings}/>}
        {slip===2&&<S3 order={order} onPrint={logPrint} onUpdateOrder={onUpdate} workers={workers}/>}
        {/* slip 4 ছিল আগের আলাদা ট্রান্সপোর্ট ট্যাব — পুরনো লিঙ্ক/হিস্ট্রি থেকে এলেও যেন ফাঁকা না দেখায় */}
        {(slip===3||slip===4)&&<S4T5 order={order} onPrint={logPrint} db={db} saveDb={saveDb} onUpdateOrder={onUpdate} woodSettings={woodSettings} rackSplits={rackSplits}/>}
        {slip===5&&<S6 order={{...order,deliveryImgs}} onPrint={logPrint} onUpdateOrder={onUpdate} onSetDelivered={onSetDelivered} onPhotoChange={handleDeliveryImg} onRemovePhoto={removeDeliveryImg} allOrders={allOrders} printLocked={!isFullyPaid}/>}
      </div>
    </div>
  </div>
}

/* ── HISTORY (with search) ── */
function Hist({syncInfo,online,orders,db,onBack,onView,highlightNo,q,setQ,statusFilter,setStatusFilter,catFilter,setCatFilter,sortMode,setSortMode}){
  // ── সার্চ/ফিল্টার/সর্ট এখন এই পেজের নিজের সাময়িক মেমোরিতে না — parent থেকে prop হিসেবে আসে
  // (নেভিগেশন স্ট্যাকে সংরক্ষিত), যাতে কোনো অর্ডারে ঢুকে ব্যাক করে ফিরলে যা বেছে নিয়েছিলেন
  // (সার্চ লেখা, স্ট্যাটাস ট্যাব, ক্যাটাগরি, সর্ট) তাই থেকে যায় ──
  // recent | rank
  // ── কাস্টমার র‍্যাংকিং — নতুন অর্ডার ফর্মে যেভাবে হিসাব হয়, এখানেও একই পদ্ধতি ──
  const customerRank=useMemo(()=>{
    const map={};
    (orders||[]).filter(o=>!o.cancelled).forEach(o=>{
      const phone=(o.cust.phone||"").trim();
      if(!phone)return;
      if(!map[phone])map[phone]={phone,totalSpent:0};
      map[phone].totalSpent+=parseFloat(o.cust.total)||0;
    });
    const list=Object.values(map).sort((a,b)=>b.totalSpent-a.totalSpent);
    const rankByPhone={};
    list.forEach((c,i)=>{rankByPhone[c.phone]=i+1});
    return rankByPhone;
  },[orders]);
  const categoryOf=(o)=>(o.items||[]).map(it=>(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn||"").split(" ")[0]).filter(Boolean);
  const allCategories=useMemo(()=>{
    const set=new Set();
    (orders||[]).forEach(o=>categoryOf(o).forEach(c=>set.add(c)));
    return[...set].sort();
  },[orders,db]);
  // ── ড্যাশবোর্ডের "জনপ্রিয় ফার্নিচার" তালিকার সাথে মিলিয়ে — কোন ক্যাটাগরি কত নম্বর জনপ্রিয়
  // (অর্ডার সংখ্যা অনুযায়ী, বাতিল বাদে) তা ফিল্টার-তথ্য বক্সে দেখানোর জন্য ──
  const categoryPopularityRank=useMemo(()=>{
    const counts={};
    (orders||[]).filter(o=>!o.cancelled).forEach(o=>categoryOf(o).forEach(c=>{counts[c]=(counts[c]||0)+1}));
    const ranked=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([label])=>label);
    const rankMap={};
    ranked.forEach((label,i)=>{rankMap[label]=i+1});
    return rankMap;
  },[orders]);
  const filtered=useMemo(()=>{
    let list=orders;
    if(q.trim()){
      const s=q.trim().toLowerCase();
      list=list.filter(o=>o.cust.name.toLowerCase().includes(s)||o.cust.phone.includes(s)||o.no.toLowerCase().includes(s));
    }
    if(statusFilter==="running")list=list.filter(o=>!o.cancelled&&!o.delivered&&!isOrderFullyProgressed(o));
    else if(statusFilter==="delivered")list=list.filter(o=>o.delivered);
    else if(statusFilter==="cancelled")list=list.filter(o=>o.cancelled);
    if(catFilter!=="all")list=list.filter(o=>categoryOf(o).includes(catFilter));
    if(sortMode==="rank"){
      return[...list].sort((a,b)=>{
        const ra=customerRank[(a.cust.phone||"").trim()]||9999,rb=customerRank[(b.cust.phone||"").trim()]||9999;
        return ra-rb;
      });
    }
    const runningList=list.filter(o=>!o.delivered).sort((a,b)=>new Date(b.at||b.cust.date)-new Date(a.at||a.cust.date));
    const deliveredList=list.filter(o=>o.delivered).sort((a,b)=>new Date(b.deliveredAt||b.cust.delivery||0)-new Date(a.deliveredAt||a.cust.delivery||0));
    return[...runningList,...deliveredList];
  },[orders,q,statusFilter,catFilter,sortMode,customerRank]);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    {!(online!==false&&syncInfo&&syncInfo.fresh)&&<div style={{background:"#fef2f2",color:"#991b1b",fontSize:11.5,fontWeight:700,padding:"8px 14px",lineHeight:1.5,borderBottom:"1px solid #fecaca"}}>⚠️ এই ডিভাইস এখনো সার্ভারের সাথে মেলানো হয়নি — এই তালিকার বাকি, পেমেন্ট বা ডেলিভারি চূড়ান্ত ধরে নেবেন না।</div>}
    <div style={{background:RED,color:"white",padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{fontWeight:700,fontSize:15}}>অর্ডার ইতিহাস ({orders.length})</span>
    </div>
    <div style={{padding:"14px",maxWidth:560,margin:"0 auto"}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন..." style={{width:"100%",border:"1.5px solid #ddd",borderRadius:11,padding:"13px 15px",fontSize:14,outline:"none",marginBottom:10,background:"white"}}/>
      <div style={{display:"flex",gap:6,marginBottom:8,overflowX:"auto"}}>
        {[{v:"all",l:"সব"},{v:"running",l:"চলমান"},{v:"delivered",l:"ডেলিভারড"},{v:"cancelled",l:"বাতিল"}].map(f=>
          <button key={f.v} onClick={()=>setStatusFilter(f.v)} style={{flexShrink:0,minHeight:36,padding:"7px 13px",borderRadius:20,border:statusFilter===f.v?"none":"1px solid #ddd",background:statusFilter===f.v?RED:"white",color:statusFilter===f.v?"white":"#666",fontSize:11,fontWeight:600}}>{f.l}</button>
        )}
        <button onClick={()=>setSortMode(sortMode==="rank"?"recent":"rank")} style={{flexShrink:0,minHeight:36,padding:"7px 13px",borderRadius:20,border:sortMode==="rank"?"none":"1.5px solid #fbbf24",background:sortMode==="rank"?"#92400e":"#fffbeb",color:sortMode==="rank"?"white":"#92400e",fontSize:11,fontWeight:700}}>👑 কাস্টমার র‍্যাংক</button>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:10}}>
        <select value={catFilter} onChange={e=>setCatFilter(e.target.value)} style={{flex:1,border:"1.5px solid #ddd",borderRadius:9,padding:"9px 8px",fontSize:11,background:"white"}}>
          <option value="all">সব ক্যাটাগরি</option>
          {allCategories.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      {(()=>{
        const fCount=filtered.length;
        // ── ক্যাটাগরি বাছা থাকলে শুধু সেই ক্যাটাগরির আইটেমগুলোর দাম যোগ হবে, পুরো অর্ডারের
        // মূল্য না (একটা অর্ডারে আলমারী + খাট দুটোই থাকলে আগে পুরো অর্ডারের টাকাটাই "আলমারী"তে
        // যোগ হয়ে যেত, যা ভুল ছিল) ──
        const itemCategoryOf=(it)=>(db&&it.catKey&&db[it.catKey])?db[it.catKey].bn:(it.variantBn||"").split(" ")[0];
        const fTotal=catFilter==="all"
          ?filtered.reduce((s,o)=>s+(parseFloat(o.cust.total)||0),0)
          :filtered.reduce((s,o)=>s+(o.items||[]).filter(it=>itemCategoryOf(it)===catFilter).reduce((ss,it)=>ss+(parseFloat(it.price)||0)*(parseFloat(it.qty)||1),0),0);
        const fAvg=fCount?fTotal/fCount:0;
        const popRank=catFilter!=="all"?categoryPopularityRank[catFilter]:null;
        return<div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto"}}>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:14,fontWeight:800,color:"#222"}}>{fCount}</div><div style={{fontSize:8,color:"#999"}}>অর্ডার</div></div>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:12,fontWeight:800,color:"#166534"}}>{money(fTotal)}</div><div style={{fontSize:8,color:"#999"}}>মোট মূল্য</div></div>
          <div style={{flexShrink:0,background:"white",border:"1px solid #eee",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:12,fontWeight:800,color:"#1d4ed8"}}>{money(fAvg)}</div><div style={{fontSize:8,color:"#999"}}>গড় মূল্য</div></div>
          {popRank&&<div style={{flexShrink:0,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"7px 12px",textAlign:"center"}}><div style={{fontSize:14,fontWeight:800,color:"#92400e"}}>#{popRank}</div><div style={{fontSize:8,color:"#92400e"}}>জনপ্রিয়তায়</div></div>}
        </div>
      })()}
      {filtered.length===0?<div style={{textAlign:"center",color:"#aaa",padding:"50px 20px",fontSize:13}}>কোনো অর্ডার পাওয়া যায়নি</div>
      :filtered.map((o,i)=>{
        const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        const full=parseFloat(o.cust.total)>0&&paid>=(parseFloat(o.cust.total)||0);
        const bg=highlightNo===o.no?"#e0f2fe":o.cancelled?"#fafafa":o.delivered?"#f0fdf4":"white";
        const borderColor=highlightNo===o.no?"#0ea5e9":o.cancelled?"#999":o.delivered?"#0f766e":full?"#16a34a":RED;
        const rank=customerRank[(o.cust.phone||"").trim()];
        return<div key={i} onClick={()=>onView(o)} style={{background:bg,borderRadius:11,marginBottom:9,boxShadow:"0 1px 4px rgba(0,0,0,.08)",border:o.delivered?"1px solid #99f6e4":"none",borderLeft:`4px solid ${borderColor}`,cursor:"pointer",opacity:o.cancelled?0.65:1,transition:"background .4s",display:"flex",overflow:"hidden"}}>
          {(o.deliveryImgs&&o.deliveryImgs[0])?
            <img src={o.deliveryImgs[0].src} onClick={e=>{e.stopPropagation();openLightbox(o.deliveryImgs[0].src)}} style={{width:64,alignSelf:"stretch",objectFit:"cover",flexShrink:0,cursor:"pointer"}}/>
            :<div style={{width:64,alignSelf:"stretch",background:"#f1f5f9",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,color:"#cbd5e1"}}>📦</div>}
          <div style={{flex:1,minWidth:0,padding:"12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div style={{display:"flex",minWidth:0,flex:1,gap:9}}>
                <div style={{minWidth:0,flexShrink:0,maxWidth:118}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontWeight:700,fontSize:13,textDecoration:o.cancelled?"line-through":"none",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",lineHeight:1.25}}>{o.cust.name}</span>
                    {sortMode==="rank"&&rank&&<span style={{fontSize:9,background:"#fef3c7",color:"#92400e",borderRadius:8,padding:"1px 7px",fontWeight:700,flexShrink:0}}>#{rank}</span>}
                  </div>
                  <div style={{fontSize:11,color:"#555",marginTop:1}}>{o.cust.phone}</div>
                  {o.cust.address&&<div style={{fontSize:9,color:"#888",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📍 {o.cust.address}</div>}
                  <div style={{fontSize:9,color:"#bbb",marginTop:1}}>{o.no}</div>
                </div>
                <div style={{width:1,background:"#e5e5e5",flexShrink:0,alignSelf:"stretch"}}></div>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:11,color:"#333",fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{categoryOf(o).join(", ")}</div>
                  <div style={{fontSize:9,color:"#999",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.items.map(it=>it.variantBn).join(", ")}</div>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                <div style={{fontWeight:700,fontSize:13,color:RED}}>{money(o.cust.total)}</div>
                <div style={{fontSize:10,color:o.cancelled?"#991b1b":o.delivered?"#0f766e":full?"#16a34a":"#f97316",marginTop:2,fontWeight:600}}>{o.cancelled?"❌ বাতিল":o.delivered?"📦 ডেলিভারড":full?"✅ পরিশোধ":`⏳ বাকি ${money((parseFloat(o.cust.total)||0)-paid)}`}</div>
                <div style={{fontSize:10,color:"#aaa",marginTop:1}}>{o.delivered?fmtDate(o.deliveredAt):fmtDate(o.cust.date)}</div>
              </div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",gap:6,marginTop:8}} onClick={e=>e.stopPropagation()}>
              <a href={`tel:${o.cust.phone}`} style={{width:112,textAlign:"center",background:"#eff6ff",color:"#1d4ed8",border:"none",borderRadius:6,padding:"8px 9px",minHeight:36,fontSize:10,fontWeight:700,textDecoration:"none"}}>📱 কল</a>
              <a href={`https://wa.me/${toIntlPhone(o.cust.phone)}`} target="_blank" rel="noopener noreferrer" style={{width:112,textAlign:"center",background:"#f0fdf4",color:"#166534",border:"none",borderRadius:6,padding:"8px 9px",minHeight:36,fontSize:10,fontWeight:700,textDecoration:"none"}}>💬 WhatsApp</a>
            </div>
          </div>
        </div>
      })}
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
