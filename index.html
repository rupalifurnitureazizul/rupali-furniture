          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#4b5563",color:"white"}}>
              {["কর্মীর নাম","বিভাগ","উপস্থিত দিন","দৈনিক হার","মোট আয়","অগ্রিম","প্রাপ্য"].map(h=><th key={h} style={{padding:"7px 6px",textAlign:"left",fontWeight:700,fontSize:11}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {activeWorkers.map((w,i)=><tr key={w.id} style={{background:i%2===0?"#f3f4f6":"white",borderBottom:"1px solid #e5e7eb",borderLeft:`3px solid ${deptColor(w.department)}`}}>
                <td style={{padding:"7px 6px",fontWeight:600}}>{w.name}</td>
                <td style={{padding:"7px 6px",fontSize:11,color:deptColor(w.department),fontWeight:600}}>{w.department}</td>
                <td style={{padding:"7px 6px",textAlign:"center"}}>{daysPresent(w.id)}</td>
                <td style={{padding:"7px 6px"}}>{money(w.dailyRate)}</td>
                <td style={{padding:"7px 6px"}}>{money(grossPay(w))}</td>
                <td style={{padding:"7px 6px",color:advanceTotal(w.id)>0?RED:"#999"}}>{advanceTotal(w.id)>0?"− "+money(advanceTotal(w.id)):"—"}</td>
                <td style={{padding:"7px 6px",fontWeight:800,color:"#166534"}}>{money(netPay(w))}</td>
              </tr>)}
            </tbody>
            <tfoot>
              <tr style={{background:"#111",color:"white"}}>
                <td colSpan={4} style={{padding:"9px 6px",fontWeight:700}}>সর্বমোট</td>
                <td style={{padding:"9px 6px",fontWeight:700}}>{money(grandTotalGross)}</td>
                <td style={{padding:"9px 6px",fontWeight:700}}>{money(grandTotalAdvance)}</td>
                <td style={{padding:"9px 6px",fontWeight:800,fontSize:13}}>{money(grandTotalNet)}</td>
              </tr>
            </tfoot>
          </table>
          <div style={{marginTop:24,display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
            {["হিসাবরক্ষক","পরিচালক — সাদমান সাকিব"].map(t=><div key={t} style={{borderTop:"1.5px solid #999",paddingTop:6,textAlign:"center",fontSize:11,color:"#666"}}>{t}</div>)}
          </div>
        </div>
      </>}
    </div>
  </div>
}

/* ── MANAGE DB ── */
function ManageDB({db,saveDb,galleries,saveGalleryEntry,onBack}){
  const[tab,setTab]=useState("list");
  const[newCat,setNewCat]=useState({key:"",bn:"",en:""});
  const[newVar,setNewVar]=useState({catKey:"",key:"",bn:"",code:""});
  const[selCat,setSelCat]=useState("");
  const[selVar,setSelVar]=useState("");
  const[editSections,setEditSections]=useState(null);
  const[newPiece,setNewPiece]=useState({sectionIdx:0,bn:"",pc:1,h:72,l:24,w:1});

  const addCategory=()=>{
    if(!newCat.key||!newCat.bn)return;
    const nd={...db,[newCat.key]:{bn:newCat.bn,en:newCat.en||newCat.bn,variants:{}}};
    saveDb(nd);setNewCat({key:"",bn:"",en:""});setTab("list");
  };
  const addVariant=()=>{
    if(!newVar.catKey||!newVar.bn)return;
    const vKey=newVar.key||newVar.bn.replace(/\s+/g,"_").toLowerCase().slice(0,12);
    const code=newVar.code||autoCode(newVar.bn,Object.keys(db[newVar.catKey].variants).length+1);
    const nd=JSON.parse(JSON.stringify(db));
    nd[newVar.catKey].variants[vKey]={bn:newVar.bn,code,sections:[{name:"কাঠের তালিকা",pieces:[]}]};
    saveDb(nd);setNewVar({catKey:"",key:"",bn:"",code:""});setTab("list");
  };
  const openEdit=(catK,varK)=>{setSelCat(catK);setSelVar(varK);setEditSections(JSON.parse(JSON.stringify(db[catK].variants[varK].sections)));setTab("edit")};
  const saveEdit=()=>{const nd=JSON.parse(JSON.stringify(db));nd[selCat].variants[selVar].sections=editSections;saveDb(nd);setTab("list")};
  const addSection=()=>setEditSections(prev=>[...prev,{name:"নতুন সেকশন",pieces:[]}]);
  const addPiece=()=>{const ns=JSON.parse(JSON.stringify(editSections));ns[newPiece.sectionIdx].pieces.push({bn:newPiece.bn,pc:parseInt(newPiece.pc)||1,h:parseFloat(newPiece.h)||72,l:parseFloat(newPiece.l)||24,w:parseFloat(newPiece.w)||1});setEditSections(ns);setNewPiece({...newPiece,bn:""})};
  const removePiece=(si,pi)=>{const ns=JSON.parse(JSON.stringify(editSections));ns[si].pieces.splice(pi,1);setEditSections(ns)};
  const resetDb=()=>{if(window.confirm("সব কাস্টম ফার্নিচার মুছে ডিফল্টে ফিরে যাবে?"))saveDb(JSON.parse(JSON.stringify(DEFAULT_DB)))};

  // ── Gallery management ──
  const[galleryCat,setGalleryCat]=useState("");
  const[galleryVar,setGalleryVar]=useState("");
  const galleryInput=useRef();
  const openGallery=(catK,varK)=>{setGalleryCat(catK);setGalleryVar(varK);setTab("gallery")};
  const galleryKey=(catK,varK)=>`${catK}__${varK}`;
  const currentGallery=()=>galleries&&galleries[galleryKey(galleryCat,galleryVar)]||{gallery:[],coverImage:null};
  const addGalleryImages=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    if(files.length===0)return;
    let cur=JSON.parse(JSON.stringify(currentGallery()));
    if(!cur.gallery)cur.gallery=[];
    for(const file of files){
      const compressed=await compressImage(file);
      if(!compressed)continue;
      cur.gallery.push(compressed);
      if(!cur.coverImage)cur.coverImage=compressed;
    }
    saveGalleryEntry(galleryCat,galleryVar,cur);
  };
  const removeGalleryImage=(idx)=>{
    const cur=JSON.parse(JSON.stringify(currentGallery()));
    const removed=cur.gallery[idx];
    cur.gallery.splice(idx,1);
    if(cur.coverImage===removed)cur.coverImage=cur.gallery[0]||null;
    saveGalleryEntry(galleryCat,galleryVar,cur);
  };
  const setCoverImage=(img)=>{
    const cur=JSON.parse(JSON.stringify(currentGallery()));
    cur.coverImage=img;
    saveGalleryEntry(galleryCat,galleryVar,cur);
  };
  const[renamingCat,setRenamingCat]=useState(null);
  const[renameVal,setRenameVal]=useState("");
  const startRenameCat=(catK)=>{setRenamingCat(catK);setRenameVal(db[catK].bn)};
  const saveRenameCat=(catK)=>{const nd=JSON.parse(JSON.stringify(db));nd[catK].bn=renameVal.trim()||nd[catK].bn;nd[catK].en=renameVal.trim()||nd[catK].en;saveDb(nd);setRenamingCat(null)};
  const[renamingVar,setRenamingVar]=useState(null);
  const[renameVarVal,setRenameVarVal]=useState("");
  const startRenameVar=(catK,varK)=>{setRenamingVar(catK+"|"+varK);setRenameVarVal(db[catK].variants[varK].bn)};
  const saveRenameVar=(catK,varK)=>{const nd=JSON.parse(JSON.stringify(db));nd[catK].variants[varK].bn=renameVarVal.trim()||nd[catK].variants[varK].bn;saveDb(nd);setRenamingVar(null)};

  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:8,padding:"9px 11px",fontSize:12,outline:"none"};
  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div className="no-print" style={{background:"#6d28d9",color:"white",padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{fontWeight:700,fontSize:15}}>ফার্নিচার ডেটাবেস</span>
    </div>
    <div style={{background:"white",display:"flex",borderBottom:"1px solid #eee"}}>
      {[{id:"list",l:"তালিকা"},{id:"addCat",l:"+ ক্যাটাগরি"},{id:"addVar",l:"+ ভেরিয়েন্ট"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 6px",border:"none",background:"none",fontSize:12,fontWeight:tab===t.id?700:400,color:tab===t.id?"#6d28d9":"#888",borderBottom:tab===t.id?"3px solid #6d28d9":"3px solid transparent"}}>{t.l}</button>)}
    </div>
    <div style={{padding:"14px",maxWidth:540,margin:"0 auto"}}>
      {tab==="list"&&<>
        {Object.entries(db).map(([catK,cat])=><div key={catK} style={{background:"white",borderRadius:10,marginBottom:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{background:"#6d28d9",color:"white",padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            {renamingCat===catK?<>
              <input value={renameVal} onChange={e=>setRenameVal(e.target.value)} style={{flex:1,border:"none",borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}} autoFocus/>
              <button onClick={()=>saveRenameCat(catK)} style={{background:"white",color:"#6d28d9",border:"none",borderRadius:6,padding:"5px 9px",fontSize:11,fontWeight:700}}>✓</button>
              <button onClick={()=>setRenamingCat(null)} style={{background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:6,padding:"5px 9px",fontSize:11}}>✕</button>
            </>:<>
              <span style={{fontWeight:700,fontSize:13,flex:1}}>{cat.bn} ({cat.en})</span>
              <button onClick={()=>startRenameCat(catK)} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:6,padding:"4px 9px",fontSize:11}}>✏️ নাম বদলান</button>
            </>}
          </div>
          {Object.entries(cat.variants).map(([vK,v])=><div key={vK} style={{padding:"8px 12px",borderBottom:"1px solid #f0f0f0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
            {renamingVar===catK+"|"+vK?<>
              <input value={renameVarVal} onChange={e=>setRenameVarVal(e.target.value)} style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"5px 8px",fontSize:12,outline:"none"}} autoFocus/>
              <button onClick={()=>saveRenameVar(catK,vK)} style={{background:"#6d28d9",color:"white",border:"none",borderRadius:6,padding:"5px 9px",fontSize:11,fontWeight:700}}>✓</button>
              <button onClick={()=>setRenamingVar(null)} style={{background:"#f3f4f6",border:"none",borderRadius:6,padding:"5px 9px",fontSize:11}}>✕</button>
            </>:<>
              {galleries&&galleries[`${catK}__${vK}`]&&galleries[`${catK}__${vK}`].coverImage&&<img src={galleries[`${catK}__${vK}`].coverImage} style={{width:32,height:32,objectFit:"cover",borderRadius:6,border:"1px solid #eee",flexShrink:0}} alt=""/>}
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{isEmptyWood(v)?"⚠️ ":""}{v.bn}</div><div style={{fontSize:10,color:"#888",fontFamily:"monospace"}}>Code: {v.code}{isEmptyWood(v)?" — কাঠের মাপ ফাঁকা":""}{galleries&&galleries[`${catK}__${vK}`]&&galleries[`${catK}__${vK}`].gallery&&galleries[`${catK}__${vK}`].gallery.length?` · ${galleries[`${catK}__${vK}`].gallery.length} ছবি`:""}</div></div>
              <button onClick={()=>startRenameVar(catK,vK)} style={{background:"#f5f3ff",border:"none",borderRadius:6,padding:"5px 8px",color:"#6d28d9",fontSize:10,fontWeight:600}}>✏️ নাম</button>
              <button onClick={()=>openGallery(catK,vK)} style={{background:"#fef3c7",border:"none",borderRadius:6,padding:"5px 8px",color:"#92400e",fontSize:10,fontWeight:600}}>🖼️ ছবি</button>
              <button onClick={()=>openEdit(catK,vK)} style={{background:"#f5f3ff",border:"none",borderRadius:6,padding:"5px 10px",color:"#6d28d9",fontSize:11,fontWeight:600}}>কাঠ</button>
            </>}
            </div>
          </div>)}
        </div>)}
        <button onClick={resetDb} style={{width:"100%",background:"white",border:"2px solid #fee2e2",color:RED,borderRadius:10,padding:"11px",fontSize:12,fontWeight:600,marginTop:8}}>⚠️ ডিফল্টে রিসেট করুন</button>
      </>}
      {tab==="addCat"&&<div style={{background:"white",borderRadius:12,padding:"16px",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>নতুন ক্যাটাগরি যোগ করুন</div>
        {[{l:"বাংলা নাম *",k:"bn",p:"যেমন: শোকেস"},{l:"English নাম",k:"en",p:"e.g. Showcase"},{l:"Key (ছোট হাতে, ফাঁকা নেই)",k:"key",p:"e.g. showcase"}].map(f=><div key={f.k} style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{f.l}</div><input value={newCat[f.k]} onChange={e=>setNewCat({...newCat,[f.k]:e.target.value})} placeholder={f.p} style={inp}/></div>)}
        <button onClick={addCategory} style={{width:"100%",background:"#6d28d9",color:"white",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:700}}>ক্যাটাগরি যোগ করুন</button>
      </div>}
      {tab==="addVar"&&<div style={{background:"white",borderRadius:12,padding:"16px",boxShadow:"0 1px 4px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>নতুন ভেরিয়েন্ট যোগ করুন</div>
        <div style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>ক্যাটাগরি *</div>
          <select value={newVar.catKey} onChange={e=>setNewVar({...newVar,catKey:e.target.value})} style={inp}>
            <option value="">-- নির্বাচন করুন --</option>
            {Object.entries(db).map(([k,c])=><option key={k} value={k}>{c.bn}</option>)}
          </select></div>
        {[{l:"বাংলা নাম *",k:"bn",p:"যেমন: ৩ পাল্লার শোকেস"},{l:"কোড (খালি রাখলে অটো তৈরি হবে)",k:"code",p:"যেমন: SKC-3D"}].map(f=><div key={f.k} style={{marginBottom:10}}><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{f.l}</div><input value={newVar[f.k]} onChange={e=>setNewVar({...newVar,[f.k]:e.target.value})} placeholder={f.p} style={inp}/></div>)}
        <button onClick={addVariant} style={{width:"100%",background:"#6d28d9",color:"white",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:700}}>ভেরিয়েন্ট যোগ করুন</button>
      </div>}
      {tab==="edit"&&editSections&&<div>
        <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>{db[selCat]?.variants[selVar]?.bn} — কাঠের তালিকা সম্পাদনা</div>
        {editSections.map((sec,si)=><div key={si} style={{background:"white",borderRadius:10,marginBottom:10,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{background:"#92400e",color:"white",padding:"7px 12px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <input value={sec.name} onChange={e=>{const ns=[...editSections];ns[si]={...ns[si],name:e.target.value};setEditSections(ns)}} style={{background:"transparent",border:"none",color:"white",fontWeight:700,fontSize:12,outline:"none",flex:1}}/>
            
          </div>
          <div style={{padding:"8px 12px"}}>
            {sec.pieces.map((p,pi)=><div key={pi} style={{display:"flex",gap:4,alignItems:"center",marginBottom:4,fontSize:10}}>
              <span style={{flex:2,color:"#333"}}>{p.bn}</span>
              <span style={{fontFamily:"monospace",color:"#555",flexShrink:0}}>{p.h}×{p.l}×{p.w} × {p.pc}pc</span>
              <button onClick={()=>removePiece(si,pi)} style={{background:"#fee2e2",border:"none",borderRadius:4,padding:"2px 6px",color:RED,fontSize:10,cursor:"pointer"}}>✕</button>
            </div>)}
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr auto",gap:4,marginTop:6}}>
              <input placeholder="কাঠের নাম" value={newPiece.sectionIdx===si?newPiece.bn:""} onChange={e=>setNewPiece({...newPiece,sectionIdx:si,bn:e.target.value})} style={{...inp,padding:"5px 7px",fontSize:10}} onFocus={()=>setNewPiece(p=>({...p,sectionIdx:si}))}/>
              {[{k:"h",p:"H\""},{k:"l",p:"L\""},{k:"w",p:"W\""},{k:"pc",p:"পিস"}].map(f=><input key={f.k} type="number" step="0.25" placeholder={f.p} value={newPiece.sectionIdx===si?newPiece[f.k]:""} onChange={e=>setNewPiece({...newPiece,sectionIdx:si,[f.k]:e.target.value})} style={{...inp,padding:"5px 4px",fontSize:10}}/>)}
              <button onClick={addPiece} style={{background:"#6d28d9",color:"white",border:"none",borderRadius:6,padding:"5px 8px",fontSize:11}}>+</button>
            </div>
          </div>
        </div>)}
        <button onClick={addSection} style={{width:"100%",background:"white",border:"2px dashed #6d28d9",color:"#6d28d9",borderRadius:9,padding:"10px",fontSize:12,fontWeight:600,marginBottom:10}}>+ সেকশন যোগ করুন</button>
        <button onClick={saveEdit} style={{width:"100%",background:"#6d28d9",color:"white",border:"none",borderRadius:9,padding:"13px",fontSize:13,fontWeight:700}}>সংরক্ষণ করুন</button>
      </div>}

      {tab==="gallery"&&<div>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{db[galleryCat]?.variants[galleryVar]?.bn}</div>
        <div style={{fontSize:11,color:"#888",marginBottom:12}}>এই মডেলের তৈরি করা ফার্নিচারের ছবি যোগ করুন। যেকোনো একটি ছবি "কভার" হিসেবে নির্বাচন করলে সেটাই অর্ডার নেওয়ার সময় ড্রপডাউনে থাম্বনেইল হিসেবে দেখাবে।</div>
        <input ref={galleryInput} type="file" accept="image/*" multiple onChange={addGalleryImages} style={{display:"none"}}/>
        <button onClick={()=>galleryInput.current.click()} style={{width:"100%",background:"#fef3c7",border:"2px dashed #92400e",color:"#92400e",borderRadius:10,padding:"13px",fontSize:13,fontWeight:600,marginBottom:14}}>📷 ছবি যোগ করুন (একাধিক)</button>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {(currentGallery().gallery||[]).map((img,idx)=>{
            const isCover=currentGallery().coverImage===img;
            return<div key={idx} style={{position:"relative",borderRadius:9,overflow:"hidden",border:isCover?`3px solid #16a34a`:"1px solid #eee"}}>
              <img src={img} style={{width:"100%",height:90,objectFit:"cover",display:"block"}} alt=""/>
              {isCover&&<div style={{position:"absolute",top:3,left:3,background:"#16a34a",color:"white",fontSize:8,fontWeight:700,padding:"2px 6px",borderRadius:20}}>✓ কভার</div>}
              <div style={{position:"absolute",bottom:0,left:0,right:0,display:"flex",gap:2,padding:3,background:"rgba(0,0,0,0.5)"}}>
                {!isCover&&<button onClick={()=>setCoverImage(img)} style={{flex:1,background:"white",border:"none",borderRadius:5,padding:"3px",fontSize:8,fontWeight:700,color:"#166534"}}>কভার করুন</button>}
                <button onClick={()=>removeGalleryImage(idx)} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"3px 6px",fontSize:9,color:RED}}>✕</button>
              </div>
            </div>
          })}
        </div>
        {(!currentGallery().gallery||currentGallery().gallery.length===0)&&<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:20}}>এখনো কোনো ছবি যোগ করা হয়নি</div>}
        <button onClick={()=>setTab("list")} style={{width:"100%",background:"#f3f4f6",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:600,marginTop:16}}>← তালিকায় ফিরে যান</button>
      </div>}
    </div>
  </div>
}

/* ── FORM (no wood editing here anymore, smart delivery date, inline new-category) ── */
function Form({onSave,onBack,db,saveDb,galleries,woodSettings,laborSettings}){
  const today=todayStr();
  const[orderNo]=useState(()=>genNo());
  const[step,setStep]=useState(1);
  const[c,setC]=useState({name:"",phone:"",address:"",date:today,delivery:addDays(today,60),notes:""});
  const[emergency,setEmergency]=useState(false);
  const[payments,setPayments]=useState([{date:today,amount:"",note:"অগ্রিম"}]);
  const[items,setItems]=useState([]);
  const[adding,setAdding]=useState(false);
  const[ni,setNi]=useState({catKey:"",varKey:"",wood:"S",qty:1,price:"",notes:""});
  const[refImgs,setRefImgs]=useState([]);
  const refInput=useRef();
  const[newCatMode,setNewCatMode]=useState(false);
  const[newCatName,setNewCatName]=useState("");
  const[newCatVarName,setNewCatVarName]=useState("");
  const[newModelName,setNewModelName]=useState("");
  const[varDropdownOpen,setVarDropdownOpen]=useState(false);

  const fCat=ni.catKey?db[ni.catKey]:null;
  const fVar=fCat&&ni.varKey&&ni.varKey!=="__NEW__"?fCat.variants[ni.varKey]:null;
  const itemsTotal=items.reduce((s,it)=>s+(parseFloat(it.price)||0),0);
  const totalPaid=payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const rem=itemsTotal-totalPaid;
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;
  const days=c.delivery?daysBetween(c.date,c.delivery):null;

  const onDateChange=(newDate)=>{
    if(emergency){setC({...c,date:newDate})}
    else{setC({...c,date:newDate,delivery:addDays(newDate,60)})}
  };

  const createNewCategory=()=>{
    const catName=newCatName.trim()||`নতুন ফার্নিচার ${Object.keys(db).length+1}`;
    const varName=newCatVarName.trim()||"স্ট্যান্ডার্ড মডেল";
    const catKey="cat_"+Date.now();
    const varKey="var_"+Date.now();
    const code=autoCode(catName+" "+varName,String(Math.floor(Math.random()*900+100)));
    const nd=JSON.parse(JSON.stringify(db));
    nd[catKey]={bn:catName,en:catName,variants:{[varKey]:{bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]}}};
    saveDb(nd);
    setNi({catKey,varKey,wood:ni.wood,qty:1,notes:ni.notes});
    setNewCatMode(false);setNewCatName("");setNewCatVarName("");
  };

  const createNewModel=()=>{
    const varName=newModelName.trim()||`নতুন মডেল ${Object.keys(fCat.variants).length+1}`;
    const varKey="var_"+Date.now();
    const code=autoCode((fCat.bn||"")+" "+varName,String(Math.floor(Math.random()*900+100)));
    const nd=JSON.parse(JSON.stringify(db));
    nd[ni.catKey].variants[varKey]={bn:varName,code,sections:[{name:"কাঠের তালিকা (পরে যোগ করুন)",pieces:[]}]};
    saveDb(nd);
    setNi({...ni,varKey});
    setNewModelName("");
  };

  const addItem=()=>{
    if(!fVar)return;
    setItems(prev=>[...prev,{catKey:ni.catKey,varKey:ni.varKey,variantBn:fVar.bn,code:fVar.code,tier:fVar.tier||"M",wood:ni.wood,woodBn:WOOD[ni.wood].bn,qty:ni.qty,price:ni.price,notes:ni.notes,sections:JSON.parse(JSON.stringify(fVar.sections)),itemId:"item_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)}]);
    setNi({catKey:"",varKey:"",wood:"S",qty:1,price:"",notes:""});setAdding(false);
  };

  const handleRefImg=async(e)=>{
    const files=Array.from(e.target.files||[]);
    e.target.value="";
    let baseIdx=refImgs.length;
    for(const file of files){
      const compressed=await compressImage(file);
      if(!compressed)continue;
      baseIdx++;
      const fileName=genImgFileName(`${orderNo}_ref`,baseIdx,file);
      const savedFull=await saveFullResImage(file,fileName);
      setRefImgs(prev=>[...prev,{src:compressed,caption:`ছবি ${prev.length+1}`,fileName:savedFull?fileName:null}]);
    }
  };
  const removeRefImg=(idx)=>{
    setRefImgs(prev=>prev.filter((_,i)=>i!==idx).map((img,i)=>({...img,caption:img.caption.match(/^ছবি \d+$/)?`ছবি ${i+1}`:img.caption})));
  };
  const updateCaption=(idx,val)=>{
    setRefImgs(prev=>prev.map((img,i)=>i===idx?{...img,caption:val}:img));
  };

  const submit=()=>{
    if(!c.name||!c.phone||items.length===0)return;
    // ঐতিহাসিক ব্যয় নীতি: অর্ডার তৈরির সময়ের কাঠ ও শ্রমের দাম স্থায়ীভাবে সংরক্ষণ করা হয়,
    // যাতে ভবিষ্যতে দাম বাড়লেও এই অর্ডারের হিসাব বদলে না যায়
    const itemsWithRate=items.map(it=>({...it,woodRateSnapshot:woodRateOn(woodSettings,it.wood,c.date)||null}));
    onSave({no:orderNo,cust:{...c,total:itemsTotal},items:itemsWithRate,payments,refImgs,printLogs:{},itemProgress:{},labourRateSnapshot:laborRateOn(laborSettings,c.date)||null,at:new Date().toISOString()});
  };

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div className="no-print" style={{background:RED,color:"white",padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{fontWeight:700,fontSize:15}}>নতুন অর্ডার</span>
    </div>
    <div style={{background:"white",display:"flex",borderBottom:"1px solid #eee"}}>
      {[{id:1,l:"গ্রাহকের তথ্য"},{id:2,l:"ফার্নিচার ও ছবি"},{id:3,l:"পেমেন্ট"}].map(s=><button key={s.id} onClick={()=>setStep(s.id)} style={{flex:1,padding:"11px 4px",border:"none",background:"none",fontSize:12,fontWeight:step===s.id?700:400,color:step===s.id?RED:"#888",borderBottom:step===s.id?`3px solid ${RED}`:"3px solid transparent"}}>{s.l}</button>)}
    </div>
    <div style={{padding:"16px",maxWidth:560,margin:"0 auto"}}>
      {step===1&&<>
        <div style={{background:"#fff8f8",borderRadius:10,padding:"10px 12px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:600,color:"#92400e",cursor:"pointer"}}>
            <input type="checkbox" checked={emergency} onChange={e=>setEmergency(e.target.checked)}/>⚡ ইমারজেন্সি অর্ডার (ডেলিভারি ডেট ম্যানুয়াল)
          </label>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:6}}>
          <div>{lbl("অর্ডারের তারিখ")}<DateInput value={c.date} onChange={v=>onDateChange(v)} accent={RED}/></div>
          <div>{lbl("ডেলিভারির তারিখ")}<DateInput value={c.delivery} disabled={!emergency} onChange={v=>setC({...c,delivery:v})} accent={RED}/></div>
        </div>
        <div style={{background:days<0?"#fee2e2":"#f0fdf4",borderRadius:8,padding:"7px 12px",marginBottom:14,fontSize:12,color:days<0?RED:"#166534",fontWeight:600,textAlign:"center"}}>
          {days!==null&&(days<0?`⚠ ডেলিভারি তারিখ অতীতে!`:`ডেলিভারি হবে ${days} দিন পরে${!emergency?" (স্বয়ংক্রিয় ৬০ দিন)":" (ইমারজেন্সি — ম্যানুয়াল)"}`)}
        </div>
        {[{l:"গ্রাহকের নাম *",k:"name",t:"text",p:"পূর্ণ নাম"},{l:"মোবাইল *",k:"phone",t:"tel",p:"01X-XXXXXXXX"},{l:"ঠিকানা",k:"address",t:"text",p:"বিস্তারিত ঠিকানা"}].map(f=><div key={f.k} style={{marginBottom:11}}>{lbl(f.l)}<input type={f.t} value={c[f.k]} onChange={e=>setC({...c,[f.k]:e.target.value})} placeholder={f.p} style={inp}/></div>)}
        <div style={{marginBottom:14}}>{lbl("বিশেষ মন্তব্য")}<textarea rows={2} value={c.notes} onChange={e=>setC({...c,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={()=>setStep(2)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"14px",fontSize:14,fontWeight:700}}>পরবর্তী →</button>
      </>}
      {step===2&&<>
        <div style={{background:"white",borderRadius:10,padding:"12px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📷 রেফারেন্স ছবি (ঐচ্ছিক, একাধিক যোগ করা যাবে)</div>
          {refImgs.map((img,idx)=><div key={idx} style={{marginBottom:10,background:"#fafafa",borderRadius:8,padding:8}}>
            <img src={img.src} style={{maxWidth:"100%",maxHeight:140,objectFit:"contain",borderRadius:7,border:"1px solid #eee",display:"block",margin:"0 auto 6px"}} alt="ref"/>
            <div style={{display:"flex",gap:6}}>
              <input value={img.caption} onChange={e=>updateCaption(idx,e.target.value)} placeholder="ক্যাপশন" style={{flex:1,border:"1px solid #ddd",borderRadius:6,padding:"6px 8px",fontSize:11,outline:"none"}}/>
              <button onClick={()=>removeRefImg(idx)} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"6px 10px",color:RED,fontSize:11}}>✕</button>
            </div>
          </div>)}
          <input ref={refInput} type="file" accept="image/*" multiple onChange={handleRefImg} style={{display:"none"}}/>
          <button onClick={()=>refInput.current.click()} style={{width:"100%",background:"#f0f0f0",border:"2px dashed #aaa",borderRadius:9,padding:"10px",fontSize:12,color:"#555"}}>📂 ছবি বেছে নিন বা স্ক্যান করুন (একাধিক)</button>
        </div>
        {items.map((it,i)=><div key={i} style={{background:"white",borderRadius:10,padding:"10px 12px",marginBottom:8,borderLeft:`4px solid ${RED}`,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div><div style={{fontWeight:700,fontSize:13}}>[{it.code}] {it.variantBn}</div><div style={{fontSize:11,color:"#666",marginTop:2}}>কাঠ: {it.woodBn} | পরিমাণ: {it.qty} | CFT: {(totalCft(it.sections)*it.qty).toFixed(2)}</div>{it.price&&<div style={{fontSize:12,color:"#166534",fontWeight:700,marginTop:2}}>মূল্য: {money(it.price)}</div>}{it.notes&&<div style={{fontSize:10,color:"#888",marginTop:1}}>⚙ {it.notes}</div>}</div>
            <button onClick={()=>setItems(items.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"4px 8px",color:RED,fontSize:11}}>বাদ</button>
          </div>
        </div>)}
        {adding?<div style={{background:"white",borderRadius:12,padding:"14px",marginBottom:10,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:11}}>ফার্নিচার যোগ করুন</div>
          <FurnitureCategoryModelPicker db={db} saveDb={saveDb} galleries={galleries} catKey={ni.catKey} varKey={ni.varKey} onSelect={(ck,vk)=>setNi({...ni,catKey:ck,varKey:vk})}/>
          {fVar&&isEmptyWood(fVar)&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"7px 10px",marginBottom:10,fontSize:10,color:"#991b1b"}}>⚠️ এই মডেলের কাঠের মাপ এখনো যোগ করা হয়নি। অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে যোগ করুন।</div>}
          {lbl("কাঠের ধরন")}
          <select value={ni.wood} onChange={e=>setNi({...ni,wood:e.target.value})} style={{...inp,marginBottom:10}}>
            {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn} ({v.en})</option>)}
          </select>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div>{lbl("পরিমাণ")}<input type="number" min={1} value={ni.qty} onChange={e=>setNi({...ni,qty:parseInt(e.target.value)||1})} style={inp}/></div>
            <div style={{display:"flex",alignItems:"flex-end"}}>{fVar&&<div style={{background:"#f0fdf4",borderRadius:9,padding:"10px 11px",fontSize:12,fontWeight:700,color:"#166534",width:"100%"}}>CFT: {(totalCft(fVar.sections)*ni.qty).toFixed(2)}</div>}</div>
          </div>
          <div style={{marginBottom:12}}>{lbl("এই ফার্নিচারের মূল্য (৳)")}<input type="number" value={ni.price} onChange={e=>setNi({...ni,price:e.target.value})} placeholder="0" style={{...inp,fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          <div style={{background:"#eff6ff",borderRadius:8,padding:"8px 10px",marginBottom:11,fontSize:11,color:"#1d4ed8"}}>ℹ️ কাঠের বিস্তারিত মাপ পরিবর্তন করতে হলে অর্ডার কনফার্ম করার পর কার্পেন্টার স্লিপ থেকে এডিট করুন</div>
          {lbl("বিশেষ নির্দেশনা")}
          <textarea rows={2} value={ni.notes} onChange={e=>setNi({...ni,notes:e.target.value})} style={{...inp,resize:"vertical",marginBottom:11}}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setAdding(false)}} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"11px",fontSize:13}}>বাতিল</button>
            <button onClick={addItem} disabled={!fVar} style={{flex:2,background:fVar?RED:"#ccc",color:"white",border:"none",borderRadius:9,padding:"11px",fontSize:13,fontWeight:700}}>যোগ করুন</button>
          </div>
        </div>:<button onClick={()=>setAdding(true)} style={{width:"100%",background:"white",border:`2px dashed ${RED}`,color:RED,borderRadius:10,padding:"13px",fontSize:13,fontWeight:600,marginBottom:12}}>+ ফার্নিচার যোগ করুন</button>}
        {items.length>0&&!adding&&<div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:14,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>মোট মূল্য (সব ফার্নিচার মিলিয়ে):</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>}
        {items.length>0&&!adding&&<button onClick={()=>setStep(3)} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>পরবর্তী → পেমেন্ট</button>}
      </>}
      {step===3&&<>
        <div style={{background:"#f0fdf4",borderRadius:11,padding:"14px",marginBottom:16,border:"1.5px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#166534",fontWeight:600}}>ফার্নিচারের মোট মূল্য:</span>
          <span style={{fontSize:19,fontWeight:800,color:"#166534"}}>{money(itemsTotal)}</span>
        </div>
        <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>💵 পেমেন্টের তালিকা</div>
        {payments.map((p,i)=><div key={i} style={{background:"white",borderRadius:12,padding:"14px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,.08)",border:"1.5px solid #f0f0f0"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div>{lbl("তারিখ")}<DateInput value={p.date} onChange={v=>{const ps=[...payments];ps[i]={...ps[i],date:v};setPayments(ps)}} accent="#16a34a"/></div>
            <div>{lbl("পরিমাণ (৳)")}<input type="number" value={p.amount} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],amount:e.target.value};setPayments(ps)}} placeholder="0" style={{...inp,padding:"12px",fontSize:16,fontWeight:700,color:"#166534"}}/></div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"end"}}>
            <div style={{flex:1}}>{lbl("নোট")}<input value={p.note} onChange={e=>{const ps=[...payments];ps[i]={...ps[i],note:e.target.value};setPayments(ps)}} placeholder="যেমন: অগ্রিম, ২য় কিস্তি" style={{...inp,padding:"12px",fontSize:13}}/></div>
            <button onClick={()=>setPayments(payments.filter((_,j)=>j!==i))} style={{background:"#fee2e2",border:"none",borderRadius:9,padding:"12px 14px",color:RED,fontSize:14,fontWeight:700}}>✕</button>
          </div>
        </div>)}
        <button onClick={()=>setPayments([...payments,{date:today,amount:"",note:"পেমেন্ট"}])} style={{width:"100%",background:"white",border:"2px dashed #16a34a",color:"#16a34a",borderRadius:12,padding:"14px",fontSize:14,fontWeight:700,marginBottom:16}}>+ আরো পেমেন্ট যোগ করুন</button>
        {itemsTotal>0&&<div style={{background:"#f0fdf4",borderRadius:12,padding:"16px",marginBottom:16,border:"1.5px solid #bbf7d0"}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট মূল্য:</span><span style={{fontWeight:700}}>{money(itemsTotal)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:8}}><span>মোট পরিশোধ:</span><span style={{fontWeight:700,color:"#166534"}}>{money(totalPaid)}</span></div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:16,borderTop:"1.5px solid #bbf7d0",paddingTop:10}}><span style={{fontWeight:700}}>বাকি:</span><span style={{fontWeight:800,color:rem>0?RED:"#166534",fontSize:18}}>{money(rem)}</span></div>
        </div>}
        <button onClick={submit} style={{width:"100%",background:RED,color:"white",border:"none",borderRadius:10,padding:"15px",fontSize:14,fontWeight:700,boxShadow:`0 4px 12px ${RED}44`}}>অর্ডার নিশ্চিত করুন → স্লিপ দেখুন</button>
      </>}
    </div>
  </div>
}

/* ── PREVIEW (each slip prints independently now) ── */
function Preview({order,onBack,slip,setSlip,onUpdate,onDelete,db,saveDb,carpenters,saveCarpenters,galleries,saveGalleryEntry,woodSettings,laborSettings,workers}){
  const totalPaid=(order.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const isFullyPaid=parseFloat(order.cust.total)>0&&totalPaid>=(parseFloat(order.cust.total)||0);
  const[addingPay,setAddingPay]=useState(false);
  const[newPay,setNewPay]=useState({date:todayStr(),amount:"",note:"পেমেন্ট"});
  const[deliveryImg,setDeliveryImg]=useState(order.deliveryImg||null);
  const delInput=useRef();

  const handleDeliveryImg=async(e)=>{
    const file=e.target.files[0];
    e.target.value="";
    if(!file)return;
    const compressed=await compressImage(file);
    if(compressed){
      setDeliveryImg(compressed);
      const fileName=genImgFileName(`${order.no}_delivery`,1,file);
      const savedFull=await saveFullResImage(file,fileName);
      onUpdate({...order,deliveryImg:compressed,deliveryImgFileName:savedFull?fileName:null});
      // এই ছবিটি অর্ডারে থাকা প্রতিটা ফার্নিচার মডেলের গ্যালারিতেও যুক্ত করুন,
      // যাতে পরবর্তীতে সেই মডেল সিলেক্ট করলে ডেলিভারি দেওয়া আসল পণ্যের ছবি দেখা যায়
      if(saveGalleryEntry&&order.items){
        const seen=new Set();
        order.items.forEach(it=>{
          if(!it.catKey||!it.varKey)return;
          const key=`${it.catKey}__${it.varKey}`;
          if(seen.has(key))return;
          seen.add(key);
          const existing=(galleries&&galleries[key])||{gallery:[],coverImage:null};
          if((existing.gallery||[]).includes(compressed))return; // আগে থেকেই থাকলে দ্বিতীয়বার যোগ হবে না
          const updatedGallery=[...(existing.gallery||[]),compressed];
          saveGalleryEntry(it.catKey,it.varKey,{gallery:updatedGallery,coverImage:existing.coverImage||compressed});
        });
      }
    }
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    onUpdate({...order,payments:[...(order.payments||[]),newPay]});
    setAddingPay(false);setNewPay({date:todayStr(),amount:"",note:"পেমেন্ট"});
  };
  const logPrint=(slipKey)=>{
    const logs={...(order.printLogs||{})};
    logs[slipKey]=[...(logs[slipKey]||[]),todayStr()];
    onUpdate({...order,printLogs:logs});
    setTimeout(()=>window.print(),50);
  };
  const cancelOrder=()=>{
    if(window.confirm("আপনি কি নিশ্চিত এই অর্ডারটি বাতিল করতে চান? এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।")){
      onUpdate({...order,cancelled:true,cancelledAt:new Date().toISOString()});
    }
  };
  const restoreOrder=()=>{
    if(window.confirm("এই অর্ডারটি আবার সক্রিয় করতে চান?")){
      onUpdate({...order,cancelled:false});
    }
  };
  const permanentDelete=()=>{
    if(window.confirm("⚠️ এই অর্ডারটি স্থায়ীভাবে মুছে ফেলতে চান? এই কাজটি কখনো ফিরিয়ে আনা যাবে না, সব তথ্য হারিয়ে যাবে।")){
      if(window.confirm("সত্যিই নিশ্চিত? আরেকবার নিশ্চিত করুন।")){
        onDelete(order.no);
      }
    }
  };

  const tabs=[{id:0,l:"গ্রাহক",c:RED},{id:1,l:"অর্ডার বুক",c:"#1d4ed8"},{id:2,l:"ট্র্যাকিং",c:"#6d28d9"},{id:3,l:"কার্পেন্টার",c:"#92400e"},{id:4,l:"ট্রান্সপোর্ট",c:"#065f46"},{id:5,l:"ডেলিভারি 🔒",c:"#0f766e",locked:!isFullyPaid}];

  return<div className="print-bg" style={{minHeight:"100vh",background:"#eee"}}>
    <div className="no-print" style={{background:RED,color:"white",padding:"11px 14px",display:"flex",alignItems:"center",gap:9}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{flex:1,fontWeight:700,fontSize:13}}>#{order.no}{order.cancelled?" — ❌ বাতিল":""}</span>
      {order.cancelled?<><button onClick={restoreOrder} style={{background:"white",color:"#166534",border:"none",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700,marginRight:6}}>পুনরুদ্ধার</button>
      <button onClick={permanentDelete} style={{background:"#7f1d1d",color:"white",border:"1px solid white",borderRadius:7,padding:"6px 10px",fontSize:11,fontWeight:700}}>🗑 স্থায়ী ডিলিট</button></>
      :<button onClick={cancelOrder} style={{background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:7,padding:"6px 12px",fontSize:11,fontWeight:700}}>❌ ক্যান্সেল</button>}
    </div>
    {order.cancelled&&<div className="no-print" style={{background:"#fee2e2",color:"#991b1b",padding:"8px 14px",textAlign:"center",fontSize:12,fontWeight:700}}>এই অর্ডারটি বাতিল করা হয়েছে ({order.cancelledAt?fmtDate(order.cancelledAt):""})</div>}
    <div className="no-print" style={{background:"white",padding:"12px 14px",borderBottom:"1px solid #eee"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <span style={{fontSize:13,fontWeight:700}}>পেমেন্ট: {money(totalPaid)} / {money(order.cust.total)}</span>
        {isFullyPaid?<span style={{fontSize:11,background:"#dcfce7",color:"#166534",borderRadius:20,padding:"4px 12px",fontWeight:700}}>✅ সম্পূর্ণ পরিশোধ</span>:<button onClick={()=>setAddingPay(true)} style={{background:"#f0fdf4",border:"1.5px solid #86efac",color:"#166534",borderRadius:8,padding:"7px 14px",fontSize:12,fontWeight:700}}>+ পেমেন্ট যোগ করুন</button>}
      </div>
      {addingPay&&<div style={{background:"#fafafa",borderRadius:10,padding:12,border:"1px solid #eee"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>তারিখ</div><DateInput value={newPay.date} onChange={v=>setNewPay({...newPay,date:v})} accent="#16a34a"/></div>
          <div><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>পরিমাণ (৳)</div><input type="number" value={newPay.amount} onChange={e=>setNewPay({...newPay,amount:e.target.value})} placeholder="0" style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:16,fontWeight:700,color:"#166534",outline:"none"}}/></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"end"}}>
          <div style={{flex:1}}><div style={{fontSize:11,marginBottom:4,fontWeight:600,color:"#555"}}>নোট</div><input value={newPay.note} onChange={e=>setNewPay({...newPay,note:e.target.value})} style={{width:"100%",border:"1.5px solid #ddd",borderRadius:8,padding:"10px",fontSize:13,outline:"none"}}/></div>
          <button onClick={addPayment} style={{background:"#16a34a",color:"white",border:"none",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:700}}>সংরক্ষণ</button>
        </div>
      </div>}
    </div>
    <div className="no-print" style={{background:"white",display:"flex",overflowX:"auto",borderBottom:"1px solid #eee"}}>
      {tabs.map(t=><button key={t.id} onClick={()=>!t.locked&&setSlip(t.id)} style={{flexShrink:0,padding:"10px 11px",border:"none",background:"none",fontSize:11,fontWeight:slip===t.id?700:400,color:t.locked?"#ccc":slip===t.id?t.c:"#888",borderBottom:slip===t.id?`3px solid ${t.c}`:"3px solid transparent",cursor:t.locked?"not-allowed":"pointer"}}>{t.l}</button>)}
    </div>
    <div className="print-wrap" style={{padding:"12px",maxWidth:640,margin:"0 auto"}}>
      <div className="slip-card" style={{background:"white",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.1)"}}>
        {slip===0&&<S1 order={order} onPrint={logPrint}/>}
        {slip===1&&<S2 order={order} onPrint={logPrint} db={db} saveDb={saveDb} galleries={galleries} onUpdateOrder={onUpdate} woodSettings={woodSettings} laborSettings={laborSettings}/>}
        {slip===2&&<S3 order={order} onPrint={logPrint} onUpdateOrder={onUpdate} workers={workers}/>}
        {slip===3&&<S4 order={order} onPrint={logPrint} db={db} saveDb={saveDb} onUpdateOrder={onUpdate}/>}
        {slip===4&&<S5 order={order} onPrint={logPrint}/>}
        {slip===5&&isFullyPaid&&<S6 order={{...order,deliveryImg}} onPrint={logPrint} onUpdateOrder={onUpdate} onPhotoChange={handleDeliveryImg}/>}
        {slip===5&&!isFullyPaid&&<div style={{padding:40,textAlign:"center",color:"#aaa"}}><div style={{fontSize:40,marginBottom:10}}>🔒</div><div style={{fontSize:14}}>সম্পূর্ণ পেমেন্টের পরে আনলক হবে</div></div>}
      </div>
    </div>
  </div>
}

/* ── HISTORY (with search) ── */
function Hist({orders,onBack,onView,highlightNo}){
  const[q,setQ]=useState("");
  const filtered=useMemo(()=>{
    let list=orders;
    if(q.trim()){
      const s=q.trim().toLowerCase();
      list=list.filter(o=>o.cust.name.toLowerCase().includes(s)||o.cust.phone.includes(s)||o.no.toLowerCase().includes(s));
    }
    const runningList=list.filter(o=>!o.delivered).sort((a,b)=>new Date(b.at||b.cust.date)-new Date(a.at||a.cust.date));
    const deliveredList=list.filter(o=>o.delivered).sort((a,b)=>new Date(b.deliveredAt||b.cust.delivery||0)-new Date(a.deliveredAt||a.cust.delivery||0));
    return[...runningList,...deliveredList];
  },[orders,q]);

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:RED,color:"white",padding:"12px 14px",display:"flex",alignItems:"center",gap:10}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:7,padding:"6px 12px",fontSize:12}}>←</button>
      <span style={{fontWeight:700,fontSize:15}}>অর্ডার ইতিহাস ({orders.length})</span>
    </div>
    <div style={{padding:"14px",maxWidth:560,margin:"0 auto"}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন..." style={{width:"100%",border:"1.5px solid #ddd",borderRadius:11,padding:"13px 15px",fontSize:14,outline:"none",marginBottom:14,background:"white"}}/>
      {filtered.length===0?<div style={{textAlign:"center",color:"#aaa",padding:"50px 20px",fontSize:13}}>কোনো অর্ডার পাওয়া যায়নি</div>
      :filtered.map((o,i)=>{
        const paid=(o.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
        const full=parseFloat(o.cust.total)>0&&paid>=(parseFloat(o.cust.total)||0);
        const bg=highlightNo===o.no?"#e0f2fe":o.cancelled?"#fafafa":o.delivered?"#f0fdf4":"white";
        const borderColor=highlightNo===o.no?"#0ea5e9":o.cancelled?"#999":o.delivered?"#0f766e":full?"#16a34a":RED;
        return<div key={i} onClick={()=>onView(o)} style={{background:bg,borderRadius:11,padding:"12px",marginBottom:9,boxShadow:"0 1px 4px rgba(0,0,0,.08)",border:o.delivered?"1px solid #99f6e4":"none",borderLeft:`4px solid ${borderColor}`,cursor:"pointer",opacity:o.cancelled?0.65:1,transition:"background .4s"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div>
              <div style={{fontWeight:700,fontSize:14,textDecoration:o.cancelled?"line-through":"none"}}>{o.cust.name}</div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3}}>
                <span style={{fontSize:12,color:"#555"}}>📞 {o.cust.phone}</span>
                <a href={`tel:${o.cust.phone}`} onClick={e=>e.stopPropagation()} style={{background:"#eff6ff",color:"#1d4ed8",border:"none",borderRadius:6,padding:"3px 9px",fontSize:10,fontWeight:700,textDecoration:"none"}}>📱 কল</a>
                <a href={`https://wa.me/${toIntlPhone(o.cust.phone)}`} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{background:"#f0fdf4",color:"#166534",border:"none",borderRadius:6,padding:"3px 9px",fontSize:10,fontWeight:700,textDecoration:"none"}}>💬 WhatsApp</a>
              </div>
              <div style={{fontSize:11,color:"#888",marginTop:1}}>{o.no}</div>
              <div style={{fontSize:11,color:"#666",marginTop:2}}>{o.items.map(it=>it.variantBn).join(", ")}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:700,fontSize:13,color:RED}}>{money(o.cust.total)}</div>
              <div style={{fontSize:10,color:o.cancelled?"#991b1b":o.delivered?"#0f766e":full?"#16a34a":"#f97316",marginTop:2,fontWeight:600}}>{o.cancelled?"❌ বাতিল":o.delivered?"📦 ডেলিভারড":full?"✅ পরিশোধ":"⏳ বাকি আছে"}</div>
              <div style={{fontSize:10,color:"#aaa",marginTop:1}}>{o.delivered?fmtDate(o.deliveredAt):fmtDate(o.cust.date)}</div>
            </div>
          </div>
        </div>
      })}
    </div>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
