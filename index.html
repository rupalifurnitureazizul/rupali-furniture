          {financeYearOptions.map(y=><button key={y} onClick={()=>setMonthlyIncomeYearSelect(y)} style={{flexShrink:0,padding:"6px 12px",borderRadius:20,border:monthlyIncomeYearSelect===y?"none":"1px solid #ddd",background:monthlyIncomeYearSelect===y?"#166534":"white",color:monthlyIncomeYearSelect===y?"white":"#666",fontSize:10,fontWeight:600}}>{y}</button>)}
        </div>
        <div style={{background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 6px"}}>
          {(()=>{
            const shortMoney=(v)=>(v<0?"-":"")+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(Math.abs(v)>=10000?0:1):Math.round(Math.abs(v)).toString());
            const nets=monthlyIncomeData.monthly.map(m=>m.revenue-m.expense);
            // ── সব মাস মিলিয়ে একটাই শূন্য-রেখা — আগে প্রতিটা কলাম নিজের পুরো উচ্চতাকেই
            // ভিত্তি ধরত, তাই ঋণাত্মক বার একটা সাধারণ শূন্য-রেখা ছাড়াই উপরে "ভাসত"। এখন
            // ধনাত্মক ও ঋণাত্মক অংশের জায়গা সর্বোচ্চ মান অনুপাতে ভাগ করা হয়, শূন্য-রেখা
            // সবগুলো কলামে একই জায়গায় থাকে ──
            const maxPos=Math.max(...nets.filter(n=>n>0),0);
            const maxNeg=Math.max(...nets.filter(n=>n<0).map(n=>-n),0);
            const totalSpan=maxPos+maxNeg||1;
            const posPct=(maxPos/totalSpan)*100;
            const negPct=(maxNeg/totalSpan)*100;
            return<div style={{display:"flex",alignItems:"stretch",gap:3,height:150}}>
              {monthlyIncomeData.monthly.map((m,i)=>{
                const net=nets[i];
                return<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",height:"100%"}}>
                  <div style={{height:`${posPct}%`,width:"100%",display:"flex",flexDirection:"column",justifyContent:"flex-end",alignItems:"center"}}>
                    {net>0&&<><div style={{fontSize:6.5,color:"#166534",marginBottom:1}}>{shortMoney(net)}</div><div style={{width:"100%",height:`${maxPos>0?(net/maxPos)*100:0}%`,background:CHART_SOFT_GREEN,borderRadius:"2px 2px 0 0",minHeight:2}}></div></>}
                  </div>
                  <div style={{width:"100%",height:1,background:"#ccc",flexShrink:0}}></div>
                  <div style={{height:`${negPct}%`,width:"100%",display:"flex",flexDirection:"column",justifyContent:"flex-start",alignItems:"center"}}>
                    {net<0&&<><div style={{width:"100%",height:`${maxNeg>0?(-net/maxNeg)*100:0}%`,background:CHART_SOFT_RED,borderRadius:"0 0 2px 2px",minHeight:2}}></div><div style={{fontSize:6.5,color:RED,marginTop:1}}>{shortMoney(net)}</div></>}
                  </div>
                  <div style={{fontSize:8,color:"#999",marginTop:3}}>{m.label}</div>

        <div style={{fontSize:9,color:"#999",marginBottom:6}}>ব্যয় = সব খরচ + কর্মীদের বেতন + কাঠের পেমেন্ট (নিচের "মোট ব্যয়"-এর মতোই)</div>

                  </div>
                  <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%"}}>
                    <div style={{fontSize:6,color:"#b45858",marginBottom:1}}>{m.revenue>0?shortMoney(m.revenue):""}</div>
                    <div style={{width:"100%",height:`${(m.revenue/maxV)*100}%`,background:CHART_SOFT_RED,borderRadius:"2px 2px 0 0",minHeight:m.revenue>0?2:0}}></div>

              </div>)}

      <SpendPeriodChart icon="🧾" title="মোট ব্যয়" accent="#0f766e"

            {extra}
          </div>:null;
          // ── v4.69: এখানে টাইটেল (ও রং) ভুল ঘোরানো ছিল — SPEND_SEGS[0/1/2] পজিশন অনুযায়ী

          // expense/salary/wood-এর — নাম আর সংখ্যা মেলেনি। এখন id দিয়ে সঠিক SPEND_SEGS এন্ট্রি
          // (নাম ও রং দুটোই, উপরের স্ট্যাকড বারের লিজেন্ডের সাথে মিলিয়ে) বেছে নেওয়া হচ্ছে ──
          const segBy=(id)=>SPEND_SEGS.find(sg=>sg.id===id);
          return<div>
            {partBlock(segBy("expense"),bar.values.expense||0,group("expense",e=>e.label))}

            {partBlock(segBy("wood"),bar.values.wood||0,group("wood",e=>e.label==="সাপ্লায়ারকে পেমেন্ট"?`সাপ্লায়ার: ${e.supplier}`:e.label))}
          </div>;
        }}/>

      {/* ── v4.52: কর্মীদের বেতন — খরচের পাই থেকে আলাদা, সপ্তাহ/মাস/বছর অনুযায়ী পূর্ণ চিত্র ── */}

          const depts=SALARY_SEGS.map(sg=>({...sg,v:bar.values[sg.id]||0})).filter(x=>x.v>0);
          const byW={};
          bar.entries.forEach(e=>{if(!e.workerId)return;const w=byW[e.workerId]||(byW[e.workerId]={name:e.workerName,dept:e.label,days:0,amt:0});w.days+=e.days||0;w.amt+=e.amount});
          const ws=Object.values(byW).sort((x,y)=>y.amt-x.amt);
          const cftDone=cftDoneList.reduce((t,x)=>periodKeyOf(x.date,mode)===bar.key?t+x.cft:t,0);
          return<div>
            {depts.map(d=><div key={d.id} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,marginBottom:4}}>
              <span style={{width:9,height:9,borderRadius:2,background:d.color,flexShrink:0}}></span>
              <span style={{flex:1,color:"#444"}}>{d.bn}</span>
              <span style={{color:"#888",fontSize:10}}>{toBnDigits(((d.v/bar.total)*100).toFixed(0))}%</span>
              <span style={{fontWeight:700,minWidth:74,textAlign:"right"}}>{money(Math.round(d.v))}</span>
            </div>)}
            {cftDone>0&&<div style={{fontSize:10,color:"#555",background:"white",border:"1px dashed #ddd",borderRadius:7,padding:"6px 8px",margin:"8px 0"}}>🪚 এই সময়ে তৈরি শেষ: <strong>{toBnDigits(cftDone.toFixed(1))} CFT</strong> · প্রতি CFT-তে বেতন: <strong>{money(Math.round(bar.total/cftDone))}</strong></div>}
            {ws.length>0&&<div style={{marginTop:6}}>
              <div style={{fontSize:10,fontWeight:700,color:"#666",marginBottom:4}}>কর্মী অনুযায়ী</div>
              {ws.slice(0,12).map((w,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",gap:6,fontSize:10.5,padding:"3px 0",borderBottom:"1px solid #f0f0f0"}}>
                <span style={{color:"#333",minWidth:0}}>{w.name} <span style={{color:"#aaa",fontSize:9}}>· {w.dept} · {toBnDigits(String(Math.round(w.days*10)/10))} দিন</span></span>
                <span style={{fontWeight:600,flexShrink:0}}>{money(Math.round(w.amt))}</span>
              </div>)}
              {ws.length>12&&<div style={{fontSize:9,color:"#aaa",marginTop:3}}>আরও {toBnDigits(ws.length-12)} জন</div>}
            </div>}
          </div>;
        }}/>

      {stats.stockAlerts&&stats.stockAlerts.length>0&&<div style={{background:"#f0fdf4",border:"1px solid #a7d8b8",borderRadius:10,padding:"12px 14px",marginBottom:14}}>

        <div style={{fontSize:9.5,color:"#78350f",marginBottom:8,lineHeight:1.5}}>মডেল ও কাঠের মাপ সব ডিভাইসে নিজে থেকেই মিলে যায় — কিছু চাপার দরকার নেই। কিন্তু নিচের এই মডেলগুলো কোনো ডিভাইসেই ডেটাবেসে নেই, তাই ⚙️ ডেটাবেসে গিয়ে নিজে যোগ করে কাঠের মাপ বসাতে হবে।</div>
        <div style={{background:"white",borderRadius:7,padding:"8px 10px",fontSize:10.5}}>
          <div style={{maxHeight:180,overflowY:"auto"}}>

              <div style={{fontWeight:600}}>{m.name}</div>
              <div style={{fontSize:9,color:"#999",fontFamily:"monospace"}}>{m.code} · অর্ডার {m.orderNo}</div>

          </div>

      {permanentSyncFailures&&permanentSyncFailures.length>0&&<div style={{marginTop:16,background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:10,padding:"12px 14px"}}>

        <div style={{fontSize:9.5,color:"#7f1d1d",marginBottom:8,lineHeight:1.5}}>চিন্তা নেই — অর্ডারগুলো এই ডিভাইসে নিরাপদে আছে, শুধু আসল সার্ভারে এখনো নিশ্চিতভাবে পৌঁছায়নি। অ্যাপ নিজে থেকেই বারবার চেষ্টা করে যাচ্ছে। যতক্ষণ না ঠিক হচ্ছে, ততক্ষণ এই ডিভাইসটা বন্ধ করবেন না বা ডেটা মুছবেন না।</div>
        {permanentSyncFailures.map(f=><div key={f.no} style={{background:"white",borderRadius:7,padding:"7px 9px",marginBottom:5,fontSize:10}}>
          <div style={{fontWeight:700,color:"#991b1b"}}>{f.no}</div>
          <div style={{color:"#7f1d1d",marginTop:1}}>{f.reason}</div>
        </div>)}
      </div>}
      {/* Full-resolution image folder (desktop only) */}
      {folderStatus.supported&&<div style={{marginTop:16,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:6}}>🖥️ ফুল রেজোলিউশন ছবি ফোল্ডার (এই কম্পিউটার)</div>
        {folderStatus.connected?<div style={{fontSize:11,color:"#166534",fontWeight:600,marginBottom:6}}>✅ সংযুক্ত: {folderStatus.name}</div>:<div style={{fontSize:11,color:"#991b1b",marginBottom:6}}>⚠️ ফোল্ডার সংযুক্ত নয় — ছবি শুধু কম্প্রেসড ভার্সনে সেভ হবে</div>}
        <div style={{fontSize:10,color:"#78350f",marginBottom:8,lineHeight:1.5}}>এখানে একটা ফোল্ডার সেট করুন — অর্ডারে যেকোনো ছবি যুক্ত করলে তার আসল (ফুল রেজোলিউশন) কপি এই ফোল্ডারে সেভ হবে, যা পরে প্রিন্ট করে মিস্ত্রিকে দিতে পারবেন। এই ফোল্ডার নিয়মিত অন্য জায়গায় ব্যাকআপ রাখুন।</div>
        <button onClick={connectFolder} style={{width:"100%",background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"9px",fontSize:12,fontWeight:700}}>{folderStatus.connected?"ভিন্ন ফোল্ডার বেছে নিন":"ফোল্ডার নির্বাচন করুন"}</button>
      </div>}

      <div style={{marginTop:12,background:"white",border:"1px solid #eee",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#444",marginBottom:3}}>🔔 সতর্কতার সীমা</div>
        <div style={{fontSize:9,color:"#999",marginBottom:10,lineHeight:1.5}}>কখন সতর্কতা দেখাবে সেটা আপনার ব্যবসা অনুযায়ী ঠিক করুন। খালি রাখলে ডিফল্ট মান কাজ করবে।</div>
        {[{k:"stockMonths",l:"কাঠের মজুদ কত মাসের কম হলে সতর্কতা",u:"মাস"},
          {k:"stuckMultiplier",l:"স্বাভাবিকের কত গুণ সময় নিলে 'আটকে আছে'",u:"গুণ"},
          {k:"stuckFallbackDays",l:"ইতিহাস না থাকলে কত দিনে 'আটকে আছে'",u:"দিন"},
          {k:"woodPricePct",l:"কাঠের দাম কত % বদলালে সতর্কতা",u:"%"},
          {k:"supplyLeadDays",l:"কাঠ কিনে কাটিয়ে ব্যবহারযোগ্য হতে কত দিন",u:"দিন"},
          {k:"safetyPct",l:"নিরাপত্তা মজুদ (দেরির জন্য বাফার)",u:"%"}].map(f=>
          <div key={f.k} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <span style={{flex:1,fontSize:10,color:"#555",lineHeight:1.4}}>{f.l}</span>
            <input type="number" step="0.1" value={(alertSettings&&alertSettings[f.k])??""} placeholder={String(ALERT_DEFAULTS[f.k])} onChange={e=>saveAlertSettings({...alertSettings,[f.k]:e.target.value===""?null:parseFloat(e.target.value)})} style={{width:58,minHeight:40,border:"1.5px solid #e0e0e0",borderRadius:8,padding:"8px 6px",fontSize:13,textAlign:"center",outline:"none",flexShrink:0}}/>
            <span style={{fontSize:9,color:"#aaa",width:26,flexShrink:0}}>{f.u}</span>
          </div>)}
      </div>

      {/* Automatic sync status */}
      <div style={{marginTop:10,paddingTop:16,borderTop:"1px solid #eee",textAlign:"center"}}>
        {connError?<div style={{background:"#fef2f2",color:"#991b1b",borderRadius:9,padding:"9px 12px",fontSize:11,marginBottom:8}}>⚠️ সিঙ্ক সমস্যা: {connError}</div>:
        <div style={{marginBottom:8}}><SyncChip info={syncInfo} online={online}/>{syncInfo&&syncInfo.lastServerAt?<div style={{fontSize:9.5,color:"#888",marginTop:4}}>সর্বশেষ সার্ভার-নিশ্চিত: {new Date(syncInfo.lastServerAt).toLocaleTimeString("bn-BD")}</div>:null}</div>}
      </div>

      {/* Data backup */}
      <div style={{marginTop:10,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:12,fontWeight:700,color:backupFailed?"#991b1b":"#1d4ed8",marginBottom:6}}>{backupFailed?"🔴 আজকের স্বয়ংক্রিয় ব্যাকআপ ব্যর্থ হয়েছে":"✅ স্বয়ংক্রিয় দৈনিক ব্যাকআপ চালু আছে"}</div>
        <div style={{fontSize:10,color:"#555",marginBottom:8,lineHeight:1.5}}>প্রতিদিন একবার আপনার সব তথ্যের একটা কপি নিজে থেকেই ক্লাউডে জমা হয়ে যায় — কিছু করার দরকার নেই। কম্পিউটারে ছবির ফোল্ডার সংযুক্ত থাকলে সেখানেও একটা আসল ফাইল সেভ হয়। চাইলে এখনই একটা কপি হাতে রাখতে নিচের বাটনে চাপুন।</div>
        <button onClick={onBackupData} style={{width:"100%",background:"#1d4ed8",color:"white",border:"none",borderRadius:8,padding:"10px",fontSize:12,fontWeight:700}}>💾 এখনই একটা ব্যাকআপ ডাউনলোড করুন</button>

        <div style={{marginTop:12,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:12,fontWeight:700,color:"#92400e",marginBottom:3}}>🔑 এই ডিভাইসের Firebase প্রজেক্ট</div>
          <div style={{fontSize:9,color:"#78350f",marginBottom:7,lineHeight:1.5}}>প্রতিটা ডিভাইসে (ফোন/কম্পিউটার) এই কোড আলাদাভাবে একবার বসাতে হয়েছিল। দুই ডিভাইসে এই লেখা ভিন্ন হলে তারা আসলে দুইটা ভিন্ন জায়গায় কথা বলছে — তখন নিচের "সার্ভার-সিঙ্ক পরীক্ষা"ও প্রতিটা ডিভাইসে আলাদাভাবে "✅ ঠিক আছে" দেখাবে, কারণ প্রতিটা নিজের জায়গার সাথে ঠিকই মিলছে, শুধু দুটো ডিভাইস একে অপরের সাথে মিলছে না। প্রজেক্টের নাম এক হলেও App ID আলাদা হতে পারে — দুই ডিভাইসে পাশাপাশি রেখে দুটো লেখাই মিলিয়ে দেখুন।</div>
          <div style={{fontSize:9,color:"#92400e",marginBottom:2,fontWeight:600}}>প্রজেক্ট আইডি:</div>
          <div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#92400e",background:"white",borderRadius:7,padding:"7px 10px",wordBreak:"break-all",marginBottom:8}}>{projectId||"(পাওয়া যায়নি)"}</div>
          <div style={{fontSize:9,color:"#92400e",marginBottom:2,fontWeight:600}}>App ID:</div>
          <div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:"#92400e",background:"white",borderRadius:7,padding:"7px 10px",wordBreak:"break-all"}}>{appId||"(পাওয়া যায়নি)"}</div>
        </div>
        {lastPageCrash&&<div style={{marginTop:12,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 12px",fontSize:10,color:"#475569",lineHeight:1.6}}>
          <div style={{fontWeight:700,marginBottom:2}}>🛟 শেষ স্বয়ংক্রিয় পুনরুদ্ধার</div>
          <div>{new Date(lastPageCrash.at).toLocaleString("bn-BD")} · পাতা: {lastPageCrash.page}</div>
          <div style={{fontFamily:"monospace",fontSize:9,color:"#94a3b8",wordBreak:"break-word"}}>{lastPageCrash.msg}</div>
        </div>}
        {/* ── v4.96: তালিকার সংস্করণ-ইতিহাস — এক চাপে যেকোনো আগের অবস্থায় ফেরা যায় ── */}
        {dbHistory&&dbHistory.length>0&&(()=>{
          const best=dbHistory.reduce((a,b)=>(b.models>a.models?b:a),dbHistory[0]);
          const now=dbHistory[0];
          const lost=best.models-now.models;
          return<div style={{marginTop:12,background:lost>0?"#fffbeb":"white",border:`1px solid ${lost>0?"#fde68a":"#e5e7eb"}`,borderRadius:10,padding:"12px 13px"}}>
            <div style={{fontSize:12,fontWeight:800,color:lost>0?"#92400e":"#334155",marginBottom:3}}>🕘 ফার্নিচার তালিকার সংস্করণ-ইতিহাস</div>
            <div style={{fontSize:9.5,color:"#888",lineHeight:1.6,marginBottom:9}}>তালিকা বদলালেই এই ডিভাইসে একটা কপি রাখা হয় (শেষ ৩০টা)। কিছু হারিয়ে গেলে এখান থেকে এক চাপেই ফিরিয়ে আনা যায় — <strong>ফেরানোর সময় শুধু অনুপস্থিত মডেলগুলো যোগ হয়, এখনকার কিছু মুছে যায় না।</strong></div>
            {lost>0&&<div style={{background:"white",border:"1px solid #fcd34d",borderRadius:8,padding:"9px 11px",fontSize:10.5,color:"#92400e",fontWeight:700,lineHeight:1.6,marginBottom:9}}>
              ⚠️ এই ডিভাইসে এক সময় <strong>{toBnDigits(best.models)}টা</strong> মডেল ছিল, এখন <strong>{toBnDigits(now.models)}টা</strong> — {toBnDigits(lost)}টা কম। নিচের তালিকা থেকে ওই সংস্করণটা ফিরিয়ে আনতে পারেন।
            </div>}
            <div style={{maxHeight:230,overflowY:"auto"}}>
              {dbHistory.slice(0,15).map((v,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:7,borderTop:i?"1px solid #f1f5f9":"none",padding:"7px 0"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:v.models===best.models?"#166534":"#334155"}}>{toBnDigits(v.models)}টা মডেল · {toBnDigits(v.cats)}টা ক্যাটাগরি{i===0?"  (এখনকার)":""}{v.models===best.models&&i!==0?"  ⭐ সর্বোচ্চ":""}</div>
                  <div style={{fontSize:9,color:"#94a3b8"}}>{new Date(v.at).toLocaleString("bn-BD",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</div>
                </div>
                <button onClick={()=>onDownloadDbVersion?.(i)} style={{background:"#f1f5f9",border:"none",borderRadius:6,padding:"6px 9px",fontSize:10,fontWeight:700,color:"#475569",flexShrink:0}}>⬇</button>
                {i!==0&&<button onClick={()=>onRestoreDbVersion?.(i)} style={{background:"#166534",color:"white",border:"none",borderRadius:6,padding:"6px 11px",fontSize:10,fontWeight:700,flexShrink:0}}>ফেরান</button>}
              </div>)}
            </div>
          </div>;
        })()}

        {/* ── v4.93: তালিকার পরিবর্তনের খাতা — কোন ডিভাইস কখন কী যোগ করল বা মুছল ── */}
        {dbAudit&&dbAudit.length>0&&<div style={{marginTop:12,background:"white",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 13px"}}>
          <div style={{fontSize:12,fontWeight:800,color:"#334155",marginBottom:3}}>🧾 ফার্নিচার তালিকার পরিবর্তনের খাতা</div>
          <div style={{fontSize:9.5,color:"#888",lineHeight:1.6,marginBottom:9}}>তালিকায় কিছু যোগ বা মোছা হলেই এখানে লেখা থাকে — কোন ডিভাইস থেকে, কখন। কোনো মডেল হারিয়ে গেলে এখান থেকেই ধরা যাবে কে সরিয়েছে।</div>
          {dbAudit.slice(0,10).map((a,i)=><div key={i} style={{borderTop:i?"1px solid #f1f5f9":"none",padding:"7px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:6,fontSize:10.5,fontWeight:700,color:"#334155"}}>
              <span style={{minWidth:0}}>{a.device||"ডিভাইস"}{a.deviceId===deviceId?" (এই ডিভাইস)":""}</span>
              <span style={{color:"#94a3b8",fontWeight:600,flexShrink:0}}>{a.at?new Date(a.at).toLocaleString("bn-BD",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}):""}</span>
            </div>
            <div style={{fontSize:10,marginTop:2,lineHeight:1.55}}>
              {a.added>0&&<span style={{color:"#166534",fontWeight:700}}>+{toBnDigits(a.added)} যোগ </span>}
              {a.removed>0&&<span style={{color:"#991b1b",fontWeight:800}}>−{toBnDigits(a.removed)} মুছেছে </span>}
              <span style={{color:"#94a3b8"}}>· এরপর তালিকায় {toBnDigits(a.localModels||0)}টা মডেল</span>
            </div>
            {a.removed>0&&a.removedNames&&a.removedNames.length>0&&<div style={{fontSize:9.5,color:"#991b1b",marginTop:2,lineHeight:1.5}}>মুছেছে: {a.removedNames.slice(0,6).join(" · ")}{a.removedNames.length>6?` …আরও ${toBnDigits(a.removedNames.length-6)}টা`:""}</div>}
          </div>)}
        </div>}

        {/* ── v4.83: ফার্নিচার তালিকা সার্ভারের সাথে মিলিয়ে দেখা ও মেলানো ── */}
        <div style={{marginTop:12,background:"white",border:"1px solid #e5e7eb",borderRadius:10,padding:"12px 13px"}}>
          <div style={{fontSize:12,fontWeight:800,color:"#334155",marginBottom:3}}>🔄 ফার্নিচার তালিকা সার্ভারের সাথে মেলানো</div>

              {autoStuckStatus.queuedThisRun!==undefined&&<div>এই দফায় নতুন চেষ্টা: {autoStuckStatus.queuedThisRun}টি (সফল: {autoStuckStatus.resolvedThisRun||0}, ব্যর্থ: {autoStuckStatus.failedThisRun||0})</div>}
              {autoStuckStatus.lastAttemptDetail&&autoStuckStatus.lastAttemptDetail.length>0&&<div style={{marginTop:2}}>
                {autoStuckStatus.lastAttemptDetail.slice(-5).map((d,i)=><div key={i}>• {d.no} — {d.ok?"✅ সফল":"❌ ব্যর্থ"}{d.reason?` (${d.reason})`:""}</div>)}
              </div>}
              {autoStuckStatus.otherSyncStatus&&<div style={{marginTop:4,paddingTop:4,borderTop:"1px dashed #ddd"}}>
                <div style={{fontWeight:700,marginBottom:2}}>অন্যান্য তথ্য:</div>
                {Object.entries({expenses:"খরচ",woodlots:"কাঠের স্টক",workers:"কর্মী",db:"ফার্নিচার ডেটাবেস",payrollWeeks:"সাপ্তাহিক বেতন"}).map(([k,l])=>autoStuckStatus.otherSyncStatus[k]&&<div key={k}>• {l}: {autoStuckStatus.otherSyncStatus[k]}</div>)}
                {autoStuckStatus.otherSyncStatus.dbCounts&&<div style={{marginTop:6,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"6px 8px",fontSize:10,color:"#1e40af",lineHeight:1.5}}>
                  <div style={{fontWeight:700,marginBottom:2}}>📊 মডেল গণনা (দুই ডিভাইসে এই সংখ্যা মিলিয়ে দেখুন):</div>
                  {autoStuckStatus.otherSyncStatus.dbCounts}
                </div>}
              </div>}
            </div>}
            {syncCheck.stillPendingHere&&syncCheck.stillPendingHere.length>0?
              <div style={{background:"#fef2f2",color:"#991b1b",borderRadius:7,padding:"9px 11px",fontSize:10.5,fontWeight:700,lineHeight:1.7,marginBottom:9}}>
                ⚠️ এই ডিভাইসের {syncCheck.stillPendingHere.length}টা অর্ডার এখনো আসল সার্ভারে পৌঁছায়নি। কিছু করার দরকার নেই — অ্যাপ নিজে থেকেই প্রতি ৩ মিনিটে সার্ভারের সাথে মিলিয়ে দেখে বাকিগুলো পাঠাতে থাকে (একটার পর একটা, ছবি ছোট করে; ছবি ছোট করেও না হলে ছবি ছাড়াই অর্ডারের তথ্য পাঠিয়ে দেয়, যাতে অর্ডার কখনো না হারায়)। এই সংখ্যাটা এখন সার্ভারের আসল অবস্থা থেকেই গোনা হয়, তাই যতগুলো সফল হচ্ছে ততটাই কমতে থাকবে। কয়েক মিনিট পাতাটা খোলা রেখে আবার "যাচাই করুন" চাপুন।
              </div>
            :null}
            {(!syncCheck.stillPendingHere||syncCheck.stillPendingHere.length===0)&&syncCheck.localOnly.length===0&&(!syncCheck.mismatched||syncCheck.mismatched.length===0)?
              <div style={{background:"#f0fdf4",color:"#166534",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:600}}>✅ সব ঠিক আছে — এই ডিভাইসের সবকিছুই সার্ভারের সাথে মিলছে</div>
              :<div>
                {syncCheck.localOnly.length>0&&<>
                <div style={{background:"#fef2f2",color:"#991b1b",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:700,marginBottom:7}}>⚠️ {syncCheck.localOnly.length}টা অর্ডার শুধু এই ডিভাইসেই আছে, সার্ভারে নেই:</div>
                {syncCheck.localOnly.map(o=><div key={o.no} style={{background:"#fff7ed",borderRadius:7,padding:"7px 9px",marginBottom:5,fontSize:10}}>
                  <div style={{fontWeight:700}}>{o.cust.name} — {o.no}</div>
                  <div style={{color:"#888",fontSize:9,marginTop:1}}>{money(o.cust.total)} · {o.cust.date}</div>
                  <button onClick={async()=>{
                    setResending(prev=>({...prev,[o.no]:true}));
                    onUpdateOrder(o);
                    setTimeout(async()=>{const r=await onCheckServerSync();setSyncCheck(r);setResending(prev=>({...prev,[o.no]:false}))},1500);
                  }} disabled={resending[o.no]} style={{marginTop:5,background:"#7c2d12",color:"white",border:"none",borderRadius:6,padding:"6px 10px",fontSize:9,fontWeight:700}}>{resending[o.no]?"পাঠানো হচ্ছে...":"📤 আবার সার্ভারে পাঠান"}</button>
                </div>)}
                </>}
                {syncCheck.mismatched&&syncCheck.mismatched.length>0&&<>
                <div style={{background:"#fffbeb",color:"#92400e",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:700,marginBottom:7,marginTop:syncCheck.localOnly.length>0?10:0}}>
                  ⚠️ {syncCheck.mismatched.length}টা অর্ডারের তথ্য এই ডিভাইসে সার্ভারের চেয়ে ভিন্ন। সাধারণত এটা নিজে থেকেই মিলে যায়; না মিললে নিচের বাটনে একবার চাপলেই সবগুলো একসাথে সার্ভারের সাথে মিলে যাবে।
                  <button onClick={()=>{
                    (syncCheck.mismatched||[]).forEach(o=>{
                      const sv=syncCheck.serverDocs&&syncCheck.serverDocs[o.no];
                      if(sv)onAcceptServerVersion(o.no,sv);
                    });
                    setSyncCheck(prev=>prev?{...prev,mismatched:[]}:prev);
                  }} style={{width:"100%",marginTop:7,background:"#92400e",color:"white",border:"none",borderRadius:7,padding:"9px",fontSize:11,fontWeight:700}}>🔄 সবগুলো একসাথে সার্ভারের সাথে মিলিয়ে নিন ({syncCheck.mismatched.length}টি)</button>
                </div>
                {syncCheck.mismatched.map(o=><div key={o.no} style={{background:"#fffdf5",borderRadius:7,padding:"6px 9px",marginBottom:4,fontSize:9.5,border:"1px solid #fde68a"}}>
                  <div style={{fontWeight:700}}>{o.cust.name} — {o.no}</div>
                </div>)}
                </>}
              </div>}
          </div>}
        </div>

        {/* ── ভুলে চাপলে যাতে পুরো অ্যাপ অচল না হয়ে যায় — একদম নিচে, আর সাধারণ ক্লিকের বদলে
        RESET টাইপ করে নিশ্চিত করা লাগবে (resetDb-এর মতোই কড়া) ── */}
        <div style={{marginTop:14,paddingTop:14,borderTop:"1px dashed #ddd",textAlign:"center"}}>
          <button onClick={()=>{
            const typed=window.prompt("⚠️ এটি করলে এই ডিভাইসের Firebase সংযোগ মুছে যাবে — নতুন করে সঠিক Firebase কোড না বসানো পর্যন্ত অ্যাপটি আর চলবে না। ভুল করে চাপে থাকলে এখনই বাতিল করুন (Cancel)।\n\nনিশ্চিত হলে নিচে ইংরেজিতে RESET লিখুন:");
            if(!typed||typed.trim().toUpperCase()!=="RESET")return;
            onResetConfig();
          }} style={{background:"none",border:"none",color:"#aaa",fontSize:10,textDecoration:"underline",cursor:"pointer"}}>Firebase সংযোগ পরিবর্তন করুন</button>
        </div>
      </div></>}
    </div>
    {profitDetailOpen&&<div style={{position:"fixed",inset:0,background:"white",zIndex:200,overflowY:"auto"}}>
      <div style={{position:"sticky",top:0,background:"#166534",color:"white",padding:"14px 16px",display:"flex",alignItems:"center",gap:10,zIndex:1}}>
        <button onClick={()=>setProfitDetailOpen(false)} style={{background:"none",border:"none",color:"white",fontSize:20,padding:0}}>←</button>
        <div style={{fontSize:15,fontWeight:800}}>💰 কোন ফার্নিচারে খরচ ও লাভ কত</div>
      </div>
      <div style={{padding:16}}>
        {(()=>{
          const ranked=stats.catProfitRanked||[];
          const T=ranked.reduce((t,c)=>({revenue:t.revenue+c.revenue,wood:t.wood+c.woodCost,sal:t.sal+c.salaryCost,exp:t.exp+c.expenseCost,cost:t.cost+c.cost,cft:t.cft+c.cft,count:t.count+c.count}),{revenue:0,wood:0,sal:0,exp:0,cost:0,cft:0,count:0});
          const tProfit=T.revenue-T.cost,tMargin=T.revenue>0?(tProfit/T.revenue)*100:0;
          const row=(l,v,o)=><React.Fragment key={l}><div style={{color:o&&o.b?"#333":"#666",fontWeight:o&&o.b?700:400,borderTop:o&&o.line?"1px dashed #ddd":"none",paddingTop:o&&o.line?4:0}}>{l}</div><div style={{textAlign:"right",fontWeight:o&&o.b?800:600,color:(o&&o.c)||"#333",borderTop:o&&o.line?"1px dashed #ddd":"none",paddingTop:o&&o.line?4:0}}>{v}</div></React.Fragment>;
          const pct=(x)=>toBnDigits(x.toFixed(0))+"%";
          return<>
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:10,padding:"10px 12px",fontSize:10,color:"#166534",lineHeight:1.65,marginBottom:12}}>
              <div style={{fontWeight:800,marginBottom:3}}>হিসাব যেভাবে হয়েছে</div>
              <div>• শুধু ডেলিভারি হওয়া অর্ডার। বিক্রি = দাম × পরিমাণ।</div>
              <div>• কাঠ: অর্ডারে যত CFT কাঠ গেছে × অর্ডারের সময়ের কাঠের দাম (অপচয় ধরা চূড়ান্ত দাম)।</div>
              <div>• বেতন ও অন্যান্য খরচ: ফার্নিচারটা যে সপ্তাহগুলোতে তৈরি হয়েছে (প্রথম বিভাগে কাজ শুরু থেকে শেষ বিভাগের শেষ দিন), সেই সপ্তাহগুলোর আসল বেতন আর খরচ, ওই সময়ে কাজ চলা সব ফার্নিচারের মধ্যে CFT অনুযায়ী ভাগ করে।{stats.furnitureHasPayroll?"":" (পে-রোলে এখনো কোনো হাজিরা নেই, তাই সেটিংসের শ্রম-হার ধরা হয়েছে।)"}</div>
              <div>• শেষের তারিখ না থাকলে ডেলিভারির তারিখ ধরা হয়; শুরুর তারিখ না থাকলে ট্র্যাক করা ফার্নিচারের গড় তৈরির সময় ({toBnDigits(stats.furnitureAvgDur||21)} দিন)।</div>
              <div>• যে সপ্তাহে কোনো ফার্নিচারে কাজ চলেনি, সেই বেতন/খরচ লাভ-ক্ষতি রিপোর্টে আলাদা লাইনে দেখায়।</div>
            </div>
            {ranked.length>0&&<div style={{background:"white",border:"1.5px solid #166534",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontWeight:800,fontSize:13}}>সব ফার্নিচার মিলিয়ে</span>
                <span style={{fontWeight:800,fontSize:13,color:tMargin>=0?"#166534":RED}}>{pct(tMargin)} লাভ</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:5,fontSize:10.5}}>
                {row(`বিক্রি (${toBnDigits(T.count)}টি ফার্নিচার)`,money(Math.round(T.revenue)),{c:"#166534"})}
                {row(`কাঠ (${toBnDigits(T.cft.toFixed(1))} CFT)`,money(Math.round(T.wood)),{c:"#92400e"})}
                {row("কর্মীদের বেতন",money(Math.round(T.sal)),{c:"#92400e"})}
                {row("অন্যান্য খরচ",money(Math.round(T.exp)),{c:"#92400e"})}
                {row("মোট খরচ",money(Math.round(T.cost)),{b:true,line:true})}
                {row("নিট লাভ",money(Math.round(tProfit)),{b:true,c:tProfit>=0?"#166534":RED})}
              </div>
            </div>}
            {ranked.map(c=>{const open=profitOpenCat===c.label;return<div key={c.label} style={{background:"#fafafa",border:"1px solid #eee",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
                <span style={{fontWeight:700,fontSize:13}}>{c.label} <span style={{color:"#999",fontSize:10,fontWeight:500}}>({toBnDigits(c.count)}টি · {toBnDigits(c.cft.toFixed(1))} CFT)</span></span>
                <span style={{fontWeight:800,fontSize:13,color:c.margin>=0?"#166534":RED,flexShrink:0}}>{pct(c.margin)} লাভ</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:5,fontSize:10.5}}>
                {row("বিক্রি",money(Math.round(c.revenue)),{c:"#166534"})}
                {row("কাঠ",money(Math.round(c.woodCost)),{c:"#92400e"})}
                {row("কর্মীদের বেতন",money(Math.round(c.salaryCost)),{c:"#92400e"})}
                {row("অন্যান্য খরচ",money(Math.round(c.expenseCost)),{c:"#92400e"})}
                {row("মোট খরচ",money(Math.round(c.cost)),{b:true,line:true})}
                {row("নিট লাভ",money(Math.round(c.profit)),{b:true,c:c.profit>=0?"#166534":RED})}
              </div>
              {c.cft>0&&<div style={{fontSize:9.5,color:"#777",marginTop:6}}>প্রতি CFT: বিক্রি {money(Math.round(c.revenue/c.cft))} · খরচ {money(Math.round(c.cost/c.cft))} · লাভ {money(Math.round(c.profit/c.cft))}</div>}
              <button onClick={()=>setProfitOpenCat(open?null:c.label)} style={{width:"100%",marginTop:8,background:"white",border:"1px solid #ddd",borderRadius:8,padding:"7px",fontSize:11,fontWeight:600,color:"#166534"}}>{open?"▲ অর্ডারগুলো লুকান":`▼ ${toBnDigits(c.rows.length)}টা অর্ডারের আলাদা হিসাব দেখুন`}</button>
              {open&&<div style={{marginTop:8}}>
                {c.rows.map((r,i)=><div key={i} style={{background:"white",border:"1px solid #eee",borderRadius:8,padding:"7px 9px",marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",gap:6,fontSize:10.5,fontWeight:700,color:"#333"}}><span style={{minWidth:0}}>🪵 {r.woodDate?fmtDate(r.woodDate):"—"} · {r.cust||"—"}</span><span style={{color:r.profit>=0?"#166534":RED,flexShrink:0}}>লাভ {money(Math.round(r.profit))}</span></div>
                  <div style={{fontSize:9.5,color:"#777",margin:"2px 0 2px"}}>{r.model}{r.wood?` · ${r.wood}`:""} · {toBnDigits(r.cft.toFixed(2))} CFT × {money(Math.round(r.woodRate||0))}/CFT · অর্ডার {r.no}</div>
                  <div style={{fontSize:9,color:"#94a3b8",marginBottom:5}}>🔨 তৈরি: {r.start?fmtDate(r.start):"—"}{r.startAssumed?" (আনুমানিক)":""} – {r.end?fmtDate(r.end):"—"}{r.endIsDelivery?" (ডেলিভারির তারিখ)":""}{r.woodFilledAt?` · কাঠের মাপ পরে বসানো (${fmtDate(r.woodFilledAt)})`:""}</div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,fontSize:9.5,textAlign:"center"}}>
                    {[["বিক্রি",r.revenue],["কাঠ",r.woodCost],["বেতন",r.salaryCost],["খরচ",r.expenseCost]].map(([l,v])=><div key={l}><div style={{color:"#999"}}>{l}</div><div style={{fontWeight:600}}>{money(Math.round(v))}</div></div>)}
                  </div>
                  {r.salBasis!=="weeks"&&<div style={{fontSize:8.5,color:"#a16207",marginTop:3}}>বেতন: {r.salBasis==="setting"?"সেটিংসের শ্রম-হারে (তখনো পে-রোলে হাজিরা ছিল না)":"আংশিক সেটিংসের শ্রম-হারে (পে-রোল শুরুর আগের অংশ)"}</div>}
                </div>)}
              </div>}
            </div>})}
            <div style={{marginTop:16}}>
              <div style={{fontSize:12,fontWeight:800,color:"#333",marginBottom:3}}>📅 মাস অনুযায়ী প্রতি CFT-এর হার</div>
              <div style={{fontSize:9.5,color:"#999",marginBottom:8,lineHeight:1.5}}>কাজ হয়েছে = সেই মাসে ফার্নিচারগুলোতে যতটা কাজ চলেছে (CFT)। প্রতি CFT হার = ফার্নিচারে বসানো বেতন/খরচ ÷ ওই কাজ। "না বসা" = যে সপ্তাহে কোনো ফার্নিচারে কাজ চলেনি</div>
              <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:9.5,minWidth:430}}>
                <thead><tr style={{background:"#f3f4f6"}}>{["মাস","কাজ হয়েছে (CFT)","বেতন","অন্যান্য খরচ","প্রতি CFT বেতন","প্রতি CFT খরচ","না বসা"].map((h,i)=><th key={h} style={{padding:"6px 4px",textAlign:i===0?"left":"right",fontWeight:700,color:"#555"}}>{h}</th>)}</tr></thead>
                <tbody>{[...(stats.furnitureMonths||[])].reverse().map(m=><tr key={m.key} style={{borderBottom:"1px solid #f0f0f0"}}>
                  <td style={{padding:"5px 4px",fontWeight:600,whiteSpace:"nowrap"}}>{m.label}</td>
                  <td style={{padding:"5px 4px",textAlign:"right"}}>{m.cft?toBnDigits(m.cft.toFixed(1)):"—"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right"}}>{m.salary?money(Math.round(m.salary)):"—"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right"}}>{m.expense?money(Math.round(m.expense)):"—"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right",fontWeight:600}}>{m.salPerCft!==null?money(Math.round(m.salPerCft)):"—"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right",fontWeight:600}}>{m.expPerCft!==null?money(Math.round(m.expPerCft)):"—"}</td>
                  <td style={{padding:"5px 4px",textAlign:"right",color:"#a16207"}}>{(m.idleSalary+m.idleExpense)>0?money(Math.round(m.idleSalary+m.idleExpense)):"—"}</td>
                </tr>)}</tbody>
              </table></div>
            </div>
          </>;
        })()}
      </div>
    </div>}
  </div>
}

/* ── EXPENSE PAGE ── */
function ExpensePage({expenses,onSave,onBack}){
  const today=todayStr();
  const now=new Date();
  const[form,setForm]=useState({date:today,category:"hardware",itemName:"",qty:"",unit:"cft",rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  const[viewYear,setViewYear]=useState(now.getFullYear());
  const[viewMonth,setViewMonth]=useState(now.getMonth());
  const[search,setSearch]=useState("");
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"11px 12px",fontSize:14,outline:"none"};
  const lbl=(t)=><div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:5}}>{t}</div>;

  // ── একই বা কাছাকাছি নামের পণ্যের আগের কেনাকাটার ইতিহাস — রেট বক্সের নিচে দেখানোর জন্য ──
  const similarPurchases=useMemo(()=>{
    const typed=form.itemName.trim().toLowerCase();
    if(typed.length<2)return[];
    const words=typed.split(/\s+/).filter(w=>w.length>=2);
    const matches=expenses.filter(e=>{
      const name=(e.itemName||"").trim().toLowerCase();
      if(!name)return false;
      if(name.includes(typed)||typed.includes(name))return true;
      return words.some(w=>name.includes(w));
    });
    return matches.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  },[expenses,form.itemName]);

  // Supplier ranking by total spend in last 1 year
  const supplierList=useMemo(()=>{
    const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const map={};
    expenses.forEach(e=>{
      if(!e.supplier)return;
      const key=e.supplier.trim();
      if(!map[key])map[key]={name:key,phone:e.supplierPhone||"",total:0,recentDate:e.date};
      if(new Date(e.date)>=oneYearAgo)map[key].total+=(parseFloat(e.total)||0);
      if(new Date(e.date)>new Date(map[key].recentDate)){map[key].recentDate=e.date;if(e.supplierPhone)map[key].phone=e.supplierPhone;}
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[expenses]);

  const onSupplierNameChange=(val)=>{
    const match=supplierList.find(s=>s.name.toLowerCase()===val.trim().toLowerCase());
    setForm({...form,supplier:val,supplierPhone:match?match.phone:form.supplierPhone});
  };

  const total=(parseFloat(form.qty)||0)*(parseFloat(form.rate)||0);

  const submit=()=>{
    if(!form.itemName||!form.qty||!form.rate)return;
    onSave({...form,total,at:new Date().toISOString()});
    setForm({date:today,category:form.category,itemName:"",qty:"",unit:form.unit,rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  };

  // ── ডিফল্টে শুধু নির্বাচিত মাসের খরচ (তালিকা যাতে দিনে দিনে বিশাল না হয়ে যায়) ──
  // সার্চ করলে সব সময়ের ভেতর থেকে খোঁজা হয়
  const monthExpenses=useMemo(()=>expenses.filter(e=>{
    const d=new Date(e.date);
    return d.getFullYear()===viewYear&&d.getMonth()===viewMonth;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date)),[expenses,viewYear,viewMonth]);

  const searchResults=useMemo(()=>{
    const q=search.trim().toLowerCase();
    if(q.length<2)return null;
    return expenses.filter(e=>(e.itemName||"").toLowerCase().includes(q)||(e.supplier||"").toLowerCase().includes(q))
      .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);
  },[expenses,search]);

  const displayList=searchResults!==null?searchResults:monthExpenses;
  const monthTotal=monthExpenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);
  const prevMonth=()=>{if(viewMonth===0){setViewYear(viewYear-1);setViewMonth(11)}else setViewMonth(viewMonth-1)};
  const nextMonth=()=>{if(viewMonth===11){setViewYear(viewYear+1);setViewMonth(0)}else setViewMonth(viewMonth+1)};

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#0f766e",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>খরচ এন্ট্রি</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:560,margin:"0 auto"}}>
      <div style={{background:"white",borderRadius:14,padding:"18px",boxShadow:"0 2px 10px rgba(0,0,0,.07)",marginBottom:18}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("তারিখ")}<DateInput value={form.date} onChange={v=>setForm({...form,date:v})} accent="#0f766e"/></div>
          <div>{lbl("ক্যাটাগরি")}
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={inp}>
              {EXP_CATS.map(c=><option key={c.id} value={c.id}>{c.bn}</option>)}
            </select>
          </div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পণ্য/আইটেমের নাম *")}<input value={form.itemName} onChange={e=>setForm({...form,itemName:e.target.value})} placeholder="যেমন: কাঠের স্ক্রু, লেকার স্প্রে" style={inp}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:8}}>
          <div>{lbl("পরিমাণ *")}<input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="0" style={inp}/></div>
          <div>{lbl("একক")}<select value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} style={inp}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
          <div>{lbl("রেট (৳) *")}<input type="number" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} placeholder="0" style={inp}/></div>
        </div>
        {similarPurchases.length>0&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"9px 12px",marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:6}}>📌 এই বা কাছাকাছি নামের আগের কেনাকাটা — ট্যাপ করে বসিয়ে দিন (পরিমাণ ছাড়া)</div>
          {similarPurchases.map((p,i)=><div key={i} onClick={()=>setForm(f=>({...f,itemName:p.itemName,category:p.category||f.category,unit:p.unit||f.unit,rate:p.rate,supplier:p.supplier||"",supplierPhone:p.supplierPhone||"",payMethod:p.payMethod||f.payMethod}))} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#78350f",padding:"6px 4px",borderTop:i>0?"1px dashed #fde68a":"none",cursor:"pointer",borderRadius:6}}>
            <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"55%"}}>{p.itemName} · {fmtDate(p.date)}</span>
            <strong>{p.qty} {p.unit} × {money(p.rate)}</strong>
          </div>)}
        </div>}
        <div style={{background:"#f0fdf4",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#555"}}>মোট মূল্য:</span>
          <span style={{fontSize:20,fontWeight:800,color:"#166534"}}>{money(total)}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("সাপ্লায়ার/বিক্রেতা")}
            <input list="supplier-list" value={form.supplier} onChange={e=>onSupplierNameChange(e.target.value)} placeholder="নাম লিখুন বা তালিকা থেকে বেছে নিন" style={inp}/>
            <datalist id="supplier-list">{supplierList.map(s=><option key={s.name} value={s.name}/>)}</datalist>
          </div>
          <div>{lbl("বিক্রেতার ফোন")}<input value={form.supplierPhone} onChange={e=>setForm({...form,supplierPhone:e.target.value})} placeholder="01XXXXXXXXX" style={inp}/></div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পেমেন্ট মাধ্যম")}<select value={form.payMethod} onChange={e=>setForm({...form,payMethod:e.target.value})} style={inp}><option>নগদ</option><option>বাকি</option><option>ব্যাংক</option></select></div>
        <div style={{marginBottom:16}}>{lbl("নোট")}<textarea rows={2} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={submit} style={{width:"100%",background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"15px",fontSize:15,fontWeight:700}}>খরচ সংরক্ষণ করুন</button>
      </div>

      <div style={{marginBottom:10}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 পণ্য বা সাপ্লায়ারের নাম দিয়ে যেকোনো সময়ের খরচ খুঁজুন..." style={{...inp,background:"white"}}/>
      </div>

      {searchResults===null&&<div className="no-print" style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:11,padding:"9px 12px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <button onClick={prevMonth} style={{background:"#f0fdfa",border:"none",borderRadius:7,padding:"7px 11px",color:"#0f766e",fontWeight:700}}>◀</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:13,fontWeight:700}}>{monthName(viewMonth)} {viewYear}</div>
          <div style={{fontSize:10,color:"#888"}}>মোট: {money(monthTotal)} ({monthExpenses.length}টি এন্ট্রি)</div>
        </div>
        <button onClick={nextMonth} style={{background:"#f0fdfa",border:"none",borderRadius:7,padding:"7px 11px",color:"#0f766e",fontWeight:700}}>▶</button>
      </div>}

      <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>{searchResults!==null?`সার্চ ফলাফল (${searchResults.length})`:"এই মাসের খরচ"}</div>
      {displayList.length===0?<div style={{textAlign:"center",color:"#aaa",padding:20,fontSize:13}}>{searchResults!==null?"কিছু পাওয়া যায়নি":"এই মাসে কোনো খরচ এন্ট্রি নেই"}</div>:
      displayList.map((e,i)=>{
        const cat=EXP_CATS.find(c=>c.id===e.category);
        return<div key={i} style={{background:"white",borderRadius:10,padding:"11px 13px",marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between"}}>
          <div><div style={{fontWeight:700,fontSize:13}}>{e.itemName}</div><div style={{fontSize:11,color:"#888",marginTop:1}}>{cat?.bn} | {e.qty} {e.unit} × {money(e.rate)} | {e.supplier||"—"}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:"#0f766e"}}>{money(e.total)}</div><div style={{fontSize:10,color:"#aaa"}}>{fmtDate(e.date)}</div></div>
        </div>
      })}
    </div>
  </div>
}

/* ── WOOD STOCK PAGE ── */
function WoodStockPage({woodLots,saveWoodLots,addLotPayment,woodSettings,saveWoodSettings,laborSettings,saveLaborSettings,rackSplits,addRackSplit,rackBands,addRackBand,removeRackBand,payrollWeeks,workers,orders,expenses,onBack,view,lotId,onOpenList,onOpenDetail,onOpenNew,onOpenRates,onOpenUsage,highlightNo}){
  const today=todayStr();
  const setView=(v)=>{if(v==="list")onOpenList();else if(v==="new")onOpenNew();else if(v==="rates")onOpenRates();else if(v==="usage")onOpenUsage()}; // পুরনো কল-সাইটের সাথে সামঞ্জস্যের জন্য
  const setSelLotId=(id)=>onOpenDetail(id);
  const selLotId=lotId;
  const[newLot,setNewLot]=useState({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:"",codePrefix:""});
  // ── v4.61: আগের সাপ্লায়ারদের তালিকা (সর্বশেষ লট থেকে ফোন, ঠিকানা আর গুড়ির কোডের অক্ষর) ──
  const[supSel,setSupSel]=useState("");
  const supplierList=useMemo(()=>{
    const m={};
    [...(woodLots||[])].sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))).forEach(l=>{
      const nm=String(l.supplier||"").trim();if(!nm||m[nm])return;
      m[nm]={name:nm,phone:l.supplierPhone||"",address:l.supplierAddress||"",prefix:String(l.codePrefix||"").trim()};
    });
    return Object.values(m);
  },[woodLots]);
  const cleanPrefix=(v)=>String(v||"").replace(/[\s\-]+/g,"").slice(0,8);
  const[newLog,setNewLog]=useState({lengthFt:"",diameterIn:""});
  const[newPay,setNewPay]=useState({date:today,amount:""});
  const[sellingLogId,setSellingLogId]=useState(null);
  const[sellPrice,setSellPrice]=useState("");
  const[newMilling,setNewMilling]=useState({date:today,cft:"",billAmount:"",note:""});
  const[rateDraft,setRateDraft]=useState({});
  const[bandDraft,setBandDraft]=useState({});
  const[usagePeriod,setUsagePeriod]=useState("6m");
  const[usageTrendMode,setUsageTrendMode]=useState("prev");
  const[usageWoodFilter,setUsageWoodFilter]=useState("all");
  const[expandedCode,setExpandedCode]=useState(null);
  const[totalRacksInput,setTotalRacksInput]=useState("");
  const[rackCapacityInput,setRackCapacityInput]=useState("30");
  const[editingBandFor,setEditingBandFor]=useState(null);
  const[laborRateDraft,setLaborRateDraft]=useState({from:"",rate:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const selLot=woodLots.find(l=>l.id===selLotId);
  const wSettings=(woodType)=>(woodSettings&&woodSettings[woodType])||{wastagePercent:0,finalAvgRate:0};


  const createLot=()=>{
    if(!newLot.supplier)return;
    const lot={id:"lot_"+Date.now(),...newLot,supplier:newLot.supplier.trim(),codePrefix:cleanPrefix(newLot.codePrefix),logCounter:0,logs:[],payments:[],millingEntries:[],transportCost:0,otherCost:0};
    saveWoodLots([lot,...woodLots]);
    onOpenDetail(lot.id);
    setNewLot({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:"",codePrefix:""});setSupSel("");
  };

  const updateLot=(updated)=>{
    saveWoodLots(woodLots.map(l=>l.id===updated.id?updated:l));
  };

  const addLog=()=>{
    const lengthFt=parseFloat(newLog.lengthFt),diameterIn=parseFloat(newLog.diameterIn);
    if(!lengthFt||!diameterIn)return;
    const cftVal=cftLog(lengthFt,diameterIn);
    // v4.61: প্রতিটা গুড়ি যোগ হওয়ার সাথে সাথেই স্থায়ী কোড পায় (যেমন RH-24) — পরে কোনো গুড়ি মুছলেও বদলায় না
    const n=nextLogNumber(selLot,woodLots);
    const code=makeLogCode(String(selLot.codePrefix||"").trim(),n);
    const log={id:"log_"+Date.now(),code,lengthFt,diameterIn,cft:cftVal,cut:false,cutDate:"",sold:false,soldDate:"",soldPrice:0};
    updateLot({...selLot,logCounter:n,logs:[...selLot.logs,log]});
    setNewLog({lengthFt:"",diameterIn:""});
  };
  const removeLog=(logId,logLabel)=>{
    if(!window.confirm(`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি একেবারে মুছে ফেলতে চান? এটি ফিরিয়ে আনা যাবে না।`))return;
    updateLot({...selLot,logs:selLot.logs.filter(l=>l.id!==logId)});
  };
  const toggleCut=(logId,logLabel,currentlyCut)=>{
    const msg=currentlyCut?`"${logLabel}" এই গুড়ির কাটা চিহ্ন বাতিল করতে চান?`:`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি কাটা হয়েছে বলে চিহ্নিত করতে চান?`;
    if(!window.confirm(msg))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,cut:!l.cut,cutDate:!l.cut?today:""}:l);
    updateLot({...selLot,logs});
  };
  const startSell=(logId)=>{setSellingLogId(logId);setSellPrice("")};
  const confirmSell=(logId)=>{
    const price=parseFloat(sellPrice);
    if(!price||price<=0)return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:true,soldDate:today,soldPrice:price}:l);
    updateLot({...selLot,logs});
    setSellingLogId(null);setSellPrice("");
  };
  const unsellLog=(logId,logLabel)=>{
    if(!window.confirm(`"${logLabel}" এই গুড়ির বিক্রি বাতিল করতে চান?`))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:false,soldDate:"",soldPrice:0}:l);
    updateLot({...selLot,logs});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    addLotPayment(selLot.id,newPay);
    setNewPay({date:today,amount:""});
  };
  const deleteLot=(lotId)=>{
    if(window.confirm("এই লটটি মুছে ফেলতে চান?")){
      saveWoodLots(woodLots.filter(l=>l.id!==lotId));
      onOpenList();
    }
  };

  const lotTotalCft=(lot)=>lot.logs.reduce((s,l)=>s+l.cft,0);
  const lotTotalCost=(lot)=>lotTotalCft(lot)*(parseFloat(lot.ratePerCft)||0);
  const lotTotalPaid=(lot)=>(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const lotRemaining=(lot)=>lotTotalCost(lot)-lotTotalPaid(lot);
  // ── আমার নিজের দেনা: বাকিতে কেনা খরচ + কাঠের লটে সাপ্লায়ারকে বাকি — সাপ্লায়ার অনুযায়ী
  // (আগে হোম পেজে ছিল, এখন কাঠের স্টক পেজেই — যেহেতু বেশিরভাগ দেনাই কাঠ-সংক্রান্ত) ──
  const payablesInfo=useMemo(()=>{
    const bySupplier={};
    (expenses||[]).filter(e=>e.payMethod==="বাকি").forEach(e=>{
      const sup=(e.supplier||"").trim()||"অজানা বিক্রেতা";
      if(!bySupplier[sup])bySupplier[sup]={name:sup,phone:e.supplierPhone||"",amount:0,items:0,kind:"খরচ"};
      bySupplier[sup].amount+=parseFloat(e.total)||0;
      bySupplier[sup].items+=1;
      if(e.supplierPhone&&!bySupplier[sup].phone)bySupplier[sup].phone=e.supplierPhone;
    });
    (woodLots||[]).forEach(lot=>{
      const rem=lotRemaining(lot);
      if(rem<=0)return;
      const sup=(lot.supplier||"").trim()||"অজানা কাঠ সাপ্লায়ার";
      if(!bySupplier[sup])bySupplier[sup]={name:sup,phone:lot.supplierPhone||"",amount:0,items:0,kind:"কাঠ"};
      else if(bySupplier[sup].kind==="খরচ")bySupplier[sup].kind="খরচ + কাঠ";
      bySupplier[sup].amount+=rem;
      bySupplier[sup].items+=1;
      if(lot.supplierPhone&&!bySupplier[sup].phone)bySupplier[sup].phone=lot.supplierPhone;
    });
    const list=Object.values(bySupplier).sort((a,b)=>b.amount-a.amount);
    const totalReceivable=(orders||[]).filter(o=>!o.cancelled).reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      return s+Math.max(0,(parseFloat(o.cust.total)||0)-paid);
    },0);
    return{list,total:list.reduce((s,p)=>s+p.amount,0),totalReceivable};
  },[expenses,woodLots,orders]);
  const lotSoldCft=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+l.cft,0);
  const lotSoldAmount=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+(parseFloat(l.soldPrice)||0),0);
  const lotCutCft=(lot)=>lot.logs.filter(l=>l.cut&&!l.sold).reduce((s,l)=>s+l.cft,0);
  const lotAvailableCft=(lot)=>lot.logs.filter(l=>!l.sold&&!l.cut).reduce((s,l)=>s+l.cft,0);
  const lotCurrentStockPricePerCft=(lot)=>{
    const availCft=lotAvailableCft(lot);
    if(availCft<=0)return 0;
    const cutCost=lotCutCft(lot)*(parseFloat(lot.ratePerCft)||0);
    const adjustedCost=lotTotalCost(lot)-lotSoldAmount(lot)-cutCost;
    return adjustedCost/availCft;
  };

  // ── কাটাই/মিলিং সংক্রান্ত হিসাব ──
  const lotMillingTotal=(lot)=>(lot.millingEntries||[]).reduce((s,m)=>s+(parseFloat(m.billAmount)||0),0);
  const lotUsableCft=(lot)=>{
    const raw=lotCutCft(lot);
    const wastage=wSettings(lot.woodType).wastagePercent||0;
    return raw*(1-wastage/100);
  };
  const lotRealCostPerCft=(lot)=>{
    const raw=lotCutCft(lot);
    const usable=lotUsableCft(lot);
    if(raw<=0||usable<=0)return 0;
    const totalLotCft=lotTotalCft(lot);
    const proportionalPurchase=totalLotCft>0?(raw/totalLotCft)*lotTotalCost(lot):0;
    const extra=lotMillingTotal(lot)+(parseFloat(lot.transportCost)||0)+(parseFloat(lot.otherCost)||0);
    return(proportionalPurchase+extra)/usable;
  };
  const cftCutOnDate=(lot,date)=>lot.logs.filter(l=>l.cut&&!l.sold&&l.cutDate===date).reduce((s,l)=>s+l.cft,0);
  const addMillingEntry=()=>{
    const bill=parseFloat(newMilling.billAmount);
    if(!bill||bill<=0)return;
    const entry={id:"mill_"+Date.now(),date:newMilling.date,cft:parseFloat(newMilling.cft)||0,billAmount:bill,note:newMilling.note};
    updateLot({...selLot,millingEntries:[...(selLot.millingEntries||[]),entry]});

    if(totalUsable<=0)return 0;
    const weightedSum=relevant.reduce((s,l)=>s+lotRealCostPerCft(l)*lotUsableCft(l),0);
    return weightedSum/totalUsable;
  };

                  byCode[code].cft+=cv;
                  byCode[code].pieces+=pc;
                  if(!byCode[code].byLength[p.l])byCode[code].byLength[p.l]={pieces:0,cft:0};
                  byCode[code].byLength[p.l].pieces+=pc;
                  byCode[code].byLength[p.l].cft+=cv;
                  byWood[pw]=(byWood[pw]||0)+cv;
                  total+=cv;totalPieces+=pc;
                });
              });
            });
          });
          return{byCode,byWood,total,totalPieces};
        };

        const cur=computeUsage(curStart,today);
        const cmp=computeUsage(cmpStart,cmpEnd);
        const cmpHasAnyData=cmp.total>0; // তুলনার পুরো সময়টাতেই যদি কোনো অর্ডার না থাকে, তাহলে "নতুন" লেবেল ভ্রান্তিকর — তাই সেই ক্ষেত্রে প্রবণতা একেবারেই দেখানো হবে না

        // ── হাইট ব্যান্ড বসানোর সময় লাইভ দেখানোর জন্য — আসল (ব্যান্ড-ছাড়া) H অনুযায়ী CFT, কাঠভেদে ──
        const rawHByWood={};
        orders.filter(o=>!o.cancelled&&o.cust.date>=curStart&&o.cust.date<today).forEach(o=>{
          (o.items||[]).forEach(it=>{
            (it.sections||[]).forEach(sec=>{
              (sec.pieces||[]).forEach(p=>{
                const pw=pieceWoodType(p,sec,it.wood);
                if(!rawHByWood[pw])rawHByWood[pw]={};
                const cv=cft((p.pc||0)*(it.qty||1),p.h,p.l,p.w);
                rawHByWood[pw][p.h]=(rawHByWood[pw][p.h]||0)+cv;
              });
            });
          });
        });

        let codeList=Object.values(cur.byCode);
        if(usageWoodFilter!=="all")codeList=codeList.filter(c=>c.wood===usageWoodFilter);
        codeList.sort((a,b)=>b.cft-a.cft);

        const woodList=Object.entries(cur.byWood).map(([wood,cftVal])=>({wood,cft:cftVal})).sort((a,b)=>b.cft-a.cft);

        const trendFor=(code)=>{
          if(!cmpHasAnyData)return null;
          const prevCft=(cmp.byCode[code]&&cmp.byCode[code].cft)||0;
          const curCft=(cur.byCode[code]&&cur.byCode[code].cft)||0;
          if(prevCft<=0)return curCft>0?{label:"নতুন",color:"#1d4ed8"}:null;
          const pct=((curCft-prevCft)/prevCft)*100;
          if(Math.abs(pct)<1)return{label:"— একই",color:"#888"};
          return pct>0?{label:`↑ ${pct.toFixed(0)}%`,color:"#166534"}:{label:`↓ ${Math.abs(pct).toFixed(0)}%`,color:RED};
        };

        // ── প্রতিটা র‍্যাকে গড়ে কত CFT আঁটে ধরে, প্রতিটা মাপের প্রয়োজনীয় র‍্যাক সংখ্যা —
        // ceil(সেই মাপের CFT ÷ ধারণক্ষমতা), তাই যেকোনো ব্যবহারই ন্যূনতম ১টা র‍্যাক দাবি করে ──
        const rackCapacity=parseFloat(rackCapacityInput)||30;
        const rackAllocation={};
        codeList.forEach(c=>{rackAllocation[c.code]=Math.max(1,Math.ceil(c.cft/rackCapacity))});
        const totalSuggestedRacks=Object.values(rackAllocation).reduce((a,b)=>a+b,0);
        const currentRacksNum=parseInt(totalRacksInput)||0;

        // ── ব্যান্ড না থাকলে কত র‍্যাক লাগত (সাশ্রয় দেখানোর জন্য) ও প্রতি কোডে কোন কোন আসল H মিশেছে ──
        const unbandedGroups={},bandedRawH={};
        orders.filter(o=>!o.cancelled&&o.cust.date>=curStart&&o.cust.date<today).forEach(o=>{
          (o.items||[]).forEach(it=>{
            (it.sections||[]).forEach(sec=>{
              (sec.pieces||[]).forEach(p=>{
                const pw=pieceWoodType(p,sec,it.wood);
                const cv=cft((p.pc||0)*(it.qty||1),p.h,p.l,p.w);
                const rawCode=rackCode(pw,p.w,p.h);
                unbandedGroups[rawCode]=(unbandedGroups[rawCode]||0)+cv;
                const bandedCode=pieceRackInfo(pw,p.w,p.h,p.l,woodSettings,rackSplits).code;
                if(!bandedRawH[bandedCode])bandedRawH[bandedCode]={};
                bandedRawH[bandedCode][p.h]=(bandedRawH[bandedCode][p.h]||0)+cv;
              });
            });
          });
        });
        const unbandedRackTotal=Object.values(unbandedGroups).reduce((s,cv)=>s+Math.max(1,Math.ceil(cv/rackCapacity)),0);
        const racksSaved=unbandedRackTotal-totalSuggestedRacks;

        const periodLabel=`${monthName(parseISO(curStart).getUTCMonth())} ${parseISO(curStart).getUTCFullYear()} – ${monthName(parseISO(today).getUTCMonth())} ${parseISO(today).getUTCFullYear()}`;

        const copyList=()=>{
          const lines=[`রূপালী ফার্নিচার — র‍্যাক ব্যবহার (গত ${periodObj.bn}, ${periodLabel})`,`মোট: ${cur.total.toFixed(2)} CFT, ${cur.totalPieces} পিস`,`ধারণক্ষমতা ধরা হয়েছে: ${rackCapacity} CFT/র‍্যাক — মোট প্রস্তাবিত: ${totalSuggestedRacks}টি`,""];
          codeList.forEach(c=>{
            const pct=cur.total>0?(c.cft/cur.total)*100:0;
            const avgMonth=c.cft/periodObj.months;
            const line=`${c.code} — ${WOOD[c.wood]?.bn} ${c.w}″×${c.h}″ — ${c.cft.toFixed(2)} CFT, ${c.pieces} পিস (${pct.toFixed(1)}%) — মাসিক গড় ${avgMonth.toFixed(2)} CFT — প্রস্তাবিত র‍্যাক: ${rackAllocation[c.code]||0}`;
            lines.push(line);
          });
          const text=lines.join("\n");
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(()=>alert("তালিকা কপি হয়েছে")).catch(()=>alert("কপি করতে সমস্যা হয়েছে"));
          }else alert("এই ব্রাউজারে কপি সুবিধা নেই");
        };

        return<div>
          <div className="no-print" style={{background:"white",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#7c2d12",marginBottom:6}}>সময়সীমা</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:12}}>
              {PERIODS.map(p=><button key={p.id} onClick={()=>setUsagePeriod(p.id)} style={{background:usagePeriod===p.id?"#7c2d12":"#f5f0ee",color:usagePeriod===p.id?"white":"#7c2d12",border:"none",borderRadius:8,padding:"9px 4px",fontSize:11,fontWeight:700}}>{p.bn}</button>)}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#7c2d12",marginBottom:6}}>প্রবণতা তুলনা</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12}}>
              <button onClick={()=>setUsageTrendMode("prev")} style={{background:usageTrendMode==="prev"?"#7c2d12":"#f5f0ee",color:usageTrendMode==="prev"?"white":"#7c2d12",border:"none",borderRadius:8,padding:"9px 6px",fontSize:10.5,fontWeight:700}}>আগের সমান সময়ের সাথে</button>
              <button onClick={()=>setUsageTrendMode("yoy")} style={{background:usageTrendMode==="yoy"?"#7c2d12":"#f5f0ee",color:usageTrendMode==="yoy"?"white":"#7c2d12",border:"none",borderRadius:8,padding:"9px 6px",fontSize:10.5,fontWeight:700}}>গত বছরের একই সময়ের সাথে</button>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#7c2d12",marginBottom:6}}>কাঠের ধরন</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
              <button onClick={()=>setUsageWoodFilter("all")} style={{background:usageWoodFilter==="all"?"#7c2d12":"#f5f0ee",color:usageWoodFilter==="all"?"white":"#7c2d12",border:"none",borderRadius:20,padding:"6px 13px",fontSize:11,fontWeight:700}}>সব</button>
              {Object.entries(WOOD).map(([k,w])=><button key={k} onClick={()=>setUsageWoodFilter(k)} style={{background:usageWoodFilter===k?"#7c2d12":"#f5f0ee",color:usageWoodFilter===k?"white":"#7c2d12",border:"none",borderRadius:20,padding:"6px 13px",fontSize:11,fontWeight:700}}>{w.bn}</button>)}
            </div>
            <div style={{fontSize:11,fontWeight:700,color:"#7c2d12",marginBottom:4}}>একটা র‍্যাকে গড়ে কত CFT আঁটে?</div>
            <div style={{fontSize:9,color:"#999",marginBottom:6,lineHeight:1.4}}>এই ধারণক্ষমতা ধরে প্রতিটা মাপের CFT ভাগ করে কতগুলো র‍্যাক দরকার তা নিচে দেখাবে (যেকোনো ব্যবহারই ন্যূনতম ১টা র‍্যাক ধরা হয়)।</div>
            <input type="number" value={rackCapacityInput} onChange={e=>setRackCapacityInput(e.target.value)} placeholder="30" style={{width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:14,outline:"none",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{fontSize:11,fontWeight:700,color:"#7c2d12",marginBottom:4}}>গুদামে এই মুহূর্তে কতগুলো র‍্যাক আছে? (ঐচ্ছিক, তুলনার জন্য)</div>
            <input type="number" value={totalRacksInput} onChange={e=>setTotalRacksInput(e.target.value)} placeholder="যেমন: ৪০" style={{width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
            {codeList.length>0&&<div style={{fontSize:10,marginTop:6,marginBottom:12,padding:"7px 9px",background:"#f9f5f3",borderRadius:7}}>
              <span style={{color:"#7c2d12",fontWeight:700}}>প্রস্তাবিত মোট র‍্যাক: {totalSuggestedRacks}টি</span>
              {currentRacksNum>0&&<span style={{color:totalSuggestedRacks>currentRacksNum?RED:"#166534",marginLeft:6}}>({totalSuggestedRacks>currentRacksNum?`আরও ${totalSuggestedRacks-currentRacksNum}টি দরকার`:totalSuggestedRacks<currentRacksNum?`${currentRacksNum-totalSuggestedRacks}টি বেশি আছে`:"ঠিক আছে"})</span>}
              {racksSaved>0&&<div style={{color:"#166534",fontWeight:700,marginTop:3}}>✅ হাইট ব্যান্ড ছাড়া লাগত {unbandedRackTotal}টি — {racksSaved}টি সাশ্রয় হয়েছে</div>}
            </div>}
            {(rackBands||[]).length>0&&<div style={{marginBottom:12,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"8px 10px"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#1d4ed8",marginBottom:5}}>📏 চালু হাইট ব্যান্ড ({rackBands.length}টি)</div>
              {rackBands.map((b,bi)=>{
                const targetCode=rackCode(b.wood,b.w,b.rep);
                return<div key={bi} style={{display:"flex",alignItems:"center",gap:5,fontSize:10,marginBottom:3}}>
                  <span style={{flex:1,color:"#1e40af"}}>{WOOD[b.wood]?.bn} {b.w}″ → {b.from}″–{b.to}″ একসাথে (কোডে {b.rep}″)</span>
                  <button onClick={()=>{
                    setUsageWoodFilter(b.wood);
                    setBandDraft({...bandDraft,[targetCode]:{from:String(b.from),to:String(b.to)}});
                    setEditingBandFor(targetCode);
                    setTimeout(()=>document.getElementById(`rack-card-${targetCode}`)?.scrollIntoView({behavior:"smooth",block:"center"}),100);
                  }} style={{background:"#dbeafe",border:"none",borderRadius:5,padding:"2px 7px",color:"#1d4ed8",fontSize:9,fontWeight:700}}>✏️ এডিট</button>
                </div>
              })}
            </div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <button onClick={()=>window.print()} style={{background:"#7c2d12",color:"white",border:"none",borderRadius:9,padding:"11px",fontSize:12,fontWeight:700}}>🖨️ প্রিন্ট করুন</button>
              <button onClick={copyList} style={{background:"white",color:"#7c2d12",border:"2px solid #7c2d12",borderRadius:9,padding:"9px",fontSize:12,fontWeight:700}}>📋 কপি করুন</button>
            </div>
          </div>

          <div style={{textAlign:"center",marginBottom:10,fontSize:11,color:"#888"}}>গত {periodObj.bn} ({periodLabel}) | মোট {cur.total.toFixed(2)} CFT, {cur.totalPieces} পিস</div>
          {!cmpHasAnyData&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:11,color:"#1d4ed8",textAlign:"center"}}>ℹ️ তুলনার আগের সময়ে পর্যাপ্ত তথ্য নেই — কিছুদিন পর প্রবণতা (↑/↓) দেখা যাবে।</div>}

          <div style={{background:"white",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"#111"}}>কাঠের ধরন অনুযায়ী সারাংশ</div>
            {woodList.length===0?<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:10}}>এই সময়ে কোনো অর্ডার নেই</div>:
            woodList.map(w=>{
              const pct=cur.total>0?(w.cft/cur.total)*100:0;
              return<div key={w.wood} style={{marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}}>
                  <span style={{fontWeight:700}}>{WOOD[w.wood]?.bn||w.wood}</span>
                  <span style={{color:"#555"}}>{w.cft.toFixed(2)} CFT ({pct.toFixed(0)}%)</span>
                </div>
                <div style={{background:"#f0f0f0",borderRadius:5,height:7,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:"#7c2d12"}}></div></div>
              </div>
            })}
          </div>

          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>র‍্যাক-কোড অনুযায়ী বিস্তারিত ({codeList.length}টি)</div>
          {codeList.length===0?<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:16,background:"white",borderRadius:10}}>এই সময়ে ও ফিল্টারে কোনো ব্যবহার পাওয়া যায়নি</div>:
          codeList.map(c=>{
            const pct=cur.total>0?(c.cft/cur.total)*100:0;
            const trend=trendFor(c.code);
            const isHigh=pct>=15;
            const avgMonth=c.cft/periodObj.months;
            const suggested=rackAllocation[c.code];
            const isExpanded=expandedCode===c.code;
            const lengthEntries=Object.entries(c.byLength).map(([len,d])=>({len,pieces:d.pieces,cft:d.cft,pct:c.cft>0?(d.cft/c.cft)*100:0})).sort((a,b)=>b.cft-a.cft);
            const BAR_COLORS=["#ea7317","#0d9488","#eab308","#7c3aed","#94a3b8"];
            const top4=lengthEntries.slice(0,4);
            const otherPct=Math.max(0,100-top4.reduce((s,t)=>s+t.pct,0));
            const domL=lengthEntries[0];
            const showSplitSuggestion=!c.isSplit&&domL&&domL.pct>=60&&lengthEntries.length>1;
            const wc=woodColor(c.wood);
            const approveSplit=(e)=>{
              e.stopPropagation();
              const newCode=rackCode3D(c.wood,c.w,c.h,parseFloat(domL.len));
              if(!window.confirm(`"${newCode}" কোডে ${c.w}″×${c.h}″×${domL.len}″ মাপের জন্য আলাদা নতুন র‍্যাক তৈরি করতে চান?`))return;
              addRackSplit({wood:c.wood,w:c.w,h:c.h,l:parseFloat(domL.len),code:newCode,createdAt:new Date().toISOString()});
            };
            // এই কোডে কোন ব্যান্ড চালু আছে কিনা
            const myBand=(rackBands||[]).find(b=>b.wood===c.wood&&parseFloat(b.w)===parseFloat(c.w)&&parseFloat(b.rep)===parseFloat(c.h));
            // এই কোডে যেসব আসল H মিশেছে
            const mergedH=Object.entries(bandedRawH[c.code]||{}).map(([h,cv])=>({h:parseFloat(h),cft:cv})).sort((a,b)=>a.h-b.h);
            // কাছাকাছি (একই কাঠ ও একই W, ৫″ এর মধ্যে) অন্য কোডগুলো
            const nearby=codeList.filter(o=>o.code!==c.code&&o.wood===c.wood&&parseFloat(o.w)===parseFloat(c.w)&&Math.abs(o.h-c.h)<=5).sort((a,b)=>a.h-b.h);
            const isEditingBand=editingBandFor===c.code;
            const bd=bandDraft[c.code]||{};
            // টাইপ করার সাথে সাথে যাচাই: সংঘর্ষ ও কী কী মিশবে
            let bandConflict=null,bandPreview=null;
            if(bd.from!==undefined&&bd.from!==""&&bd.to!==undefined&&bd.to!==""){
              const f=parseFloat(bd.from),t=parseFloat(bd.to);
              if(f>t)bandConflict="সর্বনিম্ন মাপ সর্বোচ্চের চেয়ে বড় হতে পারে না";
              else if(c.h<f||c.h>t)bandConflict=`এই কার্ডের নিজের হাইট (${c.h}″) রেঞ্জের বাইরে — রেঞ্জে ${c.h}″ থাকতে হবে`;
              else{
                const clash=(rackBands||[]).find(b=>b.wood===c.wood&&parseFloat(b.w)===parseFloat(c.w)&&parseFloat(b.rep)!==parseFloat(c.h)&&!(t<parseFloat(b.from)||f>parseFloat(b.to)));
                if(clash)bandConflict=`সংঘর্ষ: ${clash.from}″–${clash.to}″ ব্যান্ড (কোড ${rackCode(c.wood,c.w,clash.rep)}) এর সাথে মিলে যাচ্ছে`;
                else{
                  const willMerge=codeList.filter(o=>o.wood===c.wood&&parseFloat(o.w)===parseFloat(c.w)&&o.h>=f&&o.h<=t);
                  const mergedCft=willMerge.reduce((s,o)=>s+o.cft,0);
                  bandPreview={list:willMerge,cft:mergedCft,racks:Math.max(1,Math.ceil(mergedCft/rackCapacity))};
                }
              }
            }
            const saveBand=(e)=>{
              e.stopPropagation();
              if(bandConflict||!bandPreview)return;
              if(myBand)removeRackBand(myBand); // এডিট হলে আগেরটা সরিয়ে নতুন রেঞ্জ বসবে
              addRackBand({wood:c.wood,w:parseFloat(c.w),from:parseFloat(bd.from),to:parseFloat(bd.to),rep:parseFloat(c.h)});
              setBandDraft({...bandDraft,[c.code]:{from:"",to:""}});
              setEditingBandFor(null);
            };
            return<div key={c.code} id={`rack-card-${c.code}`} style={{background:isHigh?wc.bg:"white",border:`1.5px solid ${isHigh?wc.accent:wc.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8,cursor:"pointer"}} onClick={()=>setExpandedCode(isExpanded?null:c.code)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"monospace",fontWeight:800,fontSize:13,color:wc.name,background:wc.bg,border:`1px solid ${wc.border}`,borderRadius:5,padding:"1px 7px"}}>{c.code}</span>
                    <span style={{fontSize:12,fontWeight:700,color:wc.name}}>{WOOD[c.wood]?.bn} · {c.w}″×{c.h}″{c.isSplit&&`×${c.l}″`}</span>

            return<div style={{background:"#f0fdf4",borderRadius:9,padding:"11px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span>কাটা হয়েছে (কাঁচা):</span><span style={{fontWeight:700}}>{raw.toFixed(2)} CFT</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}><span>অপচয় হার ({wt&&WOOD[wt].bn}):</span><span style={{fontWeight:700}}>{s.wastagePercent||0}%</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:8}}><span>ব্যবহারযোগ্য CFT:</span><span style={{fontWeight:700}}>{usable.toFixed(2)} CFT</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:800,color:"#166534",borderTop:"1.5px solid #bbf7d0",paddingTop:8}}><span>প্রকৃত খরচ/CFT:</span><span>{money(real.toFixed(2))}</span></div>
            </div>
          })()}
        </div>

        {/* Buy / Sell / Current stock value summary */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>ক্রয়-বিক্রয় সারসংক্ষেপ</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div style={{background:"#f8fafc",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>ক্রয় মূল্য (মোট)</div>
              <div style={{fontSize:15,fontWeight:800,color:"#334155"}}>{money(lotTotalCost(selLot))}</div>
            </div>
            <div style={{background:"#f5f3ff",borderRadius:9,padding:"10px",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#888"}}>বিক্রিত পরিমাণ</div>
              <div style={{fontSize:15,fontWeight:800,color:"#7c3aed"}}>{money(lotSoldAmount(selLot))}</div>
              <div style={{fontSize:9,color:"#888",marginTop:1}}>{lotSoldCft(selLot).toFixed(2)} CFT বিক্রি হয়েছে</div>
            </div>
          </div>
          <div style={{background:"#f0fdf4",borderRadius:9,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:10,color:"#888"}}>বর্তমান মজুদের মূল্য/CFT (বিক্রয়ের টাকা বাদ দিয়ে)</div>
            <div style={{fontSize:16,fontWeight:800,color:"#166534"}}>{lotAvailableCft(selLot)>0?`${money(lotCurrentStockPricePerCft(selLot).toFixed(2))}/CFT`:"—"}</div>
            <div style={{fontSize:9,color:"#888",marginTop:1}}>অবশিষ্ট (অবিক্রীত ও অকাটা) মজুদ: {lotAvailableCft(selLot).toFixed(2)} CFT</div>
          </div>
        </div>

        {/* Payments */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>পেমেন্ট</div>
          {(selLot.payments||[]).map((p,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4,borderBottom:"1px dashed #eee",paddingBottom:4}}><span>{fmtDate(p.date)}</span><span style={{fontWeight:700}}>{money(p.amount)}</span></div>)}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8,alignItems:"end"}}>
            <div><div style={{fontSize:10,marginBottom:3}}>তারিখ</div><DateInput value={newPay.date} onChange={v=>setNewPay({...newPay,date:v})} accent="#065f46"/></div>
            <div><div style={{fontSize:10,marginBottom:3}}>পরিমাণ (৳)</div><input type="number" value={newPay.amount} onChange={e=>setNewPay({...newPay,amount:e.target.value})} style={{...inp,padding:"8px 9px"}}/></div>
            <button onClick={addPayment} style={{background:"#16a34a",color:"white",border:"none",borderRadius:8,padding:"9px 14px",fontSize:12,fontWeight:700}}>+ যোগ</button>
          </div>
          <div style={{marginTop:10,paddingTop:8,borderTop:"1.5px solid #eee",display:"flex",justifyContent:"space-between"}}>
            <span style={{fontWeight:700,fontSize:13}}>{lotRemaining(selLot)>0?"বাকি:":"স্ট্যাটাস:"}</span>
            <span style={{fontWeight:800,fontSize:14,color:lotRemaining(selLot)>0?RED:"#16a34a"}}>{lotRemaining(selLot)>0?money(lotRemaining(selLot)):"✅ সম্পূর্ণ পরিশোধিত"}</span>
          </div>
        </div>
      </>}
    </div>
  </div>
}

const DAY_OPTIONS=Array.from({length:22},(_,i)=>i*0.5); // 0, 0.5, ... 10.5
function WorkerAvatar({worker,size=36}){
  const c=deptColor(worker.department);
  const initial=(worker.name||"?").trim().charAt(0);
  if(worker.photoImg)return<img src={worker.photoImg} alt="" onClick={e=>{e.stopPropagation();openLightbox(worker.photoImg)}} style={{width:size,height:size,borderRadius:"50%",objectFit:"cover",border:`2px solid ${c}`,flexShrink:0,cursor:"pointer"}}/>;
  return<div style={{width:size,height:size,borderRadius:"50%",background:c+"22",border:`2px solid ${c}`,color:c,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.42,fontWeight:800,flexShrink:0}}>{initial}</div>
