              <div style={{background:"#f0fdf4",color:"#166534",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:600}}>✅ সব ঠিক আছে — এই ডিভাইসের সবকিছুই সার্ভারের সাথে মিলছে</div>
              :<div>
                {syncCheck.localOnly.length>0&&<>
                <div style={{background:"#fef2f2",color:"#991b1b",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:700,marginBottom:7}}>⚠️ {syncCheck.localOnly.length}টা অর্ডার শুধু এই ডিভাইসেই আছে, সার্ভারে নেই:</div>
                {syncCheck.localOnly.map(o=><div key={o.no} style={{background:"#fff7ed",borderRadius:7,padding:"7px 9px",marginBottom:5,fontSize:10}}>
                  <div style={{fontWeight:700}}>{o.cust.name} — {o.no}</div>
                  <div style={{color:"#888",fontSize:9,marginTop:1}}>{money(o.cust.total)} · {o.cust.date}</div>
                  <button onClick={async()=>{
                    setResending(prev=>({...prev,[o.no]:true}));
                    onUpdateOrder(o);
                    setTimeout(async()=>{const r=await onCheckServerSync();setSyncCheck(r);setResending(prev=>({...prev,[o.no]:false}))},1500);
                  }} disabled={resending[o.no]} style={{marginTop:5,background:"#7c2d12",color:"white",border:"none",borderRadius:6,padding:"6px 10px",fontSize:9,fontWeight:700}}>{resending[o.no]?"পাঠানো হচ্ছে...":"📤 আবার সার্ভারে পাঠান"}</button>
                </div>)}
                </>}
                {syncCheck.mismatched&&syncCheck.mismatched.length>0&&<>
                <div style={{background:"#fffbeb",color:"#92400e",borderRadius:7,padding:"8px 10px",fontSize:10,fontWeight:700,marginBottom:7,marginTop:syncCheck.localOnly.length>0?10:0}}>⚠️ {syncCheck.mismatched.length}টা অর্ডারের তথ্য এই ডিভাইসে পুরনো/ভিন্ন — অন্য ডিভাইসে পরিবর্তন হয়েছে কিন্তু এখানে এখনো আসেনি:</div>
                {syncCheck.mismatched.map(o=><div key={o.no} style={{background:"#fffdf5",borderRadius:7,padding:"7px 9px",marginBottom:5,fontSize:10,border:"1px solid #fde68a"}}>
                  <div style={{fontWeight:700}}>{o.cust.name} — {o.no}</div>
                  <button onClick={()=>{
                    onAcceptServerVersion(o.no,syncCheck.serverDocs&&syncCheck.serverDocs[o.no]);
                    setSyncCheck(prev=>prev&&prev.mismatched?{...prev,mismatched:prev.mismatched.filter(m=>m.no!==o.no)}:prev);
                  }} style={{marginTop:5,background:"#92400e",color:"white",border:"none",borderRadius:6,padding:"6px 10px",fontSize:9,fontWeight:700}}>🔄 সার্ভারের সঠিক তথ্য নিন</button>
                </div>)}
                </>}
              </div>}
          </div>}
        </div>

        {/* ── ভুলে চাপলে যাতে পুরো অ্যাপ অচল না হয়ে যায় — একদম নিচে, আর সাধারণ ক্লিকের বদলে
        RESET টাইপ করে নিশ্চিত করা লাগবে (resetDb-এর মতোই কড়া) ── */}
        <div style={{marginTop:14,paddingTop:14,borderTop:"1px dashed #ddd",textAlign:"center"}}>
          <button onClick={()=>{
            const typed=window.prompt("⚠️ এটি করলে এই ডিভাইসের Firebase সংযোগ মুছে যাবে — নতুন করে সঠিক Firebase কোড না বসানো পর্যন্ত অ্যাপটি আর চলবে না। ভুল করে চাপে থাকলে এখনই বাতিল করুন (Cancel)।\n\nনিশ্চিত হলে নিচে ইংরেজিতে RESET লিখুন:");
            if(!typed||typed.trim().toUpperCase()!=="RESET")return;
            onResetConfig();
          }} style={{background:"none",border:"none",color:"#aaa",fontSize:10,textDecoration:"underline",cursor:"pointer"}}>Firebase সংযোগ পরিবর্তন করুন</button>
        </div>
      </div></>}
    </div>
  </div>
}

/* ── EXPENSE PAGE ── */
function ExpensePage({expenses,onSave,onBack}){
  const today=todayStr();
  const now=new Date();
  const[form,setForm]=useState({date:today,category:"hardware",itemName:"",qty:"",unit:"cft",rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  const[viewYear,setViewYear]=useState(now.getFullYear());
  const[viewMonth,setViewMonth]=useState(now.getMonth());
  const[search,setSearch]=useState("");
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"11px 12px",fontSize:14,outline:"none"};
  const lbl=(t)=><div style={{fontSize:12,fontWeight:600,color:"#555",marginBottom:5}}>{t}</div>;

  // ── একই বা কাছাকাছি নামের পণ্যের আগের কেনাকাটার ইতিহাস — রেট বক্সের নিচে দেখানোর জন্য ──
  const similarPurchases=useMemo(()=>{
    const typed=form.itemName.trim().toLowerCase();
    if(typed.length<2)return[];
    const words=typed.split(/\s+/).filter(w=>w.length>=2);
    const matches=expenses.filter(e=>{
      const name=(e.itemName||"").trim().toLowerCase();
      if(!name)return false;
      if(name.includes(typed)||typed.includes(name))return true;
      return words.some(w=>name.includes(w));
    });
    return matches.sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);
  },[expenses,form.itemName]);

  // Supplier ranking by total spend in last 1 year
  const supplierList=useMemo(()=>{
    const oneYearAgo=new Date();oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const map={};
    expenses.forEach(e=>{
      if(!e.supplier)return;
      const key=e.supplier.trim();
      if(!map[key])map[key]={name:key,phone:e.supplierPhone||"",total:0,recentDate:e.date};
      if(new Date(e.date)>=oneYearAgo)map[key].total+=(parseFloat(e.total)||0);
      if(new Date(e.date)>new Date(map[key].recentDate)){map[key].recentDate=e.date;if(e.supplierPhone)map[key].phone=e.supplierPhone;}
    });
    return Object.values(map).sort((a,b)=>b.total-a.total);
  },[expenses]);

  const onSupplierNameChange=(val)=>{
    const match=supplierList.find(s=>s.name.toLowerCase()===val.trim().toLowerCase());
    setForm({...form,supplier:val,supplierPhone:match?match.phone:form.supplierPhone});
  };

  const total=(parseFloat(form.qty)||0)*(parseFloat(form.rate)||0);

  const submit=()=>{
    if(!form.itemName||!form.qty||!form.rate)return;
    onSave({...form,total,at:new Date().toISOString()});
    setForm({date:today,category:form.category,itemName:"",qty:"",unit:form.unit,rate:"",supplier:"",supplierPhone:"",payMethod:"নগদ",notes:""});
  };

  // ── ডিফল্টে শুধু নির্বাচিত মাসের খরচ (তালিকা যাতে দিনে দিনে বিশাল না হয়ে যায়) ──
  // সার্চ করলে সব সময়ের ভেতর থেকে খোঁজা হয়
  const monthExpenses=useMemo(()=>expenses.filter(e=>{
    const d=new Date(e.date);
    return d.getFullYear()===viewYear&&d.getMonth()===viewMonth;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date)),[expenses,viewYear,viewMonth]);

  const searchResults=useMemo(()=>{
    const q=search.trim().toLowerCase();
    if(q.length<2)return null;
    return expenses.filter(e=>(e.itemName||"").toLowerCase().includes(q)||(e.supplier||"").toLowerCase().includes(q))
      .sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,40);
  },[expenses,search]);

  const displayList=searchResults!==null?searchResults:monthExpenses;
  const monthTotal=monthExpenses.reduce((s,e)=>s+(parseFloat(e.total)||0),0);
  const prevMonth=()=>{if(viewMonth===0){setViewYear(viewYear-1);setViewMonth(11)}else setViewMonth(viewMonth-1)};
  const nextMonth=()=>{if(viewMonth===11){setViewYear(viewYear+1);setViewMonth(0)}else setViewMonth(viewMonth+1)};

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#0f766e",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>খরচ এন্ট্রি</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:560,margin:"0 auto"}}>
      <div style={{background:"white",borderRadius:14,padding:"18px",boxShadow:"0 2px 10px rgba(0,0,0,.07)",marginBottom:18}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("তারিখ")}<DateInput value={form.date} onChange={v=>setForm({...form,date:v})} accent="#0f766e"/></div>
          <div>{lbl("ক্যাটাগরি")}
            <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})} style={inp}>
              {EXP_CATS.map(c=><option key={c.id} value={c.id}>{c.bn}</option>)}
            </select>
          </div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পণ্য/আইটেমের নাম *")}<input value={form.itemName} onChange={e=>setForm({...form,itemName:e.target.value})} placeholder="যেমন: কাঠের স্ক্রু, লেকার স্প্রে" style={inp}/></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:8}}>
          <div>{lbl("পরিমাণ *")}<input type="number" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value})} placeholder="0" style={inp}/></div>
          <div>{lbl("একক")}<select value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} style={inp}>{UNITS.map(u=><option key={u} value={u}>{u}</option>)}</select></div>
          <div>{lbl("রেট (৳) *")}<input type="number" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} placeholder="0" style={inp}/></div>
        </div>
        {similarPurchases.length>0&&<div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:9,padding:"9px 12px",marginBottom:14}}>
          <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:6}}>📌 এই বা কাছাকাছি নামের আগের কেনাকাটা — ট্যাপ করে বসিয়ে দিন (পরিমাণ ছাড়া)</div>
          {similarPurchases.map((p,i)=><div key={i} onClick={()=>setForm(f=>({...f,itemName:p.itemName,category:p.category||f.category,unit:p.unit||f.unit,rate:p.rate,supplier:p.supplier||"",supplierPhone:p.supplierPhone||"",payMethod:p.payMethod||f.payMethod}))} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#78350f",padding:"6px 4px",borderTop:i>0?"1px dashed #fde68a":"none",cursor:"pointer",borderRadius:6}}>
            <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"55%"}}>{p.itemName} · {fmtDate(p.date)}</span>
            <strong>{p.qty} {p.unit} × {money(p.rate)}</strong>
          </div>)}
        </div>}
        <div style={{background:"#f0fdf4",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13,color:"#555"}}>মোট মূল্য:</span>
          <span style={{fontSize:20,fontWeight:800,color:"#166534"}}>{money(total)}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
          <div>{lbl("সাপ্লায়ার/বিক্রেতা")}
            <input list="supplier-list" value={form.supplier} onChange={e=>onSupplierNameChange(e.target.value)} placeholder="নাম লিখুন বা তালিকা থেকে বেছে নিন" style={inp}/>
            <datalist id="supplier-list">{supplierList.map(s=><option key={s.name} value={s.name}/>)}</datalist>
          </div>
          <div>{lbl("বিক্রেতার ফোন")}<input value={form.supplierPhone} onChange={e=>setForm({...form,supplierPhone:e.target.value})} placeholder="01XXXXXXXXX" style={inp}/></div>
        </div>
        <div style={{marginBottom:14}}>{lbl("পেমেন্ট মাধ্যম")}<select value={form.payMethod} onChange={e=>setForm({...form,payMethod:e.target.value})} style={inp}><option>নগদ</option><option>বাকি</option><option>ব্যাংক</option></select></div>
        <div style={{marginBottom:16}}>{lbl("নোট")}<textarea rows={2} value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} style={{...inp,resize:"vertical"}}/></div>
        <button onClick={submit} style={{width:"100%",background:"#0f766e",color:"white",border:"none",borderRadius:11,padding:"15px",fontSize:15,fontWeight:700}}>খরচ সংরক্ষণ করুন</button>
      </div>

      <div style={{marginBottom:10}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 পণ্য বা সাপ্লায়ারের নাম দিয়ে যেকোনো সময়ের খরচ খুঁজুন..." style={{...inp,background:"white"}}/>
      </div>

      {searchResults===null&&<div className="no-print" style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"white",borderRadius:11,padding:"9px 12px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
        <button onClick={prevMonth} style={{background:"#f0fdfa",border:"none",borderRadius:7,padding:"7px 11px",color:"#0f766e",fontWeight:700}}>◀</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:13,fontWeight:700}}>{monthName(viewMonth)} {viewYear}</div>
          <div style={{fontSize:10,color:"#888"}}>মোট: {money(monthTotal)} ({monthExpenses.length}টি এন্ট্রি)</div>
        </div>
        <button onClick={nextMonth} style={{background:"#f0fdfa",border:"none",borderRadius:7,padding:"7px 11px",color:"#0f766e",fontWeight:700}}>▶</button>
      </div>}

      <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>{searchResults!==null?`সার্চ ফলাফল (${searchResults.length})`:"এই মাসের খরচ"}</div>
      {displayList.length===0?<div style={{textAlign:"center",color:"#aaa",padding:20,fontSize:13}}>{searchResults!==null?"কিছু পাওয়া যায়নি":"এই মাসে কোনো খরচ এন্ট্রি নেই"}</div>:
      displayList.map((e,i)=>{
        const cat=EXP_CATS.find(c=>c.id===e.category);
        return<div key={i} style={{background:"white",borderRadius:10,padding:"11px 13px",marginBottom:8,boxShadow:"0 1px 4px rgba(0,0,0,.06)",display:"flex",justifyContent:"space-between"}}>
          <div><div style={{fontWeight:700,fontSize:13}}>{e.itemName}</div><div style={{fontSize:11,color:"#888",marginTop:1}}>{cat?.bn} | {e.qty} {e.unit} × {money(e.rate)} | {e.supplier||"—"}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontWeight:800,color:"#0f766e"}}>{money(e.total)}</div><div style={{fontSize:10,color:"#aaa"}}>{fmtDate(e.date)}</div></div>
        </div>
      })}
    </div>
  </div>
}

/* ── WOOD STOCK PAGE ── */
function WoodStockPage({woodLots,saveWoodLots,addLotPayment,woodSettings,saveWoodSettings,laborSettings,saveLaborSettings,rackSplits,addRackSplit,rackBands,addRackBand,removeRackBand,payrollWeeks,workers,orders,expenses,onBack,view,lotId,onOpenList,onOpenDetail,onOpenNew,onOpenRates,onOpenUsage,highlightNo}){
  const today=todayStr();
  const setView=(v)=>{if(v==="list")onOpenList();else if(v==="new")onOpenNew();else if(v==="rates")onOpenRates();else if(v==="usage")onOpenUsage()}; // পুরনো কল-সাইটের সাথে সামঞ্জস্যের জন্য
  const setSelLotId=(id)=>onOpenDetail(id);
  const selLotId=lotId;
  const[newLot,setNewLot]=useState({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  const[newLog,setNewLog]=useState({lengthFt:"",diameterIn:""});
  const[newPay,setNewPay]=useState({date:today,amount:""});
  const[sellingLogId,setSellingLogId]=useState(null);
  const[sellPrice,setSellPrice]=useState("");
  const[newMilling,setNewMilling]=useState({date:today,cft:"",billAmount:"",note:""});
  const[rateDraft,setRateDraft]=useState({});
  const[bandDraft,setBandDraft]=useState({});
  const[usagePeriod,setUsagePeriod]=useState("6m");
  const[usageTrendMode,setUsageTrendMode]=useState("prev");
  const[usageWoodFilter,setUsageWoodFilter]=useState("all");
  const[expandedCode,setExpandedCode]=useState(null);
  const[totalRacksInput,setTotalRacksInput]=useState("");
  const[rackCapacityInput,setRackCapacityInput]=useState("30");
  const[editingBandFor,setEditingBandFor]=useState(null);
  const[laborRateDraft,setLaborRateDraft]=useState({from:"",rate:""});
  const inp={width:"100%",border:"1.5px solid #e0e0e0",borderRadius:9,padding:"10px 11px",fontSize:13,outline:"none"};
  const lbl=(t)=><div style={{fontSize:11,fontWeight:600,color:"#555",marginBottom:4}}>{t}</div>;

  const selLot=woodLots.find(l=>l.id===selLotId);
  const wSettings=(woodType)=>(woodSettings&&woodSettings[woodType])||{wastagePercent:0,finalAvgRate:0};


  const createLot=()=>{
    if(!newLot.supplier)return;
    const lot={id:"lot_"+Date.now(),...newLot,logs:[],payments:[],millingEntries:[],transportCost:0,otherCost:0};
    saveWoodLots([lot,...woodLots]);
    onOpenDetail(lot.id);
    setNewLot({woodType:"S",supplier:"",supplierPhone:"",supplierAddress:"",date:today,ratePerCft:""});
  };

  const updateLot=(updated)=>{
    saveWoodLots(woodLots.map(l=>l.id===updated.id?updated:l));
  };

  const addLog=()=>{
    const lengthFt=parseFloat(newLog.lengthFt),diameterIn=parseFloat(newLog.diameterIn);
    if(!lengthFt||!diameterIn)return;
    const cftVal=cftLog(lengthFt,diameterIn);
    const log={id:"log_"+Date.now(),lengthFt,diameterIn,cft:cftVal,cut:false,cutDate:"",sold:false,soldDate:"",soldPrice:0};
    updateLot({...selLot,logs:[...selLot.logs,log]});
    setNewLog({lengthFt:"",diameterIn:""});
  };
  const removeLog=(logId,logLabel)=>{
    if(!window.confirm(`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি একেবারে মুছে ফেলতে চান? এটি ফিরিয়ে আনা যাবে না।`))return;
    updateLot({...selLot,logs:selLot.logs.filter(l=>l.id!==logId)});
  };
  const toggleCut=(logId,logLabel,currentlyCut)=>{
    const msg=currentlyCut?`"${logLabel}" এই গুড়ির কাটা চিহ্ন বাতিল করতে চান?`:`আপনি কি নিশ্চিত "${logLabel}" এই গুড়িটি কাটা হয়েছে বলে চিহ্নিত করতে চান?`;
    if(!window.confirm(msg))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,cut:!l.cut,cutDate:!l.cut?today:""}:l);
    updateLot({...selLot,logs});
  };
  const startSell=(logId)=>{setSellingLogId(logId);setSellPrice("")};
  const confirmSell=(logId)=>{
    const price=parseFloat(sellPrice);
    if(!price||price<=0)return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:true,soldDate:today,soldPrice:price}:l);
    updateLot({...selLot,logs});
    setSellingLogId(null);setSellPrice("");
  };
  const unsellLog=(logId,logLabel)=>{
    if(!window.confirm(`"${logLabel}" এই গুড়ির বিক্রি বাতিল করতে চান?`))return;
    const logs=selLot.logs.map(l=>l.id===logId?{...l,sold:false,soldDate:"",soldPrice:0}:l);
    updateLot({...selLot,logs});
  };
  const addPayment=()=>{
    if(!newPay.amount)return;
    addLotPayment(selLot.id,newPay);
    setNewPay({date:today,amount:""});
  };
  const deleteLot=(lotId)=>{
    if(window.confirm("এই লটটি মুছে ফেলতে চান?")){
      saveWoodLots(woodLots.filter(l=>l.id!==lotId));
      onOpenList();
    }
  };

  const lotTotalCft=(lot)=>lot.logs.reduce((s,l)=>s+l.cft,0);
  const lotTotalCost=(lot)=>lotTotalCft(lot)*(parseFloat(lot.ratePerCft)||0);
  const lotTotalPaid=(lot)=>(lot.payments||[]).reduce((s,p)=>s+(parseFloat(p.amount)||0),0);
  const lotRemaining=(lot)=>lotTotalCost(lot)-lotTotalPaid(lot);
  // ── আমার নিজের দেনা: বাকিতে কেনা খরচ + কাঠের লটে সাপ্লায়ারকে বাকি — সাপ্লায়ার অনুযায়ী
  // (আগে হোম পেজে ছিল, এখন কাঠের স্টক পেজেই — যেহেতু বেশিরভাগ দেনাই কাঠ-সংক্রান্ত) ──
  const payablesInfo=useMemo(()=>{
    const bySupplier={};
    (expenses||[]).filter(e=>e.payMethod==="বাকি").forEach(e=>{
      const sup=(e.supplier||"").trim()||"অজানা বিক্রেতা";
      if(!bySupplier[sup])bySupplier[sup]={name:sup,phone:e.supplierPhone||"",amount:0,items:0,kind:"খরচ"};
      bySupplier[sup].amount+=parseFloat(e.total)||0;
      bySupplier[sup].items+=1;
      if(e.supplierPhone&&!bySupplier[sup].phone)bySupplier[sup].phone=e.supplierPhone;
    });
    (woodLots||[]).forEach(lot=>{
      const rem=lotRemaining(lot);
      if(rem<=0)return;
      const sup=(lot.supplier||"").trim()||"অজানা কাঠ সাপ্লায়ার";
      if(!bySupplier[sup])bySupplier[sup]={name:sup,phone:lot.supplierPhone||"",amount:0,items:0,kind:"কাঠ"};
      else if(bySupplier[sup].kind==="খরচ")bySupplier[sup].kind="খরচ + কাঠ";
      bySupplier[sup].amount+=rem;
      bySupplier[sup].items+=1;
      if(lot.supplierPhone&&!bySupplier[sup].phone)bySupplier[sup].phone=lot.supplierPhone;
    });
    const list=Object.values(bySupplier).sort((a,b)=>b.amount-a.amount);
    const totalReceivable=(orders||[]).filter(o=>!o.cancelled).reduce((s,o)=>{
      const paid=(o.payments||[]).reduce((ps,p)=>ps+(parseFloat(p.amount)||0),0);
      return s+Math.max(0,(parseFloat(o.cust.total)||0)-paid);
    },0);
    return{list,total:list.reduce((s,p)=>s+p.amount,0),totalReceivable};
  },[expenses,woodLots,orders]);
  const lotSoldCft=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+l.cft,0);
  const lotSoldAmount=(lot)=>lot.logs.filter(l=>l.sold).reduce((s,l)=>s+(parseFloat(l.soldPrice)||0),0);
  const lotCutCft=(lot)=>lot.logs.filter(l=>l.cut&&!l.sold).reduce((s,l)=>s+l.cft,0);
  const lotAvailableCft=(lot)=>lot.logs.filter(l=>!l.sold&&!l.cut).reduce((s,l)=>s+l.cft,0);
  const lotCurrentStockPricePerCft=(lot)=>{
    const availCft=lotAvailableCft(lot);
    if(availCft<=0)return 0;
    const cutCost=lotCutCft(lot)*(parseFloat(lot.ratePerCft)||0);
    const adjustedCost=lotTotalCost(lot)-lotSoldAmount(lot)-cutCost;
    return adjustedCost/availCft;
  };

  // ── কাটাই/মিলিং সংক্রান্ত হিসাব ──
  const lotMillingTotal=(lot)=>(lot.millingEntries||[]).reduce((s,m)=>s+(parseFloat(m.billAmount)||0),0);
  const lotUsableCft=(lot)=>{
    const raw=lotCutCft(lot);
    const wastage=wSettings(lot.woodType).wastagePercent||0;
    return raw*(1-wastage/100);
  };
  const lotRealCostPerCft=(lot)=>{
    const raw=lotCutCft(lot);
    const usable=lotUsableCft(lot);
    if(raw<=0||usable<=0)return 0;
    const totalLotCft=lotTotalCft(lot);
    const proportionalPurchase=totalLotCft>0?(raw/totalLotCft)*lotTotalCost(lot):0;
    const extra=lotMillingTotal(lot)+(parseFloat(lot.transportCost)||0)+(parseFloat(lot.otherCost)||0);
    return(proportionalPurchase+extra)/usable;
  };
  const cftCutOnDate=(lot,date)=>lot.logs.filter(l=>l.cut&&!l.sold&&l.cutDate===date).reduce((s,l)=>s+l.cft,0);
  const addMillingEntry=()=>{
    const bill=parseFloat(newMilling.billAmount);
    if(!bill||bill<=0)return;
    const entry={id:"mill_"+Date.now(),date:newMilling.date,cft:parseFloat(newMilling.cft)||0,billAmount:bill,note:newMilling.note};
    updateLot({...selLot,millingEntries:[...(selLot.millingEntries||[]),entry]});
    setNewMilling({date:today,cft:"",billAmount:"",note:""});
  };
  const removeMillingEntry=(entryId)=>{
    updateLot({...selLot,millingEntries:(selLot.millingEntries||[]).filter(m=>m.id!==entryId)});
  };

  // ── কাঠের ধরন অনুযায়ী প্রস্তাবিত গড় দাম (সব লট মিলিয়ে ওয়েটেড এভারেজ) ──
  const suggestedRate=(woodType)=>{
    const relevant=woodLots.filter(l=>l.woodType===woodType&&lotUsableCft(l)>0);
    const totalUsable=relevant.reduce((s,l)=>s+lotUsableCft(l),0);
    if(totalUsable<=0)return 0;
    const weightedSum=relevant.reduce((s,l)=>s+lotRealCostPerCft(l)*lotUsableCft(l),0);
    return weightedSum/totalUsable;
  };

  return<div style={{minHeight:"100vh",background:"#f8f8f8"}}>
    <div style={{background:"#065f46",color:"white",padding:"13px 16px",display:"flex",alignItems:"center",gap:11}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,padding:"7px 13px",fontSize:13}}>←</button>
      <span style={{fontWeight:700,fontSize:16}}>{view==="list"?"কাঠের স্টক":view==="new"?"নতুন লট":view==="rates"?"গড় দাম নির্ধারণ":view==="usage"?"র‍্যাক অনুযায়ী ব্যবহার":selLot?.supplier}</span>
    </div>
    <div style={{padding:"18px 16px",maxWidth:600,margin:"0 auto"}}>

      {view==="list"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <button onClick={()=>setView("new")} style={{background:"#065f46",color:"white",border:"none",borderRadius:12,padding:"15px 8px",fontSize:13,fontWeight:700}}>+ নতুন লট কিনুন</button>
          <button onClick={()=>setView("rates")} style={{background:"white",color:"#065f46",border:"2px solid #065f46",borderRadius:12,padding:"13px 8px",fontSize:12,fontWeight:700}}>🧮 কাঠের গড় দাম নির্ধারণ</button>
        </div>
        <div style={{marginBottom:16}}>
          <button onClick={onOpenUsage} style={{width:"100%",background:"white",color:"#7c2d12",border:"2px solid #7c2d12",borderRadius:12,padding:"13px 8px",fontSize:12,fontWeight:700}}>📊 র‍্যাক অনুযায়ী ব্যবহার</button>
        </div>
        {payablesInfo.list.length>0&&<div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:10,padding:"12px 14px",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
            <span style={{fontSize:12,fontWeight:700,color:"#991b1b"}}>🧾 আমার নিজের দেনা</span>
            <span style={{fontSize:15,fontWeight:800,color:RED}}>{money(payablesInfo.total)}</span>
          </div>
          <div style={{fontSize:9,color:"#a35",marginBottom:8}}>বাকিতে কেনা হার্ডওয়্যার/বার্নিশ + কাঠের লটে সাপ্লায়ারকে বাকি — সব একসাথে।</div>
          {payablesInfo.list.slice(0,8).map(p=><div key={p.name} style={{background:"white",borderRadius:8,padding:"7px 10px",marginBottom:5,border:"1px solid #fee2e2"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                <div style={{fontSize:9,color:"#999",marginTop:1}}>{p.kind} · {p.items}টি এন্ট্রি</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                <div style={{fontSize:12,fontWeight:800,color:RED}}>{money(p.amount)}</div>
                {p.phone&&<a href={`tel:${p.phone}`} style={{fontSize:9,color:"#1d4ed8",textDecoration:"none"}}>📱 {p.phone}</a>}
              </div>
            </div>
          </div>)}
          {payablesInfo.list.length>8&&<div style={{fontSize:9,color:"#a35",textAlign:"center"}}>...ও আরও {payablesInfo.list.length-8}টি</div>}
          {payablesInfo.totalReceivable>0&&<div style={{marginTop:7,paddingTop:7,borderTop:"1px dashed #fecaca",fontSize:10,color:"#555"}}>
            গ্রাহকের কাছে পাওনা <strong style={{color:"#166534"}}>{money(payablesInfo.totalReceivable)}</strong> − নিজের দেনা <strong style={{color:RED}}>{money(payablesInfo.total)}</strong> = <strong style={{color:payablesInfo.totalReceivable-payablesInfo.total>=0?"#166534":RED}}>{money(payablesInfo.totalReceivable-payablesInfo.total)}</strong> নিট
          </div>}
        </div>}
        {woodLots.length===0?<div style={{textAlign:"center",color:"#aaa",padding:30,fontSize:13}}>এখনো কোনো লট যোগ করা হয়নি</div>:
        woodLots.map(lot=>{
          const tCft=lotTotalCft(lot),tCost=lotTotalCost(lot),paid=lotTotalPaid(lot),rem=lotRemaining(lot);
          const uncut=lot.logs.filter(l=>!l.cut).length;
          const isHighlighted=highlightNo==="lot:"+lot.id;
          return<div key={lot.id} onClick={()=>onOpenDetail(lot.id)} style={{background:isHighlighted?"#e0f2fe":"white",borderRadius:11,padding:"13px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.08)",borderLeft:`4px solid ${isHighlighted?"#0ea5e9":"#065f46"}`,cursor:"pointer",transition:"background .4s"}}>

              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:700,color:"#065f46"}}>{money(tCost)}</div>
                <div style={{fontSize:10,color:rem>0?RED:"#16a34a",fontWeight:600}}>{rem>0?`বাকি ${money(rem)}`:"✅ পরিশোধিত"}</div>
              </div>
            </div>
          </div>
        })}
      </>}

      {view==="rates"&&<div>
        {(()=>{
          // ── প্রস্তাবিত শ্রম হার: সর্বমোট পে-রোল ব্যয় ÷ সর্বমোট ডেলিভারিকৃত CFT ──
          let totalPayrollAllTime=0;
          Object.values(payrollWeeks||{}).forEach(wd=>{
            Object.entries(wd.attendance||{}).forEach(([wid,d])=>{
              const w=(workers||[]).find(w=>w.id===wid);
              if(w)totalPayrollAllTime+=(parseFloat(d)||0)*(parseFloat(w.dailyRate)||0);
            });
          });
          const deliveredCftAllTime=(orders||[]).filter(o=>!o.cancelled&&o.delivered).reduce((s,o)=>s+orderTotalCft(o),0);
          const suggestedLabour=deliveredCftAllTime>0?totalPayrollAllTime/deliveredCftAllTime:0;
          const ls=laborSettings||{};
          return<div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)",border:"1.5px solid #ddd6fe"}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:6,color:"#6d28d9"}}>👷 শ্রম খরচ/CFT</div>
            <div style={{fontSize:11,color:"#888",lineHeight:1.6,marginBottom:10}}>কাঠের মতোই — প্রতিটা ফার্নিচারের CFT অনুযায়ী শ্রম খরচ হিসাব হবে। কর্মী কোন অর্ডারে কতদিন দিলো আলাদা করে লিখতে হবে না; আপনার মোট পে-রোল ও মোট ডেলিভারিকৃত কাজ থেকে সিস্টেম একটা হার প্রস্তাব করবে।</div>
            <div style={{marginBottom:10}}>{lbl("চূড়ান্ত শ্রম হার (৳/CFT)")}<input type="number" value={ls.ratePerCft||""} onChange={e=>saveLaborSettings({...ls,ratePerCft:parseFloat(e.target.value)||0})} placeholder="0" style={{...inp,fontWeight:700,color:"#6d28d9"}}/></div>
            <div style={{background:suggestedLabour>0?"#faf5ff":"#f8fafc",borderRadius:8,padding:"8px 11px",fontSize:11,color:suggestedLabour>0?"#6d28d9":"#999",marginBottom:10}}>
              {suggestedLabour>0?<>📊 প্রস্তাবিত হার (সর্বমোট পে-রোল ÷ সর্বমোট ডেলিভারিকৃত CFT): <strong>{money(suggestedLabour.toFixed(2))}/CFT</strong></>:"এখনো কোনো অর্ডার ডেলিভারি হয়নি — প্রস্তাব দেখানো যাচ্ছে না"}
            </div>
            <div style={{background:"#fffbeb",borderRadius:8,padding:"9px 11px",border:"1px solid #fde68a"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:3}}>📅 তারিখভিত্তিক হারের ইতিহাস</div>
              <div style={{fontSize:9,color:"#a16207",marginBottom:8,lineHeight:1.5}}>মজুরি সময়ের সাথে বাড়ে — তাই পুরনো অর্ডারে সেই সময়ের হার ব্যবহার হবে, আজকের হার নয়।</div>
              {(ls.rateHistory||[]).sort((a,b)=>(a.from||"").localeCompare(b.from||"")).map((h,hi)=><div key={hi} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:10}}>
                <span style={{flex:1,color:"#555"}}>{h.from?fmtDate(h.from):"—"} থেকে</span>
                <strong style={{color:"#92400e"}}>{money(h.rate)}/CFT</strong>
                <button onClick={()=>{const nh=(ls.rateHistory||[]).filter((_,j)=>j!==hi);saveLaborSettings({...ls,rateHistory:nh})}} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",color:RED,fontSize:9}}>✕</button>
              </div>)}
              <div style={{display:"flex",gap:5,marginTop:7,alignItems:"flex-end"}}>
                <div style={{flex:1.3}}><div style={{fontSize:8,color:"#a16207",marginBottom:2}}>কোন তারিখ থেকে</div><DateInput value={laborRateDraft.from||""} onChange={v=>setLaborRateDraft({...laborRateDraft,from:v})} accent="#92400e"/></div>
                <div style={{flex:1}}><div style={{fontSize:8,color:"#a16207",marginBottom:2}}>হার/CFT</div><input type="number" value={laborRateDraft.rate||""} onChange={e=>setLaborRateDraft({...laborRateDraft,rate:e.target.value})} placeholder="0" style={{width:"100%",border:"1.5px solid #fde68a",borderRadius:8,padding:"9px 8px",fontSize:12,fontWeight:700,color:"#92400e",boxSizing:"border-box"}}/></div>
                <button onClick={()=>{
                  if(!laborRateDraft.from||!parseFloat(laborRateDraft.rate))return;
                  const nh=[...(ls.rateHistory||[]),{from:laborRateDraft.from,rate:parseFloat(laborRateDraft.rate)}];
                  saveLaborSettings({...ls,rateHistory:nh});
                  setLaborRateDraft({from:"",rate:""});
                }} style={{background:"#92400e",color:"white",border:"none",borderRadius:8,padding:"10px 12px",fontSize:11,fontWeight:700,flexShrink:0}}>+ যোগ</button>
              </div>
            </div>
          </div>
        })()}
        <div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:6,color:"#065f46"}}>কাঠভেদে অপচয় হার ও চূড়ান্ত গড় দাম</div>
          <div style={{fontSize:11,color:"#888",lineHeight:1.6}}>গুড়ি কেনার পর স'মিলে কেটে ব্যবহারযোগ্য কাঠ কতটা কমে যায় (%) বসান। সিস্টেম আপনার লটগুলোর প্রকৃত খরচ থেকে একটা প্রস্তাবিত গড় দাম দেখাবে — সেটা দেখে চূড়ান্ত দামটা বসিয়ে দিন। এই চূড়ান্ত দামই সব অর্ডারের কাঠের খরচ হিসাবে ব্যবহার হবে।</div>
        </div>
        {Object.entries(WOOD).map(([wKey,wInfo])=>{
          const s=wSettings(wKey);
          const suggested=suggestedRate(wKey);
          return<div key={wKey} style={{background:"white",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
            <div style={{fontWeight:800,fontSize:14,marginBottom:10,color:"#111"}}>{wInfo.bn} <span style={{fontSize:11,color:"#999",fontWeight:400}}>({wInfo.en})</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              <div>{lbl("অপচয় হার (%)")}<input type="number" min="0" max="90" value={s.wastagePercent||""} onChange={e=>saveWoodSettings({...woodSettings,[wKey]:{...s,wastagePercent:parseFloat(e.target.value)||0}})} placeholder="0" style={inp}/></div>
              <div>{lbl("চূড়ান্ত গড় দাম (৳/CFT)")}<input type="number" value={s.finalAvgRate||""} onChange={e=>saveWoodSettings({...woodSettings,[wKey]:{...s,finalAvgRate:parseFloat(e.target.value)||0}})} placeholder="0" style={{...inp,fontWeight:700,color:"#065f46"}}/></div>
            </div>
            <div style={{background:suggested>0?"#f0fdf4":"#f8fafc",borderRadius:8,padding:"8px 11px",fontSize:11,color:suggested>0?"#166534":"#999",marginBottom:10}}>
              {suggested>0?<>📊 প্রস্তাবিত গড় দাম (আপনার কাটা লটগুলো থেকে): <strong>{money(suggested.toFixed(2))}/CFT</strong></>:"এখনো কোনো লটে যথেষ্ট কাটা কাঠ নেই — প্রস্তাব দেখানো যাচ্ছে না"}
            </div>
            <div style={{background:"#fffbeb",borderRadius:8,padding:"9px 11px",border:"1px solid #fde68a"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#92400e",marginBottom:3}}>📅 তারিখভিত্তিক দামের ইতিহাস</div>
              <div style={{fontSize:9,color:"#a16207",marginBottom:8,lineHeight:1.5}}>পুরনো অর্ডারে সেই সময়ের দাম ব্যবহার হবে, আজকের দাম নয় — তাই পুরনো অর্ডারে ভুয়া ক্ষতি দেখাবে না।</div>
              {(s.rateHistory||[]).sort((a,b)=>(a.from||"").localeCompare(b.from||"")).map((h,hi)=><div key={hi} style={{display:"flex",alignItems:"center",gap:6,marginBottom:5,fontSize:10}}>
                <span style={{flex:1,color:"#555"}}>{h.from?fmtDate(h.from):"—"} থেকে</span>
                <strong style={{color:"#92400e"}}>{money(h.rate)}/CFT</strong>
                <button onClick={()=>{const nh=(s.rateHistory||[]).filter((_,j)=>j!==hi);saveWoodSettings({...woodSettings,[wKey]:{...s,rateHistory:nh}})}} style={{background:"#fee2e2",border:"none",borderRadius:5,padding:"2px 6px",color:RED,fontSize:9}}>✕</button>

      {view==="usage"&&(()=>{

              {racksSaved>0&&<div style={{color:"#166534",fontWeight:700,marginTop:3}}>✅ হাইট ব্যান্ড ছাড়া লাগত {unbandedRackTotal}টি — {racksSaved}টি সাশ্রয় হয়েছে</div>}

          {!cmpHasAnyData&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:9,padding:"9px 12px",marginBottom:12,fontSize:11,color:"#1d4ed8",textAlign:"center"}}>ℹ️ তুলনার আগের সময়ে পর্যাপ্ত তথ্য নেই — কিছুদিন পর প্রবণতা (↑/↓) দেখা যাবে।</div>}

          <div style={{background:"white",borderRadius:12,padding:14,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>

          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>র‍্যাক-কোড অনুযায়ী বিস্তারিত ({codeList.length}টি)</div>
          {codeList.length===0?<div style={{textAlign:"center",color:"#aaa",fontSize:12,padding:16,background:"white",borderRadius:10}}>এই সময়ে ও ফিল্টারে কোনো ব্যবহার পাওয়া যায়নি</div>:
          codeList.map(c=>{

            const BAR_COLORS=["#ea7317","#0d9488","#eab308","#7c3aed","#94a3b8"];

            // কাছাকাছি (একই কাঠ ও একই W, ৫″ এর মধ্যে) অন্য কোডগুলো
            const nearby=codeList.filter(o=>o.code!==c.code&&o.wood===c.wood&&parseFloat(o.w)===parseFloat(c.w)&&Math.abs(o.h-c.h)<=5).sort((a,b)=>a.h-b.h);
            const isEditingBand=editingBandFor===c.code;
            const bd=bandDraft[c.code]||{};
            // টাইপ করার সাথে সাথে যাচাই: সংঘর্ষ ও কী কী মিশবে
            let bandConflict=null,bandPreview=null;
            if(bd.from!==undefined&&bd.from!==""&&bd.to!==undefined&&bd.to!==""){
              const f=parseFloat(bd.from),t=parseFloat(bd.to);
              if(f>t)bandConflict="সর্বনিম্ন মাপ সর্বোচ্চের চেয়ে বড় হতে পারে না";
              else if(c.h<f||c.h>t)bandConflict=`এই কার্ডের নিজের হাইট (${c.h}″) রেঞ্জের বাইরে — রেঞ্জে ${c.h}″ থাকতে হবে`;
              else{
                const clash=(rackBands||[]).find(b=>b.wood===c.wood&&parseFloat(b.w)===parseFloat(c.w)&&parseFloat(b.rep)!==parseFloat(c.h)&&!(t<parseFloat(b.from)||f>parseFloat(b.to)));
                if(clash)bandConflict=`সংঘর্ষ: ${clash.from}″–${clash.to}″ ব্যান্ড (কোড ${rackCode(c.wood,c.w,clash.rep)}) এর সাথে মিলে যাচ্ছে`;
                else{
                  const willMerge=codeList.filter(o=>o.wood===c.wood&&parseFloat(o.w)===parseFloat(c.w)&&o.h>=f&&o.h<=t);
                  const mergedCft=willMerge.reduce((s,o)=>s+o.cft,0);
                  bandPreview={list:willMerge,cft:mergedCft,racks:Math.max(1,Math.ceil(mergedCft/rackCapacity))};
                }
              }
            }
            const saveBand=(e)=>{
              e.stopPropagation();
              if(bandConflict||!bandPreview)return;
              if(myBand)removeRackBand(myBand); // এডিট হলে আগেরটা সরিয়ে নতুন রেঞ্জ বসবে
              addRackBand({wood:c.wood,w:parseFloat(c.w),from:parseFloat(bd.from),to:parseFloat(bd.to),rep:parseFloat(c.h)});
              setBandDraft({...bandDraft,[c.code]:{from:"",to:""}});
              setEditingBandFor(null);
            };
            return<div key={c.code} id={`rack-card-${c.code}`} style={{background:isHigh?wc.bg:"white",border:`1.5px solid ${isHigh?wc.accent:wc.border}`,borderRadius:10,padding:"10px 12px",marginBottom:8,cursor:"pointer"}} onClick={()=>setExpandedCode(isExpanded?null:c.code)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"monospace",fontWeight:800,fontSize:13,color:wc.name,background:wc.bg,border:`1px solid ${wc.border}`,borderRadius:5,padding:"1px 7px"}}>{c.code}</span>
                    <span style={{fontSize:12,fontWeight:700,color:wc.name}}>{WOOD[c.wood]?.bn} · {c.w}″×{c.h}″{c.isSplit&&`×${c.l}″`}</span>
                    {myBand&&<span style={{fontSize:9,background:"#1d4ed8",color:"white",borderRadius:8,padding:"1px 6px",fontWeight:700}}>{myBand.from}″–{myBand.to}″ একসাথে</span>}
                    {isHigh&&<span style={{fontSize:9,background:wc.accent,color:"white",borderRadius:8,padding:"1px 6px",fontWeight:700}}>বেশি ব্যবহার</span>}
                    {c.isSplit&&<span style={{fontSize:9,background:"#0d9488",color:"white",borderRadius:8,padding:"1px 6px",fontWeight:700}}>বিভক্ত</span>}
                  </div>
                  <div style={{fontSize:10,color:"#999",marginTop:2}}>{c.name} · {c.pieces} পিস · মাসিক গড় {avgMonth.toFixed(2)} CFT</div>
                  {suggested!==undefined&&<div style={{fontSize:10,color:wc.accent,fontWeight:700,marginTop:2}}>🗄️ প্রস্তাবিত র‍্যাক: {suggested}টি</div>}
                  {!myBand&&nearby.length>0&&<div style={{fontSize:9,color:"#1d4ed8",marginTop:2}}>💡 কাছাকাছি: {nearby.map(n=>`${n.code} (${n.h}″)`).join(", ")}</div>}
                </div>
                <div style={{textAlign:"right",flexShrink:0,marginLeft:8}}>
                  <div style={{fontWeight:800,fontSize:13}}>{c.cft.toFixed(2)} CFT</div>
                  <div style={{fontSize:10,color:"#888"}}>{pct.toFixed(1)}%</div>
                  {trend&&<div style={{fontSize:10,fontWeight:700,color:trend.color,marginTop:1}}>{trend.label}</div>}
                </div>
              </div>
              {!c.isSplit&&top4.length>0&&<div style={{marginTop:7}}>
                <div style={{fontSize:8,color:"#999",marginBottom:3}}>ওসার (L) অনুযায়ী ভাগ:</div>
                <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden",background:"#f0f0f0"}}>
                  {top4.map((t,ti)=><div key={t.len} style={{width:`${t.pct}%`,background:BAR_COLORS[ti]}}></div>)}
                  {otherPct>0&&<div style={{width:`${otherPct}%`,background:BAR_COLORS[4]}}></div>}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
                  {top4.map((t,ti)=><span key={t.len} style={{fontSize:8,color:"#666",display:"flex",alignItems:"center",gap:3}}><span style={{width:7,height:7,borderRadius:"50%",background:BAR_COLORS[ti],display:"inline-block"}}></span>{t.len}″ {t.pct.toFixed(0)}%</span>)}
                  {otherPct>0&&<span style={{fontSize:8,color:"#666",display:"flex",alignItems:"center",gap:3}}><span style={{width:7,height:7,borderRadius:"50%",background:BAR_COLORS[4],display:"inline-block"}}></span>অন্যান্য {otherPct.toFixed(0)}%</span>}
                </div>
              </div>}
              <div className="no-print" style={{marginTop:8,display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                {!c.isSplit&&<button onClick={()=>{
                  const opening=!isEditingBand;
                  setEditingBandFor(opening?c.code:null);
                  if(opening&&myBand)setBandDraft({...bandDraft,[c.code]:{from:String(myBand.from),to:String(myBand.to)}});
                }} style={{background:"#eff6ff",color:"#1d4ed8",border:"1px solid #bfdbfe",borderRadius:7,padding:"5px 11px",fontSize:10,fontWeight:700}}>{isEditingBand?"বন্ধ করুন":myBand?"✏️ রেঞ্জ এডিট করুন":"📏 হাইট রেঞ্জ"}</button>}
                {showSplitSuggestion&&<>
                  <button onClick={approveSplit} style={{background:"#f0fdfa",color:"#0d9488",border:"1px solid #99f6e4",borderRadius:7,padding:"8px 11px",minHeight:36,fontSize:10,fontWeight:700}}>+ আলাদা র‍্যাক করুন</button>
                  <span style={{fontSize:8,color:"#999",lineHeight:1.4}}>{domL.pct.toFixed(0)}%-ই {domL.len}″ ওসার</span>
                </>}
              </div>
              {isEditingBand&&<div className="no-print" style={{marginTop:8,background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"9px 10px"}} onClick={e=>e.stopPropagation()}>
                <div style={{fontSize:9,color:"#3b5a9a",marginBottom:7,lineHeight:1.5}}>এই কোডে ({WOOD[c.wood]?.bn}, {c.w}″ চওড়া) কোন হাইট থেকে কোন হাইট পর্যন্ত একসাথে রাখবেন? রেঞ্জের মধ্যে এই কার্ডের নিজের {c.h}″ থাকতে হবে — কোডে {c.h}″-ই থাকবে।</div>
                <div style={{display:"flex",gap:5,alignItems:"flex-end"}}>
                  <div style={{flex:1}}><div style={{fontSize:8,color:"#3b5a9a",marginBottom:2}}>সর্বনিম্ন (″)</div><input type="number" value={bd.from||""} onChange={e=>setBandDraft({...bandDraft,[c.code]:{...bd,from:e.target.value}})} placeholder={String(c.h-3)} style={{width:"100%",border:"1px solid #bfdbfe",borderRadius:6,padding:"7px 6px",fontSize:11,boxSizing:"border-box",outline:"none"}}/></div>
                  <div style={{flex:1}}><div style={{fontSize:8,color:"#3b5a9a",marginBottom:2}}>সর্বোচ্চ (″)</div><input type="number" value={bd.to||""} onChange={e=>setBandDraft({...bandDraft,[c.code]:{...bd,to:e.target.value}})} placeholder={String(c.h+3)} style={{width:"100%",border:"1px solid #bfdbfe",borderRadius:6,padding:"7px 6px",fontSize:11,boxSizing:"border-box",outline:"none"}}/></div>
                  <button onClick={saveBand} disabled={!!bandConflict||!bandPreview} style={{background:(bandConflict||!bandPreview)?"#ccc":"#1d4ed8",color:"white",border:"none",borderRadius:6,padding:"9px 12px",fontSize:10,fontWeight:700,flexShrink:0}}>✓ সেট করুন</button>
                </div>
                {bandConflict&&<div style={{marginTop:6,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:6,padding:"6px 8px",fontSize:9,color:RED,fontWeight:600}}>⚠️ {bandConflict}</div>}
                {bandPreview&&<div style={{marginTop:6,background:"white",borderRadius:6,padding:"7px 9px",fontSize:9,color:"#555"}}>
                  <span style={{fontWeight:700,color:"#166534"}}>মিশে যাবে: </span>
                  {bandPreview.list.map(o=>`${o.code} (${o.h}″, ${o.cft.toFixed(2)} CFT)`).join(", ")}
                  <div style={{fontWeight:700,marginTop:3}}>→ নতুন মোট {bandPreview.cft.toFixed(2)} CFT, র‍্যাক {bandPreview.racks}টি {bandPreview.list.length>1&&<span style={{color:"#166534"}}>({bandPreview.list.reduce((s,o)=>s+Math.max(1,Math.ceil(o.cft/rackCapacity)),0)-bandPreview.racks}টি সাশ্রয়)</span>}</div>
                </div>}
              </div>}
              {isExpanded&&<div className="no-print" style={{marginTop:9,paddingTop:9,borderTop:"1px dashed #ddd"}} onClick={e=>e.stopPropagation()}>
                {myBand&&mergedH.length>1&&<div style={{marginBottom:9}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#1d4ed8",marginBottom:5}}>এই কোডে যেসব হাইট মিশেছে</div>
                  {mergedH.map(m=><div key={m.h} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0"}}>
                    <span>{m.h}″ হাইট</span><span style={{fontWeight:700}}>{m.cft.toFixed(2)} CFT</span>
                  </div>)}
                </div>}
                <div style={{fontSize:10,fontWeight:700,color:wc.accent,marginBottom:5}}>ওসার (L) অনুযায়ী সম্পূর্ণ ভাঙন — স'মিলে কাটানোর জন্য</div>
                {lengthEntries.map(en=><div key={en.len} style={{display:"flex",justifyContent:"space-between",fontSize:11,padding:"3px 0"}}>
                  <span>{en.len}″ ওসার</span><span style={{fontWeight:700}}>{en.pieces} পিস · {en.cft.toFixed(2)} CFT ({en.pct.toFixed(0)}%)</span>
                </div>)}
              </div>}
            </div>
          })}
          <button className="no-print" onClick={()=>setView("list")} style={{width:"100%",background:"#f3f4f6",border:"none",borderRadius:10,padding:"12px",fontSize:13,fontWeight:600,marginTop:8}}>← তালিকায় ফিরে যান</button>
        </div>
      })()}

      {view==="new"&&<div style={{background:"white",borderRadius:13,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>নতুন কাঠের লট</div>
        {lbl("কাঠের ধরন")}
        <select value={newLot.woodType} onChange={e=>setNewLot({...newLot,woodType:e.target.value})} style={{...inp,marginBottom:10}}>
          {Object.entries(WOOD).map(([k,v])=><option key={k} value={k}>{v.bn} ({v.en})</option>)}
        </select>
        {lbl("ক্রয়ের তারিখ")}<div style={{marginBottom:10}}><DateInput value={newLot.date} onChange={v=>setNewLot({...newLot,date:v})} accent="#065f46"/></div>
        {lbl("বিক্রেতার নাম *")}<input value={newLot.supplier} onChange={e=>setNewLot({...newLot,supplier:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ফোন")}<input value={newLot.supplierPhone} onChange={e=>setNewLot({...newLot,supplierPhone:e.target.value})} style={{...inp,marginBottom:10}}/>
        {lbl("বিক্রেতার ঠিকানা")}<input value={newLot.supplierAddress} onChange={e=>setNewLot({...newLot,supplierAddress:e.target.value})} style={{...inp,marginBottom:14}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setView("list")} style={{flex:1,background:"#f3f4f6",border:"none",borderRadius:9,padding:"12px",fontSize:13}}>বাতিল</button>
          <button onClick={createLot} disabled={!newLot.supplier} style={{flex:2,background:newLot.supplier?"#065f46":"#ccc",color:"white",border:"none",borderRadius:9,padding:"12px",fontSize:13,fontWeight:700}}>লট তৈরি করুন → গুড়ি যোগ করুন</button>
        </div>
      </div>}

      {view==="detail"&&selLot&&<>
        <div style={{background:"white",borderRadius:12,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 14px",marginBottom:8}}>
            <IR l="কাঠের ধরন" v={WOOD[selLot.woodType].bn}/><IR l="তারিখ" v={fmtDate(selLot.date)}/>
            <IR l="বিক্রেতা" v={selLot.supplier}/><IR l="ফোন" v={selLot.supplierPhone}/>
          </div>
          <IR l="ঠিকানা" v={selLot.supplierAddress}/>
          <button onClick={()=>deleteLot(selLot.id)} style={{background:"#fee2e2",border:"none",borderRadius:7,padding:"6px 12px",color:RED,fontSize:11,fontWeight:600,marginTop:8}}>🗑 লট মুছে ফেলুন</button>
        </div>

        {/* Logs list */}
        <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>গুড়ির তালিকা ({selLot.logs.length})</div>
        <div style={{background:"white",borderRadius:11,overflow:"hidden",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          {selLot.logs.length===0?<div style={{textAlign:"center",color:"#aaa",padding:16,fontSize:12}}>এখনো কোনো গুড়ি যোগ করা হয়নি</div>:
          selLot.logs.map((log,i)=>{
            const label=`#${i+1} — ${log.lengthFt}ft × ${log.diameterIn}″`;
            const stateColor=log.sold?"#7c3aed":log.cut?"#94a3b8":"#065f46";
            return<div key={log.id} style={{padding:"10px 12px",borderBottom:i<selLot.logs.length-1?"1px solid #f2f2f2":"none",background:log.sold?"#f5f3ff":log.cut?"#fafafa":"white"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <div style={{flex:"1 1 auto",minWidth:140,color:(log.cut||log.sold)?"#999":"#222",textDecoration:(log.cut||log.sold)?"line-through":"none"}}>
                  <span style={{fontWeight:700,fontSize:13}}>#{i+1}</span> — লম্বা {log.lengthFt}ft × ব্যাস {log.diameterIn}″ = <strong>{log.cft.toFixed(3)} CFT</strong>
                  {log.cut&&log.cutDate&&<span style={{fontSize:10,marginLeft:6}}>(কাটা: {fmtDate(log.cutDate)})</span>}
                  {log.sold&&<span style={{fontSize:10,marginLeft:6,color:"#7c3aed",fontWeight:700}}>(বিক্রি: {money(log.soldPrice)}, {fmtDate(log.soldDate)})</span>}
                </div>
                <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
                  {!log.sold&&<button onClick={()=>toggleCut(log.id,label,log.cut)} title="কাটা হয়েছে" style={{width:26,height:26,borderRadius:"50%",border:`2px solid ${log.cut?"#16a34a":"#ccc"}`,background:log.cut?"#16a34a":"white",color:"white",fontSize:13,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{log.cut?"✓":""}</button>}
                  {!log.cut&&!log.sold&&<button onClick={()=>startSell(log.id)} style={{background:"#f5f3ff",border:"1px solid #ddd6fe",color:"#7c3aed",borderRadius:6,padding:"5px 9px",fontSize:10,fontWeight:700}}>💰 বিক্রি</button>}
                  {log.sold&&<button onClick={()=>unsellLog(log.id,label)} style={{background:"#fef3c7",border:"1px solid #fde68a",color:"#92400e",borderRadius:6,padding:"5px 9px",fontSize:10,fontWeight:700}}>বিক্রি বাতিল</button>}
                  <button onClick={()=>removeLog(log.id,label)} style={{background:"#fee2e2",border:"none",borderRadius:6,padding:"5px 9px",color:RED,fontSize:11}}>✕</button>
                </div>
              </div>
              {sellingLogId===log.id&&<div style={{marginTop:8,background:"#f5f3ff",borderRadius:8,padding:9,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                <input type="number" autoFocus value={sellPrice} onChange={e=>setSellPrice(e.target.value)} placeholder="বিক্রয় মূল্য (৳)" style={{flex:"1 1 140px",border:"1px solid #ddd6fe",borderRadius:7,padding:"7px 9px",fontSize:12,outline:"none"}}/>
                <button onClick={()=>confirmSell(log.id)} style={{background:"#7c3aed",color:"white",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12,fontWeight:700}}>নিশ্চিত করুন</button>
                <button onClick={()=>setSellingLogId(null)} style={{background:"#f3f4f6",border:"none",borderRadius:7,padding:"7px 12px",fontSize:12}}>বাতিল</button>
              </div>}
            </div>
          })}
        </div>
        <div style={{background:"white",borderRadius:11,padding:12,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>নতুন গুড়ি যোগ করুন</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,alignItems:"end"}}>
            <div>{lbl("দৈর্ঘ্য (ফুট)")}<input type="number" step="0.5" value={newLog.lengthFt} onChange={e=>setNewLog({...newLog,lengthFt:e.target.value})} style={inp}/></div>
            <div>{lbl("ব্যাস (ইঞ্চি)")}<input type="number" step="0.5" value={newLog.diameterIn} onChange={e=>setNewLog({...newLog,diameterIn:e.target.value})} style={inp}/></div>
            <button onClick={addLog} style={{background:"#065f46",color:"white",border:"none",borderRadius:9,padding:"11px 16px",fontSize:13,fontWeight:700}}>+ যোগ</button>
          </div>
          {newLog.lengthFt&&newLog.diameterIn&&<div style={{marginTop:8,fontSize:12,color:"#166534",fontWeight:600}}>CFT হবে: {cftLog(parseFloat(newLog.lengthFt)||0,parseFloat(newLog.diameterIn)||0).toFixed(3)}</div>}
        </div>

        {/* Rate & Cost */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:8,color:"#065f46"}}>মূল্য নির্ধারণ</div>
          <div style={{marginBottom:10}}>{lbl("প্রতি CFT রেট (৳)")}<input type="number" value={selLot.ratePerCft} onChange={e=>updateLot({...selLot,ratePerCft:e.target.value})} style={inp}/></div>
          <div style={{background:"#f0fdf4",borderRadius:9,padding:"10px 12px"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>মোট CFT:</span><span style={{fontWeight:700}}>{lotTotalCft(selLot).toFixed(3)}</span></div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:800,color:"#166534"}}><span>মোট মূল্য:</span><span>{money(lotTotalCost(selLot))}</span></div>
          </div>
        </div>

        {/* Milling / সেমিল কাটাই খরচ */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>
          <div style={{fontWeight:700,fontSize:12,marginBottom:4,color:"#065f46"}}>স'মিল কাটাই খরচ (দফায় দফায়)</div>

        </div>

        {/* Payments */}
        <div style={{background:"white",borderRadius:11,padding:14,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.07)"}}>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:8,marginTop:8,alignItems:"end"}}>

            <button onClick={addPayment} style={{background:"#16a34a",color:"white",border:"none",borderRadius:8,padding:"9px 14px",fontSize:12,fontWeight:700}}>+ যোগ</button>
